          iproute2 позволяет задавать namespace-specific варианты файлов из
          `/etc/netns/<name>`. Такой способ не меняет глобальный `/etc/hosts`
          хоста и подходит для минимального локального сопоставления имени.

          Критерий этапа — не наличие строки в файле, а успешный запрос client
