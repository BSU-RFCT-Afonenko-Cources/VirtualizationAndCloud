          ./post-step.bash
        hints: |-
          Запись состояния в `cgroup.freeze` останавливает выполнение задач всей
          cgroup. Процессы остаются существовать, их память остаётся в RAM, а
          `cgroup.events` сообщает, достигнуто ли состояние `frozen`.

          Это не checkpoint: содержимое адресного пространства не сериализуется на
          диск, а после перезагрузки состояние исчезнет. Freezer удобен для
          согласованной паузы, но не заменяет CRIU или snapshot VM.

          Проверяемый опыт использует живой счётчик: значение растёт до freeze,
          остаётся неизменным во время подтверждённой заморозки и снова растёт
          после thaw.
