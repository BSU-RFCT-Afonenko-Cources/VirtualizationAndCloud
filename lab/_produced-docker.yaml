        hints: |-
          Cpuset задаёт набор CPU и NUMA memory nodes, на которых задачи имеют
          право выполняться. Это placement-ограничение: планировщик не размещает
          процесс вне разрешённого набора, даже если там есть свободная мощность.

          Quota отвечает на вопрос «сколько CPU-времени», а cpuset — «на каких
          CPU». Эффективные наборы читаются из `cpuset.cpus.effective` и
          `cpuset.mems.effective`, поскольку наследование может сделать
          настроенное значение уже родительского.

