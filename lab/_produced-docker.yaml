          `pids.max` ограничивает создание новых задач независимо от доступной
          памяти и CPU, поэтому закрывает отдельный класс отказов — исчерпание
          process table.

          При достижении лимита системный вызов создания процесса возвращает
          ошибку. Текущая загрузка видна в `pids.current`, а попытки превысить
          предел учитываются в `pids.events`.

          Безопасный fork-test должен иметь собственный предел времени, завершать
          созданных потомков и оставлять хост без runaway-процессов.
    description: |-
