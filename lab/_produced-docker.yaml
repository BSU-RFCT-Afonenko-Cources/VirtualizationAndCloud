          активными объектами топологии.
    description: |-
      #### Упражнение 1 (Очистка топологии)

      Удалите сервисы `edge`, `api` и `db`, дождитесь удаления их задач, затем
      удалите overlay-сети `lab-front` и `lab-back`.

      После очистки не должно остаться сервисов лаборатории с меткой
      `course.lab=swarm-networking`, сервисов с указанными именами и сетей,
      имя которых начинается с `lab-`. Рабочие JSON-файлы и подготовленные
      локальные образы удалять не требуется.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 10
- title: Swarm placement constraints, reservations и ресурсное управление
  description: |-
    Лабораторная работа показывает, как Docker Swarm принимает решения о
    размещении задач на основе меток узлов, ограничений placement и
    объявленных ресурсов. В ходе работы создаются два типа полезной
    нагрузки: HTTP API и worker-задачи.
  time-limit-minutes: 90
  steps:
  - title: Node labels
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.sh	---
          cat <<'EOF' > prepare.sh
          #!/usr/bin/env bash
          set -euo pipefail

          LAB_DIR=/home/ubuntu/swarm-resources
          API_DIR=/home/ubuntu/swarm-resources/images/api
          WORKER_DIR=/home/ubuntu/swarm-resources/images/worker
          RESULTS_DIR=/home/ubuntu/swarm-resources/results
          EVIDENCE_DIR=/home/ubuntu/swarm-resources/evidence

          command -v docker >/dev/null
          command -v curl >/dev/null
          command -v jq >/dev/null
          systemctl is-active --quiet docker

          install -d -o ubuntu -g ubuntu /home/ubuntu/swarm-resources
          install -d -o ubuntu -g ubuntu /home/ubuntu/swarm-resources/images
          install -d -o ubuntu -g ubuntu "$API_DIR" "$WORKER_DIR" "$RESULTS_DIR" "$EVIDENCE_DIR"

          cat > "$API_DIR/app.py" <<'PYAPP'
          import json
          import os
          import socket
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = json.dumps({
                      "service": "swarm-resources-api",
                      "hostname": socket.gethostname(),
                      "path": self.path,
                      "status": "ok",
                  }).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, fmt, *args):
                  print(fmt % args, flush=True)

          ThreadingHTTPServer(("0.0.0.0", int(os.getenv("PORT", "8080"))), Handler).serve_forever()
          PYAPP

          cat > "$API_DIR/Dockerfile" <<'DOCKERFILE'
          FROM python:3.12-alpine
          WORKDIR /app
          COPY app.py /app/app.py
          USER 65532:65532
          EXPOSE 8080
          CMD ["python", "/app/app.py"]
          DOCKERFILE

          cat > "$WORKER_DIR/worker.py" <<'PYWORKER'
          import json
          import os
          import socket
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          mode = sys.argv[1] if len(sys.argv) > 1 else "serve"
          if mode == "serve":
              print(json.dumps({"event": "worker_started", "hostname": socket.gethostname()}), flush=True)
              while True:
                  digest = sum(i * i for i in range(25000))
                  print(json.dumps({"event": "batch_processed", "digest": digest}), flush=True)
                  time.sleep(15)
          elif mode == "job":
              slot = os.getenv("TASK_SLOT", "unknown")
              task_id = os.getenv("TASK_ID", "unknown")
              output = {
                  "service": "lab-worker-job",
                  "task_slot": slot,
                  "task_id": task_id,
                  "hostname": socket.gethostname(),
                  "records_processed": 1000 + int(slot),
                  "completed_at": datetime.now(timezone.utc).isoformat(),
              }
              target = Path("/results") / f"worker-{slot}.json"
              target.write_text(json.dumps(output, indent=2) + "\n")
              print(json.dumps(output), flush=True)
          else:
              raise SystemExit(f"unsupported mode: {mode}")
          PYWORKER

          cat > "$WORKER_DIR/Dockerfile" <<'DOCKERFILE'
          FROM python:3.12-alpine
          WORKDIR /app
          COPY worker.py /app/worker.py
          ENTRYPOINT ["python", "/app/worker.py"]
          CMD ["serve"]
          DOCKERFILE

          chown -R ubuntu:ubuntu /home/ubuntu/swarm-resources

          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = inactive ]; then
              manager_addr=$(hostname -I | awk '{print $1}')
              [ -n "$manager_addr" ]
              docker swarm init --advertise-addr "$manager_addr" >/dev/null
          fi
          [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = active ]
          [ "$(docker info --format '{{.Swarm.ControlAvailable}}')" = true ]

          docker build --quiet --tag swarm-resources-api:lab "$API_DIR" >/dev/null
          docker build --quiet --tag swarm-resources-worker:lab "$WORKER_DIR" >/dev/null

          for service in lab-api lab-worker lab-worker-job lab-overcommit; do
              if docker service inspect "$service" >/dev/null 2>&1; then
                  docker service rm "$service" >/dev/null
              fi
          done
          manager_id=$(docker node inspect self --format '{{.ID}}')
          docker node update --label-rm swarm_resources "$manager_id" >/dev/null 2>&1 || true
          rm -f /home/ubuntu/swarm-resources/results/worker-*.json
          rm -f /home/ubuntu/swarm-resources/evidence/overcommit-pending.json
          EOF
          trap 'rm -f prepare.sh' EXIT


          # ----------RUN----------
          chmod u+x prepare.sh
          ./prepare.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          value=$(docker node inspect self --format '{{ index .Spec.Labels "swarm_resources" }}')
          [ "$value" = true ] || { echo "label swarm_resources=true отсутствует" >&2; exit 1; }
          echo "node label swarm_resources=true найден"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          manager_id=$(docker node inspect self --format '{{.ID}}')
          docker node update --label-add swarm_resources=true "$manager_id" >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Docker Swarm хранит labels в спецификации узла. Scheduler рассматривает
          их как декларативные входные данные: label не запускает контейнер сам по
          себе, но позволяет сервисам выбирать узлы по назначению, зоне, типу
          оборудования или принадлежности лаборатории.

          Лабораторные labels следует именовать так, чтобы их можно было
          однозначно найти и удалить. Изменять labels узла может manager.
    description: |-
      Рабочий каталог лаборатории — `/home/ubuntu/swarm-resources`.

      #### Упражнение 1 (Лабораторная метка узла)

      Добавьте текущему manager-узлу label с ключом `swarm_resources` и
      значением `true`. Убедитесь средствами инспектирования Docker, что
      значение сохранено в спецификации именно этого узла.
  - title: Placement constraints
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          constraints=$(docker service inspect lab-api --format '{{json .Spec.TaskTemplate.Placement.Constraints}}')
          printf '%s' "$constraints" | jq -e 'index("node.labels.swarm_resources == true") != null' >/dev/null
          timeout 45 bash -c 'until [ "$(docker service ps lab-api --filter desired-state=running --format "{{.CurrentState}}" | awk '"'"'$1 == "Running" {n++} END {print n+0}'"'"')" -eq 1 ]; do sleep 1; done'
          node=$(docker service ps lab-api --filter desired-state=running --format '{{.Node}}' | head -n1)
          [ "$(docker node inspect "$node" --format '{{ index .Spec.Labels "swarm_resources" }}')" = true ]
          response=$(curl --fail --silent --retry 10 --retry-delay 1 http://127.0.0.1:18080/health)
          printf '%s' "$response" | jq -e '.service == "swarm-resources-api" and .status == "ok"' >/dev/null
          echo "constraint, running task и API endpoint проверены"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          if docker service inspect lab-api >/dev/null 2>&1; then docker service rm lab-api >/dev/null; fi
          docker service create --quiet --name lab-api --constraint 'node.labels.swarm_resources == true' --replicas 1 --publish published=18080,target=8080,mode=ingress swarm-resources-api:lab >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Placement constraint задаёт обязательное условие допуска узла. При
          создании или восстановлении задачи scheduler сопоставляет constraint
          сервиса с атрибутами и labels доступных узлов. Если подходящего узла
          нет, desired state задачи сохраняется, но контейнер не запускается.

          Для stateless API constraint фиксирует допустимую группу узлов, а число
          реплик остаётся независимым параметром сервиса.
    description: |-
      #### Упражнение 1 (Размещение API)

      Создайте Swarm service `lab-api` из образа `swarm-resources-api:lab` с
      одной репликой. Задайте constraint, допускающий только узел с label
      `swarm_resources=true`, и опубликуйте API на порту `18080` узла с
      целевым портом `8080`.

      Результат считается готовым, когда constraint присутствует в
      спецификации, задача работает на размеченном узле, а endpoint возвращает
      JSON со значениями `service: swarm-resources-api` и `status: ok`.
  - title: Resource reservations
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          read -r cpu memory < <(docker service inspect lab-worker --format '{{.Spec.TaskTemplate.Resources.Reservations.NanoCPUs}} {{.Spec.TaskTemplate.Resources.Reservations.MemoryBytes}}')
          [ "$cpu" -eq 250000000 ] || { echo "reservation CPU должна быть 0.25" >&2; exit 1; }
          [ "$memory" -eq 134217728 ] || { echo "reservation memory должна быть 128 MiB" >&2; exit 1; }
          timeout 45 bash -c 'until [ "$(docker service ps lab-worker --filter desired-state=running --format "{{.CurrentState}}" | awk '"'"'$1 == "Running" {n++} END {print n+0}'"'"')" -eq 1 ]; do sleep 1; done'
          timeout 25 bash -c 'until docker service logs lab-worker 2>&1 | grep -q batch_processed; do sleep 1; done'
          echo "reservations и работа worker проверены"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          if docker service inspect lab-worker >/dev/null 2>&1; then docker service rm lab-worker >/dev/null; fi
          docker service create --quiet --name lab-worker --constraint 'node.labels.swarm_resources == true' --replicas 1 --reserve-cpu 0.25 --reserve-memory 128M swarm-resources-worker:lab >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Reservation — это объём CPU и памяти, который scheduler обязан учесть до
          размещения задачи. Значение не означает постоянное потребление ресурса,
          но уменьшает доступную для последующих задач планировочную ёмкость узла.

          Reservations особенно важны для worker-нагрузки: несколько фоновых
          обработчиков могут конкурировать за один узел даже тогда, когда их
          текущее потребление невелико.
    description: |-
      #### Упражнение 1 (Резервирование ресурсов worker)

      Создайте replicated service `lab-worker` из образа
      `swarm-resources-worker:lab` с одной репликой и тем же constraint по
      лабораторному label. Объявите reservation в размере `0.25` CPU и
      `128 MiB` памяти.

      Проверьте, что значения записаны в `Resources.Reservations`, а worker
      имеет работающую задачу и создаёт записи о пакетной обработке в логах
      сервиса.
  - title: Resource limits
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          inspect=$(docker service inspect lab-worker --format '{{json .Spec.TaskTemplate.Resources}}')
          printf '%s' "$inspect" | jq -e '.Reservations.NanoCPUs == 250000000 and .Reservations.MemoryBytes == 134217728 and .Limits.NanoCPUs == 500000000 and .Limits.MemoryBytes == 268435456' >/dev/null
          constraints=$(docker service inspect lab-worker --format '{{json .Spec.TaskTemplate.Placement.Constraints}}')
          printf '%s' "$constraints" | jq -e 'index("node.labels.swarm_resources == true") != null' >/dev/null
          [ "$(docker service inspect lab-worker --format '{{.Spec.Mode.Replicated.Replicas}}')" -eq 1 ]
          timeout 45 bash -c 'until [ "$(docker service ps lab-worker --filter desired-state=running --format "{{.CurrentState}}" | awk '"'"'$1 == "Running" {n++} END {print n+0}'"'"')" -eq 1 ]; do sleep 1; done'
          echo "limits, reservations и running state проверены"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          docker service update --quiet --limit-cpu 0.50 --limit-memory 256M lab-worker >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Limit действует уже после запуска контейнера. CPU limit ограничивает
          долю процессорного времени, а memory limit задаёт верхнюю границу памяти
          для runtime. В отличие от reservation, limit не обещает scheduler
          наличие ресурса и не резервирует capacity.

          Обычно reservation описывает минимально необходимую ёмкость, а limit
          защищает узел и соседние задачи от чрезмерного потребления.
    description: |-
      #### Упражнение 1 (Ограничения worker)

      Обновите `lab-worker`: установите limits `0.50` CPU и `256 MiB` памяти,
      не изменяя ранее заданные reservations, constraint и число реплик.

      После обновления дождитесь стабильной работающей задачи. Проверка
      сопоставит обе секции ресурсов и состояние сервиса.
  - title: Replicated job pattern
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          mode=$(docker service inspect lab-worker-job --format '{{json .Spec.Mode.ReplicatedJob}}')
          [ "$mode" != null ]
          timeout 60 bash -c 'until [ "$(docker service ps lab-worker-job --format "{{.CurrentState}}" | awk '\''$1 == "Complete" {n++} END {print n+0}'\'')" -eq 3 ]; do sleep 1; done'
          for slot in 1 2 3; do
              file="/home/ubuntu/swarm-resources/results/worker-${slot}.json"
              [ -f "$file" ]
              jq -e --arg slot "$slot" '.service == "lab-worker-job" and .task_slot == $slot and (.task_id | length > 5) and .records_processed == (1000 + ($slot | tonumber))' "$file" >/dev/null
          done
          log_count=$(docker service logs lab-worker-job 2>&1 | grep -c '"service": "lab-worker-job"' || true)
          [ "$log_count" -ge 3 ] || { echo "в логах недостаточно результатов job" >&2; exit 1; }
          echo "replicated job, логи и три JSON-результата проверены"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          rm -f /home/ubuntu/swarm-resources/results/worker-*.json
          if docker service inspect lab-worker-job >/dev/null 2>&1; then docker service rm lab-worker-job >/dev/null; fi
          docker service create --quiet --name lab-worker-job --mode replicated-job --replicas 3 --max-concurrent 1 --constraint 'node.labels.swarm_resources == true' --env 'TASK_SLOT={{.Task.Slot}}' --env 'TASK_ID={{.Task.ID}}' --mount type=bind,src=/home/ubuntu/swarm-resources/results,dst=/results swarm-resources-worker:lab job >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          HTTP-сервис должен оставаться доступным, поэтому его нормальное
          состояние — работающие реплики. Batch-задача, напротив, должна выполнить
          конечную работу и завершиться успешно. Режим replicated job создаёт
          заданное число задач и считает успешное завершение ожидаемым
          результатом, а не сбоем.

          Результат worker-задачи должен быть устойчивее жизненного цикла
          контейнера. В этой работе каждая задача сохраняет структурированный JSON
          в общий каталог результатов.
    description: |-
      #### Упражнение 1 (Конечная worker-нагрузка)

      Создайте service `lab-worker-job` в режиме replicated job из образа
      `swarm-resources-worker:lab`. Запустите три задачи, но не более одной
      одновременно. Передайте worker режим `job`, примените constraint
      `swarm_resources=true` и подключите каталог
      `/home/ubuntu/swarm-resources/results` как `/results`.

      Передайте каждой задаче её slot и идентификатор через поддерживаемые
      Swarm шаблоны переменных `TASK_SLOT` и `TASK_ID`. Итогом должны стать
      три JSON-файла `worker-1.json` … `worker-3.json`, три успешно
      завершённые задачи и JSON-сообщения в логах сервиса.
  - title: Overcommit experiment
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/swarm-resources/evidence/overcommit-pending.json
          [ -f "$EVIDENCE" ]
          jq -e '.service == "lab-overcommit" and .desired_state == "Running" and (.current_state | startswith("Pending")) and (.error | ascii_downcase | contains("insufficient resources"))' "$EVIDENCE" >/dev/null
          read -r cpu memory < <(docker service inspect lab-overcommit --format '{{.Spec.TaskTemplate.Resources.Reservations.NanoCPUs}} {{.Spec.TaskTemplate.Resources.Reservations.MemoryBytes}}')
          [ "$cpu" -eq 50000000 ]
          [ "$memory" -eq 33554432 ]
          timeout 45 bash -c 'until [ "$(docker service ps lab-overcommit --filter desired-state=running --format "{{.CurrentState}}" | awk '"'"'$1 == "Running" {n++} END {print n+0}'"'"')" -eq 1 ]; do sleep 1; done'
          echo "pending evidence и восстановление scheduling проверены"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/swarm-resources/evidence/overcommit-pending.json
          if docker service inspect lab-overcommit >/dev/null 2>&1; then docker service rm lab-overcommit >/dev/null; fi
          docker service create --quiet --name lab-overcommit --constraint 'node.labels.swarm_resources == true' --replicas 1 --reserve-cpu 1000 --reserve-memory 1T swarm-resources-worker:lab >/dev/null

          timeout 30 bash -c 'until docker service ps lab-overcommit --no-trunc --format "{{.CurrentState}} {{.Error}}" | grep -qi "Pending.*insufficient resources"; do sleep 1; done'
          line=$(docker service ps lab-overcommit --no-trunc --format '{{json .}}' | head -n1)
          printf '%s\n' "$line" | jq '{service: "lab-overcommit", desired_state: .DesiredState, current_state: .CurrentState, error: .Error}' > "$EVIDENCE"
          chown ubuntu:ubuntu "$EVIDENCE"
          docker service update --quiet --reserve-cpu 0.05 --reserve-memory 32M lab-overcommit >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Scheduler сравнивает reservations задачи с доступной ёмкостью допустимых
          узлов. Если запрос заведомо невозможен, Swarm сохраняет desired state
          `Running`, но задача остаётся в состоянии ожидания: это означает
          намерение системы запустить её, когда появится capacity.

          После уменьшения reservation scheduler повторно оценивает задачу. Такой
          переход позволяет отличить декларативное желаемое состояние от текущего
          фактического состояния.
    description: |-
      #### Упражнение 1 (Управляемое ожидание и восстановление)

      Создайте однорепличный service `lab-overcommit` из worker-образа с
      лабораторным constraint и заведомо невозможными reservations: `1000` CPU
      и `1 TiB` памяти. Пока задача ожидает размещения, сохраните файл
      `/home/ubuntu/swarm-resources/evidence/overcommit-pending.json` со
      следующими полями, полученными из состояния задачи: `service`,
      `desired_state`, `current_state`, `error`. Значения должны подтверждать
      service `lab-overcommit`, desired state `Running`, текущее состояние
      `Pending` и ошибку нехватки ресурсов.

      Затем уменьшите reservations до `0.05` CPU и `32 MiB` памяти. Финальное
      состояние — одна работающая задача при сохранённом evidence исходного
      pending-сценария.
  - title: Cleanup labels
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          for service in lab-api lab-worker lab-worker-job lab-overcommit; do
              if docker service inspect "$service" >/dev/null 2>&1; then
                  echo "service $service всё ещё существует" >&2
                  exit 1
              fi
          done
          value=$(docker node inspect self --format '{{ index .Spec.Labels "swarm_resources" }}')
          [ -z "$value" ] || { echo "label swarm_resources не удалён" >&2; exit 1; }
          [ -f /home/ubuntu/swarm-resources/evidence/overcommit-pending.json ]
          for slot in 1 2 3; do [ -f "/home/ubuntu/swarm-resources/results/worker-${slot}.json" ]; done
          echo "services и lab label удалены; evidence сохранены"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          for service in lab-api lab-worker lab-worker-job lab-overcommit; do
              if docker service inspect "$service" >/dev/null 2>&1; then
                  docker service rm "$service" >/dev/null
              fi
          done
          manager_id=$(docker node inspect self --format '{{.ID}}')
          docker node update --label-rm swarm_resources "$manager_id" >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Временные labels влияют на будущие решения scheduler и поэтому являются
          частью состояния кластера, которую нужно очищать. Удаление только
          контейнера недостаточно: Swarm services могут восстановить задачи, а
          labels продолжат удовлетворять чужим constraints.

          Корректное завершение лаборатории удаляет созданные services и
          лабораторный label, не затрагивая остальные объекты кластера.
    description: |-
      #### Упражнение 1 (Очистка состояния Swarm)

      Удалите services `lab-api`, `lab-worker`, `lab-worker-job` и
      `lab-overcommit`. Затем удалите label `swarm_resources` с manager-узла.

      Файлы результатов и evidence оставьте в `/home/ubuntu/swarm-resources`:
      они не участвуют в scheduling и позволяют проверить выполненные
      эксперименты.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 11
- title: Docker Stack, secrets и configs в Swarm
  description: |-
    В лабораторной работе вы подготовите и развернёте Swarm stack `shop` из
    трёх сервисов: reverse proxy `web`, HTTP API `api` и PostgreSQL `db`.
    Чувствительные данные будут переданы через Swarm secret, конфигурация —
    через Swarm configs, а данные базы — через named volume.

    Работа выполняется пользователем `ubuntu` в каталоге
    `/home/ubuntu/shop`. Для успешного прохождения необходимо сохранять
    заданные имена Docker-объектов.
  time-limit-minutes: 180
  steps:
  - title: Модель Docker Stack
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.sh	---
          cat <<'EOF' > prepare.sh
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          mkdir -p /home/ubuntu/shop/config /home/ubuntu/shop/evidence /home/ubuntu/shop/src/api /home/ubuntu/shop/build
          chown -R ubuntu:ubuntu /home/ubuntu/shop

          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io curl python3
          fi

          systemctl enable --now docker >/dev/null 2>&1 || true
          if ! docker info --format '{{.Swarm.LocalNodeState}}' 2>/dev/null | grep -qx active; then
            docker swarm init --advertise-addr 127.0.0.1 >/dev/null 2>&1 || true
          fi

          cat > /home/ubuntu/shop/build/app.py <<'PY'
          import json
          import os
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import urlparse

          import psycopg2
          from psycopg2.extras import RealDictCursor

          APP_IMAGE_VERSION = os.environ.get("APP_IMAGE_VERSION", "v1")
          CONFIG_PATH = os.environ.get("APP_CONFIG", "/app/config.json")
          SECRET_PATH = os.environ.get("DB_PASSWORD_FILE", "/run/secrets/db_password")
          DB_HOST = os.environ.get("DB_HOST", "db")
          DB_NAME = os.environ.get("DB_NAME", "shop")
          DB_USER = os.environ.get("DB_USER", "shop_user")


          def read_config():
              with open(CONFIG_PATH, "r", encoding="utf-8") as handle:
                  return json.load(handle)


          def read_password():
              with open(SECRET_PATH, "r", encoding="utf-8") as handle:
                  return handle.read().strip()


          def connect():
              return psycopg2.connect(host=DB_HOST, dbname=DB_NAME, user=DB_USER, password=read_password())


          def ensure_schema():
              last_error = None
              for _ in range(30):
                  try:
                      with connect() as conn:
                          with conn.cursor() as cur:
                              cur.execute(
                                  """
                                  create table if not exists products (
                                    code text primary key,
                                    name text not null,
                                    price integer not null check (price > 0)
                                  )
                                  """
                              )
                      return
                  except Exception as exc:  # retry while PostgreSQL starts
                      last_error = exc
                      time.sleep(2)
              raise last_error


          def product(code):
              with connect() as conn:
                  with conn.cursor(cursor_factory=RealDictCursor) as cur:
                      cur.execute("select code, name, price from products where code = %s", (code,))
                      return cur.fetchone()


          def upsert_product(item):
              code = str(item.get("code", "")).strip()
              name = str(item.get("name", "")).strip()
              price = int(item.get("price", 0))
              if not code or not name or price <= 0:
                  raise ValueError("code, name and positive price are required")
              with connect() as conn:
                  with conn.cursor() as cur:
                      cur.execute(
                          """
                          insert into products(code, name, price) values (%s, %s, %s)
                          on conflict (code) do update set name = excluded.name, price = excluded.price
                          """,
                          (code, name, price),
                      )
              return product(code)


          class Handler(BaseHTTPRequestHandler):
              server_version = "shop-api"

              def json_response(self, status, payload):
                  body = json.dumps(payload, ensure_ascii=False, sort_keys=True).encode("utf-8")
                  self.send_response(status)
                  self.send_header("content-type", "application/json")
                  self.send_header("content-length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  path = urlparse(self.path).path
                  if path == "/health":
                      self.json_response(200, {"status": "ok"})
                      return
                  if path == "/version":
                      cfg = read_config()
                      self.json_response(200, {"app": cfg.get("app"), "version": cfg.get("version", APP_IMAGE_VERSION), "image": APP_IMAGE_VERSION, "rotated": bool(cfg.get("rotated", False))})
                      return
                  if path.startswith("/products/"):
                      item = product(path.rsplit("/", 1)[-1])
                      if item is None:
                          self.json_response(404, {"error": "not found"})
                      else:
                          self.json_response(200, dict(item))
                      return
                  self.json_response(404, {"error": "not found"})

              def do_POST(self):
                  path = urlparse(self.path).path
                  if path != "/products":
                      self.json_response(404, {"error": "not found"})
                      return
                  length = int(self.headers.get("content-length", "0"))
                  data = json.loads(self.rfile.read(length).decode("utf-8"))
                  try:
                      self.json_response(201, dict(upsert_product(data)))
                  except Exception as exc:
                      self.json_response(400, {"error": str(exc)})

              def log_message(self, fmt, *args):
                  print("%s - %s" % (self.address_string(), fmt % args), flush=True)


          if __name__ == "__main__":
              ensure_schema()
              ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
          PY

          cat > /home/ubuntu/shop/build/Dockerfile <<'DOCKER'
          FROM python:3.12-alpine
          ARG APP_IMAGE_VERSION=v1
          ENV APP_IMAGE_VERSION=${APP_IMAGE_VERSION} \
              PYTHONDONTWRITEBYTECODE=1 \
              PYTHONUNBUFFERED=1
          RUN apk add --no-cache libpq && pip install --no-cache-dir psycopg2-binary==2.9.9
          WORKDIR /app
          COPY app.py /app/app.py
          EXPOSE 8000
          HEALTHCHECK --interval=10s --timeout=3s --retries=6 CMD python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
          CMD ["python", "/app/app.py"]
          DOCKER

          docker build --build-arg APP_IMAGE_VERSION=v1 -t shop-api:v1 /home/ubuntu/shop/build >/dev/null
          docker build --build-arg APP_IMAGE_VERSION=v2 -t shop-api:v2 /home/ubuntu/shop/build >/dev/null
          docker pull nginx:1.27-alpine >/dev/null
          docker pull postgres:16-alpine >/dev/null

          chown -R ubuntu:ubuntu /home/ubuntu/shop
          EOF
          trap 'rm -f prepare.sh' EXIT


          # ----------RUN----------
          chmod u+x prepare.sh
          ./prepare.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          STACK=/home/ubuntu/shop/stack.yml
          fail(){ echo "Ошибка: $*" >&2; exit 1; }
          [ -f "$STACK" ] || fail "не найден $STACK"
          config=$(docker stack config -c "$STACK" 2>&1) || fail "stack.yml не проходит docker stack config: $config"
          for service in web api db; do
            printf '%s\n' "$config" | grep -Eq "^  ${service}:$" || fail "нет service $service"
          done
          printf '%s\n' "$config" | grep -q 'shop-api:v1' || fail "api должен использовать shop-api:v1"
          printf '%s\n' "$config" | grep -q 'nginx:1.27-alpine' || fail "не найден образ nginx"
          printf '%s\n' "$config" | grep -q 'postgres:16-alpine' || fail "не найден образ postgres"
          printf '%s\n' "$config" | grep -q 'published: 8080' || fail "web не публикует порт 8080"
          printf '%s\n' "$config" | grep -q 'driver: overlay' || fail "backend не является overlay-сетью"
          printf '%s\n' "$config" | grep -q 'name: shop_db_data' || fail "нет named volume shop_db_data"
          for object in shop_db_password_v1 shop_nginx_v1 shop_api_config_v1; do
            grep -q "$object" "$STACK" || fail "нет ссылки на $object"
          done
          if grep -Eiq '(^|[[:space:]])(POSTGRES_PASSWORD|DB_PASSWORD):[[:space:]]*[^/[:space:]]' "$STACK"; then
            fail "пароль обнаружен в environment"
          fi
          for service in web api db; do
            section=$(printf '%s\n' "$config" | sed -n "/^  ${service}:/,/^  [a-zA-Z0-9_-]*:/p")
            printf '%s\n' "$section" | grep -q 'healthcheck:' || fail "у $service нет healthcheck"
            printf '%s\n' "$section" | grep -q 'restart_policy:' || fail "у $service нет restart policy"
            printf '%s\n' "$section" | grep -q 'update_config:' || fail "у $service нет update policy"
          done
          echo "Stack model корректен"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p /home/ubuntu/shop/config /home/ubuntu/shop/evidence
          cat > /home/ubuntu/shop/stack.yml <<'YAML'
          version: "3.9"

          services:
            web:
              image: nginx:1.27-alpine
              ports:
                - target: 80
                  published: 8080
                  protocol: tcp
                  mode: ingress
              networks:
                - backend
              configs:
                - source: shop_nginx_v1
                  target: /etc/nginx/conf.d/default.conf
              deploy:
                replicas: 1
                restart_policy:
                  condition: on-failure
                update_config:
                  parallelism: 1
                  delay: 5s
                  order: start-first
              healthcheck:
                test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null"]
                interval: 10s
                timeout: 3s
                retries: 6

            api:
              image: shop-api:v1
              environment:
                DB_HOST: db
                DB_NAME: shop
                DB_USER: shop_user
                DB_PASSWORD_FILE: /run/secrets/db_password
                APP_CONFIG: /app/config.json
              networks:
                - backend
              secrets:
                - source: shop_db_password_v1
                  target: db_password
              configs:
                - source: shop_api_config_v1
                  target: /app/config.json
              deploy:
                replicas: 1
                restart_policy:
                  condition: on-failure
                update_config:
                  parallelism: 1
                  delay: 5s
                  order: start-first
                  failure_action: rollback
              healthcheck:
                test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\""]
                interval: 10s
                timeout: 3s
                retries: 6

            db:
              image: postgres:16-alpine
              environment:
                POSTGRES_DB: shop
                POSTGRES_USER: shop_user
                POSTGRES_PASSWORD_FILE: /run/secrets/db_password
              volumes:
                - db_data:/var/lib/postgresql/data
              networks:
                - backend
              secrets:
                - source: shop_db_password_v1
                  target: db_password
              deploy:
                replicas: 1
                restart_policy:
                  condition: on-failure
                update_config:
                  parallelism: 1
                  delay: 5s
                  order: stop-first
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U shop_user -d shop"]
                interval: 10s
                timeout: 3s
                retries: 10

          networks:
            backend:
              driver: overlay

          volumes:
            db_data:
              name: shop_db_data

          secrets:
            shop_db_password_v1:
              external: true

          configs:
            shop_nginx_v1:
              external: true
            shop_api_config_v1:
              external: true
          YAML
          chown -R ubuntu:ubuntu /home/ubuntu/shop
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Docker Stack описывает несколько взаимосвязанных Swarm services одним
          Compose-совместимым файлом. Файл задаёт **желаемое состояние**: образы,
          сети, mounts, secrets, configs, число реплик, health checks и политику
          обновления. Команда развёртывания преобразует эту модель в Swarm
          services и tasks.

          Stack добавляет к создаваемым объектам namespace. Например, сервис `api`
          в stack `shop` получает имя `shop_api`. Для объектов, объявленных как
          `external`, имя не меняется: они должны существовать до deployment.

          В этой работе frontend-proxy `web` публикует TCP-порт `8080`, `api`
          обращается к `db` по overlay-сети, а база хранит данные в named volume.
          Secret и configs объявляются внешними, чтобы их жизненный цикл можно
          было контролировать отдельно от stack.
    description: |-
      #### Упражнение 1 (Подготовьте модель stack)

      В каталоге `/home/ubuntu/shop` создайте Compose-совместимый stack-файл
      `stack.yml` для stack `shop`.

      Модель должна описывать сервисы `web`, `api`, `db`, overlay-сеть
      `backend` и named volume `db_data`. Используйте подготовленные локальные
      образы `shop-api:v1`, `nginx:1.27-alpine` и `postgres:16-alpine`.
      Опубликуйте `web` на порту `8080` в режиме ingress.

      Объявите внешние объекты `shop_db_password_v1`, `shop_nginx_v1` и
      `shop_api_config_v1`. Подключите secret к `api` и `db`, nginx-config — к
      `web`, API-config — к `api`. Для всех сервисов задайте по одной реплике,
      restart policy, update policy и health check. Пароль не должен
      находиться в environment stack-файла.

      Проверяемый результат — валидная декларативная модель; разворачивать
      stack на этом шаге не нужно.
  - title: Создание Swarm secret
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          fail(){ echo "Ошибка: $*" >&2; exit 1; }
          docker secret inspect shop_db_password_v1 >/dev/null 2>&1 || fail "secret shop_db_password_v1 не существует"
          [ -f /home/ubuntu/shop/evidence/secret.json ] || fail "нет evidence/secret.json"
          python3 - <<'PY' || exit 1
          import json
          from pathlib import Path
          p=Path('/home/ubuntu/shop/evidence/secret.json')
          try: data=json.loads(p.read_text())
          except Exception as e: raise SystemExit(f'Ошибка: некорректный JSON: {e}')
          expected={'secret':'shop_db_password_v1','delivery':'/run/secrets/db_password','plaintext_in_environment':False}
          if set(data) != set(expected): raise SystemExit('Ошибка: evidence должен содержать только поля secret, delivery и plaintext_in_environment')
          for k,v in expected.items():
              if data.get(k) != v: raise SystemExit(f'Ошибка: поле {k} должно быть {v!r}')
          PY
          STACK=/home/ubuntu/shop/stack.yml
          [ -f "$STACK" ] || fail "нет stack.yml"
          if grep -Eiq '(^|[[:space:]])(POSTGRES_PASSWORD|DB_PASSWORD):[[:space:]]*[^/[:space:]]' "$STACK"; then fail "пароль находится в environment"; fi
          grep -q 'DB_PASSWORD_FILE: /run/secrets/db_password' "$STACK" || fail "API не использует secret-файл"
          grep -q 'POSTGRES_PASSWORD_FILE: /run/secrets/db_password' "$STACK" || fail "PostgreSQL не использует secret-файл"
          if find /home/ubuntu/shop -type f ! -name stack.yml ! -name secret.json -print0 | xargs -0 -r grep -IlE 'SwarmLab-DB|"password"[[:space:]]*:[[:space:]]*"[^"]+"' | grep -q .; then
            fail "в проекте найден похожий на plaintext пароль"
          fi
          for image in shop-api:v1 shop-api:v2; do
            docker image inspect "$image" >/dev/null 2>&1 || fail "нет подготовленного image $image"
            docker history --no-trunc "$image" | grep -Eiq 'SwarmLab-DB|POSTGRES_PASSWORD=' && fail "пароль обнаружен в history $image"
          done
          echo "Secret создан и plaintext не обнаружен"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p /home/ubuntu/shop/evidence
          if ! docker secret inspect shop_db_password_v1 >/dev/null 2>&1; then
            printf '%s' 'SwarmLab-DB-v1!' | docker secret create shop_db_password_v1 - >/dev/null
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('/home/ubuntu/shop/evidence').mkdir(parents=True, exist_ok=True)
          Path('/home/ubuntu/shop/evidence/secret.json').write_text(json.dumps({
            'secret': 'shop_db_password_v1',
            'delivery': '/run/secrets/db_password',
            'plaintext_in_environment': False
          }, ensure_ascii=False, indent=2) + '\n')
          PY
          chown -R ubuntu:ubuntu /home/ubuntu/shop
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Swarm secrets предназначены для небольших чувствительных значений.
          Secret хранится в Raft state менеджеров в зашифрованном виде и
          доставляется только task тех сервисов, которым он назначен. В
          Linux-контейнере secret обычно доступен как файл в памяти под
          `/run/secrets`.

          Secret не следует встраивать в image, Dockerfile, environment, command
          line или логи. Метаданные объекта доступны через inspect, но Docker не
          позволяет прочитать его исходное значение после создания. Поэтому
          изменение значения выполняют созданием нового объекта и обновлением
          service.
    description: |-
      #### Упражнение 1 (Создайте пароль базы как secret)

      Создайте Swarm secret `shop_db_password_v1` со стойким паролем базы
      данных. Источник значения не сохраняйте в каталоге проекта после
      создания объекта.

      Убедитесь, что stack-файл передаёт пароль сервисам `api` и `db` только
      как secret-файл, а не через обычную переменную с открытым значением.
      Создайте `/home/ubuntu/shop/evidence/secret.json` с полями `secret`,
      `delivery` и `plaintext_in_environment`; укажите имя объекта, файловый
      способ доставки и логическое значение, подтверждающее отсутствие
      plaintext в environment.
  - title: Создание Swarm configs
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          fail(){ echo "Ошибка: $*" >&2; exit 1; }
          for object in shop_nginx_v1 shop_api_config_v1; do docker config inspect "$object" >/dev/null 2>&1 || fail "config $object не существует"; done
          python3 - <<'PY' || exit 1
          import base64,json,subprocess

          def data(name):
              raw=subprocess.check_output(['docker','config','inspect',name,'--format','{{json .Spec.Data}}'], text=True).strip()
              return base64.b64decode(json.loads(raw)).decode()
          ng=data('shop_nginx_v1')
          if 'listen 80' not in ng or 'location /api/' not in ng or 'proxy_pass http://api:8000/' not in ng or 'location = /health' not in ng:
              raise SystemExit('Ошибка: nginx config не описывает требуемые endpoints/proxy')
          try: api=json.loads(data('shop_api_config_v1'))
          except Exception as e: raise SystemExit(f'Ошибка: API config не является JSON: {e}')
          if api.get('app')!='shop' or api.get('version')!='v1': raise SystemExit('Ошибка: неверные app/version в API config')
          PY
          STACK=/home/ubuntu/shop/stack.yml
          grep -q 'target: /etc/nginx/conf.d/default.conf' "$STACK" || fail "nginx config не подключён к требуемому target"
          grep -q 'target: /app/config.json' "$STACK" || fail "API config не подключён к требуемому target"
          echo "Configs созданы и подключены в модели"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p /home/ubuntu/shop/config
          cat > /home/ubuntu/shop/config/nginx.conf <<'EOF_NGINX'
          server {
            listen 80;
            server_name _;

            location = /health {
              add_header Content-Type application/json;
              return 200 '{"status":"ok","service":"web"}';
            }

            location /api/ {
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_pass http://api:8000/;
            }
          }
          EOF_NGINX
          cat > /home/ubuntu/shop/config/api-v1.json <<'EOF_JSON'
          {
            "app": "shop",
            "version": "v1",
            "rotated": false
          }
          EOF_JSON
          if ! docker config inspect shop_nginx_v1 >/dev/null 2>&1; then
            docker config create shop_nginx_v1 /home/ubuntu/shop/config/nginx.conf >/dev/null
          fi
          if ! docker config inspect shop_api_config_v1 >/dev/null 2>&1; then
            docker config create shop_api_config_v1 /home/ubuntu/shop/config/api-v1.json >/dev/null
          fi
          chown -R ubuntu:ubuntu /home/ubuntu/shop
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Swarm config похож на secret по способу присоединения к service, но
          предназначен для **несекретных** настроек. Это могут быть конфигурация
          reverse proxy, feature flags, адреса зависимостей или параметры
          приложения. Config хранится отдельно от image, поэтому настройку можно
          версионировать и заменять без пересборки образа.

          Configs immutable: содержимое существующего объекта не редактируют. Для
          изменения создают config с новым именем и обновляют service или
          stack-файл. В этой работе nginx и API получают разные configs, поскольку
          у них разные форматы и точки монтирования.
    description: |-
      #### Упражнение 1 (Создайте конфигурации proxy и API)

      Подготовьте корректные конфигурационные файлы в
      `/home/ubuntu/shop/config` и создайте из них Swarm configs
      `shop_nginx_v1` и `shop_api_config_v1`.

      Nginx должен слушать внутри контейнера порт `80`, проксировать путь
      `/api/` сервису `api` на порт `8000` и предоставлять endpoint `/health`.
      API-config должен быть JSON-документом с названием приложения `shop` и
      версией `v1`.

      Оставьте подключения configs в `stack.yml`: nginx-конфигурация
      монтируется как основной конфигурационный файл сервера, API-конфигурация
      — как JSON-файл приложения.
  - title: Declarative deployment stack
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          fail(){ echo "Ошибка: $*" >&2; exit 1; }
          docker stack ls --format '{{.Name}}' | grep -qx shop || fail "stack shop не развёрнут"
          for service in web api db; do
            name="shop_$service"
            docker service inspect "$name" >/dev/null 2>&1 || fail "нет service $name"
            [ "$(docker service inspect "$name" --format '{{.Spec.Mode.Replicated.Replicas}}')" = 1 ] || fail "$name: desired replicas не равно 1"
            [ "$(docker service ls --filter name="${name}" --format '{{.Replicas}}')" = '1/1' ] || fail "$name не достиг 1/1"
            docker service ps "$name" --filter desired-state=running --format '{{.CurrentState}}' | grep -q '^Running' || fail "$name не имеет running task"
          done
          network=$(docker network ls --filter label=com.docker.stack.namespace=shop --filter driver=overlay -q)
          [ -n "$network" ] || fail "нет stack overlay-сети"
          [ "$(docker service inspect shop_api --format '{{range .Spec.TaskTemplate.ContainerSpec.Secrets}}{{println .SecretName}}{{end}}')" = 'shop_db_password_v1' ] || fail "secret не подключён к api"
          docker service inspect shop_web --format '{{range .Spec.TaskTemplate.ContainerSpec.Configs}}{{println .ConfigName}}{{end}}' | grep -qx shop_nginx_v1 || fail "nginx config не подключён к web"
          docker service inspect shop_api --format '{{range .Spec.TaskTemplate.ContainerSpec.Configs}}{{println .ConfigName}}{{end}}' | grep -qx shop_api_config_v1 || fail "API config не подключён к api"
          for service in web api db; do
            cid=$(docker ps --filter label=com.docker.swarm.service.name="shop_$service" --format '{{.ID}}' | head -n 1)
            [ -n "$cid" ] || fail "не найден container shop_$service"
            health=$(docker inspect "$cid" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')
            [ "$health" = healthy ] || fail "shop_$service health=$health"
          done
          curl -fsS http://127.0.0.1:8080/health | grep -q '"status":"ok"' || fail "web health endpoint недоступен"
          echo "Stack shop работает"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          docker stack deploy -c /home/ubuntu/shop/stack.yml shop >/dev/null
          for _ in $(seq 1 90); do
            running=$(docker service ls --filter label=com.docker.stack.namespace=shop --format '{{.Name}} {{.Replicas}}' | awk '$2=="1/1"{c++} END{print c+0}')
            if [ "$running" -eq 3 ] && curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker service ls --filter label=com.docker.stack.namespace=shop
          exit 1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          `docker stack deploy` применяет stack-файл к Swarm. Менеджер создаёт или
          обновляет services, overlay networks и связанные ресурсы, а scheduler
          запускает tasks. Повторный deploy той же модели идемпотентен: Swarm
          приводит фактическое состояние к описанному desired state.

          Успешное создание service ещё не означает готовность приложения. Следует
          проверять количество running tasks, health контейнеров и доступность
          опубликованного endpoint. Имена stack services имеют вид
          `shop_<service>`.
    description: |-
      #### Упражнение 1 (Разверните stack `shop`)

      Примените `/home/ubuntu/shop/stack.yml` как stack с именем `shop`.
      Дождитесь, пока services `shop_web`, `shop_api` и `shop_db` достигнут
      состояния `1/1`, их tasks станут running, а health checks перестанут
      сообщать стартовое состояние.

      Проверьте наличие stack overlay-сети и доступность health endpoint
      reverse proxy на опубликованном порту `8080`.
  - title: Постоянный volume базы данных
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          fail(){ echo "Ошибка: $*" >&2; exit 1; }
          docker volume inspect shop_db_data >/dev/null 2>&1 || fail "volume shop_db_data не существует"
          mounts=$(docker service inspect shop_db --format '{{json .Spec.TaskTemplate.ContainerSpec.Mounts}}')
          printf '%s' "$mounts" | grep -q 'shop_db_data' || fail "volume не подключён к db"
          printf '%s' "$mounts" | grep -q '/var/lib/postgresql/data' || fail "неверный target PostgreSQL volume"
          response=$(curl -fsS http://127.0.0.1:8080/api/products/swarm-book) || fail "товар swarm-book недоступен через API"
          printf '%s' "$response" | grep -q '"name": "Swarm Book"' || fail "неверное название товара"
          printf '%s' "$response" | grep -Eq '"price": [1-9][0-9]*' || fail "цена должна быть положительной"
          count=$(docker service ps shop_db --no-trunc --format '{{.ID}}' | wc -l)
          [ "$count" -ge 2 ] || fail "нет evidence пересоздания task db"
          docker service ps shop_db --filter desired-state=running --format '{{.CurrentState}}' | grep -q '^Running' || fail "db task не running"
          echo "Данные PostgreSQL сохранены в named volume"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS -X POST http://127.0.0.1:8080/api/products \
            -H 'Content-Type: application/json' \
            -d '{"code":"swarm-book","name":"Swarm Book","price":42}' >/dev/null
          old=$(docker service ps shop_db --filter desired-state=running --format '{{.ID}}' | head -n 1)
          docker service update --force shop_db >/dev/null
          for _ in $(seq 1 90); do
            new=$(docker service ps shop_db --filter desired-state=running --format '{{.ID}}' | head -n 1)
            if [ -n "$new" ] && [ "$new" != "$old" ] && curl -fsS http://127.0.0.1:8080/api/products/swarm-book | grep -q 'Swarm Book'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Stateful service должен хранить данные вне writable layer контейнера.
          Named volume переживает пересоздание task и повторный deployment stack.
          В single-node Swarm локальный volume подходит для лаборатории, но в
          multi-node кластере он привязан к конкретному узлу; production-система
          требует placement constraints или общего volume driver.

          Наличие mount проверяет только конфигурацию. Реальную сохранность
          подтверждает запись данных через приложение, пересоздание task и
          повторное чтение той же записи.
    description: |-
      #### Упражнение 1 (Проверьте постоянство данных)

      Через HTTP API опубликованного stack создайте товар с кодом
      `swarm-book`, названием `Swarm Book` и положительной целой ценой. API
      должен записать объект в PostgreSQL, а не хранить его в памяти.

      Принудительно пересоздайте task сервиса `shop_db`, дождитесь
      восстановления stack и убедитесь, что товар по-прежнему возвращается
      через API. Named volume `shop_db_data` должен быть подключён к каталогу
      данных PostgreSQL.
  - title: Ротация secret и config
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          fail(){ echo "Ошибка: $*" >&2; exit 1; }
          docker secret inspect shop_db_password_v2 >/dev/null 2>&1 || fail "нет secret shop_db_password_v2"
          if docker secret inspect shop_db_password_v1 >/dev/null 2>&1; then fail "старый secret shop_db_password_v1 не удалён"; fi
          docker config inspect shop_api_config_v2 >/dev/null 2>&1 || fail "нет config shop_api_config_v2"
          if docker config inspect shop_api_config_v1 >/dev/null 2>&1; then fail "старый config shop_api_config_v1 не удалён"; fi
          api_secrets=$(docker service inspect shop_api --format '{{range .Spec.TaskTemplate.ContainerSpec.Secrets}}{{println .SecretName}}{{end}}')
          printf '%s\n' "$api_secrets" | grep -qx shop_db_password_v2 || fail "api не переключён на secret v2"
          db_secrets=$(docker service inspect shop_db --format '{{range .Spec.TaskTemplate.ContainerSpec.Secrets}}{{println .SecretName}}{{end}}')
          printf '%s\n' "$db_secrets" | grep -qx shop_db_password_v2 || fail "db не переключён на secret v2"
          api_configs=$(docker service inspect shop_api --format '{{range .Spec.TaskTemplate.ContainerSpec.Configs}}{{println .ConfigName}}{{end}}')
          printf '%s\n' "$api_configs" | grep -qx shop_api_config_v2 || fail "api не переключён на config v2"
          curl -fsS http://127.0.0.1:8080/api/version | grep -q '"rotated": true' || fail "API не видит rotated config"
          curl -fsS http://127.0.0.1:8080/api/products/swarm-book | grep -q 'Swarm Book' || fail "после rotation потеряны данные/доступ к БД"
          for service in shop_api shop_db; do
            if docker service logs --raw "$service" 2>&1 | grep -Eiq 'SwarmLab-DB-v[12]!'; then fail "plaintext secret найден в logs $service"; fi
          done
          echo "Secret и API config успешно ротированы"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p /home/ubuntu/shop/config
          if ! docker secret inspect shop_db_password_v2 >/dev/null 2>&1; then
            printf '%s' 'SwarmLab-DB-v2!' | docker secret create shop_db_password_v2 - >/dev/null
          fi
          cid=$(docker ps --filter label=com.docker.swarm.service.name=shop_db --format '{{.ID}}' | head -n 1)
          if [ -n "$cid" ]; then
            docker exec -e PGPASSWORD='SwarmLab-DB-v1!' "$cid" psql -U shop_user -d shop -c "alter user shop_user with password 'SwarmLab-DB-v2!';" >/dev/null || \
            docker exec -e PGPASSWORD='SwarmLab-DB-v2!' "$cid" psql -U shop_user -d shop -c "select 1;" >/dev/null
          fi
          cat > /home/ubuntu/shop/config/api-v2-rotated.json <<'EOF_JSON'
          {
            "app": "shop",
            "version": "v1",
            "rotated": true
          }
          EOF_JSON
          if ! docker config inspect shop_api_config_v2 >/dev/null 2>&1; then
            docker config create shop_api_config_v2 /home/ubuntu/shop/config/api-v2-rotated.json >/dev/null
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/home/ubuntu/shop/stack.yml')
          s=p.read_text()
          s=s.replace('shop_db_password_v1', 'shop_db_password_v2')
          s=s.replace('shop_api_config_v1', 'shop_api_config_v2')
          s=s.replace('shop_api_config_v2:\n    external: true', 'shop_api_config_v2:\n    external: true')
          s=s.replace('shop_db_password_v2:\n    external: true', 'shop_db_password_v2:\n    external: true')
          if 'shop_api_config_v2:' not in s.split('configs:',1)[1]:
              s=s.replace('  shop_api_config_v1:\n    external: true', '  shop_api_config_v2:\n    external: true')
          if 'shop_db_password_v2:' not in s.split('secrets:',1)[1].split('configs:',1)[0]:
              s=s.replace('  shop_db_password_v1:\n    external: true', '  shop_db_password_v2:\n    external: true')
          p.write_text(s)
          PY
          docker stack deploy -c /home/ubuntu/shop/stack.yml shop >/dev/null
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/api/products/swarm-book | grep -q 'Swarm Book' && curl -fsS http://127.0.0.1:8080/api/version | grep -q '"rotated": true'; then
              docker secret rm shop_db_password_v1 >/dev/null 2>&1 || true
              docker config rm shop_api_config_v1 >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 2
          done
          exit 1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Значение Swarm secret или config нельзя изменить на месте. Rotation
          состоит из создания версии с новым именем, переключения зависимого
          service и удаления старого объекта после успешной проверки. Такой
          процесс не требует пересборки image.

          Для пароля базы недостаточно заменить только файл у клиента: значение
          учётной записи PostgreSQL и secret, который читает API, должны
          измениться согласованно. Обновлять следует только затронутые services,
          сохраняя доступность приложения и данные volume.
    description: |-
      #### Упражнение 1 (Выполните ротацию учётных данных)

      Создайте новый пароль и Swarm secret `shop_db_password_v2`. Согласованно
      измените пароль роли приложения в PostgreSQL, переключите объявления и
      подключения stack на новый secret, затем повторно примените stack.

      Создайте API-config `shop_api_config_v2`, сохранив версию приложения
      `v1`, но добавив признак ротации конфигурации. Переключите только `api`
      на новый config. После проверки HTTP и чтения товара `swarm-book`
      удалите старые объекты `shop_db_password_v1` и `shop_api_config_v1`.
  - title: Обновление desired state
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          fail(){ echo "Ошибка: $*" >&2; exit 1; }
          image=$(docker service inspect shop_api --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
          printf '%s' "$image" | grep -q '^shop-api:v2' || fail "shop_api не использует image v2"
          docker service inspect shop_api --format '{{range .Spec.TaskTemplate.ContainerSpec.Configs}}{{println .ConfigName}}{{end}}' | grep -qx shop_api_config_v3 || fail "shop_api не использует config v3"
          version=$(curl -fsS http://127.0.0.1:8080/api/version) || fail "version endpoint недоступен"
          printf '%s' "$version" | grep -q '"version": "v2"' || fail "config version не v2"
          printf '%s' "$version" | grep -q '"image": "v2"' || fail "фактический API image не v2"
          for service in web api db; do
            [ "$(docker service ls --filter name="shop_$service" --format '{{.Replicas}}')" = '1/1' ] || fail "shop_$service не достиг 1/1"
          done
          state=$(docker service inspect shop_api --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}none{{end}}')
          [ "$state" = completed ] || fail "rolling update state=$state, ожидалось completed"
          curl -fsS http://127.0.0.1:8080/api/products/swarm-book | grep -q 'Swarm Book' || fail "данные не сохранились после update"
          echo "Stack обновлён до API v2"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p /home/ubuntu/shop/config
          cat > /home/ubuntu/shop/config/api-v3.json <<'EOF_JSON'
          {
            "app": "shop",
            "version": "v2",
            "rotated": true
          }
          EOF_JSON
          if ! docker config inspect shop_api_config_v3 >/dev/null 2>&1; then
            docker config create shop_api_config_v3 /home/ubuntu/shop/config/api-v3.json >/dev/null
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/home/ubuntu/shop/stack.yml')
          s=p.read_text().replace('shop-api:v1', 'shop-api:v2').replace('shop_api_config_v2', 'shop_api_config_v3').replace('shop_api_config_v1', 'shop_api_config_v3')
          if 'shop_api_config_v3:' not in s.split('configs:',1)[1]:
              lines=s.splitlines()
              out=[]
              for line in lines:
                  out.append(line)
                  if line.strip() == 'shop_nginx_v1:':
                      pass
              s=s.replace('  shop_api_config_v2:\n    external: true', '  shop_api_config_v3:\n    external: true')
          p.write_text(s)
          PY
          docker stack deploy -c /home/ubuntu/shop/stack.yml shop >/dev/null
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/api/version | grep -q '"version": "v2"' && curl -fsS http://127.0.0.1:8080/api/products/swarm-book | grep -q 'Swarm Book'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Stack-файл является декларативным источником desired state. Изменение
          image или config и повторный deploy приводит к rolling update только тех
          services, шаблон task которых изменился. Параметры `update_config`
          управляют параллелизмом, задержкой, порядком запуска и реакцией на
          ошибку.

          Состояние обновления следует подтверждать не только тегом image, но и
          ответом приложения, running tasks и данными `UpdateStatus` service.
    description: |-
      #### Упражнение 1 (Обновите API до версии v2)

      Измените image сервиса `api` в stack-файле на подготовленный
      `shop-api:v2`. Создайте и подключите `shop_api_config_v3`, в котором
      версия приложения равна `v2`, сохранив настройки после ротации.

      Повторно примените stack и дождитесь завершения rolling update. Endpoint
      `/api/version` должен сообщать `v2`, все три service должны иметь
      running tasks, а ранее созданный товар должен остаться доступным.
  - title: Удаление stack и ресурсов
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          fail(){ echo "Ошибка: $*" >&2; exit 1; }
          if docker stack ls --format '{{.Name}}' | grep -qx shop; then fail "stack shop ещё существует"; fi
          [ -z "$(docker service ls --filter label=com.docker.stack.namespace=shop -q)" ] || fail "остались services stack shop"
          [ -z "$(docker network ls --filter label=com.docker.stack.namespace=shop -q)" ] || fail "осталась stack-сеть"
          if docker volume inspect shop_db_data >/dev/null 2>&1; then fail "volume shop_db_data не удалён"; fi
          if docker secret ls --format '{{.Name}}' | grep -q '^shop_'; then fail "остались secrets с префиксом shop_"; fi
          if docker config ls --format '{{.Name}}' | grep -q '^shop_'; then fail "остались configs с префиксом shop_"; fi
          if curl -fsS --max-time 2 http://127.0.0.1:8080/health >/dev/null 2>&1; then fail "порт 8080 всё ещё обслуживает приложение"; fi
          [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = active ] || fail "Swarm не должен быть выключен"
          echo "Stack и лабораторные ресурсы удалены"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          docker stack rm shop >/dev/null 2>&1 || true
          for _ in $(seq 1 90); do
            if [ -z "$(docker service ls --filter label=com.docker.stack.namespace=shop -q)" ] && [ -z "$(docker network ls --filter label=com.docker.stack.namespace=shop -q)" ]; then
              break
            fi
            sleep 2
          done
          for name in shop_db_password_v1 shop_db_password_v2; do docker secret rm "$name" >/dev/null 2>&1 || true; done
          for name in shop_nginx_v1 shop_api_config_v1 shop_api_config_v2 shop_api_config_v3; do docker config rm "$name" >/dev/null 2>&1 || true; done
          docker volume rm shop_db_data >/dev/null 2>&1 || true
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Удаление stack удаляет его services и сети, но не обязано удалять
          объекты с независимым жизненным циклом. External secrets/configs
          остаются в Swarm, а named volume сохраняется, чтобы случайное удаление
          deployment не уничтожило данные.

          Cleanup должен быть адресным: сначала удаляют stack и ждут исчезновения
          services/networks, затем удаляют только объекты данной лаборатории. Это
          предотвращает повреждение ресурсов других приложений.
    description: |-
      #### Упражнение 1 (Удалите лабораторный deployment)

      Удалите stack `shop` и дождитесь исчезновения его services и
      overlay-сети. Затем удалите только актуальные и оставшиеся версионные
      secrets/configs с префиксом `shop_`, а также named volume
      `shop_db_data`.

      Swarm оставьте активным для следующих работ. Проверяемое конечное
      состояние: нет stack `shop`, его services, сети, volume, secrets и
      configs; опубликованный порт `8080` не отвечает.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 12
- title: Swarm scaling, rolling update и rollback
  description: |-
    # Swarm scaling, rolling update и rollback

    В лабораторной работе вы последовательно развернёте HTTP API заказов в
    Docker Swarm, измените число реплик, настроите политику обновления,
    выполните успешный и аварийный релизы, а затем восстановите сервис
    rollback-операцией.

    Рабочий каталог: `/home/ubuntu/swarm-updates`. Сервис: `orders-api`.
    Проверочный endpoint доступен через published port `18080`.
  time-limit-minutes: 90
  steps:
  - title: Baseline service
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.sh	---
          cat <<'EOF' > prepare.sh
          #!/usr/bin/env bash
          set -euo pipefail

          LAB_DIR=/home/ubuntu/swarm-updates
          BUILD_DIR=/home/ubuntu/swarm-updates/build
          EVIDENCE_DIR=/home/ubuntu/swarm-updates/evidence

          install -d -o ubuntu -g ubuntu "$BUILD_DIR" "$EVIDENCE_DIR"

          cat > "$BUILD_DIR/app.py" <<'PY'
          import json
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          VERSION = os.environ.get("APP_VERSION", "unknown")


          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/version":
                      self.respond(200, {"service": "orders-api", "version": VERSION})
                  elif self.path == "/health":
                      status = 503 if VERSION == "bad" else 200
                      self.respond(status, {"status": "unhealthy" if status == 503 else "ok", "version": VERSION})
                  elif self.path == "/orders":
                      self.respond(200, {"orders": [{"id": 101, "status": "accepted"}], "version": VERSION})
                  else:
                      self.respond(404, {"error": "not found"})

              def respond(self, status, payload):
                  body = json.dumps(payload).encode()
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, format, *args):
                  return


          ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PY

          cat > "$BUILD_DIR/Dockerfile" <<'DOCKERFILE'
          FROM python:3.12-alpine
          ARG APP_VERSION
          ENV APP_VERSION=${APP_VERSION}
          WORKDIR /app
          COPY app.py /app/app.py
          EXPOSE 8080
          CMD ["python", "/app/app.py"]
          DOCKERFILE

          chown ubuntu:ubuntu "$BUILD_DIR/app.py" "$BUILD_DIR/Dockerfile"

          if ! docker info --format '{{.Swarm.LocalNodeState}}' | grep -qx active; then
            docker swarm init --advertise-addr 127.0.0.1 >/dev/null
          fi

          docker service rm orders-api >/dev/null 2>&1 || true
          for version in v1 v2 bad; do
            docker build --quiet --build-arg "APP_VERSION=$version" --tag "orders-api:$version" "$BUILD_DIR" >/dev/null
          done

          chown -R ubuntu:ubuntu "$LAB_DIR"
          EOF
          trap 'rm -f prepare.sh' EXIT


          # ----------RUN----------
          chmod u+x prepare.sh
          ./prepare.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail

          fail() { echo "Ошибка: $*" >&2; exit 1; }
          service_json=$(docker service inspect orders-api 2>/dev/null) || fail "service orders-api не найден"
          [ "$(jq -r '.[0].Spec.TaskTemplate.ContainerSpec.Image' <<<"$service_json" | sed 's/@.*//')" = "orders-api:v1" ] || fail "ожидается образ orders-api:v1"
          [ "$(jq -r '.[0].Spec.Mode.Replicated.Replicas' <<<"$service_json")" = "3" ] || fail "ожидаются три desired replicas"
          [ "$(jq -r '.[0].Endpoint.Ports[]? | select(.PublishedPort == 18080 and .TargetPort == 8080) | .PublishedPort' <<<"$service_json")" = "18080" ] || fail "порт 18080 не опубликован на target 8080"
          [ "$(jq -r '.[0].Spec.TaskTemplate.ContainerSpec.Healthcheck.Test[0] // empty' <<<"$service_json")" = "CMD-SHELL" ] || fail "healthcheck не настроен"
          running=$(docker service ps --filter desired-state=running --format '{{.CurrentState}}' orders-api | awk '$1 == "Running" {count++} END {print count+0}')
          [ "$running" = "3" ] || fail "выполняются $running из 3 реплик"
          version=$(curl --fail --silent --max-time 5 http://127.0.0.1:18080/version | jq -r '.version') || fail "endpoint /version недоступен"
          [ "$version" = "v1" ] || fail "endpoint сообщает версию $version вместо v1"
          echo "Baseline готов: orders-api:v1, 3/3 replicas, HTTP доступен"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail

          docker service rm orders-api >/dev/null 2>&1 || true
          while docker service inspect orders-api >/dev/null 2>&1; do sleep 1; done

          docker service create \
            --name orders-api \
            --replicas 3 \
            --publish published=18080,target=8080,mode=ingress \
            --health-cmd 'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/health\", timeout=2)"' \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 2 \
            --health-start-period 3s \
            orders-api:v1 >/dev/null

          docker service update --detach=false orders-api >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Стабильное baseline-состояние

          Baseline — известная исправная конфигурация сервиса до изменений. Для
          Swarm она включает образ, число реплик, published port, healthcheck и
          фактически запущенные tasks. Такое состояние даёт точку сравнения для
          rolling update и цель для восстановления.

          Swarm хранит желаемое состояние в объекте service и постоянно сверяет
          его с фактическим. Реплика считается полезной только после запуска
          приложения и успешной проверки здоровья. Проверка HTTP endpoint
          дополняет состояние оркестратора: task может быть запущен, но приложение
          ещё не готово отвечать.
    description: |-
      Работайте в каталоге `/home/ubuntu/swarm-updates`. Подготовлены
      локальные образы `orders-api` трёх версий.

      #### Упражнение 1 (Развёртывание baseline)

      Создайте Swarm service `orders-api` из образа версии `v1` с тремя
      репликами. Опубликуйте HTTP API на порту `18080` хоста и настройте
      container healthcheck для endpoint `/health` с небольшим интервалом и
      ограниченным числом повторов.

      Добейтесь состояния, в котором все три реплики выполняются, а endpoint
      `/version` возвращает версию `v1`.
  - title: Scaling
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          fail() { echo "Ошибка: $*" >&2; exit 1; }
          desired=$(docker service inspect --format '{{.Spec.Mode.Replicated.Replicas}}' orders-api 2>/dev/null) || fail "service orders-api не найден"
          [ "$desired" = "5" ] || fail "desired replicas: $desired, ожидается 5"
          running=$(docker service ps --filter desired-state=running --format '{{.CurrentState}}' orders-api | awk '$1 == "Running" {count++} END {print count+0}')
          [ "$running" = "5" ] || fail "running replicas: $running, ожидается 5"
          [ "$(curl --fail --silent --max-time 5 http://127.0.0.1:18080/version | jq -r '.version')" = "v1" ] || fail "API не отвечает версией v1"
          echo "Scaling завершён: 5/5 replicas, API доступен"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          docker service scale orders-api=5 >/dev/null
          docker service update --detach=false orders-api >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Horizontal scaling stateless-сервиса

          Horizontal scaling изменяет число одинаковых tasks, обслуживающих один
          сервис. Stateless API не хранит пользовательское состояние внутри
          конкретной реплики, поэтому запрос может попасть в любую из них. Routing
          mesh Swarm распределяет соединения, поступающие на published port.

          Desired replicas задают цель, а running replicas отражают текущую
          реализацию. Во время масштабирования эти значения могут временно
          различаться. Доступность оценивают не только по счётчику tasks, но и
          smoke-проверкой API.
    description: |-
      #### Упражнение 1 (Масштабирование API)

      Увеличьте желаемое число реплик сервиса `orders-api` до пяти. Дождитесь
      сходимости состояния и убедитесь, что published endpoint продолжает
      отвечать версией `v1` во время и после изменения.
  - title: Rolling update policy
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          fail() { echo "Ошибка: $*" >&2; exit 1; }
          json=$(docker service inspect orders-api 2>/dev/null) || fail "service orders-api не найден"
          jq -e '
            .[0].Spec.UpdateConfig.Parallelism == 1 and
            .[0].Spec.UpdateConfig.Delay == 5000000000 and
            .[0].Spec.UpdateConfig.Monitor == 20000000000 and
            .[0].Spec.UpdateConfig.FailureAction == "pause" and
            .[0].Spec.UpdateConfig.MaxFailureRatio == 0.25 and
            .[0].Spec.UpdateConfig.Order == "start-first" and
            .[0].Spec.RollbackConfig.Parallelism == 2 and
            .[0].Spec.RollbackConfig.Delay == 0 and
            .[0].Spec.RollbackConfig.FailureAction == "pause" and
            .[0].Spec.RollbackConfig.Order == "stop-first"
          ' <<<"$json" >/dev/null || fail "UpdateConfig или RollbackConfig не соответствует заданию"
          [ "$(jq -r '.[0].Spec.TaskTemplate.ContainerSpec.Image' <<<"$json" | sed 's/@.*//')" = "orders-api:v1" ] || fail "образ baseline был изменён"
          [ "$(jq -r '.[0].Spec.Mode.Replicated.Replicas' <<<"$json")" = "5" ] || fail "число реплик было изменено"
          echo "UpdateConfig и RollbackConfig настроены"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          docker service update \
            --update-parallelism 1 \
            --update-delay 5s \
            --update-monitor 20s \
            --update-failure-action pause \
            --update-max-failure-ratio 0.25 \
            --update-order start-first \
            --rollback-parallelism 2 \
            --rollback-delay 0s \
            --rollback-monitor 20s \
            --rollback-failure-action pause \
            --rollback-order stop-first \
            orders-api >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Политика rolling update

          `parallelism` ограничивает число одновременно заменяемых tasks, а
          `delay` задаёт паузу между группами. Малый parallelism снижает blast
          radius, но увеличивает длительность релиза. Порядок `start-first`
          сначала запускает новую task и помогает сохранить ёмкость сервиса.

          `failure_action` определяет реакцию на превышение допустимой доли сбоев:
          продолжить, приостановить update или автоматически откатить его.
          `monitor` задаёт период наблюдения за новой task. Отдельная rollback
          policy управляет темпом обратной замены и не обязана полностью повторять
          update policy.
    description: |-
      #### Упражнение 1 (Безопасная политика обновления)

      Настройте для `orders-api` последовательное обновление по одной task с
      задержкой 5 секунд, порядком `start-first` и остановкой rollout при
      проблеме. Период наблюдения должен быть 20 секунд, а допустимая доля
      сбоев — 0,25.

      Также задайте rollback policy: по две tasks одновременно, без
      дополнительной задержки, с порядком `stop-first`. Образ и число реплик
      на этом шаге менять нельзя.
  - title: Update to v2
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          fail() { echo "Ошибка: $*" >&2; exit 1; }
          image=$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' orders-api 2>/dev/null | sed 's/@.*//') || fail "service orders-api не найден"
          [ "$image" = "orders-api:v2" ] || fail "service использует $image вместо orders-api:v2"
          running=$(docker service ps --filter desired-state=running --format '{{.Image}} {{.CurrentState}}' orders-api | awk '$1 ~ /^orders-api:v2(@|$)/ && $2 == "Running" {count++} END {print count+0}')
          [ "$running" = "5" ] || fail "работают $running из 5 tasks версии v2"
          docker service ps --no-trunc --format '{{.Image}} {{.DesiredState}}' orders-api | awk '$1 ~ /^orders-api:v1(@|$)/ && $2 == "Shutdown" {found=1} END {exit !found}' || fail "в истории нет остановленных tasks версии v1"
          [ "$(curl --fail --silent --max-time 5 http://127.0.0.1:18080/version | jq -r '.version')" = "v2" ] || fail "smoke-test не получил v2"
          echo "Rolling update завершён: v2, 5/5 replicas, история v1 сохранена"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          docker service update --image orders-api:v2 --detach=false orders-api >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Постепенная замена tasks

          Rolling update создаёт новое поколение tasks по заданной политике. При
          `start-first` новая task должна стать работоспособной до остановки
          старой, поэтому на короткое время число процессов может превышать число
          реплик. История tasks сохраняет завершённые экземпляры и позволяет
          подтвердить сам факт замены.

          Smoke-test через published port проверяет наблюдаемое пользователем
          поведение. После завершения rollout недостаточно увидеть новый тег в
          service spec: все текущие tasks должны работать, а API — стабильно
          сообщать новую версию.
    description: |-
      #### Упражнение 1 (Выпуск версии v2)

      Обновите образ сервиса `orders-api` до версии `v2`, сохранив пять реплик
      и ранее заданную политику. Наблюдайте за постепенной заменой tasks и
      проверяйте published endpoint на отсутствие простоя.

      В завершённом состоянии все текущие tasks должны использовать `v2`,
      endpoint `/version` — сообщать `v2`, а история сервиса — содержать
      остановленные tasks предыдущего поколения `v1`.
  - title: Broken release
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/swarm-updates/evidence/broken-release.json
          fail() { echo "Ошибка: $*" >&2; exit 1; }
          json=$(docker service inspect orders-api 2>/dev/null) || fail "service orders-api не найден"
          [ "$(jq -r '.[0].UpdateStatus.State // empty' <<<"$json")" = "paused" ] || fail "rolling update не находится в состоянии paused"
          [ "$(jq -r '.[0].Spec.TaskTemplate.ContainerSpec.Image' <<<"$json" | sed 's/@.*//')" = "orders-api:bad" ] || fail "не зафиксирована попытка обновления на orders-api:bad"
          bad_failure=0
          while read -r task_id; do
            [ -n "$task_id" ] || continue
            task=$(docker inspect "$task_id")
            task_image=$(jq -r '.[0].Spec.ContainerSpec.Image' <<<"$task" | sed 's/@.*//')
            task_state=$(jq -r '.[0].Status.State' <<<"$task")
            if [ "$task_image" = "orders-api:bad" ] && [[ "$task_state" =~ ^(failed|shutdown|rejected)$ ]]; then
              bad_failure=1
            fi
          done < <(docker service ps -q --no-trunc orders-api)
          [ "$bad_failure" = "1" ] || fail "в истории нет неуспешной task образа bad"
          [ -f "$EVIDENCE" ] || fail "отсутствует $EVIDENCE"
          jq -e '
            .service == "orders-api" and
            .attempted_image == "orders-api:bad" and
            .update_state == "paused" and
            (.message | type == "string" and length > 0) and
            (.tasks | type == "array" and length > 0) and
            any(.tasks[]; (.Image // "") | startswith("orders-api:bad"))
          ' "$EVIDENCE" >/dev/null || fail "broken-release.json не соответствует схеме или фактическому сценарию"
          echo "Плохой релиз остановлен; failed/unhealthy evidence сохранено"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/swarm-updates/evidence/broken-release.json

          docker service update --image orders-api:bad orders-api >/dev/null
          for _ in $(seq 1 90); do
            state=$(docker service inspect --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}' orders-api)
            if [ "$state" = "paused" ]; then break; fi
            sleep 1
          done
          state=$(docker service inspect --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}' orders-api)
          [ "$state" = "paused" ] || { echo "Обновление не перешло в paused" >&2; exit 1; }

          docker service ps --no-trunc --format '{{json .}}' orders-api | jq -s \
            --arg state "$state" \
            '{service:"orders-api", attempted_image:"orders-api:bad", update_state:$state, message:"healthcheck stopped the rollout", tasks:.}' \
            > "$EVIDENCE"
          chown ubuntu:ubuntu "$EVIDENCE"
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Healthcheck как защита от плохого релиза

          Запущенный процесс ещё не означает готовое приложение. Healthcheck
          проверяет прикладной контракт и переводит контейнер в unhealthy, если он
          систематически нарушается. Swarm учитывает такие отказы в период
          `monitor` и применяет `failure_action` из update policy.

          При `pause` оркестратор прекращает дальнейшую замену, но сохраняет
          диагностическое состояние. Это ограничивает распространение дефекта и
          оставляет исправные tasks предыдущего поколения доступными. Для разбора
          инцидента полезно сохранить структурированное evidence из фактического
          service state и task history.
    description: |-
      #### Упражнение 1 (Контролируемый сбой версии)

      Попытайтесь выпустить образ `orders-api:bad`. Эта версия намеренно не
      проходит `/health`. Дождитесь, пока настроенная политика остановит
      rollout, и не выполняйте rollback на этом шаге.

      Сохраните файл
      `/home/ubuntu/swarm-updates/evidence/broken-release.json`. Он должен
      быть валидным JSON-объектом с полями `service`, `attempted_image`,
      `update_state`, `message` и `tasks`. Поле `tasks` должно содержать
      массив фактических записей истории tasks. Зафиксируйте в evidence
      приостановленный update и попытку запуска плохого образа.
  - title: Rollback
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          fail() { echo "Ошибка: $*" >&2; exit 1; }
          json=$(docker service inspect orders-api 2>/dev/null) || fail "service orders-api не найден"
          [ "$(jq -r '.[0].Spec.TaskTemplate.ContainerSpec.Image' <<<"$json" | sed 's/@.*//')" = "orders-api:v2" ] || fail "rollback не восстановил orders-api:v2"
          state=$(jq -r '.[0].UpdateStatus.State // empty' <<<"$json")
          [ "$state" = "rollback_completed" ] || fail "состояние rollback: $state, ожидается rollback_completed"
          running=$(docker service ps --filter desired-state=running --format '{{.Image}} {{.CurrentState}}' orders-api | awk '$1 ~ /^orders-api:v2(@|$)/ && $2 == "Running" {count++} END {print count+0}')
          [ "$running" = "5" ] || fail "после rollback работают $running из 5 tasks v2"
          [ "$(curl --fail --silent --max-time 5 http://127.0.0.1:18080/version | jq -r '.version')" = "v2" ] || fail "endpoint не восстановлен на v2"
          echo "Rollback завершён: orders-api:v2, 5/5 replicas"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          docker service rollback --detach=false orders-api >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Возврат к предыдущей конфигурации

          Rollback восстанавливает предыдущую версию service spec, а не просто
          меняет строку тега. Swarm применяет отдельный `RollbackConfig`, создаёт
          новое поколение tasks и отражает ход операции в `UpdateStatus`.

          После отката проверяют три уровня: целевой образ в service spec,
          сходимость running tasks и прикладной endpoint. Для данного сценария
          предыдущей успешной конфигурацией является `v2`; baseline `v1` остаётся
          более ранним поколением, но не непосредственной целью rollback.
    description: |-
      #### Упражнение 1 (Восстановление v2)

      Выполните штатный rollback сервиса `orders-api` после приостановленного
      плохого релиза. Дождитесь завершения обратной замены.

      Итоговое состояние должно содержать пять работающих реплик версии `v2`,
      успешный ответ `/version` и завершённое состояние rollback в данных
      сервиса.
  - title: Drain awareness
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/swarm-updates/evidence/node-awareness.json
          fail() { echo "Ошибка: $*" >&2; exit 1; }
          node_id=$(docker info --format '{{.Swarm.NodeID}}')
          node_json=$(docker node inspect "$node_id" 2>/dev/null) || fail "локальный Swarm node не найден"
          [ "$(jq -r '.[0].Spec.Availability' <<<"$node_json")" = "active" ] || fail "единственный узел должен остаться active"
          constraints=$(docker service inspect --format '{{json .Spec.TaskTemplate.Placement.Constraints}}' orders-api 2>/dev/null) || fail "service orders-api не найден"
          jq -e 'index("node.role == manager") != null' <<<"$constraints" >/dev/null || fail "constraint node.role == manager не задан"
          [ -f "$EVIDENCE" ] || fail "отсутствует $EVIDENCE"
          jq -e \
            --arg id "$node_id" \
            --arg host "$(jq -r '.[0].Description.Hostname' <<<"$node_json")" \
            --arg availability "$(jq -r '.[0].Spec.Availability' <<<"$node_json")" \
            --arg manager "$(jq -r '.[0].ManagerStatus.Reachability // "none"' <<<"$node_json")" \
            --argjson constraints "$constraints" '
              .node_id == $id and
              .hostname == $host and
              .availability == $availability and
              .manager_status == $manager and
              .service_constraints == $constraints
            ' "$EVIDENCE" >/dev/null || fail "node-awareness.json не совпадает с фактическим состоянием"
          [ "$(curl --fail --silent --max-time 5 http://127.0.0.1:18080/version | jq -r '.version')" = "v2" ] || fail "API потерял доступность"
          echo "Node active; constraint и evidence подтверждены"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/swarm-updates/evidence/node-awareness.json
          NODE_ID=$(docker info --format '{{.Swarm.NodeID}}')

          docker node update --availability active "$NODE_ID" >/dev/null
          current_constraints=$(docker service inspect --format '{{json .Spec.TaskTemplate.Placement.Constraints}}' orders-api)
          if ! jq -e 'index("node.role == manager") != null' <<<"$current_constraints" >/dev/null; then
            docker service update --constraint-add 'node.role == manager' --detach=false orders-api >/dev/null
          fi

          node_json=$(docker node inspect "$NODE_ID")
          constraints=$(docker service inspect --format '{{json .Spec.TaskTemplate.Placement.Constraints}}' orders-api)
          jq -n \
            --arg node_id "$(jq -r '.[0].ID' <<<"$node_json")" \
            --arg hostname "$(jq -r '.[0].Description.Hostname' <<<"$node_json")" \
            --arg availability "$(jq -r '.[0].Spec.Availability' <<<"$node_json")" \
            --arg manager_status "$(jq -r '.[0].ManagerStatus.Reachability // "none"' <<<"$node_json")" \
            --argjson constraints "$constraints" \
            '{node_id:$node_id, hostname:$hostname, availability:$availability, manager_status:$manager_status, service_constraints:$constraints}' \
            > "$EVIDENCE"
          chown ubuntu:ubuntu "$EVIDENCE"
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Availability узлов и placement constraints

          Узел Swarm в состоянии `active` принимает новые tasks. `pause` запрещает
          новые назначения, а `drain` также эвакуирует существующие tasks. Drain
          полезен для обслуживания узла, но на single-node стенде он лишит
          replicated service места для запуска.

          Placement constraints ограничивают множество подходящих узлов по их
          атрибутам, например роли. Ограничение не создаёт дополнительной
          отказоустойчивости: если ему соответствует только один узел, он
          становится единственной точкой размещения. Поэтому перед drain важно
          фиксировать topology, availability и constraints.
    description: |-
      #### Упражнение 1 (Фиксация placement-состояния)

      Не переводя единственный узел стенда в drain, сохраните его доступность
      `active`. Добавьте сервису `orders-api` placement constraint,
      допускающий запуск на manager-узле, и убедитесь, что API остаётся
      доступным.

      Создайте `/home/ubuntu/swarm-updates/evidence/node-awareness.json` с
      полями `node_id`, `hostname`, `availability`, `manager_status` и
      `service_constraints`. Значения должны отражать фактические данные
      Swarm, а `service_constraints` должен быть JSON-массивом.
  - title: Final cleanup
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          fail() { echo "Ошибка: $*" >&2; exit 1; }
          [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = "active" ] || fail "узел больше не состоит в активном Swarm"
          if docker service inspect orders-api >/dev/null 2>&1; then fail "service orders-api всё ещё существует"; fi
          for image in orders-api:v1 orders-api:v2 orders-api:bad; do
            if docker image inspect "$image" >/dev/null 2>&1; then fail "образ $image не удалён"; fi
          done
          containers=$(docker ps -aq --filter 'label=com.docker.swarm.service.name=orders-api')
          [ -z "$containers" ] || fail "остались контейнеры tasks сервиса orders-api"
          if curl --silent --max-time 2 http://127.0.0.1:18080/version >/dev/null 2>&1; then fail "published endpoint 18080 всё ещё отвечает"; fi
          echo "Нагрузка удалена; Swarm сохранён активным"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail

          docker service rm orders-api >/dev/null 2>&1 || true
          for _ in $(seq 1 30); do
            containers=$(docker ps -aq --filter 'label=com.docker.swarm.service.name=orders-api')
            [ -z "$containers" ] && break
            sleep 1
          done
          containers=$(docker ps -aq --filter 'label=com.docker.swarm.service.name=orders-api')
          if [ -n "$containers" ]; then
            docker rm -f $containers >/dev/null
          fi
          docker image rm orders-api:v1 orders-api:v2 orders-api:bad >/dev/null 2>&1 || true
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Контролируемая очистка

          Удаление service удаляет его желаемое состояние и освобождает published
          port. После завершения tasks локальные учебные образы можно удалить
          отдельно. Состояние Swarm при этом сохраняется, поэтому стенд остаётся
          готовым для следующих лабораторных работ.

          Команда выхода из Swarm имеет существенно более широкий эффект и не
          относится к очистке одной нагрузки. Evidence-файлы также не являются
          runtime-ресурсами Docker и могут оставаться для последующего разбора.
    description: |-
      #### Упражнение 1 (Очистка нагрузки)

      Удалите service `orders-api` и три локальных образа лабораторной: `v1`,
      `v2` и `bad`. Дождитесь освобождения published port и удаления связанных
      контейнеров.

      Не выполняйте выход узла из Swarm и не удаляйте evidence-файлы. Итоговая
      проверка должна видеть активный Swarm без сервиса и образов этой
      лабораторной.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 13
- title: 'Итоговое задание Docker Swarm: отказоустойчивая оркестрация сервиса'
  description: |-
    В этой итоговой лабораторной вы самостоятельно переносите сервисную
    платформу `market` в Docker Swarm. Платформа включает публичный edge,
    два HTTP API, PostgreSQL и фоновый worker.

    Цель — получить воспроизводимый stack с overlay-сегментацией, Swarm
    secrets и configs, масштабируемыми API, persistent state,
    контролируемыми обновлениями, rollback и проверенным восстановлением
    после потери task. Все этапы оцениваются по фактическому состоянию
    Docker и сквозному HTTP workflow.

    Рабочий каталог — `/home/ubuntu/capstone-swarm`. Лаборатория рассчитана
    на single-node Swarm: она демонстрирует reconciliation сервисов, но не
    заменяет проверку отказоустойчивости при потере физического узла.
  time-limit-minutes: 360
  steps:
  - title: 01. Swarm-инвентаризация
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.sh	---
          cat <<'EOF' > prepare.sh
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/capstone-swarm /home/ubuntu/capstone-swarm/evidence
          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" != active ]; then
            docker swarm init --advertise-addr 127.0.0.1 >/dev/null
          fi
          docker node update --availability active "$(docker info --format '{{.Swarm.NodeID}}')" >/dev/null
          EOF
          trap 'rm -f prepare.sh' EXIT


          # ----------RUN----------
          chmod u+x prepare.sh
          ./prepare.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          fail() { echo "ОШИБКА: $*" >&2; exit 1; }
          [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = active ] || fail "Swarm не активен"
          node_id=$(docker info --format '{{.Swarm.NodeID}}')
          [ "$(docker node inspect --format '{{.Spec.Role}}' "$node_id")" = manager ] || fail "Узел не manager"
          [ "$(docker node inspect --format '{{.Spec.Availability}}' "$node_id")" = active ] || fail "Узел недоступен scheduler"
          file=/home/ubuntu/capstone-swarm/evidence/swarm-inventory.json
          jq -e --arg id "$node_id" '.swarm=="active" and .node_id==$id and .role=="manager" and .availability=="active" and (.hostname|length>0) and (.manager_state=="reachable" or .manager_state=="leader")' "$file" >/dev/null || fail "Некорректный evidence swarm-inventory.json"
          echo "OK: Swarm inventory подтверждён"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          install -d -o ubuntu -g ubuntu /home/ubuntu/capstone-swarm /home/ubuntu/capstone-swarm/evidence
          node_id=$(docker info --format '{{.Swarm.NodeID}}')
          hostname=$(docker node inspect --format '{{.Description.Hostname}}' "$node_id")
          role=$(docker node inspect --format '{{.Spec.Role}}' "$node_id")
          availability=$(docker node inspect --format '{{.Spec.Availability}}' "$node_id")
          manager_state=$(docker node inspect --format '{{.ManagerStatus.Reachability}}' "$node_id")
          jq -n --arg node_id "$node_id" --arg hostname "$hostname" --arg role "$role" --arg availability "$availability" --arg manager_state "$manager_state"   '{swarm:"active",node_id:$node_id,hostname:$hostname,role:$role,availability:$availability,manager_state:$manager_state}'   > /home/ubuntu/capstone-swarm/evidence/swarm-inventory.json
          chown ubuntu:ubuntu /home/ubuntu/capstone-swarm/evidence/swarm-inventory.json
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Роли узлов и desired state


          Docker Swarm хранит желаемое состояние сервисов в manager-узлах. Manager
          принимает декларации, планирует tasks и выполняет reconciliation; worker
          запускает назначенные ему tasks. Один узел может совмещать обе роли.

          Single-node лаборатория позволяет исследовать services, stacks и
          восстановление tasks, но не доказывает устойчивость к потере самого
          узла. Результат инвентаризации нужен как точка отсчёта: фактическое
          состояние следует фиксировать машинно-проверяемыми полями, а не
          свободным отчётом.
    description: |-
      # Swarm-инвентаризация


      #### Упражнение 1 (Задание)

      Зафиксируйте исходное состояние Swarm и метаданные единственного узла в
      структурированном evidence-файле.

      ### Критерии готовности

      Проверка ожидает активный Swarm, manager-роль, доступность узла `active`
      и файл `evidence/swarm-inventory.json` с идентификатором, hostname,
      ролью, availability и состоянием manager.
  - title: 02. Registry и images
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          fail() { echo "ОШИБКА: $*" >&2; exit 1; }
          docker inspect market-registry >/dev/null 2>&1 || fail "Контейнер market-registry не найден"
          [ "$(docker inspect --format '{{.State.Running}}' market-registry)" = true ] || fail "Registry не запущен"
          for repo in market-edge market-orders market-catalog market-worker; do
            tags=$(curl -fsS "http://127.0.0.1:5000/v2/$repo/tags/list") || fail "Registry не возвращает $repo"
            jq -e '.tags | index("1.0")' <<<"$tags" >/dev/null || fail "Нет тега $repo:1.0"
            digest=$(curl -fsSI -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' "http://127.0.0.1:5000/v2/$repo/manifests/1.0" | tr -d '
          ' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
            [[ "$digest" == sha256:* ]] || fail "Нет digest для $repo:1.0"
          done
          echo "OK: custom images опубликованы в registry"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          install -d -o ubuntu -g ubuntu /home/ubuntu/capstone-swarm /home/ubuntu/capstone-swarm/evidence
          if ! docker ps --format '{{.Names}}' | grep -qx market-registry; then
            docker rm -f market-registry >/dev/null 2>&1 || true
            docker run -d --restart always --name market-registry -p 5000:5000 registry:2 >/dev/null
          fi
          install -d -o ubuntu -g ubuntu /home/ubuntu/capstone-swarm/src/{edge,orders,catalog,worker}
          cat > /home/ubuntu/capstone-swarm/src/edge/app.py <<'PYAPP'
          import http.client,json,os
          from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
          routes=json.load(open('/run/configs/routes.json'))
          class H(BaseHTTPRequestHandler):
           def do_GET(self): self.proxy()
           def do_POST(self): self.proxy()
           def proxy(self):
            prefix=next((p for p in routes if self.path.startswith(p)),None)
            if self.path=='/health': return self.send(200,b'{"status":"ok","service":"edge"}')
            if not prefix: return self.send(404,b'{"error":"route"}')
            host,port=routes[prefix].split(':'); body=self.rfile.read(int(self.headers.get('Content-Length','0')))
            try:
             c=http.client.HTTPConnection(host,int(port),timeout=5); c.request(self.command,self.path,body,{'Content-Type':self.headers.get('Content-Type','application/json')}); r=c.getresponse(); self.send(r.status,r.read(),r.getheader('Content-Type','application/json'))
            except Exception as e: self.send(502,json.dumps({'error':str(e)}).encode())
           def send(self,code,body,ctype='application/json'):
            self.send_response(code); self.send_header('Content-Type',ctype); self.send_header('Content-Length',str(len(body))); self.end_headers(); self.wfile.write(body)
           def log_message(self,*a): pass
          ThreadingHTTPServer(('0.0.0.0',8080),H).serve_forever()
          PYAPP
          cat > /home/ubuntu/capstone-swarm/src/orders/app.py <<'PYAPP'
          import json,os,time,uuid
          from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
          import psycopg
          VERSION=os.getenv('APP_VERSION','1.0')
          def conn():
           return psycopg.connect(host=os.getenv('DB_HOST','db'),dbname=os.getenv('DB_NAME','market'),user=os.getenv('DB_USER','market'),password=open('/run/secrets/db_password').read().strip())
          for _ in range(60):
           try:
            with conn() as c: c.execute('create table if not exists orders (id text primary key, item text not null, quantity int not null, created_at timestamptz default now())')
            break
           except Exception: time.sleep(2)
          class H(BaseHTTPRequestHandler):
           def do_GET(self):
            if self.path=='/health': return self.send(200,{'status':'ok','service':'orders-api','version':VERSION})
            if self.path=='/orders/version': return self.send(200,{'version':VERSION})
            if self.path.startswith('/orders/'):
             oid=self.path.split('/')[-1]
             with conn() as c: row=c.execute('select id,item,quantity from orders where id=%s',(oid,)).fetchone()
             return self.send(200,{'id':row[0],'item':row[1],'quantity':row[2]}) if row else self.send(404,{'error':'not found'})
            self.send(404,{'error':'route'})
           def do_POST(self):
            if self.path!='/orders': return self.send(404,{'error':'route'})
            data=json.loads(self.rfile.read(int(self.headers.get('Content-Length','0'))) or b'{}'); oid=str(uuid.uuid4())
            with conn() as c: c.execute('insert into orders(id,item,quantity) values(%s,%s,%s)',(oid,data.get('item','unknown'),int(data.get('quantity',1))))
            self.send(201,{'id':oid,'item':data.get('item','unknown'),'quantity':int(data.get('quantity',1)),'version':VERSION})
           def send(self,code,data):
            body=json.dumps(data).encode(); self.send_response(code); self.send_header('Content-Type','application/json'); self.send_header('Content-Length',str(len(body))); self.end_headers(); self.wfile.write(body)
           def log_message(self,*a): pass
          ThreadingHTTPServer(('0.0.0.0',8000),H).serve_forever()
          PYAPP
          cat > /home/ubuntu/capstone-swarm/src/catalog/app.py <<'PYAPP'
          import json,os
          from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
          class H(BaseHTTPRequestHandler):
           def do_GET(self):
            if self.path=='/health': data={'status':'ok','service':'catalog-api'}
            elif self.path=='/catalog': data={'items':[{'sku':'book','price':25},{'sku':'keyboard','price':80}]}
            else: return self.send_error(404)
            body=json.dumps(data).encode(); self.send_response(200); self.send_header('Content-Type','application/json'); self.send_header('Content-Length',str(len(body))); self.end_headers(); self.wfile.write(body)
           def log_message(self,*a): pass
          ThreadingHTTPServer(('0.0.0.0',8000),H).serve_forever()
          PYAPP
          cat > /home/ubuntu/capstone-swarm/src/worker/app.py <<'PYAPP'
          import os,time,psycopg
          while True:
           try:
            password=open('/run/secrets/db_password').read().strip()
            with psycopg.connect(host=os.getenv('DB_HOST','db'),dbname='market',user='market',password=password) as c: c.execute('select count(*) from orders').fetchone()
           except Exception as e: print(e,flush=True)
           time.sleep(10)
          PYAPP
          cat > /home/ubuntu/capstone-swarm/src/edge/Dockerfile <<'EOF'
          FROM python:3.12-alpine
          WORKDIR /app
          COPY app.py /app/app.py
          USER 65532:65532
          ENTRYPOINT ["python","/app/app.py"]
          EOF
          cat > /home/ubuntu/capstone-swarm/src/catalog/Dockerfile <<'EOF'
          FROM python:3.12-alpine
          WORKDIR /app
          COPY app.py /app/app.py
          USER 65532:65532
          ENTRYPOINT ["python","/app/app.py"]
          EOF
          for app in orders worker; do
          cat > "/home/ubuntu/capstone-swarm/src/$app/Dockerfile" <<'EOF'
          FROM python:3.12-alpine
          RUN pip install --no-cache-dir "psycopg[binary]==3.2.3"
          WORKDIR /app
          COPY app.py /app/app.py
          USER 65532:65532
          ENTRYPOINT ["python","/app/app.py"]
          EOF
          done
          for app in edge orders catalog worker; do
            docker build -t "localhost:5000/market-$app:1.0" "/home/ubuntu/capstone-swarm/src/$app"
            docker push "localhost:5000/market-$app:1.0"
          done
          chown -R ubuntu:ubuntu /home/ubuntu/capstone-swarm/src
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Доставка образов узлам Swarm


          Task может быть назначена любому подходящему узлу, поэтому образ должен
          находиться в доступном registry либо уже присутствовать на каждом узле
          под неизменяемой ссылкой. Локальный registry подходит для single-node
          стенда и сохраняет тот же механизм distribution, который применяется в
          многоузловом кластере.

          Тег удобен человеку, а digest однозначно идентифицирует manifest. Для
          проверки публикации недостаточно увидеть образ в локальном cache:
          registry должен возвращать repository, tag и digest.
    description: |-
      # Registry и images


      #### Упражнение 1 (Задание)

      Подготовьте локальный registry и опубликуйте в нём собственные образы
      `market-edge`, `market-orders`, `market-catalog` и `market-worker` с
      тегом `1.0`.

      ### Критерии готовности

      Проверка обращается к Registry HTTP API, сверяет теги, digest-манифесты
      и наличие локального контейнера registry.
  - title: 03. Stack declaration
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          fail() { echo "ОШИБКА: $*" >&2; exit 1; }
          docker stack config -c /home/ubuntu/capstone-swarm/market-stack.yml >/dev/null || fail "Stack-файл невалиден"
          for service in edge orders-api catalog-api db worker; do
            docker service inspect "market_$service" >/dev/null 2>&1 || fail "Нет сервиса market_$service"
            [ "$(docker service inspect --format '{{index .Spec.Labels "com.docker.stack.namespace"}}' "market_$service")" = market ] || fail "У market_$service нет stack label"
          done
          echo "OK: stack market содержит пять сервисов"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          install -d -o ubuntu -g ubuntu /home/ubuntu/capstone-swarm /home/ubuntu/capstone-swarm/evidence
          cat > /home/ubuntu/capstone-swarm/market-stack.yml <<'YAML'
          version: "3.8"
          services:
            edge:
              image: localhost:5000/market-edge:1.0
              ports:
                - target: 8080
                  published: 8080
                  protocol: tcp
                  mode: ingress
              deploy:
                replicas: 1
            orders-api:
              image: localhost:5000/market-orders:1.0
              deploy:
                replicas: 1
            catalog-api:
              image: localhost:5000/market-catalog:1.0
              deploy:
                replicas: 1
            db:
              image: postgres:16-alpine
              environment:
                POSTGRES_DB: market
                POSTGRES_USER: market
                POSTGRES_PASSWORD: bootstrap-only
              deploy:
                replicas: 1
            worker:
              image: localhost:5000/market-worker:1.0
              deploy:
                replicas: 1
          YAML
          docker stack deploy --resolve-image always -c /home/ubuntu/capstone-swarm/market-stack.yml market
          chown ubuntu:ubuntu /home/ubuntu/capstone-swarm/market-stack.yml
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Stack как декларация платформы


          Stack объединяет несколько Swarm services в одну декларативную единицу.
          Stack-файл описывает images, сети, mounts, configs, secrets, deploy
          policy и порты; `docker stack deploy` преобразует эту модель в service
          specs.

          Production-подобная декларация воспроизводима: ручные изменения service
          допустимы для drill, но итоговый stack-файл должен оставаться источником
          истины. Имена объектов stack получают namespace `market`.
    description: |-
      # Stack declaration


      #### Упражнение 1 (Задание)

      Создайте файл декларации `/home/ubuntu/capstone-swarm/market-stack.yml`
      и разверните stack `market` из пяти сервисов: `edge`, `orders-api`,
      `catalog-api`, `db`, `worker`.

      ### Критерии готовности

      Проверка валидирует stack-файл средствами Docker и требует существования
      всех пяти Swarm services с label принадлежности stack `market`.
  - title: 04. Overlay networks
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          fail() { echo "ОШИБКА: $*" >&2; exit 1; }
          for net in frontend backend data; do
            [ "$(docker network inspect --format '{{.Driver}}' "market_$net")" = overlay ] || fail "market_$net не overlay"
            [ "$(docker network inspect --format '{{.Scope}}' "market_$net")" = swarm ] || fail "market_$net не swarm scope"
          done
          has_net() { docker service inspect --format '{{range .Spec.TaskTemplate.Networks}}{{.Target}} {{end}}' "$1" | grep -qw "$(docker network inspect --format '{{.Id}}' "$2")"; }
          has_net market_edge market_frontend && has_net market_edge market_backend || fail "Неверные сети edge"
          has_net market_orders-api market_backend && has_net market_orders-api market_data || fail "Неверные сети orders-api"
          has_net market_catalog-api market_backend || fail "catalog-api не в backend"
          has_net market_db market_data && has_net market_worker market_data || fail "db/worker не в data"
          for service in orders-api catalog-api db worker; do
            [ "$(docker service inspect --format '{{len .Endpoint.Spec.Ports}}' "market_$service")" = 0 ] || fail "market_$service публикует порт"
          done
          [ "$(docker service inspect --format '{{(index .Endpoint.Spec.Ports 0).PublishedPort}}' market_edge)" = 8080 ] || fail "Edge не публикует 8080"
          echo "OK: overlay segmentation и публикация edge корректны"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          install -d -o ubuntu -g ubuntu /home/ubuntu/capstone-swarm /home/ubuntu/capstone-swarm/evidence
          cat > /home/ubuntu/capstone-swarm/market-stack.yml <<'YAML'
          version: "3.8"
          services:
            edge:
              image: localhost:5000/market-edge:1.0
              ports:
                - target: 8080
                  published: 8080
                  protocol: tcp
                  mode: ingress
              networks: [frontend, backend]
              deploy: {replicas: 1}
            orders-api:
              image: localhost:5000/market-orders:1.0
              networks: [backend, data]
              deploy: {replicas: 1}
            catalog-api:
              image: localhost:5000/market-catalog:1.0
              networks: [backend]
              deploy: {replicas: 1}
            db:
              image: postgres:16-alpine
              environment: {POSTGRES_DB: market, POSTGRES_USER: market, POSTGRES_PASSWORD: bootstrap-only}
              networks: [data]
              deploy: {replicas: 1}
            worker:
              image: localhost:5000/market-worker:1.0
              networks: [data]
              deploy: {replicas: 1}
          networks:
            frontend: {name: market_frontend, driver: overlay, attachable: true}
            backend: {name: market_backend, driver: overlay, attachable: true}
            data: {name: market_data, driver: overlay, attachable: true}
          YAML
          docker stack deploy --resolve-image always -c /home/ubuntu/capstone-swarm/market-stack.yml market
          chown ubuntu:ubuntu /home/ubuntu/capstone-swarm/market-stack.yml
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Сегментация overlay-сетями


          Overlay network создаёт логический L2-сегмент между Swarm-узлами.
          Разделение frontend, backend и data уменьшает число допустимых путей:
          edge видит API, API видят необходимые внутренние компоненты, а база не
          публикуется наружу.

          Published port является частью endpoint spec сервиса. Внешняя
          поверхность задания — только edge; внутренние порты доступны по service
          discovery внутри overlay-сетей.
    description: |-
      # Overlay networks


      #### Упражнение 1 (Задание)

      Разделите трафик stack по attachable overlay-сетям `market_frontend`,
      `market_backend` и `market_data`. Наружу должен быть опубликован только
      `market_edge` на порту `8080`.

      ### Критерии готовности

      Проверка сопоставляет подключения сервисов к сегментам, driver и scope
      сетей, а также published ports всех сервисов.
  - title: 05. Secrets и configs
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          fail() { echo "ОШИБКА: $*" >&2; exit 1; }
          docker secret inspect market_db_password >/dev/null || fail "Нет secret market_db_password"
          for config in market_edge_routes market_api_config; do docker config inspect "$config" >/dev/null || fail "Нет config $config"; done
          secret_id=$(docker secret inspect --format '{{.ID}}' market_db_password)
          for service in market_orders-api market_db market_worker; do
            docker service inspect --format '{{range .Spec.TaskTemplate.ContainerSpec.Secrets}}{{.SecretID}} {{end}}' "$service" | grep -qw "$secret_id" || fail "$service не использует DB secret"
          done
          routes_id=$(docker config inspect --format '{{.ID}}' market_edge_routes)
          docker service inspect --format '{{range .Spec.TaskTemplate.ContainerSpec.Configs}}{{.ConfigID}} {{end}}' market_edge | grep -qw "$routes_id" || fail "edge не использует routes config"
          ! grep -Eqi 'POSTGRES_PASSWORD:[[:space:]]*[^/]|swarm-capstone-db-2026' /home/ubuntu/capstone-swarm/market-stack.yml || fail "Пароль открыт в stack-файле"
          for service in market_orders-api market_db market_worker; do
            ! docker service inspect --format '{{json .Spec.TaskTemplate.ContainerSpec.Env}}' "$service" | grep -q 'swarm-capstone-db-2026' || fail "Пароль открыт в environment $service"
          done
          container=$(docker ps --filter label=com.docker.swarm.service.name=market_orders-api --format '{{.ID}}' | head -1)
          [ -n "$container" ] || fail "Нет running orders-api task"
          docker exec "$container" test -s /run/secrets/db_password || fail "Secret не смонтирован в task"
          echo "OK: secrets/configs подключены без plaintext password"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          install -d -o ubuntu -g ubuntu /home/ubuntu/capstone-swarm /home/ubuntu/capstone-swarm/evidence
          if ! docker secret inspect market_db_password >/dev/null 2>&1; then
            printf '%s' 'swarm-capstone-db-2026' | docker secret create market_db_password - >/dev/null
          fi
          if ! docker config inspect market_edge_routes >/dev/null 2>&1; then
            printf '%s
          ' '{"/orders":"orders-api:8000","/catalog":"catalog-api:8000"}' | docker config create market_edge_routes - >/dev/null
          fi
          if ! docker config inspect market_api_config >/dev/null 2>&1; then
            printf '%s
          ' '{"service":"market","database":"market","log_level":"info"}' | docker config create market_api_config - >/dev/null
          fi
          cat > /home/ubuntu/capstone-swarm/market-stack.yml <<'YAML'
          version: "3.8"
          services:
            edge:
              image: localhost:5000/market-edge:1.0
              ports:
                - target: 8080
                  published: 8080
                  protocol: tcp
                  mode: ingress
              networks: [frontend, backend]
              configs:
                - source: edge_routes
                  target: /run/configs/routes.json
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
                interval: 10s
                timeout: 3s
                retries: 3
              deploy:
                replicas: 1
                restart_policy: {condition: on-failure}
            orders-api:
              image: localhost:5000/market-orders:1.0
              environment:
                DB_HOST: db
                DB_NAME: market
                DB_USER: market
                APP_CONFIG: /run/configs/api.json
                APP_VERSION: "1.0"
              networks: [backend, data]
              secrets:
                - source: db_password
                  target: db_password
              configs:
                - source: api_config
                  target: /run/configs/api.json
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
                interval: 10s
                timeout: 3s
                retries: 3
              deploy:
                replicas: 1
                endpoint_mode: vip
                restart_policy: {condition: on-failure}
                update_config: {parallelism: 1, delay: 5s, monitor: 10s, failure_action: pause, order: start-first}
                rollback_config: {parallelism: 1, delay: 2s, monitor: 10s, failure_action: pause, order: stop-first}
            catalog-api:
              image: localhost:5000/market-catalog:1.0
              networks: [backend]
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
                interval: 10s
                timeout: 3s
                retries: 3
              deploy:
                replicas: 1
                endpoint_mode: vip
                restart_policy: {condition: on-failure}
            db:
              image: postgres:16-alpine
              environment:
                POSTGRES_DB: market
                POSTGRES_USER: market
                POSTGRES_PASSWORD_FILE: /run/secrets/db_password
              networks: [data]
              secrets:
                - source: db_password
                  target: db_password
              volumes:
                - db-data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U market -d market"]
                interval: 10s
                timeout: 5s
                retries: 5
              deploy:
                replicas: 1
                placement: {constraints: [node.role == manager]}
                restart_policy: {condition: on-failure}
            worker:
              image: localhost:5000/market-worker:1.0
              environment: {DB_HOST: db}
              networks: [data]
              secrets:
                - source: db_password
                  target: db_password
              configs:
                - source: api_config
                  target: /run/configs/api.json
              deploy:
                replicas: 1
                restart_policy: {condition: on-failure}
          networks:
            frontend: {name: market_frontend, driver: overlay, attachable: true}
            backend: {name: market_backend, driver: overlay, attachable: true}
            data: {name: market_data, driver: overlay, attachable: true}
          volumes:
            db-data: {name: market_db-data}
          secrets:
            db_password: {external: true, name: market_db_password}
          configs:
            edge_routes: {external: true, name: market_edge_routes}
            api_config: {external: true, name: market_api_config}
          YAML
          docker stack deploy --resolve-image always -c /home/ubuntu/capstone-swarm/market-stack.yml market
          chown ubuntu:ubuntu /home/ubuntu/capstone-swarm/market-stack.yml
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Конфиденциальные и обычные данные


          Swarm config предназначен для обычных конфигурационных файлов, а secret
          — для чувствительных данных. Secret хранится в Raft state и монтируется
          только в task тех сервисов, которым назначен. Его нельзя дублировать в
          image, environment, stack-файле или логах.

          Attachment в service spec важнее самого существования объекта: scheduler
          должен знать, какой config или secret доставить конкретной task.
          Приложение читает смонтированный файл во время запуска.
    description: |-
      # Secrets и configs


      #### Упражнение 1 (Задание)

      Передайте пароль PostgreSQL через Swarm secret `market_db_password`, а
      маршруты edge и настройки приложений — через configs
      `market_edge_routes` и `market_api_config`. Удалите пароль из
      stack-файла и environment сервисов.

      ### Критерии готовности

      Проверка анализирует attachments сервисов, файлы внутри running tasks и
      отсутствие открытого пароля в stack declaration и environment.
  - title: 06. Replicas и load balancing
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          fail() { echo "ОШИБКА: $*" >&2; exit 1; }
          running() { docker service ps --filter desired-state=running --format '{{.CurrentState}}' "$1" | grep -c '^Running'; }
          [ "$(running market_orders-api)" -ge 3 ] || fail "orders-api не имеет 3 running replicas"
          [ "$(running market_catalog-api)" -ge 2 ] || fail "catalog-api не имеет 2 running replicas"
          [ "$(docker service inspect --format '{{.Spec.EndpointSpec.Mode}}' market_orders-api)" = vip ] || fail "orders-api не использует VIP"
          catalog=$(curl -fsS http://127.0.0.1:8080/catalog) || fail "Каталог недоступен через edge"
          jq -e '.items|length>=2' <<<"$catalog" >/dev/null || fail "Некорректный каталог"
          created=$(curl -fsS -X POST -H 'Content-Type: application/json' -d '{"item":"book","quantity":2}' http://127.0.0.1:8080/orders) || fail "Не удалось создать заказ"
          id=$(jq -r '.id' <<<"$created"); [ -n "$id" ] && [ "$id" != null ] || fail "API не вернул order id"
          jq -e --arg id "$id" '.id==$id and .item=="book" and .quantity==2' < <(curl -fsS "http://127.0.0.1:8080/orders/$id") >/dev/null || fail "Заказ не читается через edge"
          echo "OK: replicas и HTTP workflow работают"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          install -d -o ubuntu -g ubuntu /home/ubuntu/capstone-swarm /home/ubuntu/capstone-swarm/evidence
          docker service scale market_orders-api=3 market_catalog-api=2 >/dev/null
          python3 - <<'PYCODE'
          p = '/home/ubuntu/capstone-swarm/market-stack.yml'
          s = open(p).read()
          before, rest = s.split('  orders-api:', 1)
          orders, rest = rest.split('  catalog-api:', 1)
          catalog, after = rest.split('  db:', 1)
          orders = orders.replace('replicas: 1', 'replicas: 3', 1)
          catalog = catalog.replace('replicas: 1', 'replicas: 2', 1)
          open(p, 'w').write(before + '  orders-api:' + orders + '  catalog-api:' + catalog + '  db:' + after)
          PYCODE
          chown ubuntu:ubuntu /home/ubuntu/capstone-swarm/market-stack.yml
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Реплики, VIP и routing mesh


          Stateless API масштабируется несколькими взаимозаменяемыми tasks.
          Внутренний VIP распределяет соединения по replicas, а routing mesh
          принимает опубликованный порт на узлах и направляет трафик к task
          сервиса.

          Число desired replicas и число running tasks — разные показатели во
          время convergence. Готовность подтверждается одновременно service state
          и сквозным пользовательским запросом.
    description: |-
      # Replicas и load balancing


      #### Упражнение 1 (Задание)

      Установите не менее трёх реплик `orders-api` и двух реплик
      `catalog-api`. Через единственную внешнюю точку edge создайте заказ и
      получите его обратно, а также запросите каталог.

      ### Критерии готовности

      Проверка требует нужное число running tasks, VIP endpoint mode и рабочий
      HTTP workflow через опубликованный порт `8080`.
  - title: 07. Persistent state
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          fail() { echo "ОШИБКА: $*" >&2; exit 1; }
          mounts=$(docker service inspect --format '{{json .Spec.TaskTemplate.ContainerSpec.Mounts}}' market_db)
          jq -e '.[] | select(.Type=="volume" and .Source=="market_db-data" and .Target=="/var/lib/postgresql/data")' <<<"$mounts" >/dev/null || fail "DB volume mount неверен"
          docker volume inspect market_db-data >/dev/null || fail "Volume market_db-data отсутствует"
          created=$(curl -fsS -X POST -H 'Content-Type: application/json' -d '{"item":"checker-persistence","quantity":11}' http://127.0.0.1:8080/orders)
          id=$(jq -r '.id' <<<"$created"); old=$(docker service ps --filter desired-state=running --format '{{.ID}}' market_db | head -1)
          docker service update --force market_db >/dev/null
          out=/tmp/capstone-persistence.json
          rm -f "$out"
          for _ in $(seq 1 90); do
            new=$(docker service ps --filter desired-state=running --format '{{.ID}}' market_db | head -1)
            [ -n "$new" ] && [ "$new" != "$old" ] && curl -fsS "http://127.0.0.1:8080/orders/$id" > "$out" 2>/dev/null && break
            sleep 2
          done
          [ -s "$out" ] || fail "API не восстановился после замены DB task"
          jq -e --arg id "$id" '.id==$id and .item=="checker-persistence"' "$out" >/dev/null || fail "Данные потеряны после замены DB task"
          rm -f "$out"
          echo "OK: persistent state пережил замену DB task"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          install -d -o ubuntu -g ubuntu /home/ubuntu/capstone-swarm /home/ubuntu/capstone-swarm/evidence
          created=$(curl -fsS -X POST -H 'Content-Type: application/json' -d '{"item":"persistent-marker","quantity":7}' http://127.0.0.1:8080/orders)
          id=$(jq -r '.id' <<<"$created")
          old_task=$(docker service ps --filter desired-state=running --format '{{.ID}}' market_db | head -1)
          docker service update --force market_db >/dev/null
          new_task=
          for _ in $(seq 1 90); do
            new_task=$(docker service ps --filter desired-state=running --format '{{.ID}}' market_db | head -1)
            if [ -n "$new_task" ] && [ "$new_task" != "$old_task" ] && curl -fsS "http://127.0.0.1:8080/orders/$id" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          jq -n --arg order_id "$id" --arg old_task "$old_task" --arg new_task "$new_task" '{order_id:$order_id,old_db_task:$old_task,new_db_task:$new_task,preserved:true}' > /home/ubuntu/capstone-swarm/evidence/persistence.json
          chown ubuntu:ubuntu /home/ubuntu/capstone-swarm/evidence/persistence.json
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Stateful-сервис в single-node Swarm


          Локальный Docker volume привязан к конкретному узлу. В single-node
          лаборатории он сохраняет данные при замене task или контейнера, но в
          многоузловом production-кластере необходима внешняя replicated
          storage-система либо placement policy, удерживающая stateful task на
          узле с данными.

          Проверять persistence следует записью уникального объекта, заменой task
          базы и чтением того же объекта после восстановления.
    description: |-
      # Persistent state


      #### Упражнение 1 (Задание)

      Подключите к PostgreSQL именованный volume `market_db-data`. Докажите
      сохранение заказа после пересоздания task базы в пределах учебного
      single-node кластера.

      ### Критерии готовности

      Проверка сверяет volume mount, создаёт уникальную запись, инициирует
      замену task `market_db` и читает запись после восстановления.
  - title: 08. Rolling update
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          fail() { echo "ОШИБКА: $*" >&2; exit 1; }
          image=$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' market_orders-api)
          [[ "$image" == localhost:5000/market-orders:2.0@sha256:* || "$image" = localhost:5000/market-orders:2.0 ]] || fail "orders-api не на версии 2.0"
          [ "$(docker service inspect --format '{{.UpdateStatus.State}}' market_orders-api)" = completed ] || fail "Rolling update не завершён"
          [ "$(docker service inspect --format '{{.Spec.UpdateConfig.Parallelism}}' market_orders-api)" = 1 ] || fail "Parallelism должен быть 1"
          [ "$(docker service inspect --format '{{.Spec.UpdateConfig.Order}}' market_orders-api)" = start-first ] || fail "Update order должен быть start-first"
          shutdown=$(docker service ps --no-trunc --filter desired-state=shutdown --format '{{.ID}}' market_orders-api | wc -l)
          [ "$shutdown" -ge 1 ] || fail "Нет истории заменённых tasks"
          jq -e '.version=="2.0"' < <(curl -fsS http://127.0.0.1:8080/orders/version) >/dev/null || fail "Endpoint не сообщает 2.0"
          grep -q 'market-orders:2.0' /home/ubuntu/capstone-swarm/market-stack.yml || fail "Stack-файл не синхронизирован с 2.0"
          echo "OK: rolling update до 2.0 завершён"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          install -d -o ubuntu -g ubuntu /home/ubuntu/capstone-swarm /home/ubuntu/capstone-swarm/evidence
          cp /home/ubuntu/capstone-swarm/src/orders/app.py /home/ubuntu/capstone-swarm/src/orders/app-v2.py
          sed -i "s/VERSION=os.getenv('APP_VERSION','1.0')/VERSION=os.getenv('APP_VERSION','2.0')/" /home/ubuntu/capstone-swarm/src/orders/app-v2.py
          cat > /home/ubuntu/capstone-swarm/src/orders/Dockerfile.v2 <<'EOF'
          FROM python:3.12-alpine
          RUN pip install --no-cache-dir "psycopg[binary]==3.2.3"
          WORKDIR /app
          COPY app-v2.py /app/app.py
          USER 65532:65532
          ENTRYPOINT ["python","/app/app.py"]
          EOF
          docker build -f /home/ubuntu/capstone-swarm/src/orders/Dockerfile.v2 -t localhost:5000/market-orders:2.0 /home/ubuntu/capstone-swarm/src/orders
          docker push localhost:5000/market-orders:2.0
          docker service update --image localhost:5000/market-orders:2.0 --env-rm APP_VERSION --env-add APP_VERSION=2.0 --update-parallelism 1 --update-delay 5s --update-monitor 10s --update-failure-action pause --update-order start-first market_orders-api >/dev/null
          for _ in $(seq 1 120); do
            state=$(docker service inspect --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}' market_orders-api)
            [ "$state" = completed ] && break
            [ "$state" = paused ] && { echo "Rolling update paused" >&2; exit 1; }
            sleep 2
          done
          [ "$state" = completed ] || { echo "Rolling update timeout" >&2; exit 1; }
          sed -i 's#localhost:5000/market-orders:1.0#localhost:5000/market-orders:2.0#' /home/ubuntu/capstone-swarm/market-stack.yml
          sed -i '0,/APP_VERSION: "1.0"/s//APP_VERSION: "2.0"/' /home/ubuntu/capstone-swarm/market-stack.yml
          chown -R ubuntu:ubuntu /home/ubuntu/capstone-swarm/src /home/ubuntu/capstone-swarm/market-stack.yml
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Контролируемая смена версии


          Rolling update постепенно заменяет tasks, ограничивая параллелизм и
          наблюдая результат запуска. Порядок start-first уменьшает окно
          недоступности, если ресурсов хватает; monitor и failure action
          определяют реакцию на неисправную task.

          Успех подтверждают image в service spec, завершённый update state, новая
          версия ответа, история shutdown tasks и сохранение внешней доступности.
    description: |-
      # Rolling update


      #### Упражнение 1 (Задание)

      Подготовьте и опубликуйте `market-orders:2.0`, затем обновите
      `market_orders-api` по rolling policy: по одной task, с контролем
      здоровья, задержкой и сохранением доступности. Синхронизируйте image в
      stack-файле.

      ### Критерии готовности

      Проверка ожидает версию `2.0`, завершённый update state, параметры
      update_config, историю заменённых tasks и доступный endpoint.
  - title: 09. Rollback drill
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          fail() { echo "ОШИБКА: $*" >&2; exit 1; }
          evidence=/home/ubuntu/capstone-swarm/evidence/rollback.json
          jq -e '.bad_image|endswith("market-orders:bad")' "$evidence" >/dev/null || fail "Evidence не содержит bad image"
          failed=$(jq -r '.failed_task' "$evidence"); [ -n "$failed" ] && [ "$failed" != null ] || fail "Evidence не содержит failed task"
          docker service ps --no-trunc --format '{{.ID}} {{.CurrentState}}' market_orders-api | grep -E "^$failed .*Failed" >/dev/null || fail "Failed task не найден в истории"
          image=$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' market_orders-api); [[ "$image" == localhost:5000/market-orders:2.0* ]] || fail "Service не восстановлен на 2.0"
          [ "$(docker service inspect --format '{{.UpdateStatus.State}}' market_orders-api)" = rollback_completed ] || fail "Rollback не завершён"
          jq -e '.version=="2.0"' < <(curl -fsS http://127.0.0.1:8080/orders/version) >/dev/null || fail "Orders endpoint не восстановлен"
          echo "OK: bad release зафиксирован и rollback завершён"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          install -d -o ubuntu -g ubuntu /home/ubuntu/capstone-swarm /home/ubuntu/capstone-swarm/evidence
          install -d /home/ubuntu/capstone-swarm/src/orders-bad
          cat > /home/ubuntu/capstone-swarm/src/orders-bad/app.py <<'PYAPP'
          import sys
          print('intentional bad release',flush=True)
          sys.exit(42)
          PYAPP
          cat > /home/ubuntu/capstone-swarm/src/orders-bad/Dockerfile <<'EOF'
          FROM python:3.12-alpine
          COPY app.py /app.py
          ENTRYPOINT ["python","/app.py"]
          EOF
          docker build -t localhost:5000/market-orders:bad /home/ubuntu/capstone-swarm/src/orders-bad
          docker push localhost:5000/market-orders:bad
          docker service update --image localhost:5000/market-orders:bad --update-parallelism 1 --update-delay 1s --update-monitor 5s --update-failure-action pause market_orders-api >/dev/null
          failed_task=
          for _ in $(seq 1 90); do
            failed_task=$(docker service ps --no-trunc --format '{{.ID}} {{.CurrentState}}' market_orders-api | awk '/Failed/{print $1; exit}')
            [ -n "$failed_task" ] && break
            sleep 2
          done
          [ -n "$failed_task" ] || { echo "Bad release не создал failed task" >&2; exit 1; }
          docker service rollback market_orders-api >/dev/null
          for _ in $(seq 1 120); do
            state=$(docker service inspect --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}' market_orders-api)
            if [ "$state" = rollback_completed ] && curl -fsS http://127.0.0.1:8080/orders/version >/dev/null 2>&1; then break; fi
            sleep 2
          done
          [ "$state" = rollback_completed ] || { echo "Rollback timeout" >&2; exit 1; }
          jq -n --arg bad_image 'localhost:5000/market-orders:bad' --arg failed_task "$failed_task" --arg rollback_state "$state" '{bad_image:$bad_image,failed_task:$failed_task,rollback_state:$rollback_state,recovered_version:"2.0"}' > /home/ubuntu/capstone-swarm/evidence/rollback.json
          chown -R ubuntu:ubuntu /home/ubuntu/capstone-swarm/evidence/rollback.json /home/ubuntu/capstone-swarm/src/orders-bad
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Откат неисправного релиза


          Rollback drill проверяет не только наличие команды отката, но и
          способность распознать плохой релиз. Неисправный image должен оставить
          наблюдаемый failed task или paused update, после чего service
          возвращается к предыдущему spec.

          Evidence содержит идентификатор неуспешной task, bad image и итог
          восстановления, но не заменяет проверку реального Swarm state.
    description: |-
      # Rollback drill


      #### Упражнение 1 (Задание)

      Проведите controlled bad release для `market_orders-api`: версия должна
      приводить к неуспешным tasks или health check. Зафиксируйте отказ в
      `evidence/rollback.json`, выполните rollback к `2.0` и восстановите API.

      ### Критерии готовности

      Проверка требует failed task в истории, восстановленный image и
      endpoint, завершённое состояние rollback и структурированное evidence.
  - title: 10. Failure recovery
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          fail() { echo "ОШИБКА: $*" >&2; exit 1; }
          e=/home/ubuntu/capstone-swarm/evidence/recovery.json
          old=$(jq -r '.removed_task' "$e"); new=$(jq -r '.replacement_task' "$e")
          [ -n "$old" ] && [ -n "$new" ] && [ "$old" != "$new" ] && [ "$new" != null ] || fail "Evidence не доказывает замену task"
          docker service ps --format '{{.ID}} {{.CurrentState}}' market_catalog-api | grep -E "^$new Running" >/dev/null || fail "Replacement task не running"
          [ "$(docker service ls --filter name=market_catalog-api --format '{{.Replicas}}')" = 2/2 ] || fail "Catalog replicas не восстановлены"
          jq -e '.items|length>0' < <(curl -fsS http://127.0.0.1:8080/catalog) >/dev/null || fail "Каталог недоступен"
          echo "OK: reconciliation восстановил удалённую task"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          install -d -o ubuntu -g ubuntu /home/ubuntu/capstone-swarm /home/ubuntu/capstone-swarm/evidence
          old_task=$(docker service ps --filter desired-state=running --format '{{.ID}}' market_catalog-api | head -1)
          container=$(docker ps --filter label=com.docker.swarm.task.id="$old_task" --format '{{.ID}}' | head -1)
          [ -n "$container" ] || { echo "Контейнер task не найден" >&2; exit 1; }
          docker rm -f "$container" >/dev/null
          new_task=
          for _ in $(seq 1 90); do
            new_task=$(docker service ps --filter desired-state=running --format '{{.ID}}' market_catalog-api | grep -v "^$old_task$" | head -1)
            [ -n "$new_task" ] && [ "$(docker service ls --filter name=market_catalog-api --format '{{.Replicas}}')" = 2/2 ] && curl -fsS http://127.0.0.1:8080/catalog >/dev/null 2>&1 && break
            sleep 2
          done
          [ -n "$new_task" ] || { echo "Replacement task не создана" >&2; exit 1; }
          jq -n --arg service market_catalog-api --arg old_task "$old_task" --arg new_task "$new_task" '{service:$service,removed_task:$old_task,replacement_task:$new_task,recovered:true}' > /home/ubuntu/capstone-swarm/evidence/recovery.json
          chown ubuntu:ubuntu /home/ubuntu/capstone-swarm/evidence/recovery.json
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Reconciliation после потери task


          Reconciliation loop постоянно сравнивает desired state с observed state.
          Если контейнер task исчезает, orchestrator создаёт новую task, пока
          service снова не достигнет заданного числа replicas.

          Новая task имеет другой идентификатор. Поэтому факт recovery
          подтверждается парой ID, running replicas и доступностью
          бизнес-endpoint, а не только строкой в журнале.
    description: |-
      # Failure recovery


      #### Упражнение 1 (Задание)

      Удалите контейнер одной running task `market_catalog-api` и зафиксируйте
      идентификаторы старой и автоматически созданной task в
      `evidence/recovery.json`.

      ### Критерии готовности

      Проверка требует разные task ID, восстановленное desired количество
      реплик и доступность каталога через edge.
  - title: 11. Resource и placement policy
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          fail() { echo "ОШИБКА: $*" >&2; exit 1; }
          constraints=$(docker service inspect --format '{{json .Spec.TaskTemplate.Placement.Constraints}}' market_worker)
          jq -e 'map(gsub("[[:space:]]";"")) | index("node.role==manager")' <<<"$constraints" >/dev/null || fail "Worker constraint отсутствует"
          for service in market_worker market_orders-api market_catalog-api; do
            spec=$(docker service inspect --format '{{json .Spec.TaskTemplate.Resources}}' "$service")
            jq -e '.Reservations.NanoCPUs>0 and .Reservations.MemoryBytes>0 and .Limits.NanoCPUs>0 and .Limits.MemoryBytes>0 and .Limits.NanoCPUs>=.Reservations.NanoCPUs and .Limits.MemoryBytes>=.Reservations.MemoryBytes' <<<"$spec" >/dev/null || fail "Некорректные resources у $service"
          done
          docker stack config -c /home/ubuntu/capstone-swarm/market-stack.yml | grep -q 'node.role == manager' || fail "Policy не сохранена в stack-файле"
          echo "OK: placement и resource policy заданы"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          install -d -o ubuntu -g ubuntu /home/ubuntu/capstone-swarm /home/ubuntu/capstone-swarm/evidence
          docker service update --constraint-add 'node.role==manager' --reserve-cpu 0.10 --reserve-memory 32M --limit-cpu 0.50 --limit-memory 128M market_worker >/dev/null
          docker service update --reserve-cpu 0.10 --reserve-memory 32M --limit-cpu 0.75 --limit-memory 192M market_orders-api >/dev/null
          docker service update --reserve-cpu 0.05 --reserve-memory 16M --limit-cpu 0.50 --limit-memory 128M market_catalog-api >/dev/null
          python3 - <<'PYCODE'
          p = '/home/ubuntu/capstone-swarm/market-stack.yml'
          s = open(p).read()

          def add_before_restart(service, next_service, block):
              global s
              before, rest = s.split('  ' + service + ':', 1)
              section, after = rest.split('  ' + next_service + ':', 1)
              marker = '      restart_policy:'
              section = section.replace(marker, block + '\n' + marker, 1)
              s = before + '  ' + service + ':' + section + '  ' + next_service + ':' + after

          add_before_restart('orders-api', 'catalog-api', '''      resources:
                  reservations: {cpus: "0.10", memory: 32M}
                  limits: {cpus: "0.75", memory: 192M}''')
          add_before_restart('catalog-api', 'db', '''      resources:
                  reservations: {cpus: "0.05", memory: 16M}
                  limits: {cpus: "0.50", memory: 128M}''')
          before, worker = s.split('  worker:', 1)
          marker = '      restart_policy:'
          block = '''      placement: {constraints: [node.role == manager]}
                resources:
                  reservations: {cpus: "0.10", memory: 32M}
                  limits: {cpus: "0.50", memory: 128M}'''
          worker = worker.replace(marker, block + '\n' + marker, 1)
          open(p, 'w').write(before + '  worker:' + worker)
          PYCODE
          chown ubuntu:ubuntu /home/ubuntu/capstone-swarm/market-stack.yml
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Ограничения планировщика


          Placement constraints ограничивают множество допустимых узлов.
          Reservations участвуют в планировании и предотвращают overcommit на
          уровне scheduler, а limits ограничивают фактическое потребление task.

          В single-node стенде policy должна быть реалистичной, но достаточно
          малой, чтобы все replicas могли быть запланированы. Constraint на
          manager здесь учебный и одновременно фиксирует размещение worker.
    description: |-
      # Resource и placement policy


      #### Упражнение 1 (Задание)

      Задайте worker placement constraint на manager-узел. Для worker и API
      объявите проверяемые CPU/memory reservations и limits, не нарушающие
      работу single-node стенда.

      ### Критерии готовности

      Проверка читает service specs и сопоставляет constraint, reservations и
      limits с минимальными критериями задания.
  - title: 12. Backup artifacts
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          fail() { echo "ОШИБКА: $*" >&2; exit 1; }
          backup=/home/ubuntu/capstone-swarm/backup
          for file in market-stack.yml secrets-inventory.json configs/market_edge_routes configs/market_api_config market.sql SHA256SUMS; do [ -s "$backup/$file" ] || fail "Нет backup/$file"; done
          jq -e 'type=="array" and any(.[]; .name=="market_db_password") and all(.[]; (has("value")|not) and (has("data")|not))' "$backup/secrets-inventory.json" >/dev/null || fail "Secret inventory неверен или содержит значения"
          ! grep -q 'swarm-capstone-db-2026' "$backup/secrets-inventory.json" || fail "Inventory содержит secret value"
          grep -Eq 'CREATE TABLE public.orders|COPY public.orders' "$backup/market.sql" || fail "SQL dump не содержит orders"
          (cd "$backup" && sha256sum -c /home/ubuntu/capstone-swarm/backup/SHA256SUMS) >/dev/null || fail "Checksum не совпадает"
          echo "OK: backup artifacts полны и проверены"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          install -d -o ubuntu -g ubuntu /home/ubuntu/capstone-swarm /home/ubuntu/capstone-swarm/evidence
          rm -rf /home/ubuntu/capstone-swarm/backup
          install -d -o ubuntu -g ubuntu /home/ubuntu/capstone-swarm/backup/configs
          cp /home/ubuntu/capstone-swarm/market-stack.yml /home/ubuntu/capstone-swarm/backup/market-stack.yml
          jq -n --arg id "$(docker secret inspect --format '{{.ID}}' market_db_password)" '[{id:$id,name:"market_db_password",driver:"swarm"}]' > /home/ubuntu/capstone-swarm/backup/secrets-inventory.json
          for config in market_edge_routes market_api_config; do
            docker config inspect --format '{{.Spec.Data}}' "$config" | base64 -d > "/home/ubuntu/capstone-swarm/backup/configs/$config"
          done
          db_container=$(docker ps --filter label=com.docker.swarm.service.name=market_db --format '{{.ID}}' | head -1)
          docker exec "$db_container" pg_dump -U market -d market > /home/ubuntu/capstone-swarm/backup/market.sql
          find /home/ubuntu/capstone-swarm/backup -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > /home/ubuntu/capstone-swarm/backup/SHA256SUMS
          chown -R ubuntu:ubuntu /home/ubuntu/capstone-swarm/backup
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Резервная копия stack-level state


          Stack-level backup состоит из нескольких классов артефактов: декларация,
          inventory имён secrets без значений, экспорт обычных configs и данные
          stateful-компонента. Secret material обычно восстанавливается из
          отдельного защищённого хранилища, а не из общего архива.

          Checksums позволяют обнаружить неполный или изменённый набор. Логический
          dump PostgreSQL переносимее копирования файлов работающей базы.
    description: |-
      # Backup artifacts


      #### Упражнение 1 (Задание)

      Создайте `/home/ubuntu/capstone-swarm/backup`: копию stack declaration,
      inventory secrets без значений, экспорт configs, логический dump
      PostgreSQL и файл SHA-256 checksums.

      ### Критерии готовности

      Проверка проверяет состав, формат inventory, отсутствие значения
      секрета, непустой SQL dump и соответствие всех checksum.
  - title: 13. Final acceptance
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          fail() { echo "ОШИБКА: $*" >&2; exit 1; }
          [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = active ] || fail "Swarm не active"
          [ "$(docker stack services market --format '{{.Name}}' | wc -l)" -eq 5 ] || fail "Stack должен содержать 5 services"
          for service in edge orders-api catalog-api db worker; do
            replicas=$(docker service ls --filter name="market_$service" --format '{{.Replicas}}')
            desired=${replicas#*/}; running=${replicas%/*}; [ "$running" = "$desired" ] && [ "$desired" -gt 0 ] || fail "market_$service не converged: $replicas"
            state=$(docker service inspect --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}' "market_$service")
            [[ -z "$state" || "$state" = completed || "$state" = rollback_completed ]] || fail "market_$service имеет незавершённый update: $state"
          done
          [ "$(docker service inspect --format '{{.Spec.Mode.Replicated.Replicas}}' market_orders-api)" -ge 3 ] || fail "Недостаточно orders replicas"
          [ "$(docker service inspect --format '{{.Spec.Mode.Replicated.Replicas}}' market_catalog-api)" -ge 2 ] || fail "Недостаточно catalog replicas"
          docker secret inspect market_db_password >/dev/null || fail "DB secret отсутствует"
          docker config inspect market_edge_routes >/dev/null || fail "Routes config отсутствует"
          docker volume inspect market_db-data >/dev/null || fail "DB volume отсутствует"
          jq -e '.status=="ok"' < <(curl -fsS http://127.0.0.1:8080/health) >/dev/null || fail "Edge health failed"
          jq -e '.items|length>0' < <(curl -fsS http://127.0.0.1:8080/catalog) >/dev/null || fail "Catalog workflow failed"
          created=$(curl -fsS -X POST -H 'Content-Type: application/json' -d '{"item":"acceptance-check","quantity":3}' http://127.0.0.1:8080/orders); id=$(jq -r '.id' <<<"$created")
          jq -e --arg id "$id" '.id==$id and .item=="acceptance-check" and .quantity==3' < <(curl -fsS "http://127.0.0.1:8080/orders/$id") >/dev/null || fail "Order workflow failed"
          echo "OK: итоговая приёмка stack market пройдена"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/capstone-swarm
          install -d -o ubuntu -g ubuntu /home/ubuntu/capstone-swarm /home/ubuntu/capstone-swarm/evidence
          for _ in $(seq 1 120); do
            ready=true
            while read -r replicas; do [ "${replicas%/*}" = "${replicas#*/}" ] || ready=false; done < <(docker service ls --filter label=com.docker.stack.namespace=market --format '{{.Replicas}}')
            if $ready && curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"item":"final-acceptance","quantity":1}' http://127.0.0.1:8080/orders > /home/ubuntu/capstone-swarm/evidence/final-order.json
          chown ubuntu:ubuntu /home/ubuntu/capstone-swarm/evidence/final-order.json
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          # Приёмка платформы как SRE


          Итоговая приёмка рассматривает платформу как единое целое: control plane
          активен, desired state достигнут, обновления завершены, сеть ограничена,
          state сохраняется, а пользовательский workflow проходит через публичную
          точку входа.

          SRE-проверка соединяет инфраструктурные assertions и synthetic
          transaction. Отдельно успешный контейнер или HTTP health не доказывает
          готовность всей платформы.
    description: |-
      # Final acceptance


      #### Упражнение 1 (Задание)

      Оставьте stack `market` работающим. Edge должен обслуживать health,
      каталог и полный цикл заказа; данные должны находиться в persistent DB,
      API — иметь требуемые реплики, а Swarm — не содержать незавершённых
      обновлений.

      ### Критерии готовности

      Проверка выполняет комплексный acceptance: состояние узла,
      services/tasks, сети, secrets/configs, volume, policies и HTTP workflow.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 14
- title: Linux namespaces как основа изоляции контейнеров
  description: |-
    # Linux namespaces как основа изоляции контейнеров

    Лабораторная показывает контейнер как группу обычных Linux-процессов с
    разным представлением системных ресурсов. Вы последовательно исследуете
    UTS, PID, mount, IPC, network, user и cgroup namespaces, а также наличие
    time namespace, после чего сопоставите ручные эксперименты с контейнером
    Docker.

    Рабочий каталог — `/home/ubuntu/ns-lab`. Проверяемые наблюдения
    сохраняются в `/home/ubuntu/ns-lab/evidence` в формате JSON. Все
    эксперименты выполняются только в выделенной учебной виртуальной машине.
  time-limit-minutes: 180
  steps:
  - title: 01. Инвентаризация namespaces хоста
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/ns-lab /home/ubuntu/ns-lab/evidence /home/ubuntu/ns-lab/state
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/bin/bash
          source /usr/local/lib/ns-lab/check-common.bash
          f=/home/ubuntu/ns-lab/evidence/01-inventory.json
          require_json "$f"
          /usr/bin/jq -e '(.shell_pid|type)=="number" and (.host_hostname|length)>0 and (.observed_types|length)>=2 and (.processes|type)=="array" and (.processes|length)>=1 and all(.processes[]; (.namespaces|type)=="object")' "$f" >/dev/null || fail "evidence не содержит обязательную инвентаризацию"
          /usr/bin/jq -e '[.processes[].namespaces[]] | map(select(type=="string" and test("^[a-z_]+:\\[[0-9]+\\]$"))) | length >= 2' "$f" >/dev/null || fail "namespace handles пусты или имеют неверный формат"
          pass "инвентаризация namespaces сохранена"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/bin/bash
          set -euo pipefail
          f=/home/ubuntu/ns-lab/evidence/01-inventory.json
          shell_pid=$(/usr/bin/pgrep -u ubuntu -n -x bash || /usr/bin/pgrep -u ubuntu -n -x sh)
          docker_pid=$(/usr/bin/pgrep -o -x dockerd || /usr/bin/printf '0')
          /usr/bin/python3 -c 'import json,os,pathlib,socket,sys
          pids=[int(sys.argv[1])]+([int(sys.argv[2])] if int(sys.argv[2]) else [])
          procs=[]
          for pid in pids:
           d=pathlib.Path(f"/proc/{pid}/ns")
           if d.exists(): procs.append({"pid":pid,"namespaces":{p.name:os.readlink(p) for p in d.iterdir()}})
          types=sorted({k for p in procs for k in p["namespaces"]})
          pathlib.Path(sys.argv[3]).write_text(json.dumps({"shell_pid":pids[0],"docker_pid":pids[1] if len(pids)>1 else None,"host_hostname":socket.gethostname(),"observed_types":types,"processes":procs},indent=2)+"\n")' "$shell_pid" "$docker_pid" "$f"
          /usr/bin/chown ubuntu:ubuntu "$f"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Ядро публикует ссылки на пространства имён каждого процесса в
          `/proc/<pid>/ns`. Текст ссылки содержит тип и inode-подобный
          идентификатор. Если у двух процессов для одного типа совпадает этот
          идентификатор, они используют одно пространство имён данного типа.

          В современных ядрах здесь встречаются UTS, PID, mount, IPC, network,
          user, cgroup и time namespaces. Наличие файлов `time` и
          `time_for_children` зависит от версии ядра. Сравнивать нужно конкретные
          handles, а не только числовые PID процессов.

          Namespace продолжает существовать, пока к нему относится хотя бы один
          процесс, открыт file descriptor на его handle или handle закреплён bind
          mount. Поэтому завершение процесса обычно уничтожает эксперимент, но
          открытая ссылка может намеренно продлить его жизнь.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Создайте `/home/ubuntu/ns-lab/evidence/01-inventory.json`. Запишите PID
      своего shell и PID Docker daemon либо диагностического процесса, а для
      каждого доступного процесса — объект `namespaces` с handles из
      `/proc/<pid>/ns`.

      Добавьте поля `host_hostname` и `observed_types`. В `observed_types`
      должны присутствовать как минимум два реально найденных типа namespace;
      пустые строки и условные значения не принимаются.
  - title: 02. UTS namespace и hostname процесса
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/ns-lab /home/ubuntu/ns-lab/evidence /home/ubuntu/ns-lab/state
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/bin/bash
          source /usr/local/lib/ns-lab/check-common.bash
          require_feature uts
          f=/home/ubuntu/ns-lab/evidence/02-uts.json; p=$(live_pid_file /home/ubuntu/ns-lab/state/02-uts.pid); require_json "$f"
          [[ "$(/bin/hostname)" != "$(/usr/bin/nsenter -t "$p" -u /bin/hostname)" ]] || fail "hostname хоста и namespace совпадают"
          [[ "$(/usr/bin/nsenter -t "$p" -u /bin/hostname)" == ns-uts-lab ]] || fail "внутри ожидался hostname ns-uts-lab"
          [[ "$(/usr/bin/readlink /proc/1/ns/uts)" != "$(/usr/bin/readlink "/proc/$p/ns/uts")" ]] || fail "UTS namespace не отделён"
          /usr/bin/jq -e --argjson p "$p" '.pid==$p and .inside_hostname=="ns-uts-lab" and .inside_uts != .host_uts' "$f" >/dev/null || fail "evidence UTS не соответствует процессу"
          pass "UTS namespace и hostname изолированы"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/bin/bash
          set -euo pipefail
          f=/home/ubuntu/ns-lab/evidence/02-uts.json; pf=/home/ubuntu/ns-lab/state/02-uts.pid
          /usr/bin/unshare --uts /bin/bash -c '/bin/hostname ns-uts-lab; exec /usr/local/lib/ns-lab/ns-demo /home/ubuntu/ns-lab/evidence/02-uts-inner.json uts' & p=$!
          /usr/bin/printf '%s\n' "$p" > "$pf"; /usr/bin/sleep 1
          /usr/bin/jq -n --argjson pid "$p" --arg inside_hostname "$(/usr/bin/nsenter -t "$p" -u /bin/hostname)" --arg host_hostname "$(/bin/hostname)" --arg inside_uts "$(/usr/bin/readlink "/proc/$p/ns/uts")" --arg host_uts "$(/usr/bin/readlink /proc/1/ns/uts)" '{pid:$pid,inside_hostname:$inside_hostname,host_hostname:$host_hostname,inside_uts:$inside_uts,host_uts:$host_uts}' > "$f"
          /usr/bin/chown ubuntu:ubuntu "$f" "$pf"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          UTS namespace изолирует hostname и NIS domainname, которые видит группа
          процессов. Изменение hostname внутри отдельного UTS namespace не меняет
          hostname хоста, хотя процессы используют то же ядро.

          Изоляция определяется не строкой hostname, а отдельным UTS handle.
          Поэтому корректное доказательство сочетает наблюдение имени изнутри, имя
          хоста снаружи и сравнение ссылок `/proc/<pid>/ns/uts`.

          Docker и OCI runtime создают UTS namespace при запуске контейнера и
          устанавливают hostname до старта полезной нагрузки.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Запустите долгоживущий диагностический процесс в отдельном UTS namespace
      с hostname `ns-uts-lab`. Сохраните его внешний PID в
      `/home/ubuntu/ns-lab/state/02-uts.pid`.

      Создайте evidence `02-uts.json` с полями `pid`, `inside_hostname`,
      `host_hostname`, `inside_uts` и `host_uts`. Процесс должен оставаться
      живым до проверки.
  - title: 03. PID namespace и роль процесса 1
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/ns-lab /home/ubuntu/ns-lab/evidence /home/ubuntu/ns-lab/state
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/bin/bash
          source /usr/local/lib/ns-lab/check-common.bash
          require_feature pid
          f=/home/ubuntu/ns-lab/evidence/03-pid.json; p=$(live_pid_file /home/ubuntu/ns-lab/state/03-pid.pid); require_json "$f"
          nspid=$(/usr/bin/awk '/^NSpid:/{print $NF}' "/proc/$p/status")
          [[ "$nspid" == 1 ]] || fail "первый процесс имеет внутренний PID $nspid вместо 1"
          /usr/bin/jq -e --argjson p "$p" '.outer_pid==$p and .inner_pid==1 and (.nspid|last)==1 and (.visible_processes|length)>=1' "$f" >/dev/null || fail "evidence PID namespace неполон"
          pass "процесс PID namespace выполняет роль PID 1"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/bin/bash
          set -euo pipefail
          f=/home/ubuntu/ns-lab/evidence/03-pid.json; pf=/home/ubuntu/ns-lab/state/03-pid.pid
          /usr/bin/unshare --pid --fork --mount-proc /usr/local/lib/ns-lab/ns-demo /home/ubuntu/ns-lab/evidence/03-pid-inner.json pid & launcher=$!
          /usr/bin/sleep 1; p=$(/usr/bin/pgrep -P "$launcher" | /usr/bin/head -n1); [[ -n "$p" ]] || p="$launcher"; /usr/bin/printf '%s\n' "$p" > "$pf"
          nspid=$(/usr/bin/awk '/^NSpid:/{for(i=2;i<=NF;i++) printf "%s%s",$i,(i<NF?",":"")}' "/proc/$p/status")
          visible=$(/usr/bin/nsenter -t "$p" -p -m /bin/ps -e -o pid=,comm= --no-headers | /usr/bin/jq -Rsc 'split("\n")|map(select(length>0))')
          /usr/bin/jq -n --argjson outer "$p" --arg nspid "$nspid" --argjson visible "$visible" '{outer_pid:$outer,inner_pid:1,nspid:($nspid|split(",")|map(tonumber)),visible_processes:$visible}' > "$f"; /usr/bin/chown ubuntu:ubuntu "$f" "$pf"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          PID namespace меняет видимое дерево процессов. Один процесс получает PID
          хоста и одновременно PID в каждом вложенном пространстве; ядро
          показывает эту цепочку в поле `NSpid` файла status.

          Первый процесс нового PID namespace имеет внутренний PID 1 и выполняет
          обязанности init: принимает осиротевших потомков и должен собирать
          завершившиеся процессы. Его завершение приводит к остановке оставшихся
          процессов этого namespace.

          Runtime контейнера обычно запускает полезную нагрузку как PID 1, поэтому
          обработка сигналов и reaping являются частью корректного дизайна
          контейнерного приложения.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Запустите `ns-demo` как первый долгоживущий процесс отдельного PID
      namespace. Сохраните внешний PID в `state/03-pid.pid`.

      Evidence `03-pid.json` должен содержать `outer_pid`, `inner_pid`,
      `nspid` и массив `visible_processes`, полученный изнутри namespace.
      Внутренний PID первого процесса должен отражать init-поведение.
  - title: 04. Mount namespace и отдельная таблица монтирования
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/ns-lab /home/ubuntu/ns-lab/evidence /home/ubuntu/ns-lab/state
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/bin/bash
          source /usr/local/lib/ns-lab/check-common.bash
          require_feature mount
          f=/home/ubuntu/ns-lab/evidence/04-mount.json; p=$(live_pid_file /home/ubuntu/ns-lab/state/04-mount.pid); require_json "$f"
          /usr/bin/nsenter -t "$p" -m /usr/bin/mountpoint -q /home/ubuntu/ns-lab/mnt/private || fail "mount отсутствует внутри namespace"
          /usr/bin/mountpoint -q /home/ubuntu/ns-lab/mnt/private && fail "mount распространился на хост"
          /usr/bin/jq -e '.mountpoint=="/home/ubuntu/ns-lab/mnt/private" and .inside_present==true and .host_present==false and (.inside_mountinfo|length)>0' "$f" >/dev/null || fail "evidence mountinfo неверен"
          pass "таблица монтирования изолирована"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/bin/bash
          set -euo pipefail
          f=/home/ubuntu/ns-lab/evidence/04-mount.json; pf=/home/ubuntu/ns-lab/state/04-mount.pid; mp=/home/ubuntu/ns-lab/mnt/private
          /usr/bin/unshare --mount /bin/bash -c '/bin/mount --make-rprivate /; /bin/mount -t tmpfs -o size=4m ns-lab-tmpfs /home/ubuntu/ns-lab/mnt/private; exec /usr/local/lib/ns-lab/ns-demo /home/ubuntu/ns-lab/evidence/04-mount-inner.json mount' & p=$!
          /usr/bin/printf '%s\n' "$p" > "$pf"; /usr/bin/sleep 1
          lines=$(/usr/bin/nsenter -t "$p" -m /bin/cat /proc/self/mountinfo | /bin/grep -F " $mp " | /usr/bin/jq -Rsc 'split("\n")|map(select(length>0))')
          /usr/bin/jq -n --argjson pid "$p" --arg mp "$mp" --argjson lines "$lines" '{pid:$pid,mountpoint:$mp,inside_present:true,host_present:false,inside_mountinfo:$lines}' > "$f"; /usr/bin/chown ubuntu:ubuntu "$f" "$pf"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Mount namespace изолирует таблицу монтирования, а не содержимое файлов
          как таковое. Один и тот же каталог может иметь разные mount overlays для
          разных групп процессов.

          После создания namespace важно учитывать propagation. Shared mount может
          распространять события между peers, поэтому для локального эксперимента
          корневое дерево обычно переводят в private или slave-режим до создания
          временного mount.

          Надёжное наблюдение выполняется через `mountinfo`: запись должна
          существовать изнутри namespace и отсутствовать в таблице хостового
          процесса.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Создайте долгоживущий процесс с отдельным mount namespace. Внутри него
      разместите временную файловую систему на
      `/home/ubuntu/ns-lab/mnt/private`, не допуская появления этого mount на
      хосте.

      Сохраните PID в `state/04-mount.pid`, а в `04-mount.json` — поля `pid`,
      `mountpoint`, `inside_present`, `host_present` и относящиеся к точке
      строки `inside_mountinfo`.
  - title: 05. procfs внутри PID namespace
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/ns-lab /home/ubuntu/ns-lab/evidence /home/ubuntu/ns-lab/state
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/bin/bash
          source /usr/local/lib/ns-lab/check-common.bash
          require_feature pid
          f=/home/ubuntu/ns-lab/evidence/05-procfs.json; p=$(live_pid_file /home/ubuntu/ns-lab/state/05-procfs.pid); require_json "$f"
          [[ "$(/usr/bin/awk '/^NSpid:/{print $NF}' "/proc/$p/status")" == 1 ]] || fail "процесс не является PID 1"
          /usr/bin/nsenter -t "$p" -p -m /usr/bin/mountpoint -q /proc || fail "procfs не смонтирован"
          /usr/bin/jq -e '.inner_pid==1 and (.visible_pids|length)>=1 and (.visible_pids|length)<20 and ([.visible_commands[] | test("systemd|dockerd")] | any | not)' "$f" >/dev/null || fail "список процессов не ограничен namespace"
          pass "procfs соответствует PID namespace"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/bin/bash
          set -euo pipefail
          f=/home/ubuntu/ns-lab/evidence/05-procfs.json; pf=/home/ubuntu/ns-lab/state/05-procfs.pid
          /usr/bin/unshare --pid --fork --mount --mount-proc /usr/local/lib/ns-lab/ns-demo /home/ubuntu/ns-lab/evidence/05-procfs-inner.json procfs & launcher=$!
          /usr/bin/sleep 1; p=$(/usr/bin/pgrep -P "$launcher" | /usr/bin/head -n1); [[ -n "$p" ]] || p="$launcher"; /usr/bin/printf '%s\n' "$p" > "$pf"
          rows=$(/usr/bin/nsenter -t "$p" -p -m /bin/ps -e -o pid=,comm= --no-headers)
          pids=$(/usr/bin/printf '%s\n' "$rows" | /usr/bin/awk '{print $1}' | /usr/bin/jq -Rsc 'split("\n")|map(select(length>0)|tonumber)'); cmds=$(/usr/bin/printf '%s\n' "$rows" | /usr/bin/awk '{print $2}' | /usr/bin/jq -Rsc 'split("\n")|map(select(length>0))')
          /usr/bin/jq -n --argjson outer "$p" --argjson pids "$pids" --argjson cmds "$cmds" '{outer_pid:$outer,inner_pid:1,proc_mount:"/proc",visible_pids:$pids,visible_commands:$cmds}' > "$f"; /usr/bin/chown ubuntu:ubuntu "$f" "$pf"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Файлы procfs формируются относительно PID namespace того процесса,
          который смонтировал и читает `/proc`. Если новый PID namespace
          использует старый host procfs, команды диагностики покажут хостовые
          процессы и создадут ложное впечатление отсутствия изоляции.

          Поэтому PID isolation почти всегда сочетают с mount namespace и новым
          mount procfs. Опция runtime, отвечающая за procfs, автоматизирует именно
          эту связку.

          В ограниченном списке обычно видны init namespace, диагностическая
          команда и минимальные служебные процессы, но не systemd и Docker daemon
          хоста.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Запустите отдельный PID namespace вместе с отдельным mount namespace и
      procfs, соответствующим этому PID namespace. Процесс должен оставаться
      живым, а его host PID сохраните в `state/05-procfs.pid`.

      В `05-procfs.json` сохраните `outer_pid`, `inner_pid`, `proc_mount`,
      массив `visible_pids` и массив `visible_commands`. Host-only процессы не
      должны попадать в это наблюдение.
  - title: 06. IPC namespace
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/ns-lab /home/ubuntu/ns-lab/evidence /home/ubuntu/ns-lab/state
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/bin/bash
          source /usr/local/lib/ns-lab/check-common.bash
          require_feature ipc
          f=/home/ubuntu/ns-lab/evidence/06-ipc.json; p=$(live_pid_file /home/ubuntu/ns-lab/state/06-ipc.pid); require_json "$f"
          qid=$(/usr/bin/jq -r '.queue_id' "$f")
          /usr/bin/nsenter -t "$p" -i /usr/bin/ipcs -q | /bin/grep -Eq "[[:space:]]$qid[[:space:]]" || fail "очередь не видна внутри IPC namespace"
          /usr/bin/ipcs -q | /bin/grep -Eq "[[:space:]]$qid[[:space:]]" && fail "очередь видна на хосте"
          /usr/bin/jq -e '.inside_visible==true and .host_visible==false and (.ipc_handle|test("^ipc:\\[[0-9]+\\]$"))' "$f" >/dev/null || fail "evidence IPC неверен"
          pass "System V IPC object изолирован"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/bin/bash
          set -euo pipefail
          f=/home/ubuntu/ns-lab/evidence/06-ipc.json; pf=/home/ubuntu/ns-lab/state/06-ipc.pid
          /usr/bin/unshare --ipc /bin/bash -c 'qid=$(/usr/bin/ipcmk -Q | /usr/bin/awk "{print \$NF}"); /usr/bin/printf "%s\n" "$qid" > /home/ubuntu/ns-lab/state/06-ipc.qid; exec /usr/local/lib/ns-lab/ns-demo /home/ubuntu/ns-lab/evidence/06-ipc-inner.json ipc' & p=$!
          /usr/bin/printf '%s\n' "$p" > "$pf"; /usr/bin/sleep 1; qid=$(/usr/bin/cat /home/ubuntu/ns-lab/state/06-ipc.qid)
          /usr/bin/jq -n --argjson pid "$p" --arg handle "$(/usr/bin/readlink "/proc/$p/ns/ipc")" --argjson qid "$qid" '{pid:$pid,ipc_handle:$handle,queue_id:$qid,inside_visible:true,host_visible:false}' > "$f"; /usr/bin/chown ubuntu:ubuntu "$f" "$pf" /home/ubuntu/ns-lab/state/06-ipc.qid
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          IPC namespace изолирует System V message queues, semaphore sets,
          shared-memory segments и POSIX message queues. Это особенно важно для
          legacy-приложений, которые используют глобальные числовые ключи.

          Одинаковый IPC key в двух namespaces не означает общий объект. Проверка
          должна сопоставлять inspection изнутри с host-side inspection, а не
          полагаться только на успешное создание.

          Docker создаёт отдельный IPC namespace по умолчанию, но допускает явное
          совместное использование, когда приложениям действительно нужен общий
          IPC context.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Создайте System V message queue в отдельном IPC namespace и удерживайте
      процесс namespace живым. Запишите host PID процесса в
      `state/06-ipc.pid`.

      Evidence `06-ipc.json` должен содержать `pid`, `ipc_handle`, `queue_id`,
      `inside_visible` и `host_visible`. Очередь должна быть видна внутри и
      отсутствовать при host-side inspection.
  - title: 07. Network namespace без Docker
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/ns-lab /home/ubuntu/ns-lab/evidence /home/ubuntu/ns-lab/state
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/bin/bash
          source /usr/local/lib/ns-lab/check-common.bash
          require_feature network
          f=/home/ubuntu/ns-lab/evidence/07-network.json; require_json "$f"
          /usr/sbin/ip netns list | /bin/grep -Eq '^ns-lab-net([[:space:]]|$)' || fail "network namespace ns-lab-net отсутствует"
          /usr/sbin/ip netns exec ns-lab-net /usr/bin/curl -fsS http://10.203.0.2:8080/health | /usr/bin/jq -e '.service=="ns-http"' >/dev/null || fail "HTTP endpoint недоступен внутри namespace"
          /usr/bin/jq -e '.namespace=="ns-lab-net" and (.interfaces|length)>=2 and (.routes|type)=="array" and (.http_response.service=="ns-http")' "$f" >/dev/null || fail "network evidence неполон"
          pass "network namespace и HTTP workload работают"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/bin/bash
          set -euo pipefail
          f=/home/ubuntu/ns-lab/evidence/07-network.json; pf=/home/ubuntu/ns-lab/state/07-network.pid
          /usr/sbin/ip netns del ns-lab-net 2>/dev/null || true; /usr/sbin/ip link del ns-lab-host 2>/dev/null || true
          /usr/sbin/ip netns add ns-lab-net; /usr/sbin/ip link add ns-lab-host type veth peer name ns-lab-guest; /usr/sbin/ip link set ns-lab-guest netns ns-lab-net
          /usr/sbin/ip addr add 10.203.0.1/24 dev ns-lab-host; /usr/sbin/ip link set ns-lab-host up
          /usr/sbin/ip netns exec ns-lab-net /usr/sbin/ip link set lo up; /usr/sbin/ip netns exec ns-lab-net /usr/sbin/ip addr add 10.203.0.2/24 dev ns-lab-guest; /usr/sbin/ip netns exec ns-lab-net /usr/sbin/ip link set ns-lab-guest up
          /usr/sbin/ip netns exec ns-lab-net /usr/local/lib/ns-lab/ns-http --bind 10.203.0.2 --port 8080 & p=$!; /usr/bin/printf '%s\n' "$p" > "$pf"; /usr/bin/sleep 1
          interfaces=$(/usr/sbin/ip netns exec ns-lab-net /usr/sbin/ip -j addr); routes=$(/usr/sbin/ip netns exec ns-lab-net /usr/sbin/ip -j route); response=$(/usr/sbin/ip netns exec ns-lab-net /usr/bin/curl -fsS http://10.203.0.2:8080/health)
          /usr/bin/jq -n --argjson pid "$p" --argjson interfaces "$interfaces" --argjson routes "$routes" --argjson response "$response" '{namespace:"ns-lab-net",pid:$pid,interfaces:$interfaces,routes:$routes,http_url:"http://10.203.0.2:8080/health",http_response:$response}' > "$f"; /usr/bin/chown ubuntu:ubuntu "$f" "$pf"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Network namespace имеет собственные interfaces, адреса, routes, sockets
          и firewall state. Сразу после создания в нём есть выключенный loopback,
          но нет готовой связи с хостом.

          Пара veth действует как виртуальный кабель между namespaces. Назначение
          адресов, включение links и добавление routes превращают primitives ядра
          в сеть процесса. Docker bridge networking автоматизирует создание veth,
          подключение к bridge, маршруты и правила NAT.

          HTTP-процесс в этой работе доказывает не только конфигурацию интерфейса,
          но и реальную локальную доставку трафика внутри namespace.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Создайте именованный network namespace `ns-lab-net`, настройте loopback
      и veth-связь с адресом `10.203.0.2/24` на стороне namespace. Запустите
      там `ns-http` на TCP-порту 8080.

      Сохраните PID в `state/07-network.pid`. В `07-network.json` запишите
      `namespace`, `pid`, массивы `interfaces` и `routes`, а также `http_url`
      и `http_response`. Endpoint должен отвечать из network namespace.
  - title: 08. User namespace и отображение UID/GID
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/ns-lab /home/ubuntu/ns-lab/evidence /home/ubuntu/ns-lab/state
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/bin/bash
          source /usr/local/lib/ns-lab/check-common.bash
          require_feature user
          f=/home/ubuntu/ns-lab/evidence/08-user.json; p=$(live_pid_file /home/ubuntu/ns-lab/state/08-user.pid); require_json "$f"
          host_uid=$(/usr/bin/awk '/^Uid:/{print $2}' "/proc/$p/status")
          [[ "$host_uid" != 0 ]] || fail "процесс имеет host-root privileges"
          /usr/bin/jq -e --argjson p "$p" --argjson uid "$host_uid" '.pid==$p and .inside_uid==0 and .inside_gid==0 and .host_uid==$uid and .host_uid!=0 and (.uid_map|length)>0 and (.gid_map|length)>0' "$f" >/dev/null || fail "UID/GID mapping evidence неверен"
          pass "root внутри user namespace не является root хоста"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/bin/bash
          set -euo pipefail
          f=/home/ubuntu/ns-lab/evidence/08-user.json; pf=/home/ubuntu/ns-lab/state/08-user.pid
          /usr/bin/setpriv --reuid=ubuntu --regid=ubuntu --init-groups /usr/bin/unshare --user --map-root-user /bin/bash -c '/usr/bin/jq -n --argjson pid "$$" --argjson uid "$(/usr/bin/id -u)" --argjson gid "$(/usr/bin/id -g)" --arg uid_map "$(/bin/cat /proc/self/uid_map)" --arg gid_map "$(/bin/cat /proc/self/gid_map)" "{pid:\$pid,inside_uid:\$uid,inside_gid:\$gid,host_uid:1000,uid_map:\$uid_map,gid_map:\$gid_map}" > /home/ubuntu/ns-lab/evidence/08-user.json; exec /usr/local/lib/ns-lab/ns-demo /home/ubuntu/ns-lab/evidence/08-user-inner.json user' & p=$!
          /usr/bin/printf '%s\n' "$p" > "$pf"; /usr/bin/sleep 1; host_uid=$(/usr/bin/awk '/^Uid:/{print $2}' "/proc/$p/status"); /usr/bin/jq --argjson p "$p" --argjson uid "$host_uid" '.pid=$p|.host_uid=$uid' "$f" > /tmp/ns-lab-user.json; /bin/mv /tmp/ns-lab-user.json "$f"; /usr/bin/chown ubuntu:ubuntu "$f" "$pf"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          User namespace отделяет идентификаторы и capabilities процесса от хоста.
          Процесс может видеть UID 0 и иметь capabilities относительно ресурсов
          своего user namespace, оставаясь обычным непривилегированным UID на
          хосте.

          Файлы `uid_map` и `gid_map` описывают диапазоны соответствия между
          внутренними и внешними идентификаторами. Именно карта, а не вывод одной
          команды, доказывает модель привилегий.

          Root внутри user namespace не равен host root: операции над ресурсами,
          принадлежащими initial user namespace, по-прежнему ограничены.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      От имени `ubuntu` запустите долгоживущий процесс в новом user namespace
      так, чтобы внутри он видел UID и GID 0. Сохраните host PID в
      `state/08-user.pid`.

      В `08-user.json` запишите `pid`, `inside_uid`, `inside_gid`, `host_uid`,
      `uid_map` и `gid_map`. Host-side UID процесса не должен быть равен 0.
  - title: 09. Cgroup namespace
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/ns-lab /home/ubuntu/ns-lab/evidence /home/ubuntu/ns-lab/state
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/bin/bash
          source /usr/local/lib/ns-lab/check-common.bash
          f=/home/ubuntu/ns-lab/evidence/09-cgroup.json; require_json "$f"
          status=$(/usr/bin/jq -r '.status' "$f")
          if [[ "$status" == unavailable ]]; then
            [[ "$(feature_status cgroup)" == unavailable ]] || fail "cgroup namespace доступен, unavailable не принимается"
            /usr/bin/jq -e '(.reason|length)>0' "$f" >/dev/null || fail "нет причины недоступности"
            pass "недоступность cgroup namespace корректно зафиксирована"; exit 0
          fi
          p=$(live_pid_file /home/ubuntu/ns-lab/state/09-cgroup.pid)
          [[ "$(/usr/bin/readlink /proc/1/ns/cgroup)" != "$(/usr/bin/readlink "/proc/$p/ns/cgroup")" ]] || fail "cgroup namespace не отделён"
          /usr/bin/jq -e --argjson p "$p" '.status=="supported" and .pid==$p and (.host_cgroup|length)>0 and (.inside_cgroup|length)>0 and .host_handle != .inside_handle' "$f" >/dev/null || fail "cgroup evidence неверен"
          pass "cgroup view изолирован"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/bin/bash
          set -euo pipefail
          f=/home/ubuntu/ns-lab/evidence/09-cgroup.json; pf=/home/ubuntu/ns-lab/state/09-cgroup.pid
          if [[ "$(/usr/bin/jq -r '.features.cgroup.status' /home/ubuntu/ns-lab/capabilities.json)" != supported ]]; then reason=$(/usr/bin/jq -r '.features.cgroup.reason' /home/ubuntu/ns-lab/capabilities.json); /usr/bin/jq -n --arg reason "$reason" '{status:"unavailable",reason:$reason}' > "$f"; /usr/bin/chown ubuntu:ubuntu "$f"; exit 0; fi
          /usr/bin/unshare --cgroup /usr/local/lib/ns-lab/ns-demo /home/ubuntu/ns-lab/evidence/09-cgroup-inner.json cgroup & p=$!; /usr/bin/printf '%s\n' "$p" > "$pf"; /usr/bin/sleep 1
          inside=$(/usr/bin/nsenter -t "$p" -C /bin/cat /proc/self/cgroup | /usr/bin/jq -Rsc 'split("\n")|map(select(length>0))'); host=$(/bin/cat /proc/1/cgroup | /usr/bin/jq -Rsc 'split("\n")|map(select(length>0))')
          /usr/bin/jq -n --argjson pid "$p" --argjson host "$host" --argjson inside "$inside" --arg hh "$(/usr/bin/readlink /proc/1/ns/cgroup)" --arg ih "$(/usr/bin/readlink "/proc/$p/ns/cgroup")" '{status:"supported",pid:$pid,host_cgroup:$host,inside_cgroup:$inside,host_handle:$hh,inside_handle:$ih}' > "$f"; /usr/bin/chown ubuntu:ubuntu "$f" "$pf"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Cgroup namespace виртуализирует представление путей cgroup в
          `/proc/<pid>/cgroup`. Корень cgroup процесса может выглядеть как `/`
          внутри namespace, хотя с хоста процесс находится глубже в иерархии.

          Сам cgroup namespace не задаёт лимиты CPU или памяти. Ограничения
          создаёт cgroup controller и его файлы; namespace лишь меняет видимость и
          уменьшает утечку деталей host hierarchy.

          Поддержка зависит от ядра и ограничений nested VM. Корректный результат
          в неподдерживаемой среде — структурированная запись о недоступности с
          диагностикой, а не неясное падение.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Сравните cgroup view хостового процесса и долгоживущего процесса в новом
      cgroup namespace. При поддержке сохраните PID в `state/09-cgroup.pid` и
      заполните `09-cgroup.json` полями `status`, `pid`, `host_cgroup`,
      `inside_cgroup`, `host_handle`, `inside_handle`.

      Если feature запрещена средой, сохраните `status: unavailable` и
      непустое поле `reason`, основанное на фактической проверке.
  - title: 10. Связь Docker container inspect с namespaces
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/ns-lab /home/ubuntu/ns-lab/evidence /home/ubuntu/ns-lab/state
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/bin/bash
          source /usr/local/lib/ns-lab/check-common.bash
          require_feature docker
          f=/home/ubuntu/ns-lab/evidence/10-docker.json; require_json "$f"
          /usr/bin/docker inspect ns-docker-demo >/dev/null 2>&1 || fail "контейнер ns-docker-demo отсутствует"
          running=$(/usr/bin/docker inspect -f '{{.State.Running}}' ns-docker-demo); [[ "$running" == true ]] || fail "контейнер не запущен"
          p=$(/usr/bin/docker inspect -f '{{.State.Pid}}' ns-docker-demo); [[ -d "/proc/$p" ]] || fail "host PID контейнера отсутствует"
          /usr/bin/jq -e --argjson p "$p" '.container=="ns-docker-demo" and .running==true and .host_pid==$p and (.image|length)>0 and ([.namespaces|keys[]] | length)>=6' "$f" >/dev/null || fail "Docker namespace evidence неверен"
          pass "Docker container сопоставлен с host namespaces"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/bin/bash
          set -euo pipefail
          f=/home/ubuntu/ns-lab/evidence/10-docker.json
          /usr/bin/docker rm -f ns-docker-demo >/dev/null 2>&1 || true
          image=busybox:1.36
          /usr/bin/docker image inspect "$image" >/dev/null 2>&1 || /usr/bin/docker pull "$image" >/dev/null
          /usr/bin/docker run -d --name ns-docker-demo "$image" /bin/sh -c 'while :; do sleep 30; done' >/dev/null
          p=$(/usr/bin/docker inspect -f '{{.State.Pid}}' ns-docker-demo); image=$(/usr/bin/docker inspect -f '{{.Config.Image}}' ns-docker-demo)
          /usr/bin/python3 -c 'import json,os,pathlib,sys
          p=int(sys.argv[1]); ns={x.name:os.readlink(x) for x in pathlib.Path(f"/proc/{p}/ns").iterdir()}
          pathlib.Path(sys.argv[3]).write_text(json.dumps({"container":"ns-docker-demo","running":True,"host_pid":p,"image":sys.argv[2],"namespaces":ns},indent=2)+"\n")' "$p" "$image" "$f"
          /usr/bin/chown ubuntu:ubuntu "$f"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Docker скрывает последовательность clone, unshare, mount и network setup
          за lifecycle контейнера. Однако контейнерная нагрузка остаётся
          Linux-процессом, host PID которого доступен через inspect.

          По host PID можно исследовать `/proc/<pid>/ns` теми же средствами, что
          использовались вручную. Совпадение или различие handles также объясняет
          режимы вроде host network или совместного PID namespace.

          На более низком уровне containerd управляет lifecycle и snapshots, а
          runc применяет OCI configuration и создаёт namespaces перед exec
          полезной нагрузки.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Запустите долгоживущий контейнер с именем `ns-docker-demo`. Получите его
      host PID через Docker inspect и не останавливайте контейнер до проверки.

      Создайте `10-docker.json` с полями `container`, `running`, `host_pid`,
      `image` и объектом `namespaces`, содержащим handles контейнерного
      процесса. Сопоставьте их с host process namespaces.
  - title: 11. Очистка namespace-экспериментов
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/ns-lab /home/ubuntu/ns-lab/evidence /home/ubuntu/ns-lab/state
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/bin/bash
          source /usr/local/lib/ns-lab/check-common.bash
          f=/home/ubuntu/ns-lab-cleanup.json; require_json "$f"
          [[ ! -e /home/ubuntu/ns-lab ]] || fail "рабочий каталог не удалён"
          /usr/bin/docker inspect ns-docker-demo >/dev/null 2>&1 && fail "контейнер ns-docker-demo остался"
          /usr/sbin/ip netns list | /bin/grep -Eq '^ns-lab-net([[:space:]]|$)' && fail "network namespace остался"
          /usr/bin/pgrep -f '/usr/local/lib/ns-lab/ns-(demo|http)' >/dev/null && fail "процессы payload остались"
          /usr/sbin/ip link show ns-lab-host >/dev/null 2>&1 && fail "host veth остался"
          /usr/bin/jq -e '.clean==true and (.removed|type)=="array" and (.removed|length)>=4' "$f" >/dev/null || fail "cleanup evidence неполон"
          pass "все namespace-эксперименты очищены"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/bin/bash
          set -euo pipefail
          for pf in /home/ubuntu/ns-lab/state/*.pid; do [[ -f "$pf" ]] || continue; p=$(/usr/bin/cat "$pf"); /bin/kill "$p" 2>/dev/null || true; done
          /usr/bin/pkill -f '/usr/local/lib/ns-lab/ns-demo' 2>/dev/null || true; /usr/bin/pkill -f '/usr/local/lib/ns-lab/ns-http' 2>/dev/null || true
          /usr/bin/docker rm -f ns-docker-demo >/dev/null 2>&1 || true
          /usr/sbin/ip netns del ns-lab-net 2>/dev/null || true; /usr/sbin/ip link del ns-lab-host 2>/dev/null || true
          /bin/umount -l /home/ubuntu/ns-lab/mnt/private 2>/dev/null || true
          /bin/rm -rf /home/ubuntu/ns-lab
          /usr/bin/jq -n '{clean:true,removed:["processes","container","network namespace","veth","mounts","workspace"]}' > /home/ubuntu/ns-lab-cleanup.json
          /usr/bin/chown ubuntu:ubuntu /home/ubuntu/ns-lab-cleanup.json
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Namespace обычно исчезает после завершения последнего процесса и
          освобождения всех handles. Именованные network namespaces и bind-mounted
          handles являются намеренными ссылками, поэтому переживают завершение
          полезной нагрузки до явного удаления.

          Очистка должна учитывать процессы, mounts, veth, named netns, IPC
          objects и контейнеры. Простого удаления evidence недостаточно: сначала
          освобождают ресурсы ядра, затем рабочие каталоги.

          Runtime решает ту же задачу при удалении контейнера: прекращает
          процессы, освобождает cgroups и namespaces, отключает сеть и удаляет
          writable state.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Завершите все процессы лабораторной, удалите контейнер `ns-docker-demo`,
      именованный network namespace, временные mounts и рабочий каталог
      `/home/ubuntu/ns-lab`.

      Создайте `/home/ubuntu/ns-lab-cleanup.json` с `clean: true` и массивом
      `removed`. Проверка не должна находить живые процессы или временные
      артефакты с префиксом `ns-lab-`.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 15
- title: 'cgroups v2: ресурсы, лимиты, статистика и freezer'
  description: |-
    Лабораторная работа исследует unified hierarchy cgroups v2 как интерфейс
    ядра для учёта, ограничения и приостановки реальных процессов. Вы
    сопоставите ручное управление cgroupfs с ограничениями Docker и
    завершите работу полной очисткой созданной иерархии.
  time-limit-minutes: 240
  prepare: "# ----------EXEC----------\n    # ---\tprepare.bash\t---\ncat <<'EOF'
    > prepare.bash\n#!/usr/bin/env bash\nset -euo pipefail\nCG=/sys/fs/cgroup\nLAB=/sys/fs/cgroup/cg-lab\n\
    HOME_DIR=/home/ubuntu/cgroups-v2-lab\nLIB=/usr/local/lib/cgroups-v2-lab\nSTATE=/run/cgroups-v2-lab\n\
    SCRIPT_DIR=\"$(cd -- \"$(dirname -- \"${BASH_SOURCE[0]}\")\" && pwd)\"\n\nif [[
    \"$(stat -fc %T \"$CG\")\" != cgroup2fs ]] || [[ ! -f \"$CG/cgroup.controllers\"\
    \ ]]; then\n  printf 'ERROR: this lab requires a unified cgroup v2 hierarchy mounted
    at %s; legacy/mixed mode is unsupported and will not be reconfigured.\\n' \"$CG\"\
    \ >&2\n  exit 2\nfi\nfor controller in cpu memory pids; do\n  if ! tr ' ' '\\\
    n' < \"$CG/cgroup.controllers\" | grep -qx \"$controller\"; then\n    printf 'ERROR:
    required cgroup v2 controller %s is not available at %s.\\n' \"$controller\" \"\
    $CG\" >&2\n    exit 3\n  fi\ndone\n\ninstall -d -m 0755 \"$LIB\" \"$STATE\"\n\
    install -m 0755 \"$SCRIPT_DIR/assets/workload.py\" \"$LIB/workload.py\"\ninstall
    -m 0755 \"$SCRIPT_DIR/scripts/check.bash\" \"$LIB/check.bash\"\ninstall -m 0755
    \"$SCRIPT_DIR/scripts/solution.bash\" \"$LIB/solution.bash\"\ninstall -m 0755
    \"$SCRIPT_DIR/scripts/pre-step.bash\" \"$LIB/pre-step.bash\"\ninstall -m 0755
    \"$SCRIPT_DIR/scripts/post-step.bash\" \"$LIB/post-step.bash\"\ninstall -d -o
    ubuntu -g ubuntu -m 0755 \"$HOME_DIR\" \"$HOME_DIR/evidence\" \"$HOME_DIR/io-data\"\
    \n\n# Remove leftovers only inside the lab-owned branch.\nif [[ -d \"$LAB\" ]];
    then\n  [[ -f \"$LAB/cgroup.freeze\" ]] && printf '0\\n' > \"$LAB/cgroup.freeze\"\
    \ || true\n  while IFS= read -r pid; do kill \"$pid\" 2>/dev/null || true; done
    < <(find \"$LAB\" -name cgroup.procs -type f -exec cat {} + 2>/dev/null)\n  find
    \"$LAB\" -depth -mindepth 1 -type d -exec rmdir {} + 2>/dev/null || true\n  rmdir
    \"$LAB\" 2>/dev/null || true\nfi\nif ! mkdir \"$LAB\" 2>/dev/null; then\n  printf
    'ERROR: cannot create %s. The cgroup filesystem is probably read-only or not delegated
    in this environment; run the lab in the prepared VM or provide read-only evidence
    for step 01 only.\\n' \"$LAB\" >&2\n  exit 5\nfi\nroot_available=\"$(cat \"$CG/cgroup.controllers\"\
    )\"\nfor controller in cpu memory pids io cpuset; do\n  if tr ' ' '\\n' <<<\"\
    $root_available\" | grep -qx \"$controller\"; then\n    printf '+%s\\n' \"$controller\"\
    \ > \"$CG/cgroup.subtree_control\" 2>/dev/null || true\n  fi\ndone\navailable=\"\
    $(cat \"$LAB/cgroup.controllers\")\"\nfor controller in cpu memory pids io cpuset;
    do\n  if tr ' ' '\\n' <<<\"$available\" | grep -qx \"$controller\"; then\n   \
    \ printf '+%s\\n' \"$controller\" > \"$LAB/cgroup.subtree_control\" || true\n\
    \  fi\ndone\nfor required in cpu memory pids; do\n  if ! tr ' ' '\\n' <<<\"$available\"\
    \ | grep -qx \"$required\"; then\n    printf 'ERROR: controller %s is not delegated
    to %s; cannot run resource-limit experiments safely.\\n' \"$required\" \"$LAB\"\
    \ >&2\n    exit 4\n  fi\ndone\nchown ubuntu:ubuntu \"$LAB\" \"$LAB/cgroup.procs\"\
    \ \"$LAB/cgroup.subtree_control\"\nprintf '%s\\n' \"$available\" > \"$STATE/root-controllers\"\
    \nchown -R ubuntu:ubuntu \"$HOME_DIR\"\n\nif command -v docker >/dev/null 2>&1;
    then\n  docker rm -f cg-docker-demo >/dev/null 2>&1 || true\n  docker image inspect
    alpine:3.20 >/dev/null 2>&1 || docker pull alpine:3.20 >/dev/null 2>&1 || printf
    'WARNING: alpine:3.20 is not cached and could not be pulled; step 10 solution
    will need that image.\\n' >&2\nelse\n  printf 'WARNING: Docker is unavailable;
    steps 1-9 remain usable, but step 10 cannot be completed.\\n' >&2\nfi\nprintf
    'cgroup v2 lab prepared at %s\\n' \"$LAB\"\nEOF\ntrap 'rm -f prepare.bash' EXIT\n\
    \n    # ----------RUN----------\n    chmod u+x prepare.bash\n./prepare.bash\n\
    \    "
  steps:
  - title: Определение режима cgroup
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          exec /usr/local/lib/cgroups-v2-lab/check.bash 01
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          exec /usr/local/lib/cgroups-v2-lab/solution.bash 01
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          В Linux контрольные группы представлены виртуальной файловой системой
          cgroupfs. В unified-режиме единственная иерархия cgroup v2 смонтирована
          с типом `cgroup2`; legacy-режим использует отдельные иерархии v1, а
          mixed-режим сочетает оба интерфейса. Наличие каталога само по себе
          недостаточно: режим определяют по типу монтирования и файлам интерфейса
          v2.

          Файл `cgroup.controllers` перечисляет контроллеры, доступные данной
          cgroup, а `cgroup.subtree_control` — контроллеры, переданные
          непосредственным дочерним группам. Список может отличаться между
          физическим хостом, VM и вложенным контейнером.

          Docker не реализует учёт ресурсов самостоятельно. Runtime размещает
          процессы в подготовленных группах и записывает параметры в cgroupfs, а
          учёт и принуждение выполняет ядро.
    description: |-
      #### Упражнение 1 (Определение режима cgroup)

      Определите режим cgroup на хосте. В каталоге evidence создайте
      `01-mode.json` с полями `mode`, `mount_type`, `mount_point`,
      `controllers` и `subtree_control`.

      Значения должны описывать фактическое unified-монтирование и текущее
      состояние лабораторной ветки `/sys/fs/cgroup/cg-lab`, а списки
      контроллеров должны быть JSON-массивами.
  - title: Иерархия и membership процессов
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          exec /usr/local/lib/cgroups-v2-lab/pre-step.bash 02
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          exec /usr/local/lib/cgroups-v2-lab/check.bash 02
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          exec /usr/local/lib/cgroups-v2-lab/solution.bash 02
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.bash	---
          cat <<'EOF' > post-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          exec /usr/local/lib/cgroups-v2-lab/post-step.bash 02
          EOF
          trap 'rm -f post-step.bash' EXIT


          # ----------RUN----------
          chmod u+x post-step.bash
          ./post-step.bash
        hints: |-
          В каждой иерархии процесс состоит ровно в одной cgroup. Его PID
          находится в `cgroup.procs`, а относительный путь группы виден через
          `/proc/<pid>/cgroup`. Перемещение выполняется записью PID в
          `cgroup.procs` целевой группы.

          Новый процесс наследует membership родителя. Поэтому оболочка,
          запустившая worker, и сам worker останутся в исходной группе, пока PID
          явно не перемещён или процесс не создан уже внутри нужной группы.

          Группы образуют дерево. Для лаборатории используется отдельная ветка,
          чтобы ownership и последующая очистка не затрагивали системные units.
    description: |-
      #### Упражнение 1 (Иерархия и membership процессов)

      Создайте дочернюю cgroup `membership` в лабораторной ветке. Запустите
      долгоживущий тестовый процесс с именем `cg-member` и переместите его в
      эту группу.

      Сохраните `02-membership.json` с PID, ожидаемым относительным cgroup
      path и UID владельца процесса. Процесс должен оставаться живым до
      проверки.
  - title: CPU weight
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          exec /usr/local/lib/cgroups-v2-lab/pre-step.bash 03
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          exec /usr/local/lib/cgroups-v2-lab/check.bash 03
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          exec /usr/local/lib/cgroups-v2-lab/solution.bash 03
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          `cpu.weight` задаёт относительную долю CPU для sibling cgroups в
          диапазоне, определённом интерфейсом v2. Weight проявляется только при
          конкуренции: если процессу хватает свободного CPU, меньший вес не
          является жёстким потолком.

          Сравнивать нужно группы одного родителя и нагрузку на одном доступном
          CPU. Накопительная статистика находится в `cpu.stat`; поле `usage_usec`
          позволяет вычислить расход CPU за выбранный интервал.

          Разница носит статистический характер, поэтому evidence должно хранить
          начальные и конечные значения либо уже вычисленные положительные дельты
          для обеих групп.
    description: |-
      #### Упражнение 1 (CPU weight)

      Создайте sibling-группы `cpu-weight/low` и `cpu-weight/high`, назначьте
      существенно разные значения `cpu.weight` и одновременно запустите в них
      CPU burner на одном CPU.

      Сохраните `03-cpu-weight.json`: веса, выбранный CPU, дельты `usage_usec`
      и отношение результата high к low. Высокий weight должен получить
      измеримо больше CPU.
