assignments:
- title: Контейнер как изолированный процесс и объект управления Docker
  description: |-
    Лабораторная работа рассматривает контейнер Docker как управляемый
    процесс. В ходе работы вы исследуете состояние Docker Engine, запустите
    HTTP-службу, проследите её жизненный цикл, выполните диагностику из
    отдельного контейнера и безопасно удалите созданные ресурсы.
  time-limit-minutes: 120
  steps:
  - title: Инвентаризация Docker Engine
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -m 0755 -o ubuntu -g ubuntu /home/ubuntu/basic-containers /home/ubuntu/basic-containers/evidence
          /usr/bin/install -d -m 0755 /var/lib/basic-containers/image
          /usr/bin/tee /var/lib/basic-containers/image/app.py >/dev/null <<'PYAPP'
          import json
          import logging
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import urlsplit

          logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s", force=True)

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  target = urlsplit(self.path)
                  payload = {
                      "service": "lab-http",
                      "endpoint": target.path,
                      "query": target.query,
                      "hostname": os.uname().nodename,
                  }
                  body = json.dumps(payload, sort_keys=True).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
                  logging.info("http_request method=GET path=%s", self.path)

              def log_message(self, format, *args):
                  return

          ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PYAPP
          /usr/bin/tee /var/lib/basic-containers/image/Dockerfile >/dev/null <<'DOCKERFILE'
          FROM python:3.12-alpine
          WORKDIR /opt/lab
          COPY app.py /opt/lab/app.py
          EXPOSE 8080
          HEALTHCHECK --interval=2s --timeout=2s --retries=10 CMD python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1)"
          CMD ["python", "-u", "/opt/lab/app.py"]
          DOCKERFILE
          /usr/bin/docker info >/dev/null
          /usr/bin/docker build --label com.course.lab=basic-containers --tag lab-http-image:1.0 /var/lib/basic-containers/image
          /usr/bin/docker pull curlimages/curl:8.12.1
          /usr/bin/chown -R ubuntu:ubuntu /home/ubuntu/basic-containers
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/docker info >/dev/null
          /usr/bin/jq -e 'type == "object" and (.ServerVersion | type == "string")' /home/ubuntu/basic-containers/evidence/engine.json >/dev/null
          /usr/bin/jq -e 'type == "array" and length > 0 and all(.[]; has("Id") and has("RepoTags"))' /home/ubuntu/basic-containers/evidence/images.json >/dev/null
          /usr/bin/jq -e 'type == "array" and all(.[]; has("Id") and has("State") and has("Config"))' /home/ubuntu/basic-containers/evidence/containers.json >/dev/null
          /usr/bin/jq -e 'type == "array" and length > 0 and all(.[]; has("Name") and has("Driver"))' /home/ubuntu/basic-containers/evidence/networks.json >/dev/null
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -m 0755 -o ubuntu -g ubuntu /home/ubuntu/basic-containers/evidence
          /usr/bin/docker info --format '{{json .}}' | /usr/bin/jq . > /home/ubuntu/basic-containers/evidence/engine.json
          /usr/bin/docker image inspect $(/usr/bin/docker image ls --quiet --no-trunc | /usr/bin/sort -u) > /home/ubuntu/basic-containers/evidence/images.json
          container_ids="$(/usr/bin/docker container ls --all --quiet --no-trunc)"
          if [ -n "$container_ids" ]; then /usr/bin/docker container inspect $container_ids > /home/ubuntu/basic-containers/evidence/containers.json; else printf '[]
          ' > /home/ubuntu/basic-containers/evidence/containers.json; fi
          /usr/bin/docker network inspect $(/usr/bin/docker network ls --quiet --no-trunc) > /home/ubuntu/basic-containers/evidence/networks.json
          /usr/bin/chown ubuntu:ubuntu /home/ubuntu/basic-containers/evidence/engine.json /home/ubuntu/basic-containers/evidence/images.json /home/ubuntu/basic-containers/evidence/containers.json /home/ubuntu/basic-containers/evidence/networks.json
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Docker CLI отправляет запросы Docker daemon, а daemon управляет
          образами, сетями и контейнерами. Образ хранится в локальном image store
          как неизменяемый шаблон. При запуске контейнера runtime создаёт
          изолированный процесс и подключает к слоям образа изменяемый слой
          файловой системы.

          Инвентаризация отделяет состояние управляющего API Docker от
          представления терминала. Структурированный JSON можно проверять
          автоматически и сравнивать между этапами.
    description: |-
      #### Упражнение 1 (Зафиксируйте исходное состояние)

      Убедитесь, что Docker Engine доступен. В каталоге
      `/home/ubuntu/basic-containers/evidence` сохраните отдельные JSON-файлы
      `engine.json`, `images.json`, `containers.json` и `networks.json`.
      Используйте machine-readable вывод Docker, а не снимок текста терминала.
      Файлы должны описывать сервер Docker, локальные образы, все контейнеры и
      сети.
  - title: Запуск первого сервиса
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          test "$(/usr/bin/docker inspect --format '{{.State.Running}}' lab-http)" = true
          test "$(/usr/bin/docker inspect --format '{{.State.Health.Status}}' lab-http)" = healthy
          test "$(/usr/bin/docker inspect --format '{{index .Config.Labels "com.course.lab"}}' lab-http)" = basic-containers
          /usr/bin/docker inspect --format '{{json .NetworkSettings.Networks}}' lab-http | /usr/bin/jq -e 'has("lab-net")' >/dev/null
          /usr/bin/docker inspect --format '{{json .NetworkSettings.Ports}}' lab-http | /usr/bin/jq -e '.["8080/tcp"] | any(.[]; .HostPort == "18080")' >/dev/null
          /usr/bin/curl --fail --silent http://127.0.0.1:18080/ | /usr/bin/jq -e '.service == "lab-http"' >/dev/null
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          if ! /usr/bin/docker network inspect lab-net >/dev/null 2>&1; then /usr/bin/docker network create --driver bridge --label com.course.lab=basic-containers lab-net >/dev/null; fi
          if /usr/bin/docker container inspect lab-http >/dev/null 2>&1; then /usr/bin/docker container rm --force lab-http >/dev/null; fi
          /usr/bin/docker run --detach --name lab-http --label com.course.lab=basic-containers --network lab-net --publish 18080:8080 lab-http-image:1.0 >/dev/null
          for attempt in $(/usr/bin/seq 1 30); do if [ "$(/usr/bin/docker inspect --format '{{.State.Health.Status}}' lab-http)" = healthy ] && /usr/bin/curl --fail --silent http://127.0.0.1:18080/ | /usr/bin/jq -e '.service == "lab-http"' >/dev/null 2>&1; then exit 0; fi; /usr/bin/sleep 1; done
          exit 1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Образ — неизменяемый шаблон приложения, а контейнер — конкретный
          экземпляр образа со своим процессом, состоянием и writable layer. Один
          образ может породить несколько независимых контейнеров.

          Publish port связывает порт хоста с портом в сетевом namespace
          контейнера. Это делает службу доступной с хоста, но не меняет порт,
          который слушает приложение внутри контейнера. Пользовательская
          Docker-сеть также даёт контейнерам DNS-имена по именам объектов.
    description: |-
      #### Упражнение 1 (Запустите HTTP-службу)

      Создайте пользовательскую bridge-сеть `lab-net`. Из подготовленного
      образа `lab-http-image:1.0` создайте именованный контейнер `lab-http`,
      подключите его к этой сети и опубликуйте внутренний порт `8080` на порту
      хоста `18080`. Добавьте метку `com.course.lab=basic-containers`.

      Добейтесь состояния `running` и проверьте с хоста, что корневой endpoint
      возвращает JSON с полем `service`, равным `lab-http`.
  - title: Состояние и метаданные
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/jq -e 'type == "array" and length == 1 and .[0].Name == "/lab-http" and .[0].State.Running == true and .[0].Config.Image == "lab-http-image:1.0" and (.[0].NetworkSettings.Networks | has("lab-net")) and (.[0].Mounts | type == "array")' /home/ubuntu/basic-containers/evidence/03-inspect.json >/dev/null
          /usr/bin/jq -e '.name == "/lab-http" and .image == "lab-http-image:1.0" and .running == true and (.networks | index("lab-net")) != null and (.mounts | type == "array")' /home/ubuntu/basic-containers/evidence/03-summary.json >/dev/null
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/docker inspect lab-http > /home/ubuntu/basic-containers/evidence/03-inspect.json
          /usr/bin/jq '.[0] | {name: .Name, image: .Config.Image, running: .State.Running, networks: (.NetworkSettings.Networks | keys), mounts: .Mounts}' /home/ubuntu/basic-containers/evidence/03-inspect.json > /home/ubuntu/basic-containers/evidence/03-summary.json
          /usr/bin/chown ubuntu:ubuntu /home/ubuntu/basic-containers/evidence/03-inspect.json /home/ubuntu/basic-containers/evidence/03-summary.json
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Inspect возвращает machine-readable описание объекта, которое daemon
          считает актуальным: конфигурацию образа, состояние процесса, mounts и
          параметры сети. Это надёжнее разбора форматированного табличного вывода
          CLI.

          Конфигурация отвечает на вопрос «как контейнер должен работать», а state
          — «что происходит сейчас». Сетевые адреса и подключения находятся в
          отдельной части описания, поскольку назначаются при создании и запуске
          объекта.
    description: |-
      #### Упражнение 1 (Сохраните и разберите состояние)

      Сохраните полное JSON-описание `lab-http` в
      `/home/ubuntu/basic-containers/evidence/03-inspect.json`. На его основе
      создайте `/home/ubuntu/basic-containers/evidence/03-summary.json` с
      полями `name`, `image`, `running`, `networks` и `mounts`.

      Итог должен подтверждать имя `/lab-http`, образ `lab-http-image:1.0`,
      работающее состояние и подключение к `lab-net`; поле mounts должно
      оставаться JSON-массивом даже при отсутствии подключённых хранилищ.
  - title: Логи и stdout
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          test -s /home/ubuntu/basic-containers/evidence/04-http.log
          /usr/bin/grep -F 'request=one' /home/ubuntu/basic-containers/evidence/04-http.log >/dev/null
          /usr/bin/grep -F 'request=two' /home/ubuntu/basic-containers/evidence/04-http.log >/dev/null
          /usr/bin/grep -F 'request=three' /home/ubuntu/basic-containers/evidence/04-http.log >/dev/null
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/curl --fail --silent 'http://127.0.0.1:18080/diagnostic?request=one' >/dev/null
          /usr/bin/curl --fail --silent 'http://127.0.0.1:18080/diagnostic?request=two' >/dev/null
          /usr/bin/curl --fail --silent 'http://127.0.0.1:18080/diagnostic?request=three' >/dev/null
          /usr/bin/docker logs lab-http > /home/ubuntu/basic-containers/evidence/04-http.log 2>&1
          /usr/bin/chown ubuntu:ubuntu /home/ubuntu/basic-containers/evidence/04-http.log
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Контейнерное приложение обычно пишет журналы в stdout и stderr. Runtime
          перехватывает эти потоки главного процесса, а logging driver сохраняет
          или пересылает записи. Благодаря этому контейнер не обязан управлять
          ротацией файлов журналов внутри своего writable layer.

          Логи полезно связывать с реальным запросом: тогда они доказывают не
          только запуск процесса, но и прохождение полезной нагрузки через HTTP
          endpoint.
    description: |-
      #### Упражнение 1 (Получите проверяемые записи журнала)

      Обратитесь к HTTP-службе не менее трёх раз, используя разные значения
      query-параметра `request`. Затем сохраните актуальный вывод журналов
      контейнера в `/home/ubuntu/basic-containers/evidence/04-http.log`.

      Файл должен быть непустым и содержать записи обо всех трёх обращениях к
      endpoint.
  - title: Exec и файловая система
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          test "$(/usr/bin/docker exec lab-http /bin/cat /tmp/lab-control.txt)" = writable-layer-ok
          test "$(/bin/cat /home/ubuntu/basic-containers/evidence/05-control.txt)" = writable-layer-ok
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/docker exec lab-http /bin/sh -c 'printf %s writable-layer-ok > /tmp/lab-control.txt'
          /usr/bin/docker exec lab-http /bin/cat /tmp/lab-control.txt > /home/ubuntu/basic-containers/evidence/05-control.txt
          /usr/bin/chown ubuntu:ubuntu /home/ubuntu/basic-containers/evidence/05-control.txt
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Exec запускает дополнительный процесс в namespaces уже работающего
          контейнера. Это диагностический механизм Docker API, а не SSH-модель:
          отдельный сетевой демон, учётная запись администратора и постоянная
          интерактивная сессия контейнеру не требуются.

          Файл, созданный таким процессом вне mount, попадает в writable layer
          контейнера. Он доступен следующим exec-процессам, пока существует сам
          контейнер.
    description: |-
      #### Упражнение 1 (Проверьте writable layer)

      Через Docker exec создайте внутри `lab-http` файл `/tmp/lab-control.txt`
      с точным содержимым `writable-layer-ok`. Затем прочитайте его через
      новый exec-процесс и сохраните полученное значение в
      `/home/ubuntu/basic-containers/evidence/05-control.txt`.
  - title: Stop, start и restart
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/jq -e '.containerId | type == "string" and length > 0' /home/ubuntu/basic-containers/evidence/06-lifecycle.json >/dev/null
          /usr/bin/jq -e '.before == true and .stopped == false and .after == true and .httpService == "lab-http" and .controlFile == "writable-layer-ok"' /home/ubuntu/basic-containers/evidence/06-lifecycle.json >/dev/null
          test "$(/usr/bin/docker inspect --format '{{.State.Running}}' lab-http)" = true
          test "$(/usr/bin/docker inspect --format '{{.Id}}' lab-http)" = "$(/usr/bin/jq -r '.containerId' /home/ubuntu/basic-containers/evidence/06-lifecycle.json)"
          /usr/bin/curl --fail --silent http://127.0.0.1:18080/ | /usr/bin/jq -e '.service == "lab-http"' >/dev/null
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          container_id="$(/usr/bin/docker inspect --format '{{.Id}}' lab-http)"
          before="$(/usr/bin/docker inspect --format '{{.State.Running}}' lab-http)"
          /usr/bin/docker stop lab-http >/dev/null
          stopped="$(/usr/bin/docker inspect --format '{{.State.Running}}' lab-http)"
          /usr/bin/docker start lab-http >/dev/null
          for attempt in $(/usr/bin/seq 1 30); do if service="$(/usr/bin/curl --fail --silent http://127.0.0.1:18080/ | /usr/bin/jq -r '.service' 2>/dev/null)"; then break; fi; /usr/bin/sleep 1; done
          after="$(/usr/bin/docker inspect --format '{{.State.Running}}' lab-http)"
          control="$(/usr/bin/docker exec lab-http /bin/cat /tmp/lab-control.txt)"
          /usr/bin/jq -n --arg containerId "$container_id" --argjson before "$before" --argjson stopped "$stopped" --argjson after "$after" --arg httpService "$service" --arg controlFile "$control" '{containerId:$containerId,before:$before,stopped:$stopped,after:$after,httpService:$httpService,controlFile:$controlFile}' > /home/ubuntu/basic-containers/evidence/06-lifecycle.json
          /usr/bin/chown ubuntu:ubuntu /home/ubuntu/basic-containers/evidence/06-lifecycle.json
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Stop завершает главный процесс контейнера, но не удаляет объект и его
          writable layer. Start повторно запускает тот же контейнер с прежней
          конфигурацией и файловой системой. Restart объединяет остановку и
          запуск, но остаётся операцией над тем же объектом.

          Состояние процесса и доступность endpoint меняются во времени, тогда как
          идентификатор контейнера и данные writable layer сохраняются до удаления
          контейнера.
    description: |-
      #### Упражнение 1 (Проследите остановку и повторный запуск)

      Зафиксируйте идентификатор и running-state `lab-http`, остановите
      контейнер и подтвердите остановленное состояние. Затем снова запустите
      тот же контейнер, проверьте HTTP endpoint и сохранность
      `/tmp/lab-control.txt`.

      Сохраните структурированные результаты в
      `/home/ubuntu/basic-containers/evidence/06-lifecycle.json`. В нём должны
      быть поля `containerId`, `before`, `stopped`, `after`, `httpService` и
      `controlFile`.
  - title: Exit code и одноразовые контейнеры
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          test "$(/usr/bin/docker inspect --format '{{.State.Status}}' lab-job)" = exited
          test "$(/usr/bin/docker inspect --format '{{.State.ExitCode}}' lab-job)" = 0
          test "$(/usr/bin/tr -d '[:space:]' < /home/ubuntu/basic-containers/evidence/07-exit-code.txt)" = 0
          /usr/bin/jq -e '.service == "lab-http" and .endpoint == "/diagnostic" and .query == "source=lab-job"' /home/ubuntu/basic-containers/evidence/07-job-output.json >/dev/null
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          if /usr/bin/docker container inspect lab-job >/dev/null 2>&1; then /usr/bin/docker container rm --force lab-job >/dev/null; fi
          /usr/bin/docker create --name lab-job --label com.course.lab=basic-containers --network lab-net curlimages/curl:8.12.1 --fail --silent 'http://lab-http:8080/diagnostic?source=lab-job' >/dev/null
          /usr/bin/docker start --attach lab-job > /home/ubuntu/basic-containers/evidence/07-job-output.json
          /usr/bin/docker inspect --format '{{.State.ExitCode}}' lab-job > /home/ubuntu/basic-containers/evidence/07-exit-code.txt
          /usr/bin/chown ubuntu:ubuntu /home/ubuntu/basic-containers/evidence/07-job-output.json /home/ubuntu/basic-containers/evidence/07-exit-code.txt
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Long-running service продолжает работать и обслуживать запросы, пока жив
          его главный процесс. Batch job выполняет конечную операцию и
          завершается; его exit code сообщает оркестратору или оператору об успехе
          либо ошибке.

          Одноразовый диагностический контейнер может разделять сеть со службой и
          обращаться к ней по Docker DNS-имени, не публикуя собственные порты.
          Сохранённый остановленный контейнер позволяет изучить код завершения и
          stdout после выполнения.
    description: |-
      #### Упражнение 1 (Выполните сетевую диагностику)

      Создайте именованный одноразовый контейнер `lab-job` на основе
      подготовленного образа `curlimages/curl:8.12.1`. Подключите его к
      `lab-net` и запросите диагностический endpoint службы по DNS-имени
      `lab-http`. Контейнер должен завершиться с кодом `0`.

      Сохраните stdout задания в
      `/home/ubuntu/basic-containers/evidence/07-job-output.json`, а числовой
      код завершения — в
      `/home/ubuntu/basic-containers/evidence/07-exit-code.txt`. Не удаляйте
      `lab-job` до проверки.
  - title: Restart policy
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          test "$(/usr/bin/docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' lab-http)" = unless-stopped
          test "$(/usr/bin/docker inspect --format '{{.State.Running}}' lab-http)" = true
          /usr/bin/jq -e '.policy == "unless-stopped" and .restartCountAfter > .restartCountBefore and .running == true and .service == "lab-http"' /home/ubuntu/basic-containers/evidence/08-restart.json >/dev/null
          /usr/bin/curl --fail --silent http://127.0.0.1:18080/ | /usr/bin/jq -e '.service == "lab-http"' >/dev/null
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/docker update --restart unless-stopped lab-http >/dev/null
          before="$(/usr/bin/docker inspect --format '{{.RestartCount}}' lab-http)"
          /usr/bin/docker kill --signal KILL lab-http >/dev/null
          for attempt in $(/usr/bin/seq 1 45); do
            running="$(/usr/bin/docker inspect --format '{{.State.Running}}' lab-http)"
            after="$(/usr/bin/docker inspect --format '{{.RestartCount}}' lab-http)"
            if [ "$running" = true ] && [ "$after" -gt "$before" ] && service="$(/usr/bin/curl --fail --silent http://127.0.0.1:18080/ | /usr/bin/jq -r '.service' 2>/dev/null)"; then break; fi
            /usr/bin/sleep 1
          done
          policy="$(/usr/bin/docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' lab-http)"
          /usr/bin/jq -n --arg policy "$policy" --argjson before "$before" --argjson after "$after" --argjson running "$running" --arg service "$service" '{policy:$policy,restartCountBefore:$before,restartCountAfter:$after,running:$running,service:$service}' > /home/ubuntu/basic-containers/evidence/08-restart.json
          /usr/bin/chown ubuntu:ubuntu /home/ubuntu/basic-containers/evidence/08-restart.json
          /usr/bin/jq -e '.restartCountAfter > .restartCountBefore and .running == true and .service == "lab-http"' /home/ubuntu/basic-containers/evidence/08-restart.json >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Restart policy задаёт реакцию Docker daemon на завершение главного
          процесса. Для локальной службы она повышает устойчивость к сбою процесса
          или перезапуску daemon. Политика не заменяет оркестратор: она не
          распределяет реплики, не управляет обновлением и не учитывает состояние
          всего приложения.

          Ручная остановка и аварийное завершение имеют разный смысл. Для
          демонстрации политики следует завершить процесс контролируемым сигналом
          сбоя и проверить новый запуск того же контейнера по счётчику рестартов и
          доступности endpoint.
    description: |-
      #### Упражнение 1 (Настройте автоматическое восстановление)

      Измените restart policy контейнера `lab-http` на `unless-stopped`.
      Зафиксируйте исходный счётчик рестартов, аварийно завершите главный
      процесс и дождитесь автоматического возвращения контейнера в состояние
      `running`.

      Сохраните в `/home/ubuntu/basic-containers/evidence/08-restart.json` имя
      политики, счётчики до и после сбоя, итоговый running-state и ответ поля
      `service` от HTTP endpoint. Счётчик после восстановления должен
      увеличиться.
  - title: Очистка ресурсов
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          if /usr/bin/docker container ls --all --format '{{.Names}}' | /usr/bin/grep -E '^lab-' >/dev/null; then exit 1; fi
          if /usr/bin/docker network ls --format '{{.Name}}' | /usr/bin/grep -E '^lab-' >/dev/null; then exit 1; fi
          if /usr/bin/docker image ls --format '{{.Repository}}' | /usr/bin/grep -E '^lab-' >/dev/null; then exit 1; fi
          if [ -f /home/ubuntu/basic-containers/evidence/containers.json ]; then
            while IFS= read -r container_id; do
              name="$(/usr/bin/jq -r --arg id "$container_id" '.[] | select(.Id == $id) | .Name' /home/ubuntu/basic-containers/evidence/containers.json)"
              case "$name" in /lab-*) continue ;; esac
              /usr/bin/docker container inspect "$container_id" >/dev/null
            done < <(/usr/bin/jq -r '.[].Id' /home/ubuntu/basic-containers/evidence/containers.json)
          fi
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          for container in lab-http lab-job; do if /usr/bin/docker container inspect "$container" >/dev/null 2>&1; then /usr/bin/docker container rm --force "$container" >/dev/null; fi; done
          if /usr/bin/docker network inspect lab-net >/dev/null 2>&1; then /usr/bin/docker network rm lab-net >/dev/null; fi
          if /usr/bin/docker image inspect lab-http-image:1.0 >/dev/null 2>&1; then /usr/bin/docker image rm lab-http-image:1.0 >/dev/null; fi
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.sh	---
          cat <<'EOF' > post-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/rm -rf /var/lib/basic-containers/image
          EOF
          trap 'rm -f post-step.sh' EXIT


          # ----------RUN----------
          chmod u+x post-step.sh
          ./post-step.sh
        hints: |-
          Безопасная очистка ограничивается объектами конкретной лаборатории.
          Имена и labels задают границы владения; глобальные prune-операции
          опасны, потому что могут удалить остановленные контейнеры, сети или
          образы других пользователей и заданий.

          Удалять следует в порядке зависимостей: контейнеры, затем
          пользовательскую сеть и подготовленный образ. Исходная инвентаризация
          позволяет убедиться, что нелабораторные контейнеры не пострадали.
    description: |-
      #### Упражнение 1 (Удалите только ресурсы лаборатории)

      Удалите контейнеры `lab-http` и `lab-job`, сеть `lab-net` и образ
      `lab-http-image:1.0`. Не применяйте глобальную очистку Docker и не
      удаляйте другие объекты.

      После завершения не должно оставаться контейнеров, сетей или
      репозиториев образов с префиксом `lab-`. Контейнеры, зафиксированные в
      исходной инвентаризации и не относящиеся к лаборатории, должны
      сохраниться.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 1
- title: Сети Docker, DNS service discovery и публикация портов
  description: |-
    # Сети Docker, DNS service discovery и публикация портов

    Лабораторная работа показывает границы сетевой доступности контейнеров:
    внутренний DNS пользовательских bridge-сетей, публикацию портов на узле,
    aliases и изоляцию backend-сервисов. В ходе работы используются HTTP
    API, диагностический клиент и reverse proxy.
  time-limit-minutes: 120
  steps:
  - title: Инвентаризация сетей
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare	---
          cat <<'EOF' > prepare
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          install -d /home/ubuntu/lab/docker/networking/assets/net-api
          install -d /home/ubuntu/lab/docker/networking/assets/net-client
          install -d /home/ubuntu/lab/docker/networking/assets/net-proxy
          cat > /home/ubuntu/lab/docker/networking/assets/net-api/app.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path not in ("/", "/health"):
                      self.send_error(404); return
                  payload = json.dumps({"service": "net-api", "status": "ok", "path": self.path}).encode()
                  self.send_response(200); self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(payload))); self.end_headers(); self.wfile.write(payload)
              def log_message(self, format, *args):
                  return
          ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PY
          cat > /home/ubuntu/lab/docker/networking/assets/net-api/Dockerfile <<'DOCKER'
          FROM python:3.12-alpine
          LABEL course.lab="docker-networking" course.component="api"
          WORKDIR /app
          COPY app.py /app/app.py
          EXPOSE 8080
          HEALTHCHECK --interval=2s --timeout=1s --retries=15 CMD wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1
          CMD ["python3", "/app/app.py"]
          DOCKER
          cat > /home/ubuntu/lab/docker/networking/assets/net-client/client.py <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request
          url = sys.argv[1]
          try:
              with urllib.request.urlopen(url, timeout=5) as response:
                  print(json.dumps({"url": url, "http_code": response.status, "body": json.loads(response.read().decode())}, sort_keys=True))
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as error:
              print(json.dumps({"url": url, "exit_code": 2, "error": str(error)}, sort_keys=True)); sys.exit(2)
          PY
          cat > /home/ubuntu/lab/docker/networking/assets/net-client/Dockerfile <<'DOCKER'
          FROM python:3.12-alpine
          LABEL course.lab="docker-networking" course.component="client"
          WORKDIR /app
          COPY client.py /app/client.py
          ENTRYPOINT ["python3", "/app/client.py"]
          DOCKER
          cat > /home/ubuntu/lab/docker/networking/assets/net-proxy/proxy.py <<'PY'
          import os
          import urllib.error
          import urllib.request
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          TARGET_HOST = os.environ.get("TARGET_HOST", "net-api")
          TARGET_PORT = os.environ.get("TARGET_PORT", "8080")
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  try:
                      with urllib.request.urlopen(f"http://{TARGET_HOST}:{TARGET_PORT}{self.path}", timeout=3) as response:
                          body = response.read(); self.send_response(response.status)
                          self.send_header("Content-Type", response.headers.get_content_type())
                          self.send_header("Content-Length", str(len(body))); self.send_header("X-Lab-Proxy", "net-proxy")
                          self.end_headers(); self.wfile.write(body)
                  except (urllib.error.URLError, TimeoutError) as error:
                      body = str(error).encode(); self.send_response(502); self.send_header("Content-Type", "text/plain")
                      self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
              def log_message(self, format, *args):
                  return
          ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PY
          cat > /home/ubuntu/lab/docker/networking/assets/net-proxy/Dockerfile <<'DOCKER'
          FROM python:3.12-alpine
          LABEL course.lab="docker-networking" course.component="proxy"
          WORKDIR /app
          COPY proxy.py /app/proxy.py
          EXPOSE 8080
          HEALTHCHECK --interval=2s --timeout=1s --retries=15 CMD wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1
          CMD ["python3", "/app/proxy.py"]
          DOCKER
          docker build -t course/net-api:1.0 /home/ubuntu/lab/docker/networking/assets/net-api
          docker build -t course/net-client:1.0 /home/ubuntu/lab/docker/networking/assets/net-client
          docker build -t course/net-proxy:1.0 /home/ubuntu/lab/docker/networking/assets/net-proxy
          chown -R ubuntu:ubuntu /home/ubuntu/lab/docker/networking
          EOF
          trap 'rm -f prepare' EXIT

          # ---	pre-step	---
          cat <<'EOF' > pre-step
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f pre-step' EXIT


          # ----------RUN----------
          chmod u+x prepare
          ./prepare
          chmod u+x pre-step
          ./pre-step
        check: |-
          # ----------EXEC----------
          # ---	check	---
          cat <<'EOF' > check
          #!/bin/bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/lab/docker/networking/evidence/networks-initial.txt
          [ -s "$EVIDENCE" ] || { echo "Не найден исходный список сетей"; exit 1; }
          head -n 1 "$EVIDENCE" | grep -q NETWORK || { echo "В evidence нет заголовка docker network ls"; exit 1; }
          [ "$(docker network inspect -f '{{.Driver}}' lab-net 2>/dev/null)" = bridge ] || { echo "lab-net не является bridge-сетью"; exit 1; }
          [ "$(docker network inspect -f '{{index .Labels "course.lab"}}' lab-net)" = docker-networking ] || { echo "Нет label course.lab"; exit 1; }
          [ "$(docker network inspect -f '{{index .Labels "course.role"}}' lab-net)" = shared ] || { echo "Нет label course.role"; exit 1; }
          echo "lab-net и inventory проверены"
          EOF
          trap 'rm -f check' EXIT


          # ----------RUN----------
          chmod u+x check
          ./check
        solution: |-
          # ----------EXEC----------
          # ---	solution	---
          cat <<'EOF' > solution
          #!/bin/bash
          set -euo pipefail
          docker rm -f net-api net-client net-client-dns-fail net-proxy >/dev/null 2>&1 || true
          docker network rm lab-net frontend backend >/dev/null 2>&1 || true
          docker network ls > /home/ubuntu/lab/docker/networking/evidence/networks-initial.txt
          docker network create --driver bridge --label course.lab=docker-networking --label course.role=shared lab-net >/dev/null
          chown ubuntu:ubuntu /home/ubuntu/lab/docker/networking/evidence/networks-initial.txt
          EOF
          trap 'rm -f solution' EXIT


          # ----------RUN----------
          chmod u+x solution
          ./solution
        post-step: |-
          # ----------EXEC----------
          # ---	post-step	---
          cat <<'EOF' > post-step
          #!/bin/bash
          set -euo pipefail
          chown -R ubuntu:ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f post-step' EXIT


          # ----------RUN----------
          chmod u+x post-step
          ./post-step
        hints: |-
          Платформа Docker создаёт несколько встроенных сетей. Сеть `bridge`
          используется контейнерами по умолчанию, если сеть не указана явно. Она
          подходит для простых сценариев, но не предоставляет такой же удобный
          механизм обнаружения сервисов по именам, как пользовательская
          bridge-сеть.

          User-defined bridge ограничивает широковещательный домен выбранной
          группой контейнеров и включает встроенный DNS Docker. Контейнеры в такой
          сети могут находить друг друга по именам и aliases, а параметры сети
          можно независимо инспектировать и сопровождать labels.
    description: |-
      Создайте каталог evidence лабораторной работы и сохраните в нём исходный
      перечень Docker-сетей до внесения изменений. Затем создайте
      пользовательскую bridge-сеть `lab-net` с метками лабораторной работы.

      #### Упражнение 1

      Добейтесь, чтобы `lab-net` имела драйвер `bridge`, label
      `course.lab=docker-networking` и label `course.role=shared`. Файл
      `networks-initial.txt` должен находиться в каталоге evidence
      лабораторной и содержать исходный список сетей с заголовками столбцов.
  - title: Сервис в пользовательской сети
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare	---
          cat <<'EOF' > prepare
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f prepare' EXIT

          # ---	pre-step	---
          cat <<'EOF' > pre-step
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f pre-step' EXIT


          # ----------RUN----------
          chmod u+x prepare
          ./prepare
          chmod u+x pre-step
          ./pre-step
        check: |-
          # ----------EXEC----------
          # ---	check	---
          cat <<'EOF' > check
          #!/bin/bash
          set -euo pipefail
          [ "$(docker inspect -f '{{.State.Running}}' net-api 2>/dev/null)" = true ] || { echo "net-api не запущен"; exit 1; }
          [ "$(docker inspect -f '{{.State.Health.Status}}' net-api)" = healthy ] || { echo "net-api не healthy"; exit 1; }
          [ "$(docker inspect -f '{{index .Config.Labels "course.role"}}' net-api)" = backend ] || { echo "Неверная роль net-api"; exit 1; }
          [ "$(docker inspect -f '{{if index .NetworkSettings.Networks "lab-net"}}yes{{end}}' net-api)" = yes ] || { echo "net-api не в lab-net"; exit 1; }
          [ "$(docker inspect -f '{{json .NetworkSettings.Ports}}' net-api)" = '{"8080/tcp":null}' ] || { echo "Порт net-api опубликован или не объявлен"; exit 1; }
          echo "net-api изолирован внутри lab-net"
          EOF
          trap 'rm -f check' EXIT


          # ----------RUN----------
          chmod u+x check
          ./check
        solution: |-
          # ----------EXEC----------
          # ---	solution	---
          cat <<'EOF' > solution
          #!/bin/bash
          set -euo pipefail
          docker rm -f net-api >/dev/null 2>&1 || true
          docker run -d --name net-api --network lab-net --label course.lab=docker-networking --label course.role=backend course/net-api:1.0 >/dev/null
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' net-api 2>/dev/null)" = healthy ] && exit 0
            sleep 1
          done
          echo "net-api не стал healthy" >&2
          exit 1
          EOF
          trap 'rm -f solution' EXIT


          # ----------RUN----------
          chmod u+x solution
          ./solution
        post-step: |-
          # ----------EXEC----------
          # ---	post-step	---
          cat <<'EOF' > post-step
          #!/bin/bash
          set -euo pipefail
          chown -R ubuntu:ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f post-step' EXIT


          # ----------RUN----------
          chmod u+x post-step
          ./post-step
        hints: |-
          Встроенный DNS работает внутри user-defined network. Имя контейнера
          регистрируется как DNS-имя в тех сетях, к которым контейнер подключён.
          Это позволяет клиентам обращаться к сервису без фиксации динамического
          IP-адреса.

          Декларация порта образа описывает порт приложения внутри контейнера, но
          сама по себе не открывает его на host. Пока port binding не создан,
          сервис доступен участникам той же Docker-сети, но не через порт узла.
    description: |-
      Запустите контейнер `net-api` из подготовленного образа
      `course/net-api:1.0` в сети `lab-net`. Назначьте контейнеру метки
      лабораторной работы и роли backend.

      #### Упражнение 1

      API должно перейти в состояние running и healthy, состоять в `lab-net` и
      слушать внутренний порт 8080. Не создавайте для `net-api` published port
      на host.
  - title: Клиентская диагностика
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare	---
          cat <<'EOF' > prepare
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f prepare' EXIT

          # ---	pre-step	---
          cat <<'EOF' > pre-step
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f pre-step' EXIT


          # ----------RUN----------
          chmod u+x prepare
          ./prepare
          chmod u+x pre-step
          ./pre-step
        check: |-
          # ----------EXEC----------
          # ---	check	---
          cat <<'EOF' > check
          #!/bin/bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/lab/docker/networking/evidence/client-response.json
          jq -e '.http_code == 200 and .body.service == "net-api" and .body.status == "ok" and (.url | contains("net-api"))' "$EVIDENCE" >/dev/null || { echo "Некорректный client-response.json"; exit 1; }
          [ "$(docker inspect -f '{{.State.Status}}' net-client 2>/dev/null)" = exited ] || { echo "Диагностический net-client не сохранён"; exit 1; }
          [ "$(docker inspect -f '{{if index .NetworkSettings.Networks "lab-net"}}yes{{end}}' net-client)" = yes ] || { echo "net-client не был подключён к lab-net"; exit 1; }
          [ "$(docker inspect -f '{{.State.ExitCode}}' net-client)" = 0 ] || { echo "net-client завершился с ошибкой"; exit 1; }
          echo "Docker DNS и HTTP evidence проверены"
          EOF
          trap 'rm -f check' EXIT


          # ----------RUN----------
          chmod u+x check
          ./check
        solution: |-
          # ----------EXEC----------
          # ---	solution	---
          cat <<'EOF' > solution
          #!/bin/bash
          set -euo pipefail
          docker rm -f net-client >/dev/null 2>&1 || true
          docker run --name net-client --network lab-net --label course.lab=docker-networking --label course.role=diagnostic course/net-client:1.0 http://net-api:8080/ > /home/ubuntu/lab/docker/networking/evidence/client-response.json
          chown ubuntu:ubuntu /home/ubuntu/lab/docker/networking/evidence/client-response.json
          EOF
          trap 'rm -f solution' EXIT


          # ----------RUN----------
          chmod u+x solution
          ./solution
        post-step: |-
          # ----------EXEC----------
          # ---	post-step	---
          cat <<'EOF' > post-step
          #!/bin/bash
          set -euo pipefail
          chown -R ubuntu:ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f post-step' EXIT


          # ----------RUN----------
          chmod u+x post-step
          ./post-step
        hints: |-
          Одноразовый диагностический контейнер позволяет проверять DNS и HTTP из
          того же сетевого пространства, где работают приложения. Такой подход не
          требует добавлять curl, DNS-клиенты и отладочные пакеты в production
          image.

          Диагностический результат полезно сохранять как структурированное
          evidence: код HTTP-ответа и разобранное JSON-тело можно проверить
          автоматически и сравнить при повторном запуске.
    description: |-
      Запустите `net-client` из образа `course/net-client:1.0` в `lab-net` и
      обратитесь к API по DNS-имени контейнера `net-api`. Сохраните результат
      клиента в evidence-файл `client-response.json`.

      #### Упражнение 1

      Evidence должен быть корректным JSON, содержать HTTP-код 200 и тело
      ответа API со значениями `service: net-api` и `status: ok`. Сохраните
      диагностический контейнер с именем `net-client`, чтобы его сетевую
      конфигурацию можно было инспектировать.
  - title: Публикация порта
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare	---
          cat <<'EOF' > prepare
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f prepare' EXIT

          # ---	pre-step	---
          cat <<'EOF' > pre-step
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f pre-step' EXIT


          # ----------RUN----------
          chmod u+x prepare
          ./prepare
          chmod u+x pre-step
          ./pre-step
        check: |-
          # ----------EXEC----------
          # ---	check	---
          cat <<'EOF' > check
          #!/bin/bash
          set -euo pipefail
          [ "$(docker inspect -f '{{.State.Health.Status}}' net-proxy 2>/dev/null)" = healthy ] || { echo "net-proxy не healthy"; exit 1; }
          [ "$(docker inspect -f '{{index .Config.Labels "course.role"}}' net-proxy)" = proxy ] || { echo "Неверная роль proxy"; exit 1; }
          BINDING=$(docker inspect -f '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostIp}}:{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' net-proxy)
          [ "$BINDING" = 127.0.0.1:18080 ] || { echo "Ожидался binding 127.0.0.1:18080"; exit 1; }
          [ "$(docker inspect -f '{{json .HostConfig.PortBindings}}' net-api)" = '{}' ] || { echo "У backend появился published port"; exit 1; }
          echo "Опубликован только proxy"
          EOF
          trap 'rm -f check' EXIT


          # ----------RUN----------
          chmod u+x check
          ./check
        solution: |-
          # ----------EXEC----------
          # ---	solution	---
          cat <<'EOF' > solution
          #!/bin/bash
          set -euo pipefail
          docker rm -f net-proxy >/dev/null 2>&1 || true
          docker run -d --name net-proxy --network lab-net --label course.lab=docker-networking --label course.role=proxy -e TARGET_HOST=net-api -e TARGET_PORT=8080 -p 127.0.0.1:18080:8080 course/net-proxy:1.0 >/dev/null
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' net-proxy 2>/dev/null)" = healthy ] && exit 0
            sleep 1
          done
          echo "net-proxy не стал healthy" >&2
          exit 1
          EOF
          trap 'rm -f solution' EXIT


          # ----------RUN----------
          chmod u+x solution
          ./solution
        post-step: |-
          # ----------EXEC----------
          # ---	post-step	---
          cat <<'EOF' > post-step
          #!/bin/bash
          set -euo pipefail
          chown -R ubuntu:ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f post-step' EXIT


          # ----------RUN----------
          chmod u+x post-step
          ./post-step
        hints: |-
          Container port существует в сетевом namespace контейнера. Published port
          создаёт правило входа с адреса и порта host на порт контейнера. Эти
          понятия независимы: backend может принимать соединения внутри
          Docker-сети без публикации наружу.

          Reverse proxy образует контролируемую точку входа. На host публикуется
          только proxy, а backend остаётся доступен proxy по внутреннему DNS.
    description: |-
      Запустите контейнер `net-proxy` из образа `course/net-proxy:1.0` в
      `lab-net`. Настройте его на передачу запросов к `net-api` и опубликуйте
      порт proxy как `127.0.0.1:18080` на host.

      #### Упражнение 1

      Контейнер `net-proxy` должен быть running и healthy, иметь роль proxy и
      единственный binding внутреннего порта 8080 к `127.0.0.1:18080`. У
      `net-api` по-прежнему не должно быть published ports.
  - title: Сетевая изоляция
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare	---
          cat <<'EOF' > prepare
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f prepare' EXIT

          # ---	pre-step	---
          cat <<'EOF' > pre-step
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f pre-step' EXIT


          # ----------RUN----------
          chmod u+x prepare
          ./prepare
          chmod u+x pre-step
          ./pre-step
        check: |-
          # ----------EXEC----------
          # ---	check	---
          cat <<'EOF' > check
          #!/bin/bash
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:18080/ | jq -e '.service == "net-api" and .status == "ok"' >/dev/null || { echo "Proxy endpoint недоступен"; exit 1; }
          jq -e '.http_code == 200 and .body.service == "net-api" and .body.status == "ok"' /home/ubuntu/lab/docker/networking/evidence/proxy-response.json >/dev/null || { echo "Некорректный proxy-response.json"; exit 1; }
          jq -e '.container == "net-api" and .published_ports == [] and .direct_host_access == false' /home/ubuntu/lab/docker/networking/evidence/backend-isolation.json >/dev/null || { echo "Некорректный backend-isolation.json"; exit 1; }
          [ "$(docker inspect -f '{{json .HostConfig.PortBindings}}' net-api)" = '{}' ] || { echo "Backend опубликован на host"; exit 1; }
          echo "Доступ через proxy и изоляция backend подтверждены"
          EOF
          trap 'rm -f check' EXIT


          # ----------RUN----------
          chmod u+x check
          ./check
        solution: |-
          # ----------EXEC----------
          # ---	solution	---
          cat <<'EOF' > solution
          #!/bin/bash
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:18080/ | jq -c '{url:"http://127.0.0.1:18080/",http_code:200,body:.}' > /home/ubuntu/lab/docker/networking/evidence/proxy-response.json
          printf '{"container":"net-api","published_ports":[],"direct_host_access":false}\n' > /home/ubuntu/lab/docker/networking/evidence/backend-isolation.json
          chown ubuntu:ubuntu /home/ubuntu/lab/docker/networking/evidence/proxy-response.json /home/ubuntu/lab/docker/networking/evidence/backend-isolation.json
          EOF
          trap 'rm -f solution' EXIT


          # ----------RUN----------
          chmod u+x solution
          ./solution
        post-step: |-
          # ----------EXEC----------
          # ---	post-step	---
          cat <<'EOF' > post-step
          #!/bin/bash
          set -euo pipefail
          chown -R ubuntu:ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f post-step' EXIT


          # ----------RUN----------
          chmod u+x post-step
          ./post-step
        hints: |-
          Сетевая изоляция строится не только firewall-правилами, но и отсутствием
          ненужных маршрутов входа. Backend без published port нельзя вызвать
          через порт host; обратиться к нему могут только контейнеры из общей
          сети.

          Proxy отделяет внешний контракт от внутренней топологии. Проверка
          изоляции должна одновременно подтверждать успешный запрос через
          разрешённую точку входа и отсутствие прямого port binding у backend.
    description: |-
      Проверьте endpoint через опубликованный порт `net-proxy` и сохраните
      ответ в `proxy-response.json`. Отдельно зафиксируйте результат проверки
      отсутствия прямой публикации backend в `backend-isolation.json`.

      #### Упражнение 1

      Ответ через proxy должен иметь HTTP-код 200 и JSON API. Evidence
      изоляции должно указывать имя `net-api`, пустой набор published ports и
      значение `direct_host_access: false`.
  - title: Network aliases
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare	---
          cat <<'EOF' > prepare
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f prepare' EXIT

          # ---	pre-step	---
          cat <<'EOF' > pre-step
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f pre-step' EXIT


          # ----------RUN----------
          chmod u+x prepare
          ./prepare
          chmod u+x pre-step
          ./pre-step
        check: |-
