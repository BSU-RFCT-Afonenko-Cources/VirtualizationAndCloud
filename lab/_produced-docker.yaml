      Создайте группу `pids`, задайте `pids.max` равным 16 и выполните
      ограниченный по времени fork-test, создающий долгоживущих потомков до
      отказа.

      Сохраните `06-pids.json` с лимитом, максимальным наблюдавшимся
      `pids.current`, дельтой события `max` и результатом cleanup. После
      эксперимента в группе не должно остаться процессов.
