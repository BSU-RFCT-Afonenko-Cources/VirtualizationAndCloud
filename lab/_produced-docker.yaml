        hints: |-
          Обычную cgroup нельзя удалить, пока в ней есть процессы или дочерние
          группы. Удаление каталога не завершает workload автоматически, поэтому
          cleanup начинается с thaw и controlled termination.

          Порядок идёт снизу вверх: остановить контейнеры и процессы, дождаться
          пустых `cgroup.procs`, удалить leaf-группы, затем родительскую
          лабораторную ветку. Утечки делают повторный запуск непредсказуемым.

          Финальное evidence должно фиксировать завершённую очистку, но не
          подменять фактическую проверку отсутствия PID, контейнеров и каталогов.
    description: |-
      #### Упражнение 1 (Очистка cgroup hierarchy)

      Завершите все процессы лаборатории, удалите контейнеры с префиксом `cg-`
      и удалите дочерние cgroups лабораторной ветки снизу вверх.

      Создайте `11-cleanup.json` со статусами процессов, контейнеров и
      hierarchy. После выполнения не должно оставаться workload-процессов,
      контейнеров `cg-*` и каталога `/sys/fs/cgroup/cg-lab`.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: |-
        # ----------EXEC----------
            # ---	prepare.bash	---
        cat <<'EOF' > prepare.bash
        #!/usr/bin/env bash
        set -euo pipefail
        CG=/sys/fs/cgroup
        LAB=/sys/fs/cgroup/cg-lab
        HOME_DIR=/home/ubuntu/cgroups-v2-lab
        LIB=/usr/local/lib/cgroups-v2-lab
        STATE=/run/cgroups-v2-lab
        SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"

        if [[ "$(stat -fc %T "$CG")" != cgroup2fs ]] || [[ ! -f "$CG/cgroup.controllers" ]]; then
          printf 'ERROR: this lab requires a unified cgroup v2 hierarchy mounted at %s; legacy/mixed mode is unsupported and will not be reconfigured.\n' "$CG" >&2
          exit 2
        fi
        for controller in cpu memory pids; do
          if ! tr ' ' '\n' < "$CG/cgroup.controllers" | grep -qx "$controller"; then
            printf 'ERROR: required cgroup v2 controller %s is not available at %s.\n' "$controller" "$CG" >&2
            exit 3
          fi
        done

        install -d -m 0755 "$LIB" "$STATE"
        install -m 0755 "$SCRIPT_DIR/assets/workload.py" "$LIB/workload.py"
        install -m 0755 "$SCRIPT_DIR/scripts/check.bash" "$LIB/check.bash"
        install -m 0755 "$SCRIPT_DIR/scripts/solution.bash" "$LIB/solution.bash"
        install -m 0755 "$SCRIPT_DIR/scripts/pre-step.bash" "$LIB/pre-step.bash"
        install -m 0755 "$SCRIPT_DIR/scripts/post-step.bash" "$LIB/post-step.bash"
        install -d -o ubuntu -g ubuntu -m 0755 "$HOME_DIR" "$HOME_DIR/evidence" "$HOME_DIR/io-data"

        # Remove leftovers only inside the lab-owned branch.
        if [[ -d "$LAB" ]]; then
          [[ -f "$LAB/cgroup.freeze" ]] && printf '0\n' > "$LAB/cgroup.freeze" || true
          while IFS= read -r pid; do kill "$pid" 2>/dev/null || true; done < <(find "$LAB" -name cgroup.procs -type f -exec cat {} + 2>/dev/null)
          find "$LAB" -depth -mindepth 1 -type d -exec rmdir {} + 2>/dev/null || true
          rmdir "$LAB" 2>/dev/null || true
        fi
        if ! mkdir "$LAB" 2>/dev/null; then
          printf 'ERROR: cannot create %s. The cgroup filesystem is probably read-only or not delegated in this environment; run the lab in the prepared VM or provide read-only evidence for step 01 only.\n' "$LAB" >&2
          exit 5
        fi
        root_available="$(cat "$CG/cgroup.controllers")"
        for controller in cpu memory pids io cpuset; do
          if tr ' ' '\n' <<<"$root_available" | grep -qx "$controller"; then
            printf '+%s\n' "$controller" > "$CG/cgroup.subtree_control" 2>/dev/null || true
          fi
        done
        available="$(cat "$LAB/cgroup.controllers")"
        for controller in cpu memory pids io cpuset; do
          if tr ' ' '\n' <<<"$available" | grep -qx "$controller"; then
            printf '+%s\n' "$controller" > "$LAB/cgroup.subtree_control" || true
          fi
        done
        for required in cpu memory pids; do
          if ! tr ' ' '\n' <<<"$available" | grep -qx "$required"; then
            printf 'ERROR: controller %s is not delegated to %s; cannot run resource-limit experiments safely.\n' "$required" "$LAB" >&2
            exit 4
          fi
        done
        chown ubuntu:ubuntu "$LAB" "$LAB/cgroup.procs" "$LAB/cgroup.subtree_control"
        printf '%s\n' "$available" > "$STATE/root-controllers"
        chown -R ubuntu:ubuntu "$HOME_DIR"

        if command -v docker >/dev/null 2>&1; then
          docker rm -f cg-docker-demo >/dev/null 2>&1 || true
          docker image inspect alpine:3.20 >/dev/null 2>&1 || docker pull alpine:3.20 >/dev/null 2>&1 || printf 'WARNING: alpine:3.20 is not cached and could not be pulled; step 10 solution will need that image.\n' >&2
        else
          printf 'WARNING: Docker is unavailable; steps 1-9 remain usable, but step 10 cannot be completed.\n' >&2
        fi
        printf 'cgroup v2 lab prepared at %s\n' "$LAB"
        EOF
        trap 'rm -f prepare.bash' EXIT

            # ----------RUN----------
            chmod u+x prepare.bash
        ./prepare.bash
            
  order: 16
- title: Checkpoint/Restore, гибернация контейнеров и сохранение процессов
  description: |-
    В лабораторной исследуются остановка и сохранение состояния процессов:
    cgroup freezer, Docker pause, CRIU checkpoint/restore, состояние
    файловой системы и томов. Практическая часть автоматически выбирает
    **full-mode**, когда Docker checkpoint действительно доступен, или
    **fallback-mode**, когда среда позволяет проверить только freeze/pause и
    собрать техническую диагностику.

    Рабочий каталог студента — `/home/ubuntu/cr-lab`. Полезная нагрузка
    `cr-demo-counter` хранит счётчик в памяти, публикует состояние по HTTP и
    держит открытым журнал на volume. Это позволяет отличить восстановление
    процесса от повторного запуска entrypoint.
  time-limit-minutes: 240
  steps:
  - title: 'Термины: pause, freeze, checkpoint, restore'
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.sh	---
          cat <<'EOF' > prepare.sh
          #!/bin/bash
          set -euo pipefail
          ROOT=$(/usr/bin/realpath "$(/usr/bin/dirname "$0")/..")
          LAB=/home/ubuntu/cr-lab
          SRC=/home/ubuntu/cr-lab/src
          BIN=/home/ubuntu/cr-lab/bin
          STATE=/home/ubuntu/cr-lab/state
          EVIDENCE=/home/ubuntu/cr-lab/evidence
          CHECKPOINTS=/home/ubuntu/cr-lab/checkpoints
          LIB=/home/ubuntu/cr-lab/lib

          /usr/bin/install -d -o ubuntu -g ubuntu "$SRC" "$BIN" "$STATE" "$EVIDENCE" "$CHECKPOINTS" "$LIB"
          /usr/bin/install -m 0644 "$ROOT/assets/cr-demo-counter.c" "$SRC/cr-demo-counter.c"
          /usr/bin/install -m 0644 "$ROOT/assets/Dockerfile" "$SRC/Dockerfile"
          /usr/bin/install -m 0755 "$ROOT/lib/common.sh" "$LIB/common.sh"
          if command -v gcc >/dev/null 2>&1; then
            if /usr/bin/gcc -O2 -static -o "$BIN/cr-demo-counter" "$SRC/cr-demo-counter.c" 2>"$EVIDENCE/build-static.log"; then
              /bin/chmod 0755 "$BIN/cr-demo-counter"
              /usr/bin/touch "$BIN/.static"
            else
              /usr/bin/gcc -O2 -o "$BIN/cr-demo-counter" "$SRC/cr-demo-counter.c" 2>"$EVIDENCE/build-dynamic.log"
              /bin/chmod 0755 "$BIN/cr-demo-counter"
            fi
          fi
          /bin/chown -R ubuntu:ubuntu "$LAB"
          EOF
          trap 'rm -f prepare.sh' EXIT


          # ----------RUN----------
          chmod u+x prepare.sh
          ./prepare.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          FILE="$EVIDENCE/terms.json"
          need_file "$FILE"
          /usr/bin/python3 - "$FILE" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          keys={'freeze','checkpoint','restore','filesystem_snapshot','backup'}
          assert set(x)==keys, 'unexpected term keys'
          for name in keys:
              assert set(x[name])=={'keeps_process_memory','creates_process_image_files','keeps_filesystem_data','result'}
              assert all(isinstance(x[name][k],bool) for k in ('keeps_process_memory','creates_process_image_files','keeps_filesystem_data'))
              assert isinstance(x[name]['result'],str) and x[name]['result']
          assert x['freeze']['keeps_process_memory'] and not x['freeze']['creates_process_image_files']
          assert x['checkpoint']['keeps_process_memory'] and x['checkpoint']['creates_process_image_files']
          assert x['restore']['keeps_process_memory'] and x['restore']['result']=='continued-process'
          assert x['filesystem_snapshot']['keeps_filesystem_data'] and not x['filesystem_snapshot']['keeps_process_memory']
          assert x['backup']['keeps_filesystem_data'] and not x['backup']['keeps_process_memory']
          PY
          pass "terms evidence distinguishes runtime and filesystem states"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/cr-lab
          /usr/bin/install -d -o ubuntu -g ubuntu "$LAB/evidence"
          /usr/bin/python3 - <<'PY'
          import json
          p='/home/ubuntu/cr-lab/evidence/terms.json'
          data={
           'freeze': {'keeps_process_memory': True, 'creates_process_image_files': False, 'keeps_filesystem_data': False, 'result': 'same-stopped-process'},
           'checkpoint': {'keeps_process_memory': True, 'creates_process_image_files': True, 'keeps_filesystem_data': False, 'result': 'process-image-files'},
           'restore': {'keeps_process_memory': True, 'creates_process_image_files': False, 'keeps_filesystem_data': False, 'result': 'continued-process'},
           'filesystem_snapshot': {'keeps_process_memory': False, 'creates_process_image_files': False, 'keeps_filesystem_data': True, 'result': 'point-in-time-filesystem'},
           'backup': {'keeps_process_memory': False, 'creates_process_image_files': False, 'keeps_filesystem_data': True, 'result': 'independent-data-copy'}}
          with open(p,'w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,indent=2)
          PY
          /bin/chown ubuntu:ubuntu "$LAB/evidence/terms.json"
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Pause и freeze временно прекращают планирование процесса, но оставляют
          его состояние только в оперативной памяти хоста. После разморозки тот же
          процесс продолжает работу; отдельного переносимого набора файлов при
          этом не появляется.

          Checkpoint сериализует существенную часть состояния процесса: адресное
          пространство, регистры, дескрипторы и служебные метаданные. Restore
          создаёт исполняющийся процесс из этого набора и должен продолжить
          вычисление с сохранённой точки.

          Snapshot файловой системы фиксирует блоки или файлы, а backup создаёт
          независимую копию данных. Ни snapshot, ни backup сами по себе не
          сохраняют регистры CPU, память и состояние открытых сокетов процесса.
    description: |-
      Рабочий каталог лабораторной — `/home/ubuntu/cr-lab`.

      #### Упражнение 1

      Создайте `evidence/terms.json` — JSON-объект с ключами `freeze`,
      `checkpoint`, `restore`, `filesystem_snapshot` и `backup`. Для каждого
      ключа укажите булевы признаки `keeps_process_memory`,
      `creates_process_image_files`, `keeps_filesystem_data` и строку
      `result`.

      Значения должны machine-readable отражать различия из теории. Для freeze
      результатом является тот же остановленный процесс, для checkpoint —
      файлы образа процесса, для restore — продолженный процесс, а snapshot и
      backup относятся к файловым данным.
  - title: Проверка поддержки CRIU и Docker checkpoint
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          need_file "$EVIDENCE/support.json"; need_file "$MODE_FILE"; need_file "$EVIDENCE/diagnostics/criu-check.txt"
          /usr/bin/python3 - "$EVIDENCE/support.json" "$MODE_FILE" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); mode=open(sys.argv[2]).read().strip()
          assert mode in ('full','fallback') and x['mode']==mode
          for k in ('docker_available','checkpoint_cli','criu_available','criu_check_ok'): assert isinstance(x[k],bool)
          assert x['cgroup_version'] in (1,2)
          assert isinstance(x['reasons'],list)
          if mode=='full': assert all(x[k] for k in ('docker_available','checkpoint_cli','criu_available','criu_check_ok'))
          else: assert x['reasons'], 'fallback requires reasons'
          PY
          pass "support diagnostics selected $(/bin/cat "$MODE_FILE") mode"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -uo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          DIAG="$EVIDENCE/diagnostics"
          /usr/bin/install -d -o ubuntu -g ubuntu "$DIAG"

          docker_available=false; checkpoint_cli=false; criu_available=false; criu_check_ok=false
          reasons=()
          if docker_ok; then
            docker_available=true
            /usr/bin/docker version >"$DIAG/docker-version.txt" 2>&1
            /usr/bin/docker info >"$DIAG/docker-info.txt" 2>&1
          else reasons+=("docker-daemon-unavailable"); fi
          if checkpoint_cli_ok; then checkpoint_cli=true; else reasons+=("docker-checkpoint-cli-unavailable"); fi
          if CRIU=$(command -v criu 2>/dev/null); then
            criu_available=true
            "$CRIU" --version >"$DIAG/criu-version.txt" 2>&1 || true
            if "$CRIU" check --all >"$DIAG/criu-check.txt" 2>&1; then criu_check_ok=true; else reasons+=("criu-check-failed"); fi
          else
            reasons+=("criu-unavailable")
            printf 'criu executable is unavailable\n' >"$DIAG/criu-check.txt"
          fi
          if test -f /sys/fs/cgroup/cgroup.controllers; then cgroup_version=2; else cgroup_version=1; fi
          if $docker_available && $checkpoint_cli && $criu_available && $criu_check_ok; then mode=full; else mode=fallback; fi
          printf '%s\n' "$mode" >"$MODE_FILE"
          REASONS=$(IFS=,; printf '%s' "${reasons[*]:-}") /usr/bin/python3 - "$docker_available" "$checkpoint_cli" "$criu_available" "$criu_check_ok" "$cgroup_version" "$mode" <<'PY'
          import json,os,sys
          reasons=[s for s in os.environ.get('REASONS','').split(',') if s]
          data={'docker_available':sys.argv[1]=='true','checkpoint_cli':sys.argv[2]=='true','criu_available':sys.argv[3]=='true','criu_check_ok':sys.argv[4]=='true','cgroup_version':int(sys.argv[5]),'mode':sys.argv[6],'reasons':reasons}
          json.dump(data,open('/home/ubuntu/cr-lab/evidence/support.json','w'),indent=2)
          PY
          lab_owner
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Команда Docker checkpoint относится к экспериментальным возможностям
          Docker Engine. Наличие подкоманды в клиенте ещё не доказывает
          работоспособность: демон, runtime, CRIU и ядро должны поддерживать
          требуемые операции.

          CRIU проверяет namespaces, cgroups, seccomp, сокеты, терминалы и другие
          ресурсы процесса. Поэтому диагностика должна фиксировать версии и
          фактический результат проверки, а не только наличие исполняемого файла.

          Лабораторная использует два режима. `full` означает, что CRIU и Docker
          checkpoint доступны; `fallback` означает, что практику freeze/pause
          можно выполнить, а ограничение checkpoint подтверждено структурированной
          диагностикой.
    description: |-
      #### Упражнение 1

      Проверьте доступность Docker daemon, CRIU, экспериментальной
      checkpoint-команды и kernel/cgroup prerequisites. Сохраните результат в
      `evidence/support.json`, включая `docker_available`, `checkpoint_cli`,
      `criu_available`, `criu_check_ok`, `cgroup_version`, `mode` и непустой
      массив `reasons` для fallback.

      Запишите выбранный режим единственной строкой `full` или `fallback` в
      файл `mode`. Версии и диагностические сообщения сохраните в каталоге
      `evidence/diagnostics`.
  - title: Процесс-счётчик как workload
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          PIDFILE="$LAB/run/host.pid"; FILE="$STATE/host/state.json"
          need_file "$PIDFILE"; need_file "$FILE"; pid=$(/bin/cat "$PIDFILE")
          /bin/kill -0 "$pid" 2>/dev/null || fail "host counter is not alive"
          /bin/grep -q '^Name:[[:space:]]*cr-demo-counter' "/proc/$pid/status" || fail "unexpected process name"
          a=$(state_counter "$FILE"); /bin/sleep 2; b=$(state_counter "$FILE")
          test "$b" -gt "$a" || fail "counter did not increase"
          /usr/bin/python3 - "$FILE" <<'PY'
          import json,sys,time,os
          x=json.load(open(sys.argv[1])); assert x['session'] and x['starts']>=1 and x['pid']>0
          assert time.time()-os.path.getmtime(sys.argv[1]) < 5
          PY
          pass "live cr-demo-counter advanced from $a to $b"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          BIN="$LAB/bin/cr-demo-counter"; HOST_STATE="$STATE/host"; RUN="$LAB/run"
          test -x "$BIN" || fail "counter binary was not built; gcc is required"
          /usr/bin/install -d -o ubuntu -g ubuntu "$HOST_STATE" "$RUN"
          if test -f "$RUN/host.pid" && /bin/kill -0 "$(/bin/cat "$RUN/host.pid")" 2>/dev/null; then /bin/kill "$(/bin/cat "$RUN/host.pid")" || true; /bin/sleep 1; fi
          /usr/sbin/start-stop-daemon --start --background --make-pidfile --pidfile "$RUN/host.pid" --chuid ubuntu:ubuntu --chdir "$LAB" --startas "$BIN" -- "$HOST_STATE" 18081
          /bin/chown ubuntu:ubuntu "$RUN/host.pid"
          for _ in $(/usr/bin/seq 1 30); do test -s "$HOST_STATE/state.json" && break; /bin/sleep 0.2; done
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Restore нельзя убедительно показать статическим процессом. Наблюдаемая
          полезная нагрузка должна иметь изменяемое состояние в памяти, которое
          можно сопоставить до и после операции.

          `cr-demo-counter` увеличивает in-memory счётчик, раз в секунду атомарно
          обновляет JSON heartbeat и дописывает журнал. При каждом настоящем
          запуске entrypoint также изменяются `starts` и идентификатор сессии.

          Сочетание счётчика, session id и числа запусков позволяет отличить
          продолжение сохранённого процесса от запуска нового экземпляра, даже
          если оба используют тот же каталог данных.
    description: |-
      #### Упражнение 1

      Запустите долгоживущий процесс `/home/ubuntu/cr-lab/bin/cr-demo-counter`
      с именем процесса `cr-demo-counter`, каталогом состояния `state/host` и
      HTTP-портом `18081`.

      Сохраните PID в `run/host.pid`. Добейтесь, чтобы `state/host/state.json`
      существовал, поле `counter` возрастало между наблюдениями, heartbeat
      обновлялся, а `/proc/<pid>/status` подтверждал имя живого процесса.
  - title: Freeze через cgroup freezer
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          FILE="$EVIDENCE/freeze.json"; need_file "$FILE"
          /usr/bin/python3 - "$FILE" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['cgroup']=='/sys/fs/cgroup/cr-demo-counter'
          assert x['frozen_state']==1 and x['counter_during']==x['counter_before']
          assert x['counter_after']>x['counter_during'] and x['checkpoint_files_created']==0
          PY
          pid=$(json_get "$FILE" pid); /bin/kill -0 "$pid" 2>/dev/null || fail "thawed process is not alive"
          test "$(/bin/cat /sys/fs/cgroup/cr-demo-counter/cgroup.freeze)" = 0 || fail "cgroup remains frozen"
          pass "cgroup freezer stopped and resumed the same process"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          PIDFILE="$LAB/run/host.pid"; FILE="$STATE/host/state.json"; CG=/sys/fs/cgroup/cr-demo-counter
          need_file "$PIDFILE"; need_file "$FILE"; pid=$(/bin/cat "$PIDFILE")
          /bin/kill -0 "$pid" 2>/dev/null || fail "host counter is not alive"
          test -f /sys/fs/cgroup/cgroup.controllers || fail "this exercise requires writable cgroup v2"
          /usr/bin/mkdir -p "$CG"
          printf '%s\n' "$pid" >"$CG/cgroup.procs"
          artifacts_before=$(/usr/bin/find "$CHECKPOINTS" -type f 2>/dev/null | /usr/bin/wc -l)
          printf '1\n' >"$CG/cgroup.freeze"
          for _ in $(/usr/bin/seq 1 20); do /bin/grep -q 'frozen 1' "$CG/cgroup.events" && break; /bin/sleep 0.1; done
          frozen=$(/bin/cat "$CG/cgroup.freeze"); before=$(state_counter "$FILE"); /bin/sleep 2; during=$(state_counter "$FILE")
          printf '0\n' >"$CG/cgroup.freeze"
          for _ in $(/usr/bin/seq 1 30); do after=$(state_counter "$FILE"); test "$after" -gt "$during" && break; /bin/sleep 0.1; done
          artifacts_after=$(/usr/bin/find "$CHECKPOINTS" -type f 2>/dev/null | /usr/bin/wc -l); artifacts=$((artifacts_after-artifacts_before))
          /usr/bin/python3 - "$pid" "$CG" "$frozen" "$before" "$during" "$after" "$artifacts" <<'PY'
          import json,sys
          x={'pid':int(sys.argv[1]),'cgroup':sys.argv[2],'frozen_state':int(sys.argv[3]),'counter_before':int(sys.argv[4]),'counter_during':int(sys.argv[5]),'counter_after':int(sys.argv[6]),'checkpoint_files_created':int(sys.argv[7])}
          json.dump(x,open('/home/ubuntu/cr-lab/evidence/freeze.json','w'),indent=2)
          PY
          lab_owner
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Freezer cgroup останавливает выполнение группы задач на уровне
          планировщика. В cgroup v2 интерфейс представлен файлами `cgroup.freeze`
          и `cgroup.events`; состояние `frozen 1` подтверждает завершившийся
          переход.

          Freeze не создаёт checkpoint artifacts и не переживает перезагрузку
          хоста. Все страницы памяти и kernel objects продолжают существовать
          только на текущем хосте.

          Для доказательства нужно сопоставить состояние cgroup и прикладной
          прогресс: во время freeze счётчик не меняется, после thaw тот же PID
          снова продвигается.
    description: |-
      #### Упражнение 1

      Поместите host-счётчик в отдельную cgroup `cr-demo-counter`, заморозьте
      её и зафиксируйте отсутствие прогресса счётчика. Затем разморозьте
      cgroup и подтвердите продолжение того же процесса.

      Сохраните `evidence/freeze.json` с PID, путём cgroup, состояниями
      freezer, значениями счётчика до/во время/после и количеством
      checkpoint-файлов, появившихся в результате этой операции.
  - title: Docker pause как runtime-level freeze
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          FILE="$EVIDENCE/docker-pause.json"; need_file "$FILE"
          container_running cr-docker-counter || fail "cr-docker-counter is not running"
          test "$(/usr/bin/docker inspect -f '{{.State.Paused}}' cr-docker-counter)" = false || fail "container remains paused"
          /usr/bin/python3 - "$FILE" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['container']=='cr-docker-counter' and x['container_id']
          assert x['paused'] is True and x['paused_after_unpause'] is False
          assert x['counter_during']==x['counter_before'] and x['counter_after']>x['counter_during']
          assert x['starts']>=1 and x['session']
          PY
          pass "Docker pause/unpause preserved and resumed progress"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          docker_ok || fail "Docker daemon is required for pause exercise"
          BIN="$LAB/bin/cr-demo-counter"; BUILD="$LAB/build"; DSTATE="$STATE/docker"
          test -x "$BIN" || fail "counter binary is absent"
          test -f "$LAB/bin/.static" || fail "static counter binary is required for scratch image"
          /usr/bin/install -d -o ubuntu -g ubuntu "$BUILD" "$DSTATE"
          /usr/bin/install -m 0755 "$BIN" "$BUILD/cr-demo-counter"
          /usr/bin/install -m 0644 "$LAB/src/Dockerfile" "$BUILD/Dockerfile"
          /usr/bin/docker build -t "$IMAGE" "$BUILD" >"$EVIDENCE/docker-build.log" 2>&1
          /usr/bin/docker rm -f cr-docker-counter >/dev/null 2>&1 || true
          /usr/bin/docker run -d --name cr-docker-counter --security-opt seccomp=unconfined -p 127.0.0.1:18082:18080 -v "$DSTATE:/state" "$IMAGE" >"$EVIDENCE/docker-container-id.txt"
          for _ in $(/usr/bin/seq 1 30); do test -s "$DSTATE/state.json" && break; /bin/sleep 0.2; done
          starts=$(json_get "$DSTATE/state.json" starts); session=$(json_get "$DSTATE/state.json" session); pid=$(/usr/bin/docker inspect -f '{{.State.Pid}}' cr-docker-counter)
          /usr/bin/docker pause cr-docker-counter >/dev/null
          paused=$(/usr/bin/docker inspect -f '{{.State.Paused}}' cr-docker-counter); before=$(state_counter "$DSTATE/state.json"); /bin/sleep 2; during=$(state_counter "$DSTATE/state.json")
          /usr/bin/docker unpause cr-docker-counter >/dev/null
          for _ in $(/usr/bin/seq 1 30); do after=$(state_counter "$DSTATE/state.json"); test "$after" -gt "$during" && break; /bin/sleep 0.1; done
          unpaused=$(/usr/bin/docker inspect -f '{{.State.Paused}}' cr-docker-counter)
          /usr/bin/python3 - "$pid" "$paused" "$unpaused" "$before" "$during" "$after" "$starts" "$session" <<'PY'
          import json,sys
          x={'container':'cr-docker-counter','container_id':open('/home/ubuntu/cr-lab/evidence/docker-container-id.txt').read().strip(),'pid':int(sys.argv[1]),'paused':sys.argv[2]=='true','paused_after_unpause':sys.argv[3]=='true','counter_before':int(sys.argv[4]),'counter_during':int(sys.argv[5]),'counter_after':int(sys.argv[6]),'starts':int(sys.argv[7]),'session':sys.argv[8]}
          json.dump(x,open('/home/ubuntu/cr-lab/evidence/docker-pause.json','w'),indent=2)
          PY
          lab_owner
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Docker pause предоставляет runtime-уровень над freezer-механизмом.
          Контейнер остаётся существующим, его namespaces, память и файловые
          дескрипторы не сериализуются на диск.

          Состояние `Paused` видно через Docker inspect. Во время паузы процесс не
          обслуживает HTTP и не увеличивает счётчик, после unpause тот же
          контейнер продолжает выполнение.

          Эта операция полезна для краткой согласованной остановки, но не является
          гибернацией и не заменяет checkpoint или backup.
    description: |-
      #### Упражнение 1

      Подготовьте локальный образ `cr-demo-counter:lab` и контейнер
      `cr-docker-counter` с bind mount `state/docker` в `/state`, без TTY.
      Примените pause, докажите состояние `Paused=true` и отсутствие
      прогресса, затем выполните unpause.

      Сохраните `evidence/docker-pause.json` с container id, PID,
      inspect-состояниями, значениями счётчика и числом запусков. После
      упражнения контейнер должен снова работать.
  - title: Checkpoint контейнера
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          FILE="$EVIDENCE/checkpoint.json"; need_file "$FILE"
          if full_mode; then
            /usr/bin/docker checkpoint ls cr-docker-counter | /bin/grep -qx 'cr-checkpoint-1' || fail "named checkpoint is absent"
            /usr/bin/python3 - "$FILE" <<'PY'
          import json,sys,os
          x=json.load(open(sys.argv[1])); assert x['created'] is True and x['checkpoint']=='cr-checkpoint-1'
          assert x['counter_before']>0 and x['session_before'] and x['starts_before']>=1
          assert x['artifact_files']>0 and os.path.isdir(x['checkpoint_dir'])
          PY
            pass "checkpoint artifacts and named checkpoint exist"
          else
            U="$EVIDENCE/checkpoint-unsupported.json"; need_file "$U"
            /usr/bin/python3 - "$U" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['operation'].startswith('docker checkpoint create')
          assert x['exit_code']!=0 and x['stderr'].strip() and x['reason']
          PY
            pass "fallback records a real failed checkpoint attempt"
          fi
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -uo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          C=cr-docker-counter; CP=cr-checkpoint-1; DSTATE="$STATE/docker"
          container_exists "$C" || fail "container $C does not exist"
          need_file "$DSTATE/state.json"
          before=$(state_counter "$DSTATE/state.json"); session=$(json_get "$DSTATE/state.json" session); starts=$(json_get "$DSTATE/state.json" starts)
          ERR="$EVIDENCE/checkpoint-create.stderr"; : >"$ERR"
          /usr/bin/docker checkpoint rm "$C" "$CP" >/dev/null 2>&1 || true
          /usr/bin/docker checkpoint create "$C" "$CP" >"$EVIDENCE/checkpoint-create.stdout" 2>"$ERR"; rc=$?
          if test "$rc" -eq 0; then
            printf 'full\n' >"$MODE_FILE"
            /usr/bin/docker checkpoint ls "$C" >"$EVIDENCE/checkpoint-list.txt" 2>&1
            id=$(/usr/bin/docker inspect -f '{{.Id}}' "$C"); root=$(/usr/bin/docker info -f '{{.DockerRootDir}}' 2>/dev/null); dir="$root/containers/$id/checkpoints/$CP"
            artifacts=$(/usr/bin/find "$dir" -type f 2>/dev/null | /usr/bin/wc -l)
            /usr/bin/python3 - "$before" "$session" "$starts" "$dir" "$artifacts" <<'PY'
          import json,sys
          x={'container':'cr-docker-counter','checkpoint':'cr-checkpoint-1','counter_before':int(sys.argv[1]),'session_before':sys.argv[2],'starts_before':int(sys.argv[3]),'checkpoint_dir':sys.argv[4],'artifact_files':int(sys.argv[5]),'created':True}
          json.dump(x,open('/home/ubuntu/cr-lab/evidence/checkpoint.json','w'),indent=2)
          PY
            /bin/rm -f "$EVIDENCE/checkpoint-unsupported.json"
          else
            printf 'fallback\n' >"$MODE_FILE"
            stderr=$(/bin/cat "$ERR")
            /usr/bin/python3 - "$rc" "$stderr" <<'PY'
          import json,sys
          x={'operation':'docker checkpoint create cr-docker-counter cr-checkpoint-1','exit_code':int(sys.argv[1]),'stderr':sys.argv[2],'reason':'runtime-checkpoint-attempt-failed'}
          json.dump(x,open('/home/ubuntu/cr-lab/evidence/checkpoint-unsupported.json','w'),indent=2)
          json.dump({'container':'cr-docker-counter','checkpoint':'cr-checkpoint-1','created':False,'mode':'fallback'},open('/home/ubuntu/cr-lab/evidence/checkpoint.json','w'),indent=2)
          PY
            if container_exists "$C" && ! container_running "$C"; then /usr/bin/docker start "$C" >/dev/null 2>&1 || true; fi
          fi
          lab_owner
          exit 0
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Checkpoint превращает runtime state в набор файлов: образы памяти,
          таблицы страниц, descriptors и метаданные namespaces. Docker связывает
          именованный checkpoint с контейнером.

          Checkpoint не равен `docker commit`: commit фиксирует изменения writable
          layer, но не память работающего процесса. Также checkpoint не заменяет
          согласованное сохранение bind mounts и volumes.

          Если среда не поддерживает операцию, корректный fallback должен
          содержать выполненную попытку, код возврата и диагностическую причину.
          Скрывать реальную ошибку пустым файлом нельзя.
    description: |-
      #### Упражнение 1

      Для `cr-docker-counter` создайте именованный checkpoint
      `cr-checkpoint-1` и сохраните значение счётчика, session id и число
      запусков непосредственно перед операцией.

      В full-mode должны существовать checkpoint artifacts и запись в списке
      checkpoint. Если реальная попытка обнаружила ограничение среды,
      переключите лабораторию в fallback-mode и создайте
      `evidence/checkpoint-unsupported.json` с командой-операцией, exit code,
      stderr и причиной. Основной evidence сохраните как
      `evidence/checkpoint.json`.
  - title: Restore и продолжение выполнения
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          FILE="$EVIDENCE/restore.json"; need_file "$FILE"
          if full_mode; then
            container_running cr-docker-counter || fail "restored container is not running"
            need_file "$EVIDENCE/restore-inspect.json"; need_file "$EVIDENCE/restore-checkpoint-list.txt"
            /usr/bin/python3 - "$FILE" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['mode']=='full' and x['restored'] is True
          assert x['counter_after']>x['counter_before']
          assert x['session_after']==x['session_before'] and x['starts_after']==x['starts_before']
          PY
            pass "restored process continued without entrypoint restart"
          else
            /usr/bin/python3 - "$FILE" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['mode']=='fallback' and x['restored'] is False
          assert x['restart_claimed_as_restore'] is False and x['blocked_by'] and x['checkpoint_exit_code']!=0
          PY
            pass "fallback does not represent restart as restore"
          fi
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          OUT="$EVIDENCE/restore.json"; C=cr-docker-counter; DSTATE="$STATE/docker"
          if full_mode; then
            need_file "$EVIDENCE/checkpoint.json"
            before=$(json_get "$EVIDENCE/checkpoint.json" counter_before); session=$(json_get "$EVIDENCE/checkpoint.json" session_before); starts=$(json_get "$EVIDENCE/checkpoint.json" starts_before)
            /usr/bin/docker start --checkpoint cr-checkpoint-1 "$C" >"$EVIDENCE/restore.stdout" 2>"$EVIDENCE/restore.stderr"
            for _ in $(/usr/bin/seq 1 50); do test -s "$DSTATE/state.json" && after=$(state_counter "$DSTATE/state.json") && test "$after" -gt "$before" && break; /bin/sleep 0.2; done
            after=$(state_counter "$DSTATE/state.json"); session_after=$(json_get "$DSTATE/state.json" session); starts_after=$(json_get "$DSTATE/state.json" starts)
            /usr/bin/docker inspect "$C" >"$EVIDENCE/restore-inspect.json"
            /usr/bin/docker checkpoint ls "$C" >"$EVIDENCE/restore-checkpoint-list.txt"
            /usr/bin/python3 - "$before" "$after" "$session" "$session_after" "$starts" "$starts_after" <<'PY'
          import json,sys
          x={'mode':'full','restored':True,'counter_before':int(sys.argv[1]),'counter_after':int(sys.argv[2]),'session_before':sys.argv[3],'session_after':sys.argv[4],'starts_before':int(sys.argv[5]),'starts_after':int(sys.argv[6])}
          json.dump(x,open('/home/ubuntu/cr-lab/evidence/restore.json','w'),indent=2)
          PY
          else
            need_file "$EVIDENCE/checkpoint-unsupported.json"
            /usr/bin/python3 - <<'PY'
          import json
          u=json.load(open('/home/ubuntu/cr-lab/evidence/checkpoint-unsupported.json'))
          x={'mode':'fallback','restored':False,'restart_claimed_as_restore':False,'blocked_by':u['reason'],'checkpoint_exit_code':u['exit_code']}
          json.dump(x,open('/home/ubuntu/cr-lab/evidence/restore.json','w'),indent=2)
          PY
          fi
          lab_owner
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          При restore runtime не должен заново выполнять entrypoint. CRIU
          восстанавливает сохранённые страницы памяти и продолжает поток
          инструкций с checkpoint-позиции.

          Рост счётчика сам по себе недостаточен: приложение могло загрузить
          значение из файла после restart. Более сильное доказательство —
          неизменные session id и `starts` при монотонном продолжении counter.

          Docker inspect, список checkpoint и состояние процесса дополняют
          прикладные признаки, связывая наблюдение с конкретным восстановленным
          контейнером.
    description: |-
      #### Упражнение 1

      В full-mode восстановите `cr-docker-counter` из `cr-checkpoint-1`.
      Докажите, что counter стал больше сохранённого значения, а session id и
      `starts` не изменились. Сохраните inspect и список checkpoints.

      В fallback-mode создайте `evidence/restore.json`, которое ссылается на
      диагностированную невозможность checkpoint и явно отмечает, что restart
      не выдаётся за restore.
  - title: Открытые файлы и volume state
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          FILE="$EVIDENCE/open-files.json"; need_file "$FILE"
          /usr/bin/python3 - "$FILE" <<'PY'
          import json,sys,os
          x=json.load(open(sys.argv[1])); assert x['mode'] in ('full','fallback')
          assert x['inode']>0 and x['size_after']>x['size_before'] and x['old_data_preserved'] is True
          assert x['first_record_sha256'] and x['session'] and x['last_record']
          assert os.path.islink(x['fd_path'])
          assert x['proves_restore'] is (x['mode']=='full')
          PY
          pass "open journal descriptor and growing volume data verified"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          C=cr-docker-counter; JOURNAL="$STATE/docker/journal.log"
          container_running "$C" || /usr/bin/docker start "$C" >/dev/null
          if ! full_mode; then /usr/bin/docker pause "$C" >/dev/null; /bin/sleep 1; /usr/bin/docker unpause "$C" >/dev/null; fi
          pid=$(/usr/bin/docker inspect -f '{{.State.Pid}}' "$C"); need_file "$JOURNAL"
          fd_link=$(/usr/bin/find "/proc/$pid/fd" -maxdepth 1 -type l -lname '*journal.log' -print -quit)
          test -n "$fd_link" || fail "open journal descriptor was not found"
          inode=$(/usr/bin/stat -c '%i' "$JOURNAL"); size_before=$(/usr/bin/stat -c '%s' "$JOURNAL"); first_hash=$(/usr/bin/head -n 1 "$JOURNAL" | /usr/bin/sha256sum | /usr/bin/cut -d' ' -f1); session=$(json_get "$STATE/docker/state.json" session)
          /bin/sleep 2
          size_after=$(/usr/bin/stat -c '%s' "$JOURNAL"); last=$(/usr/bin/tail -n 1 "$JOURNAL")
          /usr/bin/python3 - "$pid" "$fd_link" "$inode" "$size_before" "$size_after" "$first_hash" "$session" "$last" "$(/bin/cat "$MODE_FILE")" <<'PY'
          import json,sys
          x={'mode':sys.argv[9],'container_pid':int(sys.argv[1]),'fd_path':sys.argv[2],'inode':int(sys.argv[3]),'size_before':int(sys.argv[4]),'size_after':int(sys.argv[5]),'first_record_sha256':sys.argv[6],'session':sys.argv[7],'last_record':sys.argv[8],'old_data_preserved':True,'proves_restore':sys.argv[9]=='full'}
          json.dump(x,open('/home/ubuntu/cr-lab/evidence/open-files.json','w'),indent=2)
          PY
          lab_owner
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          CRIU сохраняет сведения о файловых дескрипторах процесса, включая
          текущую позицию и flags. Однако содержимое внешнего volume живёт вне
          process image и должно сохраняться согласованно отдельно.

          Полезная нагрузка держит `journal.log` открытым в append-режиме. После
          настоящего restore inode файла и session процесса должны остаться
          согласованными, а новые записи — продолжить журнал без потери прежнего
          префикса.

          Проверка `/proc/<pid>/fd` показывает kernel-level связь процесса с
          файлом; проверка volume подтверждает, что внешние данные действительно
          доступны.
    description: |-
      #### Упражнение 1

      Исследуйте открытый `journal.log` контейнера через
      `/proc/<container-pid>/fd`, зафиксируйте inode, размер, последнюю запись
      и session id. После периода работы убедитесь, что тот же журнал вырос и
      старые данные сохранились.

      Сохраните `evidence/open-files.json`. В fallback-mode выполните эту
      проверку на работающем pause/unpause workload и явно укажите, что она
      доказывает поведение volume/open file, но не restore.
  - title: Ограничения checkpoint/restore
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          FILE="$EVIDENCE/negative-test.json"; need_file "$FILE"
          /usr/bin/python3 - "$FILE" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['tested_feature']=='checkpoint-container-with-external-tty'
          assert x['container_settings']['tty'] is True and x['main_workload_unchanged'] is True
          assert x['outcome'] in ('expected-failure','unexpected-success','setup-failure') and x['reason']
          if x['outcome']!='unexpected-success': assert x['exit_code']!=0 and x['stderr'].strip()
          else: assert x['exit_code']==0
          PY
          container_exists cr-docker-counter || fail "negative test removed the main workload"
          pass "isolated TTY checkpoint limitation was recorded"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -uo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          C=cr-negative-tty; CP=cr-negative-checkpoint; ERR="$EVIDENCE/negative-test.stderr"
          /usr/bin/docker rm -f "$C" >/dev/null 2>&1 || true
          /usr/bin/docker run -d -t --name "$C" --security-opt seccomp=unconfined "$IMAGE" >"$EVIDENCE/negative-container-id.txt" 2>"$EVIDENCE/negative-run.stderr"; run_rc=$?
          if test "$run_rc" -eq 0; then
            tty=$(/usr/bin/docker inspect -f '{{.Config.Tty}}' "$C")
            /usr/bin/docker checkpoint create "$C" "$CP" >"$EVIDENCE/negative-test.stdout" 2>"$ERR"; rc=$?
            if test "$rc" -eq 0; then outcome=unexpected-success; reason="runtime-supported-tty-checkpoint"; else outcome=expected-failure; reason="tty-or-runtime-resource-rejected"; fi
          else
            tty=true; rc=$run_rc; outcome=setup-failure; reason="negative-container-could-not-start"; /bin/cp "$EVIDENCE/negative-run.stderr" "$ERR"
          fi
          stderr=$(/bin/cat "$ERR" 2>/dev/null)
          /usr/bin/python3 - "$tty" "$outcome" "$rc" "$stderr" "$reason" "$(/bin/cat "$MODE_FILE")" <<'PY'
          import json,sys
          x={'tested_feature':'checkpoint-container-with-external-tty','container':'cr-negative-tty','container_settings':{'tty':sys.argv[1]=='true'},'outcome':sys.argv[2],'exit_code':int(sys.argv[3]),'stderr':sys.argv[4],'reason':sys.argv[5],'main_mode':sys.argv[6],'main_workload_unchanged':True}
          json.dump(x,open('/home/ubuntu/cr-lab/evidence/negative-test.json','w'),indent=2)
          PY
          if container_exists "$C" && ! container_running "$C"; then /usr/bin/docker start "$C" >/dev/null 2>&1 || true; fi
          lab_owner
          exit 0
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Checkpoint зависит от возможности CRIU представить каждый внешний
          ресурс. Терминалы, некоторые сокеты и network configurations, seccomp,
          devices и kernel-specific state могут сделать dump невозможным.

          Контролируемый негативный тест должен быть изолирован от основного
          контейнера. Его ожидаемый отказ — наблюдение ограничения, а не причина
          считать основной workflow выполненным.

          Диагностика должна содержать тип ресурса, exit code и stderr. Если новая
          версия runtime неожиданно поддержала сценарий, это также фиксируется
          честно как `unexpected-success`, без подмены результата.
    description: |-
      #### Упражнение 1

      Создайте отдельный контейнер `cr-negative-tty` с выделенным TTY и
      попытайтесь сделать checkpoint `cr-negative-checkpoint`. Не изменяйте
      основной `cr-docker-counter`.

      Сохраните `evidence/negative-test.json` с tested feature, container
      settings, outcome, exit code и stderr. При fallback из-за общей
      недоступности checkpoint сохраните одновременно эту причину и параметры
      подготовленного TTY-контейнера.
  - title: Гибернация полезной нагрузки
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          FILE="$EVIDENCE/hibernation.json"; need_file "$FILE"; need_file "$EVIDENCE/hibernate-http-after.json"
          /usr/bin/python3 - "$FILE" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1])); assert x['mode'] in ('full','fallback') and x['http_ok'] is True
          assert x['counter_after']>x['counter_before']
          if x['mode']=='full':
           assert x['restored'] is True and x['session_after']==x['session_before'] and x['starts_after']==x['starts_before']
           assert x['container_id_after']!=x['container_id_before'] and x['artifact_files']>0
          else:
           assert x['restored'] is False and x['process_image_created'] is False and x['workflow']=='http-pause-unpause-only'
          PY
          container_running cr-hibernate || fail "HTTP workload is not running"
          pass "hibernation workflow matches the supported environment mode"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -uo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          C=cr-hibernate; CP=hibernate-1; HSTATE="$STATE/hibernate"; HDIR="$CHECKPOINTS/hibernate"; OUT="$EVIDENCE/hibernation.json"
          /usr/bin/docker rm -f "$C" >/dev/null 2>&1 || true
          /bin/rm -rf "$HSTATE" "$HDIR"; /usr/bin/install -d -o ubuntu -g ubuntu "$HSTATE" "$HDIR"
          /usr/bin/docker run -d --name "$C" --security-opt seccomp=unconfined -p 127.0.0.1:18083:18080 -v "$HSTATE:/state" "$IMAGE" >"$EVIDENCE/hibernate-container-id-before.txt" 2>"$EVIDENCE/hibernate-run.stderr" || fail "cannot start hibernation workload"
          for _ in $(/usr/bin/seq 1 40); do test -s "$HSTATE/state.json" && break; /bin/sleep 0.2; done
          /usr/bin/python3 - <<'PY' >"$EVIDENCE/hibernate-http-before.json"
          import urllib.request
          print(urllib.request.urlopen('http://127.0.0.1:18083/',timeout=3).read().decode(),end='')
          PY
          before=$(state_counter "$EVIDENCE/hibernate-http-before.json"); session=$(json_get "$EVIDENCE/hibernate-http-before.json" session); starts=$(json_get "$EVIDENCE/hibernate-http-before.json" starts)

          if full_mode; then
            /usr/bin/docker checkpoint create --checkpoint-dir "$HDIR" "$C" "$CP" >"$EVIDENCE/hibernate-checkpoint.stdout" 2>"$EVIDENCE/hibernate-checkpoint.stderr"; rc=$?
            if test "$rc" -eq 0; then
              old_id=$(/bin/cat "$EVIDENCE/hibernate-container-id-before.txt")
              /usr/bin/docker rm "$C" >/dev/null 2>&1
              /usr/bin/docker create --name "$C" --security-opt seccomp=unconfined -p 127.0.0.1:18083:18080 -v "$HSTATE:/state" "$IMAGE" >"$EVIDENCE/hibernate-container-id-after.txt"
              /usr/bin/docker start --checkpoint "$CP" --checkpoint-dir "$HDIR" "$C" >"$EVIDENCE/hibernate-restore.stdout" 2>"$EVIDENCE/hibernate-restore.stderr"; restore_rc=$?
              if test "$restore_rc" -eq 0; then
                for _ in $(/usr/bin/seq 1 50); do
                  if /usr/bin/python3 - <<'PY' >"$EVIDENCE/hibernate-http-after.json" 2>/dev/null
          import urllib.request
          print(urllib.request.urlopen('http://127.0.0.1:18083/',timeout=1).read().decode(),end='')
          PY
                  then candidate=$(state_counter "$EVIDENCE/hibernate-http-after.json"); test "$candidate" -gt "$before" && break; fi
                  /bin/sleep 0.2
                done
                after=$(state_counter "$EVIDENCE/hibernate-http-after.json"); session_after=$(json_get "$EVIDENCE/hibernate-http-after.json" session); starts_after=$(json_get "$EVIDENCE/hibernate-http-after.json" starts); new_id=$(/bin/cat "$EVIDENCE/hibernate-container-id-after.txt"); artifacts=$(/usr/bin/find "$HDIR" -type f | /usr/bin/wc -l)
                /usr/bin/python3 - "$before" "$after" "$session" "$session_after" "$starts" "$starts_after" "$old_id" "$new_id" "$artifacts" <<'PY'
          import json,sys
          x={'mode':'full','workflow':'external-checkpoint-remove-create-restore','restored':True,'counter_before':int(sys.argv[1]),'counter_after':int(sys.argv[2]),'session_before':sys.argv[3],'session_after':sys.argv[4],'starts_before':int(sys.argv[5]),'starts_after':int(sys.argv[6]),'container_id_before':sys.argv[7],'container_id_after':sys.argv[8],'artifact_files':int(sys.argv[9]),'http_ok':True}
          json.dump(x,open('/home/ubuntu/cr-lab/evidence/hibernation.json','w'),indent=2)
          PY
                lab_owner; exit 0
              fi
            fi
            printf 'fallback\n' >"$MODE_FILE"
            /usr/bin/docker rm -f "$C" >/dev/null 2>&1 || true
            /usr/bin/docker run -d --name "$C" --security-opt seccomp=unconfined -p 127.0.0.1:18083:18080 -v "$HSTATE:/state" "$IMAGE" >/dev/null
          fi
          # Honest fallback: exercise a temporary hibernation-like pause, without claiming process-image persistence.
          /usr/bin/docker pause "$C" >/dev/null; /bin/sleep 1; /usr/bin/docker unpause "$C" >/dev/null
          for _ in $(/usr/bin/seq 1 40); do
            if /usr/bin/python3 - <<'PY' >"$EVIDENCE/hibernate-http-after.json" 2>/dev/null
          import urllib.request
          print(urllib.request.urlopen('http://127.0.0.1:18083/',timeout=1).read().decode(),end='')
          PY
            then candidate=$(state_counter "$EVIDENCE/hibernate-http-after.json"); test "$candidate" -gt "$before" && break; fi
            /bin/sleep 0.2
          done
          after=$(state_counter "$EVIDENCE/hibernate-http-after.json")
          /usr/bin/python3 - "$before" "$after" <<'PY'
          import json,sys
          x={'mode':'fallback','workflow':'http-pause-unpause-only','restored':False,'process_image_created':False,'counter_before':int(sys.argv[1]),'counter_after':int(sys.argv[2]),'http_ok':True,'limitation':'checkpoint-or-external-restore-unavailable'}
          json.dump(x,open('/home/ubuntu/cr-lab/evidence/hibernation.json','w'),indent=2)
          PY
          lab_owner
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Гибернация объединяет checkpoint, остановку runtime instance и
          последующий restore. Инженерная цель — сократить downtime долгого
          вычисления или сохранить in-memory состояние перед обслуживанием.

          Для переноса checkpoint за пределы lifecycle контейнера используется
          внешний checkpoint directory. Новый runtime instance должен быть создан
          с совместимыми mount, network и security settings.

          HTTP endpoint даёт независимое наблюдение внутреннего состояния. После
          restore session и starts должны сохраниться, counter — продолжиться, а
          volume journal — остаться доступным.
    description: |-
      #### Упражнение 1

      В full-mode выполните end-to-end workflow для контейнера `cr-hibernate`:
      запустите workload, получите HTTP state, создайте внешний checkpoint
      `hibernate-1`, удалите runtime instance, создайте совместимый экземпляр
      и восстановите его из checkpoint directory.

      Сохраните состояния до и после в `evidence/hibernation.json`; проверьте
      endpoint, монотонность counter, неизменность session/starts и наличие
      artifacts. В fallback-mode выполните HTTP pause/unpause workflow и
      сохраните его как ограниченную имитацию без утверждения о сохранении
      process image.
  - title: Очистка checkpoint artifacts
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          FILE="$EVIDENCE/cleanup.json"; need_file "$FILE"
          if docker_ok && /usr/bin/docker ps -a --format '{{.Names}}' | /bin/grep -q '^cr-'; then fail "cr-* containers remain"; fi
          test ! -e /sys/fs/cgroup/cr-demo-counter || fail "lab cgroup remains"
          test ! -e "$CHECKPOINTS" || fail "checkpoint directory remains"
          test ! -e "$STATE" || fail "temporary state directory remains"
          if /usr/bin/pgrep -x cr-demo-counter >/dev/null 2>&1; then fail "counter process remains"; fi
          /usr/bin/python3 - "$FILE" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]));
          for k in ('containers_absent','counter_processes_absent','cgroup_absent','checkpoint_directories_absent','state_directories_absent'): assert x[k] is True
          assert set(x['checked_categories'])=={'containers','processes','cgroup','checkpoint-artifacts','temporary-state'}
          PY
          pass "containers, processes, cgroup, checkpoints and temporary state are absent"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          source /home/ubuntu/cr-lab/lib/common.sh
          PIDFILE="$LAB/run/host.pid"
          if test -f /sys/fs/cgroup/cr-demo-counter/cgroup.freeze; then printf '0\n' >/sys/fs/cgroup/cr-demo-counter/cgroup.freeze || true; fi
          if test -f "$PIDFILE"; then pid=$(/bin/cat "$PIDFILE"); /bin/kill "$pid" 2>/dev/null || true; for _ in $(/usr/bin/seq 1 20); do /bin/kill -0 "$pid" 2>/dev/null || break; /bin/sleep 0.1; done; /bin/kill -9 "$pid" 2>/dev/null || true; fi
          if docker_ok; then
            mapfile -t containers < <(/usr/bin/docker ps -a --format '{{.Names}}' | /bin/grep '^cr-' || true)
            if test "${#containers[@]}" -gt 0; then /usr/bin/docker rm -f "${containers[@]}" >/dev/null; fi
            /usr/bin/docker image rm "$IMAGE" >/dev/null 2>&1 || true
          fi
          /bin/rmdir /sys/fs/cgroup/cr-demo-counter 2>/dev/null || true
          /bin/rm -rf "$CHECKPOINTS" "$STATE" "$LAB/build" "$LAB/run" "$LAB/bin" "$LAB/src"
          /usr/bin/python3 - <<'PY'
          import json,os,subprocess
          names=[]
          try:
           names=subprocess.check_output(['/usr/bin/docker','ps','-a','--format','{{.Names}}'],text=True,stderr=subprocess.DEVNULL).splitlines()
          except Exception: pass
          alive=[]
          for p in os.listdir('/proc'):
           if p.isdigit():
            try:
             if open(f'/proc/{p}/comm').read().strip()=='cr-demo-counter': alive.append(int(p))
            except OSError: pass
          x={'containers_absent':not any(n.startswith('cr-') for n in names),'counter_processes_absent':not alive,'cgroup_absent':not os.path.exists('/sys/fs/cgroup/cr-demo-counter'),'checkpoint_directories_absent':not os.path.exists('/home/ubuntu/cr-lab/checkpoints'),'state_directories_absent':not os.path.exists('/home/ubuntu/cr-lab/state'),'checked_categories':['containers','processes','cgroup','checkpoint-artifacts','temporary-state']}
          json.dump(x,open('/home/ubuntu/cr-lab/evidence/cleanup.json','w'),indent=2)
          PY
          lab_owner
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Checkpoint images могут занимать значительный объём диска и содержать
          фрагменты памяти приложения: ключи, токены и пользовательские данные. Их
          жизненный цикл требует тех же правил доступа и удаления, что и
          чувствительные backups.

          Контейнеры, cgroups, bind-mounted state и внешние checkpoint directories
          являются разными объектами. Удаление контейнера не гарантирует удаления
          экспортированного checkpoint или данных volume.

          Финальная очистка должна удалить runtime-объекты и process images, но
          оставить итоговый machine-readable evidence проверки очистки.
    description: |-
      #### Упражнение 1

      Остановите host workload, разморозив его при необходимости. Удалите все
      контейнеры с именами `cr-*`, cgroup лабораторной, checkpoint directories
      и временные state-каталоги.

      Сохраните только `evidence/cleanup.json`, где перечислены проверенные
      категории и подтверждено отсутствие контейнеров, живых процессов
      `cr-demo-counter`, cgroup и checkpoint artifacts.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 17
- title: Network namespace, veth, bridge и NAT без Docker
  description: |-
    Лабораторная работа разбирает сетевую модель контейнеров до уровня Linux
    network namespaces, veth, bridge, маршрутизации, NAT и локального
    service discovery. Студент вручную собирает сегмент для двух
    долгоживущих HTTP-процессов, а затем сопоставляет его с пользовательской
    Docker bridge-сетью.
  time-limit-minutes: 180
  steps:
  - title: Инвентаризация сетевого стека хоста
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare	---
          cat <<'EOF' > prepare
          #!/usr/bin/env bash
          set -euo pipefail
          for tool in ip jq curl python3 iptables; do
            command -v "$tool" >/dev/null 2>&1 || { printf 'Required tool is missing: %s\n' "$tool" >&2; exit 1; }
          done
          install -d -m 0755 /home/ubuntu/netlab /home/ubuntu/netlab/evidence /home/ubuntu/netlab/run
          chown -R ubuntu:ubuntu /home/ubuntu/netlab
          EOF
          trap 'rm -f prepare' EXIT

          # ---	pre-step	---
          cat <<'EOF' > pre-step
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/test -d /home/ubuntu/netlab/evidence
          /usr/bin/test -d /home/ubuntu/netlab/run
          EOF
          trap 'rm -f pre-step' EXIT


          # ----------RUN----------
          chmod u+x prepare
          ./prepare
          chmod u+x pre-step
          ./pre-step
        check: |-
          # ----------EXEC----------
          # ---	check	---
          cat <<'EOF' > check
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/netlab/evidence
          mkdir -p "$EVIDENCE" /home/ubuntu/netlab/run
          fail() { printf 'FAIL: %s\n' "$*" >&2; exit 1; }
          pass() { printf 'PASS: %s\n' "$*"; }
          json_valid() { jq -e . "$1" >/dev/null 2>&1 || fail "invalid or missing evidence: $1"; }
          ns_exists() { ip netns list | awk '{print $1}' | grep -Fxq "$1"; }
          f="$EVIDENCE/01-baseline.json"; json_valid "$f"
          jq -e '.stage=="host-baseline" and (.interfaces|type=="array") and (.routes|type=="array") and (.bridges|type=="array") and (.docker_networks|type=="array")' "$f" >/dev/null || fail "baseline fields"
          ! ip netns list | grep -Eq '^(net-api-ns|net-client-ns)\b' || fail "lab namespace already exists"
          test ! -e /sys/class/net/br-netlab || fail "br-netlab already exists"
          ! iptables-save 2>/dev/null | grep -q 'netlab-' || fail "netlab firewall rule already exists"
          pass "host baseline is structured and lab objects are absent"
          EOF
          trap 'rm -f check' EXIT


          # ----------RUN----------
          chmod u+x check
          ./check
        solution: |-
          # ----------EXEC----------
          # ---	solution	---
          cat <<'EOF' > solution
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/netlab/evidence
          mkdir -p "$EVIDENCE" /home/ubuntu/netlab/run
          fail() { printf 'FAIL: %s\n' "$*" >&2; exit 1; }
          pass() { printf 'PASS: %s\n' "$*"; }
          json_valid() { jq -e . "$1" >/dev/null 2>&1 || fail "invalid or missing evidence: $1"; }
          ns_exists() { ip netns list | awk '{print $1}' | grep -Fxq "$1"; }
          test ! -e /run/netns/net-api-ns
          test ! -e /run/netns/net-client-ns
          test ! -e /sys/class/net/br-netlab
          links=$(mktemp); routes=$(mktemp); bridges=$(mktemp); networks=$(mktemp)
          ip -j -details link show >"$links"
          ip -j route show table all >"$routes"
          bridge -j link show >"$bridges"
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            docker network ls --format '{{json .}}' | jq -s . >"$networks"
            docker_available=true
          else
            printf '[]\n' >"$networks"; docker_available=false
          fi
          jq -n --arg stage host-baseline --argjson docker_available "$docker_available"   --slurpfile interfaces "$links" --slurpfile routes "$routes" --slurpfile bridges "$bridges" --slurpfile docker_networks "$networks"   '{stage:$stage,docker_available:$docker_available,interfaces:$interfaces[0],routes:$routes[0],bridges:$bridges[0],docker_networks:$docker_networks[0]}'   >"$EVIDENCE/01-baseline.json"
          chown ubuntu:ubuntu "$EVIDENCE/01-baseline.json"
          rm -f "$links" "$routes" "$bridges" "$networks"
          EOF
          trap 'rm -f solution' EXIT


          # ----------RUN----------
          chmod u+x solution
          ./solution
        post-step: |-
          # ----------EXEC----------
          # ---	post-step	---
          cat <<'EOF' > post-step
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/test -d /home/ubuntu/netlab/evidence
          EOF
          trap 'rm -f post-step' EXIT


          # ----------RUN----------
          chmod u+x post-step
          ./post-step
        hints: |-
          Network namespace изолирует сетевые интерфейсы, адреса, таблицы
          маршрутизации, состояние firewall и loopback. Начальный сетевой стек
          хоста — это не «глобальная сеть Linux», а один из network namespaces, в
          котором по умолчанию запускаются обычные процессы.

          Перед созданием лабораторных объектов важно зафиксировать baseline. Он
          позволяет отличить добавленные интерфейсы и правила от существующих, а
          после очистки — доказать, что Docker networks и сеть виртуальной машины
          не повреждены.

          Инвентаризация должна быть машиночитаемой. В этой работе evidence
          хранится в `/home/ubuntu/netlab/evidence`: проверки сопоставляют его с
          реальным состоянием, а не оценивают текстовый отчёт.
    description: |-
      #### Упражнение 1

      Сохраните исходное состояние interfaces, routes, Linux bridges и Docker
      networks в структурированный файл
      `/home/ubuntu/netlab/evidence/01-baseline.json`. В evidence должны
      присутствовать метка этапа, JSON-представления интерфейсов и маршрутов,
      список мостов и список Docker networks; отсутствие Docker также должно
      быть выражено явно.

      Не создавайте namespaces, veth, bridge или firewall-правила лабораторной
      на этом этапе. Проверка ожидает чистый baseline и отсутствие объектов
      `netlab`/`br-netlab`.
  - title: Создание двух network namespaces
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare	---
          cat <<'EOF' > prepare
          #!/usr/bin/env bash
          set -euo pipefail
          for tool in ip jq curl python3 iptables; do
            command -v "$tool" >/dev/null 2>&1 || { printf 'Required tool is missing: %s\n' "$tool" >&2; exit 1; }
          done
          install -d -m 0755 /home/ubuntu/netlab /home/ubuntu/netlab/evidence /home/ubuntu/netlab/run
          chown -R ubuntu:ubuntu /home/ubuntu/netlab
          EOF
          trap 'rm -f prepare' EXIT

          # ---	pre-step	---
          cat <<'EOF' > pre-step
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/test -d /home/ubuntu/netlab/evidence
          /usr/bin/test -d /home/ubuntu/netlab/run
          EOF
          trap 'rm -f pre-step' EXIT


          # ----------RUN----------
          chmod u+x prepare
          ./prepare
          chmod u+x pre-step
          ./pre-step
        check: |-
          # ----------EXEC----------
          # ---	check	---
          cat <<'EOF' > check
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/netlab/evidence
          mkdir -p "$EVIDENCE" /home/ubuntu/netlab/run
          fail() { printf 'FAIL: %s\n' "$*" >&2; exit 1; }
          pass() { printf 'PASS: %s\n' "$*"; }
          json_valid() { jq -e . "$1" >/dev/null 2>&1 || fail "invalid or missing evidence: $1"; }
          ns_exists() { ip netns list | awk '{print $1}' | grep -Fxq "$1"; }
          f="$EVIDENCE/02-namespaces.json"; json_valid "$f"
          for ns in net-api-ns net-client-ns; do
           ns_exists "$ns" || fail "$ns missing"
