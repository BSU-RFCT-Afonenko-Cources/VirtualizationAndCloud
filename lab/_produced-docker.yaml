        hints: |-
          Network namespace без интерфейса создаёт изоляцию, но не полезную
          сервисную границу. Runtime должен явно создать virtual Ethernet pair,
          переместить один конец к workload, назначить адреса и поднять loopback и
          рабочий interface.

          Доступ с хоста должен идти к адресу namespace, а не через host loopback
          или унаследованный host interface. Это делает путь трафика наблюдаемым и
          исключает случайный запуск в host network.

          Структурированное network evidence фиксирует endpoint и inventory
          interfaces. Проверка сопоставляет его с живым namespace, поэтому вручную
          составленный файл без реальной сети не считается результатом.
    description: |-
      Создайте явную сетевую границу между хостом и API.

      #### Упражнение 1 (Подключите API к хосту)

      Создайте host interface `mrt-host` с адресом `10.200.0.1/30` и interface
      `mrt-runtime` с адресом `10.200.0.2/30` внутри network namespace API.
      Поднимите loopback и оба конца пары. API должен слушать порт 8080, а
      endpoint `http://10.200.0.2:8080/status` должен отвечать с хоста.

      Сохраните `/home/ubuntu/mini-runtime/evidence/network.json` с endpoint и
      структурированным inventory interfaces из runtime namespace. Evidence
      должно отражать реально работающую конфигурацию.
  - title: Resource boundary
