        hints: |-
          Swarm поддерживает два endpoint mode. В режиме `vip` имя сервиса
          разрешается в виртуальный IP, а встроенный балансировщик распределяет
          соединения между задачами. В режиме `dnsrr` DNS возвращает адреса задач,
          и выбор адреса выполняет клиент или внешний балансировщик.

          VIP удобен для большинства внутренних вызовов и совместим с routing
          mesh. DNSRR полезен, когда клиент умеет балансировать самостоятельно или
          должен видеть адреса реплик. Режим относится к сервису и фиксируется в
          его `EndpointSpec`.
