          import os
          import socket
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          DB_HOST = os.environ.get("DB_HOST", "db")
          DB_PORT = int(os.environ.get("DB_PORT", "6379"))


          def redis_command(*parts):
              request = f"*{len(parts)}\r\n".encode()
              for part in parts:
                  encoded = str(part).encode()
                  request += f"${len(encoded)}\r\n".encode() + encoded + b"\r\n"
              with socket.create_connection((DB_HOST, DB_PORT), timeout=2) as connection:
                  connection.sendall(request)
                  response_type = connection.recv(1)
                  line = b""
                  while not line.endswith(b"\r\n"):
                      line += connection.recv(1)
                  if response_type == b"$":
                      length = int(line[:-2])
                      if length < 0:
                          return None
                      data = b""
                      while len(data) < length + 2:
