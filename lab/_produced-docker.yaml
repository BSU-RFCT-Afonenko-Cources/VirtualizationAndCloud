            apt-get install -y runc jq busybox-static curl
          fi
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io
          fi
          if ! command -v runc >/dev/null 2>&1 && ! command -v crun >/dev/null 2>&1; then
            echo 'OCI runtime не найден: установите пакет runc или crun из репозитория дистрибутива.' >&2
            exit 1
          fi
          systemctl enable --now docker >/dev/null 2>&1 || true
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/assets/oci-lab-lib.bash"
          ensure_layout
          chown -R ubuntu:ubuntu /home/ubuntu/oci-runc-lab
          EOF
          trap 'rm -f prepare.bash' EXIT


          # ----------RUN----------
          chmod u+x prepare.bash
          ./prepare.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          pid="$(container_pid)"; [[ "$(container_status)" == running && -d "/proc/$pid" ]]
          for type in mount uts pid; do jq -e --arg type "$type" '[.linux.namespaces[] | select(.type==$type)] | length==1' "$BUNDLE/config.json" >/dev/null; done
          for ns in mnt uts pid; do
            jq -e --arg ns "$ns" '.[$ns].host and .[$ns].container and (.[$ns].host != .[$ns].container)' "$EVIDENCE/namespaces.json" >/dev/null
            [[ "$(jq -r --arg ns "$ns" '.[$ns].container' "$EVIDENCE/namespaces.json")" == "$(stat -Lc '%i' "/proc/$pid/ns/$ns")" ]]
          done
          printf 'OK: %s\n' "05-namespaces"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          write_config namespaces
          start_container
          wait_for_heartbeat
          pid="$(container_pid)"
          json='{}'
          for ns in mnt uts pid; do
            host="$(stat -Lc '%i' "/proc/1/ns/$ns")"
            container="$(stat -Lc '%i' "/proc/$pid/ns/$ns")"
            json="$(jq --arg ns "$ns" --argjson host "$host" --argjson container "$container" '. + {($ns):{host:$host,container:$container}}' <<< "$json")"
          done
          jq --argjson pid "$pid" '. + {pid:$pid}' <<< "$json" > "$EVIDENCE/namespaces.json"
          chown ubuntu:ubuntu "$EVIDENCE/namespaces.json"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          OCI не реализует изоляцию самостоятельно: runtime переводит декларацию
          linux.namespaces в системные вызовы ядра. Mount namespace изолирует
          таблицу mounts, UTS namespace — hostname, а PID namespace — нумерацию и
          видимость процессов.

          Файлы `/proc/<pid>/ns/*` являются ссылками на объекты namespaces.
          Сравнение inode этих ссылок у процесса контейнера и хоста позволяет
          проверить, действительно ли созданы отдельные пространства имён.

          Наличие записи в `config.json` выражает намерение, но окончательным
          доказательством является состояние `/proc` после запуска.
    description: |-
      #### Упражнение 1

      Настройте для OCI-контейнера отдельные mount, UTS и PID namespaces и
      перезапустите workload. Сохраните структурированное сравнение inode
      namespaces процесса контейнера и PID 1 хоста в
      `/home/ubuntu/oci-runc-lab/evidence/namespaces.json`.

      Для каждого из трёх namespaces файл должен содержать значения host и
      container. Значения должны быть получены из текущего состояния `/proc`,
      а не записаны вручную.
  - title: Cgroups в OCI config
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.bash	---
          cat <<'EOF' > prepare.bash
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          missing=()
          for command_name in runc jq busybox curl; do
            command -v "$command_name" >/dev/null 2>&1 || missing+=("$command_name")
          done
          if ((${#missing[@]})); then
            apt-get update
            apt-get install -y runc jq busybox-static curl
          fi
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io
          fi
          if ! command -v runc >/dev/null 2>&1 && ! command -v crun >/dev/null 2>&1; then
            echo 'OCI runtime не найден: установите пакет runc или crun из репозитория дистрибутива.' >&2
            exit 1
          fi
          systemctl enable --now docker >/dev/null 2>&1 || true
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/assets/oci-lab-lib.bash"
          ensure_layout
          chown -R ubuntu:ubuntu /home/ubuntu/oci-runc-lab
          EOF
          trap 'rm -f prepare.bash' EXIT


          # ----------RUN----------
          chmod u+x prepare.bash
          ./prepare.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          pid="$(container_pid)"; [[ "$(container_status)" == running && -d "/proc/$pid" ]]
          jq -e '.linux.resources.memory.limit > 0 and .linux.resources.cpu.quota > 0 and .linux.resources.cpu.period > .linux.resources.cpu.quota' "$BUNDLE/config.json" >/dev/null
          jq -e --argjson pid "$pid" '.pid==$pid and (.version==1 or .version==2) and (.path|length>0)' "$EVIDENCE/cgroup.json" >/dev/null
          if [[ "$(jq -r '.version' "$EVIDENCE/cgroup.json")" == 2 ]]; then
            jq -e '.memory_max != "max" and (.memory_max|tonumber)>0 and (.cpu_max|split(" ")|.[0]|tonumber)>0' "$EVIDENCE/cgroup.json" >/dev/null
          fi
          printf 'OK: %s\n' "06-cgroups"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          write_config cgroups
          start_container
          wait_for_heartbeat
          pid="$(container_pid)"
          if [[ -f /sys/fs/cgroup/cgroup.controllers ]]; then
            path="$(awk -F: '$1=="0" {print $3}' "/proc/$pid/cgroup")"
            base="/sys/fs/cgroup$path"
            jq -n --argjson pid "$pid" --arg path "$path" --arg memory "$(cat "$base/memory.max")" --arg cpu "$(cat "$base/cpu.max")" \
              '{pid:$pid,version:2,path:$path,memory_max:$memory,cpu_max:$cpu}' > "$EVIDENCE/cgroup.json"
          else
            memory_path="$(awk -F: '$2 ~ /memory/ {print $3}' "/proc/$pid/cgroup")"
            cpu_path="$(awk -F: '$2 ~ /cpu/ {print $3; exit}' "/proc/$pid/cgroup")"
            jq -n --argjson pid "$pid" --arg path "$memory_path" \
              --arg memory "$(cat "/sys/fs/cgroup/memory$memory_path/memory.limit_in_bytes")" \
              --arg quota "$(cat "/sys/fs/cgroup/cpu$cpu_path/cpu.cfs_quota_us")" \
              --arg period "$(cat "/sys/fs/cgroup/cpu$cpu_path/cpu.cfs_period_us")" \
              '{pid:$pid,version:1,path:$path,memory_limit:$memory,cpu_quota:$quota,cpu_period:$period}' > "$EVIDENCE/cgroup.json"
          fi
          chown ubuntu:ubuntu "$EVIDENCE/cgroup.json"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Раздел linux.resources связывает OCI bundle с контроллерами cgroups.
          Runtime создаёт или выбирает cgroup и записывает ограничения CPU, памяти
          и других ресурсов в cgroupfs до запуска процесса.

          В cgroup v2 лимит памяти виден в `memory.max`, а CPU quota и period — в
          `cpu.max`. В cgroup v1 аналогичные значения распределены по каталогам
          отдельных контроллеров.

          Конфигурация показывает требуемое ограничение, но проверять следует
          также путь процесса в `/proc/<pid>/cgroup` и реальные значения в
          cgroupfs.
    description: |-
      #### Упражнение 1

      Задайте OCI-контейнеру ограничение памяти и CPU через linux.resources.
      Перезапустите workload и создайте
      `/home/ubuntu/oci-runc-lab/evidence/cgroup.json`, включив PID, путь
      cgroup, версию и фактические значения файлов контроллеров.

      Лимит памяти должен быть конечным и положительным, а CPU quota — меньше
      полного доступного периода одного CPU.
  - title: Capabilities и seccomp в OCI
