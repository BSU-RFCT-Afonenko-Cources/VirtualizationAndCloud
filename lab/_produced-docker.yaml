          cat <<'EOF' > check
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/netlab/evidence
          mkdir -p "$EVIDENCE" /home/ubuntu/netlab/run
          fail() { printf 'FAIL: %s\n' "$*" >&2; exit 1; }
          pass() { printf 'PASS: %s\n' "$*"; }
          json_valid() { jq -e . "$1" >/dev/null 2>&1 || fail "invalid or missing evidence: $1"; }
          ns_exists() { ip netns list | awk '{print $1}' | grep -Fxq "$1"; }
          f="$EVIDENCE/09-isolation.json"; json_valid "$f"
          curl --noproxy '*' -fsS --max-time 3 http://10.203.0.1:18080/health | jq -e '.service=="net-api"' >/dev/null || fail "published endpoint blocked"
          if curl --noproxy '*' -fsS --max-time 2 http://10.203.0.10:8080/health >/dev/null 2>&1; then fail "direct host path remains open"; fi
          ip netns exec net-client-ns curl --noproxy '*' -fsS --max-time 3 http://api.internal:8080/health >/dev/null || fail "namespace client path blocked"
          docker exec netlab-docker-client wget -qO- http://api:8000 >/dev/null || fail "Docker path blocked"
          iptables-save | grep -q netlab-block-direct || fail "isolation rule missing"
          pass "only the published host path is allowed"
          EOF
          trap 'rm -f check' EXIT


          # ----------RUN----------
          chmod u+x check
          ./check
        solution: |-
          # ----------EXEC----------
          # ---	solution	---
          cat <<'EOF' > solution
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/netlab/evidence
          mkdir -p "$EVIDENCE" /home/ubuntu/netlab/run
          fail() { printf 'FAIL: %s\n' "$*" >&2; exit 1; }
          pass() { printf 'PASS: %s\n' "$*"; }
          json_valid() { jq -e . "$1" >/dev/null 2>&1 || fail "invalid or missing evidence: $1"; }
          ns_exists() { ip netns list | awk '{print $1}' | grep -Fxq "$1"; }
          iptables -t mangle -C OUTPUT -p tcp -d 10.203.0.1 --dport 18080 -m comment --comment netlab-mark-published -j MARK --set-mark 0x203 2>/dev/null || iptables -t mangle -I OUTPUT 1 -p tcp -d 10.203.0.1 --dport 18080 -m comment --comment netlab-mark-published -j MARK --set-mark 0x203
          iptables -C OUTPUT -p tcp -d 10.203.0.10 --dport 8080 -m mark --mark 0x203 -m comment --comment netlab-allow-published -j ACCEPT 2>/dev/null || iptables -I OUTPUT 1 -p tcp -d 10.203.0.10 --dport 8080 -m mark --mark 0x203 -m comment --comment netlab-allow-published -j ACCEPT
          iptables -C OUTPUT -p tcp -d 10.203.0.10 --dport 8080 -m comment --comment netlab-block-direct -j REJECT --reject-with tcp-reset 2>/dev/null || iptables -I OUTPUT 2 -p tcp -d 10.203.0.10 --dport 8080 -m comment --comment netlab-block-direct -j REJECT --reject-with tcp-reset
          published=false; direct_blocked=false
          curl --noproxy '*' -fsS --max-time 3 http://10.203.0.1:18080/health >/dev/null && published=true
          if ! curl --noproxy '*' -fsS --max-time 2 http://10.203.0.10:8080/health >/dev/null 2>&1; then direct_blocked=true; fi
          client=false; ip netns exec net-client-ns curl --noproxy '*' -fsS --max-time 3 http://api.internal:8080/health >/dev/null && client=true
          jq -n --arg stage isolation --argjson published "$published" --argjson direct_blocked "$direct_blocked" --argjson client "$client" --arg rules "$(iptables-save | grep netlab- || true)" '{stage:$stage,tests:{published:$published,direct_host_to_api_blocked:$direct_blocked,client_to_api:$client},rules:$rules}' >"$EVIDENCE/09-isolation.json"
          chown ubuntu:ubuntu "$EVIDENCE/09-isolation.json"
          EOF
          trap 'rm -f solution' EXIT


          # ----------RUN----------
          chmod u+x solution
          ./solution
        post-step: |-
          # ----------EXEC----------
          # ---	post-step	---
          cat <<'EOF' > post-step
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/test -d /home/ubuntu/netlab/evidence
          EOF
          trap 'rm -f post-step' EXIT


          # ----------RUN----------
          chmod u+x post-step
          ./post-step
        hints: |-
          Сетевая изоляция определяется не только разрешёнными путями, но и
          отсутствием лишних. Если host может обращаться к любому внутреннему
          адресу и порту, published endpoint не является реальной границей
          доступа.

          Фильтрация должна разрешать established traffic и явно опубликованный
          поток, но блокировать прямое host-to-API соединение. Правила
          ограничиваются лабораторным адресом и не должны менять общую политику
          цепочек.

          Положительная и отрицательная проверки дополняют друг друга:
          `10.203.0.1:18080` остаётся доступен, а прямой `10.203.0.10:8080` с
          хоста завершается отказом.
    description: |-
      #### Упражнение 1

      Настройте узкую host-side фильтрацию так, чтобы API оставался доступен
      через published endpoint, но прямое подключение хоста к
      `10.203.0.10:8080` блокировалось. Связь client namespace с API и
      Docker-контейнеров внутри их сети должна сохраниться.

      Сохраните ruleset и результаты positive/negative connectivity tests в
      `/home/ubuntu/netlab/evidence/09-isolation.json`. Проверка не принимает
      замену отказа неработающим API.
  - title: Очистка сетевых объектов
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare	---
          cat <<'EOF' > prepare
          #!/usr/bin/env bash
          set -euo pipefail
          for tool in ip jq curl python3 iptables; do
            command -v "$tool" >/dev/null 2>&1 || { printf 'Required tool is missing: %s\n' "$tool" >&2; exit 1; }
          done
          install -d -m 0755 /home/ubuntu/netlab /home/ubuntu/netlab/evidence /home/ubuntu/netlab/run
          chown -R ubuntu:ubuntu /home/ubuntu/netlab
          EOF
          trap 'rm -f prepare' EXIT

          # ---	pre-step	---
          cat <<'EOF' > pre-step
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/test -d /home/ubuntu/netlab/evidence
          /usr/bin/test -d /home/ubuntu/netlab/run
          EOF
          trap 'rm -f pre-step' EXIT


          # ----------RUN----------
          chmod u+x prepare
          ./prepare
          chmod u+x pre-step
          ./pre-step
        check: |-
          # ----------EXEC----------
          # ---	check	---
          cat <<'EOF' > check
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/netlab/evidence
          mkdir -p "$EVIDENCE" /home/ubuntu/netlab/run
          fail() { printf 'FAIL: %s\n' "$*" >&2; exit 1; }
          pass() { printf 'PASS: %s\n' "$*"; }
          json_valid() { jq -e . "$1" >/dev/null 2>&1 || fail "invalid or missing evidence: $1"; }
          ns_exists() { ip netns list | awk '{print $1}' | grep -Fxq "$1"; }
          f="$EVIDENCE/10-cleanup.json"; json_valid "$f"
          ! ip netns list | grep -Eq '^(net-api-ns|net-client-ns)\b' || fail "namespace leak"
          for i in br-netlab netlab-api-h netlab-client-h; do test ! -e "/sys/class/net/$i" || fail "$i leak"; done
          ! iptables-save | grep -q 'netlab-' || fail "firewall rule leak"
          test ! -e /etc/netns/net-client-ns || fail "resolver file leak"
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
           ! docker network inspect netlab-docker >/dev/null 2>&1 || fail "Docker lab network leak"
           jq -r '.docker_networks[]?.Name' "$EVIDENCE/01-baseline.json" | while read -r n; do test -z "$n" || docker network inspect "$n" >/dev/null || fail "baseline Docker network $n was removed"; done
          fi
          jq -e '.stage=="cleanup" and .matching_firewall_rules==""' "$f" >/dev/null || fail "cleanup evidence"
          pass "lab objects are removed and baseline Docker networks remain"
          EOF
          trap 'rm -f check' EXIT


          # ----------RUN----------
          chmod u+x check
          ./check
        solution: |-
          # ----------EXEC----------
          # ---	solution	---
          cat <<'EOF' > solution
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/netlab/evidence
          mkdir -p "$EVIDENCE" /home/ubuntu/netlab/run
          fail() { printf 'FAIL: %s\n' "$*" >&2; exit 1; }
          pass() { printf 'PASS: %s\n' "$*"; }
          json_valid() { jq -e . "$1" >/dev/null 2>&1 || fail "invalid or missing evidence: $1"; }
          ns_exists() { ip netns list | awk '{print $1}' | grep -Fxq "$1"; }
          for spec in  'filter OUTPUT -p tcp -d 10.203.0.10 --dport 8080 -m mark --mark 0x203 -m comment --comment netlab-allow-published -j ACCEPT'  'filter OUTPUT -p tcp -d 10.203.0.10 --dport 8080 -m comment --comment netlab-block-direct -j REJECT --reject-with tcp-reset'  'mangle OUTPUT -p tcp -d 10.203.0.1 --dport 18080 -m comment --comment netlab-mark-published -j MARK --set-mark 0x203'  'nat OUTPUT -p tcp -d 10.203.0.1 --dport 18080 -m comment --comment netlab-published -j DNAT --to-destination 10.203.0.10:8080'; do
           set -- $spec; table=$1; chain=$2; shift 2; while iptables -t "$table" -C "$chain" "$@" 2>/dev/null; do iptables -t "$table" -D "$chain" "$@"; done
          done
          for svc in api client; do if test -s /home/ubuntu/netlab/run/$svc.pid; then kill "$(cat /home/ubuntu/netlab/run/$svc.pid)" 2>/dev/null || true; fi; done
          command -v docker >/dev/null 2>&1 && docker rm -f netlab-docker-api netlab-docker-client >/dev/null 2>&1 || true
          command -v docker >/dev/null 2>&1 && docker network rm netlab-docker >/dev/null 2>&1 || true
          ip netns del net-api-ns 2>/dev/null || true
          ip netns del net-client-ns 2>/dev/null || true
          ip link del br-netlab 2>/dev/null || true
          ip link del netlab-api-h 2>/dev/null || true
          ip link del netlab-client-h 2>/dev/null || true
          rm -rf /etc/netns/net-client-ns
          links=$(mktemp); namespaces=$(mktemp); networks=$(mktemp)
          ip -j link show >"$links"; ip netns list | jq -Rsc 'split("\n")|map(select(length>0))' >"$namespaces"
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then docker network ls --format '{{json .}}' | jq -s . >"$networks"; else printf '[]\n' >"$networks"; fi
          jq -n --arg stage cleanup --slurpfile interfaces "$links" --slurpfile namespaces "$namespaces" --slurpfile docker_networks "$networks" --arg rules "$(iptables-save | grep netlab- || true)" '{stage:$stage,interfaces:$interfaces[0],namespaces:$namespaces[0],matching_firewall_rules:$rules,docker_networks:$docker_networks[0]}' >"$EVIDENCE/10-cleanup.json"
          chown ubuntu:ubuntu "$EVIDENCE/10-cleanup.json"; rm -f "$links" "$namespaces" "$networks"
          EOF
          trap 'rm -f solution' EXIT


          # ----------RUN----------
          chmod u+x solution
          ./solution
        post-step: |-
          # ----------EXEC----------
          # ---	post-step	---
          cat <<'EOF' > post-step
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/test -d /home/ubuntu/netlab/evidence
          EOF
          trap 'rm -f post-step' EXIT


          # ----------RUN----------
          chmod u+x post-step
          ./post-step
        hints: |-
          Network namespaces, veth, bridge и firewall rules живут независимо от
          файлов задания. Утечки изменяют последующие эксперименты, конфликтуют по
          именам и могут влиять на Docker forwarding.

          Удаление namespace обычно удаляет находящийся в нём конец veth, но
          очистка должна быть идемпотентной и проверять каждый класс объектов.
          Лабораторные процессы также необходимо завершить, чтобы не оставлять PID
          и открытые sockets.

          Финальная проверка сравнивает важные свойства с baseline: объекты
          `netlab`, правила и процессы исчезают, а стандартные Docker networks
          сохраняются. Evidence очистки остаётся как структурированное
          подтверждение результата.
    description: |-
      #### Упражнение 1

      Остановите HTTP-процессы и контейнеры лаборатории, удалите
      `netlab-docker`, оба network namespaces, veth, `br-netlab`,
      namespace-specific resolver files и все firewall/NAT rules лаборатории.

      Сохраните `/home/ubuntu/netlab/evidence/10-cleanup.json` с финальными
      interfaces, namespaces, matching firewall rules и Docker networks.
      Проверка ожидает отсутствие лабораторных объектов и наличие стандартных
      Docker networks, которые присутствовали в baseline.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 18
- title: 'OCI bundle и runc: как Docker запускает контейнер на нижнем уровне'
  description: |-
    Лабораторная работа показывает путь от OCI bundle до реального
    Linux-процесса. Вы подготовите rootfs и `config.json`, запустите
    workload напрямую через OCI runtime, исследуете namespaces, mounts,
    cgroups, capabilities и seccomp, а затем сравните результат с
    Docker-контейнером.
  time-limit-minutes: 180
  steps:
  - title: Место OCI в runtime stack
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.bash	---
          cat <<'EOF' > prepare.bash
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          missing=()
          for command_name in runc jq busybox curl; do
            command -v "$command_name" >/dev/null 2>&1 || missing+=("$command_name")
          done
          if ((${#missing[@]})); then
            apt-get update
            apt-get install -y runc jq busybox-static curl
          fi
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io
          fi
          if ! command -v runc >/dev/null 2>&1 && ! command -v crun >/dev/null 2>&1; then
            echo 'OCI runtime не найден: установите пакет runc или crun из репозитория дистрибутива.' >&2
            exit 1
          fi
          systemctl enable --now docker >/dev/null 2>&1 || true
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/assets/oci-lab-lib.bash"
          ensure_layout
          chown -R ubuntu:ubuntu /home/ubuntu/oci-runc-lab
          EOF
          trap 'rm -f prepare.bash' EXIT


          # ----------RUN----------
          chmod u+x prepare.bash
          ./prepare.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          file="$EVIDENCE/runtime-stack.json"
          jq -e '.docker.path and .docker.version and .containerd.path and .containerd.version and (.oci_runtime.name == "runc" or .oci_runtime.name == "crun") and .oci_runtime.path and .oci_runtime.version' "$file" >/dev/null
          [[ -x "$(jq -r '.docker.path' "$file")" && -x "$(jq -r '.containerd.path' "$file")" && -x "$(jq -r '.oci_runtime.path' "$file")" ]]
          printf 'OK: %s\n' "01-runtime-stack"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          ensure_layout
          runtime="$(runtime_bin)"
          jq -n \
            --arg docker_path "$(command -v docker)" --arg docker_version "$(docker --version)" \
            --arg containerd_path "$(command -v containerd)" --arg containerd_version "$(containerd --version)" \
            --arg runtime_name "$(basename "$runtime")" --arg runtime_path "$runtime" --arg runtime_version "$($runtime --version | head -n 1)" \
            '{docker:{path:$docker_path,version:$docker_version},containerd:{path:$containerd_path,version:$containerd_version},oci_runtime:{name:$runtime_name,path:$runtime_path,version:$runtime_version}}' > "$EVIDENCE/runtime-stack.json"
          chown ubuntu:ubuntu "$EVIDENCE/runtime-stack.json"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Docker CLI передаёт запрос демону Docker, а тот координирует хранение
          образов, сеть, тома и жизненный цикл контейнеров. Для фактического
          запуска Linux-процесса Docker обычно обращается к containerd, который
          делегирует низкоуровневую операцию OCI runtime — чаще всего `runc` или
          `crun`.

          OCI runtime не читает Dockerfile и не собирает образ. На вход он
          получает OCI bundle: каталог с распакованной файловой системой и
          декларативным описанием запуска. После этого runtime настраивает
          примитивы ядра — namespaces, cgroups, mounts, capabilities и seccomp — и
          создаёт первый процесс контейнера.

          Версии и пути компонентов важны для диагностики: Docker, containerd и
          runtime могут обновляться независимо, а конкретная установка может
          использовать нестандартный бинарный файл.
    description: |-
      #### Упражнение 1

      Создайте файл `/home/ubuntu/oci-runc-lab/evidence/runtime-stack.json` с
      инвентаризацией доступного runtime stack. Для Docker, containerd и OCI
      runtime укажите путь к исполняемому файлу и строку версии; отдельно
      укажите выбранный OCI runtime (`runc` либо `crun`).

      Файл должен быть валидным JSON и отражать реально установленные
      компоненты, а не заранее заданные значения.
  - title: Структура OCI bundle
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.bash	---
          cat <<'EOF' > prepare.bash
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          missing=()
          for command_name in runc jq busybox curl; do
            command -v "$command_name" >/dev/null 2>&1 || missing+=("$command_name")
          done
          if ((${#missing[@]})); then
            apt-get update
            apt-get install -y runc jq busybox-static curl
          fi
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io
          fi
          if ! command -v runc >/dev/null 2>&1 && ! command -v crun >/dev/null 2>&1; then
            echo 'OCI runtime не найден: установите пакет runc или crun из репозитория дистрибутива.' >&2
            exit 1
          fi
          systemctl enable --now docker >/dev/null 2>&1 || true
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/assets/oci-lab-lib.bash"
          ensure_layout
          chown -R ubuntu:ubuntu /home/ubuntu/oci-runc-lab
          EOF
          trap 'rm -f prepare.bash' EXIT


          # ----------RUN----------
          chmod u+x prepare.bash
          ./prepare.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          [[ -d "$ROOTFS" && -x "$ROOTFS/bin/sh" && -s "$BUNDLE/config.json" ]]
          jq -e '.ociVersion and .root.path == "rootfs" and (.process.args | length > 0) and (.linux.namespaces | length > 0)' "$BUNDLE/config.json" >/dev/null
          find "$ROOTFS" -mindepth 1 -print -quit | grep -q .
          printf 'OK: %s\n' "02-bundle-structure"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          build_rootfs
          write_config bundle
          jq empty "$BUNDLE/config.json"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          OCI bundle состоит из каталога rootfs и файла `config.json`. Rootfs
          является будущим корнем файловой системы контейнера, а конфигурация
          описывает, какой процесс и в каком изолированном окружении должен быть
          создан.

          В `config.json` находятся разделы process, root, mounts и linux. В linux
          могут задаваться namespaces, ресурсы cgroups, seccomp и другие параметры
          платформы; hooks позволяют подключать действия к стадиям жизненного
          цикла.

          Bundle — это интерфейс между менеджером контейнеров и OCI runtime. Он не
          обязан быть слоем Docker-образа и может быть подготовлен вручную, если
          структура и конфигурация соответствуют спецификации.
    description: |-
      #### Упражнение 1

      Подготовьте минимальный OCI bundle в
      `/home/ubuntu/oci-runc-lab/oci-lab-bundle`. В нём должны присутствовать
      непустой `rootfs`, исполняемый shell и валидный `config.json`,
      ссылающийся на относительный путь `rootfs`.

      Конфигурация должна содержать версию OCI, описание процесса, корневой
      файловой системы и Linux namespaces. Не копируйте конфигурацию из
      теории: сформируйте её средствами OCI runtime либо самостоятельно и
      адаптируйте к заданному rootfs.
  - title: Секция process
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.bash	---
          cat <<'EOF' > prepare.bash
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          missing=()
          for command_name in runc jq busybox curl; do
            command -v "$command_name" >/dev/null 2>&1 || missing+=("$command_name")
          done
          if ((${#missing[@]})); then
            apt-get update
            apt-get install -y runc jq busybox-static curl
          fi
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io
          fi
          if ! command -v runc >/dev/null 2>&1 && ! command -v crun >/dev/null 2>&1; then
            echo 'OCI runtime не найден: установите пакет runc или crun из репозитория дистрибутива.' >&2
            exit 1
          fi
          systemctl enable --now docker >/dev/null 2>&1 || true
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/assets/oci-lab-lib.bash"
          ensure_layout
          chown -R ubuntu:ubuntu /home/ubuntu/oci-runc-lab
          EOF
          trap 'rm -f prepare.bash' EXIT


          # ----------RUN----------
          chmod u+x prepare.bash
          ./prepare.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          [[ "$(container_status)" == running ]]
          pid="$(container_pid)"
          [[ "$pid" =~ ^[0-9]+$ && -d "/proc/$pid" ]]
          jq -e '.process.terminal == false and .process.cwd and (.process.args | index("/opt/workload.sh"))' "$BUNDLE/config.json" >/dev/null
          [[ -s "/proc/$pid/root/run/oci-lab/heartbeat" ]]
          now="$(date +%s)"; heartbeat="$(cat "/proc/$pid/root/run/oci-lab/heartbeat")"; (( now - heartbeat < 8 ))
          jq -e --argjson pid "$pid" '.status == "running" and .pid == $pid' "$EVIDENCE/runc-state.json" >/dev/null
          printf 'OK: %s\n' "03-process"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          build_rootfs
          write_config process
          start_container
          wait_for_heartbeat
          save_runtime_state
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Секция process задаёт первый процесс контейнера: массив аргументов,
          рабочий каталог, переменные окружения, пользователя и режим терминала.
          Первый процесс становится PID 1 внутри нового PID namespace, если такой
          namespace запрошен.

          `args` передаётся непосредственно при создании процесса и не является
          строкой shell по умолчанию. `cwd` должен существовать внутри rootfs, а
          идентификаторы пользователя интерпретируются в контексте настроенных
          user namespaces и файловой системы.

          Долгоживущая полезная нагрузка позволяет наблюдать контейнер после
          запуска. В этой работе процесс поддерживает heartbeat и HTTP-ответ,
          поэтому проверка оценивает реальное состояние, а не одноразовый вывод.
    description: |-
      #### Упражнение 1

      Настройте process в OCI bundle так, чтобы runtime запускал долгоживущий
      диагностический workload без псевдотерминала. Workload должен обновлять
      `/run/oci-lab/heartbeat` внутри rootfs не реже одного раза в несколько
      секунд и оставаться в состоянии running.

      Сохраните текущее состояние runtime в
      `/home/ubuntu/oci-runc-lab/evidence/runc-state.json`. Проверка
      сопоставит PID, аргументы процесса и heartbeat с реально работающим
      контейнером.
  - title: Mounts в OCI config
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.bash	---
          cat <<'EOF' > prepare.bash
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          missing=()
          for command_name in runc jq busybox curl; do
            command -v "$command_name" >/dev/null 2>&1 || missing+=("$command_name")
          done
          if ((${#missing[@]})); then
            apt-get update
            apt-get install -y runc jq busybox-static curl
          fi
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io
          fi
          if ! command -v runc >/dev/null 2>&1 && ! command -v crun >/dev/null 2>&1; then
            echo 'OCI runtime не найден: установите пакет runc или crun из репозитория дистрибутива.' >&2
            exit 1
          fi
          systemctl enable --now docker >/dev/null 2>&1 || true
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/assets/oci-lab-lib.bash"
          ensure_layout
          chown -R ubuntu:ubuntu /home/ubuntu/oci-runc-lab
          EOF
          trap 'rm -f prepare.bash' EXIT


          # ----------RUN----------
          chmod u+x prepare.bash
