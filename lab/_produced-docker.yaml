          #!/bin/bash
          set -euo pipefail
          /usr/bin/test -d /home/ubuntu/mini-runtime
          EOF
          trap 'rm -f post-step.sh' EXIT


          # ----------RUN----------
          chmod u+x post-step.sh
          ./post-step.sh
        hints: |-
          Изоляция filesystem и ресурсов не заменяет принцип least privilege.
          Workload не должен сохранять UID 0 или эффективные Linux capabilities
          только потому, что launcher требует root для настройки namespaces и
          mounts.

          Bounding, effective и ambient capability sets определяют разные пути
          получения привилегий. Для данного API они могут быть пустыми.
          `no_new_privs` запрещает процессу повышать привилегии при последующих
          exec-переходах.

          Поле Seccomp в `/proc/<pid>/status` показывает фактический режим
          фильтрации системных вызовов. Если окружение наследует фильтр, evidence
          должно фиксировать реальное значение, а не заявлять несуществующий
