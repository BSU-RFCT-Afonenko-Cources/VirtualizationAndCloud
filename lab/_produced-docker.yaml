          #!/bin/bash
          set -euo pipefail
          /usr/bin/test -d /home/ubuntu/mini-runtime || /workspace/VirtualizationAndCloud/lab/docker/capstone-mini-runtime/prepare.sh
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          source /workspace/VirtualizationAndCloud/lab/docker/capstone-mini-runtime/lib/check-common.sh
          require_live_pid
          require_file "$EVIDENCE/restart.json"
          old_pid=$(json_value "$EVIDENCE/restart.json" old_pid)
          new_pid=$(json_value "$EVIDENCE/restart.json" new_pid)
          [ "$old_pid" != "$new_pid" ] || fail 'restart reused the same PID'
          [ ! -e "/proc/$old_pid" ] || fail 'old runtime process leaked'
          [ "$new_pid" = "$(api_pid)" ] || fail 'restart evidence does not identify current API'
          [ "$(json_value "$EVIDENCE/restart.json" cleanup_verified)" = True ] || fail 'cleanup_verified is false'
          [ "$(json_value "$EVIDENCE/restart.json" restart_verified)" = True ] || fail 'restart_verified is false'
          ip link show mrt-host >/dev/null 2>&1 || fail 'network boundary was not recreated'
          fetch_api >/dev/null
          pass 'controlled cleanup and repeatable restart are proven'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          [ -f /run/mini-runtime-lab/api.pid ] || /usr/local/lib/mini-runtime-lab/reference-runtime.sh start
          /usr/local/lib/mini-runtime-lab/reference-runtime.sh failure
          /usr/local/lib/mini-runtime-lab/reference-runtime.sh evidence
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.sh	---
          cat <<'EOF' > post-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/test -d /home/ubuntu/mini-runtime
          EOF
          trap 'rm -f post-step.sh' EXIT


          # ----------RUN----------
          chmod u+x post-step.sh
          ./post-step.sh
        hints: |-
          Runtime отвечает не только за создание, но и за освобождение ресурсов.
          Controlled stop должен завершить workload и launcher, удалить host veth
          и освободить cgroup; mount namespace исчезает после завершения
          последнего процесса, поэтому его private mounts не должны протекать на
          host.

          Повторный start проверяет идемпотентность lifecycle. Новый процесс
          получает другой host PID, заново создаёт kernel objects и возвращается к
          тому же declared endpoint.

          Результат drill фиксируется структурированно, но проверка также ищет
          реальные утечки. Булево поле в JSON не заменяет отсутствия старого PID
          или успешного повторного запуска.
    description: |-
      Выполните controlled stop и повторный start runtime.

      #### Упражнение 1 (Докажите cleanup и restart)

      Запомните старый host PID, остановите runtime и убедитесь, что процесс
      завершён, `mrt-host` удалён, а cgroup освобождена. Затем заново создайте
      runtime и дождитесь готовности API на том же endpoint.

      Создайте `/home/ubuntu/mini-runtime/evidence/restart.json` с `old_pid`,
      `new_pid`, `cleanup_verified` и `restart_verified`. Старый и новый PID
      должны различаться. После restart обновите остальные evidence-файлы для
      нового процесса.
  - title: Финальная проверка workload
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/test -d /home/ubuntu/mini-runtime || /workspace/VirtualizationAndCloud/lab/docker/capstone-mini-runtime/prepare.sh
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          source /workspace/VirtualizationAndCloud/lab/docker/capstone-mini-runtime/lib/check-common.sh
          require_live_pid
          pid=$(api_pid)
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          fetch_api > "$tmp"
          python3 - "$tmp" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding='utf-8'))
          assert p['service']=='mini-runtime-api'
          assert p['hostname']=='mini-runtime'
          assert p['pid']==1
          assert p['cgroup']=='/mini-runtime'
          assert p['limits']=={'memory_max':'134217728','pids_max':'64','cpu_max':'50000 100000'}
          assert p['rootfs_marker']=='mini-runtime-rootfs-v1'
          assert p['runtime_state_writable'] is True
          PY
          cmp -s "$tmp" "$EVIDENCE/api.json" || fail 'api evidence is not the current endpoint response'
          for ns in uts pid mnt net; do [ "$(readlink "/proc/$pid/ns/$ns")" != "$(readlink "/proc/self/ns/$ns")" ] || fail "$ns isolation regressed"; done
          grep -Eq '^CapEff:[[:space:]]+0{16}$' "/proc/$pid/status" || fail 'capabilities regressed'
          root_opts=$(findmnt -N "$pid" -n -o OPTIONS --target "$ROOTFS" | head -n1)
          [[ ",$root_opts," == *,ro,* ]] || fail 'read-only rootfs policy regressed'
          pass 'workload, isolation, limits, rootfs and evidence form one consistent runtime'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          /usr/local/lib/mini-runtime-lab/reference-runtime.sh all
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.sh	---
          cat <<'EOF' > post-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/local/lib/mini-runtime-lab/reference-runtime.sh stop
          EOF
          trap 'rm -f post-step.sh' EXIT


          # ----------RUN----------
          chmod u+x post-step.sh
          ./post-step.sh
        hints: |-
          Контейнеризация имеет смысл только вместе с работающей полезной
          нагрузкой. Финальная проверка объединяет функциональный контракт HTTP
          API с доказательствами kernel isolation и resource policy.

          API получает hostname и PID view из собственного namespace, читает
          cgroup limits через смонтированный cgroupfs и маркер из отдельного
          rootfs. Эти значения нельзя надёжно имитировать только внешним
          evidence-файлом.

          Успешный результат согласован во всех слоях: HTTP JSON, `/proc`,
          cgroupfs, mountinfo и evidence pack описывают один и тот же живой
          процесс.
    description: |-
      Предъявите завершённый runtime и работающий endpoint.

      #### Упражнение 1 (Подтвердите интеграцию primitives)

      Ответ `/status` должен быть валидным JSON и содержать `service` со
      значением `mini-runtime-api`, hostname `mini-runtime`, локальный PID 1,
      cgroup path, три действующих лимита, marker `mini-runtime-rootfs-v1` и
      подтверждение writable runtime state.

      Убедитесь, что runtime после failure drill запущен, evidence pack
      обновлён, namespace isolation сохранена, rootfs смонтирован read-only,
      capabilities отсутствуют, а API доступен только через заявленную сетевую
      boundary.
