          свободном процессоре; значение `max` отключает этот потолок.

          Когда runnable-процессы исчерпали budget до конца периода, ядро
          throttles группу. `cpu.stat` показывает число периодов, число
          throttling-событий и суммарное время ограничения.

          Для доказательства важны не только настроенное значение, но и рост
          `nr_throttled` или `throttled_usec` под реальной CPU-нагрузкой.
