    description: |-
      #### Упражнение 1 (Единственная точка входа)

      Разверните одну реплику сервиса `edge` из образа `swarm-lab-edge:1.0` с
      меткой `course.lab=swarm-networking`.

      Подключите сервис одновременно к `lab-front` и `lab-back`, задайте
      внутреннее имя API через `API_HOST=api` и добавьте healthcheck.
      Опубликуйте порт узла `8080` на целевой порт сервиса `8080` в режиме
      routing mesh (`ingress`).

