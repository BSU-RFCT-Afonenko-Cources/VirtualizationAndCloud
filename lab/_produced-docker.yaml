          ./solution.bash
        hints: |-
          `memory.current` отражает текущий объём памяти, учтённой группе, а
          `memory.max` задаёт hard limit. Учёт включает больше, чем heap одного
          процесса, поэтому наблюдаемое значение не обязано совпадать с размером
          запрошенного массива.

          При приближении к пределу reclaim пытается освободить страницы. Если
          этого недостаточно, allocation может завершиться ошибкой или cgroup OOM
          killer завершит процесс, не обязательно создавая глобальный OOM хоста.

          Итог фиксируется в `memory.events`: счётчики `max`, `oom` и `oom_kill`
          дают проверяемое подтверждение давления и реакции ядра.
    description: |-
      #### Упражнение 1 (Memory accounting и memory.max)

      Создайте группу `memory`, задайте `memory.max` равным 32 MiB и запустите
      allocator, пытающийся удержать существенно больше памяти.

      Сохраните `05-memory.json` с лимитом, пиковым наблюдением,
      кодом/сигналом завершения и дельтами `memory.events`. Должно быть
      зафиксировано достижение лимита либо controlled allocation failure.
