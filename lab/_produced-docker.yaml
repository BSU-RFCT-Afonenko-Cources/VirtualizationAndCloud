      #### Упражнение 1 (Freezer как мягкая гибернация без сохранения памяти)

      Создайте группу `freezer`, запустите в ней процесс `cg-freezer`,
      обновляющий счётчик в файле. Подтвердите прогресс, заморозьте всю
