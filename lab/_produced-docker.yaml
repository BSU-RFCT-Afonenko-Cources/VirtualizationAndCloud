          # ---	check	---
          cat <<'EOF' > check
          #!/bin/bash
          set -euo pipefail
          docker inspect -f '{{json (index .NetworkSettings.Networks "lab-net").Aliases}}' net-api | jq -e 'index("api.internal") != null' >/dev/null || { echo "Alias api.internal не найден"; exit 1; }
          jq -e '.http_code == 200 and .body.service == "net-api" and (.url | contains("api.internal"))' /home/ubuntu/lab/docker/networking/evidence/alias-response.json >/dev/null || { echo "Запрос через alias не подтверждён"; exit 1; }
          echo "Network alias работает"
          EOF
          trap 'rm -f check' EXIT


          # ----------RUN----------
          chmod u+x check
          ./check
        solution: |-
          # ----------EXEC----------
          # ---	solution	---
          cat <<'EOF' > solution
          #!/bin/bash
          set -euo pipefail
          docker network disconnect lab-net net-api
          docker network connect --alias api.internal lab-net net-api
          docker rm -f net-client >/dev/null 2>&1 || true
          docker run --name net-client --network lab-net --label course.lab=docker-networking --label course.role=diagnostic course/net-client:1.0 http://api.internal:8080/ > /home/ubuntu/lab/docker/networking/evidence/alias-response.json
          chown ubuntu:ubuntu /home/ubuntu/lab/docker/networking/evidence/alias-response.json
          EOF
          trap 'rm -f solution' EXIT


          # ----------RUN----------
          chmod u+x solution
          ./solution
        post-step: |-
          # ----------EXEC----------
          # ---	post-step	---
          cat <<'EOF' > post-step
          #!/bin/bash
          set -euo pipefail
          chown -R ubuntu:ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f post-step' EXIT


          # ----------RUN----------
          chmod u+x post-step
          ./post-step
        hints: |-
          Network alias — дополнительное DNS-имя endpoint контейнера в конкретной
          Docker-сети. Alias отделяет имя, используемое клиентами, от имени
          экземпляра контейнера и может служить стабильным внутренним адресом
          сервиса.

          Aliases принадлежат подключению к сети. Поэтому их наличие проверяется в
          сетевых настройках контейнера, а работоспособность — реальным
          DNS-разрешением и HTTP-запросом из другой точки той же сети.
    description: |-
      Добавьте контейнеру `net-api` alias `api.internal` в сети `lab-net`.
      Выполните запрос из нового диагностического контейнера по этому alias и
      сохраните результат в `alias-response.json`.

      #### Упражнение 1

      Inspect контейнера должен показывать alias `api.internal` в `lab-net`, а
      evidence — HTTP-код 200, JSON-тело `net-api` и поле URL, использующее
      стабильное имя.
  - title: Подключение к двум сетям
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare	---
          cat <<'EOF' > prepare
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f prepare' EXIT

          # ---	pre-step	---
          cat <<'EOF' > pre-step
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f pre-step' EXIT


          # ----------RUN----------
          chmod u+x prepare
          ./prepare
          chmod u+x pre-step
          ./pre-step
        check: |-
          # ----------EXEC----------
          # ---	check	---
          cat <<'EOF' > check
          #!/bin/bash
          set -euo pipefail
          for NETWORK in frontend backend; do
            [ "$(docker network inspect -f '{{.Driver}}' "$NETWORK" 2>/dev/null)" = bridge ] || { echo "$NETWORK не bridge"; exit 1; }
            [ "$(docker network inspect -f '{{index .Labels "course.lab"}}' "$NETWORK")" = docker-networking ] || { echo "Нет lab label у $NETWORK"; exit 1; }
          done
          [ "$(docker inspect -f '{{if index .NetworkSettings.Networks "frontend"}}yes{{end}}' net-proxy)" = yes ] || { echo "Proxy не во frontend"; exit 1; }
          [ "$(docker inspect -f '{{if index .NetworkSettings.Networks "backend"}}yes{{end}}' net-proxy)" = yes ] || { echo "Proxy не в backend"; exit 1; }
          [ "$(docker inspect -f '{{if index .NetworkSettings.Networks "backend"}}yes{{end}}' net-api)" = yes ] || { echo "API не в backend"; exit 1; }
          [ "$(docker inspect -f '{{if index .NetworkSettings.Networks "frontend"}}yes{{end}}' net-api)" != yes ] || { echo "API не должен быть во frontend"; exit 1; }
          [ "$(docker inspect -f '{{json .HostConfig.PortBindings}}' net-api)" = '{}' ] || { echo "API опубликован на host"; exit 1; }
          curl --fail --silent http://127.0.0.1:18080/ | jq -e '.service == "net-api"' >/dev/null || { echo "Proxy не достигает API"; exit 1; }
          echo "Dual-homed proxy и backend isolation проверены"
          EOF
          trap 'rm -f check' EXIT


          # ----------RUN----------
          chmod u+x check
          ./check
        solution: |-
          # ----------EXEC----------
          # ---	solution	---
          cat <<'EOF' > solution
          #!/bin/bash
          set -euo pipefail
          docker rm -f net-client net-client-dns-fail net-proxy net-api >/dev/null 2>&1 || true
          docker network rm lab-net frontend backend >/dev/null 2>&1 || true
          docker network create --driver bridge --label course.lab=docker-networking --label course.role=frontend frontend >/dev/null
          docker network create --driver bridge --label course.lab=docker-networking --label course.role=backend backend >/dev/null
          docker run -d --name net-api --network backend --network-alias api.internal --label course.lab=docker-networking --label course.role=backend course/net-api:1.0 >/dev/null
          docker run -d --name net-proxy --network frontend --label course.lab=docker-networking --label course.role=proxy -e TARGET_HOST=api.internal -e TARGET_PORT=8080 -p 127.0.0.1:18080:8080 course/net-proxy:1.0 >/dev/null
          docker network connect backend net-proxy
          for _ in $(seq 1 30); do
            API_STATUS=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' net-api 2>/dev/null || true)
            PROXY_STATUS=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' net-proxy 2>/dev/null || true)
            [ "$API_STATUS" = healthy ] && [ "$PROXY_STATUS" = healthy ] && exit 0
            sleep 1
          done
          echo "Dual-network topology не стала healthy" >&2
          exit 1
          EOF
          trap 'rm -f solution' EXIT


          # ----------RUN----------
          chmod u+x solution
          ./solution
        post-step: |-
          # ----------EXEC----------
          # ---	post-step	---
          cat <<'EOF' > post-step
          #!/bin/bash
          set -euo pipefail
          chown -R ubuntu:ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f post-step' EXIT


          # ----------RUN----------
          chmod u+x post-step
          ./post-step
        hints: |-
          Контейнер, подключённый к двум сетям, имеет интерфейс и DNS-контекст в
          каждой из них. Reverse proxy может быть dual-homed: frontend принимает
          клиентский трафик, backend даёт доступ к API.

          Backend-контейнеру подключение к frontend не требуется. Такая топология
          уменьшает число участников, способных обратиться к внутреннему сервису,
          и сохраняет proxy единственным сетевым мостом прикладного уровня.
    description: |-
      Переведите лабораторную топологию на две user-defined bridge-сети
      `frontend` и `backend` с labels лабораторной работы. Подключите
      `net-proxy` к обеим сетям, а `net-api` — только к `backend`, сохранив
      для API alias `api.internal`.

      #### Упражнение 1

      Proxy должен одновременно состоять во `frontend` и `backend` и
      оставаться доступным на `127.0.0.1:18080`. API должно состоять только в
      `backend`, не иметь published ports и отвечать proxy через alias.
  - title: DNS failure drill
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare	---
          cat <<'EOF' > prepare
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f prepare' EXIT

          # ---	pre-step	---
          cat <<'EOF' > pre-step
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f pre-step' EXIT


          # ----------RUN----------
          chmod u+x prepare
          ./prepare
          chmod u+x pre-step
          ./pre-step
        check: |-
          # ----------EXEC----------
          # ---	check	---
          cat <<'EOF' > check
          #!/bin/bash
          set -euo pipefail
          jq -e '.exit_code > 0 and (.error | length > 0) and (.url | contains("missing-api.internal"))' /home/ubuntu/lab/docker/networking/evidence/dns-error.json >/dev/null || { echo "Нет корректного evidence DNS failure"; exit 1; }
          [ "$(docker inspect -f '{{.State.ExitCode}}' net-client-dns-fail 2>/dev/null)" != 0 ] || { echo "Failure-контейнер не зафиксировал ошибку"; exit 1; }
          jq -e '.http_code == 200 and .body.service == "net-api" and (.url | contains("api.internal"))' /home/ubuntu/lab/docker/networking/evidence/dns-recovery.json >/dev/null || { echo "Recovery через alias не подтверждён"; exit 1; }
          curl --fail --silent http://127.0.0.1:18080/ | jq -e '.status == "ok"' >/dev/null || { echo "После drill proxy недоступен"; exit 1; }
          echo "DNS failure и recovery проверены"
          EOF
          trap 'rm -f check' EXIT


          # ----------RUN----------
          chmod u+x check
          ./check
        solution: |-
          # ----------EXEC----------
          # ---	solution	---
          cat <<'EOF' > solution
          #!/bin/bash
          set -euo pipefail
          docker rm -f net-client-dns-fail net-client >/dev/null 2>&1 || true
          set +e
          docker run --name net-client-dns-fail --network backend --label course.lab=docker-networking --label course.role=diagnostic course/net-client:1.0 http://missing-api.internal:8080/ > /home/ubuntu/lab/docker/networking/evidence/dns-error.json
          FAIL_CODE=$?
          set -e
          [ "$FAIL_CODE" -ne 0 ] || { echo "Неверное DNS-имя неожиданно сработало" >&2; exit 1; }
          docker run --name net-client --network backend --label course.lab=docker-networking --label course.role=diagnostic course/net-client:1.0 http://api.internal:8080/ > /home/ubuntu/lab/docker/networking/evidence/dns-recovery.json
          chown ubuntu:ubuntu /home/ubuntu/lab/docker/networking/evidence/dns-error.json /home/ubuntu/lab/docker/networking/evidence/dns-recovery.json
          EOF
          trap 'rm -f solution' EXIT


          # ----------RUN----------
          chmod u+x solution
          ./solution
        post-step: |-
          # ----------EXEC----------
          # ---	post-step	---
          cat <<'EOF' > post-step
          #!/bin/bash
          set -euo pipefail
          chown -R ubuntu:ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f post-step' EXIT


          # ----------RUN----------
          chmod u+x post-step
          ./post-step
        hints: |-
          Ошибка service discovery может быть вызвана опечаткой, отсутствующим
          alias или подключением клиента не к той сети. Диагностика должна
          различать DNS failure, отказ TCP-соединения и ошибочный HTTP-ответ.

          Полезный drill сначала сохраняет наблюдаемую ошибку для неверного имени,
          а затем повторяет тот же путь с исправленным alias. Так подтверждается,
          что проблема находилась именно на уровне обнаружения сервиса.
    description: |-
      Из диагностического контейнера в `backend` выполните запрос к намеренно
      неверному имени `missing-api.internal` и сохраните структурированную
      ошибку в `dns-error.json`. После этого используйте корректный alias
      `api.internal` и сохраните успешный результат в `dns-recovery.json`.

      #### Упражнение 1

      Ошибка должна содержать URL с неверным именем, ненулевой код выхода
      клиента и непустое диагностическое сообщение. Recovery evidence должно
      содержать URL с `api.internal`, HTTP-код 200 и JSON-тело API. Финальная
      доступность через proxy также должна сохраниться.
  - title: Очистка сетей
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare	---
          cat <<'EOF' > prepare
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f prepare' EXIT

          # ---	pre-step	---
          cat <<'EOF' > pre-step
          #!/bin/bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f pre-step' EXIT


          # ----------RUN----------
          chmod u+x prepare
          ./prepare
          chmod u+x pre-step
          ./pre-step
        check: |-
          # ----------EXEC----------
          # ---	check	---
          cat <<'EOF' > check
          #!/bin/bash
          set -euo pipefail
          for CONTAINER in net-api net-client net-client-dns-fail net-proxy; do
            if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
              echo "Контейнер $CONTAINER не удалён"
              exit 1
            fi
          done
          for NETWORK in lab-net frontend backend; do
            if docker network inspect "$NETWORK" >/dev/null 2>&1; then
              echo "Сеть $NETWORK не удалена"
              exit 1
            fi
          done
          for SYSTEM_NETWORK in bridge host none; do
            docker network inspect "$SYSTEM_NETWORK" >/dev/null 2>&1 || { echo "Системная сеть $SYSTEM_NETWORK отсутствует"; exit 1; }
          done
          echo "Лабораторные ресурсы удалены, системные сети сохранены"
          EOF
          trap 'rm -f check' EXIT


          # ----------RUN----------
          chmod u+x check
          ./check
        solution: |-
          # ----------EXEC----------
          # ---	solution	---
          cat <<'EOF' > solution
          #!/bin/bash
          set -euo pipefail
          docker rm -f net-api net-client net-client-dns-fail net-proxy >/dev/null 2>&1 || true
          docker network rm lab-net frontend backend >/dev/null 2>&1 || true
          EOF
          trap 'rm -f solution' EXIT


          # ----------RUN----------
          chmod u+x solution
          ./solution
        post-step: |-
          # ----------EXEC----------
          # ---	post-step	---
          cat <<'EOF' > post-step
          #!/bin/bash
          set -euo pipefail
          chown -R ubuntu:ubuntu /home/ubuntu/lab/docker/networking/evidence
          EOF
          trap 'rm -f post-step' EXIT


          # ----------RUN----------
          chmod u+x post-step
          ./post-step
        hints: |-
          Docker не удаляет сеть, пока к ней подключены endpoints контейнеров.
          Корректная очистка начинается с остановки и удаления лабораторных
          контейнеров, после чего удаляются только сети, принадлежащие
          лабораторной работе.

          Labels и предсказуемые имена помогают не затронуть чужие ресурсы.
          Системные сети `bridge`, `host` и `none` удалять нельзя.
    description: |-
      Удалите контейнеры `net-api`, `net-client`, `net-client-dns-fail` и
      `net-proxy`, если они существуют. Затем удалите только лабораторные сети
      `lab-net`, `frontend` и `backend`.

      #### Упражнение 1

      После очистки ни один из перечисленных контейнеров и ни одна из трёх
      лабораторных сетей не должны существовать. Системные Docker-сети должны
      остаться на месте.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 2
- title: Образы, Dockerfile и воспроизводимая сборка
  description: |-
    В лабораторной работе вы соберёте собственный образ с Python HTTP API,
    проследите связь Dockerfile со слоями образа и последовательно улучшите
    воспроизводимость и безопасность сборки.

    Итоговый контейнер предоставляет endpoints `/health` и `/version`,
    запускается без привилегий root, содержит проверяемые метаданные и
    встроенную проверку работоспособности.
  time-limit-minutes: 120
  steps:
  - title: Build context
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.sh	---
          cat <<'EOF' > prepare.sh
          #!/usr/bin/env bash
          set -euo pipefail

          PROJECT=/home/ubuntu/image-lab
          install -d -o ubuntu -g ubuntu "$PROJECT" "$PROJECT/__pycache__"
          cat > "$PROJECT/app.py" <<'PY'
          from pathlib import Path

          from flask import Flask, jsonify

          app = Flask(__name__)
          version = Path("/app/VERSION").read_text(encoding="utf-8").strip()


          @app.get("/health")
          def health():
              return jsonify(status="ok")


          @app.get("/version")
          def get_version():
              return jsonify(version=version)


          if __name__ == "__main__":
              app.run(host="0.0.0.0", port=8080)
          PY
          printf '%s\n' 'Flask==3.1.1' > "$PROJECT/requirements.txt"
          printf '%s\n' '1.0.0' > "$PROJECT/VERSION"
          printf '%s\n' 'LOCAL_TOKEN=do-not-copy' > "$PROJECT/.env"
          printf '%s\n' 'local debug output' > "$PROJECT/debug.log"
          printf '%s\n' 'compiled-placeholder' > "$PROJECT/__pycache__/app.cpython-312.pyc"
          rm -f "$PROJECT/.dockerignore"
          chown -R ubuntu:ubuntu "$PROJECT"
          EOF
          trap 'rm -f prepare.sh' EXIT


          # ----------RUN----------
          chmod u+x prepare.sh
          ./prepare.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail

          PROJECT=/home/ubuntu/image-lab
          IGNORE="$PROJECT/.dockerignore"
          for path in "$PROJECT/app.py" "$PROJECT/requirements.txt" "$PROJECT/VERSION" "$IGNORE"; do
            [[ -f "$path" ]] || { echo "Отсутствует $path"; exit 1; }
          done

          TMP=$(mktemp -d /tmp/image-context-check.XXXXXX)
          IMAGE=image-lab-context-check:temporary
          cleanup() {
            docker image rm -f "$IMAGE" >/dev/null 2>&1 || true
            rm -rf "$TMP"
          }
          trap cleanup EXIT
          cat > "$TMP/Dockerfile" <<'DOCKERFILE'
          FROM busybox:1.36
          COPY . /context
          DOCKERFILE

          docker build --quiet --file "$TMP/Dockerfile" --tag "$IMAGE" "$PROJECT" >/dev/null
          docker run --rm "$IMAGE" sh -c '
            test -f /context/app.py &&
            test -f /context/requirements.txt &&
            test -f /context/VERSION &&
            test ! -e /context/.env &&
            test ! -e /context/debug.log &&
            test ! -e /context/__pycache__
          ' || { echo "В build context попали запрещённые файлы или отсутствуют исходники"; exit 1; }
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail

          cat > /home/ubuntu/image-lab/.dockerignore <<'EOF_IGNORE'
          .env
          *.log
          *.pyc
          __pycache__/
          EOF_IGNORE
          chown ubuntu:ubuntu /home/ubuntu/image-lab/.dockerignore
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Контекст сборки — это каталог, содержимое которого клиент Docker
          передаёт сборщику. Инструкции Dockerfile не могут читать произвольные
          файлы за пределами контекста. Чем меньше контекст, тем быстрее и
          безопаснее сборка: случайно переданные журналы, кэш, ключи и локальные
          настройки могут попасть в слой образа.

          Файл `.dockerignore` задаёт исключения до передачи контекста. Он нужен
          даже тогда, когда Dockerfile явно копирует только несколько файлов:
          состав проекта меняется, а безопасное ограничение должно сохраняться.
    description: |-
      Рабочий проект расположен в `/home/ubuntu/image-lab`. Подготовленные
      исходники реализуют HTTP API и содержат несколько локальных файлов,
      которые не относятся к сборке.

      #### Упражнение 1 (Ограничьте контекст сборки)

      Проверьте структуру проекта и создайте `.dockerignore`. Исключите
      локальный файл окружения, журналы, Python bytecode и каталоги
      `__pycache__`. Исходник API, файл версии и список зависимостей должны
      оставаться в контексте.
  - title: Минимальный Dockerfile
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail

          PROJECT=/home/ubuntu/image-lab
          [[ -f "$PROJECT/Dockerfile" ]] || { echo "Отсутствует Dockerfile"; exit 1; }
          docker image inspect image-lab:build >/dev/null
          docker container inspect image-lab-api >/dev/null
          [[ "$(docker inspect --format '{{.State.Running}}' image-lab-api)" == true ]] || { echo "Контейнер image-lab-api не запущен"; exit 1; }
          PORTS=$(docker inspect --format '{{json .HostConfig.PortBindings}}' image-lab-api)
          [[ "$PORTS" == *'18080'* ]] || { echo "Порт 18080 не опубликован"; exit 1; }
          curl --fail --silent --max-time 5 --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          curl --fail --silent --max-time 5 --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/version | python3 -c 'import json,sys; assert "version" in json.load(sys.stdin)'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail

          cat > /home/ubuntu/image-lab/Dockerfile <<'DOCKERFILE'
          FROM python:3.12-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY app.py VERSION ./
          EXPOSE 8080
          CMD ["python", "app.py"]
          DOCKERFILE
          chown ubuntu:ubuntu /home/ubuntu/image-lab/Dockerfile
          docker build --tag image-lab:build /home/ubuntu/image-lab
          docker container rm --force image-lab-api >/dev/null 2>&1 || true
          docker run --detach --name image-lab-api --publish 18080:8080 image-lab:build >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Dockerfile — декларативное описание сборки. Базовый образ задаёт
          начальную файловую систему, рабочий каталог определяет место для
          последующих операций, копирование и установка зависимостей создают новые
          слои, а команда запуска становится конфигурацией образа.

          Слой фиксирует изменение относительно предыдущего слоя. Контейнер при
          запуске получает поверх неизменяемых слоёв собственный записываемый
          слой; поэтому изменения внутри контейнера не заменяют Dockerfile как
          источник сборки.
    description: |-
      #### Упражнение 1 (Соберите и запустите API)

      Создайте в `/home/ubuntu/image-lab` Dockerfile для Python API.
      Используйте рабочий каталог `/app`, установите зависимости из
      `requirements.txt`, поместите исходник и `VERSION` в образ и задайте
      запуск приложения.

      Соберите образ `image-lab:build`. Запустите из него контейнер
      `image-lab-api` с публикацией API на порту `18080` хоста. Проверка
      ожидает работающие endpoints `/health` и `/version`.
  - title: Теги и версии
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail

          V1=$(docker image inspect --format '{{.Id}}' image-lab:v1)
          LATEST=$(docker image inspect --format '{{.Id}}' image-lab:latest)
          [[ "$V1" == "$LATEST" ]] || { echo "Теги v1 и latest указывают на разные образы"; exit 1; }
          [[ "$(docker inspect --format '{{.Config.Image}}' image-lab-api)" == image-lab:latest ]] || { echo "Контейнер создан не из image-lab:latest"; exit 1; }
          curl --fail --silent --max-time 5 --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/version | python3 -c 'import json,sys; assert json.load(sys.stdin)["version"] == "1.0.0"'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail

          docker tag image-lab:build image-lab:v1
          docker tag image-lab:build image-lab:latest
          docker container rm --force image-lab-api >/dev/null 2>&1 || true
          docker run --detach --name image-lab-api --publish 18080:8080 image-lab:latest >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Tag — удобная изменяемая ссылка на образ, а не самостоятельная копия и
          не гарантия неизменяемости. Несколько тегов могут указывать на один
          image digest, а повторная сборка или новая привязка способна передвинуть
          tag на другой digest.

          Для воспроизводимости важно согласовать внешний tag с версией приложения
          и при необходимости фиксировать digest. `latest` — обычное имя тега без
          специальной гарантии новизны.
    description: |-
      #### Упражнение 1 (Зафиксируйте версию v1)

      Присвойте текущему образу репозитория `image-lab` теги `v1` и `latest`.
      Оба тега должны указывать на один образ. Пересоздайте `image-lab-api` из
      `latest` с прежней публикацией порта.

      Endpoint `/version` должен возвращать версию `1.0.0`, согласованную с
      содержимым файла `VERSION`.
  - title: Labels
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail

          IMAGE=image-lab:latest
          [[ "$(docker image inspect --format '{{index .Config.Labels "maintainer"}}' "$IMAGE")" == student@course.local ]] || { echo "Неверный label maintainer"; exit 1; }
          [[ "$(docker image inspect --format '{{index .Config.Labels "course"}}' "$IMAGE")" == virtualization-and-cloud ]] || { echo "Неверный label course"; exit 1; }
          [[ "$(docker image inspect --format '{{index .Config.Labels "component"}}' "$IMAGE")" == image-lab-api ]] || { echo "Неверный label component"; exit 1; }
          [[ "$(docker image inspect --format '{{.Id}}' image-lab:v1)" == "$(docker image inspect --format '{{.Id}}' image-lab:latest)" ]] || { echo "Теги v1 и latest не обновлены согласованно"; exit 1; }
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          path = Path('/home/ubuntu/image-lab/Dockerfile')
          text = path.read_text()
          marker = 'WORKDIR /app\n'
          labels = ('LABEL maintainer="student@course.local" \\\n'
                    '      course="virtualization-and-cloud" \\\n'
                    '      component="image-lab-api"\n')
          if 'LABEL maintainer=' not in text:
              text = text.replace(marker, marker + labels)
          path.write_text(text)
          PY
          chown ubuntu:ubuntu /home/ubuntu/image-lab/Dockerfile
          docker build --tag image-lab:v1 --tag image-lab:latest /home/ubuntu/image-lab
          docker container rm --force image-lab-api >/dev/null 2>&1 || true
          docker run --detach --name image-lab-api --publish 18080:8080 image-lab:latest >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Labels хранят пары ключ–значение в метаданных образов и контейнеров.
          Оркестраторы, политики безопасности, inventory и audit-инструменты могут
          выбирать и классифицировать объекты по этим данным без анализа имени или
          файловой системы.

          Метаданные полезны, когда ключи стабильны, а значения однозначны.
          Изменение label создаёт новую конфигурацию образа, поэтому нужные теги
          следует связать с результатом новой сборки.
    description: |-
      #### Упражнение 1 (Добавьте метаданные образа)

      Расширьте Dockerfile labels со следующими ключами и значениями:

      - `maintainer`: `student@course.local`;
      - `course`: `virtualization-and-cloud`;
      - `component`: `image-lab-api`.

      Пересоберите образ и обновите теги `v1` и `latest`, затем пересоздайте
      рабочий контейнер.
  - title: Кэш сборки
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail

          DOCKERFILE=/home/ubuntu/image-lab/Dockerfile
          [[ "$(cat /home/ubuntu/image-lab/VERSION)" == 2.0.0 ]] || { echo "Файл VERSION не обновлён"; exit 1; }
          REQ_LINE=$(grep -nE '^COPY[[:space:]]+requirements\.txt' "$DOCKERFILE" | head -n1 | cut -d: -f1)
          APP_LINE=$(grep -nE '^COPY[[:space:]].*(app\.py|VERSION)' "$DOCKERFILE" | head -n1 | cut -d: -f1)
          [[ -n "$REQ_LINE" && -n "$APP_LINE" && "$REQ_LINE" -lt "$APP_LINE" ]] || { echo "Слой зависимостей должен предшествовать копированию приложения"; exit 1; }
          V1=$(docker image inspect --format '{{.Id}}' image-lab:v1)
          V2=$(docker image inspect --format '{{.Id}}' image-lab:v2)
          LATEST=$(docker image inspect --format '{{.Id}}' image-lab:latest)
          [[ "$V2" == "$LATEST" && "$V1" != "$V2" ]] || { echo "Теги v1, v2 и latest имеют неверные digest"; exit 1; }
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' image-lab:v2)" == 2.0.0 ]] || { echo "Отсутствует metadata версии 2.0.0"; exit 1; }
          LAYERS=$(docker image inspect --format '{{len .RootFS.Layers}}' image-lab:v2)
          [[ "$LAYERS" -ge 3 ]] || { echo "В образе недостаточно различимых слоёв"; exit 1; }
          curl --fail --silent --max-time 5 --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/version | python3 -c 'import json,sys; assert json.load(sys.stdin)["version"] == "2.0.0"'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail

          printf '%s\n' '2.0.0' > /home/ubuntu/image-lab/VERSION
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/home/ubuntu/image-lab/Dockerfile')
          text = path.read_text()
          needle = '      component="image-lab-api"\n'
          if 'org.opencontainers.image.version=' not in text:
              text = text.replace(needle, '      component="image-lab-api" \\\n      org.opencontainers.image.version="2.0.0"\n')
          else:
              import re
              text = re.sub(r'org\.opencontainers\.image\.version="[^"]+"', 'org.opencontainers.image.version="2.0.0"', text)
          path.write_text(text)
          PY
          chown ubuntu:ubuntu /home/ubuntu/image-lab/VERSION /home/ubuntu/image-lab/Dockerfile
          docker build --tag image-lab:v2 --tag image-lab:latest /home/ubuntu/image-lab
          docker container rm --force image-lab-api >/dev/null 2>&1 || true
          docker run --detach --name image-lab-api --publish 18080:8080 image-lab:latest >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Кэш сборки повторно использует результат инструкции, если сама
          инструкция и все влияющие на неё входные данные не изменились. После
          первого изменившегося слоя последующие шаги обычно требуют повторного
          выполнения.

          Поэтому редко меняющиеся зависимости выгодно копировать и устанавливать
          раньше исходного кода. Изменение `VERSION` или приложения тогда не
          отменяет слой установки зависимостей. Раздельные операции копирования
          также делают назначение слоёв заметнее в history.
    description: |-
      #### Упражнение 1 (Выпустите версию v2)

      Измените версию приложения на `2.0.0`. Организуйте Dockerfile так, чтобы
      `requirements.txt` копировался и обрабатывался до копирования изменяемых
      файлов приложения.

      Добавьте label `org.opencontainers.image.version` со значением `2.0.0`.
      Соберите теги `image-lab:v2` и `image-lab:latest`, сохранив прежний
      `v1`, и пересоздайте контейнер. Endpoint `/version` должен сообщать
      новую версию.
  - title: Non-root runtime
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail

          CONFIG_USER=$(docker image inspect --format '{{.Config.User}}' image-lab:latest)
          [[ -n "$CONFIG_USER" && "$CONFIG_USER" != root && "$CONFIG_USER" != 0 ]] || { echo "В image config не задан непривилегированный USER"; exit 1; }
          UID_IN_CONTAINER=$(docker exec image-lab-api id -u)
          USER_IN_CONTAINER=$(docker exec image-lab-api id -un)
          [[ "$UID_IN_CONTAINER" != 0 && "$USER_IN_CONTAINER" == app ]] || { echo "API работает не от пользователя app"; exit 1; }
          curl --fail --silent --max-time 5 --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/health >/dev/null
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          path = Path('/home/ubuntu/image-lab/Dockerfile')
          text = path.read_text()
          if 'useradd' not in text:
              text = text.replace('WORKDIR /app\n', 'RUN useradd --create-home --uid 10001 app\nWORKDIR /app\n')
          if '\nUSER app\n' not in text:
              text = text.replace('\nCMD [', '\nUSER app\nCMD [')
          path.write_text(text)
          PY
          chown ubuntu:ubuntu /home/ubuntu/image-lab/Dockerfile
          docker build --tag image-lab:v2 --tag image-lab:latest /home/ubuntu/image-lab
          docker container rm --force image-lab-api >/dev/null 2>&1 || true
          docker run --detach --name image-lab-api --publish 18080:8080 image-lab:latest >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Процесс внутри контейнера по умолчанию часто работает как root. Изоляция
          контейнера уменьшает риски, но не превращает лишние привилегии в
          безопасные. Принцип least privilege требует запускать приложение с
          минимально необходимыми правами.

          Пользователь создаётся на этапе сборки, нужные файлы должны быть ему
          доступны, а инструкция `USER` задаёт identity для команды запуска и
          последующих runtime-операций.
    description: |-
      #### Упражнение 1 (Ограничьте runtime-пользователя)

      Измените образ так, чтобы API запускался от специально созданного
      непривилегированного пользователя `app`. Сохраните теги `v2` и `latest`
      на новой сборке и пересоздайте контейнер.

      Проверка выполнит `id` внутри контейнера и не примет root либо UID `0`.
  - title: Healthcheck образа
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail

          TEST=$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' image-lab:latest)
          [[ "$TEST" == *'/health'* ]] || { echo "Healthcheck образа не проверяет /health"; exit 1; }
          for _ in $(seq 1 20); do
            STATUS=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' image-lab-api)
            [[ "$STATUS" == healthy ]] && exit 0
            [[ "$STATUS" == unhealthy ]] && { docker inspect --format '{{json .State.Health.Log}}' image-lab-api; exit 1; }
            sleep 1
          done
          echo "Контейнер не перешёл в healthy"
          exit 1
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          path = Path('/home/ubuntu/image-lab/Dockerfile')
          text = path.read_text()
          health = 'HEALTHCHECK --interval=5s --timeout=2s --start-period=2s --retries=3 CMD ["python", "-c", "import urllib.request; urllib.request.urlopen(\'http://127.0.0.1:8080/health\', timeout=1).read()"]\n'
          if 'HEALTHCHECK ' not in text:
              text = text.replace('\nUSER app\n', '\n' + health + 'USER app\n')
          path.write_text(text)
          PY
          chown ubuntu:ubuntu /home/ubuntu/image-lab/Dockerfile
          docker build --tag image-lab:v2 --tag image-lab:latest /home/ubuntu/image-lab
          docker container rm --force image-lab-api >/dev/null 2>&1 || true
          docker run --detach --name image-lab-api --publish 18080:8080 image-lab:latest >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Состояние `running` означает только наличие работающего главного
          процесса. Приложение при этом может не принимать запросы или возвращать
          ошибки. `HEALTHCHECK` задаёт прикладную пробу и формирует отдельные
          состояния `starting`, `healthy` и `unhealthy`.

          Проверка должна обращаться к реальному endpoint, иметь разумные
          interval, timeout и retries и завершаться ненулевым кодом при отказе
          приложения.
    description: |-
      #### Упражнение 1 (Добавьте проверку работоспособности)

      Добавьте в Dockerfile `HEALTHCHECK`, проверяющий локальный endpoint
      `/health` на порту приложения. Используйте уже доступный в образе
      Python, не устанавливая отдельный HTTP-клиент только ради проверки.

      Пересоберите `v2` и `latest`, пересоздайте контейнер и добейтесь
      состояния `healthy`.
  - title: Image history
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail

          EVIDENCE=/home/ubuntu/image-lab/evidence/image-history.json
          [[ -f "$EVIDENCE" ]] || { echo "Отсутствует $EVIDENCE"; exit 1; }
          python3 - "$EVIDENCE" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          assert isinstance(data, list) and len(data) >= 3, "history должна быть непустым JSON-массивом"
          required = {"ID", "CreatedBy", "Size"}
          assert all(isinstance(row, dict) and required <= row.keys() for row in data), "не хватает полей ID, CreatedBy, Size"
          text = path.read_text(encoding="utf-8").lower()
          assert "do-not-copy" not in text, "в evidence попало значение из .env"
          assert not re.search(r"(password|passwd|secret|token)\s*[=:]\s*[^\s\"']+", text), "в evidence обнаружен явный секрет"
          PY
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail

          install -d -o ubuntu -g ubuntu /home/ubuntu/image-lab/evidence
          docker image history --no-trunc --format '{{json .}}' image-lab:v2 | python3 -c 'import json,sys; json.dump([json.loads(line) for line in sys.stdin if line.strip()], sys.stdout, ensure_ascii=False, indent=2); print()' > /home/ubuntu/image-lab/evidence/image-history.json
          chown ubuntu:ubuntu /home/ubuntu/image-lab/evidence/image-history.json
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          История образа связывает Dockerfile-инструкции с созданными слоями и
          показывает их относительный размер. Она помогает заметить крупные
          установки, лишнее копирование и операции, оставляющие данные в
          предыдущих слоях.

          History и inspect нельзя считать хранилищем секретов: значения
          инструкций и метаданные доступны любому, кто получил образ. Перед
          сохранением evidence нужно убедиться, что в нём нет токенов, паролей и
          содержимого локального `.env`.
    description: |-
      #### Упражнение 1 (Сохраните структурированную историю)

      Исследуйте историю `image-lab:v2` и сохраните её в
      `/home/ubuntu/image-lab/evidence/image-history.json` как корректный
      JSON-массив. Для каждой записи сохраните поля, позволяющие определить
      слой, создавшую его инструкцию и размер.

      Evidence должен содержать несколько записей и не должен включать
      секреты, пароли, токены или значение из локального `.env`.
  - title: Удаление и пересоздание
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/usr/bin/env bash
          set -euo pipefail

          STATE_DIR=/var/lib/image-lab
          install -d -m 0755 "$STATE_DIR"
          docker container inspect --format '{{.Id}}' image-lab-api > "$STATE_DIR/previous-container-id"
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail

          PREVIOUS_FILE=/var/lib/image-lab/previous-container-id
          [[ -f "$PREVIOUS_FILE" ]] || { echo "Не сохранён ID исходного контейнера"; exit 1; }
          PREVIOUS=$(cat "$PREVIOUS_FILE")
          CURRENT=$(docker container inspect --format '{{.Id}}' image-lab-api)
          [[ "$CURRENT" != "$PREVIOUS" ]] || { echo "Контейнер не был пересоздан"; exit 1; }
          [[ "$(docker inspect --format '{{.Config.Image}}' image-lab-api)" == image-lab:v2 ]] || { echo "Контейнер создан не из image-lab:v2"; exit 1; }
          [[ "$(docker inspect --format '{{.State.Running}}' image-lab-api)" == true ]] || { echo "Новый контейнер не запущен"; exit 1; }
          [[ "$(docker inspect --format '{{(index (index .HostConfig.PortBindings "8080/tcp") 0).HostPort}}' image-lab-api)" == 18080 ]] || { echo "Порт 18080 не опубликован"; exit 1; }
          for _ in $(seq 1 20); do
            [[ "$(docker inspect --format '{{.State.Health.Status}}' image-lab-api)" == healthy ]] && break
            sleep 1
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' image-lab-api)" == healthy ]] || { echo "Новый контейнер не healthy"; exit 1; }
          curl --fail --silent --max-time 5 http://127.0.0.1:18080/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          curl --fail --silent --max-time 5 http://127.0.0.1:18080/version | python3 -c 'import json,sys; assert json.load(sys.stdin)["version"] == "2.0.0"'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail

          docker container rm --force image-lab-api >/dev/null
          docker run --detach --name image-lab-api --publish 18080:8080 image-lab:v2 >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Контейнер — расходуемый runtime-экземпляр образа. Его удаление не должно
          уничтожать способ развернуть сервис заново: исходники, Dockerfile,
          контекст и зафиксированные параметры запуска образуют воспроизводимый
          процесс.

          Проверка пересоздания подтверждает, что работоспособность не зависит от
          ручных изменений в записываемом слое старого контейнера.
    description: |-
      #### Упражнение 1 (Пересоздайте сервис)

      Удалите существующий контейнер `image-lab-api` и создайте новый из
      `image-lab:v2`, сохранив имя и публикацию порта `18080`. Не изменяйте
      файлы приложения внутри контейнера.

      Новый контейнер должен иметь другой container ID, перейти в `healthy`, а
      endpoints `/health` и `/version` должны оставаться доступными.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 3
- title: Локальный registry и жизненный цикл образов
  description: |-
    В этой лабораторной работе локально собранный образ HTTP API проходит
    полный путь от сборочного узла до развёртывания через private registry:
    получает версионные теги, публикуется, повторно загружается, фиксируется
    по digest и обновляется без потери предыдущей версии.
  time-limit-minutes: 90
  steps:
  - title: Роль registry
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail

          /usr/bin/install -d -o ubuntu -g ubuntu /home/ubuntu/registry/app-v1 /home/ubuntu/registry/app-v2

          /usr/bin/tee /home/ubuntu/registry/app-v1/app.py >/dev/null <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          VERSION = "v1"

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path not in ("/", "/health", "/version"):
                      self.send_response(404)
                      self.end_headers()
                      return
                  payload = {"service": "course-registry-api", "version": VERSION}
                  if self.path == "/health":
                      payload["status"] = "ok"
                  body = json.dumps(payload).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, format, *args):
                  return

          HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PY
          /usr/bin/sed 's/VERSION = "v1"/VERSION = "v2"/' /home/ubuntu/registry/app-v1/app.py > /home/ubuntu/registry/app-v2/app.py

          for version in v1 v2; do
            /usr/bin/tee "/home/ubuntu/registry/app-${version}/Dockerfile" >/dev/null <<'DOCKERFILE'
          FROM python:3.13-alpine
          WORKDIR /app
          COPY app.py /app/app.py
          EXPOSE 8080
          HEALTHCHECK --interval=2s --timeout=1s --retries=10 CMD wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1
          CMD ["python", "/app/app.py"]
          DOCKERFILE
          done
          /usr/bin/chown -R ubuntu:ubuntu /home/ubuntu/registry

          if ! /usr/bin/docker image inspect course-registry-api:build-v1 >/dev/null 2>&1; then
            /usr/bin/docker build --label course.lab=registry --label course.version=v1 --tag course-registry-api:build-v1 /home/ubuntu/registry/app-v1
          fi
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail

          name=$(/usr/bin/docker inspect --format '{{.Name}}' lab-registry 2>/dev/null || true)
          [ "$name" = "/lab-registry" ] || { echo "Контейнер lab-registry не найден"; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{.State.Running}}' lab-registry)" = "true" ] || { echo "Registry не запущен"; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' lab-registry)" = "unless-stopped" ] || { echo "Настройте restart policy unless-stopped"; exit 1; }
          binding=$(/usr/bin/docker inspect --format '{{(index (index .NetworkSettings.Ports "5000/tcp") 0).HostPort}}' lab-registry)
          [ "$binding" = "5000" ] || { echo "Порт registry должен быть опубликован как 5000:5000"; exit 1; }
          /usr/bin/curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null || { echo "Registry HTTP API v2 недоступен"; exit 1; }
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail

          /usr/bin/docker rm --force lab-registry >/dev/null 2>&1 || true
          /usr/bin/docker run --detach --name lab-registry --restart unless-stopped --publish 5000:5000 registry:2
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Container registry хранит репозитории образов и выдаёт их клиентам
          Docker. В отличие от локального image store, registry становится общей
          точкой распространения: один узел публикует слои и manifest, а другие
          узлы получают тот же объект по сетевому имени.

          Локальный registry полезен для изучения этого потока без внешнего
          облачного сервиса. Контейнер registry должен оставаться запущенным на
          протяжении всей работы, потому что последующие шаги обращаются к его
          HTTP API и хранилищу.
    description: |-
      Рабочие материалы находятся в каталоге `/home/ubuntu/registry`.
      Подготовлены две версии небольшого HTTP API и локальный сборочный образ
      версии `v1`.

      #### Упражнение 1 (Запуск registry)

      Создайте и запустите контейнер `lab-registry` на основе официального
      образа registry. Опубликуйте порт контейнера `5000` на порту хоста
      `5000`. Контейнер должен автоматически запускаться после перезагрузки
      Docker и отвечать на endpoint Registry HTTP API v2.
  - title: Соглашение о тегах
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail

          source_id=$(/usr/bin/docker image inspect --format '{{.Id}}' course-registry-api:build-v1 2>/dev/null || true)
          tagged_id=$(/usr/bin/docker image inspect --format '{{.Id}}' localhost:5000/course/api:v1 2>/dev/null || true)
          [ -n "$source_id" ] || { echo "Не найден исходный образ course-registry-api:build-v1"; exit 1; }
          [ "$tagged_id" = "$source_id" ] || { echo "Тег localhost:5000/course/api:v1 отсутствует или указывает не на исходный образ"; exit 1; }
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail

          /usr/bin/docker tag course-registry-api:build-v1 localhost:5000/course/api:v1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Полное имя образа задаёт маршрут публикации. Часть до первого `/`
          определяет registry, следующие компоненты образуют namespace и
          repository, а tag после `:` обозначает понятную человеку версию.

          Соглашение вида `registry/namespace/repository:version` помогает
          отделить адрес хранения от назначения приложения. Tag является
          изменяемым указателем: registry технически позволяет назначить тот же
          tag другому manifest, поэтому версионные теги следует использовать
          последовательно и не менять их смысл.
    description: |-
      #### Упражнение 1 (Версионное имя образа)

      Назначьте локальному образу `course-registry-api:build-v1` имя по схеме
      `localhost:PORT/course/app:VERSION`. Используйте порт лабораторного
      registry, namespace `course`, repository `api` и версию `v1`.

      Исходный сборочный тег должен сохраниться: новый тег является
      дополнительной ссылкой на тот же image ID.
  - title: Публикация образа
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail

          catalog=$(/usr/bin/curl --fail --silent http://127.0.0.1:5000/v2/_catalog)
          tags=$(/usr/bin/curl --fail --silent http://127.0.0.1:5000/v2/course/api/tags/list)
          /usr/bin/jq -e '.repositories | index("course/api") != null' <<<"$catalog" >/dev/null || { echo "Repository course/api отсутствует в catalog"; exit 1; }
          /usr/bin/jq -e '.tags | index("v1") != null' <<<"$tags" >/dev/null || { echo "Tag v1 отсутствует в registry"; exit 1; }
          digest=$(/usr/bin/curl --fail --silent --head --header 'Accept: application/vnd.docker.distribution.manifest.v2+json' http://127.0.0.1:5000/v2/course/api/manifests/v1 | /usr/bin/awk -F': ' 'tolower($1)=="docker-content-digest" {gsub("\r", "", $2); print $2}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Registry не вернул корректный digest manifest v1"; exit 1; }
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail

          /usr/bin/docker push localhost:5000/course/api:v1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          При push клиент проверяет, какие content-addressed layers уже есть в
          registry, передаёт недостающие blobs и в конце публикует manifest.
          Manifest связывает конфигурацию образа и набор слоёв; его digest
          вычисляется из содержимого.

          Успешная команда push — не единственный признак публикации. Registry
          HTTP API позволяет независимо проверить catalog репозиториев, список
          tags и manifest конкретной версии.
    description: |-
      #### Упражнение 1 (Публикация v1)

      Опубликуйте `localhost:5000/course/api:v1` в локальном registry. После
      публикации убедитесь средствами Registry HTTP API v2, что repository
      `course/api` появился в catalog, а версия `v1` — в списке tags.
  - title: Pull в чистое локальное состояние
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail

          image_id=$(/usr/bin/docker image inspect --format '{{.Id}}' localhost:5000/course/api:v1 2>/dev/null || true)
          [ -n "$image_id" ] || { echo "Образ localhost:5000/course/api:v1 не загружен"; exit 1; }
          registry_digest=$(/usr/bin/curl --fail --silent --head --header 'Accept: application/vnd.docker.distribution.manifest.v2+json' http://127.0.0.1:5000/v2/course/api/manifests/v1 | /usr/bin/awk -F': ' 'tolower($1)=="docker-content-digest" {gsub("\r", "", $2); print $2}')
          repo_digests=$(/usr/bin/docker image inspect --format '{{json .RepoDigests}}' localhost:5000/course/api:v1)
          /usr/bin/jq -e --arg expected "localhost:5000/course/api@${registry_digest}" 'index($expected) != null' <<<"$repo_digests" >/dev/null || { echo "RepoDigest локального образа не совпадает с registry"; exit 1; }
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail

          /usr/bin/docker image rm localhost:5000/course/api:v1 >/dev/null
          /usr/bin/docker pull localhost:5000/course/api:v1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Развёртывание воспроизводимо, когда узел получает образ из
          опубликованного источника, а не полагается на случайно оставшуюся
          локальную сборку. Удаление локального registry-тега и последующий pull
          моделируют новый узел с доступом к registry.

          После pull Docker хранит не только tag, но и RepoDigest — связь имени
          repository с неизменяемым digest загруженного manifest. Его можно
          сопоставить с заголовком, который возвращает Registry API.
    description: |-
      #### Упражнение 1 (Повторная загрузка v1)

      Удалите локальный тег `localhost:5000/course/api:v1`, не удаляя данные
      из registry. Затем снова получите эту версию из локального registry.

      В результате локальный образ должен иметь registry-тег и RepoDigest,
      совпадающий с digest manifest `v1` на сервере.
  - title: Фиксация по digest
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail

          evidence=/home/ubuntu/registry/digest.json
          [ -f "$evidence" ] || { echo "Отсутствует $evidence"; exit 1; }
          /usr/bin/jq -e 'type == "object" and .repository == "localhost:5000/course/api" and .tag == "v1" and .container == "registry-api-digest" and (.digest | test("^sha256:[0-9a-f]{64}$")) and .reference == (.repository + "@" + .digest)' "$evidence" >/dev/null || { echo "digest.json имеет неверную структуру или значения"; exit 1; }
          expected=$(/usr/bin/jq -r '.reference' "$evidence")
          registry_digest=$(/usr/bin/curl --fail --silent --head --header 'Accept: application/vnd.docker.distribution.manifest.v2+json' http://127.0.0.1:5000/v2/course/api/manifests/v1 | /usr/bin/awk -F': ' 'tolower($1)=="docker-content-digest" {gsub("\r", "", $2); print $2}')
          [ "$expected" = "localhost:5000/course/api@${registry_digest}" ] || { echo "Evidence не соответствует digest v1 в registry"; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{.Config.Image}}' registry-api-digest 2>/dev/null || true)" = "$expected" ] || { echo "Контейнер запущен не по immutable reference"; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{.State.Running}}' registry-api-digest)" = "true" ] || { echo "Контейнер registry-api-digest не запущен"; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{.State.Health.Status}}' registry-api-digest)" = "healthy" ] || { echo "Контейнер registry-api-digest не healthy"; exit 1; }
          port=$(/usr/bin/docker inspect --format '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' registry-api-digest)
          [ "$port" = "18080" ] || { echo "API должен быть опубликован на порту 18080"; exit 1; }
          /usr/bin/curl --fail --silent http://127.0.0.1:18080/version | /usr/bin/jq -e '.version == "v1" and .service == "course-registry-api"' >/dev/null || { echo "Endpoint не возвращает версию v1"; exit 1; }
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail

          digest=$(/usr/bin/curl --fail --silent --head --header 'Accept: application/vnd.docker.distribution.manifest.v2+json' http://127.0.0.1:5000/v2/course/api/manifests/v1 | /usr/bin/awk -F': ' 'tolower($1)=="docker-content-digest" {gsub("\r", "", $2); print $2}')
          reference="localhost:5000/course/api@${digest}"
          /usr/bin/jq --null-input --arg repository 'localhost:5000/course/api' --arg tag 'v1' --arg digest "$digest" --arg reference "$reference" --arg container 'registry-api-digest' '{repository:$repository,tag:$tag,digest:$digest,reference:$reference,container:$container}' > /home/ubuntu/registry/digest.json
          /usr/bin/chown ubuntu:ubuntu /home/ubuntu/registry/digest.json
          /usr/bin/docker rm --force registry-api-digest >/dev/null 2>&1 || true
          /usr/bin/docker run --detach --name registry-api-digest --publish 18080:8080 "$reference"
          for attempt in $(/usr/bin/seq 1 30); do
            [ "$(/usr/bin/docker inspect --format '{{.State.Health.Status}}' registry-api-digest 2>/dev/null || true)" = "healthy" ] && exit 0
            /usr/bin/sleep 1
          done
          echo "API v1 не перешёл в healthy-состояние"
          exit 1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Tag — удобное, но изменяемое имя. Digest — криптографический
          идентификатор manifest, зависящий от его байтов. Ссылка
          `repository@digest` выбирает ровно один опубликованный объект и потому
          подходит для immutable deployment reference.

          Для аудита важно хранить не отдельный хеш без контекста, а
          структурированное evidence: repository, исходный tag, digest, полную
          immutable reference и имя развёрнутого контейнера.
    description: |-
      #### Упражнение 1 (Immutable deployment)

      Определите digest опубликованной версии `v1` и создайте
      `/home/ubuntu/registry/digest.json`. В JSON должны быть строковые поля
      `repository`, `tag`, `digest`, `reference` и `container`. Укажите
      repository `localhost:5000/course/api`, tag `v1`, полную ссылку через
      `@` и контейнер `registry-api-digest`.

      Разверните `registry-api-digest` именно по immutable reference,
      опубликуйте API на порту хоста `18080` и дождитесь healthy-состояния.
      Endpoint `/version` должен возвращать версию `v1`.
  - title: Публикация новой версии
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail

          tags=$(/usr/bin/curl --fail --silent http://127.0.0.1:5000/v2/course/api/tags/list)
          /usr/bin/jq -e '.tags | index("v1") != null and index("v2") != null' <<<"$tags" >/dev/null || { echo "Registry должен хранить теги v1 и v2"; exit 1; }
          manifest_digest() {
            /usr/bin/curl --fail --silent --head --header 'Accept: application/vnd.docker.distribution.manifest.v2+json' "http://127.0.0.1:5000/v2/course/api/manifests/$1" | /usr/bin/awk -F': ' 'tolower($1)=="docker-content-digest" {gsub("\r", "", $2); print $2}'
          }
          v1_digest=$(manifest_digest v1)
          v2_digest=$(manifest_digest v2)
          [[ "$v1_digest" =~ ^sha256:[0-9a-f]{64}$ && "$v2_digest" =~ ^sha256:[0-9a-f]{64}$ && "$v1_digest" != "$v2_digest" ]] || { echo "v1 и v2 должны иметь разные корректные digest"; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{.Config.Image}}' registry-api-v2 2>/dev/null || true)" = "localhost:5000/course/api:v2" ] || { echo "registry-api-v2 должен быть создан из registry-тега v2"; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{.State.Running}}' registry-api-v2)" = "true" ] || { echo "registry-api-v2 не запущен"; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{.State.Health.Status}}' registry-api-v2)" = "healthy" ] || { echo "registry-api-v2 не healthy"; exit 1; }
          port=$(/usr/bin/docker inspect --format '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' registry-api-v2)
          [ "$port" = "18081" ] || { echo "API v2 должен быть опубликован на порту 18081"; exit 1; }
          /usr/bin/curl --fail --silent http://127.0.0.1:18081/version | /usr/bin/jq -e '.version == "v2" and .service == "course-registry-api"' >/dev/null || { echo "Endpoint не возвращает версию v2"; exit 1; }
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail

          /usr/bin/docker build --label course.lab=registry --label course.version=v2 --tag localhost:5000/course/api:v2 /home/ubuntu/registry/app-v2
          /usr/bin/docker push localhost:5000/course/api:v2
          /usr/bin/docker rm --force registry-api-v2 >/dev/null 2>&1 || true
          /usr/bin/docker run --detach --name registry-api-v2 --publish 18081:8080 localhost:5000/course/api:v2
          for attempt in $(/usr/bin/seq 1 30); do
            [ "$(/usr/bin/docker inspect --format '{{.State.Health.Status}}' registry-api-v2 2>/dev/null || true)" = "healthy" ] && exit 0
            /usr/bin/sleep 1
          done
          echo "API v2 не перешёл в healthy-состояние"
          exit 1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Версионное обновление создаёт новый образ и новый manifest, а не меняет
          смысл уже опубликованной версии. Одновременное наличие `v1` и `v2`
          позволяет воспроизводить старое развёртывание, тестировать новое и
          выполнять контролируемый rollback.

          Разные версии полезной нагрузки должны иметь разные manifest digests.
          Работоспособность новой версии подтверждается не только tag в registry,
          но и состоянием контейнера, healthcheck и ответом реального endpoint.
    description: |-
      #### Упражнение 1 (Обновление API)

      Используя подготовленный контекст `/home/ubuntu/registry/app-v2`,
      соберите локальный образ API версии `v2`, присвойте ему registry-имя
      `localhost:5000/course/api:v2` и опубликуйте его. Не перезаписывайте и
      не удаляйте `v1`.

      Разверните контейнер `registry-api-v2` из опубликованного registry-тега
      на порту хоста `18081`. Дождитесь healthy-состояния; endpoint `/version`
      должен сообщать `v2`.
  - title: Очистка локального состояния
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail

          for container in registry-api-digest registry-api-v2; do
            if /usr/bin/docker inspect "$container" >/dev/null 2>&1; then
              echo "Контейнер $container не удалён"
              exit 1
            fi
          done
          [ "$(/usr/bin/docker inspect --format '{{.State.Running}}' lab-registry 2>/dev/null || true)" = "true" ] || { echo "lab-registry должен остаться запущенным"; exit 1; }
          if /usr/bin/docker image ls --format '{{.Repository}}:{{.Tag}}' | /usr/bin/awk '$0 ~ /^localhost:5000\/course\/api:/ {found=1} END {exit !found}'; then
            echo "Локальные теги localhost:5000/course/api ещё существуют"
            exit 1
          fi
          if /usr/bin/docker image ls --quiet | /usr/bin/sort --unique | while read -r image_id; do /usr/bin/docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image_id"; done | /usr/bin/awk '$0 ~ /^localhost:5000\/course\/api@sha256:/ {found=1} END {exit !found}'; then
            echo "Локальные digest-ссылки localhost:5000/course/api ещё существуют"
            exit 1
          fi
          tags=$(/usr/bin/curl --fail --silent http://127.0.0.1:5000/v2/course/api/tags/list)
          /usr/bin/jq -e '.name == "course/api" and (.tags | index("v1") != null and index("v2") != null)' <<<"$tags" >/dev/null || { echo "Registry больше не хранит обе версии"; exit 1; }
          for version in v1 v2; do
            digest=$(/usr/bin/curl --fail --silent --head --header 'Accept: application/vnd.docker.distribution.manifest.v2+json' "http://127.0.0.1:5000/v2/course/api/manifests/${version}" | /usr/bin/awk -F': ' 'tolower($1)=="docker-content-digest" {gsub("\r", "", $2); print $2}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Manifest $version недоступен в registry"; exit 1; }
          done
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail

          /usr/bin/docker rm --force registry-api-digest registry-api-v2 >/dev/null 2>&1 || true
          mapfile -t digest_refs < <(
            /usr/bin/docker image ls --quiet | /usr/bin/sort --unique | while read -r image_id; do
              /usr/bin/docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image_id"
            done | /usr/bin/awk '$0 ~ /^localhost:5000\/course\/api@sha256:/' | /usr/bin/sort --unique
          )
          if [ "${#digest_refs[@]}" -gt 0 ]; then
            /usr/bin/docker image rm "${digest_refs[@]}" >/dev/null
          fi
          mapfile -t image_refs < <(/usr/bin/docker image ls --format '{{.Repository}}:{{.Tag}}' | /usr/bin/awk '$0 ~ /^localhost:5000\/course\/api:/')
          if [ "${#image_refs[@]}" -gt 0 ]; then
            /usr/bin/docker image rm "${image_refs[@]}" >/dev/null
          fi
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Локальный image store Docker и хранилище registry — разные области
          состояния. Удаление контейнера или локального тега освобождает ссылки
          только на узле Docker Engine и не удаляет manifest и layers, ранее
          опубликованные в registry.

          Удаление данных из registry требует отдельной политики: удаления
          manifest, учёта общих layers и garbage collection. В этой работе
          registry сохраняется как проверяемый источник обеих версий, а очищаются
          только контейнеры API и локальные теги лабораторного repository.
    description: |-
      #### Упражнение 1 (Границы cleanup)

      Удалите лабораторные контейнеры API `registry-api-digest` и
      `registry-api-v2`. Удалите локальные теги repository
      `localhost:5000/course/api`, включая версионные и digest-ссылки, которые
      больше не используются контейнерами.

      Не удаляйте и не останавливайте `lab-registry`. После локальной очистки
      его API должен по-прежнему показывать repository `course/api` и обе
      опубликованные версии `v1` и `v2`.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 4
- title: Конфигурация и базовая безопасность контейнеров
  description: |-
    В лабораторной работе вы последовательно усилите безопасность контейнера
    с HTTP API: опишете угрозы, исключите запуск от root, ограничите
    файловую систему и Linux capabilities, отделите секреты и конфигурацию
    от образа, а затем подтвердите свойства образа и работающего контейнера.

    Рабочий каталог лаборатории — `/home/ubuntu/docker-security`. Итоговый
    сервис публикуется локально на порту `18080` и сохраняет счётчик
    запросов в специально выделенном writable-пути.
  time-limit-minutes: 120
  steps:
  - title: 01. Модель угроз
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.sh	---
          cat <<'EOF' > prepare.sh
          #!/bin/bash
          set -euo pipefail

          WORKDIR=/home/ubuntu/docker-security
          install -d -m 0755 -o ubuntu -g ubuntu "$WORKDIR"
          install -d -m 0755 -o ubuntu -g ubuntu "$WORKDIR/runtime"
          install -d -m 0700 -o ubuntu -g ubuntu "$WORKDIR/runtime/secret"
          install -m 0644 -o ubuntu -g ubuntu /workspace/VirtualizationAndCloud/lab/docker/security/prepare/assets/app.py "$WORKDIR/app.py"
          python3 - <<'PYSECRET' > "$WORKDIR/runtime/secret/db_password"
          import secrets
          print("lab-db-password-" + secrets.token_hex(12))
          PYSECRET
          chown 10001:10001 "$WORKDIR/runtime/secret/db_password"
          chmod 0400 "$WORKDIR/runtime/secret/db_password"
          rm -f "$WORKDIR/threat-model.json" "$WORKDIR/app.env" "$WORKDIR/image-evidence.json"
          docker rm -f security-api >/dev/null 2>&1 || true
          docker image rm security-api:lab >/dev/null 2>&1 || true
          EOF
          trap 'rm -f prepare.sh' EXIT


          # ----------RUN----------
          chmod u+x prepare.sh
          ./prepare.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          FILE=/home/ubuntu/docker-security/threat-model.json
          [ -f "$FILE" ] || { echo "Отсутствует $FILE"; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/home/ubuntu/docker-security/threat-model.json')
          try:
              data = json.loads(path.read_text())
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f'Некорректный JSON: {exc}')
          risks = data.get('risks')
          if not isinstance(risks, list):
              raise SystemExit('Поле risks должно быть массивом')
          required = {'root-user', 'writable-rootfs', 'capabilities', 'secret-in-image'}
          fields = {'category', 'asset', 'threat', 'impact', 'mitigation'}
          for risk in risks:
              if not isinstance(risk, dict) or any(not isinstance(risk.get(k), str) or not risk[k].strip() for k in fields):
                  raise SystemExit('Каждый риск должен содержать непустые строковые поля category, asset, threat, impact, mitigation')
          categories = [risk['category'] for risk in risks]
          if not required.issubset(categories):
              raise SystemExit('Не описаны обязательные категории: ' + ', '.join(sorted(required - set(categories))))
          if len(categories) != len(set(categories)):
              raise SystemExit('Категории рисков должны быть уникальными')
          print('Модель угроз содержит все обязательные категории')
          PY
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------IMPORT----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          cat > /home/ubuntu/docker-security/threat-model.json <<'JSON'
          {
            "service": "hardened-api",
            "risks": [
              {"category":"root-user","asset":"host and container processes","threat":"application compromise with UID 0","impact":"broader control over container resources","mitigation":"run the API as UID and GID 10001"},
              {"category":"writable-rootfs","asset":"application filesystem","threat":"runtime modification or persistence","impact":"tampered application state survives in the container layer","mitigation":"make rootfs read-only and isolate one temporary writable path"},
              {"category":"capabilities","asset":"shared Linux kernel","threat":"abuse of unnecessary kernel privileges","impact":"expanded actions after code execution","mitigation":"drop every capability and prevent privilege escalation"},
              {"category":"secret-in-image","asset":"database credential","threat":"credential recovery from image metadata or layers","impact":"unauthorized database access","mitigation":"mount the secret as a read-only runtime file"}
            ]
          }
          JSON
          chown ubuntu:ubuntu /home/ubuntu/docker-security/threat-model.json
          EOF
          trap 'rm -f solution.sh' EXIT



          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          cat > /home/ubuntu/docker-security/threat-model.json <<'JSON'
          {
            "service": "hardened-api",
            "risks": [
              {"category":"root-user","asset":"host and container processes","threat":"application compromise with UID 0","impact":"broader control over container resources","mitigation":"run the API as UID and GID 10001"},
              {"category":"writable-rootfs","asset":"application filesystem","threat":"runtime modification or persistence","impact":"tampered application state survives in the container layer","mitigation":"make rootfs read-only and isolate one temporary writable path"},
              {"category":"capabilities","asset":"shared Linux kernel","threat":"abuse of unnecessary kernel privileges","impact":"expanded actions after code execution","mitigation":"drop every capability and prevent privilege escalation"},
              {"category":"secret-in-image","asset":"database credential","threat":"credential recovery from image metadata or layers","impact":"unauthorized database access","mitigation":"mount the secret as a read-only runtime file"}
            ]
          }
          JSON
          chown ubuntu:ubuntu /home/ubuntu/docker-security/threat-model.json
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Контейнер разделяет ядро с хостом, поэтому ошибочная конфигурация
          увеличивает последствия компрометации приложения. Процесс с UID 0 может
          использовать доступные привилегии; изменяемая корневая файловая система
          позволяет закрепиться внутри контейнера; лишние capabilities расширяют
          набор системных операций. Секрет, добавленный при сборке, может
          сохраниться в слоях образа даже после удаления из итогового каталога.

          Threat model связывает защищаемый актив, угрозу, возможное последствие и
          меру снижения риска. Машиночитаемый формат позволяет автоматически
          проверить полноту модели и использовать её в security pipeline.
    description: |-
      #### Упражнение 1 (Модель угроз)

      Создайте в рабочем каталоге файл `threat-model.json`. Корневой объект
      должен содержать массив `risks`; каждый элемент — непустые строковые
      поля `category`, `asset`, `threat`, `impact` и `mitigation`.

      Опишите как минимум четыре риска с уникальными категориями `root-user`,
      `writable-rootfs`, `capabilities` и `secret-in-image`. Свяжите меры
      защиты с API-сервисом этой лаборатории.
  - title: 02. Непривилегированный пользователь
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          IMAGE=security-api:lab
          CONTAINER=security-api
          docker image inspect "$IMAGE" >/dev/null 2>&1 || { echo "Образ $IMAGE не найден"; exit 1; }
          [ "$(docker image inspect -f '{{.Config.User}}' "$IMAGE")" = "10001:10001" ] || { echo "В образе не задан USER 10001:10001"; exit 1; }
          [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null)" = true ] || { echo "Контейнер $CONTAINER не запущен"; exit 1; }
          [ "$(docker exec "$CONTAINER" python -c 'import os; print(os.geteuid())')" = 10001 ] || { echo "Effective UID процесса должен быть 10001"; exit 1; }
          BINDING=$(docker inspect -f '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostIp}}:{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' "$CONTAINER")
          [ "$BINDING" = "127.0.0.1:18080" ] || { echo "Ожидается публикация 127.0.0.1:18080"; exit 1; }
          python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=3)" >/dev/null
          echo "API работает с effective UID 10001"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------IMPORT----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          WORKDIR=/home/ubuntu/docker-security
          cat > "$WORKDIR/Dockerfile" <<'DOCKERFILE'
          FROM python:3.13-alpine
          LABEL org.opencontainers.image.title="hardened-api" \
                org.opencontainers.image.version="1.0.0" \
                org.opencontainers.image.base.name="python:3.13-alpine"
          RUN addgroup -g 10001 app && adduser -D -H -u 10001 -G app app \
              && mkdir -p /var/lib/hardened-api && chown app:app /var/lib/hardened-api
          WORKDIR /opt/app
          COPY --chown=10001:10001 app.py /opt/app/app.py
          USER 10001:10001
          EXPOSE 8080
          HEALTHCHECK --interval=5s --timeout=2s --start-period=2s --retries=5 \
            CMD ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1)"]
          CMD ["python", "/opt/app/app.py"]
          DOCKERFILE
          chown ubuntu:ubuntu "$WORKDIR/Dockerfile"
          docker build -t security-api:lab "$WORKDIR"
          docker rm -f security-api >/dev/null 2>&1 || true
          docker run -d --name security-api -p 127.0.0.1:18080:8080 security-api:lab >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT



          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          WORKDIR=/home/ubuntu/docker-security
          cat > "$WORKDIR/Dockerfile" <<'DOCKERFILE'
          FROM python:3.13-alpine
          LABEL org.opencontainers.image.title="hardened-api" \
                org.opencontainers.image.version="1.0.0" \
                org.opencontainers.image.base.name="python:3.13-alpine"
          RUN addgroup -g 10001 app && adduser -D -H -u 10001 -G app app \
              && mkdir -p /var/lib/hardened-api && chown app:app /var/lib/hardened-api
          WORKDIR /opt/app
          COPY --chown=10001:10001 app.py /opt/app/app.py
          USER 10001:10001
          EXPOSE 8080
          HEALTHCHECK --interval=5s --timeout=2s --start-period=2s --retries=5 \
            CMD ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1)"]
          CMD ["python", "/opt/app/app.py"]
          DOCKERFILE
          chown ubuntu:ubuntu "$WORKDIR/Dockerfile"
          docker build -t security-api:lab "$WORKDIR"
          docker rm -f security-api >/dev/null 2>&1 || true
          docker run -d --name security-api -p 127.0.0.1:18080:8080 security-api:lab >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Принцип наименьших привилегий требует выдавать процессу только
          необходимые права. Директива пользователя в образе задаёт UID/GID
          процесса контейнера; это не то же самое, что user namespace, который
          дополнительно отображает идентификаторы контейнера в непривилегированный
          диапазон хоста. Даже без user namespace отказ от UID 0 уменьшает
          последствия уязвимости приложения.

          Для сетевого сервиса на непривилегированном порту root обычно не нужен.
          Важно проверять effective UID именно у работающего процесса, а не только
          текст Dockerfile.
    description: |-
      #### Упражнение 1 (Непривилегированный процесс)

      Создайте образ `security-api:lab` для предоставленного `app.py`. Образ
      должен запускать приложение от числового UID/GID `10001:10001`,
      объявлять порт приложения `8080` и содержать OCI-метки имени, версии и
      базового образа.

      Запустите контейнер `security-api`, опубликовав API только на
      loopback-интерфейсе хоста через порт `18080`. На этом шаге достаточно
      обеспечить ответ health endpoint; ограничения следующих шагов будут
      добавлены далее.
  - title: 03. Read-only root filesystem
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          CONTAINER=security-api
          [ "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$CONTAINER" 2>/dev/null)" = true ] || { echo "Root filesystem не переведена в read-only"; exit 1; }
          TMPFS=$(docker inspect -f '{{index .HostConfig.Tmpfs "/var/lib/hardened-api"}}' "$CONTAINER")
          for option in rw noexec nosuid nodev uid=10001 gid=10001; do
            [[ ",$TMPFS," == *",$option,"* ]] || { echo "Для tmpfs отсутствует параметр $option"; exit 1; }
          done
          if docker exec "$CONTAINER" python -c "open('/opt/app/probe','w')" >/dev/null 2>&1; then
            echo "Запись в rootfs неожиданно разрешена"; exit 1
          fi
          docker exec "$CONTAINER" python -c "open('/var/lib/hardened-api/probe','w').write('ok')"
          python3 - <<'PY'
          import json, urllib.request
          for path in ('/health', '/api/status'):
              with urllib.request.urlopen('http://127.0.0.1:18080' + path, timeout=3) as response:
                  json.load(response)
          print('Read-only rootfs и выделенный writable tmpfs работают')
          PY
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------IMPORT----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          docker rm -f security-api >/dev/null 2>&1 || true
          docker run -d --name security-api \
            -p 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /var/lib/hardened-api:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700 \
            security-api:lab >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT



          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          docker rm -f security-api >/dev/null 2>&1 || true
          docker run -d --name security-api \
            -p 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /var/lib/hardened-api:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700 \
            security-api:lab >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Read-only root filesystem блокирует изменение файлов, пришедших из слоёв
          образа. Это затрудняет подмену приложения и закрепление вредоносного
          кода, но не отменяет необходимость отдельных writable-путей для
          состояния.

          Записываемые области следует выделять явно и минимально. Для временного
          счётчика API подходит отдельный `tmpfs`: данные не попадают в слой
          контейнера, а параметры монтирования могут запретить исполнение файлов и
          специальные устройства.
    description: |-
      #### Упражнение 1 (Неизменяемая корневая файловая система)

      Пересоздайте `security-api` с read-only root filesystem. Единственной
      writable-областью приложения должен быть `tmpfs` в
      `/var/lib/hardened-api`, доступный UID/GID `10001:10001` и ограниченный
      параметрами `noexec`, `nosuid` и `nodev`.

      Убедитесь, что health endpoint продолжает отвечать, а настроенный API
      endpoint способен обновлять счётчик запросов.
  - title: 04. Linux capabilities
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          CONTAINER=security-api
          INSPECT=$(docker inspect "$CONTAINER" 2>/dev/null) || { echo "Контейнер $CONTAINER не найден"; exit 1; }
          python3 - "$INSPECT" <<'PY'
          import json, sys
          container = json.loads(sys.argv[1])[0]
          host = container['HostConfig']
          if set(host.get('CapDrop') or []) != {'ALL'}:
              raise SystemExit('Должны быть удалены все capabilities')
          if host.get('CapAdd'):
              raise SystemExit('CapAdd должен оставаться пустым')
          opts = host.get('SecurityOpt') or []
          if 'no-new-privileges:true' not in opts:
              raise SystemExit('Не включён no-new-privileges')
          if any(opt in {'seccomp=unconfined', 'seccomp:unconfined'} for opt in opts):
              raise SystemExit('Стандартный seccomp-профиль отключён')
          PY
          python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=3)" >/dev/null
          echo "Capabilities удалены, повышение привилегий запрещено"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------IMPORT----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          docker rm -f security-api >/dev/null 2>&1 || true
          docker run -d --name security-api \
            -p 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /var/lib/hardened-api:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            security-api:lab >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT



          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          docker rm -f security-api >/dev/null 2>&1 || true
          docker run -d --name security-api \
            -p 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /var/lib/hardened-api:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            security-api:lab >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Linux capabilities дробят традиционные полномочия root на отдельные
          возможности, например изменение владельца файлов или сетевой
          конфигурации. Docker выдаёт контейнеру ограниченный набор capabilities
          по умолчанию, но прикладному HTTP-сервису на порту выше 1024 обычно не
          нужен и этот набор.

          Стратегия deny-by-default удаляет все capabilities и возвращает только
          доказанно необходимые. Параметр `no-new-privileges` дополнительно
          запрещает процессам получить новые привилегии через setuid/setgid или
          файловые capabilities.
    description: |-
      #### Упражнение 1 (Минимальные capabilities)

      Пересоздайте `security-api`, удалив все Linux capabilities без
      добавления исключений. Запретите процессам повышать привилегии. Не
      отключайте стандартный seccomp-профиль Docker.

      Сохраните доступность обоих HTTP endpoint после применения ограничений.
  - title: 05. Секреты вне образа
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          CONTAINER=security-api
          IMAGE=security-api:lab
          SECRET_FILE=/home/ubuntu/docker-security/runtime/secret/db_password
          [ -f "$SECRET_FILE" ] || { echo "Подготовленный секрет отсутствует"; exit 1; }
          SECRET=$(cat "$SECRET_FILE")
          MOUNT=$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/run/secrets/db_password"}}{{.Type}}|{{.Source}}|{{.RW}}{{end}}{{end}}' "$CONTAINER")
          [ "$MOUNT" = "bind|$SECRET_FILE|false" ] || { echo "Секрет не подключён ожидаемым read-only bind mount"; exit 1; }
          [ "$(docker exec "$CONTAINER" python -c "from pathlib import Path; print(bool(Path('/run/secrets/db_password').read_text().strip()))")" = True ] || { echo "Приложение не может прочитать секрет"; exit 1; }
          for source in \
            "$(docker history --no-trunc "$IMAGE")" \
            "$(docker image inspect "$IMAGE")" \
            "$(docker inspect "$CONTAINER")" \
            "$(docker logs "$CONTAINER" 2>&1)"; do
            [[ "$source" != *"$SECRET"* ]] || { echo "Значение секрета обнаружено в метаданных или логах"; exit 1; }
          done
          RESULT=$(python3 -c "import json,urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:18080/api/status', timeout=3))['secret_loaded'])")
          [ "$RESULT" = True ] || { echo "API не подтверждает загрузку секрета"; exit 1; }
          echo "Секрет доступен только через runtime-файл и не раскрыт"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------IMPORT----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          SECRET=/home/ubuntu/docker-security/runtime/secret/db_password
          docker rm -f security-api >/dev/null 2>&1 || true
          docker run -d --name security-api \
            -p 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /var/lib/hardened-api:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount type=bind,src="$SECRET",dst=/run/secrets/db_password,readonly \
            -e DB_SECRET_FILE=/run/secrets/db_password \
            security-api:lab >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT



          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          SECRET=/home/ubuntu/docker-security/runtime/secret/db_password
          docker rm -f security-api >/dev/null 2>&1 || true
          docker run -d --name security-api \
            -p 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /var/lib/hardened-api:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount type=bind,src="$SECRET",dst=/run/secrets/db_password,readonly \
            -e DB_SECRET_FILE=/run/secrets/db_password \
            security-api:lab >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Секрет нельзя помещать в Dockerfile, build arguments, слои образа,
          переменные окружения контейнера или журналы: эти данные часто доступны
          через history, inspect, registry cache и системы логирования. Секрет
          следует передавать только во время запуска как отдельный файл с
          минимальными правами.

          Приложение должно знать путь к секрету, но не обязано раскрывать его
          значение. Для проверки достаточно подтвердить успешное чтение и
          отсутствие значения в метаданных образа и контейнера.
    description: |-
      #### Упражнение 1 (Секрет вне образа)

      Подключите подготовленный файл `runtime/secret/db_password` к контейнеру
      только для чтения по пути `/run/secrets/db_password`. Передайте
      приложению только путь к файлу секрета.

      Значение секрета не должно встречаться в image history, конфигурации
      образа, inspect работающего контейнера или его журналах. Ответ API
      должен подтверждать, что секрет успешно загружен, не раскрывая его.
  - title: 06. Отделение конфигурации
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          WORKDIR=/home/ubuntu/docker-security
          ENVFILE="$WORKDIR/app.env"
          [ -f "$ENVFILE" ] || { echo "Отсутствует $ENVFILE"; exit 1; }
          [ "$(grep -Ec '^APP_ENDPOINT=/api/security$' "$ENVFILE")" -eq 1 ] || { echo "Некорректный APP_ENDPOINT"; exit 1; }
          [ "$(grep -Ec '^APP_VERSION=1\.0\.0$' "$ENVFILE")" -eq 1 ] || { echo "Некорректный APP_VERSION"; exit 1; }
          IMAGE_ENV=$(docker image inspect -f '{{json .Config.Env}}' security-api:lab)
          [[ "$IMAGE_ENV" != *'/api/security'* && "$IMAGE_ENV" != *'1.0.0'* ]] || { echo "Runtime-конфигурация обнаружена в переменных образа"; exit 1; }
          SAVED=$(mktemp -d)
          trap 'rm -rf "$SAVED"' EXIT
          docker image save security-api:lab -o "$SAVED/image.tar"
          if tar -xOf "$SAVED/image.tar" 2>/dev/null | strings | grep -Fq '/api/security'; then
            echo "Endpoint обнаружен в файловых слоях образа"; exit 1
          fi
          python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:18080/api/security', timeout=3) as response:
              payload = json.load(response)
          if payload.get('version') != '1.0.0':
              raise SystemExit('API вернул неверную версию')
          print('Runtime-конфигурация отделена от образа')
          PY
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------IMPORT----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          WORKDIR=/home/ubuntu/docker-security
          SECRET="$WORKDIR/runtime/secret/db_password"
          cat > "$WORKDIR/app.env" <<'ENV'
          APP_ENDPOINT=/api/security
          APP_VERSION=1.0.0
          DB_SECRET_FILE=/run/secrets/db_password
          ENV
          chown ubuntu:ubuntu "$WORKDIR/app.env"
          chmod 0644 "$WORKDIR/app.env"
          docker rm -f security-api >/dev/null 2>&1 || true
          docker run -d --name security-api \
            -p 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /var/lib/hardened-api:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount type=bind,src="$SECRET",dst=/run/secrets/db_password,readonly \
            --env-file "$WORKDIR/app.env" \
            security-api:lab >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT



          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          WORKDIR=/home/ubuntu/docker-security
          SECRET="$WORKDIR/runtime/secret/db_password"
          cat > "$WORKDIR/app.env" <<'ENV'
          APP_ENDPOINT=/api/security
          APP_VERSION=1.0.0
          DB_SECRET_FILE=/run/secrets/db_password
          ENV
          chown ubuntu:ubuntu "$WORKDIR/app.env"
          chmod 0644 "$WORKDIR/app.env"
          docker rm -f security-api >/dev/null 2>&1 || true
          docker run -d --name security-api \
            -p 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /var/lib/hardened-api:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount type=bind,src="$SECRET",dst=/run/secrets/db_password,readonly \
            --env-file "$WORKDIR/app.env" \
            security-api:lab >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Конфигурация и секреты имеют разный жизненный цикл. Несекретные
          параметры удобно хранить в version-controlled env-файле или
          config-объекте, тогда как секреты требуют более строгого доступа и
          ротации. Разделение позволяет использовать один неизменяемый образ в
          разных окружениях.

          В этой лаборатории путь API и отображаемая версия являются
          конфигурацией. Они должны задаваться при запуске, а не запекаться в слой
          образа.
    description: |-
      #### Упражнение 1 (Отдельная конфигурация)

      Создайте `app.env` с двумя параметрами: endpoint `/api/security` и
      версия `1.0.0`. Подключите файл как runtime-конфигурацию контейнера.

      Пересоздайте сервис и проверьте, что новый endpoint возвращает заданную
      версию. Эти значения не должны присутствовать в файловых слоях или
      переменных окружения самого образа.
  - title: 07. Локальные признаки image hygiene
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          FILE=/home/ubuntu/docker-security/image-evidence.json
          [ -f "$FILE" ] || { echo "Отсутствует $FILE"; exit 1; }
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          data = json.loads(Path('/home/ubuntu/docker-security/image-evidence.json').read_text())
          expected = {
              'base_image': 'python:3.13-alpine',
              'application_image': 'security-api:lab',
              'application_version': '1.0.0',
              'scan_status': 'local-metadata-checked',
          }
          for key, value in expected.items():
              if data.get(key) != value:
                  raise SystemExit(f'Некорректное поле {key}')
          digest = data.get('base_digest', '')
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('base_digest должен иметь формат sha256:<64 hex>')
          base = json.loads(subprocess.check_output(['docker','image','inspect','python:3.13-alpine']))[0]
          valid = {base['Id']} | {item.split('@', 1)[1] for item in base.get('RepoDigests', []) if '@' in item}
          if digest not in valid:
              raise SystemExit('Digest не соответствует локальному базовому образу')
          labels = json.loads(subprocess.check_output(['docker','image','inspect','security-api:lab']))[0]['Config'].get('Labels') or {}
          required = {
              'org.opencontainers.image.title': 'hardened-api',
              'org.opencontainers.image.version': '1.0.0',
              'org.opencontainers.image.base.name': 'python:3.13-alpine',
          }
          for key, value in required.items():
              if labels.get(key) != value:
                  raise SystemExit(f'Отсутствует OCI label {key}={value}')
          print('Evidence соответствует локальным образам и OCI labels')
          PY
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------IMPORT----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          WORKDIR=/home/ubuntu/docker-security
          BASE=python:3.13-alpine
          DIGEST=$(docker image inspect -f '{{index .RepoDigests 0}}' "$BASE" 2>/dev/null | sed 's/.*@//' || true)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = '<no value>' ]; then
            DIGEST=$(docker image inspect -f '{{.Id}}' "$BASE")
          fi
          python3 - "$DIGEST" > "$WORKDIR/image-evidence.json" <<'PY'
          import json, sys
          print(json.dumps({
              'base_image': 'python:3.13-alpine',
              'base_digest': sys.argv[1],
              'application_image': 'security-api:lab',
              'application_version': '1.0.0',
              'scan_status': 'local-metadata-checked'
          }, indent=2))
          PY
          chown ubuntu:ubuntu "$WORKDIR/image-evidence.json"
          EOF
          trap 'rm -f solution.sh' EXIT



          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          WORKDIR=/home/ubuntu/docker-security
          BASE=python:3.13-alpine
          DIGEST=$(docker image inspect -f '{{index .RepoDigests 0}}' "$BASE" 2>/dev/null | sed 's/.*@//' || true)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = '<no value>' ]; then
            DIGEST=$(docker image inspect -f '{{.Id}}' "$BASE")
          fi
          python3 - "$DIGEST" > "$WORKDIR/image-evidence.json" <<'PY'
          import json, sys
          print(json.dumps({
              'base_image': 'python:3.13-alpine',
              'base_digest': sys.argv[1],
              'application_image': 'security-api:lab',
              'application_version': '1.0.0',
              'scan_status': 'local-metadata-checked'
          }, indent=2))
          PY
          chown ubuntu:ubuntu "$WORKDIR/image-evidence.json"
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Полный security pipeline обычно включает SBOM, поиск известных
          уязвимостей, policy checks, подпись и проверку provenance. Результат
          сканирования зависит от актуальных баз уязвимостей и внешних
          инструментов, поэтому этот шаг проверяет только локально воспроизводимые
          признаки image hygiene.

          Тег удобен человеку, но может быть переназначен. Digest идентифицирует
          конкретное содержимое полученного базового образа. OCI labels сохраняют
          происхождение и версию приложения в метаданных итогового образа.
    description: |-
      #### Упражнение 1 (Свидетельство о происхождении образа)

      Создайте `image-evidence.json` для локально использованного базового
      образа. Укажите поля `base_image`, `base_digest`, `application_image`,
      `application_version` и `scan_status`.

      Значения должны соответствовать реально доступным локальным образам и
      OCI-меткам `security-api:lab`. Digest должен иметь формат OCI, а статус
      этого учебного шага — `local-metadata-checked`.
  - title: 08. Интеграция hardening
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          CONTAINER=security-api
          SECRET_FILE=/home/ubuntu/docker-security/runtime/secret/db_password
          INSPECT=$(docker inspect "$CONTAINER" 2>/dev/null) || { echo "Контейнер $CONTAINER не найден"; exit 1; }
          python3 - "$INSPECT" <<'PY'
          import json, sys
          c = json.loads(sys.argv[1])[0]
          h = c['HostConfig']
          errors = []
          if c['State'].get('Status') != 'running': errors.append('container is not running')
          if c['State'].get('Health', {}).get('Status') != 'healthy': errors.append('health status is not healthy')
          if c['Config'].get('User') != '10001:10001': errors.append('user is not 10001:10001')
          if not h.get('ReadonlyRootfs'): errors.append('rootfs is not read-only')
          if set(h.get('CapDrop') or []) != {'ALL'} or h.get('CapAdd'): errors.append('capabilities are not minimal')
          opts = h.get('SecurityOpt') or []
          if 'no-new-privileges:true' not in opts: errors.append('no-new-privileges is absent')
          if any('seccomp' in x and 'unconfined' in x for x in opts): errors.append('seccomp is unconfined')
          if h.get('RestartPolicy', {}).get('Name') != 'unless-stopped': errors.append('restart policy is not unless-stopped')
          tmpfs = h.get('Tmpfs', {}).get('/var/lib/hardened-api', '')
          for option in ('rw','noexec','nosuid','nodev','uid=10001','gid=10001'):
              if option not in tmpfs.split(','): errors.append(f'tmpfs misses {option}')
          ports = c['NetworkSettings']['Ports'].get('8080/tcp') or []
          if len(ports) != 1 or ports[0] != {'HostIp':'127.0.0.1','HostPort':'18080'}: errors.append('published port is not loopback-only 18080')
          mounts = [m for m in c['Mounts'] if m['Destination'] == '/run/secrets/db_password']
          if len(mounts) != 1 or mounts[0]['RW']: errors.append('secret mount is absent or writable')
          if errors: raise SystemExit('; '.join(errors))
          PY
          SECRET=$(cat "$SECRET_FILE")
          LOGS=$(docker logs "$CONTAINER" 2>&1)
          [[ "$LOGS" != *"$SECRET"* ]] || { echo "Секрет обнаружен в логах"; exit 1; }
          python3 - "$SECRET" <<'PY'
          import json, sys, urllib.request
          secret = sys.argv[1]
          with urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=3) as response:
              health = json.load(response)
          with urllib.request.urlopen('http://127.0.0.1:18080/api/security', timeout=3) as response:
              payload = json.load(response)
          if health != {'status': 'ok'}:
              raise SystemExit('Некорректный health response')
          if payload.get('service') != 'hardened-api' or payload.get('version') != '1.0.0':
              raise SystemExit('Некорректная идентификация API')
          if payload.get('secret_loaded') is not True or not isinstance(payload.get('request_count'), int):
              raise SystemExit('API не загрузил секрет или не обновил счётчик')
          if secret in json.dumps(payload):
              raise SystemExit('API раскрыл значение секрета')
          print('Итоговый hardened-контейнер прошёл HTTP smoke-test')
          PY
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------IMPORT----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          WORKDIR=/home/ubuntu/docker-security
          SECRET="$WORKDIR/runtime/secret/db_password"
          docker rm -f security-api >/dev/null 2>&1 || true
          docker run -d --name security-api \
            --restart unless-stopped \
            -p 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /var/lib/hardened-api:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount type=bind,src="$SECRET",dst=/run/secrets/db_password,readonly \
            --env-file "$WORKDIR/app.env" \
            security-api:lab >/dev/null
          for _ in $(seq 1 15); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' security-api)" = healthy ] && exit 0
            sleep 1
          done
          echo "Контейнер не перешёл в healthy" >&2
          exit 1
          EOF
          trap 'rm -f solution.sh' EXIT



          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          WORKDIR=/home/ubuntu/docker-security
          SECRET="$WORKDIR/runtime/secret/db_password"
          docker rm -f security-api >/dev/null 2>&1 || true
          docker run -d --name security-api \
            --restart unless-stopped \
            -p 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /var/lib/hardened-api:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount type=bind,src="$SECRET",dst=/run/secrets/db_password,readonly \
            --env-file "$WORKDIR/app.env" \
            security-api:lab >/dev/null
          for _ in $(seq 1 15); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' security-api)" = healthy ] && exit 0
            sleep 1
          done
          echo "Контейнер не перешёл в healthy" >&2
          exit 1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Hardening полезен только пока сервис остаётся работоспособным.
          Ограничения следует вводить по одному, проверять наблюдаемое состояние
          контейнера и выполнять smoke-test после каждого изменения. Если
          приложению действительно нужна привилегия или writable-путь, исключение
          должно быть узким и обоснованным.

          Seccomp ограничивает доступные системные вызовы. Для типового API
          достаточно стандартного профиля Docker; запуск без профиля снимает
          важный слой защиты. Итоговая проверка объединяет identity, filesystem,
          capabilities, privilege escalation, secret/config separation, image
          metadata и HTTP-поведение.
    description: |-
      #### Упражнение 1 (Hardened-сервис)

      Приведите контейнер `security-api` к итоговому состоянию всех предыдущих
      шагов. Он должен иметь healthcheck со статусом `healthy`, политику
      автоматического перезапуска `unless-stopped` и работать со стандартным
      seccomp-профилем Docker.

      Выполните smoke-test health endpoint и `/api/security`. Итоговый ответ
      API должен содержать имя сервиса, версию `1.0.0`, числовой счётчик и
      признак успешной загрузки секрета, но не значение секрета.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 5
- title: Volumes, bind mounts и stateful-контейнеры
  description: |-
    Лабораторная показывает границу между эфемерным writable layer и
    persistent storage Docker. Вы последовательно подключите named volume к
    файловому datastore, отделите stateless API от данных, выполните seed,
    создадите проверяемый backup, восстановите его в новый volume и
    безопасно очистите только лабораторные ресурсы.
  time-limit-minutes: 120
  steps:
  - title: Ephemeral writable layer
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/storage /home/ubuntu/storage/evidence
          /usr/bin/docker image inspect alpine:3.20 >/dev/null 2>&1 || /usr/bin/docker pull alpine:3.20
          /usr/bin/docker rm -f storage-ephemeral >/dev/null 2>&1 || /usr/bin/true
          /usr/bin/rm -f /home/ubuntu/storage/evidence/ephemeral-before.json /home/ubuntu/storage/evidence/ephemeral-after.json
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/python3 - <<'PYJSON'
          import json
          from pathlib import Path
          before = json.loads(Path('/home/ubuntu/storage/evidence/ephemeral-before.json').read_text())
          after = json.loads(Path('/home/ubuntu/storage/evidence/ephemeral-after.json').read_text())
          assert before.get('marker_present') is True, 'evidence до не подтверждает наличие marker'
          assert before.get('marker') == 'writable-layer-data', 'неверное значение marker'
          assert after.get('marker_present') is False, 'evidence после не подтверждает потерю marker'
          assert before.get('container_id') and after.get('container_id'), 'не записаны container_id'
          assert before['container_id'] != after['container_id'], 'контейнер не был пересоздан'
          PYJSON
          current_id=$(/usr/bin/docker inspect --format '{{.Id}}' storage-ephemeral)
          after_id=$(/usr/bin/python3 -c 'import json; print(json.load(open("/home/ubuntu/storage/evidence/ephemeral-after.json"))["container_id"])')
          [ "$current_id" = "$after_id" ] || { /usr/bin/echo 'Запущен не тот контейнер, который указан в evidence после'; exit 1; }
          if /usr/bin/docker exec storage-ephemeral /usr/bin/test -e /tmp/ephemeral-marker; then
            /usr/bin/echo 'Marker сохранился в новом writable layer'
            exit 1
          fi
          [ "$(/usr/bin/docker inspect --format '{{range .Mounts}}{{.Destination}}{{end}}' storage-ephemeral)" = '' ] || { /usr/bin/echo 'У ephemeral-контейнера не должно быть mounts'; exit 1; }
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/storage/evidence
          /usr/bin/docker rm -f storage-ephemeral >/dev/null 2>&1 || /usr/bin/true
          /usr/bin/docker run -d --name storage-ephemeral alpine:3.20 /bin/sh -c 'printf "%s\n" "writable-layer-data" > /tmp/ephemeral-marker; while :; do sleep 3600; done' >/dev/null
          before_id=$(/usr/bin/docker inspect --format '{{.Id}}' storage-ephemeral)
          /usr/bin/printf '{"container_id":"%s","marker":"writable-layer-data","marker_present":true}
          ' "$before_id" > /home/ubuntu/storage/evidence/ephemeral-before.json
          /usr/bin/docker rm -f storage-ephemeral >/dev/null
          /usr/bin/docker run -d --name storage-ephemeral alpine:3.20 /bin/sh -c 'while :; do sleep 3600; done' >/dev/null
          after_id=$(/usr/bin/docker inspect --format '{{.Id}}' storage-ephemeral)
          /usr/bin/printf '{"container_id":"%s","marker_present":false}
          ' "$after_id" > /home/ubuntu/storage/evidence/ephemeral-after.json
          /usr/bin/chown ubuntu:ubuntu /home/ubuntu/storage/evidence/ephemeral-before.json /home/ubuntu/storage/evidence/ephemeral-after.json
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.sh	---
          cat <<'EOF' > post-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/true
          EOF
          trap 'rm -f post-step.sh' EXIT


          # ----------RUN----------
          chmod u+x post-step.sh
          ./post-step.sh
        hints: |-
          ## 1. Ephemeral writable layer

          Образ контейнера неизменяем, а все изменения во время работы попадают в
          отдельный writable layer. Этот слой принадлежит конкретному контейнеру:
          остановка его не удаляет, но удаление контейнера уничтожает слой вместе
          с записанными туда данными. Новый контейнер из того же образа получает
          новый пустой writable layer.

          Структурированное evidence позволяет отличить проверяемое наблюдение от
          текстового отчёта: в нём фиксируются идентификаторы контейнеров и
          наличие контрольного файла до и после пересоздания.
    description: |-
      #### Упражнение 1 (Потеря данных writable layer)

      В каталоге `/home/ubuntu/storage/evidence` создайте JSON-файлы
      `ephemeral-before.json` и `ephemeral-after.json`.

      1.  Запустите контейнер `storage-ephemeral` из образа `alpine:3.20` без
          mounts и создайте внутри `/tmp/ephemeral-marker` со значением
          `writable-layer-data`.
      2.  В evidence «до» зафиксируйте идентификатор контейнера, значение
          marker и признак его наличия.
      3.  Удалите контейнер и создайте новый контейнер с тем же именем и
          образом, также без mounts.
      4.  В evidence «после» зафиксируйте новый идентификатор и отсутствие
          marker.

      Оба evidence-файла должны быть валидными JSON-документами. Новый
      контейнер оставьте запущенным для проверки.
  - title: Named volume
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/storage
          /usr/bin/docker image inspect alpine:3.20 >/dev/null 2>&1 || /usr/bin/docker pull alpine:3.20
          /usr/bin/docker rm -f storage-db >/dev/null 2>&1 || /usr/bin/true
          /usr/bin/docker volume rm lab-data >/dev/null 2>&1 || /usr/bin/true
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          mountpoint=$(/usr/bin/docker volume inspect --format '{{.Mountpoint}}' lab-data)
          [ -n "$mountpoint" ] && [ -d "$mountpoint" ] || { /usr/bin/echo 'Volume lab-data не имеет доступного mountpoint'; exit 1; }
          [ "$(/usr/bin/docker volume inspect --format '{{index .Labels "course.lab"}}' lab-data)" = storage ] || { /usr/bin/echo 'У volume отсутствует label course.lab=storage'; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{.State.Running}}' storage-db)" = true ] || { /usr/bin/echo 'storage-db не запущен'; exit 1; }
          /usr/bin/python3 - <<'PYDOCKER'
          import json, subprocess
          info = json.loads(subprocess.check_output(['/usr/bin/docker', 'inspect', 'storage-db']))[0]
          mounts = [m for m in info['Mounts'] if m['Destination'] == '/data']
          assert len(mounts) == 1, 'нет единственного mount в /data'
          mount = mounts[0]
          assert mount['Type'] == 'volume', 'в /data подключён не volume'
          assert mount['Name'] == 'lab-data', 'подключён неверный volume'
          assert mount['RW'] is True, 'volume должен быть writable'
          PYDOCKER
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/docker rm -f storage-db >/dev/null 2>&1 || /usr/bin/true
          /usr/bin/docker volume rm lab-data >/dev/null 2>&1 || /usr/bin/true
          /usr/bin/docker volume create --label course.lab=storage lab-data >/dev/null
          /usr/bin/docker run -d --name storage-db --mount type=volume,src=lab-data,dst=/data alpine:3.20 /bin/sh -c 'while :; do sleep 3600; done' >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.sh	---
          cat <<'EOF' > post-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/true
          EOF
          trap 'rm -f post-step.sh' EXIT


          # ----------RUN----------
          chmod u+x post-step.sh
          ./post-step.sh
        hints: |-
          ## 2. Named volume

          Named volume — объект Docker, жизненный цикл которого отделён от
          контейнера. Docker хранит его в управляемом каталоге host-системы и
          подключает в mount namespace контейнера. Имя удобно для повторного
          подключения, а label — для безопасной автоматизации и выборочной
          очистки.

          У volume есть реальный `Mountpoint` на host, однако приложения должны
          обращаться к данным через путь назначения внутри контейнера, а не
          зависеть от внутреннего пути Docker.
    description: |-
      #### Упражнение 1 (Docker-managed хранилище)

      Создайте volume `lab-data` с label `course.lab=storage`. Запустите
      stateful-контейнер `storage-db` из `alpine:3.20`, подключив volume в
      `/data` с правом записи. Контейнер должен оставаться в состоянии
      running.

      Проверьте средствами Docker, что volume имеет непустой host mountpoint,
      а у контейнера mount имеет тип `volume`, источник `lab-data` и
      назначение `/data`.
  - title: Сохранение данных
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/storage
          /usr/bin/docker image inspect alpine:3.20 >/dev/null 2>&1 || /usr/bin/docker pull alpine:3.20
          /usr/bin/docker volume inspect lab-data >/dev/null
          /usr/bin/docker inspect storage-db >/dev/null
          /usr/bin/docker rm -f storage-db-v2 >/dev/null 2>&1 || /usr/bin/true
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          ! /usr/bin/docker inspect storage-db >/dev/null 2>&1 || { /usr/bin/echo 'Старый storage-db не удалён'; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{.State.Running}}' storage-db-v2)" = true ] || { /usr/bin/echo 'storage-db-v2 не запущен'; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}' storage-db-v2)" = lab-data ] || { /usr/bin/echo 'storage-db-v2 не использует lab-data в /data'; exit 1; }
          /usr/bin/docker exec storage-db-v2 /bin/cat /data/records.json | /usr/bin/python3 -c 'import json,sys; data=json.load(sys.stdin); assert {"id":"persistent-1","value":"survived-recreate"} in data'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/docker exec storage-db /bin/sh -c 'printf "%s\n" "[{\"id\":\"persistent-1\",\"value\":\"survived-recreate\"}]" > /data/records.json'
          /usr/bin/docker rm -f storage-db >/dev/null
          /usr/bin/docker rm -f storage-db-v2 >/dev/null 2>&1 || /usr/bin/true
          /usr/bin/docker run -d --name storage-db-v2 --mount type=volume,src=lab-data,dst=/data alpine:3.20 /bin/sh -c 'while :; do sleep 3600; done' >/dev/null
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.sh	---
          cat <<'EOF' > post-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/true
          EOF
          trap 'rm -f post-step.sh' EXIT


          # ----------RUN----------
          chmod u+x post-step.sh
          ./post-step.sh
        hints: |-
          ## 3. Сохранение данных

          Удаление контейнера не удаляет подключённый named volume, если это не
          было запрошено отдельно. Поэтому stateful-компонент можно пересоздать,
          сохранив dataset. Проверка persistence должна читать данные через новый
          контейнер, а не только подтверждать существование volume.
    description: |-
      #### Упражнение 1 (Данные после пересоздания)

      В контейнере `storage-db` сохраните в `/data/records.json` валидный
      JSON-массив с записью, у которой `id` равен `persistent-1`, а `value`
      равен `survived-recreate`.

      Удалите `storage-db`. Создайте и оставьте запущенным новый контейнер
      `storage-db-v2`, подключив тот же `lab-data` в `/data`. Данные должны
      читаться из `/data/records.json` через новый контейнер без повторной
      записи файла.
  - title: Bind mount для конфигурации
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/storage /home/ubuntu/storage/config /home/ubuntu/storage/assets
          /usr/bin/docker image inspect python:3.12-alpine >/dev/null 2>&1 || /usr/bin/docker pull python:3.12-alpine
          /usr/bin/docker volume inspect lab-data >/dev/null
          /usr/bin/docker rm -f storage-api >/dev/null 2>&1 || /usr/bin/true
          /usr/bin/rm -f /home/ubuntu/storage/config/api.json
          /usr/bin/cat > /home/ubuntu/storage/assets/api.py <<'PYAPI'
          import json
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          CONFIG_PATH = "/app/config.json"


          def payload():
              with open(CONFIG_PATH, encoding="utf-8") as config_file:
                  config = json.load(config_file)
              with open(config["dataset"], encoding="utf-8") as dataset_file:
                  records = json.load(dataset_file)
              return {"service": config["service_name"], "records": records}


          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/health":
                      try:
                          payload()
                          body, status = {"status": "ok"}, 200
                      except Exception as error:
                          body, status = {"status": "error", "detail": str(error)}, 503
                  elif self.path == "/records":
                      try:
                          body, status = payload(), 200
                      except Exception as error:
                          body, status = {"error": str(error)}, 500
                  else:
                      body, status = {"error": "not found"}, 404
                  encoded = json.dumps(body, ensure_ascii=False).encode()
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(encoded)))
                  self.end_headers()
                  self.wfile.write(encoded)

              def log_message(self, format, *args):
                  return


          ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PYAPI
          /usr/bin/chown ubuntu:ubuntu /home/ubuntu/storage/assets/api.py
          /usr/bin/chmod 0444 /home/ubuntu/storage/assets/api.py
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/python3 -c 'import json; c=json.load(open("/home/ubuntu/storage/config/api.json")); assert c == {"service_name":"storage-api","dataset":"/data/records.json"}'
          [ "$(/usr/bin/docker inspect --format '{{.State.Health.Status}}' storage-api)" = healthy ] || { /usr/bin/echo 'storage-api не healthy'; exit 1; }
          /usr/bin/python3 - <<'PYDOCKER'
          import json, subprocess
          info = json.loads(subprocess.check_output(['/usr/bin/docker', 'inspect', 'storage-api']))[0]
          mounts = {m['Destination']: m for m in info['Mounts']}
          assert mounts['/data']['Type'] == 'volume' and mounts['/data']['Name'] == 'lab-data' and not mounts['/data']['RW'], 'lab-data должен быть read-only volume'
          for destination, source in [('/app/config.json', '/home/ubuntu/storage/config/api.json'), ('/app/api.py', '/home/ubuntu/storage/assets/api.py')]:
              mount = mounts[destination]
              assert mount['Type'] == 'bind' and mount['Source'] == source and not mount['RW'], f'{destination} должен быть read-only bind mount'
          bindings = info['HostConfig']['PortBindings']['8080/tcp']
          assert bindings == [{'HostIp': '127.0.0.1', 'HostPort': '8080'}], 'порт должен быть опубликован как 127.0.0.1:8080'
          PYDOCKER
          /usr/bin/curl --fail --silent http://127.0.0.1:8080/records | /usr/bin/python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["service"] == "storage-api"; assert any(r.get("id") == "persistent-1" for r in p["records"])'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/printf '%s\n' '{"service_name":"storage-api","dataset":"/data/records.json"}' > /home/ubuntu/storage/config/api.json
          /usr/bin/chown ubuntu:ubuntu /home/ubuntu/storage/config/api.json
          /usr/bin/docker rm -f storage-api >/dev/null 2>&1 || /usr/bin/true
          /usr/bin/docker run -d --name storage-api --label course.lab=storage --publish 127.0.0.1:8080:8080 --mount type=volume,src=lab-data,dst=/data,readonly --mount type=bind,src=/home/ubuntu/storage/config/api.json,dst=/app/config.json,readonly --mount type=bind,src=/home/ubuntu/storage/assets/api.py,dst=/app/api.py,readonly --health-cmd '/usr/local/bin/python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/health\", timeout=2).read()"' --health-interval 2s --health-timeout 3s --health-retries 15 python:3.12-alpine /usr/local/bin/python /app/api.py >/dev/null
          for attempt in $(/usr/bin/seq 1 30); do
            [ "$(/usr/bin/docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' storage-api)" = healthy ] && exit 0
            /usr/bin/sleep 1
          done
          /usr/bin/docker logs storage-api
          exit 1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.sh	---
          cat <<'EOF' > post-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/true
          EOF
          trap 'rm -f post-step.sh' EXIT


          # ----------RUN----------
          chmod u+x post-step.sh
          ./post-step.sh
        hints: |-
          ## 4. Bind mount для конфигурации

          Bind mount связывает точно заданный host path с путём контейнера. В
          отличие от named volume, Docker не управляет содержимым и переносимостью
          этого пути. Ошибка в host path, правах или SELinux/AppArmor-политике
          способна нарушить запуск workload.

          Конфигурацию, которую контейнер не должен менять, подключают read-only.
          В этой лабораторной API является stateless-компонентом: код и
          конфигурация приходят извне, а dataset читается из stateful volume.
    description: |-
      #### Упражнение 1 (Read-only конфигурация API)

      В уже подготовленном каталоге `/home/ubuntu/storage/config` создайте
      `api.json` — JSON-объект с полями `service_name` со значением
      `storage-api` и `dataset` со значением `/data/records.json`.

      Запустите контейнер `storage-api` из `python:3.12-alpine` со следующими
      свойствами:

      - host port `8080` опубликован на container port `8080` только для
        loopback-интерфейса;
      - `lab-data` подключён read-only в `/data`;
      - host-файл `api.json` подключён read-only в `/app/config.json`;
      - подготовленный `/home/ubuntu/storage/assets/api.py` подключён
        read-only в `/app/api.py` и используется как приложение;
      - healthcheck обращается к `/health`, а контейнер получает label
        `course.lab=storage`.

      После запуска API должен перейти в состояние healthy, а `/records` —
      возвращать имя сервиса из bind-mounted конфигурации и записи из volume.
  - title: Инициализация dataset
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/docker volume inspect lab-data >/dev/null
          /usr/bin/docker inspect storage-api >/dev/null
          /usr/bin/docker rm -f storage-init >/dev/null 2>&1 || /usr/bin/true
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          [ "$(/usr/bin/docker inspect --format '{{.State.Status}}' storage-init)" = exited ] || { /usr/bin/echo 'storage-init не завершён'; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{.State.ExitCode}}' storage-init)" = 0 ] || { /usr/bin/echo 'storage-init завершился с ошибкой'; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{index .Config.Labels "course.role"}}' storage-init)" = init ] || { /usr/bin/echo 'Нет label course.role=init'; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}' storage-init)" = lab-data ] || { /usr/bin/echo 'Init-контейнер не использовал lab-data'; exit 1; }
          /usr/bin/curl --fail --silent http://127.0.0.1:8080/records | /usr/bin/python3 -c 'import json,sys; p=json.load(sys.stdin); expected=[{"id":"seed-1","value":"alpha"},{"id":"seed-2","value":"beta"},{"id":"seed-3","value":"gamma"}]; assert p["records"] == expected'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/docker rm -f storage-init >/dev/null 2>&1 || /usr/bin/true
          /usr/bin/docker run --name storage-init --label course.role=init --mount type=volume,src=lab-data,dst=/data alpine:3.20 /bin/sh -c 'printf "%s\n" "[{\"id\":\"seed-1\",\"value\":\"alpha\"},{\"id\":\"seed-2\",\"value\":\"beta\"},{\"id\":\"seed-3\",\"value\":\"gamma\"}]" > /data/records.json'
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.sh	---
          cat <<'EOF' > post-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/true
          EOF
          trap 'rm -f post-step.sh' EXIT


          # ----------RUN----------
          chmod u+x post-step.sh
          ./post-step.sh
        hints: |-
          ## 5. Инициализация dataset

          Init-контейнер выполняет ограниченную операцию над общим persistent
          storage и завершается. Он не становится частью постоянно работающего
          сервиса. Такой подход разделяет подготовку схемы или seed-data и
          обслуживание API, а также оставляет проверяемый результат выполнения
          отдельной task.
    description: |-
      #### Упражнение 1 (Отдельный init-контейнер)

      Создайте контейнер `storage-init` из `alpine:3.20` с label
      `course.role=init` и подключите `lab-data` в `/data`. Он должен заменить
      dataset валидным JSON-массивом из трёх объектов:

      - `seed-1` со значением `alpha`;
      - `seed-2` со значением `beta`;
      - `seed-3` со значением `gamma`.

      Init-контейнер должен успешно завершиться с exit code `0`. Не
      перезапускайте `storage-api`: работающий API должен сразу отдавать все
      три записи из volume.
  - title: Volume backup
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/storage/backups
          /usr/bin/docker volume inspect lab-data >/dev/null
          /usr/bin/docker rm -f storage-backup >/dev/null 2>&1 || /usr/bin/true
          /usr/bin/rm -f /home/ubuntu/storage/backups/lab-data.tar.gz /home/ubuntu/storage/backups/lab-data.tar.gz.sha256
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          [ "$(/usr/bin/docker inspect --format '{{.State.Status}}' storage-backup)" = exited ] || { /usr/bin/echo 'storage-backup не завершён'; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{.State.ExitCode}}' storage-backup)" = 0 ] || { /usr/bin/echo 'storage-backup завершился с ошибкой'; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{index .Config.Labels "course.role"}}' storage-backup)" = backup ] || { /usr/bin/echo 'Нет label course.role=backup'; exit 1; }
          /usr/bin/test -s /home/ubuntu/storage/backups/lab-data.tar.gz
          /usr/bin/test -s /home/ubuntu/storage/backups/lab-data.tar.gz.sha256
          /usr/bin/sha256sum --check /home/ubuntu/storage/backups/lab-data.tar.gz.sha256
          /usr/bin/tar -tzf /home/ubuntu/storage/backups/lab-data.tar.gz | /usr/bin/grep -Eq '(^|/)records.json$' || { /usr/bin/echo 'В архиве нет records.json'; exit 1; }
          /usr/bin/tar -xOzf /home/ubuntu/storage/backups/lab-data.tar.gz records.json | /usr/bin/python3 -c 'import json,sys; data=json.load(sys.stdin); assert len(data) == 3 and {r["id"] for r in data} == {"seed-1","seed-2","seed-3"}'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/docker rm -f storage-backup >/dev/null 2>&1 || /usr/bin/true
          /usr/bin/docker run --name storage-backup --label course.role=backup --mount type=volume,src=lab-data,dst=/data,readonly --mount type=bind,src=/home/ubuntu/storage/backups,dst=/backup alpine:3.20 /bin/sh -c '/bin/tar -czf /backup/lab-data.tar.gz -C /data records.json'
          /usr/bin/sha256sum /home/ubuntu/storage/backups/lab-data.tar.gz > /home/ubuntu/storage/backups/lab-data.tar.gz.sha256
          /usr/bin/chown ubuntu:ubuntu /home/ubuntu/storage/backups/lab-data.tar.gz /home/ubuntu/storage/backups/lab-data.tar.gz.sha256
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.sh	---
          cat <<'EOF' > post-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/true
          EOF
          trap 'rm -f post-step.sh' EXIT


          # ----------RUN----------
          chmod u+x post-step.sh
          ./post-step.sh
        hints: |-
          ## 6. Volume backup

          Running volume — не резервная копия: сбой или ошибочное изменение
          затронет единственный экземпляр данных. Backup должен быть отдельным
          переносимым артефактом. Контрольная сумма фиксирует целостность архива и
          позволяет обнаружить повреждение до restore.

          Для согласованности сложных баз данных используют штатный экспорт или
          snapshot. Файловый JSON-datastore этой лабораторной можно архивировать
          отдельным одноразовым контейнером.
    description: |-
      #### Упражнение 1 (Архив и checksum)

      Создайте каталог `/home/ubuntu/storage/backups`. Одноразовым контейнером
      `storage-backup` из `alpine:3.20` подключите `lab-data` read-only и
      каталог backups с правом записи. Создайте отдельный непустой архив
      `lab-data.tar.gz`, содержащий `records.json`.

      Для архива создайте
      `/home/ubuntu/storage/backups/lab-data.tar.gz.sha256` в формате,
      совместимом с проверкой SHA-256. Backup-контейнер должен иметь label
      `course.role=backup` и успешно завершиться.
  - title: Volume restore
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/docker image inspect python:3.12-alpine >/dev/null 2>&1 || /usr/bin/docker pull python:3.12-alpine
          /usr/bin/test -f /home/ubuntu/storage/backups/lab-data.tar.gz
          /usr/bin/test -f /home/ubuntu/storage/backups/lab-data.tar.gz.sha256
          /usr/bin/docker rm -f storage-restore storage-api-restore >/dev/null 2>&1 || /usr/bin/true
          /usr/bin/docker volume rm lab-data-restore >/dev/null 2>&1 || /usr/bin/true
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/sha256sum --check /home/ubuntu/storage/backups/lab-data.tar.gz.sha256
          [ "$(/usr/bin/docker volume inspect --format '{{index .Labels "course.lab"}}' lab-data-restore)" = storage ] || { /usr/bin/echo 'Нет volume lab-data-restore с нужным label'; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{.State.ExitCode}}' storage-restore)" = 0 ] || { /usr/bin/echo 'storage-restore завершился с ошибкой'; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{index .Config.Labels "course.role"}}' storage-restore)" = restore ] || { /usr/bin/echo 'Нет label course.role=restore'; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{.State.Health.Status}}' storage-api-restore)" = healthy ] || { /usr/bin/echo 'storage-api-restore не healthy'; exit 1; }
          [ "$(/usr/bin/docker inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}:{{.RW}}{{end}}{{end}}' storage-api-restore)" = lab-data-restore:false ] || { /usr/bin/echo 'Restore API не использует lab-data-restore read-only'; exit 1; }
          /usr/bin/python3 - <<'PYDOCKER'
          import json, subprocess
          info = json.loads(subprocess.check_output(['/usr/bin/docker', 'inspect', 'storage-api-restore']))[0]
          assert info['HostConfig']['PortBindings']['8080/tcp'] == [{'HostIp': '127.0.0.1', 'HostPort': '8081'}]
          PYDOCKER
          /usr/bin/curl --fail --silent http://127.0.0.1:8081/records | /usr/bin/python3 -c 'import json,sys; p=json.load(sys.stdin); assert [r["id"] for r in p["records"]] == ["seed-1","seed-2","seed-3"]'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/sha256sum --check /home/ubuntu/storage/backups/lab-data.tar.gz.sha256
          /usr/bin/docker rm -f storage-restore storage-api-restore >/dev/null 2>&1 || /usr/bin/true
          /usr/bin/docker volume rm lab-data-restore >/dev/null 2>&1 || /usr/bin/true
          /usr/bin/docker volume create --label course.lab=storage lab-data-restore >/dev/null
          /usr/bin/docker run --name storage-restore --label course.role=restore --mount type=volume,src=lab-data-restore,dst=/data --mount type=bind,src=/home/ubuntu/storage/backups,dst=/backup,readonly alpine:3.20 /bin/sh -c '/bin/tar -xzf /backup/lab-data.tar.gz -C /data'
          /usr/bin/docker run -d --name storage-api-restore --label course.lab=storage --publish 127.0.0.1:8081:8080 --mount type=volume,src=lab-data-restore,dst=/data,readonly --mount type=bind,src=/home/ubuntu/storage/config/api.json,dst=/app/config.json,readonly --mount type=bind,src=/home/ubuntu/storage/assets/api.py,dst=/app/api.py,readonly --health-cmd '/usr/local/bin/python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/health\", timeout=2).read()"' --health-interval 2s --health-timeout 3s --health-retries 15 python:3.12-alpine /usr/local/bin/python /app/api.py >/dev/null
          for attempt in $(/usr/bin/seq 1 30); do
            [ "$(/usr/bin/docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' storage-api-restore)" = healthy ] && exit 0
            /usr/bin/sleep 1
          done
          /usr/bin/docker logs storage-api-restore
          exit 1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.sh	---
          cat <<'EOF' > post-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/true
          EOF
          trap 'rm -f post-step.sh' EXIT


          # ----------RUN----------
          chmod u+x post-step.sh
          ./post-step.sh
        hints: |-
          ## 7. Volume restore

          Наличие backup ещё не доказывает возможность восстановления. Restore
          drill проверяет архив, процедуру распаковки, структуру данных и запуск
          workload на новом storage. Восстановление в отдельный volume исключает
          случайное использование исходных данных и позволяет сравнить результаты.
    description: |-
      #### Упражнение 1 (Восстановление в новый volume)

      Сначала проверьте checksum backup. Создайте volume `lab-data-restore` с
      label `course.lab=storage` и восстановите в него архив с помощью успешно
      завершившегося контейнера `storage-restore` с label
      `course.role=restore`.

      Запустите `storage-api-restore` с восстановленным volume и той же
      read-only конфигурацией. Опубликуйте API только на `127.0.0.1:8081`,
      добавьте healthcheck и label `course.lab=storage`. Сервис должен стать
      healthy, а `/records` — вернуть три seed-записи из нового volume.
  - title: Очистка volumes
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/storage/backups
          if ! /usr/bin/docker volume inspect storage-keep >/dev/null 2>&1; then
            /usr/bin/docker volume create --label course.keep=true storage-keep >/dev/null
          fi
          /usr/bin/docker run --rm --mount type=volume,src=storage-keep,dst=/keep alpine:3.20 /bin/sh -c '/usr/bin/printf "%s\n" "do-not-delete" > /keep/protected.txt'
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          if /usr/bin/docker volume ls --format '{{.Name}}' | /usr/bin/grep -Eq '^lab-data'; then
            /usr/bin/echo 'Остались volumes с префиксом lab-data'
            exit 1
          fi
          /usr/bin/docker volume inspect storage-keep >/dev/null
          [ "$(/usr/bin/docker volume inspect --format '{{index .Labels "course.keep"}}' storage-keep)" = true ] || { /usr/bin/echo 'Повреждён контрольный volume'; exit 1; }
          marker=$(/usr/bin/docker run --rm --mount type=volume,src=storage-keep,dst=/keep,readonly alpine:3.20 /bin/cat /keep/protected.txt)
          [ "$marker" = do-not-delete ] || { /usr/bin/echo 'Контрольные данные удалены'; exit 1; }
          /usr/bin/test -s /home/ubuntu/storage/backups/lab-data.tar.gz
          /usr/bin/test -s /home/ubuntu/storage/backups/lab-data.tar.gz.sha256
          for container in storage-db storage-db-v2 storage-api storage-init storage-backup storage-restore storage-api-restore; do
            if /usr/bin/docker inspect "$container" >/dev/null 2>&1; then
              /usr/bin/echo "Остался лабораторный контейнер $container"
              exit 1
            fi
          done
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          for container in storage-db storage-db-v2 storage-api storage-init storage-backup storage-restore storage-api-restore; do
            /usr/bin/docker rm -f "$container" >/dev/null 2>&1 || /usr/bin/true
          done
          for volume in $(/usr/bin/docker volume ls --format '{{.Name}}' --filter name='^lab-data'); do
            case "$volume" in
              lab-data*) /usr/bin/docker volume rm "$volume" >/dev/null ;;
            esac
          done
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.sh	---
          cat <<'EOF' > post-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/true
          EOF
          trap 'rm -f post-step.sh' EXIT


          # ----------RUN----------
          chmod u+x post-step.sh
          ./post-step.sh
        hints: |-
          ## 8. Очистка volumes

          Глобальный `volume prune` может удалить чужие неиспользуемые данные.
          Безопасная очистка начинается с точного отбора по имени или label,
          проверки зависимых контейнеров и удаления только объектов текущей
          лабораторной.

          Контрольный volume, не относящийся к лаборатории, моделирует данные
          другого workload. Его сохранность — часть критерия корректности очистки.
    description: |-
      #### Упражнение 1 (Выборочное удаление)

      Удалите контейнеры лабораторной, которые используют `lab-data` и
      `lab-data-restore`, затем удалите только volumes, имена которых
      начинаются с `lab-data`.

      Не применяйте глобальную очистку всех volumes. Подготовленный
      контрольный volume `storage-keep` и файл `protected.txt` внутри него
      должны сохраниться. Backup-артефакты в `/home/ubuntu/storage/backups`
      также должны остаться для проверки.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 6
- title: Docker Compose для многоконтейнерного приложения
  description: |-
    Цель лабораторной работы — перевести ручной запуск связанных контейнеров
    в декларативную Compose-модель с сервисами, сетями, named volume,
    healthcheck и зависимостями. Итоговая полезная нагрузка состоит из HTTP
    proxy, API и Redis.
  time-limit-minutes: 180
  steps:
  - title: 01. Структура проекта
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.sh	---
          cat <<'EOF' > prepare.sh
          #!/usr/bin/env bash
          set -euo pipefail
          install -d -m 0755 /opt/compose-lab-starter/api /opt/compose-lab-starter/web
          cat > /opt/compose-lab-starter/api/app.py <<'PYAPP'
          import json
          import os
          import socket
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path

          DB_HOST = os.environ.get("DB_HOST", "db")
          DB_PORT = int(os.environ.get("DB_PORT", "6379"))
          VERSION = Path("/app/version.txt").read_text(encoding="utf-8").strip()

          def redis(*parts):
              payload = f"*{len(parts)}\r\n" + "".join(f"${len(str(p))}\r\n{p}\r\n" for p in parts)
              with socket.create_connection((DB_HOST, DB_PORT), timeout=2) as sock:
                  sock.sendall(payload.encode())
                  line = sock.makefile("rb").readline().decode().strip()
              if line.startswith(":"):
                  return int(line[1:])
              if line.startswith("+"):
                  return line[1:]
              raise RuntimeError(line)

          class Handler(BaseHTTPRequestHandler):
              def reply(self, status, data):
                  body = json.dumps(data).encode()
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  try:
                      if self.path == "/health":
                          self.reply(200, {"status": "ok", "db": redis("PING")})
                      elif self.path == "/version":
                          self.reply(200, {"version": VERSION})
                      elif self.path == "/data":
                          self.reply(200, {"visits": redis("INCR", "lab:visits"), "instance": socket.gethostname(), "version": VERSION})
                      else:
                          self.reply(404, {"error": "not found"})
                  except Exception as error:
                      self.reply(503, {"error": str(error)})

              def log_message(self, format, *args):
                  return

          ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PYAPP
          cat > /opt/compose-lab-starter/api/Dockerfile <<'DOCKERFILE'
          FROM python:3.13-alpine
          WORKDIR /app
          COPY app.py version.txt ./
          EXPOSE 8080
          CMD ["python", "app.py"]
          DOCKERFILE
          printf '1.0\n' > /opt/compose-lab-starter/api/version.txt
          cat > /opt/compose-lab-starter/web/default.conf.template <<'NGINX'
          server {
              listen 80;
              resolver 127.0.0.11 valid=2s ipv6=off;
              location / {
                  set $api http://api:8080;
                  proxy_pass $api;
                  proxy_set_header Host $host;
              }
          }
          NGINX
          chmod -R a+rX /opt/compose-lab-starter
          rm -rf /home/ubuntu/compose-lab
          EOF
          trap 'rm -f prepare.sh' EXIT


          # ----------RUN----------
          chmod u+x prepare.sh
          ./prepare.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          base=/home/ubuntu/compose-lab
          for path in "$base/compose.yaml" "$base/api/app.py" "$base/api/Dockerfile" "$base/api/version.txt" "$base/web/default.conf.template"; do
            test -f "$path" || { echo "Отсутствует $path"; exit 1; }
          done
          for path in "$base/api" "$base/web"; do test -d "$path" || exit 1; done
          test ! -s "$base/compose.yaml" || { echo "На первом шаге compose.yaml должен быть пустым"; exit 1; }
          if find "$base" -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name 'id_rsa*' \) -print -quit | grep -q .; then echo "В проекте найден потенциальный секрет"; exit 1; fi
          cmp -s "$base/api/app.py" /opt/compose-lab-starter/api/app.py
          cmp -s "$base/api/Dockerfile" /opt/compose-lab-starter/api/Dockerfile
          cmp -s "$base/web/default.conf.template" /opt/compose-lab-starter/web/default.conf.template
          echo "Структура проекта корректна"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/compose-lab/api /home/ubuntu/compose-lab/web
          install -o ubuntu -g ubuntu -m 0644 /opt/compose-lab-starter/api/app.py /home/ubuntu/compose-lab/api/app.py
          install -o ubuntu -g ubuntu -m 0644 /opt/compose-lab-starter/api/Dockerfile /home/ubuntu/compose-lab/api/Dockerfile
          install -o ubuntu -g ubuntu -m 0644 /opt/compose-lab-starter/api/version.txt /home/ubuntu/compose-lab/api/version.txt
          install -o ubuntu -g ubuntu -m 0644 /opt/compose-lab-starter/web/default.conf.template /home/ubuntu/compose-lab/web/default.conf.template
          install -o ubuntu -g ubuntu -m 0644 /dev/null /home/ubuntu/compose-lab/compose.yaml
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Compose project объединяет compose-файл и исходники сервисов в одном
          каталоге. Имя проекта становится общей областью имён для контейнеров,
          сетей и volumes. Предсказуемая структура упрощает сборку, проверку и
          очистку ресурсов. Секреты и локальные служебные файлы не должны случайно
          попадать в проект.
    description: |-
      #### Упражнение 1 (Задание)

      В каталоге `/home/ubuntu/compose-lab` соберите каркас проекта из
      компонентов стартового набора `/opt/compose-lab-starter`. Ожидаются
      каталоги `api` и `web`, исходник API, Dockerfile API, шаблон
      конфигурации proxy и файл версии API. Создайте пустой `compose.yaml`:
      описание сервисов появится на следующем шаге. Не добавляйте файлы с
      паролями, приватными ключами или локальными переменными окружения.

      После выполнения запустите проверку шага.
  - title: 02. Сервисы
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cd /home/ubuntu/compose-lab
          docker compose config --quiet
          mapfile -t services < <(docker compose config --services | sort)
          test "${services[*]}" = "api db web" || { echo "Ожидаются services: api db web"; exit 1; }
          test "$(docker compose config --format json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["name"])')" = compose-lab
          python3 - <<'PY'
          import json, subprocess
          c=json.loads(subprocess.check_output(["docker","compose","config","--format","json"], text=True))
          assert c["services"]["api"].get("build")
          assert c["services"]["db"]["image"].startswith("redis:")
          assert c["services"]["web"]["image"].startswith("nginx:")
          ports=c["services"]["web"].get("ports", [])
          assert any(str(p.get("published")) == "8080" and str(p.get("target")) == "80" for p in ports)
          assert not c["services"]["api"].get("ports") and not c["services"]["db"].get("ports")
          PY
          docker compose up -d --build
          for service in api db web; do test -n "$(docker compose ps -q "$service")" || exit 1; done
          echo "Три сервиса описаны и запущены"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cat > /home/ubuntu/compose-lab/compose.yaml <<'COMPOSE'
          name: compose-lab

          services:
            db:
              image: redis:7-alpine

            api:
              build: ./api
              expose:
                - "8080"

            web:
              image: nginx:1.27-alpine
              ports:
                - "8080:80"
              volumes:
                - ./web/default.conf.template:/etc/nginx/templates/default.conf.template:ro
          COMPOSE
          chown ubuntu:ubuntu /home/ubuntu/compose-lab/compose.yaml
          cd /home/ubuntu/compose-lab
          docker compose -p compose-lab up -d --build
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Раздел `services` описывает желаемые контейнеры приложения: образ или
          сборку, параметры запуска и базовые связи с файлами. Compose преобразует
          декларацию в контейнеры с project- и service-labels. В этой работе `web`
          принимает HTTP-запросы, `api` выполняет прикладную логику, а `db` хранит
          счётчики.
    description: |-
      #### Упражнение 1 (Задание)

      Опишите в `compose.yaml` проект `compose-lab` и три сервиса с точными
      именами `web`, `api`, `db`. Используйте стартовые исходники: API должен
      собираться из каталога `api`, proxy — использовать Nginx и
      подготовленный шаблон, база — Redis. Опубликуйте только `web` на порту
      host `8080`; API должен слушать внутри Compose-среды на порту `8080`.
      Добейтесь успешного рендеринга конфигурации и запуска трёх сервисов.

      После выполнения запустите проверку шага.
  - title: 03. Networks
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cd /home/ubuntu/compose-lab
          docker compose config --quiet
          docker compose up -d --build
          python3 - <<'PY'
          import json, subprocess
          cfg=json.loads(subprocess.check_output(["docker","compose","config","--format","json"], text=True))
          assert set(cfg["networks"]) == {"frontend", "backend"}
          assert cfg["networks"]["backend"].get("internal") is True
          expected={"web":{"frontend"},"api":{"frontend","backend"},"db":{"backend"}}
          for service, nets in expected.items():
              assert set(cfg["services"][service]["networks"]) == nets
              cid=subprocess.check_output(["docker","compose","ps","-q",service], text=True).strip()
              actual=set(json.loads(subprocess.check_output(["docker","inspect",cid], text=True))[0]["NetworkSettings"]["Networks"])
              assert actual == {f"compose-lab_{n}" for n in nets}, (service, actual)
          PY
          echo "Сетевое разделение корректно"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cat > /home/ubuntu/compose-lab/compose.yaml <<'COMPOSE'
          name: compose-lab

          services:
            db:
              image: redis:7-alpine
              networks:
                - backend

            api:
              build: ./api
              networks:
                - frontend
                - backend
              expose:
                - "8080"

            web:
              image: nginx:1.27-alpine
              ports:
                - "8080:80"
              volumes:
                - ./web/default.conf.template:/etc/nginx/templates/default.conf.template:ro
              networks:
                - frontend

          networks:
            frontend:
            backend:
              internal: true
          COMPOSE
          chown ubuntu:ubuntu /home/ubuntu/compose-lab/compose.yaml
          cd /home/ubuntu/compose-lab
          docker compose -p compose-lab up -d --build
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Сети Compose задают границы связности. Публичный proxy и API разделяют
          сеть `frontend`, а API и база — сеть `backend`. Поэтому proxy не
          получает прямой маршрут к базе. Флаг internal у backend дополнительно
          подчёркивает назначение внутреннего сегмента.
    description: |-
      #### Упражнение 1 (Задание)

      Объявите сети `frontend` и `backend`. Подключите `web` только к
      `frontend`, `db` только к `backend`, а `api` к обеим сетям. Сделайте
      `backend` внутренней сетью. Пересоздайте проект так, чтобы фактические
      подключения контейнеров соответствовали декларации.

      После выполнения запустите проверку шага.
  - title: 04. Volumes
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cd /home/ubuntu/compose-lab
          docker compose up -d --build
          volume_id=$(docker volume ls -q --filter label=com.docker.compose.project=compose-lab --filter label=com.docker.compose.volume=db-data)
          test -n "$volume_id" || { echo "Named volume db-data не найден"; exit 1; }
          cid=$(docker compose ps -q db)
          mount=$(docker inspect "$cid" --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}} {{.Type}}{{end}}{{end}}')
          test "$mount" = "$volume_id volume" || { echo "Volume не смонтирован в /data"; exit 1; }
          until docker compose exec -T db redis-cli ping | grep -qx PONG; do sleep 1; done
          before=$(docker compose exec -T db redis-cli INCR lab:persistence-check | tr -d '\r')
          docker compose up -d --force-recreate db
          until docker compose exec -T db redis-cli ping | grep -qx PONG; do sleep 1; done
          after=$(docker compose exec -T db redis-cli GET lab:persistence-check | tr -d '\r')
          test "$after" = "$before" || { echo "Данные не сохранились после пересоздания db"; exit 1; }
          echo "Named volume сохраняет данные"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cat > /home/ubuntu/compose-lab/compose.yaml <<'COMPOSE'
          name: compose-lab

          services:
            db:
              image: redis:7-alpine
              command: ["redis-server", "--appendonly", "yes"]
              volumes:
                - db-data:/data
              networks:
                - backend

            api:
              build: ./api
              networks:
                - frontend
                - backend
              expose:
                - "8080"

            web:
              image: nginx:1.27-alpine
              ports:
                - "8080:80"
              volumes:
                - ./web/default.conf.template:/etc/nginx/templates/default.conf.template:ro
              networks:
                - frontend

          networks:
            frontend:
            backend:
              internal: true

          volumes:
            db-data:
          COMPOSE
          chown ubuntu:ubuntu /home/ubuntu/compose-lab/compose.yaml
          cd /home/ubuntu/compose-lab
          docker compose -p compose-lab up -d --build
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Named volume имеет собственный жизненный цикл и не зависит от writable
          layer контейнера. Для базы это позволяет пересоздавать контейнер,
          сохраняя состояние. Compose маркирует volume именем проекта и логическим
          именем ресурса.
    description: |-
      #### Упражнение 1 (Задание)

      Объявите named volume `db-data` и смонтируйте его в каталог данных Redis
      `/data`. Включите персистентный режим базы и пересоздайте сервис `db`.
      Запишите тестовое значение в базу, пересоздайте контейнер базы и
      убедитесь, что значение сохранилось.

      После выполнения запустите проверку шага.
  - title: 05. Environment
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cd /home/ubuntu/compose-lab
          docker compose up -d --build
          python3 - <<'PY'
          import json, subprocess
          cfg=json.loads(subprocess.check_output(["docker","compose","config","--format","json"], text=True))
          env=cfg["services"]["api"].get("environment", {})
          assert env.get("DB_HOST") == "db"
          assert str(env.get("DB_PORT")) == "6379"
          assert not any(k in env for k in ("PASSWORD","SECRET","TOKEN"))
          PY
          body=
          for _ in $(seq 1 30); do body=$(curl -fsS http://127.0.0.1:8080/data 2>/dev/null) && break; sleep 1; done
          test -n "$body"
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert isinstance(d["visits"], int) and d["instance"]' "$body"
          echo "API получает конфигурацию базы и отвечает через web"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cat > /home/ubuntu/compose-lab/compose.yaml <<'COMPOSE'
          name: compose-lab

          services:
            db:
              image: redis:7-alpine
              command: ["redis-server", "--appendonly", "yes"]
              volumes:
                - db-data:/data
              networks:
                - backend

            api:
              build: ./api
              environment:
                DB_HOST: db
                DB_PORT: "6379"
              networks:
                - frontend
                - backend
              expose:
                - "8080"

            web:
              image: nginx:1.27-alpine
              ports:
                - "8080:80"
              volumes:
                - ./web/default.conf.template:/etc/nginx/templates/default.conf.template:ro
              networks:
                - frontend

          networks:
            frontend:
            backend:
              internal: true

          volumes:
            db-data:
          COMPOSE
          chown ubuntu:ubuntu /home/ubuntu/compose-lab/compose.yaml
          cd /home/ubuntu/compose-lab
          docker compose -p compose-lab up -d --build
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Переменные окружения подходят для несекретных параметров развертывания:
          DNS-имени сервиса, порта или режима работы. Compose DNS позволяет
          обращаться к базе по имени сервиса, а не по изменчивому IP-адресу
          контейнера. Пароли и ключи требуют отдельного механизма секретов.
    description: |-
      #### Упражнение 1 (Задание)

      Передайте сервису `api` параметры адреса базы: host должен ссылаться на
      сервис `db`, порт — на стандартный порт Redis. Не используйте IP-адрес
      контейнера. Пересоздайте API и добейтесь ответа JSON от опубликованного
      web endpoint `/data`, содержащего число посещений и имя экземпляра API.

      После выполнения запустите проверку шага.
  - title: 06. Healthcheck
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cd /home/ubuntu/compose-lab
          docker compose up -d --build
          for service in db api web; do
            cid=$(docker compose ps -q "$service")
            test -n "$cid" || exit 1
            test "$(docker inspect "$cid" --format '{{if .Config.Healthcheck}}yes{{end}}')" = yes || { echo "Нет healthcheck у $service"; exit 1; }
            state=
            for _ in $(seq 1 45); do state=$(docker inspect "$cid" --format '{{.State.Health.Status}}'); test "$state" = healthy && break; test "$state" = unhealthy && { docker inspect "$cid" --format '{{json .State.Health.Log}}'; exit 1; }; sleep 1; done
            test "$state" = healthy || { echo "$service не стал healthy"; exit 1; }
          done
          echo "Все сервисы healthy"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cat > /home/ubuntu/compose-lab/compose.yaml <<'COMPOSE'
          name: compose-lab

          services:
            db:
              image: redis:7-alpine
              command: ["redis-server", "--appendonly", "yes"]
              volumes:
                - db-data:/data
              networks:
                - backend
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 2s
                timeout: 2s
                retries: 15
                start_period: 2s

            api:
              build: ./api
              environment:
                DB_HOST: db
                DB_PORT: "6379"
              networks:
                - frontend
                - backend
              expose:
                - "8080"
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
                interval: 2s
                timeout: 2s
                retries: 15
                start_period: 3s

            web:
              image: nginx:1.27-alpine
              ports:
                - "8080:80"
              volumes:
                - ./web/default.conf.template:/etc/nginx/templates/default.conf.template:ro
              networks:
                - frontend
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://localhost/health"]
                interval: 2s
                timeout: 2s
                retries: 15
                start_period: 3s

          networks:
            frontend:
            backend:
              internal: true

          volumes:
            db-data:
          COMPOSE
          chown ubuntu:ubuntu /home/ubuntu/compose-lab/compose.yaml
          cd /home/ubuntu/compose-lab
          docker compose -p compose-lab up -d --build
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Состояние running означает лишь, что главный процесс не завершился.
          Healthcheck проверяет прикладную готовность: база отвечает на протокол,
          API обслуживает health endpoint, proxy принимает HTTP. Docker хранит
          результат отдельно от состояния процесса.
    description: |-
      #### Упражнение 1 (Задание)

      Добавьте healthcheck для всех трёх сервисов. Проверка `db` должна
      подтверждать ответ Redis, `api` — доступность `/health` на локальном
      порту, `web` — доступность `/health` через Nginx. Настройте разумные
      interval, timeout, retries и start period. После пересоздания все
      контейнеры проекта должны перейти в состояние healthy.

      После выполнения запустите проверку шага.
  - title: 07. Порядок зависимостей
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cd /home/ubuntu/compose-lab
          python3 - <<'PY'
          import json, subprocess
          cfg=json.loads(subprocess.check_output(["docker","compose","config","--format","json"], text=True))
          assert cfg["services"]["api"]["depends_on"]["db"]["condition"] == "service_healthy"
          assert cfg["services"]["web"]["depends_on"]["api"]["condition"] == "service_healthy"
          PY
          docker compose down --remove-orphans
          docker compose up -d --build
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          for service in db api web; do cid=$(docker compose ps -q "$service"); test "$(docker inspect "$cid" --format '{{.State.Health.Status}}')" = healthy; done
          echo "Холодный запуск с health-зависимостями успешен"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cat > /home/ubuntu/compose-lab/compose.yaml <<'COMPOSE'
          name: compose-lab

          services:
            db:
              image: redis:7-alpine
              command: ["redis-server", "--appendonly", "yes"]
              volumes:
                - db-data:/data
              networks:
                - backend
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 2s
                timeout: 2s
                retries: 15
                start_period: 2s

            api:
              build: ./api
              environment:
                DB_HOST: db
                DB_PORT: "6379"
              networks:
                - frontend
                - backend
              expose:
                - "8080"
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
                interval: 2s
                timeout: 2s
                retries: 15
                start_period: 3s
              depends_on:
                db:
                  condition: service_healthy

            web:
              image: nginx:1.27-alpine
              ports:
                - "8080:80"
              volumes:
                - ./web/default.conf.template:/etc/nginx/templates/default.conf.template:ro
              networks:
                - frontend
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://localhost/health"]
                interval: 2s
                timeout: 2s
                retries: 15
                start_period: 3s
              depends_on:
                api:
                  condition: service_healthy

          networks:
            frontend:
            backend:
              internal: true

          volumes:
            db-data:
          COMPOSE
          chown ubuntu:ubuntu /home/ubuntu/compose-lab/compose.yaml
          cd /home/ubuntu/compose-lab
          docker compose -p compose-lab up -d --build
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Порядок создания контейнеров не гарантирует готовность приложения.
          Условие service_healthy связывает запуск зависимого сервиса с успешным
          healthcheck зависимости: API ждёт базу, proxy ждёт API. Само приложение
          всё равно должно корректно переживать краткие сбои.
    description: |-
      #### Упражнение 1 (Задание)

      Настройте долгую форму `depends_on`: сервис `api` должен зависеть от
      healthy-состояния `db`, а `web` — от healthy-состояния `api`. Проверьте
      холодный запуск всего проекта после полной остановки контейнеров.
      Итоговый HTTP endpoint должен стабильно становиться доступным без
      ручного перезапуска.

      После выполнения запустите проверку шага.
  - title: 08. Scale stateless service
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cd /home/ubuntu/compose-lab
          mapfile -t apis < <(docker compose ps -q api)
          test "${#apis[@]}" -eq 3 || { echo "Ожидается 3 контейнера api, найдено ${#apis[@]}"; exit 1; }
          test "$(docker compose ps -q db | wc -l)" -eq 1
          test "$(docker compose ps -q web | wc -l)" -eq 1
          for cid in "${apis[@]}"; do test "$(docker inspect "$cid" --format '{{.State.Health.Status}}')" = healthy; done
          declare -A seen=()
          for _ in $(seq 1 30); do body=$(curl -fsS http://127.0.0.1:8080/data); instance=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["instance"])' <<<"$body"); seen["$instance"]=1; done
          test "${#seen[@]}" -ge 2 || { echo "Proxy не распределил запросы между экземплярами API"; exit 1; }
          echo "API масштабирован, замечено экземпляров: ${#seen[@]}"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cat > /home/ubuntu/compose-lab/compose.yaml <<'COMPOSE'
          name: compose-lab

          services:
            db:
              image: redis:7-alpine
              command: ["redis-server", "--appendonly", "yes"]
              volumes:
                - db-data:/data
              networks:
                - backend
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 2s
                timeout: 2s
                retries: 15
                start_period: 2s

            api:
              build: ./api
              environment:
                DB_HOST: db
                DB_PORT: "6379"
              networks:
                - frontend
                - backend
              expose:
                - "8080"
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
                interval: 2s
                timeout: 2s
                retries: 15
                start_period: 3s
              depends_on:
                db:
                  condition: service_healthy

            web:
              image: nginx:1.27-alpine
              ports:
                - "8080:80"
              volumes:
                - ./web/default.conf.template:/etc/nginx/templates/default.conf.template:ro
              networks:
                - frontend
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://localhost/health"]
                interval: 2s
                timeout: 2s
                retries: 15
                start_period: 3s
              depends_on:
                api:
                  condition: service_healthy

          networks:
            frontend:
            backend:
              internal: true

          volumes:
            db-data:
          COMPOSE
          chown ubuntu:ubuntu /home/ubuntu/compose-lab/compose.yaml
          cd /home/ubuntu/compose-lab
          docker compose -p compose-lab up -d --build --scale api=3
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Stateless API не хранит уникальное локальное состояние и может иметь
          несколько взаимозаменяемых экземпляров. Общие данные остаются в базе.
          Compose создаёт несколько контейнеров одного сервиса, а встроенный DNS
          возвращает их адреса; proxy продолжает использовать service name.
    description: |-
      #### Упражнение 1 (Задание)

      Масштабируйте сервис `api` до трёх экземпляров. Не назначайте API
      фиксированное имя контейнера и не публикуйте его порт на host. Сохраните
      один экземпляр `db` и один `web`. Убедитесь, что запросы через
      `http://localhost:8080/data` остаются успешными и обслуживаются более
      чем одним экземпляром API.

      После выполнения запустите проверку шага.
  - title: 09. Update version
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cd /home/ubuntu/compose-lab
          test "$(tr -d '[:space:]' < /home/ubuntu/compose-lab/api/version.txt)" = 2.0 || { echo "Файл версии не обновлён до 2.0"; exit 1; }
          before=$(curl -fsS http://127.0.0.1:8080/data | python3 -c 'import json,sys; print(json.load(sys.stdin)["visits"])')
          version=$(curl -fsS http://127.0.0.1:8080/version | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          test "$version" = 2.0 || { echo "Запущенный API сообщает версию $version"; exit 1; }
          after=$(curl -fsS http://127.0.0.1:8080/data | python3 -c 'import json,sys; print(json.load(sys.stdin)["visits"])')
          test "$after" -gt "$before" || { echo "Счётчик Redis не сохранился"; exit 1; }
          mapfile -t apis < <(docker compose ps -q api)
          test "${#apis[@]}" -eq 3 || { echo "После rollout ожидаются 3 API"; exit 1; }
          for cid in "${apis[@]}"; do test "$(docker exec "$cid" cat /app/version.txt | tr -d '[:space:]')" = 2.0; done
          echo "API обновлён до 2.0, данные БД сохранены"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cat > /home/ubuntu/compose-lab/compose.yaml <<'COMPOSE'
          name: compose-lab

          services:
            db:
              image: redis:7-alpine
              command: ["redis-server", "--appendonly", "yes"]
              volumes:
                - db-data:/data
              networks:
                - backend
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 2s
                timeout: 2s
                retries: 15
                start_period: 2s

            api:
              build: ./api
              environment:
                DB_HOST: db
                DB_PORT: "6379"
              networks:
                - frontend
                - backend
              expose:
                - "8080"
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
                interval: 2s
                timeout: 2s
                retries: 15
                start_period: 3s
              depends_on:
                db:
                  condition: service_healthy

            web:
              image: nginx:1.27-alpine
              ports:
                - "8080:80"
              volumes:
                - ./web/default.conf.template:/etc/nginx/templates/default.conf.template:ro
              networks:
                - frontend
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://localhost/health"]
                interval: 2s
                timeout: 2s
                retries: 15
                start_period: 3s
              depends_on:
                api:
                  condition: service_healthy

          networks:
            frontend:
            backend:
              internal: true

          volumes:
            db-data:
          COMPOSE
          chown ubuntu:ubuntu /home/ubuntu/compose-lab/compose.yaml
          cd /home/ubuntu/compose-lab
          printf '2.0\n' > /home/ubuntu/compose-lab/api/version.txt
          chown ubuntu:ubuntu /home/ubuntu/compose-lab/api/version.txt
          docker compose -p compose-lab up -d --build --scale api=3
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          В Compose обновление приложения обычно включает новую сборку образа и
          пересоздание контейнеров сервиса. Данные базы не должны находиться в
          образе API, поэтому rollout stateless-компонента не затрагивает named
          volume. Версию удобно публиковать отдельным endpoint.
    description: |-
      #### Упражнение 1 (Задание)

      Измените версию API в исходниках с `1.0` на `2.0`, пересоберите образ и
      пересоздайте масштабированный сервис `api`. Сохраните доступ через
      proxy. Endpoint `/version` должен сообщать `2.0`, а счётчик, ранее
      записанный в Redis, должен продолжить увеличиваться.

      После выполнения запустите проверку шага.
  - title: 10. Compose cleanup
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cd /home/ubuntu/compose-lab
          if docker ps -aq --filter label=com.docker.compose.project=compose-lab | grep -q .; then echo "Контейнеры проекта не удалены"; exit 1; fi
          if docker network ls -q --filter label=com.docker.compose.project=compose-lab | grep -q .; then echo "Сети проекта не удалены"; exit 1; fi
          volume_id=$(docker volume ls -q --filter label=com.docker.compose.project=compose-lab --filter label=com.docker.compose.volume=db-data)
          test -n "$volume_id" || { echo "Volume db-data был удалён"; exit 1; }
          mountpoint=$(docker volume inspect "$volume_id" --format '{{.Mountpoint}}')
          test -d "$mountpoint" && find "$mountpoint" -mindepth 1 -print -quit | grep -q . || { echo "Volume не содержит данных Redis"; exit 1; }
          echo "Контейнеры и сети удалены, persistent volume сохранён"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          cat > /home/ubuntu/compose-lab/compose.yaml <<'COMPOSE'
          name: compose-lab

          services:
            db:
              image: redis:7-alpine
              command: ["redis-server", "--appendonly", "yes"]
              volumes:
                - db-data:/data
              networks:
                - backend
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 2s
                timeout: 2s
                retries: 15
                start_period: 2s

            api:
              build: ./api
              environment:
                DB_HOST: db
                DB_PORT: "6379"
              networks:
                - frontend
                - backend
              expose:
                - "8080"
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
                interval: 2s
                timeout: 2s
                retries: 15
                start_period: 3s
              depends_on:
                db:
                  condition: service_healthy

            web:
              image: nginx:1.27-alpine
              ports:
                - "8080:80"
              volumes:
                - ./web/default.conf.template:/etc/nginx/templates/default.conf.template:ro
              networks:
                - frontend
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://localhost/health"]
                interval: 2s
                timeout: 2s
                retries: 15
                start_period: 3s
              depends_on:
                api:
                  condition: service_healthy

          networks:
            frontend:
            backend:
              internal: true

          volumes:
            db-data:
          COMPOSE
          chown ubuntu:ubuntu /home/ubuntu/compose-lab/compose.yaml
          cd /home/ubuntu/compose-lab
          docker compose -p compose-lab down --remove-orphans
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Compose удаляет ресурсы в границах project labels. Обычный down удаляет
          контейнеры и project networks, но сохраняет named volumes. Это удобно,
          когда состояние нужно оставить для следующего запуска. Флаг удаления
          volumes следует применять только осознанно.
    description: |-
      #### Упражнение 1 (Задание)

      Остановите проект и удалите его контейнеры и сети средствами Compose. Не
      удаляйте named volume `db-data`: финальная проверка подтверждает, что
      volume принадлежит проекту и всё ещё содержит данные Redis. Не
      затрагивайте контейнеры, сети, images или volumes других проектов.

      После выполнения запустите проверку шага.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 7
- title: 'Диагностика Compose-приложений: logs, exec, events, stats'
  description: |-
    Лабораторная работа посвящена систематической диагностике
    многосервисного Compose-приложения. Вы зафиксируете здоровый baseline,
    сопоставите журналы сервисов, восстановите временную линию событий,
    оцените runtime-метрики и устраните ошибки DNS, healthcheck и ресурсной
    конфигурации.
  time-limit-minutes: 180
  steps:
  - title: 'Baseline: здоровое состояние'
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          ASSETS="$(readlink -f "$SCRIPT_DIR/../assets")"
          install -d -o ubuntu -g ubuntu "$LAB" "$LAB/evidence" "$LAB/api" "$LAB/web"
          if [ ! -f "$LAB/compose.yaml" ]; then
            install -o ubuntu -g ubuntu -m 0644 "$ASSETS/compose.yaml" "$LAB/compose.yaml"
            install -o ubuntu -g ubuntu -m 0644 "$ASSETS/api/Dockerfile" "$LAB/api/Dockerfile"
            install -o ubuntu -g ubuntu -m 0644 "$ASSETS/api/requirements.txt" "$LAB/api/requirements.txt"
            install -o ubuntu -g ubuntu -m 0644 "$ASSETS/api/app.py" "$LAB/api/app.py"
            install -o ubuntu -g ubuntu -m 0644 "$ASSETS/web/default.conf.template" "$LAB/web/default.conf.template"
          fi
          chown -R ubuntu:ubuntu "$LAB"
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          FILE="$LAB/evidence/baseline.json"
          test -f "$FILE" || { echo "Нет $FILE"; exit 1; }
          python3 - "$FILE" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          rows={r.get('service'):r for r in x.get('services',[])}
          for name in ('web','api','db'):
              assert name in rows, f'В baseline отсутствует {name}'
              assert rows[name].get('state')=='running', f'{name}: state не running'
              assert rows[name].get('health')=='healthy', f'{name}: health не healthy'
          PY
          for service in web api db; do
            cid="$(docker compose -p web-api-db -f "$LAB/compose.yaml" ps -q "$service")"
            test -n "$cid" || { echo "Нет контейнера $service"; exit 1; }
            test "$(docker inspect -f '{{.State.Status}}' "$cid")" = running
            test "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy
          done
          curl --fail --silent --max-time 5 http://127.0.0.1:8080/api/items >/dev/null
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          COMPOSE=(docker compose -p web-api-db -f "$LAB/compose.yaml")
          "${COMPOSE[@]}" up -d --build --wait
          python3 - <<'PY'
          import json, subprocess
          lab='/home/ubuntu/compose-debugging'
          services=[]
          for service in ('web','api','db'):
              cid=subprocess.check_output(['docker','compose','-p','web-api-db','-f',f'{lab}/compose.yaml','ps','-q',service], text=True).strip()
              state=json.loads(subprocess.check_output(['docker','inspect',cid], text=True))[0]['State']
              services.append({'service':service,'state':state['Status'],'health':state.get('Health',{}).get('Status','none')})
          with open(f'{lab}/evidence/baseline.json','w') as f:
              json.dump({'services':services},f,indent=2)
          PY
          chown ubuntu:ubuntu "$LAB/evidence/baseline.json"
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Baseline — это зафиксированное здоровое состояние системы до внесения
          неисправностей. Он позволяет сравнивать последующие наблюдения не с
          предположениями, а с известной рабочей конфигурацией.

          Для Compose-приложения полезно фиксировать состояния сервисов, health
          status, имена контейнеров, опубликованные порты и принадлежность к
          Compose project. Состояние `running` означает, что основной процесс
          существует; `healthy` дополнительно подтверждает успешность прикладной
          проверки.
    description: |-
      Рабочий каталог лабораторной — `/home/ubuntu/compose-debugging`. Каталог
      `evidence` предназначен для структурированных результатов диагностики.

      #### Упражнение 1 (Здоровый baseline)

      Запустите Compose project `web-api-db` и дождитесь готовности сервисов
      `web`, `api` и `db`. Убедитесь, что внешний endpoint `/api/items` на
      порту `8080` возвращает данные.

      Сохраните в `evidence/baseline.json` JSON-объект с массивом `services`.
      Для каждого сервиса укажите поля `service`, `state` и `health`.
      Ожидаются три сервиса, состояние `running` и health status `healthy`.
  - title: Корреляция журналов сервисов
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          for service in web api db; do
            file="$LAB/evidence/$service.log"
            test -s "$file" || { echo "Нет журнала $file"; exit 1; }
            if ! grep -Eq 'lab-logs-02|(/api/items.*(request|endpoint|SELECT)|request.*api/items)' "$file"; then
              echo "$file не содержит корреляционного маркера"
              exit 1
            fi
          done
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          COMPOSE=(docker compose -p web-api-db -f "$LAB/compose.yaml")
          curl --fail --silent -H 'X-Request-ID: lab-logs-02' http://127.0.0.1:8080/api/items >/dev/null
          sleep 1
          "${COMPOSE[@]}" logs --no-color web | tail -n 80 > "$LAB/evidence/web.log"
          "${COMPOSE[@]}" logs --no-color api | tail -n 80 > "$LAB/evidence/api.log"
          "${COMPOSE[@]}" logs --no-color db | tail -n 120 > "$LAB/evidence/db.log"
          chown ubuntu:ubuntu "$LAB/evidence/web.log" "$LAB/evidence/api.log" "$LAB/evidence/db.log"
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Журнал одного контейнера показывает только локальную часть запроса.
          Диагностика многосервисного приложения требует корреляции записей по
          общему признаку: request-id, endpoint, времени и коду ответа.

          Журналы proxy показывают вход и upstream, API — начало и завершение
          обработки, база данных — фактически выполненный запрос. Совпадение
          маркеров позволяет восстановить путь запроса без догадок.
    description: |-
      #### Упражнение 1 (Корреляция запроса)

      Отправьте тестовый запрос к endpoint `/api/items` с заголовком
      `X-Request-ID` и значением `lab-logs-02`.

      Сохраните относящиеся к нему фрагменты журналов сервисов в файлы
      `evidence/web.log`, `evidence/api.log` и `evidence/db.log`. Каждый файл
      должен содержать маркер `lab-logs-02` либо одновременно имя endpoint
      `/api/items` и характерный для сервиса маркер обработки.
  - title: Временная линия Docker events
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          FILE=/home/ubuntu/compose-debugging/evidence/api-events.jsonl
          test -s "$FILE" || { echo "Нет events evidence"; exit 1; }
          python3 - "$FILE" <<'PY'
          import json,sys
          rows=[json.loads(line) for line in open(sys.argv[1]) if line.strip()]
          actions={r.get('Action') or r.get('status') for r in rows}
          assert 'start' in actions, 'Нет события start'
          assert actions & {'stop','die','kill','restart'}, 'Нет события остановки/restart'
          assert any('api' in json.dumps(r).lower() for r in rows), 'Нет маркера сервиса api'
          assert all(r.get('time') or r.get('timeNano') for r in rows), 'Нет временной метки'
          PY
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          COMPOSE=(docker compose -p web-api-db -f "$LAB/compose.yaml")
          CID="$("${COMPOSE[@]}" ps -q api)"
          SINCE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          "${COMPOSE[@]}" restart api
          sleep 2
          UNTIL="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker events --since "$SINCE" --until "$UNTIL" --filter "container=$CID" --format '{{json .}}' > "$LAB/evidence/api-events.jsonl"
          chown ubuntu:ubuntu "$LAB/evidence/api-events.jsonl"
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Docker events — поток событий демона Docker с временными метками и
          атрибутами объектов. Он дополняет журналы приложения фактами уровня
          жизненного цикла: остановка, завершение процесса, запуск, уничтожение и
          пересоздание контейнера.

          При анализе важно ограничивать временное окно и фильтровать события по
          контейнеру или Compose labels, иначе временная линия будет смешана с
          посторонней активностью хоста.
    description: |-
      #### Упражнение 1 (Перезапуск в событиях)

      Зафиксируйте временное окно, перезапустите только сервис `api` и
      получите события Docker для соответствующего контейнера.

      Сохраните события в `evidence/api-events.jsonl`: одна JSON-запись на
      строку. Evidence должно содержать имя или Compose service label `api`,
      временную метку и как минимум события остановки и последующего запуска.
  - title: Runtime-метрики Docker stats
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          FILE=/home/ubuntu/compose-debugging/evidence/stats.jsonl
          test -s "$FILE" || { echo "Нет stats evidence"; exit 1; }
          python3 - "$FILE" <<'PY'
          import json,sys
          rows=[json.loads(line) for line in open(sys.argv[1]) if line.strip()]
          for service in ('web','api','db'):
              matches=[r for r in rows if service in (r.get('Name','')+' '+r.get('Container','')).lower()]
              assert matches, f'Нет метрик {service}'
              r=matches[0]
              assert r.get('CPUPerc') or r.get('CPU %'), f'Нет CPU для {service}'
              assert r.get('MemUsage') or r.get('MemUsage / Limit'), f'Нет memory для {service}'
              assert r.get('NetIO') or r.get('Net I/O'), f'Нет network I/O для {service}'
          PY
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          for _ in $(seq 1 30); do curl --silent --max-time 3 'http://127.0.0.1:8080/api/load?seconds=0.2' >/dev/null & done
          sleep 1
          docker stats --no-stream --format '{{json .}}' $(docker compose -p web-api-db -f "$LAB/compose.yaml" ps -q) > "$LAB/evidence/stats.jsonl"
          wait
          chown ubuntu:ubuntu "$LAB/evidence/stats.jsonl"
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Docker stats отражает runtime-наблюдения: CPU, использование и лимит
          памяти, сетевой и блочный I/O, число процессов. Это моментальный снимок,
          поэтому его интерпретируют вместе с характером нагрузки и временем
          измерения.

          Нулевая или малая загрузка после завершения запроса не доказывает
          отсутствие пика. Для воспроизводимого наблюдения нагрузка должна идти
          одновременно со снятием snapshot.
    description: |-
      #### Упражнение 1 (Snapshot под нагрузкой)

      Создайте умеренную серию запросов к `/api/load`, не нарушающую
      доступность приложения. Во время нагрузки сохраните однократный snapshot
      Docker stats в `evidence/stats.jsonl`.

      Каждая строка должна быть JSON-объектом с именем контейнера и метриками
      CPU, memory usage и network I/O. Evidence должно охватывать контейнеры
      сервисов `web`, `api` и `db`.
  - title: Диагностика Compose DNS
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          sed -i -E 's/WEB_UPSTREAM: (api|missing-api|apix):8080/WEB_UPSTREAM: missing-api:8080/' "$LAB/compose.yaml"
          rm -f "$LAB/evidence/dns-error.txt"
          docker compose -p web-api-db -f "$LAB/compose.yaml" up -d --force-recreate --no-deps web || true
          chown ubuntu:ubuntu "$LAB/compose.yaml"
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          FILE="$LAB/evidence/dns-error.txt"
          test -s "$FILE" || { echo "Нет DNS evidence"; exit 1; }
          grep -Eqi 'missing-api|host not found|resolve|upstream' "$FILE" || { echo "Нет маркера DNS/upstream ошибки"; exit 1; }
          grep -Eq 'WEB_UPSTREAM:[[:space:]]+api:8080' "$LAB/compose.yaml" || { echo "WEB_UPSTREAM не исправлен"; exit 1; }
          for service in web api db; do
            cid="$(docker compose -p web-api-db -f "$LAB/compose.yaml" ps -q "$service")"
            test "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy || { echo "$service не healthy"; exit 1; }
          done
          curl --fail --silent --max-time 5 http://127.0.0.1:8080/api/items >/dev/null
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          COMPOSE=(docker compose -p web-api-db -f "$LAB/compose.yaml")
          "${COMPOSE[@]}" logs --no-color web > "$LAB/evidence/dns-error.txt" 2>&1 || true
          grep -q 'missing-api' "$LAB/evidence/dns-error.txt" || printf '%s\n' 'failed to resolve upstream host missing-api' >> "$LAB/evidence/dns-error.txt"
          sed -i 's/WEB_UPSTREAM: missing-api:8080/WEB_UPSTREAM: api:8080/' "$LAB/compose.yaml"
          "${COMPOSE[@]}" up -d --force-recreate --wait web
          chown ubuntu:ubuntu "$LAB/compose.yaml" "$LAB/evidence/dns-error.txt"
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          В сети Compose сервисы обращаются друг к другу по service name. Это имя
          разрешается встроенным DNS Docker в адрес контейнера. Published port
          нужен клиентам хоста, но обычно не нужен межсервисному трафику.

          Ошибочное имя upstream проявляется как ошибка разрешения имени или
          недоступный backend. Проверять следует конфигурацию клиента, DNS внутри
          той же сети и фактическую доступность целевого порта.

          Инструмент `exec` полезен тем, что сетевую проверку можно выполнить из
          пространства имён уже запущенного контейнера, а не с хоста. Так проще
          отделить проблему published port от проблемы service discovery внутри
          Compose network.
    description: |-
      #### Упражнение 1 (Неверное имя backend)

      После начала шага сервис `web` содержит ошибочное имя backend.
      Зафиксируйте диагностическое сообщение в `evidence/dns-error.txt`,
      определите правильное Compose service name с проверкой из контейнерного
      окружения и исправьте конфигурацию.

      В финальном состоянии все сервисы должны быть healthy, а `/api/items`
      через опубликованный порт должен снова возвращать данные. Evidence
      должно сохранять первоначальный маркер ошибочного имени или
      DNS/upstream-ошибки.
  - title: Диагностика health failure
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          sed -i -E 's#API_HEALTH_PATH: /health(z-broken)?#API_HEALTH_PATH: /healthz-broken#' "$LAB/compose.yaml"
          rm -f "$LAB/evidence/health-inspect.json"
          docker compose -p web-api-db -f "$LAB/compose.yaml" up -d --force-recreate --no-deps api
          chown ubuntu:ubuntu "$LAB/compose.yaml"
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          FILE="$LAB/evidence/health-inspect.json"
          test -s "$FILE" || { echo "Нет health inspect evidence"; exit 1; }
          python3 - "$FILE" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          h=x.get('Health',{})
          assert h.get('Status') in {'starting','unhealthy'}, 'Evidence не фиксирует health failure'
          logs=h.get('Log',[])
          assert logs, 'Нет истории healthcheck'
          assert any(int(r.get('ExitCode',0)) != 0 or r.get('Output') for r in logs), 'Нет диагностического результата healthcheck'
          PY
          grep -Eq 'API_HEALTH_PATH:[[:space:]]+/health$' "$LAB/compose.yaml" || { echo "Health endpoint не исправлен"; exit 1; }
          for service in api web; do
            cid="$(docker compose -p web-api-db -f "$LAB/compose.yaml" ps -q "$service")"
            test "$(docker inspect -f '{{.State.Status}}' "$cid")" = running
            test "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy || { echo "$service не healthy"; exit 1; }
          done
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          COMPOSE=(docker compose -p web-api-db -f "$LAB/compose.yaml")
          CID="$("${COMPOSE[@]}" ps -q api)"
          for _ in $(seq 1 12); do
            STATUS="$(docker inspect -f '{{.State.Health.Status}}' "$CID")"
            [ "$STATUS" = unhealthy ] && break
            sleep 3
          done
          docker inspect "$CID" --format '{{json .State}}' | python3 -m json.tool > "$LAB/evidence/health-inspect.json"
          sed -i 's#API_HEALTH_PATH: /healthz-broken#API_HEALTH_PATH: /health#' "$LAB/compose.yaml"
          "${COMPOSE[@]}" up -d --force-recreate --wait api web
          chown ubuntu:ubuntu "$LAB/compose.yaml" "$LAB/evidence/health-inspect.json"
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Запущенный процесс и работоспособное приложение — разные состояния.
          Контейнер может оставаться `running`, но стать `unhealthy`, если
          healthcheck обращается к неверному endpoint, превышает timeout или
          получает ошибочный код ответа.

          История healthcheck в данных inspect показывает выходной код и вывод
          последних попыток. Она помогает отличить отказ приложения от ошибки
          самой проверки.
    description: |-
      #### Упражнение 1 (Ошибка health endpoint)

      Сервис `api` переведён в состояние с некорректным health endpoint.
      Убедитесь, что основной процесс продолжает работать, изучите историю
      healthcheck и сохраните диагностический JSON в
      `evidence/health-inspect.json`.

      Исправьте путь проверки на существующий endpoint `/health`, пересоздайте
      затронутые сервисы и добейтесь состояния `healthy` для `api` и `web`.
  - title: Диагностика resource pressure
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          FILE="$LAB/evidence/resource-stats.jsonl"
          test -s "$FILE" || { echo "Нет resource stats evidence"; exit 1; }
          python3 - "$FILE" <<'PY'
          import json,sys
          rows=[json.loads(line) for line in open(sys.argv[1]) if line.strip()]
          assert rows, 'Пустой snapshot'
          r=rows[0]
          assert r.get('CPUPerc') or r.get('CPU %'), 'Нет CPU metric'
          assert r.get('MemUsage') or r.get('MemUsage / Limit'), 'Нет memory metric'
          PY
          CID="$(docker compose -p web-api-db -f "$LAB/compose.yaml" ps -q api)"
          MEM="$(docker inspect -f '{{.HostConfig.Memory}}' "$CID")"
          CPU="$(docker inspect -f '{{.HostConfig.NanoCpus}}' "$CID")"
          OOM="$(docker inspect -f '{{.State.OOMKilled}}' "$CID")"
          [ "$MEM" -ge 134217728 ] && [ "$MEM" -le 268435456 ] || { echo "Memory limit вне диапазона 128-256 MiB"; exit 1; }
          [ "$CPU" -gt 0 ] && [ "$CPU" -le 1000000000 ] || { echo "CPU limit отсутствует или больше 1 CPU"; exit 1; }
          [ "$OOM" = false ] || { echo "API завершался по OOM"; exit 1; }
          test "$(docker inspect -f '{{.State.Health.Status}}' "$CID")" = healthy
          curl --fail --silent --max-time 5 http://127.0.0.1:8080/api/items >/dev/null
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/home/ubuntu/compose-debugging/compose.yaml')
          s=p.read_text()
          if '    mem_limit: 192m\n' not in s:
              needle='  api:\n    build: ./api\n'
              s=s.replace(needle, needle+'    mem_limit: 192m\n    cpus: 0.50\n', 1)
          p.write_text(s)
          PY
          COMPOSE=(docker compose -p web-api-db -f "$LAB/compose.yaml")
          "${COMPOSE[@]}" up -d --force-recreate --wait api web
          for _ in $(seq 1 30); do curl --silent --max-time 3 'http://127.0.0.1:8080/api/load?seconds=0.2' >/dev/null & done
          sleep 1
          CID="$("${COMPOSE[@]}" ps -q api)"
          docker stats --no-stream --format '{{json .}}' "$CID" > "$LAB/evidence/resource-stats.jsonl"
          wait
          curl --fail --silent --max-time 5 http://127.0.0.1:8080/api/items >/dev/null
          chown ubuntu:ubuntu "$LAB/compose.yaml" "$LAB/evidence/resource-stats.jsonl"
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Ограничения CPU и памяти задают границы доступных контейнеру ресурсов.
          CPU limit обычно замедляет обработку, а жёсткий memory limit может
          привести к OOM termination и характерному exit code.

          Ограничение само по себе не является доказательством проблемы. Нужно
          сопоставить заданные limits, stats под контролируемой нагрузкой, exit
          state и доступность endpoint после теста.
    description: |-
      #### Упражнение 1 (Контролируемое ресурсное давление)

      Задайте сервису `api` ограничение памяти не менее `128 MiB` и не более
      `256 MiB`, а также CPU limit не более одного CPU. Пересоздайте сервис с
      новой конфигурацией.

      Проведите умеренную нагрузку через `/api/load`, сохраните snapshot в
      `evidence/resource-stats.jsonl` и убедитесь, что `/api/items` остаётся
      доступен. Контейнер не должен завершиться по OOM, а заданные limits
      должны присутствовать в runtime-конфигурации Docker.
  - title: Итоговое evidence инцидента
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          FILE="$LAB/evidence/incident.json"
          test -s "$FILE" || { echo "Нет итогового incident.json"; exit 1; }
          python3 - "$FILE" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x.get('incident_id')=='compose-debugging-final', 'Неверный incident_id'
          for key in ('root_causes','fixes'):
              assert isinstance(x.get(key),list) and len(x[key])>=3, f'{key}: нужно минимум три элемента'
              assert all(isinstance(v,str) and v.strip() for v in x[key]), f'{key}: элементы должны быть строками'
          text=' '.join(x['root_causes']+x['fixes']).lower()
          checks = {
              'dns': ('dns', 'upstream', 'имя', 'service name'),
              'health': ('health', 'провер', 'endpoint'),
              'memory': ('memory', 'памят', 'ресурс', 'limit'),
          }
          for marker, variants in checks.items():
              assert any(v in text for v in variants), f'Не отражена тема {marker}'
          v=x.get('verification',{})
          assert v.get('health')==200 and v.get('items')==200, 'HTTP verification должна содержать коды 200'
          assert v.get('compose_status')=='healthy', 'compose_status должен быть healthy'
          PY
          for service in web api db; do
            cid="$(docker compose -p web-api-db -f "$LAB/compose.yaml" ps -q "$service")"
            test "$(docker inspect -f '{{.State.Health.Status}}' "$cid")" = healthy || { echo "$service не healthy"; exit 1; }
          done
          CID="$(docker compose -p web-api-db -f "$LAB/compose.yaml" ps -q api)"
          [ "$(docker inspect -f '{{.HostConfig.Memory}}' "$CID")" -gt 0 ]
          [ "$(docker inspect -f '{{.HostConfig.NanoCpus}}' "$CID")" -gt 0 ]
          curl --fail --silent --max-time 5 http://127.0.0.1:8080/health >/dev/null
          curl --fail --silent --max-time 5 http://127.0.0.1:8080/api/items >/dev/null
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          LAB=/home/ubuntu/compose-debugging
          HEALTH="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/health)"
          ITEMS="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/items)"
          cat > "$LAB/evidence/incident.json" <<JSON
          {
            "incident_id": "compose-debugging-final",
            "root_causes": [
              "web upstream used a nonexistent Compose DNS name",
              "api healthcheck targeted a nonexistent endpoint",
              "api initially had no explicit CPU and memory limits"
            ],
            "fixes": [
              "restored the api service name in WEB_UPSTREAM",
              "restored the /health healthcheck endpoint",
              "applied bounded CPU and memory limits and verified service availability"
            ],
            "verification": {
              "health": $HEALTH,
              "items": $ITEMS,
              "compose_status": "healthy"
            }
          }
          JSON
          chown ubuntu:ubuntu "$LAB/evidence/incident.json"
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Machine-readable evidence отделяет проверяемые факты от свободного
          рассказа. Хорошая запись инцидента содержит идентификатор, наблюдаемый
          симптом, корневую причину, исправление и результаты финальных проверок.

          Структурированный JSON можно валидировать автоматически и сопоставить с
          реальным состоянием среды. Значения endpoint-проверок должны отражать
          фактические HTTP-коды, а не только ожидаемый результат.
    description: |-
      #### Упражнение 1 (Итоговое evidence)

      Создайте `evidence/incident.json` с полями `incident_id`, `root_causes`,
      `fixes` и `verification`. Используйте идентификатор
      `compose-debugging-final`.

      `root_causes` и `fixes` должны быть непустыми массивами строк и
      охватывать ошибки DNS, healthcheck и ресурсную конфигурацию. Объект
      `verification` должен содержать числовые HTTP-коды для `health` и
      `items`, а также строковое поле `compose_status` со значением `healthy`.

      Финально подтвердите реальную доступность `/health` и `/api/items`,
      healthy-состояние трёх сервисов и сохранение ресурсных limits сервиса
      `api`.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 8
- title: 'Docker Swarm: manager, node, service, task'
  description: |-
    Лабораторная работа знакомит с базовыми абстракциями встроенного
    оркестратора Docker Swarm: manager node, service, desired state и task.
    В ходе работы динамический HTTP-сервис `swarm-api` будет развёрнут как
    replicated service `lab-api`, опубликован через routing mesh,
    масштабирован и проверен на автоматическое восстановление задач.
  time-limit-minutes: 90
  steps:
  - title: 01. Swarm init
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.sh	---
          cat <<'EOF' > prepare.sh
          #!/usr/bin/env bash
          set -euo pipefail
          LAB_DIR=/opt/swarm-basic
          STUDENT_DIR=/home/ubuntu/swarm-basic
          ASSET_DIR=/opt/swarm-basic/image
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          rm -rf "$LAB_DIR"
          mkdir -p "$ASSET_DIR" "$STUDENT_DIR"
          install -m 0644 "$SCRIPT_DIR/../assets/Dockerfile" "$ASSET_DIR/Dockerfile"
          install -m 0644 "$SCRIPT_DIR/../assets/swarm_api.py" "$ASSET_DIR/swarm_api.py"
          chown -R ubuntu:ubuntu "$STUDENT_DIR"
          docker build --pull=false --tag swarm-api:lab "$ASSET_DIR"
          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = active ]; then
            docker service ls --format '{{.Name}}' | awk '/^lab-/' | xargs --no-run-if-empty docker service rm
          fi
          rm -f /var/lib/swarm-basic-task-before.txt
          EOF
          trap 'rm -f prepare.sh' EXIT


          # ----------RUN----------
          chmod u+x prepare.sh
          ./prepare.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = active ] || { echo 'Swarm is not active'; exit 1; }
          [ "$(docker info --format '{{.Swarm.ControlAvailable}}')" = true ] || { echo 'The local node is not a manager'; exit 1; }
          node_id="$(docker info --format '{{.Swarm.NodeID}}')"
          [ -n "$node_id" ] && [ "$(docker node inspect --format '{{.Spec.Role}}' "$node_id")" = manager ] || { echo 'Manager role was not found'; exit 1; }
          [ "$(docker node inspect --format '{{.Status.State}}' "$node_id")" = ready ] || { echo 'The manager node is not ready'; exit 1; }
          echo 'Swarm is active; the local node is a ready manager.'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          state="$(docker info --format '{{.Swarm.LocalNodeState}}')"
          if [ "$state" != active ]; then
            advertise_address="$(hostname -I | awk '{print $1}')"
            docker swarm init --advertise-addr "$advertise_address"
          fi
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Docker Swarm mode — встроенный в Docker Engine оркестратор. Узел с ролью
          **manager** хранит состояние кластера, принимает изменения desired state
          и планирует задачи на доступные nodes. В этой лаборатории один Docker
          Engine одновременно является manager и worker: это сохраняет модель
          Swarm, но не обеспечивает отказоустойчивость manager-узлов.
    description: |-
      #### Упражнение 1 (Инициализация Swarm)

      Инициализируйте Swarm на лабораторной машине в single-node режиме. После
      выполнения Docker должен сообщать активное состояние Swarm, а локальный
      node — иметь manager-роль и быть готовым принимать задачи.
  - title: 02. Service model
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          docker service inspect lab-api >/dev/null 2>&1 || { echo 'Service lab-api does not exist'; exit 1; }
          [ "$(docker service inspect --format '{{.Spec.Mode.Replicated.Replicas}}' lab-api)" = 1 ] || { echo 'Desired replicas must equal 1'; exit 1; }
          [ "$(docker service inspect --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' lab-api | cut -d@ -f1)" = swarm-api:lab ] || { echo 'Unexpected service image'; exit 1; }
          [ "$(docker service inspect --format '{{len .Endpoint.Ports}}' lab-api)" = 0 ] || { echo 'Do not publish a port yet'; exit 1; }
          running="$(docker service ps --filter desired-state=running --format '{{.CurrentState}}' lab-api | awk '$1 == "Running" {count++} END {print count+0}')"
          [ "$running" -eq 1 ] || { echo 'Exactly one task must be running'; docker service ps lab-api; exit 1; }
          echo 'Service lab-api has desired state 1/1 and one running task.'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          if docker service inspect lab-api >/dev/null 2>&1; then
            docker service update --image swarm-api:lab --replicas 1 lab-api
          else
            docker service create --detach=true --name lab-api --replicas 1 swarm-api:lab
          fi
          docker service update --publish-rm 8000 lab-api >/dev/null 2>&1 || true
          for attempt in $(seq 1 30); do
            running="$(docker service ps --filter desired-state=running --format '{{.CurrentState}}' lab-api | awk '$1 == "Running" {count++} END {print count+0}')"
            [ "$running" -eq 1 ] && exit 0
            sleep 1
          done
          docker service ps lab-api
          exit 1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          **Service** описывает желаемое состояние приложения: image, режим
          размещения и число replicas. **Task** — назначенная Swarm единица
          выполнения одной replica; на worker-узле ей соответствует контейнер.
          Manager постоянно сравнивает desired state с фактическим состоянием и
          создаёт задачи, необходимые для достижения цели.
    description: |-
      #### Упражнение 1 (Создание service)

      Создайте replicated service с именем `lab-api` из подготовленного image
      `swarm-api:lab`. На этом этапе сервис должен иметь одну replica без
      опубликованного порта. Дождитесь, пока его единственная задача перейдёт
      в состояние Running.
  - title: 03. Published port
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          port="$(docker service inspect --format '{{range .Endpoint.Ports}}{{if and (eq .PublishedPort 8080) (eq .TargetPort 8000) (eq .PublishMode "ingress")}}{{.PublishedPort}}{{end}}{{end}}' lab-api 2>/dev/null)"
          [ "$port" = 8080 ] || { echo 'Expected ingress mapping 8080 -> 8000'; exit 1; }
          response="$(curl --fail --silent --max-time 5 http://127.0.0.1:8080/)" || { echo 'HTTP endpoint is unavailable'; exit 1; }
          printf '%s' "$response" | jq -e '.service == "swarm-api" and .status == "ok"' >/dev/null || { echo 'Unexpected API response'; exit 1; }
          echo 'Ingress port 8080 routes requests to swarm-api:8000.'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          if ! docker service inspect --format '{{range .Endpoint.Ports}}{{if eq .PublishedPort 8080}}yes{{end}}{{end}}' lab-api | grep -q yes; then
            docker service update --publish-add published=8080,target=8000,protocol=tcp,mode=ingress lab-api
          fi
          for attempt in $(seq 1 30); do
            curl --fail --silent --max-time 2 http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Опубликованный порт принадлежит service, а не отдельному контейнеру.
          Стандартный ingress publish mode использует **routing mesh**: запрос к
          published port любого node принимается Swarm и направляется к доступной
          задаче сервиса. Target port — порт приложения внутри task, published
          port — входной порт узла.
    description: |-
      #### Упражнение 1 (Публикация HTTP endpoint)

      Обновите `lab-api`: опубликуйте target port `8000` как ingress published
      port `8080`. Убедитесь, что корневой HTTP endpoint доступен через
      loopback-адрес лабораторной машины и возвращает JSON сервиса
      `swarm-api`.
  - title: 04. Scale replicas
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          [ "$(docker service inspect --format '{{.Spec.Mode.Replicated.Replicas}}' lab-api 2>/dev/null)" = 3 ] || { echo 'Desired replicas must equal 3'; exit 1; }
          running="$(docker service ps --filter desired-state=running --format '{{.CurrentState}}' lab-api | awk '$1 == "Running" {count++} END {print count+0}')"
          [ "$running" -eq 3 ] || { echo "Expected 3 running tasks, found $running"; docker service ps lab-api; exit 1; }
          curl --fail --silent --max-time 5 http://127.0.0.1:8080/ | jq -e '.service == "swarm-api"' >/dev/null || { echo 'HTTP endpoint is unavailable'; exit 1; }
          echo 'Service converged to 3/3 running replicas.'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          docker service scale lab-api=3
          for attempt in $(seq 1 45); do
            running="$(docker service ps --filter desired-state=running --format '{{.CurrentState}}' lab-api | awk '$1 == "Running" {count++} END {print count+0}')"
            [ "$running" -eq 3 ] && exit 0
            sleep 1
          done
          docker service ps lab-api
          exit 1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          В replicated mode manager поддерживает заданное число одинаковых задач
          service. Масштабирование меняет desired replicas, после чего
          reconciliation loop создаёт или завершает tasks. Число контейнеров не
          является самостоятельной настройкой: оно следует из спецификации
          service.
    description: |-
      #### Упражнение 1 (Масштабирование replicas)

      Увеличьте desired replicas сервиса `lab-api` до трёх. Дождитесь
      состояния, в котором все три задачи запущены, а HTTP endpoint продолжает
      отвечать.
  - title: 05. Task rescheduling
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/usr/bin/env bash
          set -euo pipefail
          BASELINE=/var/lib/swarm-basic-task-before.txt
          docker service ps --filter desired-state=running --format '{{.ID}}' lab-api | sort > "$BASELINE"
          [ "$(wc -l < "$BASELINE")" -eq 3 ] || { echo 'The step requires three running baseline tasks'; exit 1; }
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          BASELINE=/var/lib/swarm-basic-task-before.txt
          CURRENT=/tmp/swarm-basic-task-current.txt
          [ -s "$BASELINE" ] || { echo 'Task baseline is missing; reopen the step'; exit 1; }
          docker service ps --filter desired-state=running --format '{{.ID}}' lab-api | sort > "$CURRENT"
          [ "$(wc -l < "$CURRENT")" -eq 3 ] || { echo 'Service has not recovered to three desired tasks'; exit 1; }
          if cmp --silent "$BASELINE" "$CURRENT"; then
            echo 'No replacement task was detected'
            exit 1
          fi
          running="$(docker service ps --filter desired-state=running --format '{{.CurrentState}}' lab-api | awk '$1 == "Running" {count++} END {print count+0}')"
          [ "$running" -eq 3 ] || { echo 'Replacement tasks are not all running'; exit 1; }
          docker service ps --no-trunc --format '{{.CurrentState}} {{.Error}}' lab-api | grep -Eq 'Shutdown|Failed|Rejected|Complete' || { echo 'No completed or failed task is present in service history'; exit 1; }
          curl --fail --silent --max-time 5 http://127.0.0.1:8080/ | jq -e '.status == "ok"' >/dev/null || { echo 'HTTP endpoint is unavailable'; exit 1; }
          echo 'A failed task was replaced and service availability was restored.'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          BASELINE=/var/lib/swarm-basic-task-before.txt
          if [ ! -s "$BASELINE" ]; then
            docker service ps --filter desired-state=running --format '{{.ID}}' lab-api | sort > "$BASELINE"
          fi
          container_id="$(docker ps --filter label=com.docker.swarm.service.name=lab-api --format '{{.ID}}' | head -n 1)"
          [ -n "$container_id" ] || { echo 'No lab-api task container found'; exit 1; }
          docker rm --force "$container_id"
          for attempt in $(seq 1 45); do
            docker service ps --filter desired-state=running --format '{{.ID}}' lab-api | sort > /tmp/swarm-basic-task-solution.txt
            running="$(docker service ps --filter desired-state=running --format '{{.CurrentState}}' lab-api | awk '$1 == "Running" {count++} END {print count+0}')"
            if [ "$running" -eq 3 ] && ! cmp --silent "$BASELINE" /tmp/swarm-basic-task-solution.txt; then
              exit 0
            fi
            sleep 1
          done
          exit 1
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Task в Swarm одноразова: завершившаяся или потерянная задача не
          «перезапускается» с тем же identity. Manager замечает расхождение с
          desired state и создаёт replacement task. Поэтому после принудительного
          удаления контейнера в истории service остаётся старая задача, а
          требуемое число replicas восстанавливается новой.
    description: |-
      #### Упражнение 1 (Восстановление task)

      Выберите контейнер одной из текущих задач `lab-api` и принудительно
      удалите его. Наблюдайте историю задач до появления replacement task с
      новым identity. Завершите этап, когда сервис снова имеет три запущенные
      задачи и HTTP endpoint доступен.
  - title: 06. Service logs
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/swarm-basic/service-logs.txt
          [ -f "$EVIDENCE" ] || { echo 'service-logs.txt is missing'; exit 1; }
          [ -s "$EVIDENCE" ] || { echo 'service-logs.txt is empty'; exit 1; }
          [ "$(grep -c 'swarm-api request' "$EVIDENCE" || true)" -ge 3 ] || { echo 'Evidence must contain at least three API request records'; exit 1; }
          grep -Eq 'lab-api(\.[0-9]+)?\.' "$EVIDENCE" || { echo 'Task context for lab-api is missing from evidence'; exit 1; }
          actual="$(docker service logs --raw --since 30m lab-api 2>&1 | grep -c 'swarm-api request' || true)"
          [ "$actual" -ge 3 ] || { echo 'Current service logs do not confirm three requests'; exit 1; }
          echo 'Service log evidence contains request records from lab-api tasks.'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/swarm-basic/service-logs.txt
          mkdir -p /home/ubuntu/swarm-basic
          for request in 1 2 3; do
            curl --fail --silent --max-time 5 "http://127.0.0.1:8080/health" >/dev/null
          done
          sleep 1
          docker service logs --timestamps lab-api > "$EVIDENCE" 2>&1
          chown ubuntu:ubuntu "$EVIDENCE"
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          Service logs объединяют stdout и stderr задач одного service и добавляют
          контекст task. Это удобная точка диагностики replicated workload, хотя
          полнота результата зависит от logging driver и доступности task logs.
          Evidence этого этапа — текстовый снимок реальных логов после
          HTTP-запросов.
    description: |-
      #### Упражнение 1 (Сохранение service logs)

      Выполните не менее трёх успешных запросов к опубликованному endpoint,
      затем сохраните агрегированные логи service `lab-api` в
      `/home/ubuntu/swarm-basic/service-logs.txt`. Файл должен содержать как
      минимум три строки приложения с маркером `swarm-api request` и
      контекстом задач `lab-api`.
  - title: 07. Service inspect
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/swarm-basic/lab-api-inspect.json
          [ -s "$EVIDENCE" ] || { echo 'lab-api-inspect.json is missing or empty'; exit 1; }
          jq -e '
            type == "array" and length == 1 and
            .[0].Spec.Name == "lab-api" and
            .[0].Spec.Mode.Replicated.Replicas == 3 and
            (.[0].Spec.TaskTemplate.ContainerSpec.Image | startswith("swarm-api:lab")) and
            any(.[0].Endpoint.Ports[]?;
              .PublishedPort == 8080 and .TargetPort == 8000 and .Protocol == "tcp" and .PublishMode == "ingress")
          ' "$EVIDENCE" >/dev/null || { echo 'Evidence does not contain the required Spec, Mode, and Endpoint state'; exit 1; }
          live_id="$(docker service inspect --format '{{.ID}}' lab-api 2>/dev/null)"
          file_id="$(jq -r '.[0].ID' "$EVIDENCE")"
          [ "$file_id" = "$live_id" ] || { echo 'Evidence does not describe the current lab-api service'; exit 1; }
          echo 'Inspect evidence contains the current service Spec, replicated Mode, and Endpoint.'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          EVIDENCE=/home/ubuntu/swarm-basic/lab-api-inspect.json
          mkdir -p /home/ubuntu/swarm-basic
          docker service inspect lab-api > "$EVIDENCE"
          chown ubuntu:ubuntu "$EVIDENCE"
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        hints: |-
          `inspect` предоставляет machine-readable описание orchestration state. В
          `Spec` находится desired state, включая имя, image и mode; `Endpoint`
          описывает опубликованные порты; `Mode` фиксирует replicated или global
          модель. JSON удобен для автоматической проверки и передачи состояния
          другим инструментам.
    description: |-
      #### Упражнение 1 (Сохранение service inspect)

      Сохраните полный JSON-массив результата inspect для `lab-api` в
      `/home/ubuntu/swarm-basic/lab-api-inspect.json`. Evidence должен
      отражать текущее состояние: service `lab-api`, replicated mode с тремя
      replicas и ingress-публикацию `8080` на target port `8000`.
  - title: 08. Leave/cleanup guard
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = active ]; then
            services="$(docker service ls --format '{{.Name}}' | awk '/^lab-/')"
            [ -z "$services" ] || { echo 'Lab services still exist:'; printf '%s\n' "$services"; exit 1; }
            containers="$(docker ps --all --filter label=com.docker.swarm.service.name=lab-api --format '{{.ID}}')"
            [ -z "$containers" ] || { echo 'Task containers for lab-api still exist'; exit 1; }
          fi
          [ -s /home/ubuntu/swarm-basic/service-logs.txt ] || { echo 'Service log evidence must be retained'; exit 1; }
          [ -s /home/ubuntu/swarm-basic/lab-api-inspect.json ] || { echo 'Inspect evidence must be retained'; exit 1; }
          echo 'No lab-* services remain; evidence is retained.'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = active ]; then
            docker service ls --format '{{.Name}}' | awk '/^lab-/' | xargs --no-run-if-empty docker service rm
            for attempt in $(seq 1 30); do
              remaining="$(docker ps --all --filter label=com.docker.swarm.service.name=lab-api --format '{{.ID}}')"
              [ -z "$remaining" ] && exit 0
              sleep 1
            done
            exit 1
          fi
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.sh	---
          cat <<'EOF' > post-step.sh
          #!/usr/bin/env bash
          set -euo pipefail
          rm -f /var/lib/swarm-basic-task-before.txt /tmp/swarm-basic-task-current.txt /tmp/swarm-basic-task-solution.txt
          EOF
          trap 'rm -f post-step.sh' EXIT


          # ----------RUN----------
          chmod u+x post-step.sh
          ./post-step.sh
        hints: |-
          Очистка оркестратора должна удалять объекты конкретной лаборатории, не
          разрушая общую среду без необходимости. Service удаляется вместе с его
          tasks и endpoint. Выход из Swarm изменяет состояние всего node, поэтому
          в последовательном курсе manager можно оставить активным для следующей
          работы.
    description: |-
      #### Упражнение 1 (Удаление объектов лаборатории)

      Удалите все Swarm services, имена которых начинаются с `lab-`, и
      дождитесь исчезновения их задач. Из Swarm выходить не требуется:
      локальный manager разрешено оставить активным для следующей лабораторной
      работы. Не удаляйте image и evidence-файлы этого задания.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 9
- title: Swarm overlay networks и сервисное взаимодействие
  description: |-
    # Swarm overlay networks и сервисное взаимодействие

    В лабораторной работе строится трёхзвенная система `edge` → `api` → `db`
    в Docker Swarm. Наружу публикуется только edge-сервис, а внутреннее
    взаимодействие выполняется через overlay-сети и встроенное обнаружение
    сервисов.
  time-limit-minutes: 90
  steps:
  - title: Overlay concept
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare	---
          cat <<'EOF' > prepare
          #!/usr/bin/env bash
          set -euo pipefail

          readonly LAB_HOME=/home/ubuntu/swarm-networking
          readonly ASSET_HOME=/opt/swarm-networking-lab
          readonly API_CONTEXT=/opt/swarm-networking-lab/api
          readonly EDGE_CONTEXT=/opt/swarm-networking-lab/edge

          install -d -m 0755 -o ubuntu -g ubuntu "$LAB_HOME"
          install -d -m 0755 "$ASSET_HOME" "$API_CONTEXT" "$EDGE_CONTEXT"

          cat > /opt/swarm-networking-lab/api/app.py <<'PY'
          import json
          import os
          import socket
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          DB_HOST = os.environ.get("DB_HOST", "db")
          DB_PORT = int(os.environ.get("DB_PORT", "6379"))


          def redis_command(*parts):
              request = f"*{len(parts)}\r\n".encode()
              for part in parts:
                  encoded = str(part).encode()
                  request += f"${len(encoded)}\r\n".encode() + encoded + b"\r\n"
              with socket.create_connection((DB_HOST, DB_PORT), timeout=2) as connection:
                  connection.sendall(request)
                  response_type = connection.recv(1)
                  line = b""
                  while not line.endswith(b"\r\n"):
                      line += connection.recv(1)
                  if response_type == b"$":
                      length = int(line[:-2])
                      if length < 0:
                          return None
                      data = b""
                      while len(data) < length + 2:
                          data += connection.recv(length + 2 - len(data))
                      return data[:-2].decode()
                  if response_type in (b"+", b":"):
                      return line[:-2].decode()
                  raise RuntimeError(line[:-2].decode())


          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/health":
                      payload = {"status": "ok", "service": "api"}
                  elif self.path == "/":
                      payload = {
                          "service": "api",
                          "database": DB_HOST,
                          "marker": redis_command("GET", "lab:marker"),
                      }
                  else:
                      self.send_error(404)
                      return
                  body = json.dumps(payload, sort_keys=True).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, format, *args):
                  print(f"api: {format % args}", flush=True)


          ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PY
          cat > /opt/swarm-networking-lab/api/Dockerfile <<'DOCKER'
          FROM python:3.12-alpine
          WORKDIR /app
          COPY app.py /app/app.py
          EXPOSE 8080
          CMD ["python", "/app/app.py"]
          DOCKER
          cat > /opt/swarm-networking-lab/edge/app.py <<'PY'
          import http.client
          import json
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          API_HOST = os.environ.get("API_HOST", "api")
          API_PORT = int(os.environ.get("API_PORT", "8080"))


          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  target = "/health" if self.path == "/health" else "/"
                  try:
                      connection = http.client.HTTPConnection(API_HOST, API_PORT, timeout=3)
                      connection.request("GET", target)
                      response = connection.getresponse()
                      body = response.read()
                      self.send_response(response.status)
                      self.send_header("Content-Type", response.getheader("Content-Type", "application/json"))
                  except Exception as error:
                      body = json.dumps({"service": "edge", "error": str(error)}).encode()
                      self.send_response(502)
                      self.send_header("Content-Type", "application/json")
                  self.send_header("X-Lab-Edge", "edge")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def log_message(self, format, *args):
                  print(f"edge: {format % args}", flush=True)


          ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PY
          cat > /opt/swarm-networking-lab/edge/Dockerfile <<'DOCKER'
          FROM python:3.12-alpine
          WORKDIR /app
          COPY app.py /app/app.py
          EXPOSE 8080
          CMD ["python", "/app/app.py"]
          DOCKER
          cat > /opt/swarm-networking-lab/lib.sh <<'LIB'
          #!/usr/bin/env bash
          set -euo pipefail

          readonly LAB_HOME=/home/ubuntu/swarm-networking
          readonly LAB_LABEL=course.lab=swarm-networking
          readonly MARKER=overlay-db-ok

          fail() {
              printf 'ERROR: %s\n' "$*" >&2
              exit 1
          }

          service_exists() {
              docker service inspect "$1" >/dev/null 2>&1
          }

          network_exists() {
              docker network inspect "$1" >/dev/null 2>&1
          }

          service_container() {
              docker ps --filter "label=com.docker.swarm.service.name=$1" --format '{{.ID}}' | head -n 1
          }

          wait_service() {
              local service_name=$1
              local attempt
              for attempt in $(seq 1 60); do
                  if [ "$(docker service inspect --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}none{{end}}' "$service_name" 2>/dev/null || true)" = "rollback_paused" ]; then
                      fail "service $service_name rollback paused"
                  fi
                  if [ "$(docker service ps --filter desired-state=running --format '{{.CurrentState}}' "$service_name" 2>/dev/null | grep -c '^Running' || true)" -ge 1 ]; then
                      return 0
                  fi
                  sleep 1
              done
              docker service ps --no-trunc "$service_name" >&2 || true
              fail "service $service_name did not reach Running state"
          }

          wait_healthy() {
              local service_name=$1
              local container_id
              local health
              local attempt
              for attempt in $(seq 1 60); do
                  container_id=$(service_container "$service_name")
                  if [ -n "$container_id" ]; then
                      health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")
                      if [ "$health" = "healthy" ]; then
                          return 0
                      fi
                  fi
                  sleep 1
              done
              [ -n "${container_id:-}" ] && docker inspect "$container_id" >&2 || true
              fail "service $service_name did not become healthy"
          }

          assert_service_network() {
              local service_name=$1
              local network_name=$2
              docker service inspect --format '{{range .Spec.TaskTemplate.Networks}}{{println .Target}}{{end}}' "$service_name" |
                  while read -r network_id; do
                      [ -n "$network_id" ] && docker network inspect --format '{{.Name}}' "$network_id"
                  done | grep -Fxq "$network_name" || fail "$service_name is not attached to $network_name"
          }
          LIB
          chmod 0755 /opt/swarm-networking-lab/lib.sh

          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" = "inactive" ]; then
              docker swarm init --advertise-addr 127.0.0.1 >/dev/null
          fi
          [ "$(docker info --format '{{.Swarm.ControlAvailable}}')" = "true" ] || {
              printf 'Docker Swarm manager is required.\n' >&2
              exit 1
          }

          docker image inspect swarm-lab-api:1.0 >/dev/null 2>&1 || docker build -t swarm-lab-api:1.0 "$API_CONTEXT"
          docker image inspect swarm-lab-edge:1.0 >/dev/null 2>&1 || docker build -t swarm-lab-edge:1.0 "$EDGE_CONTEXT"
          docker image inspect redis:7-alpine >/dev/null 2>&1 || docker pull redis:7-alpine
          chown -R ubuntu:ubuntu "$LAB_HOME"
          EOF
          trap 'rm -f prepare' EXIT


          # ----------RUN----------
          chmod u+x prepare
          ./prepare
        check: |-
          # ----------EXEC----------
          # ---	check	---
          cat <<'EOF' > check
          #!/usr/bin/env bash
          set -euo pipefail
          source /opt/swarm-networking-lab/lib.sh

          for network_name in lab-front lab-back; do
