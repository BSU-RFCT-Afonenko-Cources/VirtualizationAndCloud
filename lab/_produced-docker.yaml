        hints: |-
          Пользовательская Docker bridge network автоматизирует IPAM, создание
          bridge, namespace attachment, veth и DNS. Контейнер видит свой конец
          veth под привычным именем, тогда как peer и bridge остаются в host
          namespace.

          Сопоставление выполняется по данным Docker inspect и реальным link
          attributes Linux. Это показывает, где заканчивается декларативный объект
          Docker network и начинаются kernel primitives.

          Два контейнера этапа образуют отдельную контрольную схему и не заменяют
          ручные namespaces. Их workload должен быть долгоживущим, чтобы host-side
          интерфейсы и sandbox identifiers оставались доступными проверке.

          Swarm overlay расширяет ту же conceptual model на несколько узлов:
          локальный namespace по-прежнему подключается через veth, но
          L2/L3-сегмент дополняется инкапсуляцией, распределённым состоянием и
          service discovery. Ручная bridge-схема не реализует overlay, а
          показывает его локальный фундамент.
    description: |-
      #### Упражнение 1

      Создайте пользовательскую Docker bridge network `netlab-docker`,
      запустите в ней долгоживущие контейнеры `netlab-docker-api` и
      `netlab-docker-client` и обеспечьте обращение клиента к API по Docker
      DNS-имени.

      Сохраните Docker network inspect, container inspect, имя Linux bridge,
      host-side veth признаки и HTTP-результат в
      `/home/ubuntu/netlab/evidence/08-docker.json`. Ручная сеть `br-netlab`
      при этом должна продолжать работать.
  - title: Сетевая изоляция
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare	---
          cat <<'EOF' > prepare
          #!/usr/bin/env bash
          set -euo pipefail
          for tool in ip jq curl python3 iptables; do
            command -v "$tool" >/dev/null 2>&1 || { printf 'Required tool is missing: %s\n' "$tool" >&2; exit 1; }
          done
          install -d -m 0755 /home/ubuntu/netlab /home/ubuntu/netlab/evidence /home/ubuntu/netlab/run
