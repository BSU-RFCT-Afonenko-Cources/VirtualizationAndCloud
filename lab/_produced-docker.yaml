        hints: |-
          OCI mounts декларативно описывают точки монтирования, которые runtime
          создаёт до запуска процесса. Типичные примеры — proc для `/proc`, tmpfs
          для временных каталогов и bind mount для передачи выбранного каталога
          хоста.

          Параметры mount определяют доступность устройств, права записи и
          дополнительные ограничения вроде `nosuid` и `nodev`. Флаг read-only у
          rootfs действует отдельно от параметров конкретных mounts.

          Реальное состояние можно проверить через mountinfo процесса. Такой
          снимок показывает тип файловой системы, mount point и параметры,
          фактически применённые ядром.
    description: |-
      #### Упражнение 1

      Добавьте в bundle проверяемые mounts: proc в `/proc`, tmpfs в `/tmp` и
      bind mount каталога `/home/ubuntu/oci-runc-lab/shared` в `/data`.
      Перезапустите OCI-контейнер с обновлённой конфигурацией.

      Сохраните `/proc/<pid>/mountinfo` контейнерного процесса в
      `/home/ubuntu/oci-runc-lab/evidence/mountinfo.txt`. Содержимое должно
      относиться к текущему PID и соответствовать `config.json`.
  - title: Namespaces в OCI config
    actions:
      host:
        pre-step: |-
