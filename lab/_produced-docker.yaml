          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          missing=()
          for command_name in runc jq busybox curl; do
            command -v "$command_name" >/dev/null 2>&1 || missing+=("$command_name")
          done
          if ((${#missing[@]})); then
            apt-get update
            apt-get install -y runc jq busybox-static curl
          fi
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io
          fi
          if ! command -v runc >/dev/null 2>&1 && ! command -v crun >/dev/null 2>&1; then
            echo 'OCI runtime не найден: установите пакет runc или crun из репозитория дистрибутива.' >&2
            exit 1
          fi
          systemctl enable --now docker >/dev/null 2>&1 || true
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/assets/oci-lab-lib.bash"
          ensure_layout
          chown -R ubuntu:ubuntu /home/ubuntu/oci-runc-lab
          EOF
          trap 'rm -f prepare.bash' EXIT


          # ----------RUN----------
          chmod u+x prepare.bash
          ./prepare.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          pid="$(container_pid)"; [[ "$(container_status)" == running && -d "/proc/$pid" ]]
          jq -e '.process.noNewPrivileges == true and (.process.capabilities.effective|length>0) and (.process.capabilities.effective|length<15) and .linux.seccomp' "$BUNDLE/config.json" >/dev/null
          grep -Eq '^CapEff:[[:space:]]+[0-9a-fA-F]+' "$EVIDENCE/security-status.txt"
          grep -Eq '^Seccomp:[[:space:]]+2$' "$EVIDENCE/security-status.txt"
          actual="$(awk '/^Seccomp:/ {print $2}' "/proc/$pid/status")"; [[ "$actual" == 2 ]]
          printf 'OK: %s\n' "07-capabilities-seccomp"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          write_config security
          start_container
          wait_for_heartbeat
          pid="$(container_pid)"
          awk '/^(Cap(Inh|Prm|Eff|Bnd|Amb)|Seccomp|Seccomp_filters):/' "/proc/$pid/status" > "$EVIDENCE/security-status.txt"
          chown ubuntu:ubuntu "$EVIDENCE/security-status.txt"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Linux capabilities делят полномочия root на отдельные биты. OCI process
          может независимо задавать bounding, permitted, effective, inheritable и
          ambient sets, поэтому uid 0 внутри контейнера не обязан иметь все
          полномочия хоста.

          Seccomp фильтрует системные вызовы процесса. OCI config описывает
          действие по умолчанию, архитектуры и правила, а runtime устанавливает
          фильтр перед передачей управления workload.

          Файлы `/proc/<pid>/status` показывают маски Cap\* и состояние Seccomp.
          Значение режима фильтра подтверждает применение seccomp, а не только
          наличие декларации в JSON.
    description: |-
      #### Упражнение 1

      Ограничьте capability sets процесса небольшим набором, достаточным для
      workload, и включите seccomp-фильтр, запрещающий хотя бы один
      неиспользуемый системный вызов. Перезапустите контейнер.

      Сохраните строки Cap\* и Seccomp из `/proc/<pid>/status` в
      `/home/ubuntu/oci-runc-lab/evidence/security-status.txt`. Проверка
      сопоставит их с process.capabilities и linux.seccomp в bundle.
  - title: Lifecycle через OCI runtime
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.bash	---
          cat <<'EOF' > prepare.bash
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          missing=()
          for command_name in runc jq busybox curl; do
            command -v "$command_name" >/dev/null 2>&1 || missing+=("$command_name")
          done
          if ((${#missing[@]})); then
            apt-get update
            apt-get install -y runc jq busybox-static curl
          fi
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io
          fi
          if ! command -v runc >/dev/null 2>&1 && ! command -v crun >/dev/null 2>&1; then
            echo 'OCI runtime не найден: установите пакет runc или crun из репозитория дистрибутива.' >&2
            exit 1
          fi
          systemctl enable --now docker >/dev/null 2>&1 || true
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/assets/oci-lab-lib.bash"
          ensure_layout
          chown -R ubuntu:ubuntu /home/ubuntu/oci-runc-lab
          EOF
          trap 'rm -f prepare.bash' EXIT


          # ----------RUN----------
          chmod u+x prepare.bash
          ./prepare.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          jq -e '[.transitions[].status] | index("created") and index("running") and index("stopped") and index("deleted")' "$EVIDENCE/lifecycle.json" >/dev/null
          ! runc_cmd state "$CONTAINER_ID" >/dev/null 2>&1
          printf 'OK: %s\n' "08-lifecycle"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          remove_container
          write_config full
          transitions='[]'
          runc_cmd create --bundle "$BUNDLE" "$CONTAINER_ID"
          state="$(runc_cmd state "$CONTAINER_ID")"
          transitions="$(jq --argjson state "$state" '. + [{stage:"create",status:$state.status,state:$state}]' <<< "$transitions")"
          runc_cmd start "$CONTAINER_ID"
          state="$(runc_cmd state "$CONTAINER_ID")"
          transitions="$(jq --argjson state "$state" '. + [{stage:"start",status:$state.status,state:$state}]' <<< "$transitions")"
          runc_cmd kill "$CONTAINER_ID" KILL
          for _ in $(seq 1 30); do
            state="$(runc_cmd state "$CONTAINER_ID" 2>/dev/null || true)"
            [[ "$(jq -r '.status // empty' <<< "$state" 2>/dev/null)" == stopped ]] && break
            sleep 0.1
          done
          transitions="$(jq --argjson state "$state" '. + [{stage:"kill",status:$state.status,state:$state}]' <<< "$transitions")"
          runc_cmd delete "$CONTAINER_ID"
          transitions="$(jq '. + [{stage:"delete",status:"deleted"}]' <<< "$transitions")"
          jq -n --argjson transitions "$transitions" '{transitions:$transitions}' > "$EVIDENCE/lifecycle.json"
          chown ubuntu:ubuntu "$EVIDENCE/lifecycle.json"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          OCI runtime lifecycle разделяет создание и запуск. `create`
          подготавливает изоляцию и процесс в остановленном состоянии, `start`
          разрешает выполнение, `state` возвращает машинно-читаемое состояние, а
          `kill` и `delete` завершают жизненный цикл.

          Это ниже уровня Docker service abstraction: здесь нет restart policy,
          публикации портов или управления образом. Идентификатор runtime
          относится к локальному объекту состояния, а не к Docker container ID.

          После delete runtime не должен сохранять контейнер в своём state
          directory. Bundle при этом остаётся отдельным каталогом и может быть
          использован снова.
    description: |-
      #### Упражнение 1

      Пройдите стадии create, start, kill и delete для идентификатора
      `oci-lowlevel-lab`. После каждой значимой стадии получите данные через
      runtime state и сохраните переходы в
      `/home/ubuntu/oci-runc-lab/evidence/lifecycle.json`.

      Итоговый файл должен содержать наблюдавшиеся статусы created, running,
      stopped и deleted. После delete runtime не должен находить контейнер с
      этим идентификатором.
  - title: Сравнение OCI-контейнера и Docker-контейнера
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.bash	---
          cat <<'EOF' > prepare.bash
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          missing=()
          for command_name in runc jq busybox curl; do
            command -v "$command_name" >/dev/null 2>&1 || missing+=("$command_name")
          done
          if ((${#missing[@]})); then
            apt-get update
            apt-get install -y runc jq busybox-static curl
          fi
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io
          fi
          if ! command -v runc >/dev/null 2>&1 && ! command -v crun >/dev/null 2>&1; then
            echo 'OCI runtime не найден: установите пакет runc или crun из репозитория дистрибутива.' >&2
            exit 1
          fi
          systemctl enable --now docker >/dev/null 2>&1 || true
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/assets/oci-lab-lib.bash"
          ensure_layout
          chown -R ubuntu:ubuntu /home/ubuntu/oci-runc-lab
          EOF
          trap 'rm -f prepare.bash' EXIT


          # ----------RUN----------
          chmod u+x prepare.bash
          ./prepare.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          [[ "$(container_status)" == running ]]
          [[ "$(docker inspect -f '{{.State.Running}}' "$DOCKER_NAME")" == true ]]
          oci_pid="$(container_pid)"; docker_pid="$(docker inspect -f '{{.State.Pid}}' "$DOCKER_NAME")"
          jq -e --argjson op "$oci_pid" --argjson dp "$docker_pid" '.oci.pid==$op and .docker.pid==$dp and (.oci.args|length>0) and (.docker.args|length>0) and (.oci.cgroup|length>0) and (.docker.cgroup|length>0) and .oci.namespaces.mnt and .docker.namespaces.mnt' "$EVIDENCE/comparison.json" >/dev/null
          [[ "$(jq -r '.docker.inspect_id' "$EVIDENCE/comparison.json")" == "$(docker inspect -f '{{.Id}}' "$DOCKER_NAME")" ]]
          printf 'OK: %s\n' "09-compare-docker"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          build_rootfs
          write_config full
          start_container
          wait_for_heartbeat
          docker rm -f "$DOCKER_NAME" >/dev/null 2>&1 || true
          tar -C "$ROOTFS" -c . | docker import - oci-lowlevel-lab:local >/dev/null
          docker run -d --name "$DOCKER_NAME" --hostname docker-lowlevel --network none oci-lowlevel-lab:local /bin/sh /opt/workload.sh >/dev/null
          oci_pid="$(container_pid)"
          docker_pid="$(docker inspect -f '{{.State.Pid}}' "$DOCKER_NAME")"
          proc_json() {
            local pid="$1"
            jq -n --argjson pid "$pid" \
              --arg args "$(tr '\0' ' ' < "/proc/$pid/cmdline" | sed 's/ $//')" \
              --arg cgroup "$(cat "/proc/$pid/cgroup")" \
              --arg mnt "$(stat -Lc '%i' "/proc/$pid/ns/mnt")" \
              --arg pidns "$(stat -Lc '%i' "/proc/$pid/ns/pid")" \
              --arg uts "$(stat -Lc '%i' "/proc/$pid/ns/uts")" \
              '{pid:$pid,args:$args,cgroup:$cgroup,namespaces:{mnt:$mnt,pid:$pidns,uts:$uts}}'
          }
          oci="$(proc_json "$oci_pid")"
          docker_json="$(proc_json "$docker_pid")"
          inspect_id="$(docker inspect -f '{{.Id}}' "$DOCKER_NAME")"
          jq -n --argjson oci "$oci" --argjson docker "$docker_json" --arg inspect_id "$inspect_id" '{oci:$oci,docker:($docker + {inspect_id:$inspect_id})}' > "$EVIDENCE/comparison.json"
          chown ubuntu:ubuntu "$EVIDENCE/comparison.json"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Docker добавляет управление образами, слоями, сетями, томами, логами и
          удобный пользовательский интерфейс. Однако созданный им контейнер в
          итоге также представлен Linux-процессом с namespaces, cgroup и
          аргументами запуска.

          Сравнение процессов показывает общую основу и различия в политике.
          Docker выбирает собственные cgroup paths и набор namespaces, тогда как
          прямой OCI bundle задаёт их явно.

          Для корректного сравнения нужно использовать живые процессы с
          сопоставимой полезной нагрузкой и получать данные из Docker inspect,
          runtime state и `/proc`.
    description: |-
      #### Упражнение 1

      Запустите OCI-контейнер из bundle и сопоставимый Docker-контейнер с
      именем `oci-lowlevel-docker`, использующий тот же workload. Оба процесса
      должны оставаться работающими.

      Создайте `/home/ubuntu/oci-runc-lab/evidence/comparison.json` с
      отдельными объектами oci и docker. Для каждого сохраните host PID,
      process args, cgroup path и inode mount, PID и UTS namespaces. Данные
      Docker должны согласовываться с Docker inspect.
  - title: Очистка OCI assets
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.bash	---
          cat <<'EOF' > prepare.bash
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          missing=()
          for command_name in runc jq busybox curl; do
            command -v "$command_name" >/dev/null 2>&1 || missing+=("$command_name")
          done
          if ((${#missing[@]})); then
            apt-get update
            apt-get install -y runc jq busybox-static curl
          fi
          if ! command -v docker >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker.io
          fi
          if ! command -v runc >/dev/null 2>&1 && ! command -v crun >/dev/null 2>&1; then
            echo 'OCI runtime не найден: установите пакет runc или crun из репозитория дистрибутива.' >&2
            exit 1
          fi
          systemctl enable --now docker >/dev/null 2>&1 || true
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/assets/oci-lab-lib.bash"
          ensure_layout
          chown -R ubuntu:ubuntu /home/ubuntu/oci-runc-lab
          EOF
          trap 'rm -f prepare.bash' EXIT


          # ----------RUN----------
          chmod u+x prepare.bash
          ./prepare.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          [[ ! -e "$BUNDLE" ]]
          ! runc_cmd state "$CONTAINER_ID" >/dev/null 2>&1
          ! docker inspect "$DOCKER_NAME" >/dev/null 2>&1
          jq -e '.runtime_absent == true and .docker_absent == true and .bundle_absent == true' "$EVIDENCE/cleanup.json" >/dev/null
          printf 'OK: %s\n' "10-cleanup"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          source "$SCRIPT_DIR/../../assets/oci-lab-lib.bash"
          remove_container
          docker rm -f "$DOCKER_NAME" >/dev/null 2>&1 || true
          docker image rm oci-lowlevel-lab:local >/dev/null 2>&1 || true
          rm -rf "$BUNDLE" "$RUNC_ROOT"
          runtime_absent=false
          docker_absent=false
          bundle_absent=false
          runc_cmd state "$CONTAINER_ID" >/dev/null 2>&1 || runtime_absent=true
          docker inspect "$DOCKER_NAME" >/dev/null 2>&1 || docker_absent=true
          [[ ! -e "$BUNDLE" ]] && bundle_absent=true
          jq -n --argjson runtime_absent "$runtime_absent" --argjson docker_absent "$docker_absent" --argjson bundle_absent "$bundle_absent" \
            '{runtime_absent:$runtime_absent,docker_absent:$docker_absent,bundle_absent:$bundle_absent}' > "$EVIDENCE/cleanup.json"
          chown ubuntu:ubuntu "$EVIDENCE/cleanup.json"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Runtime state и bundle имеют разный жизненный цикл. Удаление
          runtime-контейнера освобождает процесс и служебное состояние runtime, но
          не обязано удалять rootfs или `config.json`.

          Docker-контейнер и локально импортированный образ также являются
          отдельными объектами. Явная очистка предотвращает конфликты
          идентификаторов и накопление временных данных.

          Evidence можно оставить для проверки, но исполняемые контейнеры, runtime
          state и временный bundle должны быть удалены.
    description: |-
      #### Упражнение 1

      Остановите и удалите OCI runtime container, сопоставимый
      Docker-контейнер и временный OCI bundle. Убедитесь, что идентификатор
      `oci-lowlevel-lab` больше не виден runtime, а каталог
      `/home/ubuntu/oci-runc-lab/oci-lab-bundle` отсутствует.

      Создайте `/home/ubuntu/oci-runc-lab/evidence/cleanup.json` с булевыми
      полями `runtime_absent`, `docker_absent` и `bundle_absent`, отражающими
      фактическое состояние после очистки.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 19
- title: 'Root filesystem контейнера: mount namespace, bind mount и OverlayFS'
  description: |-
    Лабораторная работа последовательно собирает минимальный root filesystem
    контейнера: от обычного дерева и `chroot` до отдельного mount namespace,
    bind mounts, tmpfs и OverlayFS. Итоговая полезная нагрузка — BusyBox
    HTTP server, читающий изменённый файл из writable upper layer.
  time-limit-minutes: 180
  steps:
  - title: Исходное дерево rootfs
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.sh	---
          cat <<'EOF' > prepare.sh
          #!/usr/bin/env bash
          set -euo pipefail
          SOURCE=$(readlink -f "$(dirname "$0")/../assets/rootfs-labctl")
          install -o root -g root -m 0755 "$SOURCE" /usr/local/sbin/rootfs-labctl
          cat > /etc/sudoers.d/rootfs-lab <<'SUDOERS'
          ubuntu ALL=(root) NOPASSWD: /usr/local/sbin/rootfs-labctl *
          SUDOERS
          chmod 0440 /etc/sudoers.d/rootfs-lab
          /usr/local/sbin/rootfs-labctl init
          EOF
          trap 'rm -f prepare.sh' EXIT


          # ----------RUN----------
          chmod u+x prepare.sh
          ./prepare.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          B=/home/ubuntu/rootfs-lab/rootfs-lab-base
          E=/home/ubuntu/rootfs-lab/evidence
          for d in bin etc proc sys dev tmp run var/www opt/config opt/data; do test -d "$B/$d" || { echo "Нет каталога $B/$d"; exit 1; }; done
          test -x "$B/bin/busybox" || { echo "Нет исполняемого BusyBox"; exit 1; }
          test -L "$B/bin/sh" || { echo "Нет applet-ссылки /bin/sh"; exit 1; }
          test "$(stat -c %a "$B/tmp")" = "1777" || { echo "Неверные права /tmp"; exit 1; }
          grep -q 'base-layer: original' "$B/var/www/index.html" || { echo "Нет контрольного HTTP-файла base layer"; exit 1; }
          grep -q './var/www/index.html' "$E/base-inventory.txt" || { echo "Inventory не содержит HTTP-файл"; exit 1; }
          test -s "$E/base-index.sha256" || { echo "Нет checksum base-файла"; exit 1; }
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solve.sh	---
          cat <<'EOF' > solve.sh
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/local/sbin/rootfs-labctl init
          EOF
          trap 'rm -f solve.sh' EXIT


          # ----------RUN----------
          chmod u+x solve.sh
          ./solve.sh
        hints: |-
          Root filesystem контейнера — это файловое представление, которое процесс
          видит начиная с `/`. Само по себе дерево каталогов не является отдельной
          виртуальной машиной: процессы внутри него продолжают использовать ядро
          хоста.

          Runtime собирает это представление из содержимого образа, настроек mount
          namespace и служебных монтирований. Минимальное дерево должно содержать
          исполняемый файл и ожидаемые каталоги для `/proc`, `/dev`, `/run` и
          полезной нагрузки.

          Inventory фиксирует исходное состояние base layer. В следующих шагах он
          позволит отличать изменения базового дерева от изменений, сделанных в
          writable-слое.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Подготовьте в `/home/ubuntu/rootfs-lab/rootfs-lab-base` минимальное
      дерево rootfs с BusyBox-подобным набором applet-ссылок, служебными
      каталогами и HTTP-файлами. Используйте инструмент `rootfs-labctl` и
      действие `init`, затем изучите получившееся дерево.

      Сохранённый inventory должен перечислять тип, права, владельца и путь
      каждого объекта. Каталог временных файлов должен иметь sticky bit, а
      контрольный HTTP-файл — содержать исходную версию base layer.
  - title: chroot как неполная изоляция
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          E=/home/ubuntu/rootfs-lab/evidence/chroot.json
          test -s "$E" || { echo "Нет chroot evidence"; exit 1; }
          python3 -c "import json; d=json.load(open('$E')); assert d['experiment']=='chroot' and d['same_pid_namespace'] is True and d['proc_pid_1_visible'] is True and d['network_namespace_created'] is False and d['host_pid_namespace']==d['chroot_pid_namespace']"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solve.sh	---
          cat <<'EOF' > solve.sh
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/local/sbin/rootfs-labctl chroot
          EOF
          trap 'rm -f solve.sh' EXIT


          # ----------RUN----------
          chmod u+x solve.sh
          ./solve.sh
        hints: |-
          `chroot` меняет точку, от которой процесс разрешает абсолютные пути. Это
          полезный файловый механизм, но он не создаёт новые PID, network, user
          или mount namespaces и не назначает cgroups.

          Процесс после `chroot` может видеть тот же `/proc`, если его
          предоставить внутри нового корня. Совпадение идентификатора PID
          namespace и видимость PID 1 демонстрируют, что файловая смена корня не
          равна контейнерной изоляции.

          Эксперимент должен быть контролируемым: псевдофайловая система
          подключается только на время наблюдения и затем отключается.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Проведите controlled chroot-experiment над подготовленным rootfs с
      помощью действия `chroot`. Сохраните структурированное evidence в JSON.

      Evidence должен показывать namespace хоста и процесса в chroot,
      доступность `/proc/1`, факт отсутствия отдельного network namespace и
      итоговый вывод о недостаточности одного `chroot`.
  - title: Mount namespace для rootfs
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          S=/home/ubuntu/rootfs-lab/state/mountns.pid
          E=/home/ubuntu/rootfs-lab/evidence
          test -s "$S" && kill -0 "$(cat "$S")" || { echo "Mount namespace keeper не работает"; exit 1; }
          python3 -c "import json; d=json.load(open('$E/mountns.json')); assert d['host'] != d['experiment'] and d['different'] is True"
          grep -q '/home/ubuntu/rootfs-lab/runtime/rootfs ' "$E/mountns.mountinfo" || { echo "Нет bind rootfs в mountinfo"; exit 1; }
          grep -q '/home/ubuntu/rootfs-lab/runtime/rootfs/proc ' "$E/mountns.mountinfo" || { echo "Нет proc в rootfs"; exit 1; }
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solve.sh	---
          cat <<'EOF' > solve.sh
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/local/sbin/rootfs-labctl mountns
          EOF
          trap 'rm -f solve.sh' EXIT


          # ----------RUN----------
          chmod u+x solve.sh
          ./solve.sh
        hints: |-
          Mount namespace предоставляет процессам отдельную таблицу монтирований.
          Изменение mount table внутри такого namespace не обязано появляться в
          исходном namespace хоста.

          Перед сборкой rootfs propagation обычно переводят в private или
          slave-режим. Это предотвращает нежелательное распространение последующих
          mount и umount между деревьями.

          В новый корень также подключают служебные файловые системы, например
          `proc`. Файл `mountinfo` показывает тип файловой системы, mount point,
          параметры и отношения между mount-объектами.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Создайте отдельный mount namespace для rootfs-эксперимента действием
      `mountns`. Оставьте keeper-процесс работающим, чтобы namespace можно
      было исследовать через `/proc/<pid>/ns/mnt` и `nsenter`.

      Сохраните JSON со сравнением namespace и `mountinfo` изнутри. В таблице
      должны присутствовать bind-представление rootfs и отдельный `proc`
      внутри него.
  - title: Bind mounts
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          E=/home/ubuntu/rootfs-lab/evidence
          python3 -c "import json; d=json.load(open('$E/binds.json')); assert d['readonly_write_denied'] is True and d['readwrite_write_succeeded'] is True"
          grep -q '/opt/config' "$E/binds.mountinfo" || { echo "Нет bind mount config"; exit 1; }
          grep -q '/opt/data' "$E/binds.mountinfo" || { echo "Нет bind mount data"; exit 1; }
          grep -q 'rw-write' /home/ubuntu/rootfs-lab/host-data/events.log || { echo "Запись в read-write bind не появилась на host"; exit 1; }
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solve.sh	---
          cat <<'EOF' > solve.sh
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/local/sbin/rootfs-labctl binds
          EOF
          trap 'rm -f solve.sh' EXIT


          # ----------RUN----------
          chmod u+x solve.sh
          ./solve.sh
        hints: |-
          Bind mount публикует уже существующий файл или каталог в другой точке
          дерева без копирования данных. Поэтому изменения через read-write bind
          немедленно относятся к исходному host-каталогу.

          После bind mount его можно перемонтировать read-only. Такой режим
          задаётся для конкретного mount-представления: исходный каталог хоста не
          превращается глобально в read-only.

          В `mountinfo` bind mount часто определяется по совпадению backing
          filesystem и источника, а флаг `ro` отражает запрет записи в данном
          представлении.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Подключите к тестовому rootfs два host-каталога действием `binds`:
      конфигурацию только для чтения и каталог данных для чтения и записи.

      Зафиксируйте mountinfo и JSON-результат двух попыток записи. Запись в
      конфигурацию должна быть отклонена, а запись в каталог данных —
      появиться в host-файле.
  - title: tmpfs для runtime state
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          E=/home/ubuntu/rootfs-lab/evidence
          python3 -c "import json; d=json.load(open('$E/tmpfs.json')); assert d['mount_type']=='tmpfs' and d['state_absent_after_remount'] is True and d['base_artifact_absent'] is True"
          grep -q ' tmpfs ' "$E/tmpfs.mountinfo" || { echo "В mountinfo нет tmpfs"; exit 1; }
          test ! -e /home/ubuntu/rootfs-lab/rootfs-lab-base/run/lab/process.state || { echo "Runtime state попал в base"; exit 1; }
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solve.sh	---
          cat <<'EOF' > solve.sh
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/local/sbin/rootfs-labctl tmpfs
          EOF
          trap 'rm -f solve.sh' EXIT


          # ----------RUN----------
          chmod u+x solve.sh
          ./solve.sh
        hints: |-
          `tmpfs` хранит содержимое в памяти и swap, а не в image layer. Его
          применяют для PID-файлов, сокетов, временных секретов и другого
          состояния времени выполнения.

          Новая инстанция tmpfs в той же mount point начинается пустой. Это
          свойство отделяет жизненный цикл runtime state от base rootfs и writable
          image layer.

          Параметры `nosuid`, `nodev` и ограничение размера уменьшают поверхность
          риска для временного пути.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Выделите tmpfs для `/run/lab` внутри экспериментального rootfs действием
      `tmpfs`. Создайте runtime state, смоделируйте перезапуск новой
      инстанцией tmpfs и сохраните evidence.

      Проверяемое состояние: временный файл исчез после повторного
      монтирования, в base rootfs он не появился, а mountinfo указывает тип
      `tmpfs` и защитные параметры.
  - title: 'OverlayFS: lower, upper, work и merged'
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          L=/home/ubuntu/rootfs-lab/overlay/lower
          U=/home/ubuntu/rootfs-lab/overlay/upper
          M=/home/ubuntu/rootfs-lab/overlay/merged
          test -d "$L" || { echo "Нет lower"; exit 1; }
          mountpoint -q "$M" || { echo "merged не смонтирован"; exit 1; }
          grep -q 'base-layer: original' "$L/var/www/index.html" || { echo "lower изменён"; exit 1; }
          grep -q 'upper-layer: changed' "$U/var/www/index.html" || { echo "copy-up не найден в upper"; exit 1; }
          grep -q 'upper-layer: changed' "$M/var/www/index.html" || { echo "merged не показывает upper-версию"; exit 1; }
          test -f "$U/var/www/upper.txt" || { echo "Новый файл не создан в upper"; exit 1; }
          grep -q ' overlay ' /home/ubuntu/rootfs-lab/evidence/overlay.mountinfo || { echo "Нет overlay в mountinfo"; exit 1; }
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solve.sh	---
          cat <<'EOF' > solve.sh
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/local/sbin/rootfs-labctl overlay
          EOF
          trap 'rm -f solve.sh' EXIT


          # ----------RUN----------
          chmod u+x solve.sh
          ./solve.sh
        hints: |-
          OverlayFS строит объединённое представление из read-only `lowerdir` и
          writable `upperdir`. Пользователь работает с `merged`, тогда как
          `workdir` нужен реализации для атомарных операций.

          При первом изменении файла из lower OverlayFS выполняет copy-up: копия
          появляется в upper, и дальнейшее чтение merged возвращает верхнюю
          версию. Исходный lower-файл остаётся неизменным.

          Upper и work должны находиться на одной подходящей файловой системе.
          Проверять результат следует одновременно во всех каталогах, а не только
          через merged view.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Соберите overlay-rootfs действием `overlay` из каталогов `lower`,
      `upper`, `work` и `merged`. Измените существующий HTTP-файл через merged
      и создайте новый файл.

      Докажите copy-up: lower сохраняет исходный текст и checksum, upper
      содержит изменённую копию, merged показывает новую версию, а mountinfo
      содержит overlay mount с ожидаемыми слоями.
  - title: Связь OverlayFS с Docker layers
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          E=/home/ubuntu/rootfs-lab/evidence
          for f in docker-info.json docker-container-inspect.json docker-image-inspect.json docker-layers.json; do test -s "$E/$f" || { echo "Нет $f"; exit 1; }; done
          python3 -c "import json; info=json.load(open('$E/docker-info.json')); summary=json.load(open('$E/docker-layers.json')); container=json.load(open('$E/docker-container-inspect.json'))[0]; assert info['driver'] and summary['container']=='rootfs-layer-evidence' and container['Name']=='/rootfs-layer-evidence' and 'GraphDriver' in container"
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solve.sh	---
          cat <<'EOF' > solve.sh
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/local/sbin/rootfs-labctl docker-evidence
          EOF
          trap 'rm -f solve.sh' EXIT


          # ----------RUN----------
          chmod u+x solve.sh
          ./solve.sh
        hints: |-
          Docker image состоит из неизменяемых content layers, поверх которых
          контейнер получает writable snapshot. При классическом драйвере
          `overlay2` это концептуально похоже на ручные lower, upper, work и
          merged.

          В новых конфигурациях Docker может использовать containerd image store и
          snapshotter. Тогда host-side пути и поля GraphDriver отличаются или
          скрыты, хотя модель immutable image плюс writable container snapshot
          сохраняется.

          Для лаборатории не требуется менять глобальный storage driver.
          Безопаснее получить `docker info` и inspect image/container, а затем
          сопоставить наблюдаемые признаки с ручным OverlayFS.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Создайте остановленный служебный контейнер Alpine и соберите evidence
      действием `docker-evidence`. Не меняйте daemon configuration и storage
      driver.

      Сохраните `docker info`, inspect образа и контейнера, а также краткий
      JSON с названием driver/snapshotter-контекста и указанием writable
      container layer. Evidence должно учитывать, что host paths могут быть
      скрыты containerd image store.
  - title: Whiteouts и удаление файлов
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          L=/home/ubuntu/rootfs-lab/rootfs-lab-base/var/www/obsolete.txt
          M=/home/ubuntu/rootfs-lab/overlay/merged/var/www/obsolete.txt
          test -f "$L" || { echo "lower-файл удалён"; exit 1; }
          test ! -e "$M" || { echo "Файл всё ещё виден в merged"; exit 1; }
          python3 -c "import json; d=json.load(open('/home/ubuntu/rootfs-lab/evidence/whiteout.json')); assert d['lower_exists'] is True and d['merged_absent'] is True and d['upper_marker']"
          grep -q 'obsolete' /home/ubuntu/rootfs-lab/evidence/upper-state.txt || { echo "Upper-state не отражает удаление"; exit 1; }
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solve.sh	---
          cat <<'EOF' > solve.sh
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/local/sbin/rootfs-labctl whiteout
          EOF
          trap 'rm -f solve.sh' EXIT


          # ----------RUN----------
          chmod u+x solve.sh
          ./solve.sh
        hints: |-
          Удаление объекта из merged view не должно модифицировать immutable lower
          layer. OverlayFS записывает в upper специальные метаданные, скрывающие
          нижний объект.

          Такой marker называют whiteout. Его конкретное host-side представление
          зависит от режима OverlayFS и может выглядеть как специальный inode,
          trusted xattr или преобразованная metadata при экспорте слоя.

          Поэтому корректное доказательство объединяет три наблюдения: файл
          существует в lower, отсутствует в merged и операция отражена в состоянии
          upper.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Удалите lower-only HTTP-файл через merged view действием `whiteout`. Не
      удаляйте его напрямую из base rootfs.

      Сохраните JSON и inventory upper layer. Проверка должна подтвердить
      наличие lower-файла, отсутствие merged-файла и marker либо иное
      upper-state, которым OverlayFS реализовал скрытие.
  - title: Контейнерный rootfs для полезной нагрузки
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          S=/home/ubuntu/rootfs-lab/state/http.pid
          test -s "$S" && kill -0 "$(cat "$S")" || { echo "HTTP-процесс не работает"; exit 1; }
          grep -q 'upper-layer: changed' /home/ubuntu/rootfs-lab/evidence/http-response.txt || { echo "HTTP не отдаёт upper-версию"; exit 1; }
          grep -q 'base-layer: original' /home/ubuntu/rootfs-lab/rootfs-lab-base/var/www/index.html || { echo "Base layer изменён"; exit 1; }
          python3 -c "import json,os; d=json.load(open('/home/ubuntu/rootfs-lab/evidence/http.json')); assert d['pid'] > 1 and d['base_unchanged'] is True and os.path.exists('/proc/%s/ns/mnt' % d['pid'])"
          grep -q '/home/ubuntu/rootfs-lab/runtime/http-rootfs' /home/ubuntu/rootfs-lab/evidence/http.mountinfo || { echo "Mountinfo процесса не содержит runtime rootfs"; exit 1; }
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solve.sh	---
          cat <<'EOF' > solve.sh
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/local/sbin/rootfs-labctl serve
          EOF
          trap 'rm -f solve.sh' EXIT


          # ----------RUN----------
          chmod u+x solve.sh
          ./solve.sh
        hints: |-
          Rootfs приобретает практический смысл, когда внутри него работает
          реальный процесс. Процесс должен разрешать исполняемые файлы,
          библиотеки, конфигурацию и данные относительно нового `/`.

          В этой работе BusyBox HTTP server читает документ из merged view. Его
          mount namespace отделяет runtime bind и `/proc`, но сеть намеренно
          остаётся доступной с хоста для проверки endpoint.

          Ответ сервера должен приходить из верхней версии файла, тогда как
          checksum base layer остаётся исходным. Это связывает namespace, rootfs и
          copy-up в одной наблюдаемой нагрузке.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Запустите долгоживущий HTTP-процесс действием `serve`, используя merged
      rootfs как его корень. Проверьте endpoint `127.0.0.1:18080` и сохраните
      ответ.

      Evidence должен содержать host PID, идентификатор mount namespace,
      mountinfo процесса и признак неизменности base layer. HTTP-ответ должен
      совпадать с файлом из merged view.
  - title: Очистка mounts
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/usr/bin/env bash
          set -euo pipefail
          E=/home/ubuntu/rootfs-lab/evidence/cleanup.json
          test -s "$E" || { echo "Нет cleanup evidence"; exit 1; }
          python3 -c "import json; d=json.load(open('$E')); assert all(d.values())"
          if test -s /home/ubuntu/rootfs-lab/state/http.pid && kill -0 "$(cat /home/ubuntu/rootfs-lab/state/http.pid)" 2>/dev/null; then echo "HTTP-процесс остался"; exit 1; fi
          if test -s /home/ubuntu/rootfs-lab/state/mountns.pid && kill -0 "$(cat /home/ubuntu/rootfs-lab/state/mountns.pid)" 2>/dev/null; then echo "Keeper-процесс остался"; exit 1; fi
          if findmnt -R /home/ubuntu/rootfs-lab/overlay/merged >/dev/null 2>&1; then echo "Остался mount overlay/merged"; exit 1; fi
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solve.sh	---
          cat <<'EOF' > solve.sh
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/local/sbin/rootfs-labctl cleanup
          EOF
          trap 'rm -f solve.sh' EXIT


          # ----------RUN----------
          chmod u+x solve.sh
          ./solve.sh
        hints: |-
          Mount points и namespace живут, пока на них остаются ссылки или
          процессы. Забытый keeper либо HTTP server способен удерживать mounts
          даже после удаления части каталогов.

          Очистку выполняют в обратном порядке: останавливают полезную нагрузку,
          освобождают namespace-процессы, размонтируют merged и только затем
          удаляют рабочие пути. Lazy unmount допустим как аварийный механизм, но
          не заменяет нормальное завершение.

          Идемпотентный cleanup упрощает повторный запуск лаборатории: повторное
          выполнение не должно завершаться ошибкой или затрагивать посторонние
          процессы.
    description: |-
      #### Упражнение 1 (Проверяемое состояние)

      Остановите процессы лабораторной и освободите временные mounts действием
      `cleanup`. Удалите runtime, merged и work, сохранив base, upper и
      evidence для проверки результата.

      После очистки не должно оставаться keeper/HTTP PID, активного mount
      point в рабочем дереве или служебного Docker-контейнера. Сохраните
      итоговый JSON состояния.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — Docker Lab
      prepare: ''
  order: 20
- title: 'Самостоятельная работа: минимальный контейнерный runtime из Linux primitives'
  description: |-
    # Самостоятельная работа: минимальный контейнерный runtime из Linux primitives

    В этой работе нужно без Docker собрать runtime для одного HTTP-процесса.
    Итоговая система должна объединить rootfs, namespaces, mounts, cgroups
    v2, capabilities и сетевую границу, а её состояние — подтверждаться
    машинно-проверяемыми evidence-файлами.
  time-limit-minutes: 240
  steps:
  - title: Архитектурная декларация runtime
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail
          /workspace/VirtualizationAndCloud/lab/docker/capstone-mini-runtime/prepare.sh
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          source /workspace/VirtualizationAndCloud/lab/docker/capstone-mini-runtime/lib/check-common.sh
          SPEC=$LAB/mini-runtime-spec.yaml
          require_file "$SPEC"
          for key in version rootfs namespaces cgroups mounts network workload; do
              grep -Eq "^${key}:" "$SPEC" || fail "spec misses top-level field $key"
          done
          for value in '/home/ubuntu/mini-runtime/rootfs' '/sys/fs/cgroup/mini-runtime' 'mini-runtime-api' 'mini-runtime' '10.200.0.2/30' 'http://10.200.0.2:8080/status' '65534'; do
              grep -Fq "$value" "$SPEC" || fail "spec misses required value $value"
          done
          for namespace in uts pid mount network; do
              grep -Eq "^[[:space:]]*-[[:space:]]+$namespace$" "$SPEC" || fail "spec misses $namespace namespace"
          done
          grep -Eq '^[[:space:]]+readonly:[[:space:]]+true$' "$SPEC" || fail 'rootfs must be declared read-only'
          pass 'runtime specification has the required machine-readable contract'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          /usr/local/lib/mini-runtime-lab/reference-runtime.sh spec
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.sh	---
          cat <<'EOF' > post-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/test -d /home/ubuntu/mini-runtime
          EOF
          trap 'rm -f post-step.sh' EXIT


          # ----------RUN----------
          chmod u+x post-step.sh
          ./post-step.sh
        hints: |-
          Контейнерный runtime начинается не с запуска команды, а с декларации
          целевого состояния. Такая декларация связывает полезную нагрузку с
          rootfs, набором namespaces, политикой mounts, ресурсными лимитами и
          сетевой границей. Благодаря этому реализацию можно проверять по
          контракту, а не по истории действий оператора.

          Для одного процесса достаточно небольшой спецификации, но она должна
          быть однозначной и пригодной для машинного чтения. Пути, идентификаторы
          interfaces, адреса, лимиты, UID/GID и endpoint становятся частью
          воспроизводимого интерфейса runtime.

          #### Пример 1 (Контракт изоляции)

          Спецификация описывает желаемое состояние. Реальные inode namespaces,
          значения cgroupfs и ответ HTTP позднее доказывают, что runtime этот
          контракт выполнил.
    description: |-
      Создайте в `/home/ubuntu/mini-runtime` машинно-читаемую спецификацию
      `mini-runtime-spec.yaml` версии 1 для одного процесса
      `mini-runtime-api`.

      #### Упражнение 1 (Опишите целевую архитектуру)

      В спецификации должны присутствовать разделы `rootfs`, `namespaces`,
      `cgroups`, `mounts`, `network` и `workload`. Зафиксируйте абсолютный
      путь rootfs, режим read-only, UTS/PID/mount/network namespaces, не менее
      двух ресурсных лимитов, отдельный writable runtime path, пару virtual
      Ethernet interfaces, адреса обеих сторон, HTTP endpoint, hostname и
      непривилегированные UID/GID процесса.

      Используйте значения, согласованные со всей работой: rootfs
      `/home/ubuntu/mini-runtime/rootfs`, cgroup
      `/sys/fs/cgroup/mini-runtime`, hostname `mini-runtime`, адрес runtime
      `10.200.0.2/30`, endpoint с путём `/status`, UID и GID `65534`.
  - title: Rootfs и filesystem policy
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/test -d /home/ubuntu/mini-runtime || /workspace/VirtualizationAndCloud/lab/docker/capstone-mini-runtime/prepare.sh
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          source /workspace/VirtualizationAndCloud/lab/docker/capstone-mini-runtime/lib/check-common.sh
          require_dir "$ROOTFS"
          for path in proc sys/fs/cgroup run/mini-runtime opt/mini-runtime; do require_dir "$ROOTFS/$path"; done
          require_file "$ROOTFS/opt/mini-runtime/mini-runtime-api.py"
          require_file "$ROOTFS/.mini-runtime-rootfs"
          [ "$(cat "$ROOTFS/.mini-runtime-rootfs")" = mini-runtime-rootfs-v1 ] || fail 'incorrect rootfs marker'
          [ -x "$ROOTFS/opt/mini-runtime/mini-runtime-api.py" ] || fail 'API is not executable'
          [ -x "$ROOTFS/usr/bin/python3" ] || fail 'Python runtime is absent'
          if find "$ROOTFS" -xdev \( -type f -o -type d \) -perm /0222 -print -quit | grep -q .; then fail 'base rootfs contains writable objects'; fi
          require_dir "$LAB/runtime-state"
          [ "$(stat -c %u:%g "$LAB/runtime-state")" = 65534:65534 ] || fail 'runtime-state owner must be 65534:65534'
          [ -w "$LAB/runtime-state" ] || fail 'runtime-state is not writable by checker/root'
          pass 'immutable base rootfs and separate writable state are prepared'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          /usr/local/lib/mini-runtime-lab/reference-runtime.sh rootfs
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.sh	---
          cat <<'EOF' > post-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/test -d /home/ubuntu/mini-runtime
          EOF
          trap 'rm -f post-step.sh' EXIT


          # ----------RUN----------
          chmod u+x post-step.sh
          ./post-step.sh
        hints: |-
          Rootfs задаёт файловую картину мира процесса. Immutable base снижает
          риск незаметного изменения исполняемого кода и библиотек, а отдельный
          writable runtime state позволяет сервису вести журнал и хранить
          временные данные без записи в базовый слой.

          Одних прав доступа недостаточно для итоговой гарантии: runtime должен
          смонтировать base rootfs read-only внутри mount namespace. При этом
          псевдофайловые системы и writable bind mount подключаются поверх заранее
          созданных mount points.

          В минимальном rootfs должны находиться только необходимые интерпретатор,
          библиотеки, конфигурация идентичности и полезная нагрузка. Маркер в
          корне позволяет API доказать, что оно видит именно подготовленный
          filesystem tree.
    description: |-
      Подготовьте rootfs и writable state в соответствии со спецификацией.

      #### Упражнение 1 (Реализуйте filesystem policy)

      В rootfs должны существовать `/proc`, `/sys/fs/cgroup`,
      `/run/mini-runtime` и `/opt/mini-runtime`. Разместите исполняемую
      полезную нагрузку как `/opt/mini-runtime/mini-runtime-api.py` и маркер
      `/.mini-runtime-rootfs` со значением `mini-runtime-rootfs-v1`. Добавьте
      только зависимости, необходимые для запуска API.

      Base tree должен принадлежать root и не иметь writable файлов или
      каталогов. Каталог `/home/ubuntu/mini-runtime/runtime-state` должен быть
      отдельным, доступным UID/GID `65534` для записи и предназначенным для
      bind mount в `/run/mini-runtime`.
  - title: Namespace isolation
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.sh	---
          cat <<'EOF' > pre-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/test -d /home/ubuntu/mini-runtime || /workspace/VirtualizationAndCloud/lab/docker/capstone-mini-runtime/prepare.sh
          EOF
          trap 'rm -f pre-step.sh' EXIT


          # ----------RUN----------
          chmod u+x pre-step.sh
          ./pre-step.sh
        check: |-
          # ----------EXEC----------
          # ---	check.sh	---
          cat <<'EOF' > check.sh
          #!/bin/bash
          set -euo pipefail
          source /workspace/VirtualizationAndCloud/lab/docker/capstone-mini-runtime/lib/check-common.sh
          require_live_pid
          pid=$(api_pid)
          for ns in uts pid mnt net; do
              [ "$(readlink "/proc/$pid/ns/$ns")" != "$(readlink "/proc/self/ns/$ns")" ] || fail "$ns namespace is shared with host"
          done
          [ "$(nsenter -t "$pid" -u hostname)" = mini-runtime ] || fail 'isolated hostname is incorrect'
          awk '/^NSpid:/ {exit !($NF == 1 && NF >= 3)}' "/proc/$pid/status" || fail 'API does not see itself as PID 1'
          [ "$(cat "/proc/$pid/root/.mini-runtime-rootfs")" = mini-runtime-rootfs-v1 ] || fail 'API does not use the prepared rootfs'
          findmnt -N "$pid" -n -o TARGET --target "$ROOTFS" | grep -Fxq "$ROOTFS" || fail 'rootfs bind mount is absent from API mount namespace'
          pass 'UTS, PID, mount and network namespaces are isolated'
          EOF
          trap 'rm -f check.sh' EXIT


          # ----------RUN----------
          chmod u+x check.sh
          ./check.sh
        solution: |-
          # ----------EXEC----------
          # ---	solution.sh	---
          cat <<'EOF' > solution.sh
          #!/bin/bash
          set -euo pipefail
          [ -d /home/ubuntu/mini-runtime/rootfs ] || /usr/local/lib/mini-runtime-lab/reference-runtime.sh rootfs
          /usr/local/lib/mini-runtime-lab/reference-runtime.sh start
          EOF
          trap 'rm -f solution.sh' EXIT


          # ----------RUN----------
          chmod u+x solution.sh
          ./solution.sh
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.sh	---
          cat <<'EOF' > post-step.sh
          #!/bin/bash
          set -euo pipefail
          /usr/bin/test -d /home/ubuntu/mini-runtime
          EOF
          trap 'rm -f post-step.sh' EXIT


          # ----------RUN----------
          chmod u+x post-step.sh
          ./post-step.sh
        hints: |-
          Namespaces создают разные представления глобальных ресурсов ядра. UTS
          отделяет hostname, PID namespace формирует собственное дерево процессов,
          mount namespace удерживает filesystem policy, а network namespace
          исключает случайное использование host network stack.

          Namespace — это не флаг в проектной документации, а объект ядра с inode,
          наблюдаемым через `/proc/<pid>/ns`. Проверка должна сравнивать процесс
          API с host process и подтверждать, что нужные namespace references
          различаются.

          PID 1 внутри нового PID namespace имеет особую роль: он является корнем
          локального дерева процессов. Для single-process runtime полезная
          нагрузка должна видеть себя как PID 1, даже если с хоста у неё другой
          PID.
    description: |-
      Запустите `mini-runtime-api` как долгоживущий процесс в UTS, PID, mount
      и network namespaces.

      #### Упражнение 1 (Создайте изолированные views)

      Назначьте hostname `mini-runtime`; обеспечьте API локальный PID 1;
      подключите подготовленный rootfs как read-only root и отдельный writable
      runtime state. Сохраните host PID процесса в
      `/run/mini-runtime-lab/api.pid`, а PID launcher — в
      `/run/mini-runtime-lab/launcher.pid`.

      Процесс должен оставаться запущенным после завершения действий
      оператора. Его UTS, PID, mount и network namespace inode должны
      отличаться от соответствующих namespace inode проверяющего host process.
