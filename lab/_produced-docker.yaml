        hints: |-
          IO controller учитывает операции с block devices и может ограничивать
          BPS/IOPS через `io.max`. Правило относится к конкретной паре
          major:minor, а `io.stat` содержит накопительную статистику по
          устройствам.

          В overlay, сетевой файловой системе, VM или делегированной nested-cgroup
          связь файла с управляемым block device может быть неоднозначной.
          Контроллер также может не быть передан родительской группой.

          Поэтому корректный эксперимент имеет две допустимые ветки: применён
          безопасный write limit с наблюдаемой статистикой либо структурированное
          evidence о недоступности с проверяемой причиной.
    description: |-
      #### Упражнение 1 (IO controller и наблюдение write pressure)

      Исследуйте IO controller для группы `io`. Если доступно подходящее block
      device, примените безопасный write BPS limit и выполните write-heavy
      workload в `/home/ubuntu/cgroups-v2-lab/io-data`.

      Создайте `07-io.json`. Для supported-ветки укажите device, правило,
      снимки `io.stat` и записанные bytes; для unsupported-ветки укажите
      статус, причину и фактические controllers/filesystem данные.
