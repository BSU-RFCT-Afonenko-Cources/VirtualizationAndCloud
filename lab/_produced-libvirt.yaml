        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          VIRSH=(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system)
          virsh(){ "${VIRSH[@]}" "$@"; }
