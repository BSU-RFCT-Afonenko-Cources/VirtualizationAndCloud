          /usr/bin/grep -q 'cap-app' <<<"$headers" && /usr/bin/grep -q 'cap-db' <<<"$headers" && /usr/bin/grep -q '1001' <<<"$headers" || fail 'ответ не подтверждает полную цепочку'
          EOF
