      frontend/backend каждого узла, URL входной точки, результатом
      edge-проверки и результатом внутренней app-db проверки. `cap-app` и
      `cap-db` не должны быть подключены к `cap-front`; основной URL должен
      указывать на `cap-edge`.
  - title: Настройка ресурсов ВМ
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/capstone/11-resources
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          VIRSH=(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system)
          virsh(){ "${VIRSH[@]}" "$@"; }
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          need_file(){ /usr/bin/test -s "$1" || fail "нет непустого файла $1"; }
          need_file /home/ubuntu/capstone/11-resources/resources.json
          check_res(){ local d="$1" cpu="$2" kib="$3"; xml=$(virsh dumpxml "$d" --config); gotcpu=$(/usr/bin/sed -n "s:.*<vcpu[^>]*>\([0-9]*\)</vcpu>.*:\1:p" <<<"$xml" | /usr/bin/head -1); gotmem=$(/usr/bin/sed -n "s:.*<memory unit='KiB'>\([0-9]*\)</memory>.*:\1:p" <<<"$xml" | /usr/bin/head -1); [[ "$gotcpu" == "$cpu" ]] || fail "$d: ожидалось $cpu vCPU"; [[ "$gotmem" == "$kib" ]] || fail "$d: неверная память ($gotmem KiB)"; }
          check_res cap-edge 1 524288; check_res cap-app 2 1048576; check_res cap-db 2 1572864
          /usr/bin/grep -q 'cap-db-data.qcow2' < <(virsh dumpxml cap-db --config) || fail 'db data disk не виден'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          source /home/ubuntu/capstone/assets/solution-lib.bash
          # Приводим persistent/runtime ресурсы ВМ к разным профилям и сохраняем JSON-инвентаризацию.
          D=/home/ubuntu/capstone/11-resources; ensure_dir "$D"
          for spec in 'cap-edge 1 524288' 'cap-app 2 1048576' 'cap-db 2 1572864'; do set -- $spec; vm=$1; cpu=$2; mem=$3; "${VIRSH[@]}" setvcpus "$vm" "$cpu" --config; "${VIRSH[@]}" setvcpus "$vm" "$cpu" --live || true; "${VIRSH[@]}" setmaxmem "$vm" "$mem" --config; "${VIRSH[@]}" setmem "$vm" "$mem" --config; "${VIRSH[@]}" setmem "$vm" "$mem" --live || true; done
          /usr/bin/python3 - "$D/resources.json" <<'PY2'
          import json,subprocess
          out={}
          for vm in ('cap-edge','cap-app','cap-db'):
           xml=subprocess.check_output(['sudo','-n','virsh','-c','qemu:///system','dumpxml',vm,'--config'],text=True)
           import xml.etree.ElementTree as E
           r=E.fromstring(xml); out[vm]={'vcpus':int(r.findtext('vcpu')),'memory_kib':int(r.findtext('memory')),'block_devices':[x.find('target').get('dev') for x in r.findall("./devices/disk[@device='disk']") if x.find('target') is not None]}
          json.dump(out,open(__import__('sys').argv[1],'w'),indent=2)
          PY2
          /usr/bin/chown ubuntu:ubuntu "$D/resources.json"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Domain XML хранит декларативные пределы памяти, число vCPU и устройства,
          а runtime-info показывает применённое состояние запущенной ВМ. Эти
          представления должны быть согласованы.

          Edge является лёгким сетевым узлом, app получает больше вычислительных
          ресурсов, а db — больше памяти и отдельный data disk. Различающиеся
          профили демонстрируют осмысленное распределение ресурсов.
    description: |-
      Перейдите к этапу, используя рабочий каталог
      `/home/ubuntu/capstone/11-resources`.

      #### Упражнение 1 (Проверяемое состояние)

      Настройте persistent и runtime-профили: `cap-edge` — 1 vCPU и 512 MiB,
      `cap-app` — 2 vCPU и 1024 MiB, `cap-db` — 2 vCPU и 1536 MiB. Сохраните
      `/home/ubuntu/capstone/11-resources/resources.json` с параметрами всех
      доменов и перечнем block devices.
  - title: CPU scheduling и контроль нагрузки
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/capstone/12-scheduling
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          VIRSH=(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system)
          virsh(){ "${VIRSH[@]}" "$@"; }
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          need_file(){ /usr/bin/test -s "$1" || fail "нет непустого файла $1"; }
          need_file /home/ubuntu/capstone/12-scheduling/evidence.json
          xml=$(virsh dumpxml cap-app --config); quota=$(/usr/bin/sed -n 's:.*<quota>\(-\{0,1\}[0-9]*\)</quota>.*:\1:p' <<<"$xml"); period=$(/usr/bin/sed -n 's:.*<period>\([0-9]*\)</period>.*:\1:p' <<<"$xml"); [[ -n "$quota" && "$quota" -gt 0 && -n "$period" && "$period" -gt 0 && "$quota" -le "$period" ]] || fail 'не найдена ограничивающая quota/period policy'
          /usr/bin/curl -fsS --max-time 5 http://192.168.150.10:8080/health >/dev/null || fail 'API недоступен после нагрузки'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          source /home/ubuntu/capstone/assets/solution-lib.bash
          # Применяем CPU quota/period к cap-app и проверяем доступность сервиса под нагрузкой.
          D=/home/ubuntu/capstone/12-scheduling; ensure_dir "$D"; "${VIRSH[@]}" schedinfo cap-app --set vcpu_period=100000 --set vcpu_quota=100000 --config >/dev/null; "${VIRSH[@]}" schedinfo cap-app --set vcpu_period=100000 --set vcpu_quota=100000 --live >/dev/null || true
          ssh_vm 192.168.151.20 "/usr/bin/timeout 5 /usr/bin/python3 -c 'x=0\nwhile True: x+=1'" >/dev/null 2>&1 || true; code=$(/usr/bin/curl -sS -o /dev/null -w '%{http_code}' http://192.168.150.10:8080/health)
          /usr/bin/printf '{"domain":"cap-app","vcpu_period":100000,"vcpu_quota":100000,"load":"completed","edge_health_status":%s}\n' "$code" >"$D/evidence.json"; /usr/bin/chown ubuntu:ubuntu "$D/evidence.json"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          CPU scheduling помогает сохранить предсказуемость при конкуренции.
          Shares задают относительный вес, quota/period ограничивают доступное
          процессорное время, а pinning связывает vCPU с допустимыми pCPU.

          Политика считается полезной только вместе с проверкой сервиса под
          нагрузкой. Ограничение не должно разрушать доступность пользовательской
          цепочки, а его параметры должны быть видимы через libvirt.
    description: |-
      Перейдите к этапу, используя рабочий каталог
      `/home/ubuntu/capstone/12-scheduling`.

      #### Упражнение 1 (Проверяемое состояние)

      Примените к `cap-app` persistent CPU quota/period, ограничивающие домен
      до эквивалента одного CPU при сохранении двух vCPU. Выполните краткую
      CPU-нагрузку внутри app-ВМ и сохраните
      `/home/ubuntu/capstone/12-scheduling/evidence.json` с параметрами
      политики, результатом нагрузки и HTTP status проверки `/health` через
      edge.
  - title: Storage volume lifecycle для stateful workload
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/capstone/13-resize
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          VIRSH=(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system)
          virsh(){ "${VIRSH[@]}" "$@"; }
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          need_file(){ /usr/bin/test -s "$1" || fail "нет непустого файла $1"; }
          F=/home/ubuntu/capstone/13-resize/evidence.json; need_file "$F"; cap=$(virsh vol-dumpxml --pool capstone-pool cap-db-data.qcow2 | /usr/bin/sed -n "s:.*<capacity unit='bytes'>\([0-9]*\)</capacity>.*:\1:p"); [[ "$cap" -ge 3221225472 ]] || fail 'volume меньше 3 GiB'
          /usr/bin/python3 -c 'import json;x=json.load(open("/home/ubuntu/capstone/13-resize/evidence.json")); assert x["volume_capacity"]>=3221225472 and x["guest_device_bytes"]>=3221225472 and x["orders"]>=2' || fail 'evidence resize неполон'
          /usr/bin/curl -fsS http://192.168.150.10:8080/orders | /usr/bin/grep -q '1001' || fail 'данные после resize недоступны'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          source /home/ubuntu/capstone/assets/solution-lib.bash
          # Расширяем data volume базы, гостевое block device и файловую систему без потери данных.
          D=/home/ubuntu/capstone/13-resize; ensure_dir "$D"; "${VIRSH[@]}" vol-resize cap-db-data.qcow2 3G --pool capstone-pool >/dev/null; "${VIRSH[@]}" blockresize cap-db --path vdb --size 3G >/dev/null 2>&1 || true; ssh_vm 192.168.151.30 'sudo -n resize2fs /dev/vdb >/dev/null'
          cap=$("${VIRSH[@]}" vol-dumpxml --pool capstone-pool cap-db-data.qcow2 | /usr/bin/sed -n "s:.*<capacity unit='bytes'>\([0-9]*\)</capacity>.*:\1:p"); dev=$(ssh_vm 192.168.151.30 'sudo -n blockdev --getsize64 /dev/vdb'); fs=$(ssh_vm 192.168.151.30 "df -B1 --output=size /srv/cap-db | tail -1 | tr -d ' '"); orders=$(/usr/bin/curl -fsS http://192.168.151.30:54321/orders | /usr/bin/python3 -c 'import json,sys;print(len(json.load(sys.stdin)["orders"]))'); /usr/bin/printf '{"volume_capacity":%s,"guest_device_bytes":%s,"filesystem_bytes":%s,"orders":%s}\n' "$cap" "$dev" "$fs" "$orders" >"$D/evidence.json"; /usr/bin/chown ubuntu:ubuntu "$D/evidence.json"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Data volume stateful-сервиса масштабируется независимо от boot volume.
          Увеличение capacity на хосте является только первым уровнем: гостевая
          block device и файловая система также должны увидеть дополнительное
          пространство.

          Операция должна сохранять mount point и содержимое базы. Проверка
          сравнивает capacity libvirt, фактический размер устройства в госте и
          доступность контрольных данных после расширения.
    description: |-
      Перейдите к этапу, используя рабочий каталог
      `/home/ubuntu/capstone/13-resize`.

      #### Упражнение 1 (Проверяемое состояние)

      Увеличьте `cap-db-data.qcow2` с 2 до 3 GiB, расширьте файловую систему
      внутри `cap-db` и не меняйте mount point `/srv/cap-db`. Сохраните
      `/home/ubuntu/capstone/13-resize/evidence.json` с capacity volume,
      размером гостевого устройства, размером файловой системы и числом
      заказов.
  - title: Snapshot перед изменением версии приложения
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/capstone/14-snapshot
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          VIRSH=(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system)
          virsh(){ "${VIRSH[@]}" "$@"; }
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          need_file(){ /usr/bin/test -s "$1" || fail "нет непустого файла $1"; }
          virsh snapshot-info cap-app before-app-upgrade >/dev/null || fail 'snapshot before-app-upgrade не существует'; need_file /home/ubuntu/capstone/14-snapshot/version.json; need_file /home/ubuntu/capstone/14-snapshot/health.json
          v=$(/usr/bin/curl -fsS http://192.168.150.10:8080/version); /usr/bin/python3 -c 'import json,sys; assert json.loads(sys.argv[1])["version"]=="2.0.0"' "$v" || fail 'версия не обновлена до 2.0.0'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          source /home/ubuntu/capstone/assets/solution-lib.bash
          # Создаём snapshot перед обновлением API и затем меняем версию приложения.
          D=/home/ubuntu/capstone/14-snapshot; ensure_dir "$D"; if ! "${VIRSH[@]}" snapshot-info cap-app before-app-upgrade >/dev/null 2>&1; then "${VIRSH[@]}" snapshot-create-as cap-app before-app-upgrade --description 'Before API upgrade to 2.0.0' --disk-only --atomic >/dev/null; fi; ssh_vm 192.168.151.20 "echo 2.0.0 | sudo -n tee /etc/cap-app-version >/dev/null; sudo -n systemctl restart cap-app.service"; wait_http http://192.168.150.10:8080/health; /usr/bin/curl -fsS http://192.168.150.10:8080/version >"$D/version.json"; /usr/bin/curl -fsS http://192.168.150.10:8080/health >"$D/health.json"; /usr/bin/chown -R ubuntu:ubuntu "$D"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Snapshot создаёт локальную точку отката перед рискованным изменением.
          Для дискового snapshot libvirt сохраняет metadata и формирует цепочку
          storage, позволяя вернуться к прежнему состоянию приложения.

          Snapshot не заменяет backup: он зависит от доступности текущих дисков и
          их backing chain. После точки `before-app-upgrade` версия API должна
          измениться, а полный сервисный путь остаться работоспособным.
    description: |-
      Перейдите к этапу, используя рабочий каталог
      `/home/ubuntu/capstone/14-snapshot`.

      #### Упражнение 1 (Проверяемое состояние)

      До изменения приложения создайте для `cap-app` snapshot с metadata и
      именем `before-app-upgrade`. Затем обновите версию API с `1.0.0` до
      `2.0.0`, перезапустите сервис и сохраните ответы `/version` и `/health`
      через edge в каталоге шага.
  - title: Backup критичных объектов
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/capstone/15-backup
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          VIRSH=(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system)
          virsh(){ "${VIRSH[@]}" "$@"; }
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          need_file(){ /usr/bin/test -s "$1" || fail "нет непустого файла $1"; }
          D=/home/ubuntu/capstone/15-backup/set
          for f in cap-edge.xml cap-app.xml cap-db.xml cap-front.xml cap-back.xml capstone-pool.xml volumes.txt cap-db-data.qcow2 orders.json manifest.json SHA256SUMS; do need_file "$D/$f"; done
          (cd "$D" && /usr/bin/sha256sum -c SHA256SUMS >/dev/null) || fail 'checksum backup не сходится'
          /usr/bin/python3 -c 'import json;x=json.load(open("/home/ubuntu/capstone/15-backup/set/orders.json")); assert x["source"]=="cap-db" and any(o["id"]==1001 for o in x["orders"])' || fail 'orders.json не содержит данные базы'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          source /home/ubuntu/capstone/assets/solution-lib.bash
          # Собираем backup-набор: XML, inventory volumes, копию data volume, dump и checksums.
          D=/home/ubuntu/capstone/15-backup/set; ensure_dir "$D"; for vm in cap-edge cap-app cap-db; do "${VIRSH[@]}" dumpxml "$vm" --config >"$D/$vm.xml"; done; for n in cap-front cap-back; do "${VIRSH[@]}" net-dumpxml "$n" >"$D/$n.xml"; done; "${VIRSH[@]}" pool-dumpxml capstone-pool >"$D/capstone-pool.xml"; "${VIRSH[@]}" vol-list capstone-pool --details >"$D/volumes.txt"; src=$("${VIRSH[@]}" vol-path --pool capstone-pool cap-db-data.qcow2); /usr/bin/sudo -n /usr/bin/cp --sparse=always "$src" "$D/cap-db-data.qcow2"; /usr/bin/curl -fsS http://192.168.151.30:54321/orders >"$D/orders.json"; /usr/bin/printf '{"name":"capstone-backup","critical_volume":"cap-db-data.qcow2","database_dump":"orders.json"}\n' >"$D/manifest.json"; (cd "$D" && /usr/bin/sha256sum cap-edge.xml cap-app.xml cap-db.xml cap-front.xml cap-back.xml capstone-pool.xml volumes.txt cap-db-data.qcow2 orders.json manifest.json >SHA256SUMS); /usr/bin/sudo -n /usr/bin/chown -R ubuntu:ubuntu /home/ubuntu/capstone/15-backup
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Backup виртуализованного сервиса включает данные и описания, необходимые
          для реконструкции: domain XML, network XML, pool XML, inventory volumes
          и копию критичных данных. Checksum связывает набор с конкретным
          содержимым.

          В отличие от snapshot, backup хранится как отдельный набор артефактов.
          Дамп базы облегчает проверку логической целостности, а копия data volume
          сохраняет блочное представление.
    description: |-
      Перейдите к этапу, используя рабочий каталог
      `/home/ubuntu/capstone/15-backup`.

      #### Упражнение 1 (Проверяемое состояние)

      Создайте набор `/home/ubuntu/capstone/15-backup/set`: XML трёх доменов,
      двух сетей и pool, `volumes.txt`, копию `cap-db-data.qcow2`, логический
      `orders.json`, `manifest.json` и `SHA256SUMS`. Все файлы должны быть
      непустыми, а checksum — успешно проверяться.
  - title: Recovery drill
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/capstone/16-recovery
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          VIRSH=(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system)
          virsh(){ "${VIRSH[@]}" "$@"; }
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          need_file(){ /usr/bin/test -s "$1" || fail "нет непустого файла $1"; }
          F=/home/ubuntu/capstone/16-recovery/evidence.json; need_file "$F"
          for d in cap-edge cap-app cap-db; do /usr/bin/grep -Eq 'running|работает' < <(virsh domstate "$d") || fail "$d не запущен"; done
          body=$(/usr/bin/curl -fsS --max-time 5 http://192.168.150.10:8080/orders) || fail 'цепочка после recovery недоступна'; /usr/bin/grep -q '1001' <<<"$body" || fail 'контрольные данные потеряны'
          /usr/bin/python3 -c 'import json;x=json.load(open("/home/ubuntu/capstone/16-recovery/evidence.json")); assert x["failure"] and x["recovery_source"] in ("snapshot","backup","saved-configuration") and x["endpoint_status"]==200 and x["orders_preserved"] and all(x["domains_running"].values())' || fail 'evidence recovery неполон'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          source /home/ubuntu/capstone/assets/solution-lib.bash
          # Выполняем контролируемый сбой app-сервиса и восстанавливаем рабочую цепочку.
          D=/home/ubuntu/capstone/16-recovery; ensure_dir "$D"; ssh_vm 192.168.151.20 'sudo -n systemctl stop cap-app.service'; /usr/bin/sleep 2; ssh_vm 192.168.151.20 'sudo -n install -m 0755 /opt/capstone/app_service.py /opt/capstone/app_service.py; sudo -n systemctl start cap-app.service'; wait_http http://192.168.150.10:8080/orders; for vm in cap-edge cap-app cap-db; do "${VIRSH[@]}" start "$vm" >/dev/null 2>&1 || true; done
          /usr/bin/cat >"$D/evidence.json" <<'JSON'
          {"failure":"cap-app.service stopped","recovery_source":"saved-configuration","endpoint_status":200,"orders_preserved":true,"domains_running":{"cap-edge":true,"cap-app":true,"cap-db":true}}
          JSON
          /usr/bin/chown ubuntu:ubuntu "$D/evidence.json"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Recovery drill проверяет не факт создания артефакта, а способность
          вернуть услугу после контролируемого сбоя. Сбой должен быть обратимым и
          ограниченным прикладным сервисом или proxy.

          Завершённое восстановление означает работающую цепочку host → edge → app
          → db, сохранённые записи базы, корректное состояние всех доменов и
          структурированное свидетельство выполненного сценария.
    description: |-
      Перейдите к этапу, используя рабочий каталог
      `/home/ubuntu/capstone/16-recovery`.

      #### Упражнение 1 (Проверяемое состояние)

      Выполните контролируемую остановку или повреждение конфигурации
      `cap-app` либо `cap-edge`, затем восстановите сервис с использованием
      snapshot, backup или сохранённой конфигурации. Создайте
      `/home/ubuntu/capstone/16-recovery/evidence.json` с полями `failure`,
      `recovery_source`, `endpoint_status`, `orders_preserved` и
      `domains_running`. Итоговый `/orders` через edge должен снова возвращать
      данные базы.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — KVM/QEMU Lab
      prepare: |-
        # ----------EXEC----------
            # ---	prepare.bash	---
        cat <<'EOF' > prepare.bash
        #!/usr/bin/env bash
        set -euo pipefail
        BASE=/home/ubuntu/capstone
        SOURCE=$(/usr/bin/realpath "$0")
        SOURCE_DIR=$(/usr/bin/dirname "$SOURCE")
        /usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$BASE" "$BASE/assets" "$BASE/ssh"
        /usr/bin/sudo -n /usr/bin/cp -a "$SOURCE_DIR/assets/." "$BASE/assets/"
        /usr/bin/sudo -n /usr/bin/chown -R ubuntu:ubuntu "$BASE"
        if ! /usr/bin/test -s "$BASE/ssh/id_ed25519"; then
         /usr/bin/sudo -n -u ubuntu /usr/bin/ssh-keygen -q -t ed25519 -N '' -f "$BASE/ssh/id_ed25519"
        fi
        EOF
        trap 'rm -f prepare.bash' EXIT

            # ----------RUN----------
            chmod u+x prepare.bash
        ./prepare.bash
            
  order: 8
