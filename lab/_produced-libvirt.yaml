          `pool-define-as` создаёт persistent definition storage pool, но не
          запускает backend. Поэтому объект появляется в metadata libvirt как
          inactive до отдельной команды `pool-start`.

          Это отличие важно для lifecycle: persistent pool можно
          build/start/destroy/undefine независимо от данных в target directory.
