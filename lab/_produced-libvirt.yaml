          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/emulator-global-quota
          STATE_DIR=/home/ubuntu/.libvirt-cpu-scheduling
          fail(){ /usr/bin/printf 'Ошибка: %s
          ' "$1" >&2; exit 1; }
