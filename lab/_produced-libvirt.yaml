          # Публикуем API через edge reverse proxy на frontend-адресе.
          D=/home/ubuntu/capstone/09-edge; ensure_dir "$D"; wait_ssh 192.168.150.10; scp_vm /home/ubuntu/capstone/assets/edge_proxy.py 192.168.150.10 /tmp/edge_proxy.py; scp_vm /home/ubuntu/capstone/assets/cap-edge.service 192.168.150.10 /tmp/cap-edge.service
