          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/capstone/08-api
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
