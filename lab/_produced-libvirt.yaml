      три endpoint, а ответ `/orders` должен содержать признаки `cap-app`,
      `cap-db` и контрольную запись `1001`. Сохраните ответы в каталоге шага.
  - title: Проверка сетевой изоляции и service discovery
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/capstone/10-isolation
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          VIRSH=(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system)
          virsh(){ "${VIRSH[@]}" "$@"; }
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          need_file(){ /usr/bin/test -s "$1" || fail "нет непустого файла $1"; }
          F=/home/ubuntu/capstone/10-isolation/evidence.json; need_file "$F"
          for d in cap-app cap-db; do xml=$(virsh dumpxml "$d" --config); ! /usr/bin/grep -q "network='cap-front'" <<<"$xml" || fail "$d не должен иметь frontend-интерфейс"; done
          /usr/bin/python3 - "$F" <<'PY2'
          import json
          x=json.load(open('/home/ubuntu/capstone/10-isolation/evidence.json'))
          assert x['entrypoint']=='http://192.168.150.10:8080'
          assert x['nodes']['cap-app']['front'] is None and x['nodes']['cap-db']['front'] is None
          assert x['edge_check']['status']==200 and x['app_db_check']['source']=='cap-db'
          PY2
          /usr/bin/curl -fsS --max-time 5 http://192.168.150.10:8080/orders >/dev/null || fail 'entrypoint не работает'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          source /home/ubuntu/capstone/assets/solution-lib.bash
          # Фиксируем evidence сетевой сегментации и успешный entrypoint через cap-edge.
          D=/home/ubuntu/capstone/10-isolation; ensure_dir "$D"; orders=$(/usr/bin/curl -fsS http://192.168.150.10:8080/orders); db=$(/usr/bin/curl -fsS http://192.168.151.30:54321/orders)
          /usr/bin/python3 - "$D/evidence.json" "$orders" "$db" <<'PY2'
          import json,sys
          orders,db=map(json.loads,sys.argv[2:])
          x={'entrypoint':'http://192.168.150.10:8080','nodes':{'cap-edge':{'front':'192.168.150.10','back':'192.168.151.10'},'cap-app':{'front':None,'back':'192.168.151.20'},'cap-db':{'front':None,'back':'192.168.151.30'}},'edge_check':{'status':200,'source':orders['source']},'app_db_check':{'status':200,'source':db['source']}}
          json.dump(x,open(sys.argv[1],'w'),indent=2)
          PY2
          /usr/bin/chown ubuntu:ubuntu "$D/evidence.json"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
