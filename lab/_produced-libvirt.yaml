        hints: |-
          Помимо vCPU, libvirt может управлять CPU time служебных потоков QEMU:
          emulator threads, global domain group и IOThreads. Эти лимиты полезны,
          когда VM выполняет много I/O и служебные потоки начинают конкурировать с
          vCPU или соседними доменами.

          Поддержка конкретных ключей зависит от libvirt, QEMU, cgroups v1/v2 и
          драйвера. Поэтому корректная лабораторная процедура сначала пытается
          задать безопасные значения, а затем сохраняет либо новые параметры, либо
          диагностический файл с ошибкой unsupported.

          #### Пример 1

          ``` bash
          sudo -n virsh -c qemu:///system schedinfo lab-vm --set emulator_period=100000 --set emulator_quota=80000 --live --config
          sudo -n virsh -c qemu:///system schedinfo lab-vm --set global_period=100000 --set global_quota=90000 --live --config
          ```
    description: |-
      Перейдите в каталог `~/emulator-global-quota`.

      #### Упражнение 1 (Настройка служебных CPU limits)

      Сохраните baseline и попробуйте задать безопасную emulator quota:

      ``` bash
      sudo -n virsh -c qemu:///system schedinfo lab-vm > schedinfo-before.txt
      sudo -n virsh -c qemu:///system schedinfo lab-vm \
        --set emulator_period=100000 --set emulator_quota=80000 \
        --live --config > quota-set.txt 2> quota-error.txt || true
      ```

      Если `emulator_period` не поддерживается, попробуйте global quota и
      добавьте диагностику в тот же файл:

      ``` bash
      sudo -n virsh -c qemu:///system schedinfo lab-vm \
        --set global_period=100000 --set global_quota=90000 \
        --live --config >> quota-set.txt 2>> quota-error.txt || true
      sudo -n virsh -c qemu:///system schedinfo lab-vm > schedinfo-after.txt
      sudo -n virsh -c qemu:///system dumpxml lab-vm > domain.xml
      ```

      При успехе удалите пустой `quota-error.txt`; при неподдерживаемом
      параметре оставьте в нём сообщение libvirt.
