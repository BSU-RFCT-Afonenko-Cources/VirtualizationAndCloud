  order: 2
- title: 'Libvirt networking: managed networks, DHCP/DNS, bridge/tap, QoS'
  description: |-
    Лабораторная работа посвящена managed networks в libvirt/QEMU/KVM:
    NAT-сегментам, изолированным backend-сетям, DHCP/DNS, диагностике
    bridge/tap, hotplug интерфейсов, QoS и базовой изоляции портов или
    nwfilter.

    В работе используются только объекты с префиксом `lab-`: сети `lab-nat`
    и `lab-private`, bridges `virbr10` и `virbr20`, тестовый домен `lab-vm`,
    MAC-адреса `52:54:00:aa:*`. Все действия рассчитаны на учебную VM и не
    изменяют сетевую конфигурацию хоста вне libvirt managed networks.
  time-limit-minutes: 180
  steps:
  - title: Исследование сети default
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/inspect-default-network
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/inspect-default-network
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for f in net-list.txt net-info-default.txt default.xml virbr0-addr.txt default-leases.txt; do
            /usr/bin/test -s "$DIR/$f" || fail "нет непустого файла $DIR/$f"
          done
          /usr/bin/grep -q '<network' "$DIR/default.xml" || fail 'default.xml должен содержать элемент <network> или диагностическую XML-заглушку'
          if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-info default >/var/tmp/lab-default-info 2>/dev/null; then
            /usr/bin/grep -Eq '^(Active|Активна):[[:space:]]+yes|^Active:[[:space:]]+yes|^Активна:[[:space:]]+да' /var/tmp/lab-default-info || fail 'сеть default есть, но не активна; запустите её или явно зафиксируйте диагностику'
            /usr/bin/grep -q '<name>default</name>' "$DIR/default.xml" || fail 'default.xml не похож на XML сети default'
            if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-dumpxml default | /usr/bin/grep -q "<forward mode='nat'"; then
              /usr/bin/grep -q "<forward mode='nat'" "$DIR/default.xml" || fail "для NAT-сети default в XML должен быть <forward mode='nat'>"
            fi
          else
            /usr/bin/grep -qi 'absent\|нет\|missing' "$DIR/net-info-default.txt" || fail 'если default отсутствует, net-info-default.txt должен содержать понятную диагностику'
          fi
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/inspect-default-network
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-list --all >"$DIR/net-list.txt"
          if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-info default >"$DIR/net-info-default.txt" 2>&1; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-dumpxml default >"$DIR/default.xml"
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-dhcp-leases default >"$DIR/default-leases.txt" 2>&1 || /usr/bin/printf 'no leases or default network is absent\n' >"$DIR/default-leases.txt"
          else
            /usr/bin/printf 'default network is absent\n' >"$DIR/net-info-default.txt"
            /usr/bin/printf '<network><name>default-absent</name></network>\n' >"$DIR/default.xml"
            /usr/bin/printf 'no leases or default network is absent\n' >"$DIR/default-leases.txt"
          fi
          /usr/sbin/ip addr show virbr0 >"$DIR/virbr0-addr.txt" 2>&1 || /usr/bin/printf 'virbr0 is absent\n' >"$DIR/virbr0-addr.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Стандартная сеть `default` в libvirt обычно является managed NAT-сетью:
          libvirt создаёт bridge `virbr0`, запускает для него dnsmasq и добавляет
          правила трансляции адресов на хосте. Для гостевых ВМ такая сеть выглядит
          как простой локальный cloud-like сегмент с DHCP, DNS и исходящим
          доступом наружу через хост.

          Важно отличать состояние сети в libvirt от состояния устройств Linux.
          `virsh net-info` показывает lifecycle libvirt-сети, `net-dumpxml` —
          persistent/current XML, а `ip addr show virbr0` показывает, создан ли
          bridge в ядре и какой адрес назначен интерфейсу.

          #### Пример 1 (Информация о сети)

          ``` bash
          sudo -n virsh -c qemu:///system net-info default
          ```

          #### Пример 2 (XML managed network)

          ``` bash
          sudo -n virsh -c qemu:///system net-dumpxml default
          ```
    description: |-
      Перейдите в каталог `~/inspect-default-network` и сохраните
      диагностические выводы о сети `default`.

      #### Упражнение 1 (Исследование сети default)

      Создайте файлы:

      - `net-list.txt` — вывод
        `sudo -n virsh -c qemu:///system net-list --all`;
      - `net-info-default.txt` — вывод
        `sudo -n virsh -c qemu:///system net-info default`, либо строку
        `default network is absent`, если сети нет;
      - `default.xml` — вывод
        `sudo -n virsh -c qemu:///system net-dumpxml default`, либо
        XML-заглушку `<network><name>default-absent</name></network>`, если
        сети нет;
      - `virbr0-addr.txt` — вывод `ip addr show virbr0`, либо строку
        `virbr0 is absent`, если bridge отсутствует;
      - `default-leases.txt` — вывод
        `sudo -n virsh -c qemu:///system net-dhcp-leases default`, либо строку
        `no leases or default network is absent`.
  - title: Генерация NAT network XML
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/nat-network-xml
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          XML=/home/ubuntu/nat-network-xml/lab-nat.xml
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          /usr/bin/test -s "$XML" || fail "нет файла $XML"
          if /usr/bin/command -v /usr/bin/xmllint >/dev/null 2>&1; then
            /usr/bin/xmllint --noout "$XML" >/dev/null 2>&1 || fail 'XML не проходит xmllint --noout'
            name=$(/usr/bin/xmllint --xpath 'string(/network/name)' "$XML")
            forward=$(/usr/bin/xmllint --xpath 'string(/network/forward/@mode)' "$XML")
            bridge=$(/usr/bin/xmllint --xpath 'string(/network/bridge/@name)' "$XML")
            start=$(/usr/bin/xmllint --xpath 'string(/network/ip/dhcp/range/@start)' "$XML")
            end=$(/usr/bin/xmllint --xpath 'string(/network/ip/dhcp/range/@end)' "$XML")
            host=$(/usr/bin/xmllint --xpath "string(/network/ip/dhcp/host[@mac='52:54:00:aa:10:01']/@ip)" "$XML")
          else
            /usr/bin/python3 - <<'PY' "$XML" >/var/tmp/lab-nat-xml-values
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          print(root.findtext('name') or '')
          f = root.find('forward')
          b = root.find('bridge')
          print(f.get('mode','') if f is not None else '')
          print(b.get('name','') if b is not None else '')
          r = root.find('ip/dhcp/range')
          print(r.get('start','') if r is not None else '')
          print(r.get('end','') if r is not None else '')
          print(next((h.get('ip','') for h in root.findall('ip/dhcp/host') if h.get('mac') == '52:54:00:aa:10:01'), ''))
          PY
            name=$(/usr/bin/sed -n '1p' /var/tmp/lab-nat-xml-values)
            forward=$(/usr/bin/sed -n '2p' /var/tmp/lab-nat-xml-values)
            bridge=$(/usr/bin/sed -n '3p' /var/tmp/lab-nat-xml-values)
            start=$(/usr/bin/sed -n '4p' /var/tmp/lab-nat-xml-values)
            end=$(/usr/bin/sed -n '5p' /var/tmp/lab-nat-xml-values)
            host=$(/usr/bin/sed -n '6p' /var/tmp/lab-nat-xml-values)
          fi
          /usr/bin/test "$name" = lab-nat || fail 'name должен быть lab-nat'
          /usr/bin/test "$forward" = nat || fail 'forward mode должен быть nat'
          /usr/bin/test "$bridge" = virbr10 || fail 'bridge name должен быть virbr10'
          /usr/bin/test "$start" = 192.168.100.100 || fail 'DHCP range start должен быть 192.168.100.100'
          /usr/bin/test "$end" = 192.168.100.200 || fail 'DHCP range end должен быть 192.168.100.200'
          /usr/bin/test "$host" = 192.168.100.10 || fail 'нет host reservation 52:54:00:aa:10:01 -> 192.168.100.10'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/nat-network-xml
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /bin/cat >"$DIR/lab-nat.xml" <<'XML'
          <network>
            <name>lab-nat</name>
            <forward mode='nat'/>
            <bridge name='virbr10' stp='on' delay='0'/>
            <ip address='192.168.100.1' netmask='255.255.255.0'>
              <dhcp>
                <range start='192.168.100.100' end='192.168.100.200'/>
                <host mac='52:54:00:aa:10:01' name='lab-vm-nat' ip='192.168.100.10'/>
              </dhcp>
            </ip>
          </network>
          XML
          /usr/bin/chown ubuntu:ubuntu "$DIR/lab-nat.xml"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Network XML — декларативное описание managed network libvirt. Для
          NAT-сети в XML указывают имя сети, имя Linux bridge, режим forwarding
          `nat`, адрес bridge в подсети и DHCP-диапазон, который libvirt передаёт
          dnsmasq.

          Статическая DHCP-запись в секции `<host>` связывает MAC-адрес гостя с
          постоянным IP внутри managed network. Это удобно для лабораторных
          топологий: адрес интерфейса ВМ можно проверять через `net-dhcp-leases` и
          `domifaddr` без ручной настройки гостя.

          #### Пример 1 (Проверка имени сети через XPath)

          ``` bash
          xmllint --xpath 'string(/network/name)' lab-nat.xml
          ```
    description: |-
      Перейдите в каталог `~/nat-network-xml` и создайте файл `lab-nat.xml`.

      #### Упражнение 1 (XML NAT-сети lab-nat)

      Опишите network XML со следующими параметрами:

      - имя сети: `lab-nat`;
      - bridge: `virbr10`;
      - forwarding: `<forward mode='nat'/>`;
      - адрес bridge: `192.168.100.1`, маска `255.255.255.0`;
      - DHCP range: `192.168.100.100` — `192.168.100.200`;
      - статическая запись DHCP для MAC `52:54:00:aa:10:01`, имя `lab-vm-nat`,
        IP `192.168.100.10`.
  - title: Определение, запуск и autostart NAT-сети
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/start-nat-network
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/start-nat-network
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for f in net-list.txt net-info-lab-nat.txt lab-nat-active.xml virbr10-link.txt; do /usr/bin/test -s "$DIR/$f" || fail "нет непустого файла $DIR/$f"; done
          info=$(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-info lab-nat 2>/dev/null) || fail 'сеть lab-nat не определена'
          /bin/echo "$info" | /usr/bin/grep -Eq 'Active:[[:space:]]+yes|Активна:[[:space:]]+да|Активна:[[:space:]]+yes' || fail 'lab-nat должна быть active'
          /bin/echo "$info" | /usr/bin/grep -Eq 'Persistent:[[:space:]]+yes|Постоянная:[[:space:]]+да|Постоянная:[[:space:]]+yes' || fail 'lab-nat должна быть persistent'
          /bin/echo "$info" | /usr/bin/grep -Eq 'Autostart:[[:space:]]+yes|Автозапуск:[[:space:]]+да|Автозапуск:[[:space:]]+yes' || fail 'lab-nat должна иметь autostart'
          /usr/sbin/ip link show virbr10 >/dev/null 2>&1 || fail 'bridge virbr10 не существует'
          /usr/bin/grep -q '<name>lab-nat</name>' "$DIR/lab-nat-active.xml" || fail 'lab-nat-active.xml должен содержать lab-nat'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/start-nat-network
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          if /usr/bin/test -f /home/ubuntu/nat-network-xml/lab-nat.xml; then
            /bin/cp /home/ubuntu/nat-network-xml/lab-nat.xml "$DIR/lab-nat.xml"
          else
            /bin/cat >"$DIR/lab-nat.xml" <<'XML'
          <network><name>lab-nat</name><forward mode='nat'/><bridge name='virbr10' stp='on' delay='0'/><ip address='192.168.100.1' netmask='255.255.255.0'><dhcp><range start='192.168.100.100' end='192.168.100.200'/><host mac='52:54:00:aa:10:01' name='lab-vm-nat' ip='192.168.100.10'/></dhcp></ip></network>
          XML
          fi
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-info lab-nat >/dev/null 2>&1; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-define "$DIR/lab-nat.xml"
          fi
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-info lab-nat | /usr/bin/grep -Eq 'Active:[[:space:]]+yes|Активна:[[:space:]]+да|Активна:[[:space:]]+yes'; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-start lab-nat
          fi
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-autostart lab-nat
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-list --all >"$DIR/net-list.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-info lab-nat >"$DIR/net-info-lab-nat.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-dumpxml lab-nat >"$DIR/lab-nat-active.xml"
          /usr/sbin/ip link show virbr10 >"$DIR/virbr10-link.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          `virsh net-define` создаёт persistent network из XML, но не включает её.
          `virsh net-start` переводит сеть в active runtime-состояние: libvirt
          создаёт bridge, запускает dnsmasq и применяет правила forwarding.
          `virsh net-autostart` добавляет сеть в набор объектов, которые libvirt
          поднимает после запуска daemon.

          Этот lifecycle-паттерн похож на domains и storage pools:
          persistent-конфигурация хранится отдельно от текущего active-состояния.
          В диагностике всегда проверяйте оба уровня: `net-info` и наличие bridge
          в `ip link`.

          #### Пример 1 (Определить и запустить сеть)

          ``` bash
          sudo -n virsh -c qemu:///system net-define lab-nat.xml
          sudo -n virsh -c qemu:///system net-start lab-nat
          ```
    description: |-
      Перейдите в каталог `~/start-nat-network`. Скопируйте или создайте в нём
      `lab-nat.xml` из предыдущего шага.

      #### Упражнение 1 (Запуск NAT-сети lab-nat)

      Выполните:

      ``` bash
      sudo -n virsh -c qemu:///system net-define lab-nat.xml
      sudo -n virsh -c qemu:///system net-start lab-nat
      sudo -n virsh -c qemu:///system net-autostart lab-nat
      ```

      Сохраните файлы `net-list.txt`, `net-info-lab-nat.txt`,
      `lab-nat-active.xml` и `virbr10-link.txt` с выводом соответствующих
      команд `net-list --all`, `net-info lab-nat`, `net-dumpxml lab-nat`,
      `ip link show virbr10`.
  - title: Isolated backend-сеть
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/isolated-network
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/isolated-network
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for f in lab-private.xml net-info-lab-private.txt lab-private-active.xml virbr20-addr.txt; do /usr/bin/test -s "$DIR/$f" || fail "нет непустого файла $DIR/$f"; done
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-info lab-private >/var/tmp/lab-private-info 2>/dev/null || fail 'сеть lab-private не определена'
          /usr/bin/grep -Eq 'Active:[[:space:]]+yes|Активна:[[:space:]]+да|Активна:[[:space:]]+yes' /var/tmp/lab-private-info || fail 'lab-private должна быть active'
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-dumpxml lab-private >/var/tmp/lab-private.xml
          ! /usr/bin/grep -q '<forward' /var/tmp/lab-private.xml || fail 'isolated сеть не должна содержать <forward>'
          /usr/sbin/ip addr show virbr20 | /usr/bin/grep -q '10\.20\.0\.1/24' || fail 'virbr20 должен иметь адрес 10.20.0.1/24'
          /usr/bin/grep -q '<name>lab-private</name>' "$DIR/lab-private-active.xml" || fail 'lab-private-active.xml должен содержать XML сети'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/isolated-network
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /bin/cat >"$DIR/lab-private.xml" <<'XML'
          <network>
            <name>lab-private</name>
            <bridge name='virbr20' stp='on' delay='0'/>
            <ip address='10.20.0.1' netmask='255.255.255.0'>
              <dhcp>
                <range start='10.20.0.100' end='10.20.0.200'/>
              </dhcp>
            </ip>
          </network>
          XML
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-info lab-private >/dev/null 2>&1; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-define "$DIR/lab-private.xml"
          fi
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-info lab-private | /usr/bin/grep -Eq 'Active:[[:space:]]+yes|Активна:[[:space:]]+да|Активна:[[:space:]]+yes'; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-start lab-private
          fi
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-info lab-private >"$DIR/net-info-lab-private.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-dumpxml lab-private >"$DIR/lab-private-active.xml"
          /usr/sbin/ip addr show virbr20 >"$DIR/virbr20-addr.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Isolated network в libvirt — это managed network без элемента
          `<forward>`. Libvirt создаёт bridge и DHCP/DNS внутри сегмента, но не
          настраивает NAT или маршрутизацию наружу. Гости могут общаться между
          собой и с IP-адресом bridge на хосте, однако эта сеть не становится
          путём в Интернет.

          Такая модель часто используется для backend или tenant-private
          сегментов: сервисные ВМ получают отдельную сеть для внутреннего обмена,
          а внешний доступ организуется другим интерфейсом или не предоставляется
          вовсе.

          #### Пример 1 (Минимальная isolated network)

          ``` bash
          sudo -n virsh -c qemu:///system net-define lab-private.xml
          ```
    description: |-
      Перейдите в каталог `~/isolated-network`.

      #### Упражнение 1 (Изолированная сеть lab-private)

      Создайте `lab-private.xml` для сети `lab-private`:

      - bridge `virbr20`;
      - IP bridge `10.20.0.1`, маска `255.255.255.0`;
      - DHCP range `10.20.0.100` — `10.20.0.200`;
      - без элемента `<forward>`.

      Определите и запустите сеть через
      `sudo -n virsh -c qemu:///system net-define lab-private.xml` и
      `net-start lab-private`. Сохраните `net-info-lab-private.txt`,
      `lab-private-active.xml` и `virbr20-addr.txt`.
  - title: DHCP и DNS в libvirt network
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/dhcp-dns-leases
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/dhcp-dns-leases
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for f in lab-nat-leases.txt lab-private-leases.txt lab-vm-domifaddr.txt; do /usr/bin/test -s "$DIR/$f" || fail "нет непустого файла $DIR/$f"; done
          /usr/bin/grep -Eq 'MAC|52:54:00|no active clients|Address|IP|адрес|нет|absent|no reported' "$DIR/lab-nat-leases.txt" || fail 'lab-nat-leases.txt не содержит leases или диагностику отсутствия клиентов'
          /usr/bin/grep -Eq 'MAC|52:54:00|no active clients|Address|IP|адрес|нет|absent|no reported' "$DIR/lab-private-leases.txt" || fail 'lab-private-leases.txt не содержит leases или диагностику отсутствия клиентов'
          /usr/bin/grep -Eq 'Name|MAC|52:54:00|absent|no reported|Address|адрес|нет' "$DIR/lab-vm-domifaddr.txt" || fail 'lab-vm-domifaddr.txt не содержит вывод domifaddr или диагностику'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/dhcp-dns-leases
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-dhcp-leases lab-nat >"$DIR/lab-nat-leases.txt" 2>&1 || /usr/bin/printf 'no active clients on lab-nat\n' >"$DIR/lab-nat-leases.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-dhcp-leases lab-private >"$DIR/lab-private-leases.txt" 2>&1 || /usr/bin/printf 'no active clients on lab-private\n' >"$DIR/lab-private-leases.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domifaddr lab-vm >"$DIR/lab-vm-domifaddr.txt" 2>&1 || /usr/bin/printf 'lab-vm is absent or has no reported addresses\n' >"$DIR/lab-vm-domifaddr.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Libvirt управляет DHCP/DNS для managed networks через XML сети и
          отдельный процесс dnsmasq. Команда `net-dhcp-leases` читает leases
          выбранной сети и связывает время аренды, MAC, IP и hostname гостя.

          `domifaddr` дополняет эту картину со стороны домена: libvirt пытается
          показать адреса интерфейсов ВМ через lease-файлы, guest agent или ARP.
          Если активных клиентов ещё нет, корректная диагностика отсутствия leases
          тоже является полезным результатом.

          #### Пример 1 (DHCP leases сети)

          ``` bash
          sudo -n virsh -c qemu:///system net-dhcp-leases lab-nat
          ```
    description: |-
      Перейдите в каталог `~/dhcp-dns-leases`. Используйте подготовленный
      домен `lab-vm`, если он есть.

      #### Упражнение 1 (Сохранение leases и адресов домена)

      Сохраните:

      - `lab-nat-leases.txt` — вывод
        `sudo -n virsh -c qemu:///system net-dhcp-leases lab-nat` или строку
        `no active clients on lab-nat`;
      - `lab-private-leases.txt` — вывод
        `sudo -n virsh -c qemu:///system net-dhcp-leases lab-private` или
        строку `no active clients on lab-private`;
      - `lab-vm-domifaddr.txt` — вывод
        `sudo -n virsh -c qemu:///system domifaddr lab-vm` или строку
        `lab-vm is absent or has no reported addresses`.
  - title: Подключение интерфейса ВМ к сети
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/attach-interface
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/attach-interface
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for f in domiflist.txt lab-vm-live.xml lab-vm-config.xml; do /usr/bin/test -s "$DIR/$f" || fail "нет непустого файла $DIR/$f"; done
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm --config >/var/tmp/lab-vm-config.xml 2>/dev/null || fail 'домен lab-vm не определён'
          /usr/bin/grep -q "52:54:00:aa:10:01" /var/tmp/lab-vm-config.xml || fail 'MAC 52:54:00:aa:10:01 отсутствует в config XML lab-vm'
          /usr/bin/grep -A8 -B3 "52:54:00:aa:10:01" /var/tmp/lab-vm-config.xml | /usr/bin/grep -q "network='lab-nat'" || fail 'интерфейс с MAC 52:54:00:aa:10:01 должен ссылаться на lab-nat в config XML'
          if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domstate lab-vm 2>/dev/null | /usr/bin/grep -Eq 'running|работает'; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm --live >/var/tmp/lab-vm-live.xml
            /usr/bin/grep -q "52:54:00:aa:10:01" /var/tmp/lab-vm-live.xml || fail 'MAC отсутствует в live XML запущенного lab-vm'
          fi
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/attach-interface
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm --config >/var/tmp/lab-vm-config.xml
          if ! /usr/bin/grep -q '52:54:00:aa:10:01' /var/tmp/lab-vm-config.xml; then
            if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domstate lab-vm | /usr/bin/grep -Eq 'running|работает'; then
              /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system attach-interface lab-vm --type network --source lab-nat --model virtio --mac 52:54:00:aa:10:01 --live --config
            else
              /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system attach-interface lab-vm --type network --source lab-nat --model virtio --mac 52:54:00:aa:10:01 --config
            fi
          fi
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domiflist lab-vm >"$DIR/domiflist.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm --live >"$DIR/lab-vm-live.xml" 2>&1 || /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm --config >"$DIR/lab-vm-live.xml"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm --config >"$DIR/lab-vm-config.xml"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Интерфейс домена типа `network` ссылается на managed network libvirt.
          При запуске или hotplug libvirt создаёт tap/vnet устройство на хосте,
          подключает его к bridge выбранной сети и передаёт виртуальную сетевую
          карту в QEMU.

          Hotplug может быть runtime-only (`--live`), persistent-only (`--config`)
          или сразу для обоих состояний. Для учебной топологии важно явно
          сохранять оба состояния, чтобы интерфейс не исчез после перезапуска ВМ.

          #### Пример 1 (Hotplug интерфейса)

          ``` bash
          sudo -n virsh -c qemu:///system attach-interface lab-vm --type network --source lab-nat --model virtio --mac 52:54:00:aa:10:01 --live --config
          ```
    description: |-
      Перейдите в каталог `~/attach-interface`. Убедитесь, что сеть `lab-nat`
      active, а домен `lab-vm` существует и запущен.

      #### Упражнение 1 (Подключение интерфейса к lab-nat)

      Подключите к `lab-vm` интерфейс:

      ``` bash
      sudo -n virsh -c qemu:///system attach-interface lab-vm --type network --source lab-nat --model virtio --mac 52:54:00:aa:10:01 --live --config
      ```

      Сохраните `domiflist.txt`, `lab-vm-live.xml` и `lab-vm-config.xml` с
      выводом `domiflist lab-vm`, `dumpxml lab-vm --live`,
      `dumpxml lab-vm --config`.
