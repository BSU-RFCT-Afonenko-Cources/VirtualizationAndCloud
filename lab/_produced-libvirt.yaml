    ### Важное замечание для студентов

    В рамках этой лабораторной работы резервирование выполняется на уровне
    копирования томов между двумя каталогами. Это учебная модель. В реальной
    инфраструктуре резервный пул должен находиться на другом физическом
    диске, другом сервере или сетевом хранилище. Если основной и резервный
    пулы расположены на одном физическом диске, такая схема защищает только
    от ошибок конфигурации или случайного удаления отдельного файла, но не
    защищает от отказа самого диска.

