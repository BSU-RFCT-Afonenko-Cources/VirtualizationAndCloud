        hints: |-
          `pool-destroy` останавливает управление storage pool в libvirt, но не
          стирает данные backend. Файлы volumes остаются в target directory.

          Это lifecycle-операция: persistent definition остаётся, pool можно снова
          запустить через `pool-start`. Удаление volumes и `rm -rf` target path —
          отдельные действия.

