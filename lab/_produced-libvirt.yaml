          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/cputune-xml
          STATE_DIR=/home/ubuntu/.libvirt-cpu-scheduling
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          if /usr/bin/test -s "$STATE_DIR/baseline.env"; then . "$STATE_DIR/baseline.env"; fi
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm > "$DIR/domain.xml"
          /usr/bin/sed -n '/<cputune>/,/<\/cputune>/p' "$DIR/domain.xml" > "$DIR/cputune.xml" || true
          /usr/bin/grep -nE '<cputune>|<vcpupin|<emulatorpin|<shares>|<period>|<quota>|<emulator_period>|<emulator_quota>|<global_period>|<global_quota>' "$DIR/domain.xml" > "$DIR/cputune-grep.txt" || true
          if ! /usr/bin/grep -Eq '<vcpupin|<shares>|<period>|<quota>|<emulatorpin|<emulator_period>|<global_period' "$DIR/cputune-grep.txt"; then /usr/bin/printf 'Некоторые элементы cputune отсутствуют или не поддерживаются в этом окружении.
          ' > "$DIR/unsupported-elements.txt"; fi

          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Persistent CPU scheduling policy домена хранится в domain XML внутри
          `<cputune>`. Там могут находиться `<vcpupin>`, `<emulatorpin>`,
          `<shares>`, `<period>`, `<quota>`, emulator/global period/quota и другие
          элементы, если они поддерживаются драйвером.

          XML удобно использовать как источник истины для IaC: его можно
          выгрузить, проверить XPath/grep и шаблонизировать. При этом
          live-состояние может временно отличаться, если команда применялась
          только с `--live` или только с `--config`.

          #### Пример 1

          ``` bash
          sudo -n virsh -c qemu:///system dumpxml lab-vm > domain.xml
          grep -nE '<cputune>|<vcpupin|<shares>|<period>|<quota>' domain.xml
          ```
    description: |-
      Перейдите в каталог `~/cputune-xml`.

      #### Упражнение 1 (Извлечение cputune из XML)

      Сохраните полный XML, секцию cputune и результаты поиска ожидаемых
      элементов:

      ``` bash
      sudo -n virsh -c qemu:///system dumpxml lab-vm > domain.xml
      sed -n '/<cputune>/,/<\/cputune>/p' domain.xml > cputune.xml
      grep -nE '<cputune>|<vcpupin|<emulatorpin|<shares>|<period>|<quota>|<emulator_period>|<emulator_quota>|<global_period>|<global_quota>' domain.xml > cputune-grep.txt || true
      ```

      Если каких-то элементов нет из-за unsupported-параметров, перечислите их
      в `unsupported-elements.txt`.
  - title: Сброс scheduler-политик
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          STEP_DIR="/home/ubuntu/scheduler-reset"
          STATE_DIR="/home/ubuntu/.libvirt-cpu-scheduling"
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$STEP_DIR"
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$STATE_DIR"
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dominfo lab-vm >/dev/null 2>&1; then
            /usr/bin/printf 'Домен lab-vm не найден. Подготовьте учебный домен перед выполнением шага.
          ' > "$STEP_DIR/pre-step-warning.txt"
            /usr/bin/chown ubuntu:ubuntu "$STEP_DIR/pre-step-warning.txt"
            exit 0
          fi
          if /usr/bin/test ! -s "$STATE_DIR/baseline.env"; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system schedinfo lab-vm > "$STATE_DIR/baseline-schedinfo.txt" 2>&1 || true
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vcpupin lab-vm > "$STATE_DIR/baseline-vcpupin.txt" 2>&1 || true
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm > "$STATE_DIR/baseline-domain.xml" 2>&1 || true
            ONLINE_CPUS="$(/bin/cat /sys/devices/system/cpu/online 2>/dev/null || /usr/bin/printf '0')"
            FIRST_CPU="$(/usr/bin/printf '%s
          ' "$ONLINE_CPUS" | /usr/bin/awk -F'[-,]' '{print $1}')"
            if /usr/bin/test -z "$FIRST_CPU"; then FIRST_CPU=0; fi
            SHARES="$(/usr/bin/awk '/^[[:space:]]*cpu_shares[[:space:]]*:/ {print $3; found=1} END {if (!found) print "1024"}' "$STATE_DIR/baseline-schedinfo.txt")"
            /usr/bin/printf 'LAB_DOMAIN=lab-vm
          LAB_WIDE_MASK=%s
          LAB_PIN_MASK=%s
          LAB_BASELINE_SHARES=%s
          LAB_VCPU_PERIOD=100000
          LAB_VCPU_QUOTA=50000
          LAB_NEW_SHARES=512
          LAB_EMULATOR_PERIOD=100000
          LAB_EMULATOR_QUOTA=80000
          LAB_GLOBAL_PERIOD=100000
          LAB_GLOBAL_QUOTA=90000
          ' "$ONLINE_CPUS" "$FIRST_CPU" "$SHARES" > "$STATE_DIR/baseline.env"
            /usr/bin/chown -R ubuntu:ubuntu "$STATE_DIR"
          fi
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/scheduler-reset
          STATE_DIR=/home/ubuntu/.libvirt-cpu-scheduling
          fail(){ /usr/bin/printf 'Ошибка: %s
          ' "$1" >&2; exit 1; }
          /usr/bin/test -d "$DIR" || fail "нет каталога $DIR"
          for f in schedinfo-final.txt vcpupin-final.txt domain-final.xml reset-log.txt; do /usr/bin/test -s "$DIR/$f" || fail "нет непустого файла $DIR/$f"; done
          if /usr/bin/grep -Eq 'vcpu_quota[[:space:]]*:[[:space:]]*-[[:space:]]*1|vcpu_quota[[:space:]]*:[[:space:]]*-1' "$DIR/schedinfo-final.txt"; then :; else
            /usr/bin/grep -q '<quota>-1</quota>' "$DIR/domain-final.xml" || fail 'жёсткий vCPU throttling не сброшен на -1'
          fi
          /usr/bin/grep -Eiq 'cpu_shares|Scheduler' "$DIR/schedinfo-final.txt" || fail 'финальный schedinfo некорректен'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/scheduler-reset
          STATE_DIR=/home/ubuntu/.libvirt-cpu-scheduling
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          if /usr/bin/test -s "$STATE_DIR/baseline.env"; then . "$STATE_DIR/baseline.env"; fi
          /usr/bin/printf 'Reset CPU scheduler policy for lab-vm
          ' > "$DIR/reset-log.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system schedinfo lab-vm --set vcpu_quota=-1 --live --config >> "$DIR/reset-log.txt" 2>&1
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system schedinfo lab-vm --set emulator_quota=-1 --live --config >> "$DIR/reset-log.txt" 2>&1 || true
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system schedinfo lab-vm --set global_quota=-1 --live --config >> "$DIR/reset-log.txt" 2>&1 || true
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system schedinfo lab-vm --set cpu_shares="${LAB_BASELINE_SHARES:-1024}" --live --config >> "$DIR/reset-log.txt" 2>&1 || true
          vcpu_count="$(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vcpucount lab-vm --current 2>/dev/null | /usr/bin/awk 'NR==1 {print $1}')"
          if ! /usr/bin/awk 'BEGIN{exit !(ARGV[1] ~ /^[0-9]+$/)}' "$vcpu_count"; then vcpu_count=1; fi
          i=0
          while /usr/bin/test "$i" -lt "$vcpu_count"; do
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vcpupin lab-vm "$i" "${LAB_WIDE_MASK:-0}" --live --config >> "$DIR/reset-log.txt" 2>&1 || true
            i=$((i+1))
          done
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system emulatorpin lab-vm "${LAB_WIDE_MASK:-0}" --live --config >> "$DIR/reset-log.txt" 2>&1 || true
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system schedinfo lab-vm > "$DIR/schedinfo-final.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vcpupin lab-vm > "$DIR/vcpupin-final.txt" || true
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm > "$DIR/domain-final.xml"

          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Финальный этап любой лаборатории по ресурсным политикам — возврат VM в
          нейтральное состояние. Для CPU bandwidth это обычно `quota=-1`, для
          shares — baseline или безопасный default, для pinning — широкая маска
          всех online CPU либо исходная маска из baseline.

          Reset нужно делать и для live, и для persistent config, иначе
          ограничения могут исчезнуть только до перезапуска или, наоборот,
          вернуться после reboot. Итоговые диагностические файлы подтверждают
          отсутствие жёсткого throttling и фиксируют состояние после очистки.

          #### Пример 1

          ``` bash
          sudo -n virsh -c qemu:///system schedinfo lab-vm --set vcpu_quota=-1 --set emulator_quota=-1 --live --config
          sudo -n virsh -c qemu:///system vcpupin lab-vm 0 0-N --live --config
          ```
    description: |-
      Перейдите в каталог `~/scheduler-reset`.

      #### Упражнение 1 (Сброс CPU scheduling policy)

      Загрузите baseline, верните shares и снимите жёсткие quotas:

      ``` bash
      . /home/ubuntu/.libvirt-cpu-scheduling/baseline.env
      sudo -n virsh -c qemu:///system schedinfo lab-vm \
        --set vcpu_quota=-1 --live --config
      sudo -n virsh -c qemu:///system schedinfo lab-vm \
        --set emulator_quota=-1 --live --config 2>> reset-log.txt || true
      sudo -n virsh -c qemu:///system schedinfo lab-vm \
        --set cpu_shares="$LAB_BASELINE_SHARES" --live --config
      sudo -n virsh -c qemu:///system schedinfo lab-vm \
        --set global_quota=-1 --live --config 2>> reset-log.txt || true
      ```

      Для каждого vCPU расширьте pinning до `LAB_WIDE_MASK`; той же маской
      сбросьте `emulatorpin`. Записывайте выполненные операции в
      `reset-log.txt`. Затем сохраните итоговое состояние:

      ``` bash
      sudo -n virsh -c qemu:///system schedinfo lab-vm > schedinfo-final.txt
      sudo -n virsh -c qemu:///system vcpupin lab-vm > vcpupin-final.txt
      sudo -n virsh -c qemu:///system dumpxml lab-vm > domain-final.xml
      ```
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — KVM/QEMU Lab
      prepare: ''
  order: 7
- title: Практическое развёртывание виртуализованной сервисной инфраструктуры
  description: |-
    В этой лабораторной работе вы выступаете в роли инженера, который
    разворачивает небольшую виртуализованную сервисную платформу. Три
    отдельные виртуальные машины выполняют роли входного узла, прикладного
    API и хранилища данных, а клиентский запрос проходит по цепочке
    `host → cap-edge → cap-app → cap-db`.

    Работа объединяет управление доменами libvirt, сегментированными сетями,
    storage pool и volumes, жизненным циклом, ресурсами и CPU scheduling.
    После запуска полезной нагрузки вы выполните расширение диска, создадите
    snapshot перед обновлением, подготовите backup-набор и подтвердите
    восстановление после контролируемого сбоя.

    Результат каждого этапа проверяется по фактическому состоянию libvirt,
    гостевых сервисов и структурированным evidence-файлам. Обычный текстовый
    отчёт не требуется. Все пользовательские артефакты размещаются внутри
    `/home/ubuntu/capstone`.
  time-limit-minutes: 480
  prepare: "# ----------EXEC----------\n    # ---\tprepare.bash\t---\ncat <<'EOF'
    > prepare.bash\n#!/usr/bin/env bash\nset -euo pipefail\nBASE=/home/ubuntu/capstone\n\
    SOURCE=$(/usr/bin/realpath \"$0\")\nSOURCE_DIR=$(/usr/bin/dirname \"$SOURCE\"\
    )\n/usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 \"$BASE\"\
    \ \"$BASE/assets\" \"$BASE/ssh\"\n/usr/bin/sudo -n /usr/bin/cp -a \"$SOURCE_DIR/assets/.\"\
    \ \"$BASE/assets/\"\n/usr/bin/sudo -n /usr/bin/chown -R ubuntu:ubuntu \"$BASE\"\
    \nif ! /usr/bin/test -s \"$BASE/ssh/id_ed25519\"; then\n /usr/bin/sudo -n -u ubuntu
    /usr/bin/ssh-keygen -q -t ed25519 -N '' -f \"$BASE/ssh/id_ed25519\"\nfi\nEOF\n\
    trap 'rm -f prepare.bash' EXIT\n\n    # ----------RUN----------\n    chmod u+x
    prepare.bash\n./prepare.bash\n    "
  steps:
  - title: Архитектурная инвентаризация стенда
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/capstone/01-inventory
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          VIRSH=(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system)
          virsh(){ "${VIRSH[@]}" "$@"; }
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          need_file(){ /usr/bin/test -s "$1" || fail "нет непустого файла $1"; }
          DIR=/home/ubuntu/capstone/01-inventory
          for f in domains.txt networks.txt pools.txt nodeinfo.txt capabilities.xml; do need_file "$DIR/$f"; done
          /usr/bin/python3 -c 'import xml.etree.ElementTree as E; E.parse("/home/ubuntu/capstone/01-inventory/capabilities.xml")' || fail 'capabilities.xml не является XML'
          /usr/bin/grep -Eq 'CPU model|Модель CPU|CPU\(s\)|Процессор' "$DIR/nodeinfo.txt" || fail 'nodeinfo.txt не похож на virsh nodeinfo'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          source /home/ubuntu/capstone/assets/solution-lib.bash
          # Собираем базовую инвентаризацию libvirt-хоста в проверяемые файлы.
          D=/home/ubuntu/capstone/01-inventory; ensure_dir "$D"
          "${VIRSH[@]}" list --all >"$D/domains.txt"; "${VIRSH[@]}" net-list --all >"$D/networks.txt"; "${VIRSH[@]}" pool-list --all >"$D/pools.txt"; "${VIRSH[@]}" nodeinfo >"$D/nodeinfo.txt"; "${VIRSH[@]}" capabilities >"$D/capabilities.xml"; /usr/bin/sudo -n /usr/bin/chown -R ubuntu:ubuntu "$D"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Перед развёртыванием инженер фиксирует исходное состояние гипервизора:
          доступность libvirt, архитектуру и ресурсы узла, уже определённые
          домены, сети и storage pools. Это позволяет отличить созданные объекты
          от ранее существовавших и заранее увидеть ограничения стенда.

          Инвентаризация должна быть воспроизводимой и пригодной для машинной
          обработки. Особую ценность имеют capabilities гипервизора и сведения об
          узле: они определяют допустимый тип виртуализации, модели CPU и
          доступные устройства.
    description: |-
      Перейдите к этапу, используя рабочий каталог
      `/home/ubuntu/capstone/01-inventory`.

      #### Упражнение 1 (Проверяемое состояние)

      В каталоге `/home/ubuntu/capstone/01-inventory` сохраните непустые файлы
      `domains.txt`, `networks.txt`, `pools.txt`, `nodeinfo.txt` и
      `capabilities.xml`. Они должны отражать текущее состояние системного
      подключения libvirt; XML capabilities должен быть корректным.
  - title: Проектирование имён и целевого состояния
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/capstone/02-target-state
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          VIRSH=(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system)
          virsh(){ "${VIRSH[@]}" "$@"; }
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          need_file(){ /usr/bin/test -s "$1" || fail "нет непустого файла $1"; }
          F=/home/ubuntu/capstone/02-target-state/target-state.json; need_file "$F"
          /usr/bin/python3 - "$F" <<'PY2'
          import json,sys
          x=json.load(open(sys.argv[1])); blob=json.dumps(x)
          required=['cap-edge','cap-app','cap-db','cap-front','cap-back','capstone-pool','cap-edge.qcow2','cap-app.qcow2','cap-db.qcow2','cap-db-data.qcow2','/health','/version','/orders']
          missing=[v for v in required if v not in blob]
          if missing: raise SystemExit('Ошибка: отсутствуют обязательные значения: '+', '.join(missing))
          def walk(v):
           if isinstance(v,dict):
            for a,b in v.items(): yield from walk(b)
           elif isinstance(v,list):
            for a in v: yield from walk(a)
           elif isinstance(v,str): yield v
          vals=list(walk(x))
          bad=[v for v in vals if (v.startswith('cap') and not (v.startswith('cap-') or v.startswith('capstone-')))]
          infra=[v for v in vals if (v.endswith('.qcow2') or 'pool' in v.lower() or v.endswith('-net'))]
          infra += [v for v in vals if v in ('edge','app','db','front','back')]
          extra=[v for v in infra if v not in required and not (v.startswith('cap-') or v.startswith('capstone-'))]
          if bad or extra: raise SystemExit('Ошибка: нарушен namespace: '+', '.join(sorted(set(bad+extra))))
          PY2
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          source /home/ubuntu/capstone/assets/solution-lib.bash
          # Формируем машинно-читаемую декларацию целевого состояния стенда.
          D=/home/ubuntu/capstone/02-target-state; ensure_dir "$D"
          /usr/bin/cat >"$D/target-state.json" <<'JSON'
          {"domains":[{"name":"cap-edge","role":"reverse-proxy"},{"name":"cap-app","role":"api"},{"name":"cap-db","role":"database"}],"networks":["cap-front","cap-back"],"pool":"capstone-pool","volumes":["cap-edge.qcow2","cap-app.qcow2","cap-db.qcow2","cap-db-data.qcow2"],"endpoints":["/health","/version","/orders"]}
          JSON
          /usr/bin/chown ubuntu:ubuntu "$D/target-state.json"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Единое пространство имён снижает риск конфликтов с чужими объектами на
          общем гипервизоре. В этой работе домены и сети используют префикс
          `cap-`, а pool и связанные инфраструктурные объекты — `capstone-`.

          Целевое состояние полезно зафиксировать до изменений. Машиночитаемая
          декларация связывает роли, имена, volumes и endpoints и служит
          контрактом для следующих этапов, а не текстовым отчётом.
    description: |-
      Перейдите к этапу, используя рабочий каталог
      `/home/ubuntu/capstone/02-target-state`.

      #### Упражнение 1 (Проверяемое состояние)

      Создайте `/home/ubuntu/capstone/02-target-state/target-state.json`.
      Укажите массив доменов `cap-edge`, `cap-app`, `cap-db` с ролями, сети
      `cap-front` и `cap-back`, pool `capstone-pool`, volumes
      `cap-edge.qcow2`, `cap-app.qcow2`, `cap-db.qcow2`, `cap-db-data.qcow2`,
      а также endpoints `/health`, `/version`, `/orders`. Все именованные
      инфраструктурные объекты должны использовать префикс `cap-` или
      `capstone-`.
  - title: Создание управляемого storage backend
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/capstone/03-storage
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          VIRSH=(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system)
          virsh(){ "${VIRSH[@]}" "$@"; }
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          need_file(){ /usr/bin/test -s "$1" || fail "нет непустого файла $1"; }
          DIR=/home/ubuntu/capstone/03-storage; need_file "$DIR/pool.xml"; need_file "$DIR/volumes.txt"
          info=$(virsh pool-info capstone-pool) || fail 'pool capstone-pool не существует'
          /usr/bin/grep -Eq 'running|активен|работает' <<<"$info" || fail 'pool не активен'; /usr/bin/grep -Eq 'yes|да' <<<"$info" || fail 'pool не persistent/autostart'
          xml=$(virsh pool-dumpxml capstone-pool); /usr/bin/grep -q "<pool type='dir'>" <<<"$xml" || fail 'pool должен быть directory-backed'
          /usr/bin/grep -q '<path>/var/lib/libvirt/capstone</path>' <<<"$xml" || fail 'неверный target pool'
          for v in cap-edge.qcow2 cap-app.qcow2 cap-db.qcow2 cap-db-data.qcow2; do virsh vol-info --pool capstone-pool "$v" >/dev/null || fail "нет volume $v"; done
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          source /home/ubuntu/capstone/assets/solution-lib.bash
          # Создаём persistent directory pool и минимальный набор volumes для будущих ВМ.
          D=/home/ubuntu/capstone/03-storage; ensure_dir "$D"; /usr/bin/sudo -n /usr/bin/install -d -m 0755 /var/lib/libvirt/capstone
          if ! "${VIRSH[@]}" pool-info capstone-pool >/dev/null 2>&1; then "${VIRSH[@]}" pool-define-as capstone-pool dir --target /var/lib/libvirt/capstone >/dev/null; fi
          "${VIRSH[@]}" pool-start capstone-pool >/dev/null 2>&1 || true; "${VIRSH[@]}" pool-autostart capstone-pool >/dev/null
          for spec in 'cap-edge.qcow2 8G' 'cap-app.qcow2 8G' 'cap-db.qcow2 8G' 'cap-db-data.qcow2 2G'; do set -- $spec; "${VIRSH[@]}" vol-info --pool capstone-pool "$1" >/dev/null 2>&1 || "${VIRSH[@]}" vol-create-as capstone-pool "$1" "$2" --allocation 0 --format qcow2 >/dev/null; done
          "${VIRSH[@]}" pool-dumpxml capstone-pool >"$D/pool.xml"; "${VIRSH[@]}" vol-list capstone-pool --details >"$D/volumes.txt"; /usr/bin/sudo -n /usr/bin/chown -R ubuntu:ubuntu "$D"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Storage pool в libvirt описывает управляемое пространство хранения и
          способ доступа к нему. Directory-backed pool связывает объект libvirt с
          каталогом хоста, а autostart обеспечивает доступность после перезапуска
          службы виртуализации.

          Volume является самостоятельным объектом внутри pool и может быть
          назначен домену как диск. Раздельные boot volumes изолируют жизненный
          цикл ВМ, а отдельный data volume позволяет обслуживать данные базы
          независимо от системного диска.
    description: |-
      Перейдите к этапу, используя рабочий каталог
      `/home/ubuntu/capstone/03-storage`.

      #### Упражнение 1 (Проверяемое состояние)

      Создайте persistent directory-backed pool `capstone-pool` с target
      `/var/lib/libvirt/capstone`, запустите его и включите autostart.
      Подготовьте четыре volumes: три boot volume по 8 GiB и
      `cap-db-data.qcow2` размером 2 GiB. Сохраните pool XML и список volumes
      в `/home/ubuntu/capstone/03-storage`.
  - title: Создание сетевой топологии
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/capstone/04-networks
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          VIRSH=(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system)
          virsh(){ "${VIRSH[@]}" "$@"; }
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          need_file(){ /usr/bin/test -s "$1" || fail "нет непустого файла $1"; }
          for n in cap-front cap-back; do info=$(virsh net-info "$n") || fail "нет сети $n"; /usr/bin/grep -Eq 'Active:.*(yes|да)|Активн.*(yes|да)' <<<"$info" || fail "$n не активна"; /usr/bin/grep -Eq 'Autostart:.*(yes|да)|Автозапуск:.*(yes|да)' <<<"$info" || fail "$n без autostart"; need_file "/home/ubuntu/capstone/04-networks/$n.xml"; done
          front=$(virsh net-dumpxml cap-front); back=$(virsh net-dumpxml cap-back)
          /usr/bin/grep -q "bridge name='virbr-cap-front'" <<<"$front" || fail 'неверный frontend bridge'; /usr/bin/grep -q "mode='nat'" <<<"$front" || fail 'cap-front должна использовать NAT'
          /usr/bin/grep -q "bridge name='virbr-cap-back'" <<<"$back" || fail 'неверный backend bridge'; ! /usr/bin/grep -q '<forward' <<<"$back" || fail 'cap-back должна быть isolated'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          source /home/ubuntu/capstone/assets/solution-lib.bash
          # Определяем frontend NAT-сеть и isolated backend-сеть со стабильными DHCP lease.
          D=/home/ubuntu/capstone/04-networks; ensure_dir "$D"
          /usr/bin/cat >/tmp/cap-front.xml <<'XML'
          <network><name>cap-front</name><forward mode='nat'/><bridge name='virbr-cap-front' stp='on' delay='0'/><ip address='192.168.150.1' netmask='255.255.255.0'><dhcp><range start='192.168.150.100' end='192.168.150.200'/><host mac='52:54:00:ca:10:10' name='cap-edge' ip='192.168.150.10'/></dhcp></ip></network>
          XML
          /usr/bin/cat >/tmp/cap-back.xml <<'XML'
          <network><name>cap-back</name><bridge name='virbr-cap-back' stp='on' delay='0'/><ip address='192.168.151.1' netmask='255.255.255.0'><dhcp><range start='192.168.151.100' end='192.168.151.200'/><host mac='52:54:00:ca:20:10' name='cap-edge-back' ip='192.168.151.10'/><host mac='52:54:00:ca:20:20' name='cap-app' ip='192.168.151.20'/><host mac='52:54:00:ca:20:30' name='cap-db' ip='192.168.151.30'/></dhcp></ip></network>
          XML
          for n in cap-front cap-back; do "${VIRSH[@]}" net-info "$n" >/dev/null 2>&1 || "${VIRSH[@]}" net-define "/tmp/$n.xml" >/dev/null; "${VIRSH[@]}" net-start "$n" >/dev/null 2>&1 || true; "${VIRSH[@]}" net-autostart "$n" >/dev/null; "${VIRSH[@]}" net-dumpxml "$n" >"$D/$n.xml"; done
          /usr/bin/sudo -n /usr/bin/chown -R ubuntu:ubuntu "$D"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Frontend-сеть предоставляет контролируемую точку входа с хоста, тогда
          как backend-сеть предназначена для service-to-service трафика. Такое
          разделение уменьшает поверхность атаки и делает маршрут запроса явным.

          Persistent managed network имеет собственные XML, bridge, адресное
          пространство и при необходимости DHCP/DNS. Изолированная backend-сеть не
          должна использовать внешний forwarding: её участники общаются между
          собой и с bridge хоста, но не становятся внешней точкой входа.
    description: |-
      Перейдите к этапу, используя рабочий каталог
      `/home/ubuntu/capstone/04-networks`.

      #### Упражнение 1 (Проверяемое состояние)

      Создайте persistent active autostart-сети `cap-front` и `cap-back`.
      Используйте bridge `virbr-cap-front` с подсетью `192.168.150.0/24` и
      bridge `virbr-cap-back` с подсетью `192.168.151.0/24`. Frontend должна
      использовать NAT, backend — не иметь внешнего forwarding. Предусмотрите
      стабильные DHCP-адреса `.10` для edge, `.20` для app и `.30` для db
      согласно их сети. Сохраните XML обеих сетей.
  - title: Provisioning виртуальных машин
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/capstone/05-provision
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          VIRSH=(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system)
          virsh(){ "${VIRSH[@]}" "$@"; }
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          need_file(){ /usr/bin/test -s "$1" || fail "нет непустого файла $1"; }
          for d in cap-edge cap-app cap-db; do virsh dominfo "$d" >/dev/null || fail "нет домена $d"; need_file "/home/ubuntu/capstone/05-provision/$d.xml"; done
          edge=$(virsh dumpxml cap-edge --config); app=$(virsh dumpxml cap-app --config); db=$(virsh dumpxml cap-db --config)
          /usr/bin/grep -q "network='cap-front'" <<<"$edge" && /usr/bin/grep -q "network='cap-back'" <<<"$edge" || fail 'edge должен иметь две сети'
          /usr/bin/grep -q "network='cap-back'" <<<"$app" || fail 'app не подключён к backend'; ! /usr/bin/grep -q "network='cap-front'" <<<"$app" || fail 'app ошибочно подключён к frontend'
          /usr/bin/grep -q 'cap-db-data.qcow2' <<<"$db" || fail 'data volume не подключён к db'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          source /home/ubuntu/capstone/assets/solution-lib.bash
          # Готовим cloud-init seed, backing volumes и persistent domain definitions для трёх ролей.
          D=/home/ubuntu/capstone/05-provision; ensure_dir "$D"
          IMAGE=''
          for c in /var/lib/libvirt/images/ubuntu-cloud.img /home/ubuntu/noble-server-cloudimg-amd64.img /var/lib/libvirt/images/noble-server-cloudimg-amd64.img; do /usr/bin/test -s "$c" && IMAGE="$c" && break; done
          if [[ -z "$IMAGE" ]]; then /usr/bin/sudo -n /usr/bin/curl -fL --retry 3 -o /var/lib/libvirt/images/ubuntu-cloud.img https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img; IMAGE=/var/lib/libvirt/images/ubuntu-cloud.img; fi
          PUB=$(/usr/bin/cat /home/ubuntu/capstone/ssh/id_ed25519.pub)
          for vm in cap-edge cap-app cap-db; do
           vol="$vm.qcow2"; path=$("${VIRSH[@]}" vol-path --pool capstone-pool "$vol")
           if ! /usr/bin/sudo -n /usr/bin/qemu-img info "$path" | /usr/bin/grep -q 'backing file'; then /usr/bin/sudo -n /usr/bin/rm -f "$path"; /usr/bin/sudo -n /usr/bin/qemu-img create -f qcow2 -F qcow2 -b "$IMAGE" "$path" 8G >/dev/null; "${VIRSH[@]}" pool-refresh capstone-pool >/dev/null; fi
           seed="/var/lib/libvirt/capstone/$vm-seed.iso"; user="/tmp/$vm-user-data"; meta="/tmp/$vm-meta-data"
           /usr/bin/cat >"$user" <<EOF
          #cloud-config
          users:
            - default
            - name: ubuntu
              groups: [adm, sudo]
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              ssh_authorized_keys: [$PUB]
          ssh_pwauth: false
          packages: [qemu-guest-agent]
          runcmd:
            - [systemctl, enable, --now, qemu-guest-agent]
          EOF
           /usr/bin/printf 'instance-id: %s\nlocal-hostname: %s\n' "$vm" "$vm" >"$meta"
           /usr/bin/sudo -n /usr/bin/cloud-localds "$seed" "$user" "$meta"
          done
          if ! "${VIRSH[@]}" dominfo cap-edge >/dev/null 2>&1; then /usr/bin/sudo -n /usr/bin/virt-install --connect qemu:///system --name cap-edge --memory 512 --vcpus 1 --import --os-variant ubuntu24.04 --disk vol=capstone-pool/cap-edge.qcow2,bus=virtio --disk path=/var/lib/libvirt/capstone/cap-edge-seed.iso,device=cdrom --network network=cap-front,model=virtio,mac=52:54:00:ca:10:10 --network network=cap-back,model=virtio,mac=52:54:00:ca:20:10 --graphics none --noautoconsole; fi
          if ! "${VIRSH[@]}" dominfo cap-app >/dev/null 2>&1; then /usr/bin/sudo -n /usr/bin/virt-install --connect qemu:///system --name cap-app --memory 1024 --vcpus 2 --import --os-variant ubuntu24.04 --disk vol=capstone-pool/cap-app.qcow2,bus=virtio --disk path=/var/lib/libvirt/capstone/cap-app-seed.iso,device=cdrom --network network=cap-back,model=virtio,mac=52:54:00:ca:20:20 --graphics none --noautoconsole; fi
          if ! "${VIRSH[@]}" dominfo cap-db >/dev/null 2>&1; then /usr/bin/sudo -n /usr/bin/virt-install --connect qemu:///system --name cap-db --memory 1536 --vcpus 2 --import --os-variant ubuntu24.04 --disk vol=capstone-pool/cap-db.qcow2,bus=virtio --disk vol=capstone-pool/cap-db-data.qcow2,bus=virtio --disk path=/var/lib/libvirt/capstone/cap-db-seed.iso,device=cdrom --network network=cap-back,model=virtio,mac=52:54:00:ca:20:30 --graphics none --noautoconsole; fi
          for vm in cap-edge cap-app cap-db; do "${VIRSH[@]}" dumpxml "$vm" --config >"$D/$vm.xml"; done; /usr/bin/sudo -n /usr/bin/chown -R ubuntu:ubuntu "$D"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Provisioning включает persistent domain definition, системный диск,
          сетевые интерфейсы, консоль и первоначальную конфигурацию гостевой ОС.
          Автоматизированный cloud-init workflow предпочтительнее ручной
          установки: одинаковый результат можно повторить и проверить.

          Роль домена отражается в наборе интерфейсов и дисков. Edge подключён к
          обеим сетям, app и db — только к backend, а db дополнительно получает
          отдельный data volume.
    description: |-
      Перейдите к этапу, используя рабочий каталог
      `/home/ubuntu/capstone/05-provision`.

      #### Упражнение 1 (Проверяемое состояние)

      Создайте persistent домены `cap-edge`, `cap-app`, `cap-db` на
      подготовленных boot volumes с автоматизированной первичной настройкой
      пользователя `ubuntu` и SSH. Edge должен иметь интерфейсы в обеих сетях;
      app и db — только в `cap-back`; к db подключите `cap-db-data.qcow2` как
      второй virtio-диск. Сохраните итоговые domain XML в каталоге шага.
  - title: Базовый жизненный цикл и autostart
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/capstone/06-lifecycle
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          VIRSH=(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system)
          virsh(){ "${VIRSH[@]}" "$@"; }
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          need_file(){ /usr/bin/test -s "$1" || fail "нет непустого файла $1"; }
          need_file /home/ubuntu/capstone/06-lifecycle/states.json
          for d in cap-edge cap-app cap-db; do state=$(virsh domstate "$d"); /usr/bin/grep -Eq 'running|работает' <<<"$state" || fail "$d не запущен"; info=$(virsh dominfo "$d"); /usr/bin/grep -Eq 'Autostart:.*(enable|yes|да)|Автозапуск:.*(да|включ)' <<<"$info" || fail "$d без autostart"; done
          /usr/bin/python3 -c 'import json;x=json.load(open("/home/ubuntu/capstone/06-lifecycle/states.json")); assert all(x[d]["ssh_ready"] for d in ("cap-edge","cap-app","cap-db"))' || fail 'states.json не подтверждает SSH'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          source /home/ubuntu/capstone/assets/solution-lib.bash
          # Запускаем домены, включаем autostart и ждём доступности SSH для следующих шагов.
          D=/home/ubuntu/capstone/06-lifecycle; ensure_dir "$D"; for vm in cap-edge cap-app cap-db; do "${VIRSH[@]}" start "$vm" >/dev/null 2>&1 || true; "${VIRSH[@]}" autostart "$vm" >/dev/null; done
          wait_ssh 192.168.150.10; wait_ssh 192.168.151.20; wait_ssh 192.168.151.30
          /usr/bin/cat >"$D/states.json" <<'JSON'
          {"cap-edge":{"state":"running","autostart":true,"ssh_ready":true},"cap-app":{"state":"running","autostart":true,"ssh_ready":true},"cap-db":{"state":"running","autostart":true,"ssh_ready":true}}
          JSON
          /usr/bin/chown ubuntu:ubuntu "$D/states.json"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Домен может быть определён, запущен, корректно остановлен или аварийно
          выключен. Persistent definition сохраняется независимо от
          runtime-состояния, а autostart задаёт поведение после запуска
          libvirt-хоста.

          Для сервисного стенда важно не только состояние `running`, но и
          готовность гостя принимать автоматизированные подключения. Корректное
          завершение предпочтительнее forced stop, который оставляют для аварийных
          случаев.
    description: |-
      Перейдите к этапу, используя рабочий каталог
      `/home/ubuntu/capstone/06-lifecycle`.

      #### Упражнение 1 (Проверяемое состояние)

      Приведите все три домена к состоянию `running`, включите для них
      autostart и дождитесь готовности SSH. В
      `/home/ubuntu/capstone/06-lifecycle/states.json` сохраните объект, где
      для каждого домена указаны `state`, `autostart` и `ssh_ready`.
  - title: Развёртывание базы данных на cap-db
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/sudo -n /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/capstone/07-database
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          VIRSH=(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system)
          virsh(){ "${VIRSH[@]}" "$@"; }
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          need_file(){ /usr/bin/test -s "$1" || fail "нет непустого файла $1"; }
          dbxml=$(virsh dumpxml cap-db --config); /usr/bin/grep -q 'cap-db-data.qcow2' <<<"$dbxml" || fail 'data volume не подключён'
          need_file /home/ubuntu/capstone/07-database/evidence.json
          body=$(/usr/bin/curl -fsS --max-time 5 http://192.168.151.30:54321/orders) || fail 'database service недоступен'
          /usr/bin/python3 -c 'import json,sys;x=json.loads(sys.argv[1]); assert x["source"]=="cap-db" and len(x["orders"])>=2 and any(o["id"]==1001 for o in x["orders"])' "$body" || fail 'database service не вернул контрольные данные'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          source /home/ubuntu/capstone/assets/solution-lib.bash
          # Настраиваем отдельный data disk, SQLite-backed HTTP DB service и evidence-файл.
          D=/home/ubuntu/capstone/07-database; ensure_dir "$D"; wait_ssh 192.168.151.30
          scp_vm /home/ubuntu/capstone/assets/db_service.py 192.168.151.30 /tmp/db_service.py; scp_vm /home/ubuntu/capstone/assets/cap-db.service 192.168.151.30 /tmp/cap-db.service
          ssh_vm 192.168.151.30 "sudo -n bash -c 'if ! blkid /dev/vdb >/dev/null 2>&1; then mkfs.ext4 -F /dev/vdb; fi; mkdir -p /srv/cap-db /opt/capstone; grep -q /srv/cap-db /etc/fstab || echo /dev/vdb /srv/cap-db ext4 defaults,nofail 0 2 >>/etc/fstab; mountpoint -q /srv/cap-db || mount /srv/cap-db; install -m 0755 /tmp/db_service.py /opt/capstone/db_service.py; install -m 0644 /tmp/cap-db.service /etc/systemd/system/cap-db.service; systemctl daemon-reload; systemctl enable --now cap-db.service'"
          wait_http http://192.168.151.30:54321/orders; count=$(/usr/bin/curl -fsS http://192.168.151.30:54321/orders | /usr/bin/python3 -c 'import json,sys;print(len(json.load(sys.stdin)["orders"]))')
          /usr/bin/printf '{"mount":"/srv/cap-db","device":"/dev/vdb","service":"active","orders":%s}\n' "$count" >"$D/evidence.json"; /usr/bin/chown ubuntu:ubuntu "$D/evidence.json"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Stateful workload отделяют от stateless-компонентов, потому что данные
          имеют собственный жизненный цикл и требования к сохранности. В этой
          лабораторной SQLite используется внутри отдельного HTTP database
          service, поэтому `cap-app` выполняет реальный сетевой запрос к `cap-db`.

          Файл базы должен находиться на дополнительном диске, смонтированном в
          `/srv/cap-db`. Сервис запускается автоматически и после перезапуска
          использует тот же data volume и контрольные записи.
    description: |-
      Перейдите к этапу, используя рабочий каталог
      `/home/ubuntu/capstone/07-database`.

      #### Упражнение 1 (Проверяемое состояние)

      На `cap-db` подготовьте файловую систему дополнительного диска и
      постоянное монтирование в `/srv/cap-db`. Разместите SQLite-backed HTTP
      database service, включите автозапуск и создайте минимум две контрольные
      записи заказов. Сохраните
      `/home/ubuntu/capstone/07-database/evidence.json` с mount point, device,
      service state и количеством записей.
  - title: Развёртывание API на cap-app
    actions:
      host:
