  - title: Backing volume и overlay
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/vol-backing-overlay
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/vol-backing-overlay
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for f in lab-overlay.xml xpath-backing-path.txt xpath-backing-format.txt; do /usr/bin/test -s "$DIR/$f" || fail "нет $f"; done
          /usr/bin/grep -qx 'qcow2' "$DIR/xpath-backing-format.txt" || fail "backing format должен быть qcow2"
          /usr/bin/grep -q '/tmp/libvirt-lab-pool/lab-disk.qcow2' "$DIR/xpath-backing-path.txt" || fail "backing path должен указывать на lab-disk.qcow2"
          /usr/bin/python3 - <<'PYCHECK'
          import subprocess, xml.etree.ElementTree as ET, sys
          xml=subprocess.check_output(['/usr/bin/sudo','-n','/usr/bin/virsh','-c','qemu:///system','vol-dumpxml','--pool','lab-pool','lab-overlay.qcow2'], text=True)
          r=ET.fromstring(xml); bs=r.find('backingStore')
          if bs is None or bs.findtext('path') is None or bs.find('format').get('type')!='qcow2':
              print('Ошибка: lab-overlay.qcow2 должен иметь backingStore format qcow2', file=sys.stderr); sys.exit(1)
          PYCHECK
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/vol-backing-overlay
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"

          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-info lab-pool >/dev/null 2>&1; then
            /usr/bin/sudo -n /usr/bin/install -d -m 0755 /tmp/libvirt-lab-pool
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-define-as lab-pool dir --target /tmp/libvirt-lab-pool >/dev/null
          fi
          /usr/bin/sudo -n /usr/bin/install -d -m 0755 /tmp/libvirt-lab-pool
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-start lab-pool >/dev/null 2>&1 || true
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-refresh lab-pool >/dev/null 2>&1 || true


          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-info --pool lab-pool lab-disk.qcow2 >/dev/null 2>&1; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-create-as lab-pool lab-disk.qcow2 256M --format qcow2 >/dev/null
          fi
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-info --pool lab-pool lab-sparse.qcow2 >/dev/null 2>&1; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-create-as lab-pool lab-sparse.qcow2 1G --allocation 0 --format qcow2 >/dev/null
          fi
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-info --pool lab-pool lab-raw.img >/dev/null 2>&1; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-create-as lab-pool lab-raw.img 128M --format raw >/dev/null
          fi

          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-delete --pool lab-pool lab-overlay.qcow2 >/dev/null 2>&1 || true
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-create-as lab-pool lab-overlay.qcow2 256M --format qcow2 --backing-vol lab-disk.qcow2 --backing-vol-format qcow2 >/dev/null
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-dumpxml --pool lab-pool lab-overlay.qcow2 >"$DIR/lab-overlay.xml"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-dumpxml --pool lab-pool --xpath 'string(/volume/backingStore/path)' lab-overlay.qcow2 >"$DIR/xpath-backing-path.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-dumpxml --pool lab-pool --xpath 'string(/volume/backingStore/format/@type)' lab-overlay.qcow2 >"$DIR/xpath-backing-format.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Qcow2 overlay может ссылаться на backing volume: новые записи идут в
          overlay, а чтения неизменённых блоков обслуживаются из base. Это основа
          шаблонов, snapshots и быстрых тестовых окружений.

          В XML такая связь отображается в `<backingStore>` с path и format
          backing-файла. Overlay не должен использоваться одновременно с
          изменением base, иначе цепочка может стать неконсистентной.

          #### Пример 1 (Overlay с backing volume)

          ``` bash
          sudo -n virsh -c qemu:///system vol-create-as lab-pool lab-overlay.qcow2 256M --format qcow2 --backing-vol lab-disk.qcow2 --backing-vol-format qcow2
          ```
    description: |-
      Перейдите в каталог `~/vol-backing-overlay`.

      #### Упражнение 1 (Backing volume и overlay)

      Создайте overlay и сохраните XML/XPath:

      ``` bash
      sudo -n virsh -c qemu:///system vol-create-as lab-pool lab-overlay.qcow2 256M --format qcow2 --backing-vol lab-disk.qcow2 --backing-vol-format qcow2
      sudo -n virsh -c qemu:///system vol-dumpxml --pool lab-pool lab-overlay.qcow2 > lab-overlay.xml
      sudo -n virsh -c qemu:///system vol-dumpxml --pool lab-pool --xpath 'string(/volume/backingStore/path)' lab-overlay.qcow2 > xpath-backing-path.txt
      sudo -n virsh -c qemu:///system vol-dumpxml --pool lab-pool --xpath 'string(/volume/backingStore/format/@type)' lab-overlay.qcow2 > xpath-backing-format.txt
      ```
