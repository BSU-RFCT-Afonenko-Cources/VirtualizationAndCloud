          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/pool-dumpxml-xpath
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for f in lab-pool.xml xpath-name.txt xpath-type.txt xpath-target-path.txt; do /usr/bin/test -s "$DIR/$f" || fail "нет $DIR/$f"; done
          /usr/bin/python3 - "$DIR/lab-pool.xml" <<'PYCHECK' || exit 1
          import sys, xml.etree.ElementTree as ET
          r=ET.parse(sys.argv[1]).getroot()
          vals=(r.findtext('name'), r.get('type'), r.findtext('target/path'))
          if vals != ('lab-pool','dir','/tmp/libvirt-lab-pool'):
              print(f'Ошибка: неверный XML pool: {vals}', file=sys.stderr); sys.exit(1)
          PYCHECK
          /usr/bin/test "$(/usr/bin/tr -d '\n\r ' <"$DIR/xpath-name.txt")" = lab-pool || fail "xpath-name.txt должен содержать lab-pool"
          /usr/bin/test "$(/usr/bin/tr -d '\n\r ' <"$DIR/xpath-type.txt")" = dir || fail "xpath-type.txt должен содержать dir"
          /usr/bin/test "$(/usr/bin/tr -d '\n\r ' <"$DIR/xpath-target-path.txt")" = /tmp/libvirt-lab-pool || fail "xpath-target-path.txt должен содержать /tmp/libvirt-lab-pool"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/pool-dumpxml-xpath
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-info lab-pool >/dev/null 2>&1; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-define-as lab-pool dir --target /tmp/libvirt-lab-pool >/dev/null
          fi
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-dumpxml lab-pool >"$DIR/lab-pool.xml"
          /usr/bin/python3 - "$DIR/lab-pool.xml" "$DIR" <<'PYSOL'
          import sys, xml.etree.ElementTree as ET, pathlib
          r=ET.parse(sys.argv[1]).getroot(); d=pathlib.Path(sys.argv[2])
          (d/'xpath-name.txt').write_text(r.findtext('name')+'\n')
          (d/'xpath-type.txt').write_text(r.get('type')+'\n')
          (d/'xpath-target-path.txt').write_text(r.findtext('target/path')+'\n')
          PYSOL
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          `pool-dumpxml` раскрывает фактическую XML-конфигурацию pool. XPath
          удобен для автоматической проверки конкретных полей: имени, типа и
          target path.

          Тип pool хранится как атрибут корневого элемента `/pool/@type`, имя — в
          `/pool/name`, а каталог назначения — в `/pool/target/path`.

          #### Пример 1 (XPath для target path)

          ``` bash
          xmllint --xpath 'string(/pool/target/path)' lab-pool.xml
          ```
