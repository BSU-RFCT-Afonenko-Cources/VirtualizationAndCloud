          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-download --pool lab-pool lab-raw.img "$DIR/downloaded-before-wipe.bin" --offset 0 --length 23 >/dev/null
          /usr/bin/grep -a 'LIBVIRT_VOLUME_LAB_DATA' "$DIR/downloaded-before-wipe.bin" >"$DIR/downloaded-string.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-wipe --pool lab-pool lab-raw.img --algorithm zero >/dev/null
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-info --pool lab-pool lab-raw.img >"$DIR/vol-info-after-wipe.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          `vol-upload` и `vol-download` позволяют записывать и читать volume через
          libvirt API. Для демонстрации произвольных байтов лучше использовать raw
          volume, потому что запись в начало qcow2 повредит его metadata.

          `vol-wipe` очищает содержимое существующего volume, но не удаляет сам
          объект. После wipe `vol-info` должен по-прежнему находить volume.

          #### Пример 1 (Upload/download raw data)

          ``` bash
          printf 'LIBVIRT_VOLUME_LAB_DATA' > upload.bin
          sudo -n virsh -c qemu:///system vol-upload --pool lab-pool lab-raw.img upload.bin --offset 0 --length 23
          ```
    description: |-
      Перейдите в каталог `~/vol-io-wipe`.

      #### Упражнение 1 (Upload, download и wipe raw volume)

      Запишите строку в raw volume, скачайте первые байты, затем очистите
      volume:

      ``` bash
      printf 'LIBVIRT_VOLUME_LAB_DATA' > upload.bin
      sudo -n virsh -c qemu:///system vol-upload --pool lab-pool lab-raw.img upload.bin --offset 0 --length 23
      sudo -n virsh -c qemu:///system vol-download --pool lab-pool lab-raw.img downloaded-before-wipe.bin --offset 0 --length 23
      grep -a 'LIBVIRT_VOLUME_LAB_DATA' downloaded-before-wipe.bin > downloaded-string.txt
      sudo -n virsh -c qemu:///system vol-wipe --pool lab-pool lab-raw.img --algorithm zero
      sudo -n virsh -c qemu:///system vol-info --pool lab-pool lab-raw.img > vol-info-after-wipe.txt
      ```
  - title: Удаление volumes и очистка
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/vol-delete-cleanup
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/vol-delete-cleanup
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          /usr/bin/test -s "$DIR/final-vol-list-details.txt" || fail "нет final-vol-list-details.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-refresh lab-pool >/dev/null 2>&1 || true
          for vol in lab-overlay.qcow2 lab-disk-clone.qcow2 lab-from-xml.qcow2 lab-sparse.qcow2 lab-raw.img lab-disk.qcow2 manual-volume.qcow2 generated-by-args.qcow2; do
            if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-info --pool lab-pool "$vol" >/dev/null 2>&1; then fail "$vol всё ещё существует"; fi
            if /usr/bin/test -e "/tmp/libvirt-lab-pool/$vol"; then fail "файл /tmp/libvirt-lab-pool/$vol всё ещё существует"; fi
          done
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/vol-delete-cleanup
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"

          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-info lab-pool >/dev/null 2>&1; then
            /usr/bin/sudo -n /usr/bin/install -d -m 0755 /tmp/libvirt-lab-pool
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-define-as lab-pool dir --target /tmp/libvirt-lab-pool >/dev/null
          fi
          /usr/bin/sudo -n /usr/bin/install -d -m 0755 /tmp/libvirt-lab-pool
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-start lab-pool >/dev/null 2>&1 || true
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-refresh lab-pool >/dev/null 2>&1 || true

          for vol in lab-overlay.qcow2 lab-disk-clone.qcow2 lab-from-xml.qcow2 lab-sparse.qcow2 lab-raw.img lab-disk.qcow2 manual-volume.qcow2 generated-by-args.qcow2 lab-disk-reflink-preview.qcow2; do
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-delete --pool lab-pool "$vol" >/dev/null 2>&1 || true
            /usr/bin/sudo -n /usr/bin/rm -f "/tmp/libvirt-lab-pool/$vol" >/dev/null 2>&1 || true
          done
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-refresh lab-pool >/dev/null 2>&1 || true
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-list lab-pool --details >"$DIR/final-vol-list-details.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          `vol-delete` удаляет storage volume из pool; для directory pool это
          удаление соответствующего файла. Это отличается от `vol-wipe`, который
          очищает содержимое, но оставляет volume существующим.

          Очистка лабораторных ресурсов должна быть точечной: удаляйте только
          volume с именами `lab-*` и `manual-*` в `lab-pool`. Pool можно оставить
          active для следующих лабораторных работ.

          #### Пример 1 (Удалить конкретный volume)

          ``` bash
          sudo -n virsh -c qemu:///system vol-delete --pool lab-pool lab-overlay.qcow2
          ```
    description: |-
      Перейдите в каталог `~/vol-delete-cleanup`.

      #### Упражнение 1 (Удаление volumes и очистка)

      Удалите volumes лабораторной и сохраните финальный список:

      ``` bash
      for vol in lab-overlay.qcow2 lab-disk-clone.qcow2 lab-from-xml.qcow2 lab-sparse.qcow2 lab-raw.img lab-disk.qcow2 manual-volume.qcow2; do
        sudo -n virsh -c qemu:///system vol-delete --pool lab-pool "$vol" >/dev/null 2>&1 || true
      done
      sudo -n virsh -c qemu:///system pool-refresh lab-pool
      sudo -n virsh -c qemu:///system vol-list lab-pool --details > final-vol-list-details.txt
      ```
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — KVM/QEMU Lab
      prepare: ''
  order: 5
- title: 'Libvirt snapshots: external overlays, metadata and consolidation'
  description: |-
    В этой лабораторной работе вы исследуете snapshots домена `lab-vm`:
    baseline диска, дерево metadata, preview XML, external disk-only
    overlays, quiesce, external memory state, создание из XML, revert,
    backing chain, `blockcommit`, `--no-metadata` и безопасную очистку.

    Работа использует только файлы с префиксом `lab-` в
    `/tmp/libvirt-snapshots`. Основной диск определяется по target `vda`;
    его исходный путь сохраняется до создания overlays. Не удаляйте чужие
    snapshots и файлы вне лабораторного каталога. External snapshot
    разделяет данные диска и metadata libvirt, поэтому перед удалением файла
    всегда проверяйте активный source и backing chain.
  time-limit-minutes: 240
  steps:
  - title: Базовая инвентаризация snapshot
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/snapshot-baseline
          /usr/bin/install -d -o root -g root -m 1777 /tmp/libvirt-snapshots
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/snapshot-baseline
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for file in domstate.txt domblklist.txt domain.xml disk-info.txt baseline.env; do /usr/bin/test -s "$DIR/$file" || fail "нет непустого файла $file"; done
          /usr/bin/grep -q '<domain' "$DIR/domain.xml" || fail 'domain.xml не содержит <domain>'
          /usr/bin/grep -qx 'DISK_TARGET=vda' "$DIR/baseline.env" || fail 'baseline.env не содержит DISK_TARGET=vda'
          BASE=$(/usr/bin/sed -n 's/^BASE_DISK=//p' "$DIR/baseline.env")
          /usr/bin/test -n "$BASE" || fail 'BASE_DISK не задан'
          case "$BASE" in /*) ;; *) fail 'BASE_DISK должен быть абсолютным путём';; esac
          /usr/bin/grep -Eq '(^|[[:space:]])vda([[:space:]]|$)' "$DIR/domblklist.txt" || fail 'domblklist.txt не содержит target vda'
          /usr/bin/grep -q '<name>lab-vm</name>' "$DIR/domain.xml" || fail 'сохранён XML не домена lab-vm'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/snapshot-baseline
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/install -d -o root -g root -m 1777 /tmp/libvirt-snapshots
          /usr/bin/virsh -c qemu:///system dominfo lab-vm >/dev/null
          /usr/bin/virsh -c qemu:///system domstate lab-vm >"$DIR/domstate.txt"
          /usr/bin/virsh -c qemu:///system domblklist lab-vm --details >"$DIR/domblklist.txt"
          /usr/bin/virsh -c qemu:///system dumpxml lab-vm >"$DIR/domain.xml"
          BASE=$(/usr/bin/awk '$3=="vda"{print $4; exit}' "$DIR/domblklist.txt")
          /usr/bin/test -n "$BASE"
          /usr/bin/printf 'DISK_TARGET=vda\nBASE_DISK=%s\n' "$BASE" >"$DIR/baseline.env"
          /usr/bin/qemu-img info "$BASE" >"$DIR/disk-info.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Snapshot фиксирует состояние виртуальной машины в определённый момент,
          но корректная работа начинается с инвентаризации. Target диска (`vda`) —
          имя устройства в domain XML, а source — реальный файл активного слоя.
          После external snapshot source изменится на overlay, поэтому исходный
          путь нужно сохранить заранее.

          `dumpxml` фиксирует persistent/runtime-конфигурацию домена, а
          `qemu-img info` показывает формат образа и backing file. Эти данные
          образуют baseline, с которым сравниваются последующие состояния.

          #### Пример 1 (Инвентаризация домена и диска)

          ``` bash
          sudo -n virsh -c qemu:///system domblklist lab-vm --details
          sudo -n virsh -c qemu:///system dumpxml lab-vm
          ```
    description: |-
      #### Упражнение 1 (Проверяемое задание)

      Перейдите в каталог `~/snapshot-baseline`. Создайте
      `/tmp/libvirt-snapshots` через `sudo -n`, затем сохраните
      `domstate.txt`, `domblklist.txt`, `domain.xml`, `disk-info.txt` и
      `baseline.env`. В `baseline.env` должны быть строки `DISK_TARGET=vda` и
      `BASE_DISK=<абсолютный source vda>`; `qemu-img info` запускайте для
      этого source.
  - title: Дерево и фильтры snapshots
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/snapshot-list
          /usr/bin/install -d -o root -g root -m 1777 /tmp/libvirt-snapshots
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/snapshot-list
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for file in snapshot-list.txt snapshot-tree.txt snapshot-names.txt snapshot-internal.txt snapshot-external.txt snapshot-disk-only.txt; do /usr/bin/test -e "$DIR/$file" || fail "нет файла $file"; done
          /usr/bin/test -s "$DIR/snapshot-list.txt" || fail 'snapshot-list.txt пуст'
          /usr/bin/test -s "$DIR/snapshot-tree.txt" || fail 'snapshot-tree.txt пуст'
          /usr/bin/grep -Eq 'Name|Имя|no snapshots|snapshot|Сним' "$DIR/snapshot-list.txt" "$DIR/snapshot-tree.txt" || fail 'нет вывода snapshot-list или понятной диагностики'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/snapshot-list
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          run(){ OUT=$1; shift; if ! /usr/bin/virsh -c qemu:///system "$@" >"$DIR/$OUT" 2>&1; then /usr/bin/test -s "$DIR/$OUT" || /usr/bin/printf 'command unsupported or failed\n' >"$DIR/$OUT"; fi; /usr/bin/test -s "$DIR/$OUT" || /usr/bin/printf 'no snapshots matched this view\n' >"$DIR/$OUT"; }
          run snapshot-list.txt snapshot-list lab-vm
          run snapshot-tree.txt snapshot-list lab-vm --tree
          run snapshot-names.txt snapshot-list lab-vm --name
          run snapshot-internal.txt snapshot-list lab-vm --internal
          run snapshot-external.txt snapshot-list lab-vm --external
          run snapshot-disk-only.txt snapshot-list lab-vm --disk-only
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Libvirt хранит snapshot metadata как дерево. Новый snapshot обычно
          становится current, а прежний current — его parent; после отката и
          создания нового snapshot может появиться ветвление.

          `snapshot-list` умеет показывать таблицу, дерево, только имена и
          фильтровать объекты по типу. Пустой результат является корректным
          состоянием до создания первого snapshot, а неподдерживаемый конкретной
          версией фильтр следует зафиксировать как диагностику.

          #### Пример 1 (Представления дерева)

          ``` bash
          sudo -n virsh -c qemu:///system snapshot-list lab-vm --tree
          sudo -n virsh -c qemu:///system snapshot-list lab-vm --name --disk-only
          ```
    description: |-
      #### Упражнение 1 (Проверяемое задание)

      Перейдите в `~/snapshot-list`. Сохраните результаты `snapshot-list`,
      `snapshot-list --tree`, `snapshot-list --name`, а также фильтров
      `--internal`, `--external` и `--disk-only` в файлы `snapshot-list.txt`,
      `snapshot-tree.txt`, `snapshot-names.txt`, `snapshot-internal.txt`,
      `snapshot-external.txt`, `snapshot-disk-only.txt`. Для каждого фильтра
      сохраняйте stderr в тот же файл, чтобы даже неподдерживаемый флаг
      оставил диагностику.
  - title: Предварительный просмотр snapshot XML
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/snapshot-preview
          /usr/bin/install -d -o root -g root -m 1777 /tmp/libvirt-snapshots
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          FILE=/home/ubuntu/snapshot-preview/lab-preview.xml
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          /usr/bin/test -s "$FILE" || fail 'нет lab-preview.xml'
          /usr/bin/python3 - "$FILE" <<'PYXML'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          if root.tag!='domainsnapshot': raise SystemExit('Ошибка: root должен быть <domainsnapshot>')
          if root.findtext('name')!='lab-preview': raise SystemExit('Ошибка: snapshot name должен быть lab-preview')
          disk=next((d for d in root.findall('./disks/disk') if d.get('name')=='vda'),None)
          if disk is None or disk.get('snapshot')!='external': raise SystemExit('Ошибка: vda должен иметь snapshot=external')
          source=disk.find('source')
          if source is None or source.get('file')!='/tmp/libvirt-snapshots/lab-preview.qcow2': raise SystemExit('Ошибка: неверный source preview overlay')
          PYXML
          /usr/bin/test ! -e /tmp/libvirt-snapshots/lab-preview.qcow2 || fail '--print-xml не должен создавать lab-preview.qcow2'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/snapshot-preview
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/rm -f /tmp/libvirt-snapshots/lab-preview.qcow2
          /usr/bin/virsh -c qemu:///system snapshot-create-as lab-vm lab-preview --description 'External disk-only preview' --disk-only --diskspec vda,snapshot=external,file=/tmp/libvirt-snapshots/lab-preview.qcow2 --print-xml >"$DIR/lab-preview.xml"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          `snapshot-create-as --print-xml` строит `<domainsnapshot>`, но не
          изменяет домен и не создаёт overlay. Это безопасный способ проверить
          имя, memory policy и per-disk policy перед операцией.

          Для external disk-only snapshot диск `vda` получает
          `snapshot='external'`, а `<source file='…'/>` задаёт абсолютный путь
          нового qcow2 overlay. Исходный образ при реальном создании станет
          backing file.

          #### Пример 1 (Preview external snapshot)

          ``` bash
          sudo -n virsh -c qemu:///system snapshot-create-as lab-vm lab-preview --disk-only --diskspec vda,snapshot=external,file=/tmp/libvirt-snapshots/lab-preview.qcow2 --print-xml
          ```
    description: |-
      #### Упражнение 1 (Проверяемое задание)

      Перейдите в `~/snapshot-preview`. С помощью
      `snapshot-create-as --print-xml` создайте только preview для
      `lab-preview`: disk-only, disk `vda`, external source
      `/tmp/libvirt-snapshots/lab-preview.qcow2`. Сохраните XML как
      `lab-preview.xml` и убедитесь, что файл overlay фактически не появился.
  - title: External disk-only snapshot
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/external-disk-snapshot
          /usr/bin/install -d -o root -g root -m 1777 /tmp/libvirt-snapshots
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/external-disk-snapshot
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for file in snapshot-list.txt lab-ext-001.xml domblklist-after.txt; do /usr/bin/test -s "$DIR/$file" || fail "нет непустого файла $file"; done
          /usr/bin/virsh -c qemu:///system snapshot-info lab-vm lab-ext-001 >/dev/null 2>&1 || fail 'metadata lab-ext-001 отсутствует'
          ACTIVE=$(/usr/bin/virsh -c qemu:///system domblklist lab-vm --details | /usr/bin/awk '$3=="vda"{print $4; exit}')
          /usr/bin/test "$ACTIVE" = /tmp/libvirt-snapshots/lab-ext-001.qcow2 || fail 'active source vda не lab-ext-001.qcow2'
          /usr/bin/test -f "$ACTIVE" || fail 'overlay lab-ext-001.qcow2 не существует'
          /usr/bin/grep -q 'lab-ext-001' "$DIR/lab-ext-001.xml" || fail 'dumpxml не содержит имя snapshot'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/external-disk-snapshot
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          if ! /usr/bin/virsh -c qemu:///system snapshot-info lab-vm lab-ext-001 >/dev/null 2>&1; then
            ACTIVE=$(/usr/bin/virsh -c qemu:///system domblklist lab-vm --details | /usr/bin/awk '$3=="vda"{print $4; exit}')
            /usr/bin/test "$ACTIVE" != /tmp/libvirt-snapshots/lab-ext-001.qcow2
            /usr/bin/rm -f /tmp/libvirt-snapshots/lab-ext-001.qcow2
            /usr/bin/virsh -c qemu:///system snapshot-create-as lab-vm lab-ext-001 --description 'Crash-consistent external disk snapshot' --disk-only --atomic --diskspec vda,snapshot=external,file=/tmp/libvirt-snapshots/lab-ext-001.qcow2 >/dev/null
          fi
          /usr/bin/virsh -c qemu:///system snapshot-list lab-vm >"$DIR/snapshot-list.txt"
          /usr/bin/virsh -c qemu:///system snapshot-dumpxml lab-vm lab-ext-001 >"$DIR/lab-ext-001.xml"
          /usr/bin/virsh -c qemu:///system domblklist lab-vm --details >"$DIR/domblklist-after.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          External disk snapshot не записывает новые блоки в прежний образ: QEMU
          переключается на новый qcow2 overlay, а прежний активный слой становится
          его backing file. Это удобно для live backup и последующей консолидации.

          Для работающей VM snapshot без `--quiesce` обычно crash-consistent:
          состояние диска соответствует внезапному отключению питания. `--atomic`
          требует либо применить изменения ко всем выбранным дискам, либо не
          применять их вовсе.

          #### Пример 1 (Создание external disk-only overlay)

          ``` bash
          sudo -n virsh -c qemu:///system snapshot-create-as lab-vm lab-ext-001 --disk-only --atomic --diskspec vda,snapshot=external,file=/tmp/libvirt-snapshots/lab-ext-001.qcow2
          ```
    description: |-
      #### Упражнение 1 (Проверяемое задание)

      Перейдите в `~/external-disk-snapshot`. Создайте `lab-ext-001` с
      `--disk-only --atomic` и
      `--diskspec vda,snapshot=external,file=/tmp/libvirt-snapshots/lab-ext-001.qcow2`.
      Сохраните `snapshot-list.txt`, `lab-ext-001.xml` и
      `domblklist-after.txt`.
  - title: Согласованный snapshot с quiesce
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/quiesced-snapshot
          /usr/bin/install -d -o root -g root -m 1777 /tmp/libvirt-snapshots
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/quiesced-snapshot
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          /usr/bin/test -s "$DIR/domfsinfo.txt" || fail 'нет domfsinfo.txt'
          /usr/bin/test -s "$DIR/domblklist-after.txt" || fail 'нет domblklist-after.txt'
          if /usr/bin/test -s "$DIR/quiesce-success.txt"; then
            /usr/bin/virsh -c qemu:///system snapshot-info lab-vm lab-quiesce-001 >/dev/null 2>&1 || fail 'заявлен успех, но metadata lab-quiesce-001 отсутствует'
            /usr/bin/test -s "$DIR/lab-quiesce-001.xml" || fail 'при успехе нет dumpxml'
            exit 0
          fi
          /usr/bin/test -s "$DIR/quiesce-error.txt" || fail 'нужен quiesce-success.txt или quiesce-error.txt'
          /usr/bin/grep -Eqi 'agent|guest|quies|freeze|unsupported|not supported|недоступ|не поддерж|inactive|domain is not running|ошиб' "$DIR/quiesce-error.txt" || fail 'quiesce-error.txt не объясняет причину отказа'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/quiesced-snapshot
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/rm -f "$DIR/quiesce-success.txt" "$DIR/quiesce-error.txt"
          /usr/bin/virsh -c qemu:///system domfsinfo lab-vm >"$DIR/domfsinfo.txt" 2>&1 || /usr/bin/printf 'guest agent unavailable for domfsinfo\n' >>"$DIR/domfsinfo.txt"
          if /usr/bin/virsh -c qemu:///system snapshot-info lab-vm lab-quiesce-001 >/dev/null 2>&1; then
            /usr/bin/printf 'lab-quiesce-001 already exists\n' >"$DIR/quiesce-success.txt"
            /usr/bin/virsh -c qemu:///system snapshot-dumpxml lab-vm lab-quiesce-001 >"$DIR/lab-quiesce-001.xml"
          else
            ACTIVE=$(/usr/bin/virsh -c qemu:///system domblklist lab-vm --details | /usr/bin/awk '$3=="vda"{print $4; exit}')
            if /usr/bin/test "$ACTIVE" != /tmp/libvirt-snapshots/lab-quiesce-001.qcow2; then /usr/bin/rm -f /tmp/libvirt-snapshots/lab-quiesce-001.qcow2; fi
            if /usr/bin/virsh -c qemu:///system snapshot-create-as lab-vm lab-quiesce-001 --description 'Quiesced external snapshot' --disk-only --quiesce --atomic --diskspec vda,snapshot=external,file=/tmp/libvirt-snapshots/lab-quiesce-001.qcow2 >"$DIR/quiesce-success.txt" 2>"$DIR/quiesce-error.txt"; then
              /usr/bin/rm -f "$DIR/quiesce-error.txt"
              /usr/bin/virsh -c qemu:///system snapshot-dumpxml lab-vm lab-quiesce-001 >"$DIR/lab-quiesce-001.xml"
            else
              /usr/bin/rm -f "$DIR/quiesce-success.txt"
              /usr/bin/test -s "$DIR/quiesce-error.txt" || /usr/bin/printf 'quiesce operation failed\n' >"$DIR/quiesce-error.txt"
            fi
          fi
          /usr/bin/virsh -c qemu:///system domblklist lab-vm --details >"$DIR/domblklist-after.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Флаг `--quiesce` просит QEMU guest agent заморозить файловые системы
          перед созданием disk-only snapshot и разморозить их после операции. Это
          повышает согласованность приложений и файловой системы по сравнению с
          crash-consistent снимком.

          Guest agent должен быть установлен в госте, запущен и подключён каналом
          в domain XML. Отсутствие agent — ожидаемая ветка лабораторной: важно
          сохранить точный stderr, а не маскировать ошибку пустым файлом.

          #### Пример 1 (Проверка agent и попытка quiesce)

          ``` bash
          sudo -n virsh -c qemu:///system domfsinfo lab-vm
          sudo -n virsh -c qemu:///system snapshot-create-as lab-vm lab-quiesce-001 --disk-only --quiesce --atomic --diskspec vda,snapshot=external,file=/tmp/libvirt-snapshots/lab-quiesce-001.qcow2
          ```
    description: |-
      #### Упражнение 1 (Проверяемое задание)

      Перейдите в `~/quiesced-snapshot`. Сохраните результат
      `domfsinfo lab-vm` в `domfsinfo.txt`. Попытайтесь создать
      `lab-quiesce-001` с `--disk-only --quiesce --atomic` и overlay
      `/tmp/libvirt-snapshots/lab-quiesce-001.qcow2`. При успехе создайте
      `quiesce-success.txt` и `lab-quiesce-001.xml`; при ошибке сохраните
      stderr в `quiesce-error.txt`. В обоих случаях сохраните
      `domblklist-after.txt`.
  - title: External snapshot состояния памяти
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/memory-snapshot
          /usr/bin/install -d -o root -g root -m 1777 /tmp/libvirt-snapshots
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/memory-snapshot
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          /usr/bin/test -s "$DIR/lab-mem-001.xml" || fail 'нет preview XML'
          /usr/bin/test -s "$DIR/domblklist-after.txt" || fail 'нет domblklist-after.txt'
          /usr/bin/grep -q '/tmp/libvirt-snapshots/lab-mem-001.memory' "$DIR/lab-mem-001.xml" || fail 'XML не содержит memory file'
          /usr/bin/grep -q '/tmp/libvirt-snapshots/lab-mem-001.qcow2' "$DIR/lab-mem-001.xml" || fail 'XML не содержит external disk file'
          if /usr/bin/test -s "$DIR/memory-success.txt"; then
            /usr/bin/virsh -c qemu:///system snapshot-info lab-vm lab-mem-001 >/dev/null 2>&1 || fail 'заявлен успех, но metadata lab-mem-001 отсутствует'
            /usr/bin/test -s "$DIR/lab-mem-001-dump.xml" || fail 'нет dumpxml успешного memory snapshot'
            /usr/bin/test -s /tmp/libvirt-snapshots/lab-mem-001.memory || fail 'нет external memory file'
            exit 0
          fi
          /usr/bin/test -s "$DIR/memory-error.txt" || fail 'нужен memory-success.txt или memory-error.txt'
          /usr/bin/grep -Eqi 'unsupported|not supported|memory|inactive|running|space|недостат|не поддерж|ошиб' "$DIR/memory-error.txt" || fail 'memory-error.txt не содержит понятной диагностики'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/memory-snapshot
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/rm -f "$DIR/memory-success.txt" "$DIR/memory-error.txt"
          /usr/bin/virsh -c qemu:///system snapshot-create-as lab-vm lab-mem-001 --description 'External memory and disk snapshot' --memspec file=/tmp/libvirt-snapshots/lab-mem-001.memory,snapshot=external --diskspec vda,snapshot=external,file=/tmp/libvirt-snapshots/lab-mem-001.qcow2 --print-xml >"$DIR/lab-mem-001.xml"
          if /usr/bin/virsh -c qemu:///system snapshot-info lab-vm lab-mem-001 >/dev/null 2>&1; then
            /usr/bin/printf 'lab-mem-001 already exists\n' >"$DIR/memory-success.txt"
            /usr/bin/virsh -c qemu:///system snapshot-dumpxml lab-vm lab-mem-001 >"$DIR/lab-mem-001-dump.xml"
          else
            STATE=$(/usr/bin/virsh -c qemu:///system domstate lab-vm 2>&1 || true)
            NEED_KIB=$(/usr/bin/virsh -c qemu:///system dominfo lab-vm | /usr/bin/awk '/^Max memory:/{print $3; exit}')
            FREE_KIB=$(/usr/bin/df -Pk /tmp/libvirt-snapshots | /usr/bin/awk 'NR==2{print $4}')
            if ! /usr/bin/printf '%s\n' "$STATE" | /usr/bin/grep -Eqi 'running|работает'; then
              /usr/bin/printf 'memory snapshot unsupported: domain is not running\n' >"$DIR/memory-error.txt"
            elif /usr/bin/test -n "$NEED_KIB" && /usr/bin/test "$FREE_KIB" -lt "$((NEED_KIB + 262144))"; then
              /usr/bin/printf 'memory snapshot unsupported: insufficient free space\n' >"$DIR/memory-error.txt"
            else
              /usr/bin/rm -f /tmp/libvirt-snapshots/lab-mem-001.memory /tmp/libvirt-snapshots/lab-mem-001.qcow2
              if /usr/bin/virsh -c qemu:///system snapshot-create-as lab-vm lab-mem-001 --description 'External memory and disk snapshot' --atomic --memspec file=/tmp/libvirt-snapshots/lab-mem-001.memory,snapshot=external --diskspec vda,snapshot=external,file=/tmp/libvirt-snapshots/lab-mem-001.qcow2 >"$DIR/memory-success.txt" 2>"$DIR/memory-error.txt"; then
                /usr/bin/rm -f "$DIR/memory-error.txt"
                /usr/bin/virsh -c qemu:///system snapshot-dumpxml lab-vm lab-mem-001 >"$DIR/lab-mem-001-dump.xml"
              else
                /usr/bin/rm -f "$DIR/memory-success.txt"
                /usr/bin/test -s "$DIR/memory-error.txt" || /usr/bin/printf 'memory snapshot unsupported by driver\n' >"$DIR/memory-error.txt"
              fi
            fi
          fi
          /usr/bin/virsh -c qemu:///system domblklist lab-vm --details >"$DIR/domblklist-after.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Full/system snapshot объединяет disk state и состояние RAM/runtime.
          External memory state сохраняется в отдельный файл и требует места,
          сопоставимого с объёмом памяти гостя; поддержка зависит от QEMU/libvirt,
          состояния домена и типа дисков.

          Такой snapshot похож на hibernation: при восстановлении возвращаются
          процессы и устройства, но он не является переносимой резервной копией.
          Перед запуском полезно сохранить preview XML и диагностику возможностей.

          #### Пример 1 (Preview внешнего memory state)

          ``` bash
          sudo -n virsh -c qemu:///system snapshot-create-as lab-vm lab-mem-001 --memspec file=/tmp/libvirt-snapshots/lab-mem-001.memory,snapshot=external --diskspec vda,snapshot=external,file=/tmp/libvirt-snapshots/lab-mem-001.qcow2 --print-xml
          ```
    description: |-
      #### Упражнение 1 (Проверяемое задание)

      Перейдите в `~/memory-snapshot`. Сохраните preview в `lab-mem-001.xml`,
      используя external memory `/tmp/libvirt-snapshots/lab-mem-001.memory` и
      external disk `/tmp/libvirt-snapshots/lab-mem-001.qcow2`. Выполните
      snapshot только если команда поддерживается окружением. При успехе
      сохраните `memory-success.txt` и dumpxml; при отказе — непустой
      `memory-error.txt` с stderr. Всегда сохраните `domblklist-after.txt`.
  - title: Создание snapshot из XML
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/snapshot-create-xml
          /usr/bin/install -d -o root -g root -m 1777 /tmp/libvirt-snapshots
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/snapshot-create-xml
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          /usr/bin/test -s "$DIR/lab-xml-001.xml" || fail 'нет lab-xml-001.xml'
          /usr/bin/test -s "$DIR/domblklist-after.txt" || fail 'нет domblklist-after.txt'
          /usr/bin/python3 - "$DIR/lab-xml-001.xml" <<'PYXML'
          import sys, xml.etree.ElementTree as ET
          r=ET.parse(sys.argv[1]).getroot()
          if r.findtext('name')!='lab-xml-001': raise SystemExit('Ошибка: неверное имя snapshot')
          d=next((x for x in r.findall('./disks/disk') if x.get('name')=='vda'),None)
          if d is None or d.get('snapshot')!='external': raise SystemExit('Ошибка: vda не external')
          if d.find('source') is None or d.find('source').get('file')!='/tmp/libvirt-snapshots/lab-xml-001.qcow2': raise SystemExit('Ошибка: неверный source')
          PYXML
          if /usr/bin/test -s "$DIR/create-result.txt"; then
            /usr/bin/virsh -c qemu:///system snapshot-info lab-vm lab-xml-001 >/dev/null 2>&1 || fail 'заявлен успех, но metadata lab-xml-001 отсутствует'
            /usr/bin/test -s "$DIR/lab-xml-001-dump.xml" || fail 'нет dumpxml успешного snapshot'
          else
            /usr/bin/test -s "$DIR/create-error.txt" || fail 'нет create-result.txt или create-error.txt'
          fi
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/snapshot-create-xml
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/cat >"$DIR/lab-xml-001.xml" <<'XML'
          <domainsnapshot>
            <name>lab-xml-001</name>
            <description>XML-first external disk-only snapshot</description>
            <memory snapshot='no'/>
            <disks>
              <disk name='vda' snapshot='external'>
                <driver type='qcow2'/>
                <source file='/tmp/libvirt-snapshots/lab-xml-001.qcow2'/>
              </disk>
            </disks>
          </domainsnapshot>
          XML
          /usr/bin/rm -f "$DIR/create-result.txt" "$DIR/create-error.txt"
          if /usr/bin/virsh -c qemu:///system snapshot-info lab-vm lab-xml-001 >/dev/null 2>&1; then
            /usr/bin/printf 'lab-xml-001 already exists\n' >"$DIR/create-result.txt"
          else
            ACTIVE=$(/usr/bin/virsh -c qemu:///system domblklist lab-vm --details | /usr/bin/awk '$3=="vda"{print $4; exit}')
            if /usr/bin/test "$ACTIVE" != /tmp/libvirt-snapshots/lab-xml-001.qcow2; then /usr/bin/rm -f /tmp/libvirt-snapshots/lab-xml-001.qcow2; fi
            if /usr/bin/virsh -c qemu:///system snapshot-create lab-vm "$DIR/lab-xml-001.xml" --disk-only --atomic --validate >"$DIR/create-result.txt" 2>"$DIR/create-error.txt"; then
              /usr/bin/rm -f "$DIR/create-error.txt"
            elif /usr/bin/grep -Eqi 'validate|option' "$DIR/create-error.txt" && /usr/bin/virsh -c qemu:///system snapshot-create lab-vm "$DIR/lab-xml-001.xml" --disk-only --atomic >"$DIR/create-result.txt" 2>"$DIR/create-error.txt"; then
              /usr/bin/rm -f "$DIR/create-error.txt"
            else
              /usr/bin/rm -f "$DIR/create-result.txt"
              /usr/bin/test -s "$DIR/create-error.txt" || /usr/bin/printf 'snapshot-create failed\n' >"$DIR/create-error.txt"
            fi
          fi
          if /usr/bin/virsh -c qemu:///system snapshot-info lab-vm lab-xml-001 >/dev/null 2>&1; then /usr/bin/virsh -c qemu:///system snapshot-dumpxml lab-vm lab-xml-001 >"$DIR/lab-xml-001-dump.xml"; fi
          /usr/bin/virsh -c qemu:///system domblklist lab-vm --details >"$DIR/domblklist-after.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          XML-first подход делает snapshot policy явной и воспроизводимой:
          `<name>`, `<description>`, `<memory>` и каждый `<disk>` можно проверить
          до выполнения. Для disk-only snapshot у памяти задают `snapshot='no'`, а
          для `vda` — external source.

          `--validate` просит libvirt проверить XML по schema, если установленная
          версия поддерживает этот флаг. Для XML с external disk policy операция
          выполняется с `--disk-only`, иначе full-system semantics могут
          игнорировать per-disk настройки.

          #### Пример 1 (Создание по XML)

          ``` bash
          sudo -n virsh -c qemu:///system snapshot-create lab-vm lab-xml-001.xml --disk-only --atomic --validate
          ```
    description: |-
      #### Упражнение 1 (Проверяемое задание)

      Перейдите в `~/snapshot-create-xml`. Создайте `lab-xml-001.xml` с name,
      description, `<memory snapshot='no'/>` и external disk `vda`, source
      `/tmp/libvirt-snapshots/lab-xml-001.qcow2`, driver qcow2. Выполните
      `snapshot-create` с `--disk-only --atomic --validate`; если `--validate`
      не поддерживается, сохраните ошибку и повторите без него. Сохраните
      `create-result.txt`, `lab-xml-001-dump.xml` либо `create-error.txt`, и
      `domblklist-after.txt`.
  - title: XML, current, info и parent
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/snapshot-metadata
          /usr/bin/install -d -o root -g root -m 1777 /tmp/libvirt-snapshots
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/snapshot-metadata
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for file in selected-snapshot.txt snapshot-dump.xml snapshot-current.txt snapshot-info.txt snapshot-parent.txt; do /usr/bin/test -s "$DIR/$file" || fail "нет непустого файла $file"; done
          NAME=$(/usr/bin/head -n 1 "$DIR/selected-snapshot.txt")
          case "$NAME" in lab-*) ;; *) fail 'выбран snapshot без префикса lab-';; esac
          /usr/bin/grep -q "<name>$NAME</name>" "$DIR/snapshot-dump.xml" || fail 'snapshot-dump.xml не соответствует выбранному имени'
          /usr/bin/grep -q "$NAME" "$DIR/snapshot-info.txt" || fail 'snapshot-info.txt не содержит выбранное имя'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/snapshot-metadata
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          NAME=''
          for candidate in lab-xml-001 lab-mem-001 lab-quiesce-001 lab-ext-001; do if /usr/bin/virsh -c qemu:///system snapshot-info lab-vm "$candidate" >/dev/null 2>&1; then NAME=$candidate; break; fi; done
          if /usr/bin/test -z "$NAME"; then NAME=$(/usr/bin/virsh -c qemu:///system snapshot-list lab-vm --name | /usr/bin/grep '^lab-' | /usr/bin/head -n 1); fi
          /usr/bin/test -n "$NAME"
          /usr/bin/printf '%s\n' "$NAME" >"$DIR/selected-snapshot.txt"
          /usr/bin/virsh -c qemu:///system snapshot-dumpxml lab-vm "$NAME" >"$DIR/snapshot-dump.xml"
          /usr/bin/virsh -c qemu:///system snapshot-current lab-vm --name >"$DIR/snapshot-current.txt" 2>&1 || /usr/bin/printf 'no current snapshot marker\n' >"$DIR/snapshot-current.txt"
          /usr/bin/virsh -c qemu:///system snapshot-info lab-vm "$NAME" >"$DIR/snapshot-info.txt"
          /usr/bin/virsh -c qemu:///system snapshot-parent lab-vm "$NAME" >"$DIR/snapshot-parent.txt" 2>&1 || /usr/bin/printf 'snapshot %s has no parent or parent query is unsupported\n' "$NAME" >"$DIR/snapshot-parent.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Metadata-команды описывают graph snapshots независимо от файлов backing
          chain. `snapshot-dumpxml` показывает parent и disk policy,
          `snapshot-current --name` — current marker, а `snapshot-info` — сводные
          свойства.

          У корневого snapshot нет parent, поэтому ненулевой код `snapshot-parent`
          допустим только вместе с сохранённой понятной диагностикой. Перед revert
          или delete нужно сопоставить metadata с фактическим `domblklist`.

          #### Пример 1 (Чтение metadata)

          ``` bash
          sudo -n virsh -c qemu:///system snapshot-info lab-vm lab-ext-001
          sudo -n virsh -c qemu:///system snapshot-parent lab-vm lab-ext-001
          ```
    description: |-
      #### Упражнение 1 (Проверяемое задание)

      Перейдите в `~/snapshot-metadata`. Выберите существующий snapshot с
      префиксом `lab-` и запишите его имя в `selected-snapshot.txt`. Сохраните
      `snapshot-dump.xml`, `snapshot-current.txt`, `snapshot-info.txt`,
      `snapshot-parent.txt`; отсутствие parent оформите как читаемую
      диагностику в последнем файле.
  - title: Откат к snapshot
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/snapshot-revert
          /usr/bin/install -d -o root -g root -m 1777 /tmp/libvirt-snapshots
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/snapshot-revert
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for file in marker-before.txt snapshot-current.txt domstate.txt domblklist-after.txt; do /usr/bin/test -s "$DIR/$file" || fail "нет непустого файла $file"; done
          if /usr/bin/test -s "$DIR/revert-success.txt"; then
            /usr/bin/grep -qx 'lab-ext-001' "$DIR/snapshot-current.txt" || fail 'после успешного revert current не lab-ext-001'
            exit 0
          fi
          /usr/bin/test -s "$DIR/revert-error.txt" || fail 'нужен revert-success.txt или revert-error.txt'
          /usr/bin/grep -Eqi 'external|unsupported|not supported|revert|disk snapshot|не поддерж|ошиб|inactive|risk' "$DIR/revert-error.txt" || fail 'revert-error.txt не объясняет отказ'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/snapshot-revert
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/printf 'marker created before attempted revert to lab-ext-001\n' >"$DIR/marker-before.txt"
          /usr/bin/rm -f "$DIR/revert-success.txt" "$DIR/revert-error.txt"
          if /usr/bin/virsh -c qemu:///system snapshot-info lab-vm lab-ext-001 >/dev/null 2>&1; then
            if /usr/bin/virsh -c qemu:///system snapshot-revert lab-vm lab-ext-001 >"$DIR/revert-success.txt" 2>"$DIR/revert-error.txt"; then /usr/bin/rm -f "$DIR/revert-error.txt"; else /usr/bin/rm -f "$DIR/revert-success.txt"; /usr/bin/test -s "$DIR/revert-error.txt" || /usr/bin/printf 'external snapshot revert unsupported\n' >"$DIR/revert-error.txt"; fi
          else
            /usr/bin/printf 'revert unavailable: lab-ext-001 metadata is absent\n' >"$DIR/revert-error.txt"
          fi
          /usr/bin/virsh -c qemu:///system snapshot-current lab-vm --name >"$DIR/snapshot-current.txt" 2>&1 || /usr/bin/printf 'no current snapshot marker after revert attempt\n' >"$DIR/snapshot-current.txt"
          /usr/bin/virsh -c qemu:///system domstate lab-vm >"$DIR/domstate.txt"
          /usr/bin/virsh -c qemu:///system domblklist lab-vm --details >"$DIR/domblklist-after.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          `snapshot-revert` — разрушительная операция: изменения после выбранной
          точки могут быть потеряны. Disk-only snapshot не содержит RAM, поэтому
          итоговое состояние домена определяется поддержкой driver и флагами
          запуска.

          Поддержка прямого revert для external disk snapshots различается между
          версиями и конфигурациями libvirt. Нельзя подменять неуспешный revert
          ручным удалением активного overlay: следует сохранить stderr и
          продолжить анализ chain.

          #### Пример 1 (Попытка контролируемого revert)

          ``` bash
          sudo -n virsh -c qemu:///system snapshot-revert lab-vm lab-ext-001
          sudo -n virsh -c qemu:///system domblklist lab-vm --details
          ```
    description: |-
      #### Упражнение 1 (Проверяемое задание)

      Перейдите в `~/snapshot-revert`. Запишите marker о намерении отката в
      `marker-before.txt`, затем попытайтесь выполнить
      `snapshot-revert lab-vm lab-ext-001`. При успехе создайте
      `revert-success.txt`, при отказе сохраните stderr в `revert-error.txt`
      без ручного удаления chain. После попытки сохраните
      `snapshot-current.txt`, `domstate.txt` и `domblklist-after.txt`.
  - title: Анализ backing chain
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/backing-chain
          /usr/bin/install -d -o root -g root -m 1777 /tmp/libvirt-snapshots
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/backing-chain
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for file in active-disk.env domblklist.txt backing-chain.txt; do /usr/bin/test -s "$DIR/$file" || fail "нет непустого файла $file"; done
          ACTIVE=$(/usr/bin/sed -n 's/^ACTIVE_DISK=//p' "$DIR/active-disk.env")
          BASE=$(/usr/bin/sed -n 's/^BASE_DISK=//p' /home/ubuntu/snapshot-baseline/baseline.env)
          case "$ACTIVE" in /tmp/libvirt-snapshots/lab-*.qcow2) ;; *) fail 'active disk не является laboratory overlay';; esac
          /usr/bin/grep -Fq "$ACTIVE" "$DIR/backing-chain.txt" || fail 'backing-chain.txt не содержит active overlay'
          /usr/bin/grep -Fq "$BASE" "$DIR/backing-chain.txt" || fail 'backing-chain.txt не содержит исходный base'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/backing-chain
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/virsh -c qemu:///system domblklist lab-vm --details >"$DIR/domblklist.txt"
          ACTIVE=$(/usr/bin/awk '$3=="vda"{print $4; exit}' "$DIR/domblklist.txt")
          /usr/bin/printf 'ACTIVE_DISK=%s\n' "$ACTIVE" >"$DIR/active-disk.env"
          /usr/bin/qemu-img info --backing-chain "$ACTIVE" >"$DIR/backing-chain.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          External snapshots образуют цепочку `base <- overlay <- active overlay`.
          Чтение неизменённых блоков проходит вниз к backing file, а новые записи
          остаются в верхнем слое.

          `qemu-img info --backing-chain` следует запускать для текущего source из
          `domblklist`. Команда показывает каждый слой, его формат и backing
          filename; это обязательная проверка перед commit, pull или удалением
          файлов.

          #### Пример 1 (Просмотр полной цепочки)

          ``` bash
          sudo -n qemu-img info --backing-chain /tmp/libvirt-snapshots/lab-ext-001.qcow2
          ```
    description: |-
      #### Упражнение 1 (Проверяемое задание)

      Перейдите в `~/backing-chain`. Определите текущий source `vda` через
      `domblklist --details`, сохраните его как `ACTIVE_DISK=...` в
      `active-disk.env`. Сохраните `domblklist.txt` и результат
      `qemu-img info --backing-chain` в `backing-chain.txt`.
  - title: Консолидация через blockcommit
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/blockcommit
          /usr/bin/install -d -o root -g root -m 1777 /tmp/libvirt-snapshots
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/blockcommit
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for file in active-before.txt domblklist-after.txt backing-chain-after.txt; do /usr/bin/test -s "$DIR/$file" || fail "нет непустого файла $file"; done
          /usr/bin/test -e "$DIR/backing-before.txt" || fail 'нет файла backing-before.txt'
          if /usr/bin/test -s "$DIR/blockcommit-output.txt"; then
            BEFORE=$(/usr/bin/head -n 1 "$DIR/active-before.txt")
            AFTER=$(/usr/bin/virsh -c qemu:///system domblklist lab-vm --details | /usr/bin/awk '$3=="vda"{print $4; exit}')
            BACKING=$(/usr/bin/head -n 1 "$DIR/backing-before.txt")
            /usr/bin/test -n "$BACKING" || fail 'до успешного commit не сохранён backing path'
            /usr/bin/test "$AFTER" = "$BACKING" || fail "после pivot active source $AFTER не равен прежнему backing $BACKING"
            exit 0
          fi
          /usr/bin/test -s "$DIR/blockcommit-error.txt" || fail 'нужен blockcommit-output.txt или blockcommit-error.txt'
          /usr/bin/grep -Eqi 'unsupported|not supported|inactive|backing|block|job|не поддерж|ошиб|no backing' "$DIR/blockcommit-error.txt" || fail 'blockcommit-error.txt не содержит понятной диагностики'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/blockcommit
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          ACTIVE=$(/usr/bin/virsh -c qemu:///system domblklist lab-vm --details | /usr/bin/awk '$3=="vda"{print $4; exit}')
          /usr/bin/printf '%s\n' "$ACTIVE" >"$DIR/active-before.txt"
          BACKING=$(/usr/bin/qemu-img info --output=json "$ACTIVE" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin).get("full-backing-filename", ""))')
          /usr/bin/printf '%s\n' "$BACKING" >"$DIR/backing-before.txt"
          /usr/bin/rm -f "$DIR/blockcommit-output.txt" "$DIR/blockcommit-error.txt"
          STATE=$(/usr/bin/virsh -c qemu:///system domstate lab-vm 2>&1 || true)
          if /usr/bin/test -z "$BACKING"; then
            /usr/bin/printf 'blockcommit unavailable: active image has no backing file\n' >"$DIR/blockcommit-error.txt"
          elif ! /usr/bin/printf '%s\n' "$STATE" | /usr/bin/grep -Eqi 'running|работает'; then
            /usr/bin/printf 'blockcommit unavailable: domain is inactive\n' >"$DIR/blockcommit-error.txt"
          elif /usr/bin/virsh -c qemu:///system blockcommit lab-vm vda --active --pivot --verbose >"$DIR/blockcommit-output.txt" 2>"$DIR/blockcommit-error.txt"; then
            /usr/bin/rm -f "$DIR/blockcommit-error.txt"
            /usr/bin/test -s "$DIR/blockcommit-output.txt" || /usr/bin/printf 'blockcommit completed and pivoted\n' >"$DIR/blockcommit-output.txt"
          else
            /usr/bin/rm -f "$DIR/blockcommit-output.txt"
            /usr/bin/test -s "$DIR/blockcommit-error.txt" || /usr/bin/printf 'blockcommit operation failed\n' >"$DIR/blockcommit-error.txt"
          fi
          /usr/bin/virsh -c qemu:///system domblklist lab-vm --details >"$DIR/domblklist-after.txt"
          AFTER=$(/usr/bin/awk '$3=="vda"{print $4; exit}' "$DIR/domblklist-after.txt")
          /usr/bin/qemu-img info --backing-chain "$AFTER" >"$DIR/backing-chain-after.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Active block commit копирует данные из верхнего overlay вниз в backing
          file. Сочетание `--active --pivot` после завершения переключает live
          QEMU на нижний слой; прежний active overlay затем можно удалить, если он
          больше нигде не используется.

          Block job относится к live block graph, а не автоматически ко всему
          snapshot metadata tree. После pivot нужно отдельно проверить
          `domblklist`, дождаться завершения job и только затем очищать metadata
          или неактивный файл.

          #### Пример 1 (Active commit с pivot)

          ``` bash
          sudo -n virsh -c qemu:///system blockcommit lab-vm vda --active --pivot --verbose
          ```
    description: |-
      #### Упражнение 1 (Проверяемое задание)

      Перейдите в `~/blockcommit`. Зафиксируйте active source в
      `active-before.txt`, а его непосредственный backing file — в
      `backing-before.txt`. Если у него есть backing file и домен работает,
      выполните `blockcommit lab-vm vda --active --pivot --verbose`, сохранив
      вывод в `blockcommit-output.txt`; при unsupported/invalid state
      сохраните stderr в `blockcommit-error.txt`. Затем сохраните
      `domblklist-after.txt` и `backing-chain-after.txt` для нового active
      source.
  - title: Удаление snapshot metadata
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/snapshot-delete
          /usr/bin/install -d -o root -g root -m 1777 /tmp/libvirt-snapshots
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/snapshot-delete
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for file in snapshot-tree-before.txt snapshot-tree-after.txt delete-results.txt; do /usr/bin/test -s "$DIR/$file" || fail "нет непустого файла $file"; done
          LEFT=$(/usr/bin/virsh -c qemu:///system snapshot-list lab-vm --name | /usr/bin/grep '^lab-' || true)
          if /usr/bin/test -n "$LEFT"; then
            /usr/bin/test -s "$DIR/delete-error.txt" || fail 'остались lab-* metadata без delete-error.txt'
            /usr/bin/grep -Eqi 'active|child|external|unsupported|metadata|не поддерж|ошиб' "$DIR/delete-error.txt" || fail 'delete-error.txt не объясняет оставшиеся metadata'
          fi
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/snapshot-delete
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/virsh -c qemu:///system snapshot-list lab-vm --tree >"$DIR/snapshot-tree-before.txt" 2>&1 || /usr/bin/printf 'snapshot tree unavailable\n' >"$DIR/snapshot-tree-before.txt"
          : >"$DIR/delete-results.txt"
          /usr/bin/rm -f "$DIR/delete-error.txt"
          COUNT=0
          while /usr/bin/test "$COUNT" -lt 32; do
            NAME=$(/usr/bin/virsh -c qemu:///system snapshot-list lab-vm --name --leaves 2>/dev/null | /usr/bin/grep '^lab-' | /usr/bin/head -n 1 || true)
            if /usr/bin/test -z "$NAME"; then NAME=$(/usr/bin/virsh -c qemu:///system snapshot-list lab-vm --name | /usr/bin/grep '^lab-' | /usr/bin/tail -n 1 || true); fi
            /usr/bin/test -n "$NAME" || break
            if /usr/bin/virsh -c qemu:///system snapshot-delete lab-vm "$NAME" --metadata >>"$DIR/delete-results.txt" 2>>"$DIR/delete-error.txt"; then :; else break; fi
            COUNT=$((COUNT+1))
          done
          /usr/bin/test -s "$DIR/delete-results.txt" || /usr/bin/printf 'no lab-* snapshot metadata required deletion\n' >"$DIR/delete-results.txt"
          /usr/bin/test ! -e "$DIR/delete-error.txt" || /usr/bin/test -s "$DIR/delete-error.txt" || /usr/bin/rm -f "$DIR/delete-error.txt"
          /usr/bin/virsh -c qemu:///system snapshot-list lab-vm --tree >"$DIR/snapshot-tree-after.txt" 2>&1 || /usr/bin/printf 'snapshot tree unavailable after deletion\n' >"$DIR/snapshot-tree-after.txt"
          /usr/bin/test -s "$DIR/snapshot-tree-after.txt" || /usr/bin/printf 'no snapshots remain\n' >"$DIR/snapshot-tree-after.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          `snapshot-delete` работает с объектами metadata и, в зависимости от типа
          snapshot и версии libvirt, может пытаться изменить storage. Для external
          snapshots безопасный общий приём после отдельно проверенной консолидации
          — `--metadata`, который забывает graph object, не удаляя файл.

          Удалять следует только имена с лабораторным префиксом `lab-`. Если
          metadata всё ещё описывает активную или разветвлённую chain, ошибку
          нужно сохранить и не переходить к принудительному удалению файлов.

          #### Пример 1 (Удаление только metadata)

          ``` bash
          sudo -n virsh -c qemu:///system snapshot-delete lab-vm lab-ext-001 --metadata
          ```
    description: |-
      #### Упражнение 1 (Проверяемое задание)

      Перейдите в `~/snapshot-delete`. Сохраните дерево в
      `snapshot-tree-before.txt`. Для каждого snapshot с именем `lab-*`
      выполните безопасное `snapshot-delete --metadata`; не удаляйте файлы и
      чужие metadata. Сохраните вывод операций в `delete-results.txt`, ошибки
      в `delete-error.txt`, а итоговое дерево — в `snapshot-tree-after.txt`.
  - title: External snapshot без metadata
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/no-metadata-snapshot
          /usr/bin/install -d -o root -g root -m 1777 /tmp/libvirt-snapshots
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/no-metadata-snapshot
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for file in snapshot-names-before.txt snapshot-names-after.txt domblklist-after.txt no-metadata-result.txt; do /usr/bin/test -e "$DIR/$file" || fail "нет файла $file"; done
          /usr/bin/test -s "$DIR/domblklist-after.txt" || fail 'domblklist-after.txt пуст'
          ! /usr/bin/grep -qx 'lab-nometa-001' "$DIR/snapshot-names-after.txt" || fail 'no-metadata snapshot появился в metadata list'
          ACTIVE=$(/usr/bin/virsh -c qemu:///system domblklist lab-vm --details | /usr/bin/awk '$3=="vda"{print $4; exit}')
          /usr/bin/test "$ACTIVE" = /tmp/libvirt-snapshots/lab-nometa-001.qcow2 || fail 'active source не lab-nometa-001.qcow2'
          /usr/bin/test -f "$ACTIVE" || fail 'no-metadata overlay отсутствует'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/no-metadata-snapshot
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/virsh -c qemu:///system snapshot-list lab-vm --name >"$DIR/snapshot-names-before.txt"
          ACTIVE=$(/usr/bin/virsh -c qemu:///system domblklist lab-vm --details | /usr/bin/awk '$3=="vda"{print $4; exit}')
          if /usr/bin/test "$ACTIVE" = /tmp/libvirt-snapshots/lab-nometa-001.qcow2; then
            /usr/bin/printf 'lab-nometa-001 overlay already active\n' >"$DIR/no-metadata-result.txt"
          else
            /usr/bin/rm -f /tmp/libvirt-snapshots/lab-nometa-001.qcow2
            /usr/bin/virsh -c qemu:///system snapshot-create-as lab-vm lab-nometa-001 --description 'No-metadata live backup overlay' --disk-only --atomic --no-metadata --diskspec vda,snapshot=external,file=/tmp/libvirt-snapshots/lab-nometa-001.qcow2 >"$DIR/no-metadata-result.txt"
          fi
          /usr/bin/virsh -c qemu:///system snapshot-list lab-vm --name >"$DIR/snapshot-names-after.txt"
          /usr/bin/virsh -c qemu:///system domblklist lab-vm --details >"$DIR/domblklist-after.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          `--no-metadata` создаёт external overlay и переключает block device, но
          не добавляет объект в snapshot tree. Такой режим подходит для live
          backup pattern: создать overlay, копировать ставший неизменяемым base,
          затем выполнить commit/pivot.

          Отсутствие metadata не означает отсутствие snapshot storage state.
          Истиной для активного I/O остаётся `domblklist`, поэтому демонстрация
          должна одновременно сохранить snapshot list и текущий disk source.

          #### Пример 1 (Overlay без snapshot object)

          ``` bash
          sudo -n virsh -c qemu:///system snapshot-create-as lab-vm lab-nometa-001 --disk-only --atomic --no-metadata --diskspec vda,snapshot=external,file=/tmp/libvirt-snapshots/lab-nometa-001.qcow2
          ```
    description: |-
      #### Упражнение 1 (Проверяемое задание)

      Перейдите в `~/no-metadata-snapshot`. Сохраните список имён до операции
      в `snapshot-names-before.txt`. Создайте external disk-only overlay
      `/tmp/libvirt-snapshots/lab-nometa-001.qcow2` с `--no-metadata`, затем
      сохраните `snapshot-names-after.txt`, `domblklist-after.txt` и
      `no-metadata-result.txt`. Имя `lab-nometa-001` не должно появиться в
      metadata list, но файл должен стать source `vda`.
  - title: Очистка snapshot-объектов
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/snapshot-cleanup
          /usr/bin/install -d -o root -g root -m 1777 /tmp/libvirt-snapshots
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/snapshot-cleanup
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for file in snapshot-list-final.txt domblklist-final.txt disk-info-final.txt cleanup-results.txt; do /usr/bin/test -s "$DIR/$file" || fail "нет непустого файла $file"; done
          BASE=$(/usr/bin/sed -n 's/^BASE_DISK=//p' /home/ubuntu/snapshot-baseline/baseline.env)
          ACTIVE=$(/usr/bin/virsh -c qemu:///system domblklist lab-vm --details | /usr/bin/awk '$3=="vda"{print $4; exit}')
          /usr/bin/test "$ACTIVE" = "$BASE" || fail "active source $ACTIVE не равен исходному $BASE"
          LEFT=$(/usr/bin/virsh -c qemu:///system snapshot-list lab-vm --name | /usr/bin/grep '^lab-' || true)
          /usr/bin/test -z "$LEFT" || fail 'остались snapshot metadata с префиксом lab-'
          if /usr/bin/find /tmp/libvirt-snapshots -maxdepth 1 -type f \( -name 'lab-*.qcow2' -o -name 'lab-*.memory' \) -print -quit | /usr/bin/grep -q .; then fail 'остались временные overlay/memory files'; fi
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/snapshot-cleanup
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          BASE=$(/usr/bin/sed -n 's/^BASE_DISK=//p' /home/ubuntu/snapshot-baseline/baseline.env)
          /usr/bin/test -n "$BASE"
          : >"$DIR/cleanup-results.txt"
          STATE=$(/usr/bin/virsh -c qemu:///system domstate lab-vm 2>&1 || true)
          if ! /usr/bin/printf '%s\n' "$STATE" | /usr/bin/grep -Eqi 'running|работает'; then /usr/bin/virsh -c qemu:///system start lab-vm >>"$DIR/cleanup-results.txt"; fi
          COUNT=0
          while /usr/bin/test "$COUNT" -lt 32; do
            ACTIVE=$(/usr/bin/virsh -c qemu:///system domblklist lab-vm --details | /usr/bin/awk '$3=="vda"{print $4; exit}')
            /usr/bin/test -n "$ACTIVE"
            if /usr/bin/test "$ACTIVE" = "$BASE"; then break; fi
            case "$ACTIVE" in /tmp/libvirt-snapshots/lab-*.qcow2) ;; *) /usr/bin/printf 'refusing to commit unexpected active source %s\n' "$ACTIVE" >&2; exit 1;; esac
            /usr/bin/virsh -c qemu:///system blockcommit lab-vm vda --active --pivot --verbose >>"$DIR/cleanup-results.txt" 2>&1
            COUNT=$((COUNT+1))
          done
          ACTIVE=$(/usr/bin/virsh -c qemu:///system domblklist lab-vm --details | /usr/bin/awk '$3=="vda"{print $4; exit}')
          /usr/bin/test "$ACTIVE" = "$BASE"
          COUNT=0
          while /usr/bin/test "$COUNT" -lt 64; do
            NAME=$(/usr/bin/virsh -c qemu:///system snapshot-list lab-vm --name --leaves 2>/dev/null | /usr/bin/grep '^lab-' | /usr/bin/head -n 1 || true)
            if /usr/bin/test -z "$NAME"; then NAME=$(/usr/bin/virsh -c qemu:///system snapshot-list lab-vm --name | /usr/bin/grep '^lab-' | /usr/bin/tail -n 1 || true); fi
            /usr/bin/test -n "$NAME" || break
            /usr/bin/virsh -c qemu:///system snapshot-delete lab-vm "$NAME" --metadata >>"$DIR/cleanup-results.txt" 2>&1
            COUNT=$((COUNT+1))
          done
          while IFS= read -r FILE; do /usr/bin/test "$FILE" = "$ACTIVE" || /usr/bin/rm -f -- "$FILE"; done < <(/usr/bin/find /tmp/libvirt-snapshots -maxdepth 1 -type f \( -name 'lab-*.qcow2' -o -name 'lab-*.memory' \) -print)
          /usr/bin/virsh -c qemu:///system snapshot-list lab-vm --name >"$DIR/snapshot-list-final.txt"
          /usr/bin/test -s "$DIR/snapshot-list-final.txt" || /usr/bin/printf '(no snapshots)\n' >"$DIR/snapshot-list-final.txt"
          /usr/bin/virsh -c qemu:///system domblklist lab-vm --details >"$DIR/domblklist-final.txt"
          /usr/bin/qemu-img info "$ACTIVE" >"$DIR/disk-info-final.txt"
          /usr/bin/test -s "$DIR/cleanup-results.txt" || /usr/bin/printf 'snapshot chain already clean\n' >"$DIR/cleanup-results.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Безопасная очистка начинается с определения active source и его backing
          chain. Пока файл является active layer или backing file, удалять его
          нельзя. Сначала chain сокращают commit/pivot или pull, затем удаляют
          metadata и лишь после этого — неиспользуемые overlays.

          Финальное состояние лабораторной — один активный disk layer, отсутствие
          `lab-*` snapshot metadata и временных `.qcow2`/`.memory` в
          `/tmp/libvirt-snapshots`. Исходный base path берётся из baseline, а не
          угадывается по имени.

          #### Пример 1 (Финальная проверка)

          ``` bash
          sudo -n virsh -c qemu:///system domblklist lab-vm --details
          sudo -n virsh -c qemu:///system snapshot-list lab-vm --name
          ```
    description: |-
      #### Упражнение 1 (Проверяемое задание)

      Перейдите в `~/snapshot-cleanup`. Сокращайте active chain `vda`
      последовательными `blockcommit --active --pivot`, пока active source не
      станет исходным `BASE_DISK` из
      `/home/ubuntu/snapshot-baseline/baseline.env`. Удалите только laboratory
      snapshot metadata и только неактивные файлы `lab-*.qcow2`/`lab-*.memory`
      из `/tmp/libvirt-snapshots`. Сохраните `snapshot-list-final.txt`,
      `domblklist-final.txt`, `disk-info-final.txt`, `cleanup-results.txt`.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — KVM/QEMU Lab
      prepare: ''
  order: 6
- title: 'Libvirt/QEMU/KVM: CPU scheduling, pinning и cputune'
  description: |-
    Лабораторная работа посвящена управлению CPU scheduling для домена
    `lab-vm` в libvirt/QEMU/KVM: сбору baseline, размещению vCPU на physical
    CPU, настройке `schedinfo`, quota/period, shares, emulator/global
    limits, наблюдению эффекта и безопасному сбросу политик.

    Все действия выполняются только с доменом `lab-vm` и служебными файлами
    в домашнем каталоге пользователя `ubuntu`. Подготовительные и
    проверочные скрипты сохраняют baseline в
    `/home/ubuntu/.libvirt-cpu-scheduling`, используют только объекты с
    учебным префиксом `lab-` и не изменяют сетевую конфигурацию или storage
    pools хоста.
  time-limit-minutes: 180
  steps:
  - title: CPU topology и baseline
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          STEP_DIR="/home/ubuntu/cpu-topology"
          STATE_DIR="/home/ubuntu/.libvirt-cpu-scheduling"
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$STEP_DIR"
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$STATE_DIR"
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dominfo lab-vm >/dev/null 2>&1; then
            /usr/bin/printf 'Домен lab-vm не найден. Подготовьте учебный домен перед выполнением шага.
          ' > "$STEP_DIR/pre-step-warning.txt"
            /usr/bin/chown ubuntu:ubuntu "$STEP_DIR/pre-step-warning.txt"
            exit 0
          fi
          if /usr/bin/test ! -s "$STATE_DIR/baseline.env"; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system schedinfo lab-vm > "$STATE_DIR/baseline-schedinfo.txt" 2>&1 || true
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vcpupin lab-vm > "$STATE_DIR/baseline-vcpupin.txt" 2>&1 || true
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm > "$STATE_DIR/baseline-domain.xml" 2>&1 || true
            ONLINE_CPUS="$(/bin/cat /sys/devices/system/cpu/online 2>/dev/null || /usr/bin/printf '0')"
            FIRST_CPU="$(/usr/bin/printf '%s
          ' "$ONLINE_CPUS" | /usr/bin/awk -F'[-,]' '{print $1}')"
            if /usr/bin/test -z "$FIRST_CPU"; then FIRST_CPU=0; fi
            SHARES="$(/usr/bin/awk '/^[[:space:]]*cpu_shares[[:space:]]*:/ {print $3; found=1} END {if (!found) print "1024"}' "$STATE_DIR/baseline-schedinfo.txt")"
            /usr/bin/printf 'LAB_DOMAIN=lab-vm
          LAB_WIDE_MASK=%s
          LAB_PIN_MASK=%s
          LAB_BASELINE_SHARES=%s
          LAB_VCPU_PERIOD=100000
          LAB_VCPU_QUOTA=50000
          LAB_NEW_SHARES=512
          LAB_EMULATOR_PERIOD=100000
          LAB_EMULATOR_QUOTA=80000
          LAB_GLOBAL_PERIOD=100000
          LAB_GLOBAL_QUOTA=90000
          ' "$ONLINE_CPUS" "$FIRST_CPU" "$SHARES" > "$STATE_DIR/baseline.env"
            /usr/bin/chown -R ubuntu:ubuntu "$STATE_DIR"
          fi
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/cpu-topology
          STATE_DIR=/home/ubuntu/.libvirt-cpu-scheduling
          fail(){ /usr/bin/printf 'Ошибка: %s
          ' "$1" >&2; exit 1; }
          /usr/bin/test -d "$DIR" || fail "нет каталога $DIR"
          for f in nodeinfo.txt capabilities.xml vcpucount.txt vcpuinfo.txt cpu-stats-total.txt; do /usr/bin/test -s "$DIR/$f" || fail "нет непустого файла $DIR/$f"; done
          /usr/bin/grep -Eiq 'CPU model|Модель CPU|CPU\(s\)|CPU socket|Core\(s\) per socket|Thread\(s\) per core' "$DIR/nodeinfo.txt" || fail 'nodeinfo.txt не содержит CPU model/topology'
          /usr/bin/grep -Eq '<host>|<cpu>|<topology|<model' "$DIR/capabilities.xml" || fail 'capabilities.xml не содержит host CPU topology'
          /usr/bin/grep -Eiq 'maximum|current|config|live|[0-9]+' "$DIR/vcpucount.txt" || fail 'vcpucount.txt не содержит количество vCPU'
          /usr/bin/grep -Eiq 'VCPU|CPU|State|Состояние' "$DIR/vcpuinfo.txt" || fail 'vcpuinfo.txt не содержит информацию vCPU'
          /usr/bin/grep -Eiq 'cpu_time|user_time|system_time|[0-9]' "$DIR/cpu-stats-total.txt" || fail 'cpu-stats-total.txt не содержит baseline CPU stats'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/cpu-topology
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system nodeinfo > "$DIR/nodeinfo.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system capabilities > "$DIR/capabilities.xml"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vcpucount lab-vm > "$DIR/vcpucount.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vcpuinfo lab-vm > "$DIR/vcpuinfo.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system cpu-stats lab-vm --total > "$DIR/cpu-stats-total.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Планирование CPU в libvirt начинается с сопоставления трёх уровней: vCPU
          гостевой VM, physical CPU хоста и потоков процесса QEMU. Libvirt
          показывает topology хоста через `nodeinfo` и `capabilities`, а состояние
          конкретного домена — через `vcpucount`, `vcpuinfo` и `cpu-stats`.

          Baseline нужен до любых изменений: он фиксирует исходные masks,
          количество vCPU и счётчики CPU time. Эти файлы пригодятся в финальном
          шаге, чтобы вернуть `lab-vm` в нейтральное состояние и отличать
          persistent-настройки от live-состояния.

          #### Пример 1

          ``` bash
          sudo -n virsh -c qemu:///system nodeinfo
          sudo -n virsh -c qemu:///system vcpuinfo lab-vm
          ```
    description: |-
      Перейдите в каталог `~/cpu-topology`.

      #### Упражнение 1 (Сбор CPU topology и baseline)

      Сохраните вывод команд:

      ``` bash
      sudo -n virsh -c qemu:///system nodeinfo > nodeinfo.txt
      sudo -n virsh -c qemu:///system capabilities > capabilities.xml
      sudo -n virsh -c qemu:///system vcpucount lab-vm > vcpucount.txt
      sudo -n virsh -c qemu:///system vcpuinfo lab-vm > vcpuinfo.txt
      sudo -n virsh -c qemu:///system cpu-stats lab-vm --total > cpu-stats-total.txt
      ```
  - title: Просмотр scheduler-параметров
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          STEP_DIR="/home/ubuntu/schedinfo-read"
          STATE_DIR="/home/ubuntu/.libvirt-cpu-scheduling"
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$STEP_DIR"
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$STATE_DIR"
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dominfo lab-vm >/dev/null 2>&1; then
            /usr/bin/printf 'Домен lab-vm не найден. Подготовьте учебный домен перед выполнением шага.
          ' > "$STEP_DIR/pre-step-warning.txt"
            /usr/bin/chown ubuntu:ubuntu "$STEP_DIR/pre-step-warning.txt"
            exit 0
          fi
          if /usr/bin/test ! -s "$STATE_DIR/baseline.env"; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system schedinfo lab-vm > "$STATE_DIR/baseline-schedinfo.txt" 2>&1 || true
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vcpupin lab-vm > "$STATE_DIR/baseline-vcpupin.txt" 2>&1 || true
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm > "$STATE_DIR/baseline-domain.xml" 2>&1 || true
            ONLINE_CPUS="$(/bin/cat /sys/devices/system/cpu/online 2>/dev/null || /usr/bin/printf '0')"
            FIRST_CPU="$(/usr/bin/printf '%s
          ' "$ONLINE_CPUS" | /usr/bin/awk -F'[-,]' '{print $1}')"
            if /usr/bin/test -z "$FIRST_CPU"; then FIRST_CPU=0; fi
            SHARES="$(/usr/bin/awk '/^[[:space:]]*cpu_shares[[:space:]]*:/ {print $3; found=1} END {if (!found) print "1024"}' "$STATE_DIR/baseline-schedinfo.txt")"
            /usr/bin/printf 'LAB_DOMAIN=lab-vm
          LAB_WIDE_MASK=%s
          LAB_PIN_MASK=%s
          LAB_BASELINE_SHARES=%s
          LAB_VCPU_PERIOD=100000
          LAB_VCPU_QUOTA=50000
          LAB_NEW_SHARES=512
          LAB_EMULATOR_PERIOD=100000
          LAB_EMULATOR_QUOTA=80000
          LAB_GLOBAL_PERIOD=100000
          LAB_GLOBAL_QUOTA=90000
          ' "$ONLINE_CPUS" "$FIRST_CPU" "$SHARES" > "$STATE_DIR/baseline.env"
            /usr/bin/chown -R ubuntu:ubuntu "$STATE_DIR"
          fi
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/schedinfo-read
          STATE_DIR=/home/ubuntu/.libvirt-cpu-scheduling
          fail(){ /usr/bin/printf 'Ошибка: %s
          ' "$1" >&2; exit 1; }
          /usr/bin/test -d "$DIR" || fail "нет каталога $DIR"
          /usr/bin/test -s "$DIR/schedinfo.txt" || fail 'нет schedinfo.txt'
          /usr/bin/test -s "$DIR/domain.xml" || fail 'нет domain.xml'
          /usr/bin/grep -Eiq 'Scheduler|cpu_shares|vcpu_period|vcpu_quota|emulator_|global_' "$DIR/schedinfo.txt" || fail 'schedinfo.txt не похож на вывод virsh schedinfo'
          if /usr/bin/grep -q '<cputune>' "$DIR/domain.xml"; then
            /usr/bin/test -s "$DIR/cputune.xml" || fail 'в domain.xml есть cputune, но cputune.xml пуст'
            /usr/bin/grep -q '<cputune>' "$DIR/cputune.xml" || fail 'cputune.xml должен содержать <cputune>'
          else
            /usr/bin/test -s "$DIR/cputune-absent.txt" || fail 'при отсутствии cputune нужен cputune-absent.txt'
          fi
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/schedinfo-read
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system schedinfo lab-vm > "$DIR/schedinfo.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm > "$DIR/domain.xml"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm | /usr/bin/sed -n '/<cputune>/,/<\/cputune>/p' > "$DIR/cputune.xml"
