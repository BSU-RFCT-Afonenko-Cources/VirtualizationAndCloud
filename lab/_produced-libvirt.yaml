      sudo -n virsh -c qemu:///system dumpxml lab-vm > domain.xml
      sudo -n virsh -c qemu:///system dumpxml lab-vm | sed -n '/<cputune>/,/<\/cputune>/p' > cputune.xml
      ```

      Если файл `cputune.xml` пустой, создайте файл `cputune-absent.txt` с
      коротким пояснением, что `<cputune>` отсутствует в baseline XML.
  - title: vCPU pinning
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          set -euo pipefail
          STEP_DIR="/home/ubuntu/vcpupin"
          STATE_DIR="/home/ubuntu/.libvirt-cpu-scheduling"
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$STEP_DIR"
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$STATE_DIR"
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dominfo lab-vm >/dev/null 2>&1; then
            /usr/bin/printf 'Домен lab-vm не найден. Подготовьте учебный домен перед выполнением шага.
          ' > "$STEP_DIR/pre-step-warning.txt"
            /usr/bin/chown ubuntu:ubuntu "$STEP_DIR/pre-step-warning.txt"
            exit 0
          fi
          if /usr/bin/test ! -s "$STATE_DIR/baseline.env"; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system schedinfo lab-vm > "$STATE_DIR/baseline-schedinfo.txt" 2>&1 || true
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vcpupin lab-vm > "$STATE_DIR/baseline-vcpupin.txt" 2>&1 || true
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm > "$STATE_DIR/baseline-domain.xml" 2>&1 || true
            ONLINE_CPUS="$(/bin/cat /sys/devices/system/cpu/online 2>/dev/null || /usr/bin/printf '0')"
            FIRST_CPU="$(/usr/bin/printf '%s
          ' "$ONLINE_CPUS" | /usr/bin/awk -F'[-,]' '{print $1}')"
            if /usr/bin/test -z "$FIRST_CPU"; then FIRST_CPU=0; fi
            SHARES="$(/usr/bin/awk '/^[[:space:]]*cpu_shares[[:space:]]*:/ {print $3; found=1} END {if (!found) print "1024"}' "$STATE_DIR/baseline-schedinfo.txt")"
            /usr/bin/printf 'LAB_DOMAIN=lab-vm
          LAB_WIDE_MASK=%s
          LAB_PIN_MASK=%s
          LAB_BASELINE_SHARES=%s
          LAB_VCPU_PERIOD=100000
          LAB_VCPU_QUOTA=50000
          LAB_NEW_SHARES=512
          LAB_EMULATOR_PERIOD=100000
          LAB_EMULATOR_QUOTA=80000
          LAB_GLOBAL_PERIOD=100000
          LAB_GLOBAL_QUOTA=90000
          ' "$ONLINE_CPUS" "$FIRST_CPU" "$SHARES" > "$STATE_DIR/baseline.env"
            /usr/bin/chown -R ubuntu:ubuntu "$STATE_DIR"
          fi
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/vcpupin
          STATE_DIR=/home/ubuntu/.libvirt-cpu-scheduling
          fail(){ /usr/bin/printf 'Ошибка: %s
          ' "$1" >&2; exit 1; }
          /usr/bin/test -d "$DIR" || fail "нет каталога $DIR"
          /usr/bin/test -s "$STATE_DIR/baseline.env" || fail 'нет baseline.env'
          . "$STATE_DIR/baseline.env"
          /usr/bin/test -s "$DIR/vcpupin-before.txt" || fail 'нет vcpupin-before.txt'
          /usr/bin/test -s "$DIR/vcpupin-after.txt" || fail 'нет vcpupin-after.txt'
          current=$(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vcpupin lab-vm 2>/dev/null || true)
          /bin/echo "$current" | /usr/bin/awk -v mask="$LAB_PIN_MASK" '$1=="0" && $0 ~ mask {found=1} END {exit found?0:1}' || fail "vCPU 0 не закреплён на ожидаемую маску $LAB_PIN_MASK"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/vcpupin
          STATE_DIR=/home/ubuntu/.libvirt-cpu-scheduling
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          if /usr/bin/test -s "$STATE_DIR/baseline.env"; then . "$STATE_DIR/baseline.env"; fi
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vcpupin lab-vm > "$DIR/vcpupin-before.txt" || true
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vcpupin lab-vm 0 "${LAB_PIN_MASK:-0}" --live --config
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vcpupin lab-vm > "$DIR/vcpupin-after.txt"

          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          `vcpupin` задаёт CPU affinity для конкретного vCPU домена. Маска может
          быть одним CPU (`0`), диапазоном (`0-1`) или списком (`0,2`); libvirt
          применяет её к потокам vCPU через механизмы ОС и cgroups.

          Команды с `--live` меняют работающий домен, `--config` — persistent XML
          для следующего запуска, а `--current` выбирает текущее состояние
          libvirt. В лаборатории применяется live+config, чтобы студент видел
          разницу между runtime и persistent policy.

          #### Пример 1

          ``` bash
          sudo -n virsh -c qemu:///system vcpupin lab-vm
          sudo -n virsh -c qemu:///system vcpupin lab-vm 0 0 --live --config
          ```
    description: |-
