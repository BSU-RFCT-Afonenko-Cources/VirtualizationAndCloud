          wait_http http://192.168.150.10:8080/health; for ep in health version orders; do /usr/bin/curl -fsS "http://192.168.150.10:8080/$ep" >"$D/$ep.json"; done; /usr/bin/chown -R ubuntu:ubuntu "$D"
