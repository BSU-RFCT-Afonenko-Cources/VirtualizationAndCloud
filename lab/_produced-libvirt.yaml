          for f in health.json version.json orders.json service.log; do need_file "/home/ubuntu/capstone/08-api/$f"; done
          h=$(/usr/bin/curl -fsS --max-time 5 http://192.168.151.20:8000/health) || fail 'API health недоступен'; v=$(/usr/bin/curl -fsS http://192.168.151.20:8000/version); o=$(/usr/bin/curl -fsS http://192.168.151.20:8000/orders)
          /usr/bin/python3 -c 'import json,sys; h,v,o=map(json.loads,sys.argv[1:]); assert h["database"]=="ok" and v["version"] in ("1.0.0","2.0.0") and o["source"]=="cap-db" and o["via"]=="cap-db"' "$h" "$v" "$o" || fail 'API не подтверждает обращение к базе'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          source /home/ubuntu/capstone/assets/solution-lib.bash
          # Разворачиваем stateless API, которое читает данные из cap-db по backend-сети.
          D=/home/ubuntu/capstone/08-api; ensure_dir "$D"; wait_ssh 192.168.151.20; scp_vm /home/ubuntu/capstone/assets/app_service.py 192.168.151.20 /tmp/app_service.py; scp_vm /home/ubuntu/capstone/assets/cap-app.service 192.168.151.20 /tmp/cap-app.service
          ssh_vm 192.168.151.20 "sudo -n install -d /opt/capstone; sudo -n install -m 0755 /tmp/app_service.py /opt/capstone/app_service.py; echo 1.0.0 | sudo -n tee /etc/cap-app-version >/dev/null; sudo -n install -m 0644 /tmp/cap-app.service /etc/systemd/system/cap-app.service; sudo -n systemctl daemon-reload; sudo -n systemctl enable --now cap-app.service"
          wait_http http://192.168.151.20:8000/health; for ep in health version orders; do /usr/bin/curl -fsS "http://192.168.151.20:8000/$ep" >"$D/$ep.json"; done; ssh_vm 192.168.151.20 'sudo -n journalctl -u cap-app.service -n 30 --no-pager' >"$D/service.log"; /usr/bin/chown -R ubuntu:ubuntu "$D"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Прикладной сервис обрабатывает HTTP-запросы, но не хранит бизнес-данные
          локально. Адрес базы задаётся конфигурацией backend-сети, а endpoint
          заказов получает данные через сетевой вызов.

          `/health` показывает эксплуатационную готовность и зависимость от базы,
          `/version` идентифицирует развёрнутый выпуск, а `/orders` подтверждает
          полезную работу. Автозапуск и журналы systemd делают сервис наблюдаемым.
    description: |-
      Перейдите к этапу, используя рабочий каталог
      `/home/ubuntu/capstone/08-api`.

      #### Упражнение 1 (Проверяемое состояние)

      На `cap-app` разверните API с автозапуском, настроив обращение к
      `cap-db` по адресу backend-сети. Обеспечьте `/health`, `/version` со
      значением `1.0.0` и `/orders` с данными базы. Сохраните JSON-ответы и
      последние строки журнала сервиса в каталоге шага.
