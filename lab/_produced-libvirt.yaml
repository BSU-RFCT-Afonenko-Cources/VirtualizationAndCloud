      #### Упражнение 1 (Две сети для lab-vm)

      Добавьте к `lab-vm` второй интерфейс в сеть `lab-private` с MAC
      `52:54:00:aa:20:01` через `attach-interface --live --config`. Сохраните:

      - `domiflist.txt`;
      - `lab-vm-config.xml`;
      - `lab-private-leases.txt`;
      - `bridge-link.txt`.
  - title: Диагностика bridge/tap и связности
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/bridge-tap-diagnostics
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/bridge-tap-diagnostics
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for f in bridges.txt bridge-link.txt domiflist.txt domifaddr.txt connectivity.txt; do /usr/bin/test -s "$DIR/$f" || fail "нет непустого файла $DIR/$f"; done
          /usr/bin/grep -Eq 'virbr10|virbr20' "$DIR/bridges.txt" || fail 'bridges.txt должен содержать virbr10 или virbr20'
          /usr/bin/grep -Eq '52:54:00:aa:10:01|52:54:00:aa:20:01' "$DIR/domiflist.txt" || fail 'domiflist.txt должен содержать MAC тестовых интерфейсов'
          /usr/bin/grep -Eq '52:54:00:aa:10:01|52:54:00:aa:20:01|would run|PING|bytes from' "$DIR/connectivity.txt" || fail 'connectivity.txt должен содержать результат или команду диагностики'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/bridge-tap-diagnostics
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/sbin/ip link show type bridge >"$DIR/bridges.txt" 2>&1
          /usr/sbin/bridge link >"$DIR/bridge-link.txt" 2>&1 || /usr/bin/printf 'bridge link unavailable\n' >"$DIR/bridge-link.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domiflist lab-vm >"$DIR/domiflist.txt" 2>&1 || /usr/bin/printf 'lab-vm absent\n' >"$DIR/domiflist.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domifaddr lab-vm >"$DIR/domifaddr.txt" 2>&1 || /usr/bin/printf 'lab-vm absent or no addresses\n' >"$DIR/domifaddr.txt"
          /usr/bin/printf 'would run: ping 192.168.100.1 from lab-vm for MAC 52:54:00:aa:10:01\n' >"$DIR/connectivity.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Диагностика libvirt-сети обычно идёт по слоям. Сначала проверяют XML и
          состояние network, затем host bridge/tap устройства (`ip link`,
          `bridge link`), затем DHCP lease и IP-адреса гостя (`net-dhcp-leases`,
          `domifaddr`).

          Если IP уже известен, полезно проверить связность между гостем и адресом
          bridge. Если доступа в гостя нет, сохраните команду диагностики: важно
          показать, какой именно следующий тест вы бы выполнили.

          #### Пример 1 (Bridge и tap на хосте)

          ``` bash
          bridge link
          ```
    description: |-
      Перейдите в каталог `~/bridge-tap-diagnostics`.

      #### Упражнение 1 (Диагностический снимок bridge/tap)

      Сохраните:

      - `bridges.txt` — `ip link show type bridge`;
      - `bridge-link.txt` — `bridge link`;
      - `domiflist.txt` — `sudo -n virsh -c qemu:///system domiflist lab-vm`;
      - `domifaddr.txt` — `sudo -n virsh -c qemu:///system domifaddr lab-vm`;
      - `connectivity.txt` — результат ping bridge-адреса из гостя, если он
        доступен, либо строку с командой диагностики, например
        `would run: ping 192.168.100.1 from lab-vm`.
  - title: QoS сетевого интерфейса
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/interface-qos
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/interface-qos
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for f in domiftune-before.txt domiftune-after.txt lab-vm-config.xml; do /usr/bin/test -s "$DIR/$f" || fail "нет непустого файла $DIR/$f"; done
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domiftune lab-vm 52:54:00:aa:10:01 --config >/var/tmp/lab-domiftune 2>/dev/null || true
          if /usr/bin/grep -Eq 'inbound.average[[:space:]]*:[[:space:]]*1024|outbound.average[[:space:]]*:[[:space:]]*1024|inbound_average[[:space:]]*=[[:space:]]*1024|outbound_average[[:space:]]*=[[:space:]]*1024' /var/tmp/lab-domiftune "$DIR/domiftune-after.txt"; then
            exit 0
          fi
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm --config >/var/tmp/lab-vm-qos.xml 2>/dev/null || fail 'домен lab-vm не определён'
          /usr/bin/grep -A12 -B4 '52:54:00:aa:10:01' /var/tmp/lab-vm-qos.xml | /usr/bin/grep -q '<bandwidth>' || fail 'domiftune не показывает average=1024 и XML не содержит <bandwidth> для интерфейса'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/interface-qos
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domiftune lab-vm 52:54:00:aa:10:01 --config >"$DIR/domiftune-before.txt" 2>&1 || /usr/bin/printf 'no existing tune\n' >"$DIR/domiftune-before.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domiftune lab-vm 52:54:00:aa:10:01 --inbound 1024,2048,512 --outbound 1024,2048,512 --config
          if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domstate lab-vm | /usr/bin/grep -Eq 'running|работает'; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domiftune lab-vm 52:54:00:aa:10:01 --inbound 1024,2048,512 --outbound 1024,2048,512 --live || true
          fi
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domiftune lab-vm 52:54:00:aa:10:01 --config >"$DIR/domiftune-after.txt" 2>&1
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm --config >"$DIR/lab-vm-config.xml"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Libvirt поддерживает ограничение полосы интерфейса через элемент
          `<bandwidth>` в XML домена и через команду `domiftune`. Параметры
          `inbound` и `outbound` задают направление относительно гостя, а
          `average`, `peak`, `burst` описывают среднюю скорость, пик и размер
          burst.

          Такой механизм демонстрирует rate limiting для noisy neighbor и tenant
          policy: ограничение применяется на стороне хоста, поэтому гостевая ОС не
          может просто снять его изнутри.

          #### Пример 1 (Настройка QoS)

          ``` bash
          sudo -n virsh -c qemu:///system domiftune lab-vm 52:54:00:aa:10:01 --inbound 1024,2048,512 --outbound 1024,2048,512 --config
          ```
    description: |-
      Перейдите в каталог `~/interface-qos`.

      #### Упражнение 1 (Ограничение полосы интерфейса)

      Для интерфейса `52:54:00:aa:10:01` установите inbound и outbound average
      limit `1024` через `virsh domiftune` или через XML `<bandwidth>`.
      Сохраните:

      - `domiftune-before.txt`;
      - `domiftune-after.txt`;
      - `lab-vm-config.xml`.
  - title: Изоляция портов или nwfilter
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/security-filtering
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/security-filtering
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for f in before.xml after.xml; do /usr/bin/test -s "$DIR/$f" || fail "нет непустого файла $DIR/$f"; done
          if /usr/bin/grep -q "isolated='yes'\|isolated=\"yes\"\|<filterref" "$DIR/after.xml"; then exit 0; fi
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-dumpxml lab-private >/var/tmp/lab-private-security.xml 2>/dev/null || true
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm --config >/var/tmp/lab-vm-security.xml 2>/dev/null || true
          /usr/bin/grep -q "isolated='yes'\|isolated=\"yes\"\|<filterref" /var/tmp/lab-private-security.xml /var/tmp/lab-vm-security.xml || fail "не найдено isolated='yes' или <filterref>"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/security-filtering
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-dumpxml lab-private >"$DIR/before.xml"
          /usr/bin/python3 - <<'PY'
          import subprocess, xml.etree.ElementTree as ET
          xml = subprocess.check_output(['/usr/bin/sudo','-n','/usr/bin/virsh','-c','qemu:///system','net-dumpxml','lab-private'], text=True)
          root = ET.fromstring(xml)
          port = root.find('port')
          if port is None:
              port = ET.SubElement(root, 'port')
          port.set('isolated', 'yes')
          ET.indent(root, space='  ')
          ET.ElementTree(root).write('/var/tmp/lab-private-isolated.xml', encoding='unicode')
          PY
          if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-info lab-private | /usr/bin/grep -Eq 'Active:[[:space:]]+yes|Активна:[[:space:]]+да|Активна:[[:space:]]+yes'; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-destroy lab-private
            active=1
          else
            active=0
          fi
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-define /var/tmp/lab-private-isolated.xml
          if /usr/bin/test "$active" = 1; then /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-start lab-private; fi
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-dumpxml lab-private >"$DIR/after.xml"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Port isolation и nwfilter — два способа показать security policy на
          стороне хоста. Port isolation запрещает прямой обмен между
          изолированными портами одной libvirt network, а nwfilter подключает
          готовые или пользовательские фильтры к интерфейсу домена.

          Для базовой лаборатории достаточно безопасного изменения: добавить
          `<port isolated='yes'/>` в isolated-сеть `lab-private` или подключить
          `clean-traffic` к тестовому интерфейсу. Оба варианта не меняют
          глобальную сеть хоста и остаются внутри объектов libvirt.

          #### Пример 1 (Port isolation в network XML)

          ``` bash
          sudo -n virsh -c qemu:///system net-edit lab-private
          ```
    description: |-
      Перейдите в каталог `~/security-filtering`.

      #### Упражнение 1 (Базовая изоляция)

      Реализуйте один механизм:

      - добавьте `<port isolated='yes'/>` в XML сети `lab-private`; или
      - подключите `<filterref filter='clean-traffic'/>` либо другой
        anti-spoofing nwfilter к интерфейсу `lab-vm`.

      Сохраните `before.xml` и `after.xml` для изменённого network/domain XML.
  - title: Очистка сетевых объектов
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/network-cleanup
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/network-cleanup
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for f in net-list-final.txt lab-vm-final.xml links-final.txt; do /usr/bin/test -s "$DIR/$f" || fail "нет непустого файла $DIR/$f"; done
          if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-info lab-nat >/dev/null 2>&1; then fail 'сеть lab-nat всё ещё определена'; fi
          if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-info lab-private >/dev/null 2>&1; then fail 'сеть lab-private всё ещё определена'; fi
          if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm --config >/var/tmp/lab-vm-final.xml 2>/dev/null; then
            ! /usr/bin/grep -q '52:54:00:aa:10:01\|52:54:00:aa:20:01' /var/tmp/lab-vm-final.xml || fail 'лабораторные MAC всё ещё присутствуют в XML lab-vm'
          fi
          ! /usr/sbin/ip link show virbr10 >/dev/null 2>&1 || fail 'bridge virbr10 всё ещё существует'
          ! /usr/sbin/ip link show virbr20 >/dev/null 2>&1 || fail 'bridge virbr20 всё ещё существует'
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/network-cleanup
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          for mac in 52:54:00:aa:10:01 52:54:00:aa:20:01; do
            if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm --config >/var/tmp/lab-vm-clean.xml 2>/dev/null && /usr/bin/grep -q "$mac" /var/tmp/lab-vm-clean.xml; then
              /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system detach-interface lab-vm --type network --mac "$mac" --config || true
            fi
            if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domstate lab-vm 2>/dev/null | /usr/bin/grep -Eq 'running|работает'; then
              /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system detach-interface lab-vm --type network --mac "$mac" --live || true
            fi
          done
          for net in lab-nat lab-private; do
            if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-info "$net" >/dev/null 2>&1; then
              /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-autostart "$net" --disable || true
              if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-info "$net" | /usr/bin/grep -Eq 'Active:[[:space:]]+yes|Активна:[[:space:]]+да|Активна:[[:space:]]+yes'; then
                /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-destroy "$net"
              fi
              /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-undefine "$net"
            fi
          done
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system net-list --all >"$DIR/net-list-final.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dumpxml lab-vm --config >"$DIR/lab-vm-final.xml" 2>&1 || /usr/bin/printf 'lab-vm absent\n' >"$DIR/lab-vm-final.xml"
          /usr/sbin/ip link show >"$DIR/links-final.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          У libvirt network, как и у domains, есть active runtime state и
          persistent XML. Поэтому очистка состоит из нескольких независимых
          операций: убрать интерфейсы из домена, остановить active networks,
          отключить autostart и удалить persistent definition.

          Безопасная очистка должна затрагивать только лабораторные объекты. В
          этой работе удаляются только интерфейсы с MAC `52:54:00:aa:10:01` и
          `52:54:00:aa:20:01`, сети `lab-nat` и `lab-private`, bridges `virbr10` и
          `virbr20`, созданные libvirt для этих сетей.

          #### Пример 1 (Остановка и undefine сети)

          ``` bash
          sudo -n virsh -c qemu:///system net-destroy lab-nat
          sudo -n virsh -c qemu:///system net-undefine lab-nat
          ```
    description: |-
      Перейдите в каталог `~/network-cleanup`.

      #### Упражнение 1 (Очистка лабораторных сетевых объектов)

      Отключите созданные интерфейсы от `lab-vm` для live/config состояния,
      если они есть:

      - `52:54:00:aa:10:01`;
      - `52:54:00:aa:20:01`.

      Затем для сетей `lab-nat` и `lab-private` выполните безопасную очистку:
      `net-autostart --disable`, `net-destroy`, `net-undefine` только для
      существующих лабораторных сетей. Сохраните `net-list-final.txt`,
      `lab-vm-final.xml`, `links-final.txt`.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — KVM/QEMU Lab
      prepare: ''
  order: 3
- title: 'Libvirt storage pools: lifecycle, XML, volumes'
  description: |-
    В этой лабораторной работе вы изучите storage pools libvirt на
    безопасном backend типа `dir`: directory-backed pool, XML-модель,
    lifecycle, autostart, refresh metadata и связь pool/volume/domain.

    Основной объект лабораторной — persistent pool `lab-pool` с target
    `/tmp/libvirt-lab-pool`. Не используйте реальные блочные устройства и
    внешние backend-хранилища: все диски создаются как файлы `qcow2` во
    временных каталогах с префиксом `libvirt-lab-pool`.
  time-limit-minutes: 180
  steps:
  - title: Инвентаризация storage pools
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/pool-inventory
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/pool-inventory
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          /usr/bin/test -s "$DIR/env.sh" || fail "нет файла env.sh"
          /usr/bin/grep -qx 'POOL_NAME=lab-pool' "$DIR/env.sh" || fail "env.sh должен содержать POOL_NAME=lab-pool"
          /usr/bin/grep -qx 'POOL_DIR=/tmp/libvirt-lab-pool' "$DIR/env.sh" || fail "env.sh должен содержать POOL_DIR=/tmp/libvirt-lab-pool"
          for f in pool-list-all.txt pool-list-details.txt pool-info-default.txt; do
            /usr/bin/test -s "$DIR/$f" || fail "нет непустого файла $DIR/$f"
          done
          if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-info lab-pool >/var/tmp/lab-pool-info-inventory 2>/dev/null; then
            if /usr/bin/grep -Eq '^(State|Состояние):[[:space:]]+(running|active|актив)' /var/tmp/lab-pool-info-inventory; then
              fail "lab-pool уже активен; очистите конфликтующий активный laboratory pool"
            fi
          fi
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/pool-inventory
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
