    kvm\nEOF\ntrap 'rm -f prepare.fish' EXIT\n\n    # ----------RUN----------\n  \
    \  chmod u+x prepare.fish\n./prepare.fish\n    "
  steps:
  - title: Проверка готовности хоста к виртуализации
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.fish	---
          cat <<'EOF' > prepare.fish
          #!/bin/fish
          mkdir -p /home/ubuntu/virt-check
          chown ubuntu:ubuntu /home/ubuntu/virt-check
          EOF
          trap 'rm -f prepare.fish' EXIT


          # ----------RUN----------
          chmod u+x prepare.fish
          ./prepare.fish
        check: |-
          # ----------EXEC----------
          # ---	check.fish	---
          cat <<'EOF' > check.fish
          #!/bin/fish
          if not test -f /home/ubuntu/virt-check/uri.txt
            echo 'Нет /home/ubuntu/virt-check/uri.txt'; exit 1
          end
          if not test -r /dev/kvm
            echo 'Нет доступа к /dev/kvm'; exit 1
          end
          if not virsh uri >/dev/null 2>/dev/null
            echo 'Нет подключения virsh'; exit 1
          end
          if test (egrep -c '(vmx|svm)' /proc/cpuinfo) -eq 0
            echo 'CPU не поддерживает VT'; exit 1
          end
          EOF
          trap 'rm -f check.fish' EXIT


          # ----------RUN----------
          chmod u+x check.fish
          ./check.fish
        solution: |-
          # ----------EXEC----------
          # ---	solution.fish	---
          cat <<'EOF' > solution.fish
          #!/bin/fish
          virt-host-validate qemu > /home/ubuntu/virt-check/uri.txt 2>/dev/null; or true
          EOF
          trap 'rm -f solution.fish' EXIT


          # ----------RUN----------
          chmod u+x solution.fish
          ./solution.fish
        hints: |-
          Проверка окружения нужна, чтобы убедиться: аппаратная виртуализация
          активна, доступ к `/dev/kvm` есть, а `virsh` подключается к системному
          демону libvirt.

          #### Пример 1 (URI libvirt)

          ``` bash
          virsh uri
          virt-host-validate -q qemu
          ```
    description: |-
      #### Упражнение 1 (Готовность)

      Проверьте готовность хоста к работе с KVM/libvirt и сохраните результат
      в `/home/ubuntu/virt-check/summary.txt`.

      Проверка должна включать: 1. наличие аппаратной виртуализации CPU; 2.
      доступ к `/dev/kvm`; 3. подключение `virsh` к системному гипервизору.
  - title: Быстрая установка Alpine через virt-install
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.fish	---
          cat <<'EOF' > prepare.fish
          #!/bin/fish
          mkdir -p /home/ubuntu/install-short
          chown ubuntu:ubuntu /home/ubuntu/install-short
          EOF
          trap 'rm -f prepare.fish' EXIT


          # ----------RUN----------
          chmod u+x prepare.fish
          ./prepare.fish
        check: |-
          # ----------EXEC----------
          # ---	check.fish	---
          cat <<'EOF' > check.fish
          #!/bin/fish
          virsh dumpxml alpine-short >/tmp/alpine-short.xml 2>/dev/null; or exit 1
          grep -q '/home/ubuntu/alpine.iso' /tmp/alpine-short.xml; or exit 1
          grep -Eq '<memory unit='KiB'>[0-9]+' /tmp/alpine-short.xml; or exit 1
          grep -q '/home/ubuntu/install-short/alpine-short.qcow2' /tmp/alpine-short.xml; or exit 1
          EOF
          trap 'rm -f check.fish' EXIT


          # ----------RUN----------
          chmod u+x check.fish
          ./check.fish
        solution: |-
          # ----------EXEC----------
          # ---	solution.fish	---
          cat <<'EOF' > solution.fish
          #!/bin/fish
          qemu-img create -f qcow2 /home/ubuntu/install-short/alpine-short.qcow2 1G >/dev/null 2>/dev/null; or true
          virt-install \
           --name alpine-short \
           --memory 448 \
           --vcpus 1 \
           --disk path=/home/ubuntu/install-short/alpine-short.qcow2,format=qcow2,size=1 \
           --cdrom /home/ubuntu/alpine.iso \
           --os-variant alpinelinux3.21 \
           --network network=default \
           --graphics none \
           --noautoconsole \
           --import >/dev/null 2>/dev/null; or true
          EOF
          trap 'rm -f solution.fish' EXIT


          # ----------RUN----------
          chmod u+x solution.fish
          ./solution.fish
        hints: |-
          `virt-install` в коротком режиме быстро создаёт домен с заданными
          ресурсами и установочным ISO.

          #### Пример 1 (Создание ВМ)

          ``` bash
          virt-install \
           --name alpine-short \
           --memory 448 \
           --disk path=/home/ubuntu/install-short/alpine-short.qcow2,format=qcow2,size=1 \
           --cdrom /home/ubuntu/alpine.iso \
           --os-variant alpinelinux3.21 \
           --network default \
           --graphics none \
           --noautoconsole \
           --import
          ```
    description: |-
      #### Упражнение 1 (Быстрая установка)

      Создайте ВМ `alpine-short` командой `virt-install` с ISO
      `/home/ubuntu/alpine.iso`, памятью не более `500 MiB` и диском не более
      `1G`.
  - title: Подготовка XML и определение ВМ
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.fish	---
          cat <<'EOF' > prepare.fish
          #!/bin/fish
          mkdir -p /home/ubuntu/define-xml
          chown ubuntu:ubuntu /home/ubuntu/define-xml
          EOF
          trap 'rm -f prepare.fish' EXIT


          # ----------RUN----------
          chmod u+x prepare.fish
          ./prepare.fish
        check: |-
          # ----------EXEC----------
          # ---	check.fish	---
          cat <<'EOF' > check.fish
          #!/bin/fish

          test -f /home/ubuntu/define-xml/alpine-xml.xml; or exit 1
          virsh dumpxml alpine-xml >/tmp/alpine-xml.xml 2>/dev/null; or exit 1
          grep -q '/home/ubuntu/alpine.iso' /tmp/alpine-xml.xml; or exit 1

          set GUEST_SCRIPT (cat guest.sh | jq -Rrs 'tojson')

          set GUEST_PID (virsh qemu-agent-command testvm  '{
              "execute" : "guest-exec",
              "arguments" : {
                  "path" : "/bin/sh",
                  "arg" : ["-c", '"$GUEST_SCRIPT"'],
                  "capture-output" : true}
          }' | jq '.return')

          set RETURN (virsh qemu-agent-command testvm '{
              "execute" : "guest-exec-status",
              "arguments" : '"$GUEST_PID"'
          }')

          echo $RETURN | jq -r '.return."out-data"' | base64 -d
          EOF
          trap 'rm -f check.fish' EXIT


          # ----------RUN----------
          chmod u+x check.fish
          ./check.fish
        solution: |-
          # ----------EXEC----------
          # ---	solution.fish	---
          cat <<'EOF' > solution.fish
          <<<<<<< HEAD
          <<<<<<< HEAD
          #!/bin/fish
          qemu-img create -f qcow2 /home/ubuntu/define-xml/alpine-xml.qcow2 1G >/dev/null 2>/dev/null; or true
          cat > /home/ubuntu/define-xml/alpine-xml.xml <<'XML'
          <domain type='kvm'><name>alpine-xml</name><memory unit='MiB'>448</memory><vcpu>1</vcpu><os><type arch='x86_64'>hvm</type><boot dev='cdrom'/><boot dev='hd'/></os><devices><disk type='file' device='disk'><driver name='qemu' type='qcow2'/><source file='/home/ubuntu/define-xml/alpine-xml.qcow2'/><target dev='vda' bus='virtio'/></disk><disk type='file' device='cdrom'><driver name='qemu' type='raw'/><source file='/home/ubuntu/alpine.iso'/><target dev='sda' bus='sata'/><readonly/></disk></devices></domain>
          XML
          virsh define /home/ubuntu/define-xml/alpine-xml.xml >/dev/null 2>/dev/null; or true
          ||||||| f589c88
          =======
          echo aboba
          echo biba
          >>>>>>> remotes/origin/codex/create-capstone-lab-on-process-hibernation
          ||||||| f589c88
          =======
          echo aboba
          echo biba
          >>>>>>> remotes/origin/codex/create-debugging-lab-for-compose-applications
          EOF
          trap 'rm -f solution.fish' EXIT


          # ----------RUN----------
          chmod u+x solution.fish
          ./solution.fish
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.fish	---
          cat <<'EOF' > post-step.fish
          <<<<<<< HEAD
          <<<<<<< HEAD
          #!/bin/fish
          # remove generated qcow2, xml remains for review
          rm -f /home/ubuntu/define-xml/alpine-xml.qcow2
          ||||||| f589c88
          =======
          rm ~/guest.sh
          >>>>>>> remotes/origin/codex/create-capstone-lab-on-process-hibernation
          ||||||| f589c88
          =======
          rm ~/guest.sh
          >>>>>>> remotes/origin/codex/create-debugging-lab-for-compose-applications
          EOF
          trap 'rm -f post-step.fish' EXIT


          # ----------RUN----------
          chmod u+x post-step.fish
          ./post-step.fish
        hints: |-
          Подход через XML подходит для повторяемой инфраструктуры: конфигурация
          домена хранится как файл и применяется через `virsh define`.

          #### Пример 1 (Применение XML)

          ``` bash
          virsh define /home/ubuntu/define-xml/alpine-xml.xml
          ```
    description: |-
      #### Упражнение 1 (XML установка)

      Подготовьте XML `/home/ubuntu/define-xml/alpine-xml.xml` и определите ВМ
      `alpine-xml` через `virsh define`. Используйте
      `/home/ubuntu/alpine.iso`, память \<=500 MiB и диск \<=1G.
  - title: Подготовка диска виртуальной машины
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.fish	---
          cat <<'EOF' > prepare.fish
          #!/bin/fish
          mkdir -p /home/ubuntu/disk
          chown ubuntu:ubuntu /home/ubuntu/disk
          EOF
          trap 'rm -f prepare.fish' EXIT


          # ----------RUN----------
          chmod u+x prepare.fish
          ./prepare.fish
        check: |-
          # ----------EXEC----------
          # ---	check.fish	---
          cat <<'EOF' > check.fish
          #!/bin/fish
          if not test -f /home/ubuntu/disk/student-vm.qcow2
            echo 'Нет диска'; exit 1
          end
          if not qemu-img info /home/ubuntu/disk/student-vm.qcow2 | grep -q 'file format: qcow2'
            echo 'Неверный формат диска'; exit 1
          end
          if not test -f /home/ubuntu/disk/disk-info.txt
            echo 'Нет файла disk-info.txt'; exit 1
          end
          EOF
          trap 'rm -f check.fish' EXIT


          # ----------RUN----------
          chmod u+x check.fish
          ./check.fish
        solution: |-
          # ----------EXEC----------
          # ---	solution.fish	---
          cat <<'EOF' > solution.fish
          #!/bin/fish
          qemu-img create -f qcow2 /home/ubuntu/disk/student-vm.qcow2 1G >/dev/null
          qemu-img info /home/ubuntu/disk/student-vm.qcow2 > /home/ubuntu/disk/disk-info.txt
          EOF
          trap 'rm -f solution.fish' EXIT


          # ----------RUN----------
          chmod u+x solution.fish
          ./solution.fish
        hints: |-
          На этом шаге создаётся базовый диск гостевой ВМ. Формат `qcow2` выбран
          из-за удобства и экономии места на учебном стенде.

          #### Пример 1 (Информация о диске)

          ``` bash
          qemu-img info /home/ubuntu/disk/student-vm.qcow2
          ```
    description: |-
      #### Упражнение 1 (Диск)

      Создайте диск `/home/ubuntu/disk/student-vm.qcow2` размером `1G` и
      сохраните вывод `qemu-img info` в `/home/ubuntu/disk/disk-info.txt`.
  - title: Создание и регистрация виртуальной машины
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.fish	---
          cat <<'EOF' > prepare.fish
          #!/bin/fish
          mkdir -p /home/ubuntu/domain
          chown ubuntu:ubuntu /home/ubuntu/domain
          EOF
          trap 'rm -f prepare.fish' EXIT


          # ----------RUN----------
          chmod u+x prepare.fish
          ./prepare.fish
        check: |-
          # ----------EXEC----------
          # ---	check.fish	---
          cat <<'EOF' > check.fish
          #!/bin/fish
          if not test -f /home/ubuntu/domain/student-vm.xml
            echo 'Нет XML'; exit 1
          end
          virsh dumpxml student-vm >/tmp/student-vm.xml 2>/dev/null; or begin; echo 'Домен не определён'; exit 1; end
          grep -q '<name>student-vm</name>' /tmp/student-vm.xml; or exit 1
          grep -Eq "<memory unit='KiB'>([0-9]+)</memory>" /tmp/student-vm.xml; or exit 1
          if not grep -q '/home/ubuntu/alpine.iso' /tmp/student-vm.xml
            echo 'ISO alpine не подключен'; exit 1
          end
          EOF
          trap 'rm -f check.fish' EXIT


          # ----------RUN----------
          chmod u+x check.fish
          ./check.fish
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/bin/bash
          cat > /home/ubuntu/domain/student-vm.xml <<'XML'
          <domain type='kvm'>
            <name>student-vm</name>
            <memory unit='MiB'>448</memory>
            <vcpu>1</vcpu>
            <os><type arch='x86_64'>hvm</type><boot dev='cdrom'/><boot dev='hd'/></os>
            <devices>
              <disk type='file' device='disk'><driver name='qemu' type='qcow2'/><source file='/home/ubuntu/disk/student-vm.qcow2'/><target dev='vda' bus='virtio'/></disk>
              <disk type='file' device='cdrom'><driver name='qemu' type='raw'/><source file='/home/ubuntu/alpine.iso'/><target dev='sda' bus='sata'/><readonly/></disk>
            </devices>
          </domain>
          XML
          virsh define /home/ubuntu/domain/student-vm.xml >/dev/null 2>/dev/null; or true
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          `virsh define` регистрирует постоянную конфигурацию домена в libvirt.
          Это декларативный этап: ВМ ещё не обязана быть запущенной.

          #### Пример 1 (Проверка XML)

          ``` bash
          virsh dumpxml student-vm
          ```
    description: |-
      #### Упражнение 1 (Домен)

      Создайте файл `/home/ubuntu/domain/student-vm.xml` и определите домен
      `student-vm` для Alpine Linux 3.21.3.

      Требования: 1. источник установки: `/home/ubuntu/alpine.iso`; 2. диск:
      `/home/ubuntu/disk/student-vm.qcow2` (не более 1G); 3. память: не более
      500 MiB.
  - title: Изменение ресурсов ВМ через virsh
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.fish	---
          cat <<'EOF' > prepare.fish
          #!/bin/fish
          mkdir -p /home/ubuntu/resources
          chown ubuntu:ubuntu /home/ubuntu/resources
          EOF
          trap 'rm -f prepare.fish' EXIT


          # ----------RUN----------
          chmod u+x prepare.fish
          ./prepare.fish
        check: |-
          # ----------EXEC----------
          # ---	check.fish	---
          cat <<'EOF' > check.fish
          #!/bin/fish
          virsh dumpxml student-vm >/tmp/student-vm.xml 2>/dev/null; or exit 1
          grep -Eq '<vcpu[^>]*>2</vcpu>' /tmp/student-vm.xml; or exit 1
          grep -Eq "<memory unit='MiB'>480</memory>|<memory unit='KiB'>491520</memory>" /tmp/student-vm.xml; or exit 1
          test -f /home/ubuntu/resources/dominfo.txt; or exit 1
          EOF
          trap 'rm -f check.fish' EXIT


          # ----------RUN----------
          chmod u+x check.fish
          ./check.fish
        solution: |-
          # ----------EXEC----------
          # ---	solution.fish	---
          cat <<'EOF' > solution.fish
          #!/bin/fish
          virsh setmaxmem student-vm 480M --config >/dev/null 2>/dev/null; or true
          virsh setmem student-vm 480M --config >/dev/null 2>/dev/null; or true
          virsh setvcpus student-vm 2 --config >/dev/null 2>/dev/null; or true
          virsh dominfo student-vm > /home/ubuntu/resources/dominfo.txt 2>/dev/null; or true
          EOF
          trap 'rm -f solution.fish' EXIT


          # ----------RUN----------
          chmod u+x solution.fish
          ./solution.fish
        hints: |-
          Команды изменения ресурсов с флагом `--config` меняют постоянные
          параметры домена, которые сохраняются между перезапусками.

          #### Пример 1 (Параметры домена)

          ``` bash
          virsh dominfo student-vm
          ```
    description: |-
      #### Упражнение 1 (Ресурсы)

      Измените постоянную конфигурацию `student-vm`: установите память
      `480 MiB` и `2 vCPU`. Сохраните вывод `virsh dominfo student-vm` в
      `/home/ubuntu/resources/dominfo.txt`.

      ``` bash
      virsh setmaxmem student-vm 3072M --config
      virsh setmem student-vm 3072M --config
      virsh setvcpus student-vm 2 --config
      virsh edit student-vm
      ```
  - title: Управление жизненным циклом ВМ
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.fish	---
          cat <<'EOF' > prepare.fish
          #!/bin/fish
          mkdir -p /home/ubuntu/lifecycle
          chown ubuntu:ubuntu /home/ubuntu/lifecycle
          EOF
          trap 'rm -f prepare.fish' EXIT


          # ----------RUN----------
          chmod u+x prepare.fish
          ./prepare.fish
        check: |-
          # ----------EXEC----------
          # ---	check.fish	---
          cat <<'EOF' > check.fish
          #!/bin/fish
          if not virsh dominfo student-vm >/dev/null 2>/dev/null
            echo "Домен student-vm не найден"
            exit 1
          end
          set state (virsh domstate student-vm 2>/dev/null | string trim)
          if not string match -q "shut off" "$state"
            echo "Ожидается итоговое состояние 'shut off', сейчас: $state"
            exit 1
          end
          EOF
          trap 'rm -f check.fish' EXIT


          # ----------RUN----------
          chmod u+x check.fish
          ./check.fish
        solution: |-
          # ----------EXEC----------
          # ---	solution.fish	---
          cat <<'EOF' > solution.fish
          #!/bin/fish
          virsh start student-vm >/dev/null 2>/dev/null; or true
          virsh suspend student-vm >/dev/null 2>/dev/null; or true
          virsh resume student-vm >/dev/null 2>/dev/null; or true
          virsh shutdown student-vm >/dev/null 2>/dev/null; or virsh destroy student-vm >/dev/null 2>/dev/null; or true
          EOF
          trap 'rm -f solution.fish' EXIT


          # ----------RUN----------
          chmod u+x solution.fish
          ./solution.fish
        hints: |-
          Функции жизненного цикла показывают, как libvirt переводит домен между
          состояниями: запуск, пауза, возобновление и остановка.

          #### Пример 1 (Состояние ВМ)

          ``` bash
          virsh domstate student-vm
          ```
    description: |-
      #### Упражнение 1 (Цикл)

      Продемонстрируйте управление состоянием `student-vm`:

      1.  запустите ВМ;
      2.  приостановите и возобновите её работу;
      3.  завершите работу ВМ так, чтобы итоговое состояние было `shut off`.

      start, shutdown, destroy разбить на несколько стадий

      suspend, resume, reboot
  - title: Автозапуск виртуальной машины
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.fish	---
          cat <<'EOF' > prepare.fish
          #!/bin/fish
          mkdir -p /home/ubuntu/autostart
          chown ubuntu:ubuntu /home/ubuntu/autostart
          EOF
          trap 'rm -f prepare.fish' EXIT


          # ----------RUN----------
          chmod u+x prepare.fish
          ./prepare.fish
        check: |-
          # ----------EXEC----------
          # ---	check.fish	---
          cat <<'EOF' > check.fish
          #!/bin/fish
          virsh dominfo student-vm 2>/dev/null | grep -q "Autostart:[[:space:]]*enable"; or virsh dominfo student-vm 2>/dev/null | grep -q "Autostart:[[:space:]]*yes"; or exit 1
          test -f /home/ubuntu/autostart/dominfo.txt; or exit 1
          EOF
          trap 'rm -f check.fish' EXIT


          # ----------RUN----------
          chmod u+x check.fish
          ./check.fish
        solution: |-
          # ----------EXEC----------
          # ---	solution.fish	---
          cat <<'EOF' > solution.fish
          #!/bin/fish
          virsh autostart student-vm >/dev/null 2>/dev/null; or true
          virsh dominfo student-vm > /home/ubuntu/autostart/dominfo.txt 2>/dev/null; or true
          EOF
          trap 'rm -f solution.fish' EXIT


          # ----------RUN----------
          chmod u+x solution.fish
          ./solution.fish
        hints: |-
          Автозапуск позволяет автоматически поднимать важные ВМ после старта
          хоста и libvirt без ручного `start`.

          #### Пример 1 (Флаг автозапуска)

          ``` bash
          virsh dominfo student-vm | grep Autostart
          ```
    description: |-
      #### Упражнение 1 (Автозапуск)

      Проверьте автозапуск `student-vm`: включите autostart и сохраните вывод
      `virsh dominfo student-vm` в `/home/ubuntu/autostart/dominfo.txt`.
  - title: Снапшоты и откат состояния
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.fish	---
          cat <<'EOF' > prepare.fish
          #!/bin/fish
          mkdir -p /home/ubuntu/snapshot
          chown ubuntu:ubuntu /home/ubuntu/snapshot
          EOF
          trap 'rm -f prepare.fish' EXIT


          # ----------RUN----------
          chmod u+x prepare.fish
          ./prepare.fish
        check: |-
          # ----------EXEC----------
          # ---	check.fish	---
          cat <<'EOF' > check.fish
          #!/bin/fish
          virsh snapshot-list student-vm 2>/dev/null | grep -q clean-install; or exit 1
          test -f /home/ubuntu/snapshot/list.txt; or exit 1
          EOF
          trap 'rm -f check.fish' EXIT


          # ----------RUN----------
          chmod u+x check.fish
          ./check.fish
        solution: |-
          # ----------EXEC----------
          # ---	solution.fish	---
          cat <<'EOF' > solution.fish
          #!/bin/fish
          virsh snapshot-create-as --domain student-vm --name clean-install --description 'Clean state' >/dev/null 2>/dev/null; or true
          virsh snapshot-list student-vm > /home/ubuntu/snapshot/list.txt 2>/dev/null; or true
          EOF
          trap 'rm -f solution.fish' EXIT


          # ----------RUN----------
          chmod u+x solution.fish
          ./solution.fish
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.fish	---
          cat <<'EOF' > post-step.fish
          #!/bin/fish
          # snapshot listing file is not required later
          rm -f /home/ubuntu/snapshot/list.txt
          EOF
          trap 'rm -f post-step.fish' EXIT


          # ----------RUN----------
          chmod u+x post-step.fish
          ./post-step.fish
        hints: |-
          Снапшот — точка фиксации состояния домена перед изменениями. Он помогает
          быстро вернуться к безопасной конфигурации.

          #### Пример 1 (Список снапшотов)

          ``` bash
          virsh snapshot-list student-vm
          ```
    description: |-
      #### Упражнение 1 (Снапшот)

      Создайте снапшот `clean-install` у домена `student-vm` и сохраните
      `virsh snapshot-list student-vm` в `/home/ubuntu/snapshot/list.txt`.

      ``` bash
      virsh snapshot-list student-vm,
      virsh snapshot-info student-vm clean-install
      virsh snapshot-revert student-vm clean-install
      ```

      Восстановление из снапшота
  - title: Резервное копирование и восстановление
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.fish	---
          cat <<'EOF' > prepare.fish
          #!/bin/fish
          mkdir -p /home/ubuntu/backup
          chown ubuntu:ubuntu /home/ubuntu/backup
          EOF
          trap 'rm -f prepare.fish' EXIT


          # ----------RUN----------
          chmod u+x prepare.fish
          ./prepare.fish
        check: |-
          # ----------EXEC----------
          # ---	check.fish	---
          cat <<'EOF' > check.fish
          #!/bin/fish
          test -f /home/ubuntu/backup/student-vm-backup.qcow2; or exit 1
          test -f /home/ubuntu/backup/student-vm.xml; or exit 1
          EOF
          trap 'rm -f check.fish' EXIT


          # ----------RUN----------
          chmod u+x check.fish
          ./check.fish
        solution: |-
          # ----------EXEC----------
          # ---	solution.fish	---
          cat <<'EOF' > solution.fish
          #!/bin/fish
          cp /home/ubuntu/disk/student-vm.qcow2 /home/ubuntu/backup/student-vm-backup.qcow2 2>/dev/null; or true
          virsh dumpxml student-vm > /home/ubuntu/backup/student-vm.xml 2>/dev/null; or true
          EOF
          trap 'rm -f solution.fish' EXIT


          # ----------RUN----------
          chmod u+x solution.fish
          ./solution.fish
        post-step: |-
          # ----------EXEC----------
          # ---	post-step.fish	---
          cat <<'EOF' > post-step.fish
          #!/bin/fish
          # backup artifacts are not used by following steps
          rm -f /home/ubuntu/backup/student-vm-backup.qcow2
          EOF
          trap 'rm -f post-step.fish' EXIT


          # ----------RUN----------
          chmod u+x post-step.fish
          ./post-step.fish
        hints: |-
          Бэкап домена включает минимум два артефакта: образ диска и
          XML-конфигурацию. Вместе они дают возможность восстановить ВМ.

          #### Пример 1 (Экспорт XML)

          ``` bash
          virsh dumpxml student-vm > /home/ubuntu/backup/student-vm.xml
          ```
    description: |-
      #### Упражнение 1 (Бэкап)

      Создайте в `/home/ubuntu/backup` два файла: `student-vm-backup.qcow2`
      (копия диска) и `student-vm.xml` (экспорт XML домена).
  - title: Настройка изолированной сети libvirt
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.fish	---
          cat <<'EOF' > prepare.fish
          #!/bin/fish
          mkdir -p /home/ubuntu/network
          chown ubuntu:ubuntu /home/ubuntu/network
          EOF
          trap 'rm -f prepare.fish' EXIT


          # ----------RUN----------
          chmod u+x prepare.fish
          ./prepare.fish
        check: |-
          # ----------EXEC----------
          # ---	check.fish	---
          cat <<'EOF' > check.fish
          #!/bin/fish
          virsh net-list --all 2>/dev/null | grep -q isolated-lab; or exit 1
          virsh net-info isolated-lab 2>/dev/null | grep -q 'Active:[[:space:]]*yes'; or exit 1
          virsh net-info isolated-lab 2>/dev/null | grep -q 'Autostart:[[:space:]]*yes'; or exit 1
          EOF
          trap 'rm -f check.fish' EXIT


          # ----------RUN----------
