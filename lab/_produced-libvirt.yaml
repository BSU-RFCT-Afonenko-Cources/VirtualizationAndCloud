          pool. Базовый clone переносим между backend и не требует поддержки
          filesystem-level copy-on-write.

          Reflink clone может быть быстрее и экономить место, но зависит от
          filesystem и storage driver. Поэтому в задании reflink используется
          только как XML preview или сохраняется диагностическая ошибка.

