assignments:
- title: Работа в Ubuntu
  description: |-
    - командная оболочка bash, навигация, echo, перенаправление
    - файловая система
    - управление паравами chmod
    - текстовый редактор nano
    - установка управление пакетами
    - sudo
    - управление пользователями и группами
    - управление системой systemd
    - network, узнать ip адрес, сделать ping
    - утилита curl
    - консольный браузер lynx
  time-limit-minutes: 160
  steps:
  - title: Первые шаги
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.sh	---
          cat <<'EOF' > prepare.sh
          #!/bin/bash

          mkdir /home/ubuntu/mock
          chown ubuntu:ubuntu /home/ubuntu/mock
          EOF
          trap 'rm -f prepare.sh' EXIT


          # ----------RUN----------
          chmod u+x prepare.sh
          ./prepare.sh
        check: |-
          # ----------EXEC----------
          # ---	check.fish	---
          cat <<'EOF' > check.fish
          exit 0
          EOF
          trap 'rm -f check.fish' EXIT


          # ----------RUN----------
          chmod u+x check.fish
          ./check.fish
        solution: |-
          # ----------EXEC----------
          # ---	check.fish	---
          cat <<'EOF' > check.fish
          exit 0
          EOF
          trap 'rm -f check.fish' EXIT


          # ----------RUN----------
          chmod u+x check.fish
          ./check.fish
        hints: |-
          Выведите имя текущего пользователя на экран

          #### Упражнение 1 (Начнём)

          ``` bash
          echo $USER
          ```
    description: |-
      Выведите имя текущего пользователя на экран

      #### Упражнение 1 (Начнём)

      ``` bash
      echo $USER
      ```
  - title: Текстовый редактор nano
    actions:
      host:
        pre-step: |-
          # ----------IMPORT----------
          # ---	app.conf	---
          cat <<'EOF' > app.conf
          [database]
          server = 192.0.2.62
          port = 5432
          username = admin
          password = secure_password_123
          file = "payroll.dat"

          [server]
          host = localhost
          port = 8080
          debug_mode = true
          enabled = no

          [logging]
          level = INFO
          file_path = /var/log/app.log
          max_size = 10MB
          EOF
          trap 'rm -f app.conf' EXIT



          # ----------EXEC----------
          # ---	setmod.sh	---
          cat <<'EOF' > setmod.sh
          #!/bin/bash

          mkdir /home/ubuntu/nano
          cp app.conf /home/ubuntu/nano/app.conf
          chown -R ubuntu:ubuntu /home/ubuntu/nano
          EOF
          trap 'rm -f setmod.sh' EXIT


          # ----------RUN----------
          chmod u+x setmod.sh
          ./setmod.sh
        check: |-
          # ----------EXEC----------
          # ---	file.fish	---
          cat <<'EOF' > file.fish
          #!/bin/fish

          if not test -f /home/ubuntu/nano/notes.txt
              echo "Отсутствует файл /home/ubuntu/nano/notes.txt"
              exit 1
          end

          set NOTES (cat /home/ubuntu/nano/notes.txt)

          if not string match -q "*Ubuntu Server*" "$NOTES"
              echo "В файле notes.txt нет записи `Ubuntu Server`"
              exit 1
          end

          if not string match -q "*Bash*" "$NOTES"
              echo "В файле notes.txt нет записи `Bash`"
              exit 1
          end

          if not string match -q "*Filesystem*" "$NOTES"
              echo "В файле notes.txt нет записи `Filesystem`"
              exit 1
          end
          EOF
          trap 'rm -f file.fish' EXIT

          # ---	config.fish	---
          cat <<'EOF' > config.fish
          #!/bin/fish

          if not test -f /home/ubuntu/nano/app.conf
              echo "Нет такого файла /home/ubuntu/nano/app.conf"
              exit 1
          end

          if not string match -q "*enabled = yes*" (cat /home/ubuntu/nano/app.conf)
              echo "В файле app.conf отсутствует запись `enabled = yes`"
              exit 1
          end
          EOF
          trap 'rm -f config.fish' EXIT


          # ----------RUN----------
          chmod u+x file.fish
          ./file.fish
          chmod u+x config.fish
          ./config.fish
        hints: |-
          [Текстовый редактор GNU nano](http://10.135.250.210/theory/tools/nano/main.html#sec-tools-nano)
          — простой консольный текстовый редактор. Он удобен для первых
          лабораторных работ, потому что показывает основные сочетания клавиш
          прямо в нижней части экрана.

          Полезные клавиши:

          ``` text
          Ctrl + O  — сохранить файл
          Enter     — подтвердить имя файла
          Ctrl + X  — выйти
          Ctrl + W  — поиск
          ```
    description: |-
      Перейдите в каталог `~/nano`. После выполнения всех заданий нажмите
      кнопку проверки

      #### Упражнение 1 (Файл)

      Создайте файл `notes.txt` в редакторе `nano` и запишите в него три
      строки:

      ``` text
      Ubuntu Server
      Bash
      Filesystem
      ```

      #### Упражнение 2 (Конфигурация)

      Отредактируйте конфигурации `app.conf`, откройте его в `nano` и замените
      `enabled = no` на `enabled = yes`.
  - title: Командная оболочка bash
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.sh	---
          cat <<'EOF' > prepare.sh
          #!/bin/bash

          mkdir /home/ubuntu/bash
          chown ubuntu:ubuntu /home/ubuntu/bash
          EOF
          trap 'rm -f prepare.sh' EXIT


          # ----------RUN----------
          chmod u+x prepare.sh
          ./prepare.sh
        check: |-
          # ----------EXEC----------
          # ---	report.fish	---
          cat <<'EOF' > report.fish
          #!/bin/fish

          set SOL /home/ubuntu/report.txt

          if not test -f $SOL
              echo "Отсутствует файл $SOL"
              exit 1
          end

          set REPORT (cat $SOL)

          if not string match -q "*ubuntu*" "$REPORT"
              echo "В файле report.txt отсутствует запись ubuntu"
              exit 1
          end

          if not string match -q "*$(hostname)*" "$REPORT"
              echo "В файле report.txt отсутствует запись `$(hostname)`"
              exit 1
          end
          EOF
          trap 'rm -f report.fish' EXIT

          # ---	array.fish	---
          cat <<'EOF' > array.fish
          #!/bin/fish

          set SOL /home/ubuntu/bash/array.sh

          if not test (bash $SOL a b apple) = "apple"
              echo "Неверное решение array.sh"
              exit 1
          end

          if not test (bash $SOL one three elephant cat) = "elephant"
              echo "Неверное решение array.sh"
              exit 1
          end
          EOF
          trap 'rm -f array.fish' EXIT

          # ---	backup.fish	---
          cat <<'EOF' > backup.fish
          #!/bin/fish

          set SOL /home/ubuntu/bash/backup.sh

          if not test -f $SOL
              echo "Отсутствует файл $SOL"
              exit 1
          end

          set tmp (mktemp -d)
          cd $tmp

          function clear_tmp --on-signal fish_exit
              if set -q tmp
                cd ~
                rm -rf $tmp
              end
          end

          echo hello > file.txt
          bash $SOL file.txt

          if not test -f file.txt.bak; or not test (cat file.txt.bak) = "hello"
            echo "Некорректная обработка существующего файла"
            exit 1
          end

          set out (bash $SOL "no.txt" 2>&1)

          if not test $status = 1; or not test "$out" = missing
            echo "Некорректная обработка отсутствующего файла"
            exit 1
          end
          EOF
          trap 'rm -f backup.fish' EXIT

          # ---	project.fish	---
          cat <<'EOF' > project.fish
          #!/bin/fish

          set SOL /home/ubuntu/bash/project.sh

          if not test -f "$SOL"
              echo "Отсутствует файл $SOL"
              exit 1
          end

          set tmp (mktemp -d)
          cd $tmp

          function clear_tmp --on-signal fish_exit
              if set -q tmp
                  echo cd ~
                  rm -rf $tmp
              end
          end

          bash $SOL project

          for f in project/{src,data,reports}
              if not test -d $f
                  echo "`project.sh` не создаёт какталог $f"
                  exit 1
              end
          end

          if not test -f project/README.md
              echo "`project.sh` не создаёт файл README.md"
              exit 1
          end

          if not string match -q "*project*" (cat project/README.md)
              echo "В файле README.md отсутствует запись `project`"
              exit 1
          end
          EOF
          trap 'rm -f project.fish' EXIT


          # ----------RUN----------
          chmod u+x report.fish
          ./report.fish
          chmod u+x array.fish
          ./array.fish
          chmod u+x backup.fish
          ./backup.fish
          chmod u+x project.fish
          ./project.fish
        solution: |-
          # ----------IMPORT----------
          # ---	report.sh	---
          cat <<'EOF' > report.sh
          #!/bin/bash

          echo "$(whoami)" > report.txt
          echo "$(hostname)" >> report.txt
          ls >> report.txt
          EOF
          trap 'rm -f report.sh' EXIT

          # ---	backup.sh	---
          cat <<'EOF' > backup.sh
          #!/bin/bash

          [[ -f $1 ]] || { echo "missing"; return 1; }
          cp "$1" "$1.bak"
          EOF
          trap 'rm -f backup.sh' EXIT

          # ---	project.sh	---
          cat <<'EOF' > project.sh
          #!/bin/bash

          d=$1
          mkdir -p "$d"/{src,data,reports}
          echo "# $d" > "$d/README.md"
          EOF
          trap 'rm -f project.sh' EXIT



          # ----------EXEC----------
          # ---	report.sh	---
          cat <<'EOF' > report.sh
          #!/bin/bash

          echo "$(whoami)" > report.txt
          echo "$(hostname)" >> report.txt
          ls >> report.txt
          EOF
          trap 'rm -f report.sh' EXIT


          # ----------RUN----------
          chmod u+x report.sh
          ./report.sh
        hints: |-
          Изучите

          - [Скрипты](http://10.135.250.210/theory/shell/sh.html#sec-shell-sh-script)
          - [Перенаправление ввода и вывода](http://10.135.250.210/theory/shell/sh.html#sec-shell-sh-io-redirect)
          - [Массивы](http://10.135.250.210/theory/shell/bash.html#sec-shell-bash-array)

          #### Пример 1 (Запуск скрипта)

          ``` bash
          chmod u+x script.sh
          ./script.sh
          ```
    description: |-
      Для начала перейдите каталог `~/bash`. После выполнения всех заданий
      нажмите кнопку проверки

      #### Упражнение 1 (Отчёт)

      Создайте файл `report.txt`, в который запишите имя текущего
      пользователя, имя хоста и список файлов текущего каталога.

      #### Упражнение 2 (Проект)

      Создать скрипт `project.sh`, который принимает имя проекта и создаёт
      структуру:

      ``` text
      project/
        src/
        data/
        reports/
        README.md
      ```

      В `README.md` должна быть строка `# project`.

      #### Упражнение 3 (Резервное копирование)

      Создать скрипт `backup.sh`, который принимает путь к файлу и создаёт его
      копию с расширением `.bak`. Если файла нет, вывести `missing` и
      завершиться с кодом `1`.

      #### Упражнение 4 (Массив)

      Создать скрипт `array.sh`, который принимает список слов и выводит самое
      длинное слово.
  - title: Файловая система
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.sh	---
          cat <<'EOF' > prepare.sh
          #!/bin/bash

          mkdir -p /home/ubuntu/filesystem/{docs,archive}
          touch /home/ubuntu/filesystem/archive/file-bak.txt
          chmod -R ubuntu:ubuntu /home/ubuntu/filesystem/
          EOF
          trap 'rm -f prepare.sh' EXIT


          # ----------RUN----------
          chmod u+x prepare.sh
          ./prepare.sh
        check: |-
          # ----------EXEC----------
          # ---	structure.fish	---
          cat <<'EOF' > structure.fish
          #!/bin/fish

          if not test -d /home/ubuntu/filesystem/scripts
              echo "Отсутствует каталог /home/ubuntu/filesystem/scripts"
              exit 1
          end

          set lines (find /home/ubuntu/filesystem/docs -name "*.txt" | wc -l)

          if not test "$lines" = 2
              echo "В каталоге docs нет двух файлов с расширением *.txt"
              exit 1
          end

          set lines (find /home/ubuntu/filesystem/scripts -name "*.sh" | wc -l)

          if not test "$lines" = 1
              echo "В каталоге docs нет файла с расширением *.sh"
              exit 1
          end
          EOF
          trap 'rm -f structure.fish' EXIT

          # ---	archive.fish	---
          cat <<'EOF' > archive.fish
          #!/bin/fish

          if not test -d /home/ubuntu/filesystem/archive
              echo "Отсутствует каталог /home/ubuntu/filesystem/archive"
              exit 1
          end

          set lines (find /home/ubuntu/filesystem/archive -name "*-bak*" | wc -l)

          if not test "$lines" = 1
              echo "В каталоге /archive нет файла `-bak`"
              exit 1
          end
          EOF
          trap 'rm -f archive.fish' EXIT

          # ---	execute.fish	---
          cat <<'EOF' > execute.fish
          #!/bin/fish

          set file (find /home/ubuntu/filesystem/scripts -name "*.sh" | head -n 1)

          if string length -q -- "$file"
              echo "В каталоге /home/ubuntu/filesystem/scripts отсутствуют скриптовые файлы *.sh"
              exit 1
          end

          set perm (stat -c %A "$file")

          if not test "$perm" = "-rwxr-xr--"
              echo "У файла $file назначены неверные права"
              exit 1
          end
          EOF
          trap 'rm -f execute.fish' EXIT

          # ---	read.fish	---
          cat <<'EOF' > read.fish
          #!/bin/fish

          for f in (find /home/ubuntu/filesystem/docs -name "*.txt")
              set perm (stat -c %A "$f")
              if not test "$perm" = "-rw---x---"
                  echo "У файла $f назначены неверные права"
                  exit 1
              end
          end
          EOF
          trap 'rm -f read.fish' EXIT


          # ----------RUN----------
          chmod u+x structure.fish
          ./structure.fish
          chmod u+x archive.fish
          ./archive.fish
          chmod u+x execute.fish
          ./execute.fish
          chmod u+x read.fish
          ./read.fish
        hints: |-
          Изучить права файлов и каталогов в \[файловой системе
          @linux-filesystem-permission\]
    description: |-
      Прейдите в каталог `~/filesystem`. После выполнения всех заданий нажмите
      кнопку проверки

      #### Упражнение 1 (Структура)

      Расширьте структуру каталогов до заданной:

      ``` text
      filesystem/
      ├── docs/
      ├── scripts/
      └── archive/
      ```

      В каталоге `docs` создайте два текстовых файла с произвольным именем и
      расширеним `.txt`, а в каталоге `scripts` — один файл скрипта с
      расширеним `.sh`.

      #### Упражнение 2 (Архив)

      Очистите архив. Скопируйте один файл из каталога `doсs` в архив и
      добавьте `-bak` к его имени.

      #### Упражнение 3 (Права запуска)

      Предоставьте владельцу и группе владельца разрешение на запуск скрипта.

      #### Упражнение 4 (Права чтения)

      Запретите доступ на чтение файлов внутри каталога `docs` всем, кроме
      владельца.
  - title: Система управления пакетами APT
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.sh	---
          cat <<'EOF' > prepare.sh
          #!/bin/bash

          mkdir /home/ubuntu/package
          chown ubuntu:ubuntu /home/ubuntu/package
          EOF
          trap 'rm -f prepare.sh' EXIT


          # ----------RUN----------
          chmod u+x prepare.sh
          ./prepare.sh
        check: |-
          # ----------EXEC----------
          # ---	install.fish	---
          cat <<'EOF' > install.fish
          #!/bin/fish

          if not test -f /home/ubuntu/package/tree.txt
              echo "Нет такого файла /home/ubuntu/package/tree.txt"
              exit 1
          end

          if not (tree /home/ubuntu/bash) = (cat /home/ubuntu/package/tree.txt)
              echo "Файл tree.txt не содержит вывод команды `tree /home/ubuntu/bash`"
              exit 1
          end
          EOF
          trap 'rm -f install.fish' EXIT

          # ---	update.fish	---
          cat <<'EOF' > update.fish
          #!/bin/fish

          if not test -f /home/ubuntu/package/curl.txt
              echo "Нет такого файла /home/ubuntu/package/curl.txt"
          end

          if not (cat /home/ubuntu/package/curl.txt) = (apt show curl)
              echo "Файл curl.txt не содержит вывод команы `apt show curl`"
              exit 1
          end
          EOF
          trap 'rm -f update.fish' EXIT


          # ----------RUN----------
          chmod u+x install.fish
          ./install.fish
          chmod u+x update.fish
          ./update.fish
        hints: |-
          Изучить менеджер пакетов
          [Управление пакетами в Linux](http://10.135.250.210/theory/linux/package.html#sec-linux-package)
    description: |-
      Перейдите в каталог `~/package`. После выполнения всех заданий нажмите
      кнопку проверки

      #### Упражнение 1 (Обновление)

      Обновите индекс пакетов и посмотрите информацию о пакете `curl` с
      помощью команды `apt show`. Сохраните вывод в файл `curl.txt`

      #### Упражнение 2 (Установка)

      Установите пакет `tree`, посмотрите дерево каталога `/home/ubuntu/bash`,
      сохраните вывод в файл `tree.txt`.
  - title: Средство загрузки curl
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	prepare.sh	---
          cat <<'EOF' > prepare.sh
          #!/bin/bash

          mkdir /home/ubuntu/curl
          chown ubuntu:ubuntu /home/ubuntu/curl
          EOF
          trap 'rm -f prepare.sh' EXIT


          # ----------RUN----------
          chmod u+x prepare.sh
          ./prepare.sh
        check: |-
          # ----------EXEC----------
          # ---	header.fish	---
          cat <<'EOF' > header.fish
          #!/bin/fish

          if not test -f /home/ubuntu/curl/header.txt
              echo "Отсутствует файл /home/ubuntu/curl/header.txt"
              exit 1
          end

          set headers (cat /home/ubuntu/curl/header.txt)

          if not test "$headers" = "$(curl -sI https://ubuntu.com)"
              echo "Файл header.txt содержит невеные заголовки"
              if string match -q "*Xferd*" "$headers"
                  echo "Используйте silent mode `curl -s`"
              end
              exit 1
          end
          EOF
          trap 'rm -f header.fish' EXIT

          # ---	download.fish	---
          cat <<'EOF' > download.fish
          #!/bin/fish

          if not test -f /home/ubuntu/curl/lines.txt
              echo "Отсутствует файл /home/ubuntu/curl/lines.txt"
              exit 1
          end

          if not string match -q "*"(curl -s https://ubuntu.com | wc -l)"*" (cat /home/ubuntu/curl/lines.txt)
              echo "Неверное число строк"
              echo "Используйте silent mode `curl -s`"
              exit 1
          end
          EOF
          trap 'rm -f download.fish' EXIT


          # ----------RUN----------
          chmod u+x header.fish
          ./header.fish
          chmod u+x download.fish
          ./download.fish
        hints: |-
          Изучить
          [Утилита curl](http://10.135.250.210/theory/tools/curl.html#sec-tools-curl)
    description: |-
      Перейдите в каталог `~/curl`. После выполнения всех заданий нажмите
      кнопку проверки

      #### Упражнение 1 (Заголовок)

      Сохраните HTTP-заголовки сайта <https://ubuntu.com> в файл `header.txt`.

      #### Упражнение 2 (Загрузка)

      Скачайте HTML-страницу <https://ubuntu.com> в файл, определите
      количество строк в нём, и сохраните ответ в файл `lines.txt`
  - title: Управление пользователями
    actions:
      host:
        check: |-
          # ----------EXEC----------
          # ---	dir.fish	---
          cat <<'EOF' > dir.fish
          #!/bin/fish

          if not test -d /home/lab-share
              echo "Нет каталога /home/lab-share"
              exit 1
          end

          if not string match -q labuser (stat -c "%U" /home/lab-share)
              echo "Пользователь labuser не является владельцем /lab-share"
              exit 1
          end

          if not string match -q labuser (stat -c "%U" /home/lab-share)
              echo "Группа labgroup не является владельцем /home/lab-share"
              exit 1
          end

          if not test (string sub --start=-3 (stat -c %A /home/lab-share)) = 'rwx'
              echo "Неверные разрешения каталога /home/lab-share"
              exit 1
          end
          EOF
          trap 'rm -f dir.fish' EXIT

          # ---	file.fish	---
          cat <<'EOF' > file.fish
          #!/bin/fish

          set result (stat -c "%U" /home/lab-share/new.txt)

          if not test $status = 0
              echo "Отсутствует файл /home/lab-share/new.txt"
              exit 1
          end

          if not test $result = labuser
              echo "labuser на является владельцем файла /home/lab-share/new.txt"
              exit 1
          end
          EOF
          trap 'rm -f file.fish' EXIT

          # ---	new.fish	---
          cat <<'EOF' > new.fish
          #!/bin/fish

          set result (groups labuser)

          if not test $status = 0
              echo "Нет пользователя labuser"
              exit 1
          end

          if not string match -q "*labgroup*" "$result"
              echo "Пользователь labuser не входит в группу labgroup"
              exit 1
          end
          EOF
          trap 'rm -f new.fish' EXIT


          # ----------RUN----------
          chmod u+x dir.fish
          ./dir.fish
          chmod u+x file.fish
          ./file.fish
          chmod u+x new.fish
          ./new.fish
        hints: |-
          В Ubuntu для добавления пользователей и групп удобно использовать
          [adduser](http://10.135.250.210/theory/tools/user/adduser.html#sec-tools-user-adduser)
          и
          [addgroup](http://10.135.250.210/theory/tools/user/addgroup.html#sec-tools-user-addgroup),
          для изменения пользователя
          [usermod](http://10.135.250.210/theory/tools/user/usermod.html#sec-tools-user-usermod)
    description: |-
      #### Упражнение 1 (Новый пользователь)

