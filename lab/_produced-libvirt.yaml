          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-resize lab-disk.qcow2 512M --pool lab-pool >/dev/null
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-info --pool lab-pool lab-disk.qcow2 --bytes >"$DIR/vol-info-after-512m.txt"
