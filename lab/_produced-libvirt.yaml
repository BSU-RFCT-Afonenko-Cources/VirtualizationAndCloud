  - title: Подключение volume к ВМ
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/pool-volume-attach
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/pool-volume-attach
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          if /usr/bin/test -s "$DIR/domblklist-lab-vm.txt" && /usr/bin/grep -Eq '(^|[[:space:]])vdb([[:space:]]|$)' "$DIR/domblklist-lab-vm.txt"; then
            exit 0
          fi
          if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domblklist lab-vm >/var/tmp/lab-vm-blk 2>/dev/null && /usr/bin/grep -Eq '(^|[[:space:]])vdb([[:space:]]|$)' /var/tmp/lab-vm-blk; then
            exit 0
          fi
          XML=$DIR/lab-disk-volume-fragment.xml
          /usr/bin/test -s "$XML" || fail "нет domblklist с vdb и нет lab-disk-volume-fragment.xml"
          /usr/bin/python3 - "$XML" <<'PYCHECK' || exit 1
          import sys, xml.etree.ElementTree as ET
          r=ET.parse(sys.argv[1]).getroot(); s=r.find('source'); t=r.find('target')
          if r.tag!='disk' or r.get('type')!='volume' or s is None or s.get('pool')!='lab-pool' or s.get('volume')!='lab-disk.qcow2' or t is None or t.get('dev')!='vdb':
              print('Ошибка: XML-фрагмент должен ссылаться на source pool=lab-pool volume=lab-disk.qcow2 и target vdb', file=sys.stderr); sys.exit(1)
          PYCHECK
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/pool-volume-attach
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-info lab-pool >/dev/null 2>&1; then /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-define-as lab-pool dir --target /tmp/libvirt-lab-pool >/dev/null; fi
          /usr/bin/test -d /tmp/libvirt-lab-pool || /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-build lab-pool >/dev/null
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-start lab-pool >/dev/null 2>&1 || true
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-info --pool lab-pool lab-disk.qcow2 >/dev/null 2>&1; then /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-create-as lab-pool lab-disk.qcow2 128M --format qcow2 >/dev/null; fi
          if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system dominfo lab-vm >/dev/null 2>&1 && /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domstate lab-vm | /usr/bin/grep -qi running; then
            VOL_PATH=$(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-path --pool lab-pool lab-disk.qcow2)
            if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domblklist lab-vm | /usr/bin/grep -Eq '(^|[[:space:]])vdb([[:space:]]|$)'; then
              /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system attach-disk lab-vm "$VOL_PATH" vdb --driver qemu --subdriver qcow2 --targetbus virtio --live --config >/dev/null
            fi
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system domblklist lab-vm >"$DIR/domblklist-lab-vm.txt"
          else
            /usr/bin/cat >"$DIR/lab-disk-volume-fragment.xml" <<'XML'
          <disk type='volume' device='disk'>
            <driver name='qemu' type='qcow2'/>
            <source pool='lab-pool' volume='lab-disk.qcow2'/>
            <target dev='vdb' bus='virtio'/>
          </disk>
          XML
          fi
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Domain XML может ссылаться на диск прямым path или через source
          pool/volume. На практике `vol-path` часто передают в `attach-disk` как
          путь data disk.

          Если `lab-vm` существует, используйте live+config подключение, чтобы
          изменение попало и в текущий запущенный domain, и в persistent XML. Если
          `lab-vm` отсутствует, сохраните XML-фрагмент `<disk type='volume'>` для
          проверки модели.

          #### Пример 1 (Фрагмент volume disk)

          ``` bash
          cat > lab-disk-volume-fragment.xml <<'XML'
          <disk type='volume' device='disk'>
            <driver name='qemu' type='qcow2'/>
            <source pool='lab-pool' volume='lab-disk.qcow2'/>
            <target dev='vdb' bus='virtio'/>
          </disk>
          XML
          ```
    description: |-
      Перейдите в каталог `~/pool-volume-attach`.

      #### Упражнение 1 (Подключение volume к ВМ)

      Если есть `lab-vm`, выполните:

      ``` bash
      VOL_PATH=$(sudo -n virsh -c qemu:///system vol-path --pool lab-pool lab-disk.qcow2)
      sudo -n virsh -c qemu:///system attach-disk lab-vm "$VOL_PATH" vdb --driver qemu --subdriver qcow2 --targetbus virtio --live --config
      sudo -n virsh -c qemu:///system domblklist lab-vm > domblklist-lab-vm.txt
      ```

      Если `lab-vm` отсутствует, сохраните `lab-disk-volume-fragment.xml` с
      `<source pool='lab-pool' volume='lab-disk.qcow2'/>` и target `vdb`.
