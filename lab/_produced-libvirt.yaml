    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/vol-preview-xml
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/vol-preview-xml
          XML=$DIR/generated-by-args.xml
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          /usr/bin/test -s "$XML" || fail "нет generated-by-args.xml"
          /usr/bin/python3 - "$XML" <<'PYCHECK'
          import sys, xml.etree.ElementTree as ET
          r=ET.parse(sys.argv[1]).getroot()
          if r.tag!='volume' or r.findtext('name')!='generated-by-args.qcow2' or r.find('target/format').get('type')!='qcow2':
              print('Ошибка: XML должен описывать volume generated-by-args.qcow2 format qcow2', file=sys.stderr); sys.exit(1)
          PYCHECK
          if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-info --pool lab-pool generated-by-args.qcow2 >/dev/null 2>&1; then fail "generated-by-args.qcow2 не должен быть создан"; fi
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/vol-preview-xml
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"

          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-info lab-pool >/dev/null 2>&1; then
            /usr/bin/sudo -n /usr/bin/install -d -m 0755 /tmp/libvirt-lab-pool
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-define-as lab-pool dir --target /tmp/libvirt-lab-pool >/dev/null
          fi
          /usr/bin/sudo -n /usr/bin/install -d -m 0755 /tmp/libvirt-lab-pool
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-start lab-pool >/dev/null 2>&1 || true
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-refresh lab-pool >/dev/null 2>&1 || true

          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-delete --pool lab-pool generated-by-args.qcow2 >/dev/null 2>&1 || true
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-create-as lab-pool generated-by-args.qcow2 64M --format qcow2 --print-xml >"$DIR/generated-by-args.xml"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-info --pool lab-pool generated-by-args.qcow2 >"$DIR/generated-by-args-vol-info.txt" 2>&1 || true
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          `vol-create-as --print-xml` печатает XML-модель volume, которую libvirt
          создал бы из CLI-аргументов. Это preview: состояние pool не меняется и
          файл volume не появляется.

          Такой режим удобен для проверки шаблонов и review automation-кода до
          выполнения destructive или resource-consuming операций.

          #### Пример 1 (Preview volume XML)

          ``` bash
          sudo -n virsh -c qemu:///system vol-create-as lab-pool generated-by-args.qcow2 64M --format qcow2 --print-xml
          ```
    description: |-
      Перейдите в каталог `~/vol-preview-xml`.

      #### Упражнение 1 (Preview XML без создания volume)

      Сохраните XML и убедитесь, что volume не создан:

      ``` bash
      sudo -n virsh -c qemu:///system vol-create-as lab-pool generated-by-args.qcow2 64M --format qcow2 --print-xml > generated-by-args.xml
      sudo -n virsh -c qemu:///system vol-info --pool lab-pool generated-by-args.qcow2 > generated-by-args-vol-info.txt 2>&1 || true
      ```
  - title: Volume из XML
    actions:
