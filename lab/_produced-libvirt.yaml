        post-step: |-
          # ----------EXEC----------
          # ---	post-step.fish	---
          cat <<'EOF' > post-step.fish
          #!/bin/fish
          # keep libvirt network, remove temporary xml file
          rm -f /home/ubuntu/network/isolated-net.xml
          EOF
          trap 'rm -f post-step.fish' EXIT


          # ----------RUN----------
          chmod u+x post-step.fish
          ./post-step.fish
        hints: |-
          Сеть libvirt управляется как отдельный объект. Её можно определить,
          активировать и включить в автозапуск независимо от доменов.

          #### Пример 1 (Сети libvirt)

          ``` bash
          virsh net-list --all
          ```
    description: |-
      #### Упражнение 1 (Сеть)

      Создайте сеть `isolated-lab` по XML
      `/home/ubuntu/network/isolated-net.xml`, запустите её и включите
      автозапуск.
  - title: Пул хранения libvirt
