          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/pool-xml-cleanup
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          for f in lab-pool-xml.xml pool-info-lab-pool-xml.txt pool-list-final.txt; do /usr/bin/test -s "$DIR/$f" || fail "нет $DIR/$f"; done
          if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-info lab-pool >/dev/null 2>&1; then fail "lab-pool всё ещё определён"; fi
          if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-info lab-pool-xml >/dev/null 2>&1; then fail "lab-pool-xml всё ещё определён"; fi
          /usr/bin/test ! -e /tmp/libvirt-lab-pool || fail "/tmp/libvirt-lab-pool не удалён"
          /usr/bin/test ! -e /tmp/libvirt-lab-pool-xml || fail "/tmp/libvirt-lab-pool-xml не удалён"
          if /usr/bin/grep -Eq '(^|[[:space:]])lab-pool([[:space:]]|$)|(^|[[:space:]])lab-pool-xml([[:space:]]|$)' "$DIR/pool-list-final.txt"; then fail "pool-list-final.txt не должен содержать lab-pool или lab-pool-xml"; fi
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/pool-xml-cleanup
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"
          /usr/bin/cat >"$DIR/lab-pool-xml.xml" <<'XML'
          <pool type='dir'>
            <name>lab-pool-xml</name>
            <target>
              <path>/tmp/libvirt-lab-pool-xml</path>
            </target>
          </pool>
          XML
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-info lab-pool-xml >/dev/null 2>&1; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-define "$DIR/lab-pool-xml.xml" >/dev/null
          fi
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-build lab-pool-xml >/dev/null 2>&1 || true
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-start lab-pool-xml >/dev/null 2>&1 || true
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-info lab-pool-xml >"$DIR/pool-info-lab-pool-xml.txt"
          for P in lab-pool lab-pool-xml; do
            if /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-info "$P" >/dev/null 2>&1; then
              /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-autostart "$P" --disable >/dev/null 2>&1 || true
              /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-destroy "$P" >/dev/null 2>&1 || true
              /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-undefine "$P" >/dev/null 2>&1 || true
            fi
          done
          /usr/bin/sudo -n /usr/bin/rm -rf /tmp/libvirt-lab-pool /tmp/libvirt-lab-pool-xml
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-list --all >"$DIR/pool-list-final.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          `pool-define` из XML-файла ближе к IaC-подходу: XML можно хранить,
          генерировать и применять повторяемо. Такой pool является persistent
          definition, как и объект после `pool-define-as`.

          Полная очистка persistent pool требует остановить активный pool,
          выполнить `pool-undefine`, а target directory удалить отдельно. В
          лаборатории удаляются только объекты и каталоги с именами `lab-pool*`.

          #### Пример 1 (Define из XML)

          ``` bash
          sudo -n virsh -c qemu:///system pool-define lab-pool-xml.xml
          ```
    description: |-
      Перейдите в каталог `~/pool-xml-cleanup`.

      #### Упражнение 1 (Pool через XML-файл и полная очистка)

      Создайте `lab-pool-xml.xml` для pool `lab-pool-xml` типа `dir` с target
      `/tmp/libvirt-lab-pool-xml`, определите его, выполните build/start и
      сохраните `pool-info-lab-pool-xml.txt`.

      Затем удалите только `lab-pool` и `lab-pool-xml`: остановите active
      pools, выполните `pool-undefine`, удалите `/tmp/libvirt-lab-pool` и
      `/tmp/libvirt-lab-pool-xml`, сохраните итоговый `pool-list-final.txt`.
  virtual-machines:
    host:
      template: Ubuntu 26.04 LTS — KVM/QEMU Lab
      prepare: ''
  order: 4
- title: 'Libvirt storage volumes: lifecycle and I/O'
  description: |-
    В этой лабораторной работе вы изучите storage volumes libvirt: создание
    из CLI и XML, форматы `qcow2`/`raw`, идентификаторы path/key/name/pool,
    clone, backing volume, refresh, resize, upload/download, wipe и
    безопасное удаление.

    Все операции выполняются в persistent pool `lab-pool` типа `dir` с
    target `/tmp/libvirt-lab-pool`. Volume лабораторной имеют имена с
    префиксом `lab-` или `manual-`; не используйте реальные блочные
    устройства и не удаляйте чужие storage pools, networks или domains.
  time-limit-minutes: 180
  steps:
  - title: Подготовка directory pool
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/prepare-volume-pool
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/prepare-volume-pool
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          /usr/bin/test -s "$DIR/pool-info.txt" || fail "нет pool-info.txt"
          /usr/bin/test -s "$DIR/vol-list-details.txt" || fail "нет vol-list-details.txt"
          STATE=$(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-info lab-pool | /usr/bin/awk -F: '/State/{gsub(/^[ 	]+/,"",$2); print $2}')
          TYPE=$(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-dumpxml --xpath 'string(/pool/@type)' lab-pool)
          TARGET=$(/usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-dumpxml --xpath 'string(/pool/target/path)' lab-pool)
          /usr/bin/test "$STATE" = "running" || fail "lab-pool должен быть active/running"
          /usr/bin/test "$TYPE" = "dir" || fail "lab-pool должен иметь type dir"
          /usr/bin/test "$TARGET" = "/tmp/libvirt-lab-pool" || fail "target path должен быть /tmp/libvirt-lab-pool"
          /usr/bin/test -d /tmp/libvirt-lab-pool || fail "target path недоступен"
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/prepare-volume-pool
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"

          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-info lab-pool >/dev/null 2>&1; then
            /usr/bin/sudo -n /usr/bin/install -d -m 0755 /tmp/libvirt-lab-pool
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-define-as lab-pool dir --target /tmp/libvirt-lab-pool >/dev/null
          fi
          /usr/bin/sudo -n /usr/bin/install -d -m 0755 /tmp/libvirt-lab-pool
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-start lab-pool >/dev/null 2>&1 || true
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-refresh lab-pool >/dev/null 2>&1 || true

          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-info lab-pool >"$DIR/pool-info.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-list lab-pool --details >"$DIR/vol-list-details.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          Storage volume существует внутри активного storage pool. В этой
          лабораторной используется безопасный `dir` pool: libvirt хранит metadata
          pool, а сами volumes являются обычными файлами в target-каталоге.

          `lab-pool` должен быть persistent-объектом libvirt и active перед
          созданием volumes. Target `/tmp/libvirt-lab-pool` выбран специально: это
          временный каталог, не связанный с реальными блочными устройствами хоста.

          #### Пример 1 (Define and start directory pool)

          ``` bash
          sudo -n virsh -c qemu:///system pool-define-as lab-pool dir --target /tmp/libvirt-lab-pool
          sudo -n virsh -c qemu:///system pool-start lab-pool
          ```
    description: |-
      Перейдите в каталог `~/prepare-volume-pool`.

      #### Упражнение 1 (Подготовка lab-pool)

      Создайте или переиспользуйте active pool `lab-pool` с target
      `/tmp/libvirt-lab-pool`, затем сохраните сведения:

      ``` bash
      sudo -n mkdir -p /tmp/libvirt-lab-pool
      sudo -n virsh -c qemu:///system pool-info lab-pool >/dev/null 2>&1 || sudo -n virsh -c qemu:///system pool-define-as lab-pool dir --target /tmp/libvirt-lab-pool
      sudo -n virsh -c qemu:///system pool-start lab-pool >/dev/null 2>&1 || true
      sudo -n virsh -c qemu:///system pool-info lab-pool > pool-info.txt
      sudo -n virsh -c qemu:///system vol-list lab-pool --details > vol-list-details.txt
      ```
  - title: Создание volumes разных форматов
    actions:
      host:
        pre-step: |-
          # ----------EXEC----------
          # ---	pre-step.bash	---
          cat <<'EOF' > pre-step.bash
          #!/usr/bin/env bash
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 /home/ubuntu/vol-create-as
          EOF
          trap 'rm -f pre-step.bash' EXIT


          # ----------RUN----------
          chmod u+x pre-step.bash
          ./pre-step.bash
        check: |-
          # ----------EXEC----------
          # ---	check.bash	---
          cat <<'EOF' > check.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/vol-create-as
          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          /usr/bin/test -s "$DIR/vol-list-details.txt" || fail "нет vol-list-details.txt"
          for f in "$DIR/vol-info-lab-disk.txt" "$DIR/vol-info-lab-sparse.txt" "$DIR/vol-info-lab-raw.txt"; do /usr/bin/test -s "$f" || fail "нет ${f}"; done
          /usr/bin/python3 - <<'PYCHECK'
          import subprocess, xml.etree.ElementTree as ET, sys
          want={'lab-disk.qcow2':('qcow2',256*1024*1024),'lab-sparse.qcow2':('qcow2',1024*1024*1024),'lab-raw.img':('raw',128*1024*1024)}
          for name,(fmt,cap) in want.items():
              xml=subprocess.check_output(['/usr/bin/sudo','-n','/usr/bin/virsh','-c','qemu:///system','vol-dumpxml','--pool','lab-pool',name], text=True)
              root=ET.fromstring(xml)
              gotfmt=root.find('target/format').get('type')
              gotcap=int(root.findtext('capacity'))
              if gotfmt != fmt or abs(gotcap-cap) > 1024*1024:
                  print(f'Ошибка: {name}: ожидались format={fmt}, capacity≈{cap}, получены {gotfmt}, {gotcap}', file=sys.stderr); sys.exit(1)
          PYCHECK
          EOF
          trap 'rm -f check.bash' EXIT


          # ----------RUN----------
          chmod u+x check.bash
          ./check.bash
        solution: |-
          # ----------EXEC----------
          # ---	solution.bash	---
          cat <<'EOF' > solution.bash
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/home/ubuntu/vol-create-as
          /usr/bin/install -d -o ubuntu -g ubuntu -m 0755 "$DIR"

          fail(){ /usr/bin/printf 'Ошибка: %s\n' "$1" >&2; exit 1; }
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-info lab-pool >/dev/null 2>&1; then
            /usr/bin/sudo -n /usr/bin/install -d -m 0755 /tmp/libvirt-lab-pool
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-define-as lab-pool dir --target /tmp/libvirt-lab-pool >/dev/null
          fi
          /usr/bin/sudo -n /usr/bin/install -d -m 0755 /tmp/libvirt-lab-pool
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-start lab-pool >/dev/null 2>&1 || true
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system pool-refresh lab-pool >/dev/null 2>&1 || true


          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-info --pool lab-pool lab-disk.qcow2 >/dev/null 2>&1; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-create-as lab-pool lab-disk.qcow2 256M --format qcow2 >/dev/null
          fi
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-info --pool lab-pool lab-sparse.qcow2 >/dev/null 2>&1; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-create-as lab-pool lab-sparse.qcow2 1G --allocation 0 --format qcow2 >/dev/null
          fi
          if ! /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-info --pool lab-pool lab-raw.img >/dev/null 2>&1; then
            /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-create-as lab-pool lab-raw.img 128M --format raw >/dev/null
          fi

          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-list lab-pool --details >"$DIR/vol-list-details.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-info --pool lab-pool lab-disk.qcow2 >"$DIR/vol-info-lab-disk.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-info --pool lab-pool lab-sparse.qcow2 >"$DIR/vol-info-lab-sparse.txt"
          /usr/bin/sudo -n /usr/bin/virsh -c qemu:///system vol-info --pool lab-pool lab-raw.img >"$DIR/vol-info-lab-raw.txt"
          /usr/bin/chown -R ubuntu:ubuntu "$DIR"
          EOF
          trap 'rm -f solution.bash' EXIT


          # ----------RUN----------
          chmod u+x solution.bash
          ./solution.bash
        hints: |-
          `vol-create-as` создаёт storage volume из CLI-аргументов: имени, logical
          capacity, initial allocation и формата. Для directory-backed pool это
          приводит к созданию файла в target-каталоге pool.

          Формат `raw` прост и прозрачен для побайтовых операций, а `qcow2`
          поддерживает metadata, thin provisioning и backing files. Параметр
          `--allocation 0` показывает sparse/thin-подход: logical capacity больше,
          чем начально занятое место.

          #### Пример 1 (Создать qcow2 volume)

          ``` bash
          sudo -n virsh -c qemu:///system vol-create-as lab-pool lab-disk.qcow2 256M --format qcow2
          ```
    description: |-
      Перейдите в каталог `~/vol-create-as`.

      #### Упражнение 1 (Создание volumes разных форматов)

      Создайте три volume и сохраните список и `vol-info`:

      ``` bash
      sudo -n virsh -c qemu:///system vol-create-as lab-pool lab-disk.qcow2 256M --format qcow2
      sudo -n virsh -c qemu:///system vol-create-as lab-pool lab-sparse.qcow2 1G --allocation 0 --format qcow2
      sudo -n virsh -c qemu:///system vol-create-as lab-pool lab-raw.img 128M --format raw
      sudo -n virsh -c qemu:///system vol-list lab-pool --details > vol-list-details.txt
      sudo -n virsh -c qemu:///system vol-info --pool lab-pool lab-disk.qcow2 > vol-info-lab-disk.txt
      sudo -n virsh -c qemu:///system vol-info --pool lab-pool lab-sparse.qcow2 > vol-info-lab-sparse.txt
      sudo -n virsh -c qemu:///system vol-info --pool lab-pool lab-raw.img > vol-info-lab-raw.txt
      ```
