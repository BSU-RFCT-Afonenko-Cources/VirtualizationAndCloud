worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  server {
    listen 8080;
    location = /health { access_log off; return 200 'ok\n'; }
    location /api/orders { proxy_pass http://orders-api:8080/orders; }
    location /api/inventory/ { proxy_pass http://inventory-api:8080/inventory/; }
    location /versions/orders { proxy_pass http://orders-api:8080/version; }
    location /versions/inventory { proxy_pass http://inventory-api:8080/version; }
  }
}
